he evacuation system\nA car that starts is not automatically evacuation-ready. Track fuel or charge, tyre condition, coolant/fluids where applicable, lights, spare/repair equipment, seasonal needs and whether every required person, child restraint, mobility device and animal carrier can actually fit.\n\n## Protect range\nSet a minimum fuel/charge threshold before an incident. During a threat, avoid unnecessary idling and trips that consume the reserve needed to leave. Route planning must include congestion, detours and the possibility that the closest fuel/charging point has no power or supply. Electric vehicles need the same discipline: a nominal range estimate is not a guarantee under heat, cold, traffic, elevation or heavy load.\n\n## Load in priority order\nFirst load people-specific life-safety items: medicines, mobility/communication equipment, identification and essential animal equipment. Next load water, compact food, communications, lighting and weather protection. Bulky replaceable belongings should not displace safety equipment or obstruct visibility and exits. Secure heavy objects so a sudden stop does not turn them into projectiles.\n\n## Two-minute departure check\nAccount for every person and animal; confirm keys, destination, primary/alternate route, fuel/charge, phones/radio and one contact outside the immediate area. Record which vehicle is carrying critical medicines or equipment if a group uses multiple cars. Keep vehicles together only when safe; rigid convoy behaviour can create delays at closures.\n\n## If the vehicle fails\nHave a transfer plan: another household vehicle, neighbour/mutual-aid contact, accessible transport, taxi/public transport if authorities say it is operating, or an emergency-service notification for someone who cannot self-evacuate. A plan that assumes the only car never fails has one obvious point of failure.\n\n## Source anchors\n- Ready.gov: evacuation planning.\n- Vehicle manufacturer maintenance and load guidance.\n- Local Civil Protection traffic/evacuation instructions."},"el":{"title":"Όχημα εκκένωσης: εμβέλεια, φόρτωση και ετοιμότητα αναχώρησης","body":"## Το όχημα είναι μέρος του συστήματος εκκένωσης\nΈνα αυτοκίνητο που παίρνει μπροστά δεν είναι αυτόματα έτοιμο για εκκένωση. Παρακολούθησε καύσιμο ή φόρτιση, κατάσταση ελαστικών, υγρά όπου εφαρμόζεται, φώτα, εξοπλισμό επισκευής, εποχικές ανάγκες και αν χωρούν πράγματι όλοι οι άνθρωποι, τα παιδικά καθίσματα, ο εξοπλισμός κινητικότητας και τα κλουβιά ζώων.\n\n## Προστάτεψε την εμβέλεια\nΌρισε ελάχιστο απόθεμα καυσίμου ή φόρτισης πριν υπάρξει συμβάν. Όταν εμφανιστεί απειλή, απόφυγε περιττές διαδρομές και παρατεταμένη λειτουργία που καταναλώνουν το απόθεμα αναχώρησης. Ο σχεδιασμός πρέπει να υπολογίζει συμφόρηση, παρακάμψεις και πιθανότητα ο κοντινότερος σταθμός καυσίμου ή φόρτισης να μην έχει ρεύμα ή απόθεμα. Το ίδιο ισχύει και για ηλεκτρικό όχημα: η ονομαστική εμβέλεια δεν είναι εγγύηση σε ζέστη, κρύο, ανηφόρες, κυκλοφορία ή βαρύ φορτίο.\n\n## Φόρτωσε κατά σειρά προτεραιότητας\nΠρώτα μπουν τα αντικείμενα που συνδέονται άμεσα με ανθρώπους: φάρμακα, εξοπλισμός κινητικότητας/επικοινωνίας, ταυτοποίηση και βασικός εξοπλισμός ζώων. Μετά νερό, συμπαγής τροφή, επικοινωνίες, φωτισμός και προστασία από τον καιρό. Ογκώδη αντικαταστάσιμα πράγματα δεν πρέπει να εκτοπίζουν τον εξοπλισμό ασφαλείας ή να κλείνουν ορατότητα και εξόδους. Στερέωσε τα βαριά αντικείμενα ώστε να μην εκτοξευθούν σε απότομο φρενάρισμα.\n\n## Έλεγχος δύο λεπτών πριν φύγεις\nΚαταμέτρησε κάθε άνθρωπο και ζώο· επιβεβαίωσε κλειδιά, προορισμό, κύρια και εναλλακτική διαδρομή, καύσιμο/φόρτιση, τηλέφωνα ή ραδιόφωνο και μία επαφή εκτός της άμεσης περιοχής. Αν η ομάδα χρησιμοποιεί πολλά οχήματα, σημείωσε ποιο μεταφέρει κρίσιμα φάρμακα ή εξοπλισμό. Μην επιμένεις να κινείται άκαμπτα η ομάδα σαν κομβόι αν αυτό δημιουργεί καθυστέρηση σε αποκλεισμούς.\n\n## Αν χαλάσει το όχημα\nΧρειάζεται σχέδιο μεταφοράς: δεύτερο όχημα, γείτονας ή ομάδα αλληλοβοήθειας, προσβάσιμη μεταφορά, δημόσια/μισθωμένη μετακίνηση αν λειτουργεί ή ενημέρωση υπηρεσιών για άτομο που δεν μπορεί να αυτοεκκενωθεί. Ένα σχέδιο που προϋποθέτει ότι το μοναδικό αυτοκίνητο δεν θα χαλάσει έχει εμφανές μοναδικό σημείο αστοχίας.\n\n## Πηγές αναφοράς\n- Ready.gov: σχεδιασμός εκκένωσης.\n- Οδηγίες συντήρησης και φορτίου του κατασκευαστή οχήματος.\n- Τοπικές οδηγίες κυκλοφορίας και εκκένωσης της Πολιτικής Προστασίας."}},{"id":35,"en":{"title":"Emergency communications: 112, concise messages, and fallback channels","body":"## Emergency calling is for immediate danger\nIn Greece and throughout the European Union, 112 can be used free of charge when a person is in danger and needs immediate assistance. A useful emergency call or message starts with location, what has happened, how many people are affected, immediate hazards, and any critical access or medical constraint. Do not bury the location under a long story.\n\n## Separate emergency traffic from family traffic\nCalling emergency services and telling relatives you are safe are different tasks. Designate one out-of-area contact for household status so every person does not repeatedly call every other person. Prefer concise text messages when networks are congested and a voice conversation is not necessary, while recognizing that delivery can still be delayed or fail.\n\n## Build channel redundancy\nRecord at least three channels appropriate to the household: mobile voice/text, an internet-based method when data works, radio where legally and practically available, and physical meeting points. A communications plan is not resilient if every method depends on the same phone, same power bank and same cellular network.\n\n## Message format\nUse a repeatable structure: `WHO – WHERE – STATUS – NEED – NEXT CHECK`. Example: “Loukas + 2, municipal shelter north entrance, all uninjured, need no assistance, next update 22:00.” For a distress message, replace the final elements with the specific urgent need and hazard. Avoid speculative casualty numbers or unverified road closures.\n\n## 112 outbound alerts\nEmergency authorities may also send location-relevant 112 alerts with protective instructions. Read the entire message, note the affected area and action, and follow the current instruction rather than forwarding a screenshot without context. If the household changes location, reassess which alert area now applies.\n\n## Source anchors\n- Greek Ministry for Climate Crisis and Civil Protection: 112 service.\n- Local emergency-service instructions.\n- Offline Survival Project communications schedule and check-in tools."},"el":{"title":"Επικοινωνίες έκτακτης ανάγκης: 112, σύντομα μηνύματα και εναλλακτικά κανάλια","body":"## Οι κλήσεις έκτακτης ανάγκης αφορούν άμεσο κίνδυνο\nΣτην Ελλάδα και σε όλη την Ευρωπαϊκή Ένωση, το 112 μπορεί να χρησιμοποιηθεί δωρεάν όταν κάποιος βρίσκεται σε κίνδυνο και χρειάζεται άμεση βοήθεια. Μια χρήσιμη κλήση ή επικοινωνία ξεκινά με θέση, τι συνέβη, πόσα άτομα επηρεάζονται, ποιοι άμεσοι κίνδυνοι υπάρχουν και ποιος περιορισμός πρόσβασης ή υγείας είναι κρίσιμος. Μην κρύβεις την τοποθεσία μέσα σε μακρά αφήγηση.\n\n## Ξεχώρισε την επείγουσα επικοινωνία από την οικογενειακή ενημέρωση\nΗ κλήση στις υπηρεσίες και η ενημέρωση συγγενών ότι είσαι ασφαλής είναι διαφορετικές εργασίες. Όρισε μία επαφή εκτός της άμεσης περιοχής για την κατάσταση του νοικοκυριού ώστε να μην καλεί κάθε άνθρωπος όλους τους άλλους. Όταν τα δίκτυα είναι επιβαρυμένα και δεν χρειάζεται συνομιλία, ένα σύντομο γραπτό μήνυμα μπορεί να είναι πιο πρακτικό, αλλά και αυτό μπορεί να καθυστερήσει ή να αποτύχει.\n\n## Δημιούργησε εφεδρεία καναλιών\nΚατέγραψε τουλάχιστον τρεις κατάλληλους τρόπους: φωνή/μήνυμα κινητής, μέθοδο μέσω δεδομένων όταν υπάρχει σύνδεση, ραδιοεπικοινωνία όπου επιτρέπεται και είναι πρακτική, και φυσικά σημεία συνάντησης. Το σχέδιο δεν έχει πραγματική εφεδρεία όταν κάθε τρόπος εξαρτάται από το ίδιο τηλέφωνο, την ίδια μπαταρία και το ίδιο δίκτυο.\n\n## Μορφή μηνύματος\nΧρησιμοποίησε σταθερή σειρά: `ΠΟΙΟΣ – ΠΟΥ – ΚΑΤΑΣΤΑΣΗ – ΑΝΑΓΚΗ – ΕΠΟΜΕΝΟΣ ΕΛΕΓΧΟΣ`. Παράδειγμα: «Λουκάς + 2, βόρεια είσοδος δημοτικού καταφυγίου, όλοι χωρίς τραυματισμό, δεν χρειαζόμαστε βοήθεια, νέα ενημέρωση 22:00». Σε μήνυμα κινδύνου βάλε τη συγκεκριμένη επείγουσα ανάγκη και τον κίνδυνο. Απόφυγε ανεπιβεβαίωτους αριθμούς θυμάτων ή φήμες για κλειστούς δρόμους.\n\n## Εξερχόμενες ειδοποιήσεις 112\nΟι αρχές μπορούν επίσης να αποστέλλουν ειδοποιήσεις 112 με οδηγίες προστασίας για συγκεκριμένη περιοχή. Διάβασε ολόκληρο το μήνυμα, εντόπισε ποια περιοχή και ποια ενέργεια αφορά και ακολούθησε την τρέχουσα οδηγία αντί να προωθείς στιγμιότυπο χωρίς πλαίσιο. Αν το νοικοκυριό αλλάξει θέση, επανεκτίμησε ποια ζώνη ειδοποίησης το αφορά.\n\n## Πηγές αναφοράς\n- Υπουργείο Κλιματικής Κρίσης και Πολιτικής Προστασίας: υπηρεσία 112.\n- Οδηγίες τοπικών υπηρεσιών έκτακτης ανάγκης.\n- Εργαλεία προγράμματος επικοινωνιών και ελέγχων του Offline Survival Project."}},{"id":36,"en":{"title":"Information verification during disasters: separating signal from rumor","body":"## Treat information as an operational resource\nBad information can cause unnecessary evacuation, unsafe travel, panic buying or delayed protective action. Record each important claim with a source and timestamp instead of allowing it to become “everyone says.” A screenshot without origin or time is not the same as a current official instruction.\n\n## Source hierarchy\nFor immediate protective actions, prefer the authority responsible for that hazard and location: civil protection/emergency service, fire service, police, water utility, electricity operator, municipality, meteorological service or public-health agency. News reporting can provide context, but it should not override a newer official evacuation order or boil-water notice.\n\n## Verify before amplifying\nBefore forwarding a claim, ask: who issued it, when, for which geographic area, and is there a second reliable confirmation? Old images and messages frequently reappear during new incidents. Check dates, landmarks and whether the message names a zone that actually includes your location.\n\n## Maintain an incident information log\nWrite only the facts that change decisions: “112 alert 18:42—evacuate Zone A toward north,” “utility notice 19:05—water not for drinking,” “municipality 20:10—shelter full.” Keep speculation in a separate note if it must be recorded. The next household shift should be able to see why a decision was made without reconstructing social-media history.\n\n## When networks fail\nPreselect local radio frequencies, physical notice locations, municipal meeting points and trusted neighbours. If a message comes through a messenger, ask the sender whether they saw the original source or are repeating someone else. Offline resilience includes a way to update knowledge without the internet, not merely storing old web pages.\n\n## Source anchors\n- Greek Civil Protection: official self-protection and 112 alerts.\n- Ready.gov: emergency alerts and warnings.\n- Local utility and meteorological services."},"el":{"title":"Επαλήθευση πληροφοριών σε καταστροφή: διαχωρισμός σήματος από φήμη","body":"## Η πληροφορία είναι επιχειρησιακός πόρος\nΛάθος πληροφορία μπορεί να προκαλέσει περιττή εκκένωση, επικίνδυνη μετακίνηση, πανικό στις αγορές ή καθυστέρηση προστατευτικής ενέργειας. Κατέγραψε κάθε σημαντικό ισχυρισμό μαζί με πηγή και ώρα αντί να μετατρέπεται σε «το λένε όλοι». Ένα στιγμιότυπο χωρίς αρχική πηγή ή ημερομηνία δεν είναι ισοδύναμο με τρέχουσα επίσημη οδηγία.\n\n## Ιεραρχία πηγών\nΓια άμεσες ενέργειες προστασίας, προτίμησε την αρχή που είναι υπεύθυνη για τον συγκεκριμένο κίνδυνο και τόπο: Πολιτική Προστασία ή υπηρεσία έκτακτης ανάγκης, Πυροσβεστική, Αστυνομία, ύδρευση, διαχειριστή ηλεκτρικού δικτύου, δήμο, μετεωρολογική υπηρεσία ή δημόσια υγεία. Η δημοσιογραφία δίνει χρήσιμο πλαίσιο, αλλά δεν πρέπει να ακυρώνει νεότερη επίσημη εντολή εκκένωσης ή απαγόρευση χρήσης νερού.\n\n## Επιβεβαίωσε πριν αναμεταδώσεις\nΠριν προωθήσεις έναν ισχυρισμό, ρώτησε: ποιος τον εξέδωσε, πότε, για ποια γεωγραφική περιοχή και υπάρχει δεύτερη αξιόπιστη επιβεβαίωση; Παλιές εικόνες και μηνύματα επανεμφανίζονται συχνά σε νέα συμβάντα. Έλεγξε ημερομηνίες, σημεία αναφοράς και αν η αναφερόμενη ζώνη περιλαμβάνει πράγματι τη θέση σου.\n\n## Τήρησε ημερολόγιο επιχειρησιακής πληροφορίας\nΓράψε μόνο γεγονότα που αλλάζουν απόφαση: «112 στις 18:42—εκκένωση Ζώνης Α προς βορρά», «ύδρευση 19:05—νερό όχι για πόση», «δήμος 20:10—το καταφύγιο γέμισε». Κράτα εικασίες σε χωριστή σημείωση αν πρέπει να καταγραφούν. Η επόμενη βάρδια πρέπει να καταλαβαίνει γιατί πάρθηκε μια απόφαση χωρίς να ξαναδιαβάσει ολόκληρο ιστορικό κοινωνικών δικτύων.\n\n## Όταν αποτύχουν τα δίκτυα\nΠροεπίλεξε τοπικές ραδιοφωνικές συχνότητες, φυσικά σημεία ανακοινώσεων, δημοτικά σημεία συγκέντρωσης και έμπιστους γείτονες. Αν ένα μήνυμα φτάσει μέσω τρίτου, ρώτησε αν είδε την αρχική πηγή ή αν επαναλαμβάνει κάποιον άλλο. Ανθεκτικότητα χωρίς διαδίκτυο σημαίνει και δυνατότητα ενημέρωσης της γνώσης, όχι μόνο αποθήκευση παλιών ιστοσελίδων.\n\n## Πηγές αναφοράς\n- Ελληνική Πολιτική Προστασία: επίσημες οδηγίες αυτοπροστασίας και ειδοποιήσεις 112.\n- Ready.gov: ειδοποιήσεις και προειδοποιήσεις έκτακτης ανάγκης.\n- Τοπικοί πάροχοι δικτύων και μετεωρολογικές υπηρεσίες."}},{"id":37,"en":{"title":"Accessibility continuity: evacuation that works for the actual person","body":"## Build around functional needs, not labels\nTwo people with the same diagnosis can require very different emergency support. Record the specific function that must continue: walking, transferring, seeing, hearing, communicating, understanding instructions, regulating sensory input, powering equipment, refrigerating medicine, using the toilet, eating a particular texture, or being accompanied by a support person.\n\n## Duplicate the critical pathway\nIf one caregiver, lift, charger, wheelchair battery, hearing-aid supply or communication device is the only way a person can evacuate, the plan has a single point of failure. Identify a backup person and, where possible, a backup method. Store model/serial information and concise operating notes for equipment that another helper may need to use.\n\n## Make alerts accessible\nA siren alone may not work for someone who is deaf; a text alert alone may not work for someone who cannot see or read it; a complex message may not work for someone under cognitive stress. Pair channels: sound, vibration, visual cue and direct human check. During a real incident, confirm understanding rather than assuming message delivery equals comprehension.\n\n## Transport and shelter compatibility\nPre-identify whether the evacuation vehicle can load the mobility device and whether the destination has the required access, power, toilet, refrigeration, quiet space or support. “Shelter available” is not enough if the person cannot enter or safely remain there. Carry a compact personal support card that states communication method, assistance needed, essential equipment and emergency contact.\n\n## Protect autonomy\nAsk the person how they want assistance provided and include them in drills. Do not separate a person from mobility, communication or service-animal support without a safety reason. During handover, describe functional needs accurately rather than reducing the person to a diagnosis.\n\n## Source anchors\n- Ready.gov: preparedness for people with disabilities.\n- Local accessible-evacuation and shelter guidance.\n- Individual clinician/equipment-provider instructions where applicable."},"el":{"title":"Συνέχεια προσβασιμότητας: εκκένωση που λειτουργεί για τον πραγματικό άνθρωπο","body":"## Σχεδίασε με βάση τη λειτουργική ανάγκη, όχι την ετικέτα\nΔύο άνθρωποι με την ίδια διάγνωση μπορεί να χρειάζονται εντελώς διαφορετική υποστήριξη. Κατέγραψε τη λειτουργία που πρέπει να συνεχιστεί: βάδισμα, μεταφορά από κάθισμα, όραση, ακοή, επικοινωνία, κατανόηση οδηγιών, αισθητηριακή ρύθμιση, τροφοδοσία εξοπλισμού, ψύξη φαρμάκου, χρήση τουαλέτας, συγκεκριμένη υφή τροφής ή παρουσία συνοδού.\n\n## Διπλασίασε την κρίσιμη διαδρομή\nΑν ένας μόνο φροντιστής, ανελκυστήρας, φορτιστής, μπαταρία αμαξιδίου, αναλώσιμο ακουστικού ή συσκευή επικοινωνίας είναι ο μοναδικός τρόπος εκκένωσης, υπάρχει μοναδικό σημείο αστοχίας. Όρισε δεύτερο άτομο και, όπου γίνεται, δεύτερη μέθοδο. Κράτα μοντέλο, σειριακό αριθμό και σύντομες οδηγίες για εξοπλισμό που μπορεί να χρειαστεί να χειριστεί άλλος άνθρωπος.\n\n## Κάνε τις ειδοποιήσεις προσβάσιμες\nΜια σειρήνα δεν αρκεί για κάποιον που δεν ακούει· ένα γραπτό μήνυμα δεν αρκεί για κάποιον που δεν βλέπει ή δεν μπορεί να το διαβάσει· μια περίπλοκη οδηγία μπορεί να μην λειτουργήσει υπό γνωστικό στρες. Συνδύασε ήχο, δόνηση, οπτική ένδειξη και άμεσο ανθρώπινο έλεγχο. Σε πραγματικό συμβάν επιβεβαίωσε κατανόηση· η παράδοση του μηνύματος δεν σημαίνει ότι έγινε κατανοητό.\n\n## Συμβατότητα μεταφοράς και καταφυγίου\nΈλεγξε πριν το συμβάν αν το όχημα χωρά τον εξοπλισμό κινητικότητας και αν ο προορισμός παρέχει αναγκαία πρόσβαση, ρεύμα, τουαλέτα, ψύξη, ήσυχο χώρο ή υποστήριξη. Η φράση «υπάρχει καταφύγιο» δεν αρκεί αν το άτομο δεν μπορεί να μπει ή να παραμείνει με ασφάλεια. Μετέφερε μικρή κάρτα που δηλώνει τρόπο επικοινωνίας, βοήθεια που απαιτείται, βασικό εξοπλισμό και επαφή έκτακτης ανάγκης.\n\n## Προστάτεψε την αυτονομία\nΡώτησε το ίδιο το άτομο πώς θέλει να παρέχεται βοήθεια και συμπερίλαβέ το στις ασκήσεις. Μην το χωρίζεις από κινητικότητα, επικοινωνία ή ζώο υπηρεσίας χωρίς λόγο ασφάλειας. Στην παράδοση πληροφοριών περιέγραψε με ακρίβεια λειτουργικές ανάγκες αντί να περιορίζεις τον άνθρωπο σε μια διάγνωση.\n\n## Πηγές αναφοράς\n- Ready.gov: προετοιμασία ατόμων με αναπηρία.\n- Τοπικές οδηγίες προσβάσιμης εκκένωσης και καταφυγίων.\n- Οδηγίες προσωπικού επαγγελματία υγείας ή παρόχου εξοπλισμού όπου χρειάζεται."}},{"id":38,"en":{"title":"Children and older adults: continuity when routines disappear","body":"## Routine is a safety tool\nDisasters disrupt sleep, meals, medication timing, orientation, school, caregivers and familiar places. For children and older adults, preserving a few predictable anchors—who is responsible, where the next meal comes from, when medicine is due, where the toilet is, when the next update happens—can reduce confusion and missed care.\n\n## Child-specific preparation\nKeep age-appropriate identification, caregiver contacts, medications, feeding supplies, hygiene items, comfort object and any required restraint/car seat ready for evacuation. Make reunification plans explicit: which adults are authorized to collect the child and what happens if the primary school/day-care route is closed. Teach simple actions appropriate to the child’s age without making the child responsible for adult emergency decisions.\n\n## Older-adult continuity\nRecord hearing/vision aids, mobility devices, medication schedule, cognitive/orientation needs, dietary restrictions and the names of people who can assist. Keep spare batteries or charging methods for essential aids. If a person is at risk of wandering or becoming disoriented, the plan should include supervision and identification rather than relying on verbal instructions alone.\n\n## Heat, cold, and dehydration\nVulnerability can increase during temperature extremes and water interruption. Assign an adult to conduct direct checks at defined intervals. “They have not called us” is not a check. Watch for changes from the person’s normal behaviour, intake, mobility or alertness and seek medical guidance when concerning changes appear.\n\n## Psychological aftermath\nGive accurate, age-appropriate information and avoid repeatedly exposing children or cognitively vulnerable adults to distressing rumor streams. Restore ordinary routines as conditions allow. Persistent severe distress, functional decline or inability to provide required care is a reason to seek professional support.\n\n## Source anchors\n- Ready.gov: family emergency planning.\n- CDC/public-health guidance for heat, cold and emergency continuity.\n- Individual care plans and clinician instructions."},"el":{"title":"Παιδιά και ηλικιωμένοι: συνέχεια όταν εξαφανίζεται η καθημερινή ρουτίνα","body":"## Η ρουτίνα είναι εργαλείο ασφάλειας\nΜια καταστροφή διακόπτει ύπνο, γεύματα, ώρες φαρμάκων, προσανατολισμό, σχολείο, φροντιστές και γνωστούς χώρους. Για παιδιά και ηλικιωμένους, λίγες προβλέψιμες σταθερές—ποιος είναι υπεύθυνος, πότε είναι το επόμενο γεύμα, πότε δίνεται το φάρμακο, πού είναι η τουαλέτα, πότε θα υπάρξει νέα ενημέρωση—μπορούν να μειώσουν σύγχυση και παραλείψεις φροντίδας.\n\n## Προετοιμασία για παιδί\nΚράτα κατάλληλη ταυτοποίηση, επαφές φροντιστών, φάρμακα, εφόδια σίτισης, είδη υγιεινής, ένα αντικείμενο άνεσης και το απαιτούμενο παιδικό κάθισμα έτοιμα για εκκένωση. Κάνε σαφές το σχέδιο επανένωσης: ποιοι ενήλικες έχουν δικαίωμα να παραλάβουν το παιδί και τι γίνεται αν η κύρια διαδρομή προς σχολείο ή δομή κλείσει. Δίδαξε απλές ενέργειες κατάλληλες για την ηλικία χωρίς να μεταφέρεις στο παιδί τις αποφάσεις των ενηλίκων.\n\n## Συνέχεια για ηλικιωμένο\nΚατέγραψε ακουστικά/οπτικά βοηθήματα, μέσα κινητικότητας, πρόγραμμα φαρμάκων, ανάγκες προσανατολισμού, διατροφή και ποιοι μπορούν να βοηθήσουν. Κράτα εφεδρικές μπαταρίες ή τρόπο φόρτισης για κρίσιμα βοηθήματα. Αν υπάρχει κίνδυνος περιπλάνησης ή αποπροσανατολισμού, το σχέδιο χρειάζεται επίβλεψη και ταυτοποίηση αντί να βασίζεται μόνο σε προφορικές οδηγίες.\n\n## Ζέστη, κρύο και αφυδάτωση\nΗ ευπάθεια μπορεί να αυξηθεί σε ακραίες θερμοκρασίες και διακοπή νερού. Ανάθεσε σε συγκεκριμένο ενήλικα άμεσο έλεγχο σε προκαθορισμένα διαστήματα. Το «δεν μας τηλεφώνησαν» δεν είναι έλεγχος. Πρόσεξε αλλαγές σε συμπεριφορά, πρόσληψη υγρών/τροφής, κινητικότητα ή εγρήγορση και ζήτησε ιατρική καθοδήγηση όταν εμφανίζονται ανησυχητικές μεταβολές.\n\n## Ψυχολογική συνέχεια\nΔώσε ακριβείς πληροφορίες κατάλληλες για την ηλικία και απόφυγε συνεχή έκθεση παιδιών ή γνωστικά ευάλωτων ανθρώπων σε τρομακτικές φήμες. Επανέφερε καθημερινές ρουτίνες όταν το επιτρέπουν οι συνθήκες. Επίμονη σοβαρή δυσφορία, λειτουργική επιδείνωση ή αδυναμία παροχής της απαιτούμενης φροντίδας είναι λόγος για επαγγελματική υποστήριξη.\n\n## Πηγές αναφοράς\n- Ready.gov: οικογενειακός σχεδιασμός έκτακτης ανάγκης.\n- Οδηγίες δημόσιας υγείας για ζέστη, κρύο και συνέχεια φροντίδας.\n- Ατομικά σχέδια φροντίδας και οδηγίες επαγγελματιών υγείας."}},{"id":39,"en":{"title":"Animals in emergencies: pets, service animals, and small livestock","body":"## If animals cannot go, the evacuation plan is incomplete\nPre-identify transport for every animal: carrier, crate, harness, lead, vehicle space and a destination that will accept the species. Keep identification, veterinary/medication information, recent photo, food, water, sanitation supplies and handling equipment together. Practice loading before an alarm; a frightened animal may behave very differently.\n\n## Service animals are functional equipment and partners\nPlan for the animal’s food, water, relief and veterinary needs while maintaining the handler’s access to the animal wherever legally and safely possible. Do not treat a service animal as ordinary luggage or separate it merely for convenience. Carry a backup method for a critical task when feasible because the animal can also become injured or stressed.\n\n## Containment after structural damage\nEarthquakes, fire and storms can break fences, doors and windows. Before releasing an animal into a familiar yard, inspect for glass, ash, contaminated water, downed wires, sharp metal and escape gaps. Keep animals away from floodwater and wildfire ash according to veterinary/public-health guidance.\n\n## Small livestock\nKnow which animals can be moved, which shelter-in-place structure is available and how water/feed will be supplied if roads close. Do not begin an improvised large-animal evacuation after fire or flood has already cut the route. Coordinate with local veterinary, agricultural and civil-protection advice where relevant.\n\n## Recordkeeping\nThe Dependents module can store species, equipment, responsible person, backup caregiver and essential supplies. Add microchip/registration information only if you are comfortable keeping it locally. During an evacuation, record which vehicle and destination has each animal so separation does not become an accountability problem.\n\n## Source anchors\n- Ready.gov: pets in emergencies.\n- Local veterinary and animal-welfare emergency guidance.\n- Service-animal access rules applicable to the jurisdiction."},"el":{"title":"Ζώα σε έκτακτη ανάγκη: κατοικίδια, ζώα υπηρεσίας και μικρή κτηνοτροφία","body":"## Αν το ζώο δεν μπορεί να φύγει, το σχέδιο εκκένωσης είναι ελλιπές\nΠροκαθόρισε μεταφορά για κάθε ζώο: κλουβί, σαμαράκι, λουρί, χώρο στο όχημα και προορισμό που δέχεται το συγκεκριμένο είδος. Κράτα μαζί στοιχεία ταυτοποίησης, κτηνιατρικές/φαρμακευτικές πληροφορίες, πρόσφατη φωτογραφία, τροφή, νερό, είδη καθαρισμού και εξοπλισμό χειρισμού. Κάνε δοκιμή φόρτωσης πριν υπάρξει συναγερμός· ένα φοβισμένο ζώο μπορεί να συμπεριφερθεί πολύ διαφορετικά.\n\n## Το ζώο υπηρεσίας είναι συνεργάτης και λειτουργική υποστήριξη\nΣχεδίασε τροφή, νερό, ανάγκες ανακούφισης και κτηνιατρική συνέχεια διατηρώντας την πρόσβαση του χειριστή στο ζώο όπου αυτό είναι νόμιμο και ασφαλές. Μην αντιμετωπίζεις ζώο υπηρεσίας σαν απλή αποσκευή και μην το αποχωρίζεις για ευκολία. Όπου είναι δυνατό, κράτησε εφεδρικό τρόπο για κρίσιμη λειτουργία επειδή και το ζώο μπορεί να τραυματιστεί ή να στρεσαριστεί.\n\n## Περιορισμός μετά από δομική βλάβη\nΣεισμός, πυρκαγιά ή καταιγίδα μπορεί να σπάσει φράχτες, πόρτες και παράθυρα. Πριν αφήσεις ζώο σε οικείο προαύλιο, έλεγξε γυαλιά, στάχτη, μολυσμένο νερό, πεσμένα καλώδια, κοφτερά μέταλλα και ανοίγματα διαφυγής. Κράτα τα ζώα μακριά από πλημμυρικά νερά και στάχτη σύμφωνα με κτηνιατρικές και υγειονομικές οδηγίες.\n\n## Μικρή κτηνοτροφία\nΓνώριζε ποια ζώα μπορούν να μεταφερθούν, ποια δομή παραμονής υπάρχει και πώς θα εξασφαλιστούν νερό και τροφή αν κλείσουν δρόμοι. Μην ξεκινάς αυτοσχέδια μεταφορά μεγάλων ζώων όταν η φωτιά ή η πλημμύρα έχει ήδη κόψει τη διαδρομή. Συντονίσου με τοπικές κτηνιατρικές, αγροτικές και πολιτικής προστασίας οδηγίες.\n\n## Καταγραφή\nΗ ενότητα Εξαρτώμενων Ατόμων και Ζώων μπορεί να αποθηκεύει είδος, εξοπλισμό, υπεύθυνο, εφεδρικό φροντιστή και κρίσιμα εφόδια. Πρόσθεσε στοιχεία ηλεκτρονικής σήμανσης μόνο αν αποδέχεσαι την τοπική αποθήκευσή τους. Κατά την εκκένωση σημείωσε σε ποιο όχημα και προορισμό βρίσκεται κάθε ζώο ώστε ο χωρισμός να μην εξελιχθεί σε πρόβλημα καταμέτρησης.\n\n## Πηγές αναφοράς\n- Ready.gov: κατοικίδια σε έκτακτες ανάγκες.\n- Τοπικές κτηνιατρικές και φιλοζωικές οδηγίες.\n- Κανόνες πρόσβασης ζώων υπηρεσίας που ισχύουν στη συγκεκριμένη δικαιοδοσία."}},{"id":40,"en":{"title":"Recovery evidence: turning damage into a traceable claim and repair record","body":"## Safety comes before documentation\nDo not remain in a hazardous building to obtain photographs. Once the area is safe enough to access, capture wide views, then individual damaged items, model/serial labels, water/fire lines and temporary protective work. A short narrated video can preserve context, but still photographs are easier to index and compare.\n\n## Build a chronology\nRecord the event date/time, evacuation, return authorization, utility outages, first observed damage, emergency repairs and major contacts. Keep reference numbers from insurers, utilities, municipality, state-relief offices, contractors and police/fire reports when applicable. A good chronology reduces contradictory retelling weeks later.\n\n## Separate three money categories\nTrack immediate survival costs, loss/damage costs, and repair/recovery costs. Store currency for every entry rather than combining unlike amounts into one false total. Keep receipts or photographs of receipts, but do not delay urgent protective work solely to perfect paperwork.\n\n## Preserve evidence without preserving hazards\nBefore disposing of spoiled food, soaked furniture or fire-damaged material, check the insurer/public-relief documentation requirement when time and safety permit. Photographs, inventories and written confirmation can sometimes substitute for physical retention. Never keep contaminated or structurally dangerous debris inside living space only because it might support a claim.\n\n## Fraud and contractor pressure\nAfter disasters, verify identity, licence/registration where relevant, written scope, payment schedule and whether a contractor is authorized to perform the work. Be cautious about pressure for large immediate cash payments or signatures that assign rights you do not understand. Store agreements and change orders with the recovery log.\n\n## Source anchors\n- National/local natural-disaster relief authorities.\n- Insurer-specific claim instructions.\n- Consumer-protection guidance for post-disaster repairs."},"el":{"title":"Τεκμηρίωση αποκατάστασης: από τη ζημιά σε ιχνηλάσιμη απαίτηση και επισκευή","body":"## Η ασφάλεια προηγείται της τεκμηρίωσης\nΜην παραμένεις σε επικίνδυνο κτίριο για να βγάλεις φωτογραφίες. Μόλις ο χώρος είναι αρκετά ασφαλής, φωτογράφισε πρώτα γενικά πλάνα και μετά κάθε βλάβη, πινακίδες μοντέλου/σειριακού αριθμού, γραμμές νερού ή καπνού και προσωρινά μέτρα προστασίας. Ένα σύντομο βίντεο με περιγραφή μπορεί να διατηρήσει το πλαίσιο, ενώ οι φωτογραφίες ταξινομούνται ευκολότερα.\n\n## Δημιούργησε χρονολόγιο\nΚατέγραψε ώρα και ημερομηνία συμβάντος, εκκένωση, άδεια επιστροφής, διακοπές δικτύων, πρώτη παρατήρηση ζημιάς, επείγουσες επισκευές και σημαντικές επαφές. Κράτα αριθμούς υπόθεσης από ασφαλιστική, παρόχους, δήμο, κρατική αρωγή, τεχνικούς και αναφορές Αστυνομίας/Πυροσβεστικής όπου υπάρχουν. Ένα σωστό χρονολόγιο μειώνει αντιφατικές αφηγήσεις μετά από εβδομάδες.\n\n## Χώρισε τα χρήματα σε τρεις κατηγορίες\nΠαρακολούθησε χωριστά άμεσες δαπάνες επιβίωσης, αξία απώλειας/ζημιάς και κόστος επισκευής/αποκατάστασης. Κατέγραψε νόμισμα σε κάθε εγγραφή ώστε να μην δημιουργείται ψευδές συνολικό ποσό από διαφορετικά νομίσματα. Κράτα αποδείξεις ή φωτογραφίες τους, αλλά μην καθυστερείς επείγουσα εργασία προστασίας μόνο για τέλεια γραφειοκρατία.\n\n## Διατήρησε αποδείξεις χωρίς να διατηρείς κινδύνους\nΠριν πετάξεις αλλοιωμένα τρόφιμα, βρεγμένα έπιπλα ή καμένα υλικά, έλεγξε τι τεκμηρίωση ζητά ασφαλιστική ή πρόγραμμα αρωγής όταν το επιτρέπουν χρόνος και ασφάλεια. Φωτογραφίες, απογραφή και γραπτή επιβεβαίωση μπορούν μερικές φορές να αντικαταστήσουν τη φυσική διατήρηση. Μην κρατάς μολυσμένα ή δομικά επικίνδυνα συντρίμμια στον χώρο διαβίωσης μόνο επειδή μπορεί να χρησιμεύσουν σε απαίτηση.\n\n## Πίεση και απάτη μετά την καταστροφή\nΈλεγξε ταυτότητα τεχνικού, άδεια ή εγγραφή όπου απαιτείται, γραπτό αντικείμενο εργασιών, πρόγραμμα πληρωμών και δικαίωμα εκτέλεσης. Να είσαι επιφυλακτικός απέναντι σε πίεση για μεγάλο άμεσο ποσό σε μετρητά ή υπογραφές που μεταβιβάζουν δικαιώματα που δεν κατανοείς. Αποθήκευσε συμφωνίες και αλλαγές μαζί με το ημερολόγιο αποκατάστασης.\n\n## Πηγές αναφοράς\n- Εθνικές και τοπικές υπηρεσίες κρατικής αρωγής φυσικών καταστροφών.\n- Ειδικές οδηγίες απαιτήσεων της ασφαλιστικής.\n- Οδηγίες προστασίας καταναλωτή για επισκευές μετά από καταστροφή."}},{"id":41,"en":{"title":"Greece: household readiness for wildfire season","body":"## Start before the high-risk day\nGreek wildfire preparedness begins with the area around the property, access for responders, reliable contact details and awareness of daily restrictions or risk conditions. Follow the current Ministry for Climate Crisis and Civil Protection, Fire Service and municipal instructions for vegetation management, prohibited activities and local prevention measures; requirements can change by season and location.\n\n## Address and access\nMake sure every household member can describe the property location clearly, including settlement, road, nearby landmark and any access complication. Rural homes should consider whether a fire engine can pass the gate/road and whether parked vehicles, branches or stored material obstruct the route. Keep house numbers or location markings visible where practical.\n\n## Evacuation destinations in two directions\nMany Greek settlements have limited road networks. Choose at least two destinations that do not depend on the same narrow road or forest corridor. An island or mountainous community may have a port or main highway that is itself affected by smoke, fire or congestion. Record a nearby local refuge option as well as a farther relocation option, following official directions during the event.\n\n## Heat and smoke together\nWildfire evacuation often occurs during extreme heat. Add drinking water, hats/light clothing, prescribed respiratory medicines and support for older adults to the vehicle plan. A person with respiratory disease may need to leave smoke earlier even before the fire front threatens the property; discuss individual thresholds with their clinician.\n\n## 112 discipline\nKeep emergency alerts enabled and read the entire 112 instruction. An alert can specify a geographic area, direction of movement or protective action. Do not treat a social-media map as more authoritative than a newer official message. If instructed to evacuate, act promptly rather than waiting for visual confirmation of flames.\n\n## Source anchors\n- Ministry for Climate Crisis and Civil Protection: forest-fire self-protection guidance.\n- Greek Fire Service and municipal seasonal instructions.\n- 112 emergency communications service."},"el":{"title":"Ελλάδα: ετοιμότητα νοικοκυριού για την αντιπυρική περίοδο","body":"## Ξεκίνα πριν από την ημέρα υψηλού κινδύνου\nΗ προετοιμασία για δασική πυρκαγιά στην Ελλάδα αρχίζει από τον χώρο γύρω από το ακίνητο, την πρόσβαση των υπηρεσιών, σωστά στοιχεία επικοινωνίας και γνώση των ημερήσιων περιορισμών ή συνθηκών κινδύνου. Ακολούθησε τις τρέχουσες οδηγίες του Υπουργείου Κλιματικής Κρίσης και Πολιτικής Προστασίας, της Πυροσβεστικής και του δήμου για καθαρισμό, απαγορευμένες δραστηριότητες και τοπικά μέτρα· οι απαιτήσεις αλλάζουν ανά περίοδο και περιοχή.\n\n## Διεύθυνση και πρόσβαση\nΒεβαιώσου ότι κάθε μέλος μπορεί να περιγράψει καθαρά τη θέση: οικισμό, δρόμο, κοντινό σημείο αναφοράς και δυσκολία πρόσβασης. Σε αγροτική κατοικία, σκέψου αν πυροσβεστικό όχημα μπορεί να περάσει από πύλη και δρόμο και αν σταθμευμένα αυτοκίνητα, κλαδιά ή αποθηκευμένα υλικά εμποδίζουν. Κράτα αριθμό οικίας ή σήμανση θέσης ορατή όπου είναι πρακτικό.\n\n## Προορισμοί εκκένωσης προς δύο διαφορετικές κατευθύνσεις\nΠολλοί ελληνικοί οικισμοί έχουν περιορισμένο οδικό δίκτυο. Διάλεξε τουλάχιστον δύο προορισμούς που δεν εξαρτώνται από τον ίδιο στενό δρόμο ή δασικό διάδρομο. Σε νησί ή ορεινή περιοχή, το λιμάνι ή ο κεντρικός δρόμος μπορεί να επηρεαστεί από καπνό, φωτιά ή συμφόρηση. Κατέγραψε μία κοντινή τοπική επιλογή προστασίας και μία επιλογή απομάκρυνσης, ακολουθώντας τις επίσημες οδηγίες όταν υπάρξει συμβάν.\n\n## Ζέστη και καπνός μαζί\nΗ εκκένωση από πυρκαγιά συχνά συμβαίνει σε ακραία ζέστη. Πρόσθεσε πόσιμο νερό, κατάλληλη προστασία από ήλιο, συνταγογραφημένα αναπνευστικά φάρμακα και υποστήριξη ηλικιωμένων στο σχέδιο οχήματος. Άτομο με αναπνευστική νόσο μπορεί να χρειάζεται απομάκρυνση από τον καπνό νωρίτερα από την απειλή της φλόγας· τα ατομικά όρια πρέπει να έχουν συζητηθεί με επαγγελματία υγείας.\n\n## Πειθαρχία 112\nΚράτα ενεργές τις ειδοποιήσεις και διάβαζε ολόκληρη την οδηγία 112. Μπορεί να ορίζει συγκεκριμένη περιοχή, κατεύθυνση μετακίνησης ή μέτρο προστασίας. Μην θεωρείς έναν χάρτη κοινωνικού δικτύου πιο αξιόπιστο από νεότερη επίσημη ειδοποίηση. Αν δοθεί εντολή εκκένωσης, ενέργησε έγκαιρα αντί να περιμένεις να δεις φλόγες.\n\n## Πηγές αναφοράς\n- Υπουργείο Κλιματικής Κρίσης και Πολιτικής Προστασίας: οδηγίες αυτοπροστασίας για δασικές πυρκαγιές.\n- Πυροσβεστικό Σώμα και εποχικές οδηγίες του δήμου.\n- Υπηρεσία Επικοινωνιών Έκτακτης Ανάγκης 112."}},{"id":42,"en":{"title":"Greece: earthquake readiness for apartments and dense urban blocks","body":"## Prevent falling-object injuries before the earthquake\nGreek Civil Protection guidance emphasizes securing shelves/bookcases, water heaters and tanks, placing heavy objects low and removing heavy objects from above beds and sofas. In an apartment, also inspect tall cabinets near the exit, hanging lights, televisions, balcony items and anything that could block the door after shaking.\n\n## Know the building without pretending to engineer it\nIdentify stairs, exits, utility shutoffs, fire extinguishers, assembly point and the building manager/contact. Do not make your own structural certification based on crack appearance. After a damaging earthquake, visible deformation, fallen masonry or compromised stairs require professional/authority assessment.\n\n## The lift is not your evacuation plan\nAssume electrical service may fail. Anyone who cannot use stairs independently needs a building-specific assisted-evacuation plan that does not simply say “use the elevator.” Record who can assist, where mobility equipment is kept and which safe waiting/communication procedure applies if the normal exit is blocked.\n\n## Dense streets create exterior hazards\nImmediately outside an apartment building may be a poor assembly area because façades, glass, signs, balconies and masonry can fall during aftershocks. Use the open assembly location identified by local/building planning, and keep clear of traffic routes needed by emergency vehicles.\n\n## Coastal connection\nIf the apartment is in a tsunami-exposed coastal area, strong or long shaking may require a second action after immediate earthquake protection: prompt movement away from the coast according to local tsunami guidance. The household should know this before the earthquake, not discover it while waiting for an alert.\n\n## Source anchors\n- Greek Civil Protection: earthquake protection instructions.\n- Ready.gov: earthquake preparedness.\n- Building-management and municipal emergency planning."},"el":{"title":"Ελλάδα: ετοιμότητα διαμερίσματος και πυκνού αστικού ιστού για σεισμό","body":"## Μείωσε τους τραυματισμούς από πτώση αντικειμένων πριν τον σεισμό\nΟι οδηγίες της Πολιτικής Προστασίας δίνουν έμφαση στη στερέωση ραφιών και βιβλιοθηκών, θερμοσίφωνα και δεξαμενών, στην τοποθέτηση βαριών αντικειμένων χαμηλά και στην απομάκρυνσή τους από πάνω από κρεβάτια και καναπέδες. Σε διαμέρισμα έλεγξε επίσης ψηλά ντουλάπια κοντά στην έξοδο, φωτιστικά, τηλεοράσεις, αντικείμενα μπαλκονιού και οτιδήποτε μπορεί να μπλοκάρει την πόρτα μετά τη δόνηση.\n\n## Γνώρισε το κτίριο χωρίς να προσποιείσαι τον μηχανικό\nΕντόπισε σκάλες, εξόδους, σημεία διακοπής δικτύων, πυροσβεστήρες, χώρο συγκέντρωσης και στοιχεία διαχειριστή. Μην κάνεις προσωπική «στατική πιστοποίηση» από την εμφάνιση μιας ρωγμής. Μετά από ισχυρό σεισμό, εμφανής παραμόρφωση, πεσμένη τοιχοποιία ή προβληματική σκάλα χρειάζονται εκτίμηση αρμόδιου μηχανικού ή αρχής.\n\n## Ο ανελκυστήρας δεν είναι σχέδιο εκκένωσης\nΘεώρησε πιθανή τη διακοπή ρεύματος. Άτομο που δεν μπορεί να κατέβει ανεξάρτητα τις σκάλες χρειάζεται συγκεκριμένο σχέδιο υποβοηθούμενης εκκένωσης που δεν γράφει απλώς «χρησιμοποίησε το ασανσέρ». Κατέγραψε ποιος βοηθά, πού βρίσκεται ο εξοπλισμός κινητικότητας και ποια διαδικασία αναμονής/επικοινωνίας ισχύει αν η κανονική έξοδος κλείσει.\n\n## Οι πυκνοί δρόμοι δημιουργούν εξωτερικούς κινδύνους\nΟ χώρος ακριβώς έξω από την πολυκατοικία μπορεί να είναι κακό σημείο συγκέντρωσης επειδή προσόψεις, τζάμια, πινακίδες, μπαλκόνια και τοιχοποιία μπορούν να πέσουν σε μετασεισμό. Χρησιμοποίησε ανοιχτό σημείο που έχει οριστεί από τον σχεδιασμό του κτιρίου ή της περιοχής και μην μπλοκάρεις οδούς πρόσβασης υπηρεσιών.\n\n## Σύνδεση με παράκτιο κίνδυνο\nΑν το διαμέρισμα βρίσκεται σε παράκτια περιοχή με έκθεση σε τσουνάμι, ισχυρή ή παρατεταμένη δόνηση μπορεί να απαιτεί δεύτερη ενέργεια μετά την άμεση προστασία από τον σεισμό: γρήγορη απομάκρυνση από την ακτή σύμφωνα με τις τοπικές οδηγίες. Αυτό πρέπει να είναι γνωστό πριν το συμβάν.\n\n## Πηγές αναφοράς\n- Ελληνική Πολιτική Προστασία: οδηγίες προστασίας από σεισμούς.\n- Ready.gov: προετοιμασία για σεισμό.\n- Σχεδιασμός διαχείρισης κτιρίου και δήμου."}},{"id":43,"en":{"title":"Greece: urban heatwave with power interruption","body":"## Heat and outage amplify each other\nA hot apartment may become unsafe faster when air conditioning, fans, lifts, water pumps or refrigeration fail. Greek Civil Protection advises staying in cool/shaded places and avoiding heavy exertion during heatwaves. The household plan should therefore identify a cooler fallback location before the outage, not after indoor temperature has already climbed.\n\n## Monitor people, not only temperature\nOlder adults, infants, pregnant people, those with chronic disease and people taking certain medicines may need closer monitoring. Use direct check-ins and look for changes in alertness, coordination, ability to drink, urination and usual behaviour. Heat stroke is a medical emergency; severe confusion, loss of consciousness or other alarming symptoms require immediate emergency response.\n\n## Apartment tactics\nReduce solar gain using shutters/shades where appropriate, move activity to the coolest safe rooms, reduce heat-producing appliances and schedule necessary tasks for cooler periods. Ventilation decisions should reflect actual outdoor temperature, smoke and air-quality conditions; opening everything at midday can add heat, while wildfire smoke may make outdoor air undesirable even at night.\n\n## Water and lifts\nKeep drinking water accessible on each occupied level if building pumps are unreliable. A person who depends on a lift should have an alternate plan before the power goes out. If evacuation to a cooling location is needed, leave while transport and mobility remain manageable rather than waiting for severe symptoms.\n\n## Medicines and food\nSome medicines and medical supplies have storage-temperature requirements; follow pharmacy/manufacturer/clinician instructions if refrigeration or air conditioning is lost. Apply the separate food-outage rules to the refrigerator/freezer rather than repeatedly opening doors.\n\n## Source anchors\n- Greek Civil Protection: heatwave guidance.\n- Ready.gov and CDC: extreme heat and heat illness.\n- Local public-health and municipal cooling-space instructions."},"el":{"title":"Ελλάδα: αστικός καύσωνας μαζί με διακοπή ρεύματος","body":"## Η ζέστη και η διακοπή ενισχύουν η μία την άλλη\nΈνα θερμό διαμέρισμα μπορεί να γίνει επικίνδυνο γρηγορότερα όταν σταματήσουν κλιματισμός, ανεμιστήρες, ανελκυστήρες, αντλίες νερού ή ψύξη τροφίμων. Η Ελληνική Πολιτική Προστασία συνιστά δροσερούς και σκιερούς χώρους και αποφυγή βαριάς σωματικής προσπάθειας στον καύσωνα. Το νοικοκυριό πρέπει επομένως να γνωρίζει εναλλακτικό δροσερό σημείο πριν χαθεί το ρεύμα.\n\n## Παρακολούθησε ανθρώπους, όχι μόνο θερμόμετρο\nΗλικιωμένοι, βρέφη, έγκυες, άτομα με χρόνιες παθήσεις και άνθρωποι που λαμβάνουν ορισμένα φάρμακα μπορεί να χρειάζονται συχνότερο έλεγχο. Κάνε άμεσες επαφές και πρόσεξε αλλαγές σε εγρήγορση, συντονισμό, δυνατότητα πρόσληψης υγρών, ούρηση και συνηθισμένη συμπεριφορά. Η θερμοπληξία είναι ιατρικό επείγον· σοβαρή σύγχυση, απώλεια συνείδησης ή άλλα ανησυχητικά συμπτώματα απαιτούν άμεση βοήθεια.\n\n## Τακτικές διαμερίσματος\nΠεριόρισε την ηλιακή ακτινοβολία με παντζούρια ή σκιάσεις όπου είναι κατάλληλο, μετακίνησε δραστηριότητες στους δροσερότερους ασφαλείς χώρους, μείωσε συσκευές που παράγουν θερμότητα και κάνε απαραίτητες εργασίες σε δροσερότερες ώρες. Η απόφαση αερισμού πρέπει να λαμβάνει υπόψη εξωτερική θερμοκρασία, καπνό και ποιότητα αέρα· το άνοιγμα όλων το μεσημέρι μπορεί να προσθέσει θερμότητα, ενώ καπνός πυρκαγιάς μπορεί να κάνει τον νυχτερινό αέρα ακατάλληλο.\n\n## Νερό και ανελκυστήρες\nΚράτα πόσιμο νερό σε προσβάσιμο σημείο σε κάθε χρησιμοποιούμενο επίπεδο αν οι αντλίες του κτιρίου δεν είναι αξιόπιστες. Άτομο που εξαρτάται από ανελκυστήρα χρειάζεται εναλλακτικό σχέδιο πριν κοπεί το ρεύμα. Αν απαιτείται μετακίνηση σε δροσερό χώρο, φύγε όσο η μεταφορά και η κινητικότητα παραμένουν εύκολες.\n\n## Φάρμακα και τρόφιμα\nΟρισμένα φάρμακα και ιατρικά υλικά έχουν συγκεκριμένες απαιτήσεις θερμοκρασίας· ακολούθησε φαρμακοποιό, κατασκευαστή ή επαγγελματία υγείας αν χαθεί η ψύξη. Για ψυγείο και κατάψυξη εφάρμοσε τους ξεχωριστούς κανόνες διακοπής και μην ανοίγεις επανειλημμένα τις πόρτες.\n\n## Πηγές αναφοράς\n- Ελληνική Πολιτική Προστασία: οδηγίες καύσωνα.\n- Ready.gov και CDC: ακραία ζέστη και θερμική νόσος.\n- Τοπικές οδηγίες δημόσιας υγείας και δημοτικών δροσερών χώρων."}},{"id":44,"en":{"title":"Greece: island supply interruption and port dependency","body":"## Map the dependency chain\nAn island household can lose normal resupply without losing electricity or shelter. Ferry cancellations, port closure, extreme weather, wildfire, fuel shortage or mainland logistics disruption can reduce food, medicine, bottled water, LPG and spare-part availability. Identify which household essentials arrive from elsewhere and how many days of true stock exist.\n\n## Medicines first\nDo not wait until the last dose to discover that the pharmacy cannot receive deliveries. Maintain an appropriate refill margin within legal/clinical limits and keep prescription/medicine information organized. For temperature-sensitive medicine, include both power and transport contingencies. Never substitute or ration prescribed medicine on your own because a ferry is delayed; contact a pharmacist or clinician.\n\n## Water and cooking\nSome islands have seasonal water constraints or depend on desalination, pumping or delivered water. Track drinking-water reserve separately from household utility water. For cooking, know which method still works if electricity or LPG supply fails, but do not move outdoor combustion appliances indoors.\n\n## Mobility and medical access\nRecord the local clinic/health centre, port, alternative landing/transport options where officially available, and which conditions require earlier transfer before weather deteriorates. A person whose care depends on mainland access should have a clinician-informed continuity plan, not an improvised threshold during a storm.\n\n## Community coordination\nSmall communities can share information and resources efficiently, but rumor also spreads quickly. Use municipal, port, health and civil-protection sources for operational decisions. Keep a local mutual-aid list that specifies concrete capabilities—vehicle, generator, mobility help, language, childcare—not vague promises.\n\n## Source anchors\n- Greek Civil Protection and municipal emergency information.\n- Port/transport operator notices.\n- Local health authority and pharmacy continuity guidance."},"el":{"title":"Ελλάδα: διακοπή εφοδιασμού σε νησί και εξάρτηση από το λιμάνι","body":"## Χαρτογράφησε την αλυσίδα εξάρτησης\nΈνα νησιωτικό νοικοκυριό μπορεί να χάσει τον κανονικό εφοδιασμό χωρίς να χάσει ρεύμα ή κατοικία. Ακύρωση πλοίων, κλείσιμο λιμανιού, έντονα καιρικά φαινόμενα, πυρκαγιά, έλλειψη καυσίμου ή πρόβλημα εφοδιαστικής στην ηπειρωτική χώρα μπορούν να περιορίσουν τρόφιμα, φάρμακα, εμφιαλωμένο νερό, υγραέριο και ανταλλακτικά. Κατάγραψε ποια βασικά είδη έρχονται από αλλού και πόσες πραγματικές ημέρες αποθέματος υπάρχουν.\n\n## Πρώτα τα φάρμακα\nΜην περιμένεις την τελευταία δόση για να ανακαλύψεις ότι το φαρμακείο δεν παραλαμβάνει. Διατήρησε κατάλληλο περιθώριο ανανέωσης μέσα στα νόμιμα και ιατρικά όρια και οργάνωσε πληροφορίες συνταγών/φαρμάκων. Για φάρμακο ευαίσθητο στη θερμοκρασία χρειάζονται εναλλακτικές για ρεύμα και μεταφορά. Μην αντικαθιστάς ή μειώνεις μόνος σου συνταγογραφημένη θεραπεία επειδή καθυστέρησε το πλοίο· επικοινώνησε με φαρμακοποιό ή επαγγελματία υγείας.\n\n## Νερό και μαγείρεμα\nΟρισμένα νησιά έχουν εποχική πίεση στο νερό ή εξαρτώνται από αφαλάτωση, άντληση ή μεταφορά. Παρακολούθησε το απόθεμα πόσιμου νερού χωριστά από το νερό γενικής χρήσης. Για μαγείρεμα, γνώριζε ποια μέθοδος λειτουργεί αν χαθεί ηλεκτρισμός ή υγραέριο, χωρίς ποτέ να μεταφέρεις συσκευή καύσης εξωτερικού χώρου μέσα στο σπίτι.\n\n## Μετακίνηση και ιατρική πρόσβαση\nΚατέγραψε τοπικό κέντρο υγείας ή κλινική, λιμάνι, επίσημες εναλλακτικές μεταφοράς και ποιες καταστάσεις απαιτούν νωρίτερη μετακίνηση πριν επιδεινωθεί ο καιρός. Άτομο του οποίου η φροντίδα εξαρτάται από πρόσβαση στην ηπειρωτική χώρα χρειάζεται σχέδιο συνέχειας με επαγγελματία υγείας, όχι αυτοσχέδιο όριο μέσα στην κακοκαιρία.\n\n## Κοινοτικός συντονισμός\nΜια μικρή κοινότητα μπορεί να μοιράζεται πληροφορίες και πόρους αποτελεσματικά, αλλά και η φήμη διαδίδεται γρήγορα. Χρησιμοποίησε δήμο, λιμενικές αρχές, υπηρεσίες υγείας και Πολιτική Προστασία για επιχειρησιακές αποφάσεις. Κράτα λίστα αλληλοβοήθειας με συγκεκριμένες δυνατότητες—όχημα, γεννήτρια, βοήθεια κινητικότητας, γλώσσα, φροντίδα παιδιών—και όχι αόριστες υποσχέσεις.\n\n## Πηγές αναφοράς\n- Ελληνική Πολιτική Προστασία και δημοτική ενημέρωση.\n- Ανακοινώσεις λιμένων και μεταφορέων.\n- Τοπικές υπηρεσίες υγείας και καθοδήγηση φαρμακείων."}},{"id":45,"en":{"title":"Greece: reading 112 alerts and reporting your location accurately","body":"## Read the whole alert\nA 112 warning is not merely a siren on the phone. It can contain the hazard, affected area, protective action and direction or destination. Stop, read the full text and identify whether you are inside the named area. Do not rely on a cropped screenshot forwarded by someone else when the original alert is available on your device.\n\n## Location first in an emergency call\nWhen contacting 112 for immediate help, give the location early: municipality or settlement, road or landmark, building/floor if relevant, and coordinates only when you can provide them reliably. Then state what happened, how many people are affected, immediate hazards and access constraints. If moving, say that you are moving and give the direction or route.\n\n## Coordinate discipline\nA phone can display coordinates, but format errors matter. Read latitude and longitude slowly and confirm them if the operator repeats them. A misplaced pin can matter in a remote, coastal or wildfire setting. Keep a written address and recognizable local landmark even when satellite positioning is available.\n\n## Communication barriers\nIf someone may have difficulty speaking, hearing or understanding under stress, prepare a short emergency card in Greek and another language if needed. Include address, number of people, functional assistance needed, essential equipment and contact. Avoid private detail that does not change emergency response.\n\n## After the call\nKeep the phone available for callback and follow dispatcher instructions. If conditions change materially—fire cuts the access road, someone becomes unconscious, or the group relocates—update emergency services rather than assuming the first report remains accurate.\n\n## Source anchors\n- Greek Ministry for Climate Crisis and Civil Protection: 112 incoming and outgoing emergency communications.\n- Local emergency-service instructions."},"el":{"title":"Ελλάδα: ανάγνωση ειδοποιήσεων 112 και ακριβής αναφορά θέσης","body":"## Διάβασε ολόκληρη την ειδοποίηση\nΜια προειδοποίηση 112 δεν είναι απλώς ένας ήχος στο τηλέφωνο. Μπορεί να περιέχει το φαινόμενο, την επηρεαζόμενη περιοχή, το μέτρο προστασίας και κατεύθυνση ή προορισμό. Σταμάτησε, διάβασε όλο το κείμενο και βεβαιώσου αν βρίσκεσαι μέσα στην ονομασμένη ζώνη. Μην βασίζεσαι σε κομμένο στιγμιότυπο που προώθησε τρίτος όταν έχεις το αρχικό μήνυμα στη συσκευή σου.\n\n## Πρώτα η τοποθεσία στην επείγουσα κλήση\nΌταν επικοινωνείς με το 112 για άμεση βοήθεια, δώσε νωρίς τη θέση: δήμο ή οικισμό, δρόμο ή σημείο αναφοράς, κτίριο ή όροφο αν έχει σημασία και συντεταγμένες μόνο όταν μπορείς να τις δώσεις αξιόπιστα. Μετά εξήγησε τι συνέβη, πόσα άτομα επηρεάζονται, ποιος κίνδυνος είναι άμεσος και τι δυσκολεύει την πρόσβαση. Αν κινείσαι, πες ότι βρίσκεσαι σε κίνηση και δώσε κατεύθυνση ή διαδρομή.\n\n## Πειθαρχία συντεταγμένων\nΤο τηλέφωνο μπορεί να εμφανίζει γεωγραφικές συντεταγμένες, αλλά ένα λάθος μορφής έχει σημασία. Διάβασε πλάτος και μήκος αργά και επιβεβαίωσε αν ο τηλεφωνητής τα επαναλάβει. Ένα λανθασμένο σημείο μπορεί να είναι κρίσιμο σε απομονωμένη, παράκτια ή πυρόπληκτη περιοχή. Κράτα γραμμένη διεύθυνση και αναγνωρίσιμο τοπικό σημείο ακόμη όταν λειτουργεί ο δορυφορικός εντοπισμός.\n\n## Εμπόδια επικοινωνίας\nΑν κάποιος μπορεί να δυσκολευτεί να μιλήσει, να ακούσει ή να κατανοήσει υπό πίεση, ετοίμασε σύντομη κάρτα έκτακτης ανάγκης στα ελληνικά και σε δεύτερη γλώσσα αν χρειάζεται. Συμπερίλαβε διεύθυνση, αριθμό ατόμων, λειτουργική βοήθεια που απαιτείται, κρίσιμο εξοπλισμό και επαφή. Απόφυγε ιδιωτικές λεπτομέρειες που δεν αλλάζουν την απόκριση.\n\n## Μετά την κλήση\nΚράτα το τηλέφωνο διαθέσιμο για επιστροφή κλήσης και ακολούθησε τις οδηγίες. Αν αλλάξει ουσιαστικά η κατάσταση—η φωτιά κόψει τον δρόμο, κάποιος χάσει τις αισθήσεις του ή η ομάδα μετακινηθεί—ενημέρωσε τις υπηρεσίες αντί να θεωρείς ότι η πρώτη αναφορά παραμένει σωστή.\n\n## Πηγές αναφοράς\n- Υπουργείο Κλιματικής Κρίσης και Πολιτικής Προστασίας: εισερχόμενη και εξερχόμενη υπηρεσία 112.\n- Οδηγίες τοπικών υπηρεσιών έκτακτης ανάγκης."}},{"id":46,"en":{"title":"Greece: from coastal earthquake to tsunami decision","body":"## Link the hazards in one plan\nA coastal earthquake plan that ends when shaking stops is incomplete. If the household is in a low-lying coastal area, the same earthquake may create tsunami risk. Before any event, identify whether frequent locations fall inside locally recognized coastal hazard or evacuation zones and where safer higher or inland ground lies.\n\n## Immediate sequence\nFirst protect against the earthquake. When shaking stops, if there was strong or long shaking or another natural tsunami warning and local guidance calls for evacuation, move promptly away from the shoreline. Do not go to the beach, harbour or seafront road to inspect water movement. Bring only what is already staged and necessary for life safety.\n\n## Islands and constrained roads\nOn an island, moving inland may mean gaining elevation rather than travelling a long horizontal distance. Identify foot routes that do not rely on one coastal road or vehicle. A narrow road can gridlock quickly; follow local evacuation signage and Civil Protection instructions rather than improvising through unstable slopes or damaged streets.\n\n## After reaching safer ground\nAccount for the group, provide first aid, send a concise status message and remain out of the hazard zone. Multiple waves can arrive and dangerous currents can persist. Do not use the first calm period as permission to return. Monitor official information through 112, local authorities and other available channels.\n\n## Night and tourist-season complications\nKeep footwear, light and basic identification near the bed in coastal accommodation. Visitors should learn the address and nearest safer route rather than assuming a host or hotel will always be able to guide them. During crowded summer conditions, walking routes and meeting points may matter more than vehicle capacity.\n\n## Source anchors\n- Greek Civil Protection: earthquake and natural-disaster instructions.\n- Ready.gov: tsunami natural warning signs.\n- Local coastal and municipal evacuation planning."},"el":{"title":"Ελλάδα: μετάβαση από παράκτιο σεισμό σε απόφαση για τσουνάμι","body":"## Σύνδεσε τους κινδύνους σε ένα σχέδιο\nΈνα παράκτιο σχέδιο σεισμού που τελειώνει όταν σταματήσει η δόνηση είναι ελλιπές. Αν το νοικοκυριό βρίσκεται σε χαμηλή παράκτια περιοχή, ο ίδιος σεισμός μπορεί να δημιουργήσει κίνδυνο τσουνάμι. Πριν υπάρξει συμβάν, έλεγξε αν σπίτι, εργασία, σχολείο ή συχνές παραλίες βρίσκονται σε αναγνωρισμένη ζώνη και πού βρίσκεται ασφαλέστερο ψηλότερο ή εσωτερικό έδαφος.\n\n## Άμεση ακολουθία\nΠρώτα προστατεύσου από τον σεισμό. Όταν σταματήσει η δόνηση, αν ήταν ισχυρή ή παρατεταμένη ή υπάρχει άλλο φυσικό σημάδι τσουνάμι και οι τοπικές οδηγίες απαιτούν εκκένωση, απομακρύνσου γρήγορα από την ακτή. Μην πηγαίνεις στην παραλία, στο λιμάνι ή στον παραλιακό δρόμο για να δεις τη θάλασσα. Πάρε μόνο ό,τι είναι ήδη έτοιμο και ουσιώδες για ασφάλεια ζωής.\n\n## Νησιά και περιορισμένοι δρόμοι\nΣε νησί, το «προς την ενδοχώρα» μπορεί να σημαίνει κυρίως αύξηση υψομέτρου και όχι μεγάλη οριζόντια απόσταση. Εντόπισε πεζές διαδρομές που δεν εξαρτώνται από έναν παραλιακό δρόμο ή αυτοκίνητο. Ένας στενός δρόμος μπορεί να μπλοκάρει άμεσα· ακολούθησε τοπική σήμανση εκκένωσης και Πολιτική Προστασία αντί να αυτοσχεδιάζεις μέσα από ασταθή πρανή ή κατεστραμμένους δρόμους.\n\n## Αφού φτάσεις σε ασφαλέστερο έδαφος\nΚαταμέτρησε την ομάδα, δώσε πρώτες βοήθειες, στείλε σύντομη ενημέρωση και μείνε έξω από τη ζώνη. Μπορούν να φτάσουν πολλά κύματα και να διατηρηθούν επικίνδυνα ρεύματα. Μην χρησιμοποιήσεις την πρώτη ήρεμη περίοδο ως άδεια επιστροφής. Παρακολούθησε 112, τοπικές αρχές και τα διαθέσιμα επίσημα κανάλια.\n\n## Νύχτα και τουριστική περίοδος\nΚράτα παπούτσια, φακό και βασική ταυτοποίηση κοντά στο κρεβάτι σε παράκτιο κατάλυμα. Οι επισκέπτες πρέπει να μάθουν τη διεύθυνση και την κοντινότερη ασφαλέστερη διαδρομή αντί να θεωρούν ότι ο οικοδεσπότης ή το ξενοδοχείο θα μπορεί πάντα να τους καθοδηγήσει. Σε πολυσύχναστη θερινή περίοδο, οι πεζές διαδρομές και τα σημεία συνάντησης μπορεί να έχουν μεγαλύτερη αξία από το αυτοκίνητο.\n\n## Πηγές αναφοράς\n- Ελληνική Πολιτική Προστασία: οδηγίες σεισμού και φυσικών καταστροφών.\n- Ready.gov: φυσικά προειδοποιητικά σημάδια τσουνάμι.\n- Τοπικός παράκτιος και δημοτικός σχεδιασμός εκκένωσης."}},{"id":47,"en":{"title":"Greece: mountain snow, ice, and road isolation","body":"## Isolation can begin before snow reaches the house\nMountain households can lose safe road access, deliveries and power while indoor conditions still look normal. Monitor official weather and road information and act before a steep or shaded route becomes icy. If travel is not necessary, avoiding a deteriorating mountain road may be the most effective preparedness action.\n\n## Vehicle winter margin\nTyres, chains or traction equipment where required, battery condition, antifreeze/coolant, washer fluid, lights and fuel matter more in cold mountain travel. Practice fitting required traction equipment in good weather; unopened equipment in the boot is not a capability. Carry warm layers, water, food, light, phone power and a method to make the vehicle visible if stranded.\n\n## If stranded\nStay with the vehicle when it provides the safest shelter and follow local emergency guidance. Keep exhaust outlets clear of snow before running an engine and avoid creating carbon-monoxide risk. Use fuel conservatively and make the vehicle visible without exhausting the battery. Share precise location and road direction with emergency services.\n\n## House heating and outage safety\nCold-induced improvisation creates fire and carbon-monoxide hazards. Use heaters only as designed, maintain ventilation requirements and never use outdoor grills or generators indoors. Keep one warm room, dry clothing, bedding and a way to check indoor temperature and vulnerable people.\n\n## Supply horizon\nMountain closure can delay food, medicine and fuel resupply after the weather improves. Maintain a reserve appropriate to local isolation history and household medical needs. Record days remaining for prescription medicines, animal feed, heating fuel and drinking water separately; the shortest critical reserve drives the resupply decision.\n\n## Source anchors\n- Greek Civil Protection and meteorological winter-weather instructions.\n- Road and police traffic advisories.\n- CDC carbon-monoxide safety for combustion equipment."},"el":{"title":"Ελλάδα: χιόνι, πάγος και οδική απομόνωση σε ορεινή περιοχή","body":"## Η απομόνωση μπορεί να αρχίσει πριν φτάσει το χιόνι στο σπίτι\nΈνα ορεινό νοικοκυριό μπορεί να χάσει ασφαλή πρόσβαση, παραδόσεις και ρεύμα ενώ οι συνθήκες μέσα στο σπίτι φαίνονται φυσιολογικές. Παρακολούθησε επίσημη μετεωρολογική και οδική ενημέρωση και ενέργησε πριν μια απότομη ή σκιερή διαδρομή παγώσει. Αν η μετακίνηση δεν είναι απαραίτητη, η αποφυγή ενός δρόμου που χειροτερεύει μπορεί να είναι η αποτελεσματικότερη ενέργεια προετοιμασίας.\n\n## Χειμερινό περιθώριο οχήματος\nΕλαστικά, αλυσίδες ή άλλο υποχρεωτικό μέσο πρόσφυσης, μπαταρία, ψυκτικό ή αντιψυκτικό, υγρό καθαρισμού, φώτα και καύσιμο έχουν αυξημένη σημασία. Κάνε δοκιμή τοποθέτησης του εξοπλισμού πρόσφυσης σε καλό καιρό· ένα κλειστό κουτί στο πορτμπαγκάζ δεν αποτελεί δεξιότητα. Μετέφερε ζεστές στρώσεις, νερό, τροφή, φωτισμό, ενέργεια τηλεφώνου και τρόπο να γίνει ορατό το όχημα αν ακινητοποιηθεί.\n\n## Αν ακινητοποιηθείς\nΜείνε με το όχημα όταν αυτό παρέχει το ασφαλέστερο καταφύγιο και ακολούθησε τις τοπικές οδηγίες. Κράτα την έξοδο εξάτμισης καθαρή από χιόνι πριν λειτουργήσεις τον κινητήρα και απέφυγε κίνδυνο μονοξειδίου του άνθρακα. Κατανάλωσε καύσιμο συντηρητικά και διατήρησε ορατότητα χωρίς να εξαντλείς την μπαταρία. Δώσε στις υπηρεσίες ακριβή θέση και κατεύθυνση του δρόμου.\n\n## Θέρμανση κατοικίας και ασφάλεια διακοπής\nΟ αυτοσχεδιασμός λόγω κρύου δημιουργεί κίνδυνο φωτιάς και μονοξειδίου. Χρησιμοποίησε θερμαντικά μόνο όπως προβλέπονται, τήρησε τις απαιτήσεις αερισμού και μην βάζεις ψησταριά ή γεννήτρια εξωτερικού χώρου μέσα. Διατήρησε έναν ζεστό χώρο, στεγνά ρούχα, κλινοσκεπάσματα και τρόπο ελέγχου θερμοκρασίας και ευάλωτων ατόμων.\n\n## Ορίζοντας εφοδιασμού\nΤο κλείσιμο δρόμου μπορεί να καθυστερήσει τρόφιμα, φάρμακα και καύσιμα ακόμη και μετά τη βελτίωση του καιρού. Διατήρησε απόθεμα κατάλληλο για την ιστορική απομόνωση της περιοχής και τις ιατρικές ανάγκες. Κατέγραψε χωριστά τις ημέρες που απομένουν για συνταγογραφημένα φάρμακα, ζωοτροφές, καύσιμο θέρμανσης και πόσιμο νερό· το μικρότερο κρίσιμο απόθεμα καθορίζει την απόφαση ανεφοδιασμού.\n\n## Πηγές αναφοράς\n- Ελληνική Πολιτική Προστασία και μετεωρολογικές οδηγίες για χειμερινά φαινόμενα.\n- Οδικές και αστυνομικές ανακοινώσεις κυκλοφορίας.\n- CDC: ασφάλεια μονοξειδίου του άνθρακα από συσκευές καύσης."}},{"id":48,"en":{"title":"Industrial or chemical release: shelter, isolate, or evacuate only on current instructions","body":"## The substance changes the correct action\nA visible plume, unusual odour, industrial alarm or official alert does not justify one universal response. Some incidents require evacuation; others require sheltering indoors and reducing outside-air entry. Follow the current instruction from Civil Protection, fire or hazardous-material authorities or the facility emergency system rather than applying wildfire or smoke rules automatically.\n\n## Shelter-in-place setup\nIf instructed to shelter, move people and animals indoors, close doors and windows, stop ventilation that draws outdoor air when authorities advise it, and move to the designated interior room. Keep radio or phone alerts available. Temporary sealing materials may reduce air exchange, but do not create a dangerous unventilated environment around combustion appliances. Never run a generator, grill or engine indoors.\n\n## Do not investigate\nAvoid walking or driving toward the plume to identify the source. Do not touch deposited material, unknown liquids or damaged containers. If exposed, follow the specific decontamination and medical instruction from authorities; different chemicals require different actions, so improvised neutralization can make an injury worse.\n\n## Evacuation route direction\nIf evacuation is ordered, use the route and direction given by authorities. The shortest road on a map may pass through the affected plume or responder exclusion zone. Close the building as directed, take staged essential medicines and identification, account for everyone, and leave promptly.\n\n## Information to record\nCapture the time of the alert, named substance if officially confirmed, affected zone, protective action, ventilation setting, symptoms or exposure and every subsequent instruction. If someone develops breathing difficulty, altered consciousness or severe symptoms, contact emergency medical services and state that chemical exposure is possible.\n\n## Source anchors\n- Greek Civil Protection: general and technological or industrial hazard instructions.\n- Local fire or hazardous-material response authority.\n- Facility-specific emergency instructions when officially issued."},"el":{"title":"Βιομηχανική ή χημική διαρροή: παραμονή, απομόνωση ή εκκένωση μόνο με τρέχουσα οδηγία","body":"## Η ουσία αλλάζει τη σωστή ενέργεια\nΟρατό νέφος, ασυνήθιστη οσμή, βιομηχανικός συναγερμός ή επίσημη ειδοποίηση δεν οδηγούν σε μία καθολική απάντηση. Ορισμένα περιστατικά απαιτούν εκκένωση· άλλα απαιτούν παραμονή σε κλειστό χώρο και περιορισμό εισόδου εξωτερικού αέρα. Ακολούθησε την τρέχουσα οδηγία Πολιτικής Προστασίας, Πυροσβεστικής, ειδικής μονάδας επικίνδυνων υλικών ή του επίσημου συστήματος της εγκατάστασης και μην εφαρμόζεις αυτόματα κανόνες δασικής πυρκαγιάς.\n\n## Προετοιμασία παραμονής σε κλειστό χώρο\nΑν δοθεί οδηγία παραμονής, βάλε ανθρώπους και ζώα μέσα, κλείσε πόρτες και παράθυρα, σταμάτησε αερισμό που εισάγει εξωτερικό αέρα όταν αυτό ζητείται και μετακινήσου στον καθορισμένο εσωτερικό χώρο. Διατήρησε διαθέσιμες ειδοποιήσεις ραδιοφώνου ή τηλεφώνου. Προσωρινά υλικά στεγανοποίησης μπορούν να μειώσουν την ανταλλαγή αέρα, αλλά μην δημιουργείς επικίνδυνο μη αεριζόμενο χώρο γύρω από συσκευές καύσης. Μην λειτουργείς ποτέ γεννήτρια, ψησταριά ή κινητήρα μέσα.\n\n## Μην πας να ερευνήσεις\nΑπόφυγε να περπατήσεις ή να οδηγήσεις προς το νέφος για να βρεις την πηγή. Μην αγγίζεις εναποθέσεις, άγνωστα υγρά ή κατεστραμμένα δοχεία. Αν υπάρξει έκθεση, ακολούθησε ειδικές οδηγίες απολύμανσης και ιατρικής αντιμετώπισης από τις αρχές· διαφορετικές χημικές ουσίες απαιτούν διαφορετικές ενέργειες και ένας αυτοσχέδιος «εξουδετερωτής» μπορεί να επιδεινώσει τον τραυματισμό.\n\n## Κατεύθυνση εκκένωσης\nΑν δοθεί εντολή εκκένωσης, χρησιμοποίησε τη διαδρομή και κατεύθυνση των αρχών. Ο συντομότερος δρόμος στον χάρτη μπορεί να περνά μέσα από το νέφος ή από ζώνη αποκλεισμού. Κλείσε το κτίριο όπως ζητείται, πάρε ήδη συγκεντρωμένα βασικά φάρμακα και ταυτοποίηση, καταμέτρησε όλους και φύγε έγκαιρα.\n\n## Τι πρέπει να καταγραφεί\nΣημείωσε ώρα ειδοποίησης, ουσία μόνο αν έχει επιβεβαιωθεί επίσημα, επηρεαζόμενη ζώνη, μέτρο προστασίας, ρύθμιση αερισμού, συμπτώματα ή έκθεση και κάθε επόμενη οδηγία. Αν κάποιος εμφανίσει δυσκολία στην αναπνοή, μεταβολή συνείδησης ή σοβαρά συμπτώματα, επικοινώνησε με επείγουσα ιατρική βοήθεια και ανέφερε πιθανή χημική έκθεση.\n\n## Πηγές αναφοράς\n- Ελληνική Πολιτική Προστασία: γενικές οδηγίες και οδηγίες τεχνολογικών ή βιομηχανικών συμβάντων.\n- Πυροσβεστική ή αρμόδια μονάδα επικίνδυνων υλικών.\n- Επίσημες οδηγίες της εγκατάστασης όταν εκδίδονται."}},{"id":49,"en":{"title":"Landslide, rockfall and slope-failure decisions","body":"Slope failures can begin with obvious movement or with small changes that are easy to dismiss: new cracks, tilting fences, doors that suddenly bind, fresh seepage, falling stones, rumbling, or a stream that changes level or becomes muddy. Treat clusters of new signs as a reason to increase distance and seek official information rather than as an invitation to inspect the slope closely.\n\n## Before movement starts\n\nMap steep cuts, retaining walls, ravines, road embankments and places where wildfire has removed vegetation. Keep sleeping and parking positions away from known fall lines when practical. For a mountain or island route, identify a turnaround point before entering a section with cliffs above and no safe shoulder. Heavy rain after wildfire, earthquakes and construction can change a slope that was previously stable.\n\n## When warning signs appear\n\nDo not stand below a cracked wall, cliff, boulder field or saturated bank to photograph it. Move away from the expected path of debris and from channels that can carry mud and rocks farther than the initial slide. If driving, slow early and turn around before entering moving water, fresh debris, collapsed pavement or a road whose outside edge has dropped. Night and heavy rain make visual judgement much less reliable.\n\n## Household decision record\n\nWrite the exact location, time, rainfall or earthquake context, visible changes, road condition and who was informed. Mark the route as unavailable until a competent authority or owner clears it. A second route should not reuse the same valley, bridge or cut slope if one event could block both.\n\n## Stop conditions\n\nNever enter an active debris path, unstable structure or closed road for retrieval. After a slide, expect secondary movement, damaged utilities and undermined ground. Keep people and vehicles away from the toe and edge of the failure until the area is assessed.\n\n**Source anchors:** Ready.gov landslide/debris-flow guidance; local civil-protection and road-authority instructions. Follow current local closures and evacuation orders."},"el":{"title":"Κατολίσθηση, βραχοπτώσεις και αστάθεια πρανούς","body":"Μια αστοχία πρανούς μπορεί να αρχίσει με έντονη μετακίνηση ή με μικρές αλλαγές που εύκολα αγνοούνται: νέες ρωγμές, φράχτες που γέρνουν, πόρτες που ξαφνικά σφηνώνουν, νέα διαρροή νερού, πτώση λίθων, βουητό ή αλλαγή στη στάθμη και τη θολότητα ενός ρέματος. Όταν εμφανίζονται πολλά νέα σημάδια μαζί, αύξησε την απόσταση και αναζήτησε επίσημη ενημέρωση αντί να πλησιάσεις για επιθεώρηση.\n\n## Πριν αρχίσει η μετακίνηση\n\nΣημείωσε απότομα πρανή, τοίχους αντιστήριξης, ρεματιές, ορύγματα δρόμων και περιοχές όπου πυρκαγιά έχει αφαιρέσει τη βλάστηση. Όπου γίνεται, κράτησε χώρους ύπνου και στάθμευσης μακριά από πιθανή γραμμή πτώσης. Σε ορεινή ή νησιωτική διαδρομή όρισε εκ των προτέρων σημείο αναστροφής πριν μπεις σε τμήμα με γκρεμό και χωρίς ασφαλές έρεισμα. Έντονη βροχή μετά από πυρκαγιά, σεισμός ή έργα μπορούν να αλλάξουν ένα πρανές που παλαιότερα φαινόταν σταθερό.\n\n## Όταν εμφανιστούν ενδείξεις\n\nΜην στέκεσαι κάτω από ραγισμένο τοίχο, βράχο, πεδίο ογκόλιθων ή κορεσμένη όχθη για φωτογραφίες. Απομακρύνσου από την αναμενόμενη πορεία των υλικών και από κοίτες που μπορούν να μεταφέρουν λάσπη και πέτρες πολύ πιο μακριά. Αν οδηγείς, μείωσε ταχύτητα νωρίς και κάνε αναστροφή πριν από κινούμενο νερό, φρέσκα μπάζα, καθίζηση οδοστρώματος ή δρόμο που έχει χάσει το εξωτερικό του άκρο. Νύχτα και έντονη βροχή μειώνουν πολύ την αξιοπιστία της οπτικής εκτίμησης.\n\n## Καταγραφή απόφασης\n\nΓράψε ακριβή θέση, ώρα, βροχή ή σεισμικό πλαίσιο, ορατές μεταβολές, κατάσταση δρόμου και ποιον ενημέρωσες. Σήμανε τη διαδρομή ως μη διαθέσιμη μέχρι να δοθεί έγκριση από αρμόδια αρχή ή υπεύθυνο. Η εναλλακτική διαδρομή δεν πρέπει, αν είναι εφικτό, να χρησιμοποιεί την ίδια κοιλάδα, γέφυρα ή πρανές που μπορεί να κλείσει από το ίδιο συμβάν.\n\n## Όρια διακοπής\n\nΜην μπαίνεις ποτέ σε ενεργή ροή υλικών, ασταθή κατασκευή ή κλειστό δρόμο για ανάκτηση αντικειμένων. Μετά την κατολίσθηση περίμενε δευτερογενείς μετακινήσεις, ζημιές σε παροχές και υποσκαμμένο έδαφος. Κράτησε ανθρώπους και οχήματα μακριά από το πόδι και το άνω άκρο της αστοχίας μέχρι να γίνει αξιολόγηση.\n\n**Βασικές πηγές:** οδηγίες Ready.gov για κατολισθήσεις/ροές υλικών και ισχύουσες οδηγίες Πολιτικής Προστασίας και αρμόδιων οδικών αρχών."}},{"id":50,"en":{"title":"Volcanic ash and fine-particle disruption","body":"Volcanic ash is not soft fireplace ash. Fine abrasive particles can reduce visibility, irritate eyes and airways, contaminate exposed water and food, clog filters and damage engines or electronics. Even when lava is nowhere nearby, ashfall can disrupt transport, power, water treatment and communications.\n\n## Reduce exposure first\n\nFollow official evacuation or shelter instructions. During ashfall, stay indoors when authorities advise it, close unnecessary openings and reduce the movement of outdoor dust into the cleanest room. If you must go outside, use the respiratory and eye protection recommended by authorities; people with asthma, COPD or other respiratory conditions should use their medical action plan and seek professional advice when symptoms worsen.\n\n## Protect equipment and supplies\n\nCover clean water containers and food preparation surfaces. Keep ash away from open electronics, fans and mechanical intakes. Do not run a vehicle simply to “test” it in heavy ash: abrasive material can enter air systems, and visibility or road traction may be poor. Keep spare filters only if they match the equipment and follow the manufacturer’s replacement instructions.\n\n## Cleaning without creating a dust cloud\n\nWait for official guidance on cleanup. Avoid aggressive dry sweeping that throws fine material back into breathing zones. Separate ash-contaminated clothing and shoes from sleeping and food areas. Roof loading can become a structural issue, especially when ash becomes wet; do not climb onto a roof that may be overloaded, slippery or damaged.\n\n## Record what changed\n\nLog ash depth or visible accumulation at a safe observation point, water status, filter condition, breathing symptoms, road access and official notices. This makes later decisions about relocation, cleaning and equipment use more defensible.\n\n**Source anchors:** Ready.gov volcano guidance; local civil-protection, health and aviation/road authority instructions. The manual does not predict eruptions or replace official hazard zones."},"el":{"title":"Ηφαιστειακή τέφρα και διαταραχή από λεπτά σωματίδια","body":"Η ηφαιστειακή τέφρα δεν είναι μαλακή στάχτη τζακιού. Τα λεπτά λειαντικά σωματίδια μπορούν να μειώσουν την ορατότητα, να ερεθίσουν μάτια και αναπνευστικό, να μολύνουν εκτεθειμένο νερό και τρόφιμα, να φράξουν φίλτρα και να προκαλέσουν βλάβες σε κινητήρες ή ηλεκτρονικά. Ακόμη και χωρίς κοντινή λάβα, η πτώση τέφρας μπορεί να διακόψει μεταφορές, ρεύμα, επεξεργασία νερού και επικοινωνίες.\n\n## Μείωσε πρώτα την έκθεση\n\nΑκολούθησε επίσημες εντολές εκκένωσης ή παραμονής σε κλειστό χώρο. Κατά την πτώση τέφρας μείνε μέσα όταν αυτό συστήνεται, κλείσε περιττά ανοίγματα και περιόρισε τη μεταφορά εξωτερικής σκόνης στον καθαρότερο χώρο. Αν πρέπει να βγεις, χρησιμοποίησε την αναπνευστική και οφθαλμική προστασία που προτείνουν οι αρχές. Άτομα με άσθμα, ΧΑΠ ή άλλη αναπνευστική πάθηση χρειάζονται το προσωπικό ιατρικό τους σχέδιο και επαγγελματική βοήθεια όταν τα συμπτώματα επιδεινώνονται.\n\n## Προστάτευσε εξοπλισμό και εφόδια\n\nΚάλυψε δοχεία καθαρού νερού και επιφάνειες προετοιμασίας τροφής. Κράτησε την τέφρα μακριά από ανοιχτά ηλεκτρονικά, ανεμιστήρες και εισαγωγές μηχανών. Μην βάζεις όχημα σε λειτουργία μόνο «για δοκιμή» μέσα σε πυκνή τέφρα· το λειαντικό υλικό μπορεί να περάσει στα συστήματα αέρα, ενώ η ορατότητα και η πρόσφυση μπορεί να είναι χαμηλές. Κράτησε εφεδρικά φίλτρα μόνο όταν είναι σωστά για τον εξοπλισμό και ακολούθησε τις οδηγίες κατασκευαστή.\n\n## Καθαρισμός χωρίς νέφος σκόνης\n\nΠερίμενε τις επίσημες οδηγίες καθαρισμού. Απόφυγε έντονο στεγνό σκούπισμα που ξανασηκώνει λεπτή σκόνη στη ζώνη αναπνοής. Χώρισε μολυσμένα ρούχα και παπούτσια από χώρους ύπνου και τροφίμων. Το φορτίο στην οροφή μπορεί να γίνει δομικός κίνδυνος, ιδιαίτερα όταν η τέφρα βραχεί· μην ανεβαίνεις σε οροφή που μπορεί να είναι υπερφορτωμένη, ολισθηρή ή κατεστραμμένη.\n\n## Κατέγραψε τις μεταβολές\n\nΣημείωσε ασφαλή παρατήρηση συσσώρευσης, κατάσταση νερού, φίλτρων, αναπνευστικά συμπτώματα, πρόσβαση δρόμων και επίσημες ανακοινώσεις. Η καταγραφή βοηθά σε μεταγενέστερες αποφάσεις για μετακίνηση, καθαρισμό και χρήση εξοπλισμού.\n\n**Βασικές πηγές:** Ready.gov για ηφαιστειακούς κινδύνους και ισχύουσες οδηγίες Πολιτικής Προστασίας, υγειονομικών και μεταφορικών αρχών. Το εγχειρίδιο δεν προβλέπει εκρήξεις ούτε αντικαθιστά επίσημες ζώνες κινδύνου."}},{"id":51,"en":{"title":"Home-fire escape, smoke and door decisions","body":"A home fire is a time-critical escape problem, not a property-saving exercise. Smoke can make a familiar corridor unusable quickly, and opening the wrong door can expose a room to heat and smoke. Household preparation therefore matters more than improvisation after an alarm.\n\n## Build the escape plan before the fire\n\nIdentify two ways out of sleeping areas where feasible, an outdoor meeting point that is away from traffic and responding vehicles, and who assists children, older adults, disabled people or animals without delaying escape. Keep exits usable; do not store emergency supplies where they narrow the only route. Practice the plan in daylight and darkness without creating unsafe drills.\n\n## During an alarm or signs of fire\n\nLeave promptly and follow fire-service guidance. Do not return for phones, documents, pets or equipment if doing so means re-entering danger. If smoke or heat blocks the planned route, use the alternate route rather than testing a visibly hazardous corridor. A closed door can slow smoke and heat; before opening an unfamiliar door in a fire situation, assess conditions and follow official fire-safety training rather than forcing it open.\n\n## Accountability outside\n\nAt the meeting point, count people and tell responders immediately who may still be inside, their likely location, mobility needs and any known hazards such as oxygen cylinders, batteries, fuel or animals. Do not send an untrained person back in.\n\n## After extinguishment\n\nDo not re-enter merely because visible flames are gone. Fire can leave hot spots, toxic smoke residues, structural damage, wet electrical systems and contaminated food or medicines. Wait for clearance and record damage from a safe area.\n\n**Source anchors:** Ready.gov home-fire guidance and local fire-service instructions. Install and maintain smoke alarms according to local rules and manufacturer guidance."},"el":{"title":"Διαφυγή από οικιακή φωτιά, καπνός και αποφάσεις σε πόρτες","body":"Η οικιακή πυρκαγιά είναι πρόβλημα άμεσης διαφυγής, όχι διάσωσης περιουσίας. Ο καπνός μπορεί να κάνει γρήγορα έναν γνωστό διάδρομο μη χρησιμοποιήσιμο και το άνοιγμα λάθος πόρτας μπορεί να εκθέσει ένα δωμάτιο σε θερμότητα και καπνό. Γι’ αυτό η προετοιμασία του νοικοκυριού έχει μεγαλύτερη αξία από τον αυτοσχεδιασμό μετά τον συναγερμό.\n\n## Σχεδίασε τη διαφυγή πριν τη φωτιά\n\nΌπου είναι εφικτό, όρισε δύο εξόδους από χώρους ύπνου, εξωτερικό σημείο συνάντησης μακριά από κυκλοφορία και οχήματα επέμβασης, καθώς και ποιος βοηθά παιδιά, ηλικιωμένους, άτομα με αναπηρία ή ζώα χωρίς να καθυστερεί τη διαφυγή. Κράτησε τις εξόδους λειτουργικές· μην αποθηκεύεις εφόδια εκεί όπου στενεύουν τη μοναδική πορεία. Κάνε ασφαλή εξάσκηση ημέρα και νύχτα χωρίς επικίνδυνες προσομοιώσεις.\n\n## Σε συναγερμό ή ένδειξη φωτιάς\n\nΒγες γρήγορα και ακολούθησε τις οδηγίες της Πυροσβεστικής. Μην επιστρέφεις για κινητά, έγγραφα, ζώα ή εξοπλισμό όταν αυτό απαιτεί επανείσοδο σε κίνδυνο. Αν καπνός ή θερμότητα μπλοκάρει την κύρια πορεία, χρησιμοποίησε την εναλλακτική αντί να δοκιμάσεις έναν εμφανώς επικίνδυνο διάδρομο. Μια κλειστή πόρτα μπορεί να καθυστερήσει καπνό και θερμότητα· πριν ανοίξεις άγνωστη πόρτα σε συνθήκες φωτιάς, εκτίμησε την κατάσταση και ακολούθησε επίσημη εκπαίδευση πυρασφάλειας αντί να την εξαναγκάσεις.\n\n## Καταμέτρηση έξω\n\nΣτο σημείο συνάντησης μέτρησε τα άτομα και ενημέρωσε αμέσως τους διασώστες ποιος μπορεί να βρίσκεται ακόμη μέσα, πιθανή θέση, ανάγκες κινητικότητας και γνωστούς κινδύνους όπως φιάλες οξυγόνου, μπαταρίες, καύσιμα ή ζώα. Μην στείλεις ανεκπαίδευτο άτομο πίσω στο κτίριο.\n\n## Μετά την κατάσβεση\n\nΜην ξαναμπείς επειδή απλώς δεν βλέπεις φλόγες. Μπορεί να υπάρχουν θερμά σημεία, τοξικά κατάλοιπα καπνού, δομική βλάβη, βρεγμένα ηλεκτρικά συστήματα και μολυσμένα τρόφιμα ή φάρμακα. Περίμενε έγκριση και κατέγραψε ζημιές από ασφαλές σημείο.\n\n**Βασικές πηγές:** Ready.gov για οικιακές πυρκαγιές και ισχύουσες οδηγίες Πυροσβεστικού Σώματος. Η εγκατάσταση και συντήρηση ανιχνευτών καπνού πρέπει να ακολουθεί τους τοπικούς κανόνες και τον κατασκευαστή."}},{"id":52,"en":{"title":"Gas odor, suspected leak and utility-isolation boundaries","body":"A suspected fuel-gas leak is not a troubleshooting exercise. Odor, hissing, damaged piping, an appliance impact, earthquake damage or unexplained symptoms in an enclosed area should trigger distance, fresh air and professional response rather than experiments with switches or flames.\n\n## Immediate priorities\n\nMove people away from the susp
