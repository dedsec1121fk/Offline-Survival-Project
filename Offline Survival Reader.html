<script>const CHAPTERS=[{"id":1,"en":{"title":"Emergency water reserve: quantity, rotation, and protected storage","body":"## Planning the reserve\nAn emergency water reserve should be treated as several separate capabilities: water for drinking, food preparation, oral hygiene, basic washing, pets, and any medical or accessibility need that increases consumption. CDC household guidance uses at least one US gallon (about 3.8 litres) per person per day for three days as a minimum planning baseline and encourages a two-week supply when practical. Hot climates, illness, pregnancy, nursing, heavy work, pets, and interruptions to normal sanitation can push real use above a simple baseline, so the household plan should record both a minimum survival reserve and a larger target.\n\n## Containers and storage location\nUse food-grade containers intended for water. Protect them from fuel, pesticides, cleaning chemicals, direct sun, floodwater, and places where a damaged shelf could crush or puncture them. A single large container is efficient but creates one failure point; several manageable containers are easier to move, inspect, and isolate. Keep a small immediately accessible amount in the evacuation kit rather than assuming the main household reserve can be carried during a rapid departure.\n\n## Rotation and traceability\nMark each container with the fill date, source, and whether it was commercially sealed or filled at home. When using home-filled storage, sanitize the container correctly and avoid touching the inside of caps or openings. Rotate according to the container or bottled-water manufacturer’s guidance and your local public-health advice. The project’s Water Batch log can track source, handling, container, date, and status so an uncertain batch never gets mixed into accepted water.\n\n## When the normal supply becomes questionable\nA pressure loss, flood, damaged main, unusual taste or smell, official advisory, or contamination incident changes the problem from “how much water do we have?” to “which water is acceptable for which use?” Follow the most restrictive current instruction from the water utility or civil-protection/public-health authority. Boiling can kill germs but does not remove many chemicals; if authorities say the supply may contain chemicals, fuel, heavy metals, or other hazardous substances, do not assume boiling makes it safe.\n\n## Reserve failure modes\nCommon operational failures are storing all water in one inaccessible room, forgetting a manual way to open sealed containers, letting drinking water become the default for every washing task, or using an unlabelled bottle that nobody can trace. After an earthquake or flood, also inspect containers for cracks, dirty caps, damaged seals, and contact with contaminated water before counting them as usable.\n\n## Source anchors\n- CDC: Creating and storing an emergency water supply.\n- CDC: Water, sanitation, and hygiene emergencies.\n- EPA: Emergency disinfection of drinking water."},"el":{"title":"Απόθεμα νερού έκτακτης ανάγκης: ποσότητα, ανανέωση και προστατευμένη αποθήκευση","body":"## Σχεδιασμός του αποθέματος\nΈνα απόθεμα νερού πρέπει να αντιμετωπίζεται ως σύνολο διαφορετικών αναγκών: πόση, προετοιμασία φαγητού, στοματική υγιεινή, βασικό πλύσιμο, ζώα και τυχόν ιατρικές ή προσβασιμότητας ανάγκες που αυξάνουν την κατανάλωση. Η καθοδήγηση του CDC χρησιμοποιεί ως ελάχιστη βάση περίπου 3,8 λίτρα ανά άτομο και ημέρα για τρεις ημέρες και προτείνει, όταν είναι πρακτικό, απόθεμα δύο εβδομάδων. Ζέστη, ασθένεια, εγκυμοσύνη, θηλασμός, βαριά εργασία, ζώα ή πρόβλημα αποχέτευσης μπορούν να αυξήσουν σημαντικά την πραγματική χρήση, γι’ αυτό χρειάζονται δύο στόχοι: ελάχιστο και επιθυμητό απόθεμα.\n\n## Δοχεία και θέση αποθήκευσης\nΧρησιμοποίησε δοχεία κατάλληλα για τρόφιμα και πόσιμο νερό. Προστάτευσέ τα από καύσιμα, φυτοφάρμακα, καθαριστικά, άμεσο ήλιο, πλημμυρικό νερό και ράφια που μπορούν να καταρρεύσουν. Ένα πολύ μεγάλο δοχείο είναι αποδοτικό αλλά αποτελεί μοναδικό σημείο αστοχίας· περισσότερα μικρότερα δοχεία μεταφέρονται, ελέγχονται και απομονώνονται ευκολότερα. Κράτα επίσης μικρή ανεξάρτητη ποσότητα στο σακίδιο εκκένωσης, γιατί το κύριο οικιακό απόθεμα μπορεί να μην είναι δυνατό να μεταφερθεί γρήγορα.\n\n## Ανανέωση και ιχνηλασιμότητα\nΣημείωσε σε κάθε δοχείο ημερομηνία πλήρωσης, πηγή και αν ήταν εμπορικά σφραγισμένο ή γεμίστηκε στο σπίτι. Για οικιακή πλήρωση, καθάρισε και απολύμανε σωστά το δοχείο και απέφυγε επαφή με το εσωτερικό του πώματος ή του στομίου. Ακολούθησε τις οδηγίες του κατασκευαστή και των αρμόδιων υγειονομικών υπηρεσιών για ανανέωση. Η Καταγραφή Παρτίδων Νερού του έργου μπορεί να κρατά πηγή, χειρισμό, δοχείο, ημερομηνία και κατάσταση ώστε μια αβέβαιη παρτίδα να μην αναμειχθεί με αποδεκτό νερό.\n\n## Όταν η κανονική παροχή γίνει αμφίβολη\nΠτώση πίεσης, πλημμύρα, σπασμένος αγωγός, ασυνήθιστη οσμή ή γεύση, επίσημη ειδοποίηση ή περιστατικό ρύπανσης αλλάζουν το ερώτημα από «πόσο νερό έχουμε;» σε «ποιο νερό είναι κατάλληλο για ποια χρήση;». Ακολούθησε την αυστηρότερη τρέχουσα οδηγία της ύδρευσης, της δημόσιας υγείας ή της Πολιτικής Προστασίας. Το βράσιμο σκοτώνει μικρόβια, αλλά δεν αφαιρεί πολλές χημικές ουσίες· όταν υπάρχει πιθανότητα καυσίμων, βαρέων μετάλλων ή χημικής ρύπανσης, μην θεωρείς ότι το βράσιμο αρκεί.\n\n## Τρόποι αστοχίας του αποθέματος\nΣυχνά προβλήματα είναι όλο το νερό σε έναν χώρο που δεν είναι πλέον προσβάσιμος, έλλειψη χειροκίνητου τρόπου ανοίγματος, κατανάλωση πόσιμου νερού για κάθε εργασία καθαρισμού ή χρήση άγνωστου μπουκαλιού χωρίς ιστορικό. Μετά από σεισμό ή πλημμύρα έλεγξε επίσης ρωγμές, βρώμικα πώματα, χαλασμένες σφραγίδες και επαφή με μολυσμένο νερό πριν υπολογίσεις ένα δοχείο ως διαθέσιμο.\n\n## Πηγές αναφοράς\n- CDC: δημιουργία και αποθήκευση αποθέματος νερού έκτακτης ανάγκης.\n- CDC: έκτακτες ανάγκες νερού, αποχέτευσης και υγιεινής.\n- EPA: απολύμανση πόσιμου νερού σε έκτακτη ανάγκη."}},{"id":2,"en":{"title":"Boil-water advisory: household decision flow","body":"## Understand the advisory before acting\nA boil-water advisory normally addresses microbiological risk, not every type of contamination. Read the issuing authority’s wording carefully: a “boil water” instruction is different from a “do not drink” or “do not use” notice. If chemical contamination is suspected, heating the water may not solve the problem and can concentrate some contaminants. Record the time the notice began, the affected area, and which household taps or stored containers were exposed after the notice started.\n\n## Boiling correctly\nCurrent CDC guidance says to bring clear water to a full rolling boil for one minute; at elevations above about 6,500 feet (2,000 m), boil for three minutes. If the water is cloudy, let solids settle or filter it through a clean cloth, paper towel, or coffee filter before boiling. Let treated water cool in a protected place and transfer it into clean, sanitized containers with tight covers. Prevent burns by keeping hot treatment vessels away from children and unstable work surfaces.\n\n## Which household tasks need safe water\nDuring a microbiological advisory, safe water may be needed not only for drinking but also for brushing teeth, preparing food and drinks, making ice, mixing infant formula, and washing items that contact food, depending on the official notice. Dishwashers, filters, refrigerator dispensers, ice makers, coffee machines, and plumbed appliances can retain questionable water. Follow the local authority’s instructions for flushing or cleaning those systems after the advisory ends.\n\n## Do not let a filter create false confidence\nA common household pitcher or refrigerator filter is not a substitute for boiling unless it is specifically designed and certified for the organism or hazard involved. CDC notes that boiling remains necessary during a boil-water advisory even after ordinary home filtration. A treatment chain should therefore be written as a sequence—settle/filter for clarity if needed, then disinfect by the verified method—rather than treating “filtered” as equivalent to “safe.”\n\n## Ending the advisory\nDo not stop precautions simply because the water looks normal. Wait for the issuing authority to lift the notice. When it ends, follow its instructions on flushing taps, cleaning ice makers, replacing filters, or draining appliances. Update the Water Batch log so containers made during the advisory remain identifiable and are not mistaken for water prepared after clearance.\n\n## Source anchors\n- CDC: Drinking Water Advisories overview.\n- CDC: How to make water safe in an emergency.\n- EPA: Emergency disinfection of drinking water."},"el":{"title":"Ειδοποίηση βρασμού νερού: ροή απόφασης για το νοικοκυριό","body":"## Κατανόησε πρώτα την ειδοποίηση\nΜια οδηγία βρασμού αφορά συνήθως μικροβιολογικό κίνδυνο και όχι κάθε μορφή ρύπανσης. Διάβασε προσεκτικά τη διατύπωση της αρμόδιας αρχής: το «βράστε το νερό» διαφέρει από το «μην πίνετε» ή «μην χρησιμοποιείτε». Αν υπάρχει πιθανότητα χημικής ρύπανσης, η θέρμανση μπορεί να μην λύνει το πρόβλημα και σε ορισμένες περιπτώσεις να αυξάνει τη συγκέντρωση ουσιών. Κατέγραψε πότε ξεκίνησε η ειδοποίηση, ποια περιοχή καλύπτει και ποιοι οικιακοί κρουνοί ή δοχεία χρησιμοποιήθηκαν μετά την έναρξή της.\n\n## Σωστό βράσιμο\nΗ τρέχουσα οδηγία του CDC είναι πλήρης βρασμός για ένα λεπτό· πάνω από περίπου 2.000 μέτρα υψόμετρο, τρία λεπτά. Αν το νερό είναι θολό, άφησε τα στερεά να καθιζάνουν ή πέρασέ το από καθαρό ύφασμα, χαρτί κουζίνας ή φίλτρο καφέ πριν από το βράσιμο. Άφησέ το να κρυώσει σε προστατευμένο σημείο και μετέφερέ το σε καθαρά, απολυμασμένα δοχεία με ασφαλές καπάκι. Οργάνωσε τη διαδικασία ώστε τα καυτά σκεύη να μένουν μακριά από παιδιά και ασταθείς επιφάνειες.\n\n## Ποιες εργασίες χρειάζονται ασφαλές νερό\nΣε μικροβιολογική ειδοποίηση, ασφαλές νερό μπορεί να απαιτείται όχι μόνο για πόση αλλά και για βούρτσισμα δοντιών, παρασκευή φαγητού και ποτών, παγάκια, βρεφική φόρμουλα και καθαρισμό αντικειμένων που έρχονται σε επαφή με τρόφιμα, ανάλογα με την επίσημη οδηγία. Πλυντήρια πιάτων, φίλτρα, ψυγεία με παροχή, παγομηχανές, καφετιέρες και άλλες συσκευές μπορούν να κρατήσουν αμφίβολο νερό. Μετά τη λήξη της ειδοποίησης ακολούθησε τις οδηγίες έκπλυσης και καθαρισμού.\n\n## Μην αφήσεις το φίλτρο να δημιουργήσει ψευδή ασφάλεια\nΜια κοινή κανάτα ή ένα φίλτρο ψυγείου δεν αντικαθιστά το βράσιμο εκτός αν είναι ειδικά σχεδιασμένο και πιστοποιημένο για τον συγκεκριμένο οργανισμό ή κίνδυνο. Το CDC επισημαίνει ότι σε ειδοποίηση βρασμού το νερό πρέπει να βράζεται ακόμη και αν πέρασε από συνηθισμένο οικιακό φίλτρο. Γράψε λοιπόν την επεξεργασία ως ακολουθία ενεργειών και όχι ως απλή ένδειξη «φιλτραρισμένο».\n\n## Λήξη της ειδοποίησης\nΜην σταματήσεις τις προφυλάξεις επειδή το νερό φαίνεται φυσιολογικό. Περίμενε επίσημη άρση. Έπειτα ακολούθησε τις οδηγίες για έκπλυση βρυσών, καθαρισμό παγομηχανής, αντικατάσταση φίλτρων ή αποστράγγιση συσκευών. Ενημέρωσε την Καταγραφή Παρτίδων Νερού ώστε δοχεία που γέμισαν κατά τη διάρκεια της ειδοποίησης να παραμένουν αναγνωρίσιμα.\n\n## Πηγές αναφοράς\n- CDC: επισκόπηση ειδοποιήσεων πόσιμου νερού.\n- CDC: ασφαλές νερό σε έκτακτη ανάγκη.\n- EPA: απολύμανση πόσιμου νερού σε έκτακτη ανάγκη."}},{"id":3,"en":{"title":"Emergency water disinfection: methods and safety boundaries","body":"## Start by identifying the hazard\nEmergency disinfection is aimed primarily at disease-causing microorganisms. It does not reliably remove fuel, solvents, pesticides, salt, many metals, or unknown industrial contamination. If authorities identify a chemical or radiological hazard, use the water source and treatment method they specify. The safest household decision can be to abandon a source rather than applying more treatment to water whose contamination is unknown.\n\n## Boiling is the preferred germ-control method when feasible\nCDC identifies boiling as the best household method for killing germs in emergency water. Clear water should reach a rolling boil for one minute, or three minutes at high elevation under CDC guidance. Fuel, ventilation, burn risk, and the ability to cool and store the treated water are part of the method; a treatment step that causes a fire, carbon-monoxide exposure, or scald injury is not a successful emergency process.\n\n## Chemical disinfection requires the current label and concentration\nEPA and CDC provide bleach-based emergency methods, but the correct amount depends on the sodium-hypochlorite concentration and the water condition. Only plain, unscented household chlorine bleach that is suitable for disinfection should be considered; scented, colour-safe, splashless, or cleaner-added products may not be appropriate. Because product concentrations change, keep the actual bottle and current official instructions together instead of memorising one universal number.\n\n## Cloudy water needs pretreatment\nVisible particles protect microorganisms and make measurement harder. Let sediment settle or pass water through a clean cloth, paper towel, or coffee filter before the verified disinfection step. This pretreatment improves clarity but is not itself disinfection. Keep “filtered” and “treated” as separate states in your log so a person on the next shift does not drink water that was only clarified.\n\n## Containers can re-contaminate treated water\nClean and sanitize storage containers before filling them, avoid dipping hands or cups into the reserve, and use a narrow opening or tap when possible. If a cap falls onto a dirty surface or floodwater reaches the outside and opening of the container, isolate it until it can be cleaned or replaced. The treatment history is only useful if the water remains protected afterward.\n\n## Source anchors\n- EPA: Emergency disinfection of drinking water, updated 2026.\n- CDC: How to make water safe in an emergency.\n- CDC: Safe water storage practices."},"el":{"title":"Απολύμανση νερού σε έκτακτη ανάγκη: μέθοδοι και όρια ασφάλειας","body":"## Ξεκίνα από την αναγνώριση του κινδύνου\nΗ απολύμανση έκτακτης ανάγκης στοχεύει κυρίως παθογόνους μικροοργανισμούς. Δεν αφαιρεί αξιόπιστα καύσιμα, διαλύτες, φυτοφάρμακα, αλάτι, πολλά μέταλλα ή άγνωστη βιομηχανική ρύπανση. Αν οι αρχές αναφέρουν χημικό ή ραδιολογικό κίνδυνο, χρησιμοποίησε την πηγή και τη μέθοδο που υποδεικνύουν. Μερικές φορές η ασφαλέστερη επιλογή είναι η πλήρης εγκατάλειψη μιας πηγής αντί για περισσότερη επεξεργασία άγνωστου νερού.\n\n## Το βράσιμο είναι η προτιμώμενη μέθοδος ελέγχου μικροβίων όταν είναι εφικτό\nΤο CDC θεωρεί το βράσιμο την καλύτερη οικιακή μέθοδο για εξουδετέρωση μικροβίων σε έκτακτη ανάγκη. Το διαυγές νερό φτάνει σε πλήρη βρασμό για ένα λεπτό ή για τρία λεπτά σε μεγάλο υψόμετρο σύμφωνα με τη σχετική καθοδήγηση. Καύσιμο, αερισμός, κίνδυνος εγκαύματος και ασφαλής ψύξη/αποθήκευση είναι μέρος της διαδικασίας· μια μέθοδος που προκαλεί φωτιά, μονοξείδιο ή έγκαυμα δεν θεωρείται επιτυχής.\n\n## Η χημική απολύμανση απαιτεί την πραγματική ετικέτα και συγκέντρωση\nEPA και CDC δίνουν μεθόδους με οικιακή χλωρίνη, αλλά η σωστή ποσότητα εξαρτάται από τη συγκέντρωση υποχλωριώδους νατρίου και την κατάσταση του νερού. Εξετάζεται μόνο απλή, άοσμη χλωρίνη κατάλληλη για απολύμανση· αρωματισμένα, χρωματικά ασφαλή ή προϊόντα με πρόσθετα καθαριστικά μπορεί να είναι ακατάλληλα. Επειδή οι συγκεντρώσεις προϊόντων αλλάζουν, φύλαξε το πραγματικό δοχείο και τις τρέχουσες επίσημες οδηγίες μαζί αντί να απομνημονεύεις μία «καθολική» δοσολογία.\n\n## Το θολό νερό χρειάζεται προεπεξεργασία\nΤα αιωρούμενα σωματίδια δυσκολεύουν τη μέτρηση και μπορούν να προστατεύουν μικροοργανισμούς. Άφησε το ίζημα να καθίσει ή πέρασε το νερό από καθαρό ύφασμα, χαρτί κουζίνας ή φίλτρο καφέ πριν από την επαληθευμένη απολύμανση. Αυτή η κίνηση βελτιώνει τη διαύγεια αλλά δεν είναι απολύμανση. Στην καταγραφή κράτα χωριστές τις καταστάσεις «φιλτραρισμένο» και «επεξεργασμένο».\n\n## Τα δοχεία μπορούν να μολύνουν ξανά το επεξεργασμένο νερό\nΚαθάρισε και απολύμανε τα δοχεία πριν από τη χρήση, μην βάζεις χέρια ή ποτήρια μέσα στο απόθεμα και προτίμησε στενό στόμιο ή βρυσάκι. Αν το πώμα πέσει σε βρώμικη επιφάνεια ή πλημμυρικό νερό φτάσει στο στόμιο, απομόνωσε το δοχείο μέχρι να καθαριστεί ή να αντικατασταθεί. Το ιστορικό επεξεργασίας έχει αξία μόνο αν προστατεύεται και η μετέπειτα αποθήκευση.\n\n## Πηγές αναφοράς\n- EPA: απολύμανση πόσιμου νερού σε έκτακτη ανάγκη, ενημέρωση 2026.\n- CDC: ασφαλές νερό σε έκτακτη ανάγκη.\n- CDC: ασφαλής αποθήκευση νερού."}},{"id":4,"en":{"title":"Floodwater, private wells, and household water isolation","body":"## Treat flooding as a source-contamination event\nFloodwater can carry sewage, fuel, agricultural chemicals, debris, and microorganisms. A well that has been submerged or surrounded by floodwater should not be assumed safe because the water looks clear. Isolate the well from normal household use and use a known safe alternative until the well can be assessed, disinfected where appropriate, and tested according to local health or water authority guidance.\n\n## Protect people from the electrical and structural hazards first\nDo not walk into a flooded pump room or basement to reach a well switch, pressure tank, or water heater if electrical equipment may be energised. Flood cleanup creates combined risks: contaminated water, unstable floors, sharp debris, mould, damaged wiring, and fuel or chemical containers. The water problem does not justify entering an unsafe space.\n\n## Separate potable, cleaning, and discard streams\nDuring recovery, label water by intended use. Known safe bottled or properly treated water should be protected for drinking and food use. Other water may be acceptable for limited cleaning only if the local authority says so. Water exposed to chemicals or sewage should not be “upgraded” by guesswork. Use the Water Batch system to keep source and status visible.\n\n## Private-well recovery needs verification\nA flooded well can need inspection of the casing, cap, electrical system, pump, and surrounding contamination pathways. Disinfection and testing are technical steps that vary with the well and local rules. Do not treat a single home chlorine procedure as proof of safety; testing after recovery is the decision point. If there is damage to the well head, casing, or electrical components, professional evaluation becomes more important.\n\n## Household plumbing can retain contaminated water\nEven after the external source is restored, building plumbing, softeners, filters, water heaters, ice makers, and connected appliances may contain old water. Follow the utility or health department’s flushing and cleaning instructions. Keep records of when the property switched back from emergency water so a later illness investigation or maintenance check has a clear timeline.\n\n## Source anchors\n- CDC: Flood and drinking-water emergency guidance.\n- EPA: Private well and emergency disinfection information.\n- Local water utility or public-health authority."},"el":{"title":"Πλημμυρικό νερό, ιδιωτικά πηγάδια και απομόνωση οικιακής παροχής","body":"## Αντιμετώπισε την πλημμύρα ως συμβάν ρύπανσης της πηγής\nΤο πλημμυρικό νερό μπορεί να μεταφέρει λύματα, καύσιμα, γεωργικά χημικά, μπάζα και μικροοργανισμούς. Πηγάδι που καλύφθηκε ή περικυκλώθηκε από πλημμύρα δεν θεωρείται ασφαλές επειδή το νερό φαίνεται καθαρό. Απομόνωσέ το από την κανονική οικιακή χρήση και χρησιμοποίησε γνωστή ασφαλή εναλλακτική μέχρι να γίνει αξιολόγηση, κατάλληλη απολύμανση όπου απαιτείται και εργαστηριακός έλεγχος σύμφωνα με τις τοπικές υγειονομικές οδηγίες.\n\n## Πρώτα προστάτεψε τους ανθρώπους από ηλεκτρικούς και δομικούς κινδύνους\nΜην μπεις σε πλημμυρισμένο αντλιοστάσιο ή υπόγειο για να φτάσεις διακόπτη, πιεστικό ή θερμοσίφωνα αν μπορεί να υπάρχει τάση. Η αποκατάσταση μετά από πλημμύρα συνδυάζει μολυσμένο νερό, ασταθή δάπεδα, αιχμηρά αντικείμενα, μούχλα, κατεστραμμένη καλωδίωση και δοχεία καυσίμων ή χημικών. Η ανάγκη νερού δεν δικαιολογεί είσοδο σε επικίνδυνο χώρο.\n\n## Χώρισε πόσιμο νερό, νερό καθαρισμού και απορριπτέο νερό\nΚατά την αποκατάσταση, σήμανε κάθε παρτίδα ανά χρήση. Γνωστό ασφαλές εμφιαλωμένο ή σωστά επεξεργασμένο νερό προστατεύεται για πόση και τρόφιμα. Άλλη πηγή μπορεί να χρησιμοποιηθεί μόνο για περιορισμένο καθαρισμό αν το επιτρέπει η αρμόδια αρχή. Νερό με λύματα ή χημικά δεν «αναβαθμίζεται» με αυτοσχέδιες μεθόδους. Η Καταγραφή Παρτίδων κρατά ορατή την πηγή και την κατάσταση.\n\n## Η αποκατάσταση ιδιωτικού πηγαδιού απαιτεί επαλήθευση\nΜετά από πλημμύρα μπορεί να χρειάζεται έλεγχος σωλήνωσης, κεφαλής, ηλεκτρικού συστήματος, αντλίας και πιθανών διαδρομών ρύπανσης. Η απολύμανση και οι δοκιμές διαφέρουν ανά εγκατάσταση και τοπικούς κανόνες. Μην θεωρείς ότι μία εφαρμογή χλωρίου αποτελεί απόδειξη ασφάλειας· το αποτέλεσμα επιβεβαιώνεται με τον κατάλληλο έλεγχο. Ζημιά στην κεφαλή, στον σωλήνα ή στα ηλεκτρικά αυξάνει την ανάγκη επαγγελματικής αξιολόγησης.\n\n## Η εσωτερική εγκατάσταση κρατά παλιό νερό\nΑκόμη και όταν αποκατασταθεί η εξωτερική πηγή, σωληνώσεις, αποσκληρυντές, φίλτρα, θερμοσίφωνες, παγομηχανές και συνδεδεμένες συσκευές μπορούν να περιέχουν προηγούμενο νερό. Ακολούθησε τις οδηγίες έκπλυσης και καθαρισμού της ύδρευσης ή της δημόσιας υγείας. Κατέγραψε πότε το κτίριο επέστρεψε στην κανονική παροχή ώστε να υπάρχει σαφές ιστορικό.\n\n## Πηγές αναφοράς\n- CDC: πλημμύρες και έκτακτες ανάγκες πόσιμου νερού.\n- EPA: ιδιωτικά πηγάδια και απολύμανση έκτακτης ανάγκης.\n- Τοπική ύδρευση ή αρμόδια υγειονομική υπηρεσία."}},{"id":5,"en":{"title":"Safe water storage and dispensing hygiene","body":"## The last metre matters\nWater can be treated correctly and still become unsafe at the point of storage or serving. The container, cap, tap, cup, hands, and work surface are part of the treatment chain. Use containers that can be fully cleaned and closed. Avoid vessels previously used for fuel, pesticides, or non-food chemicals, because disinfection does not make those residues acceptable for drinking-water storage.\n\n## Cleaning and sanitizing containers\nCDC safe-storage guidance separates washing from sanitizing. First remove visible dirt with soap and clean water, rinse completely, then sanitize using a verified chlorine solution or other approved method for the container. Make sure the sanitizing solution contacts the internal surfaces, then follow the official drain/rinse instructions for that method. Record which containers have completed the process rather than relying on appearance.\n\n## Dispensing without recontamination\nA narrow mouth, spigot, or pour method is safer than repeatedly dipping a cup or hand into the container. Keep the dispensing point off the floor and away from toilet, waste, raw-food, and animal-care areas. If several households share water, assign one clean dispensing surface and provide a separate place for used cups and bottles so the clean side and dirty side do not merge.\n\n## Protect stored water from heat and chemicals\nKeep containers in the coolest practical protected location, out of direct sunlight and away from fuels, paints, cleaners, pesticides, batteries, or other chemicals. Do not store a bottle directly in flood-prone floor areas if it can be elevated safely. Inspect caps, seals, bulging, cracking, odour, and external contamination during routine checks.\n\n## Traceability after an incident\nIf one container is dropped, opened by an unknown person, or exposed to dirty floodwater, isolate that container without automatically discarding the entire reserve. A simple label with source, fill date, treatment, and status lets the household make a narrow decision instead of losing confidence in every container.\n\n## Source anchors\n- CDC: Safe water storage.\n- CDC: Emergency water supply guidance.\n- WHO: Household water, sanitation and hygiene principles."},"el":{"title":"Ασφαλής αποθήκευση νερού και υγιεινή κατά τη διανομή","body":"## Το τελευταίο μέτρο της αλυσίδας έχει σημασία\nΝερό που επεξεργάστηκε σωστά μπορεί να μολυνθεί ξανά κατά την αποθήκευση ή το σερβίρισμα. Δοχείο, πώμα, βρυσάκι, ποτήρι, χέρια και επιφάνεια εργασίας αποτελούν μέρος της διαδικασίας. Χρησιμοποίησε δοχεία που καθαρίζονται πλήρως και κλείνουν καλά. Μην επαναχρησιμοποιείς δοχεία καυσίμων, φυτοφαρμάκων ή μη διατροφικών χημικών, γιατί η απολύμανση δεν κάνει τα κατάλοιπά τους κατάλληλα για πόσιμο νερό.\n\n## Καθαρισμός και απολύμανση δοχείων\nΗ καθοδήγηση του CDC ξεχωρίζει το πλύσιμο από την απολύμανση. Αφαίρεσε πρώτα τη βρωμιά με σαπούνι και καθαρό νερό, ξέπλυνε πλήρως και στη συνέχεια χρησιμοποίησε επαληθευμένη μέθοδο απολύμανσης κατάλληλη για το δοχείο. Η επιφάνεια πρέπει να έρθει σε επαφή με το απολυμαντικό και να ακολουθηθούν οι επίσημες οδηγίες για στράγγισμα ή ξέπλυμα. Σήμανε ποια δοχεία ολοκλήρωσαν τη διαδικασία αντί να βασίζεσαι στην εμφάνιση.\n\n## Διανομή χωρίς επαναμόλυνση\nΣτενό στόμιο, βρυσάκι ή ελεγχόμενη έκχυση είναι ασφαλέστερα από το συνεχές βύθισμα ποτηριού ή χεριού. Κράτα το σημείο διανομής μακριά από δάπεδο, τουαλέτα, απορρίμματα, ωμά τρόφιμα και χώρους φροντίδας ζώων. Όταν μοιράζονται νερό πολλά άτομα, όρισε μία καθαρή επιφάνεια διανομής και ξεχωριστό σημείο για χρησιμοποιημένα ποτήρια και μπουκάλια.\n\n## Προστασία από θερμότητα και χημικά\nΦύλαξε τα δοχεία στο πιο δροσερό πρακτικό προστατευμένο σημείο, εκτός άμεσου ήλιου και μακριά από καύσιμα, μπογιές, καθαριστικά, φυτοφάρμακα, μπαταρίες ή άλλες χημικές ουσίες. Μην τα αφήνεις σε δάπεδο που πλημμυρίζει όταν υπάρχει ασφαλής δυνατότητα ανύψωσης. Έλεγχε τακτικά πώματα, σφραγίδες, ρωγμές, παραμόρφωση, οσμή και εξωτερική ρύπανση.\n\n## Ιχνηλασιμότητα μετά από συμβάν\nΑν ένα δοχείο πέσει, ανοιχτεί από άγνωστο άτομο ή βραχεί με βρώμικο πλημμυρικό νερό, απομόνωσε μόνο αυτό χωρίς να θεωρήσεις αυτόματα ακατάλληλο όλο το απόθεμα. Μια ετικέτα με πηγή, ημερομηνία πλήρωσης, επεξεργασία και κατάσταση επιτρέπει στο νοικοκυριό να πάρει στοχευμένη απόφαση.\n\n## Πηγές αναφοράς\n- CDC: ασφαλής αποθήκευση νερού.\n- CDC: οδηγίες αποθέματος νερού έκτακτης ανάγκης.\n- WHO: αρχές νερού, αποχέτευσης και υγιεινής."}},{"id":6,"en":{"title":"Hygiene when clean water is limited","body":"## Prioritise the health-critical uses\nA water shortage is not simply a drinking problem. Hand hygiene, food preparation, oral care, wound care, toilet cleaning, infant care, and some medical equipment can all depend on safe water. Make a use hierarchy before the shortage becomes severe. Protect drinking and medically necessary water first, then allocate other water according to the actual contamination risk of each task rather than splitting the reserve evenly.\n\n## Create clean and dirty work zones\nIn a small apartment or shelter, designate one surface for clean water containers and prepared food, and another for waste, used washing water, dirty shoes, pet equipment, and cleaning tools. The physical separation can be only a few metres, but it should be obvious. Colour tape, labels, or different containers reduce the chance that a person under stress fills a clean bottle from the wrong bucket.\n\n## Hand hygiene under constraint\nUse safe running water and soap when available. Where water is limited, follow current public-health guidance on alcohol-based hand sanitizer for appropriate situations, while remembering that sanitizer does not remove every type of contamination and is not a replacement when hands are visibly dirty or contaminated by certain hazards. Preserve enough clean water for washing after toilet use, before food handling, and for caregiving tasks where contamination consequences are highest.\n\n## Reuse grey water cautiously\nWater used for washing may have limited secondary uses, but only where local health guidance allows it and where it cannot be confused with drinking water. Never store grey water in a container normally used for drinking without unmistakable labelling. Avoid using contaminated wash water where aerosols, splashing, or contact with food surfaces can spread pathogens.\n\n## Monitor depletion by task\nInstead of recording only “litres remaining,” note the major uses each day. A sudden increase may reveal a leak, diarrhoeal illness, heat stress, or sanitation failure. That makes the water log an early-warning tool rather than a passive inventory.\n\n## Source anchors\n- CDC: Water, sanitation, and hygiene emergencies.\n- WHO: WASH and emergency sanitation principles."},"el":{"title":"Υγιεινή όταν το καθαρό νερό είναι περιορισμένο","body":"## Δώσε προτεραιότητα στις χρήσεις με τη μεγαλύτερη επίδραση στην υγεία\nΗ έλλειψη νερού δεν αφορά μόνο την πόση. Υγιεινή χεριών, προετοιμασία φαγητού, στοματική φροντίδα, φροντίδα τραύματος, καθαρισμός τουαλέτας, βρεφική φροντίδα και ορισμένος ιατρικός εξοπλισμός μπορεί να εξαρτώνται από ασφαλές νερό. Δημιούργησε ιεράρχηση πριν γίνει κρίσιμη η έλλειψη. Προστάτεψε πρώτα το νερό πόσης και τις ιατρικά αναγκαίες χρήσεις και κατόπιν μοίρασε το υπόλοιπο ανάλογα με τον πραγματικό κίνδυνο μόλυνσης κάθε εργασίας.\n\n## Δημιούργησε καθαρές και βρώμικες ζώνες\nΣε μικρό διαμέρισμα ή καταφύγιο, όρισε μία επιφάνεια για καθαρά δοχεία και έτοιμο φαγητό και άλλη για απορρίμματα, χρησιμοποιημένο νερό, βρώμικα παπούτσια, εξοπλισμό ζώων και εργαλεία καθαρισμού. Η απόσταση μπορεί να είναι μικρή, αλλά ο διαχωρισμός πρέπει να είναι προφανής. Χρωματιστή ταινία, ετικέτες ή διαφορετικά δοχεία μειώνουν την πιθανότητα να γεμίσει κάποιος καθαρό μπουκάλι από λάθος κουβά.\n\n## Υγιεινή χεριών με περιορισμένους πόρους\nΧρησιμοποίησε ασφαλές τρεχούμενο νερό και σαπούνι όταν είναι διαθέσιμα. Όταν το νερό είναι περιορισμένο, ακολούθησε τις τρέχουσες οδηγίες δημόσιας υγείας για αλκοολούχο αντισηπτικό στις κατάλληλες περιπτώσεις, έχοντας υπόψη ότι δεν αφαιρεί κάθε μορφή ρύπανσης και δεν αντικαθιστά το πλύσιμο όταν τα χέρια είναι εμφανώς βρώμικα ή έχουν συγκεκριμένους ρύπους. Προστάτεψε επαρκές καθαρό νερό για μετά την τουαλέτα, πριν από τρόφιμα και για φροντίδα ευάλωτων ατόμων.\n\n## Προσεκτική δευτερογενής χρήση νερού πλύσης\nΝερό που χρησιμοποιήθηκε για πλύσιμο μπορεί να έχει περιορισμένες δεύτερες χρήσεις μόνο όταν αυτό επιτρέπεται από τις υγειονομικές οδηγίες και δεν υπάρχει κίνδυνος σύγχυσης με πόσιμο νερό. Μην το αποθηκεύεις σε δοχείο που συνήθως χρησιμοποιείται για πόση χωρίς απόλυτα σαφή σήμανση. Απόφυγε χρήση όπου ψεκασμός ή πιτσιλιές μπορούν να μεταφέρουν παθογόνα σε τρόφιμα ή καθαρές επιφάνειες.\n\n## Παρακολούθησε την κατανάλωση ανά εργασία\nΜην καταγράφεις μόνο «λίτρα που απομένουν». Σημείωσε τις μεγάλες χρήσεις της ημέρας. Ξαφνική αύξηση μπορεί να υποδεικνύει διαρροή, διαρροϊκή νόσο, θερμική καταπόνηση ή βλάβη αποχέτευσης. Έτσι η καταγραφή γίνεται εργαλείο έγκαιρης προειδοποίησης.\n\n## Πηγές αναφοράς\n- CDC: έκτακτες ανάγκες νερού, αποχέτευσης και υγιεινής.\n- WHO: αρχές WASH και αποχέτευσης σε έκτακτες ανάγκες."}},{"id":7,"en":{"title":"Toilet and sewer failure in an occupied home","body":"## Recognise the transition from inconvenience to sanitation incident\nA toilet that will not flush because water is off is different from a sewer that is backing up into the building. Slow drains, gurgling fixtures, sewage odour, wastewater appearing in a low drain, or instructions from the utility can indicate a system problem. Reduce water use immediately if discharge could worsen a backup, and keep children, pets, food, and clean water away from contaminated areas.\n\n## Isolate the contaminated zone\nIf sewage enters a bathroom, basement, or floor drain, treat the affected space as dirty. Prevent foot traffic from carrying contamination into sleeping or food areas. Use dedicated footwear and cleaning tools, and keep the clean-water dispensing area physically separate. Do not use household electrical equipment in wet zones until electrical safety has been established.\n\n## Temporary toilet planning\nWhen a toilet cannot be used, follow local public-health or civil-protection instructions for temporary sanitation. The practical plan needs a private location, a way to contain excreta, absorbent or lining materials where recommended, hand-cleaning capability, and a disposal route that is allowed in your area. Do not improvise disposal into storm drains, streams, shorelines, or places where waste can contaminate water sources.\n\n## Consumables become a tracked resource\nToilet paper, heavy bags or approved liners, gloves, soap, disinfectant, absorbent material, and waste storage space can become limiting factors before the toilet itself does. Record stock and daily use. The Sanitation Operations module can mark a facility as ready, limited, needing service, or unusable, preventing another person from assuming it is functional.\n\n## Recovery after service returns\nDo not declare the sanitation incident finished only because water runs again. Follow utility instructions for flushing, cleanup, and sewer service. Contaminated porous materials may require disposal, and severe sewage contamination can need professional remediation. Record the affected area and date so later cleaning or health concerns have context.\n\n## Source anchors\n- CDC: Water, sanitation and hygiene emergencies.\n- WHO: Sanitation and emergency environmental health.\n- Local wastewater utility and public-health authority."},"el":{"title":"Βλάβη τουαλέτας και αποχέτευσης σε κατοικημένο σπίτι","body":"## Αναγνώρισε πότε η ενόχληση γίνεται υγειονομικό συμβάν\nΜια τουαλέτα που δεν ξεπλένει επειδή κόπηκε το νερό διαφέρει από αποχέτευση που επιστρέφει λύματα στο κτίριο. Αργή ροή, γουργούρισμα, οσμή λυμάτων, εμφάνιση νερού σε χαμηλό σιφόνι ή ανακοίνωση της υπηρεσίας μπορούν να δείχνουν βλάβη του συστήματος. Περιόρισε άμεσα την κατανάλωση νερού αν η αποχέτευση μπορεί να επιδεινωθεί και κράτησε παιδιά, ζώα, τρόφιμα και καθαρό νερό μακριά από μολυσμένους χώρους.\n\n## Απομόνωσε τη μολυσμένη ζώνη\nΑν λύματα μπουν σε μπάνιο, υπόγειο ή σιφόνι, θεώρησε την περιοχή βρώμικη. Μείωσε την κυκλοφορία ώστε παπούτσια να μη μεταφέρουν μόλυνση σε υπνοδωμάτια ή χώρο τροφίμων. Χρησιμοποίησε ξεχωριστά υποδήματα και εργαλεία καθαρισμού και κράτησε τη διανομή καθαρού νερού σε διαφορετικό σημείο. Μην χρησιμοποιείς ηλεκτρικές συσκευές σε βρεγμένους χώρους μέχρι να επιβεβαιωθεί η ηλεκτρική ασφάλεια.\n\n## Προσωρινός σχεδιασμός τουαλέτας\nΌταν η τουαλέτα δεν μπορεί να χρησιμοποιηθεί, ακολούθησε τις οδηγίες δημόσιας υγείας ή Πολιτικής Προστασίας για προσωρινή υγιεινή. Το σχέδιο χρειάζεται ιδιωτικό σημείο, τρόπο συγκράτησης αποβλήτων, κατάλληλη επένδυση ή απορροφητικό υλικό όπου συστήνεται, δυνατότητα καθαρισμού χεριών και επιτρεπόμενη διαδρομή απόρριψης. Μην αυτοσχεδιάζεις διάθεση σε φρεάτια ομβρίων, ρέματα, ακτές ή σημεία που μπορούν να μολύνουν νερό.\n\n## Τα αναλώσιμα γίνονται κρίσιμος πόρος\nΧαρτί υγείας, ανθεκτικές σακούλες ή εγκεκριμένες επενδύσεις, γάντια, σαπούνι, απολυμαντικό, απορροφητικό υλικό και ασφαλής χώρος προσωρινής φύλαξης μπορεί να τελειώσουν πριν λυθεί η βλάβη. Κατέγραψε απόθεμα και ημερήσια χρήση. Η ενότητα Αποχέτευσης μπορεί να χαρακτηρίζει μια εγκατάσταση έτοιμη, περιορισμένη, προς συντήρηση ή μη χρησιμοποιήσιμη.\n\n## Αποκατάσταση μετά την επιστροφή της υπηρεσίας\nΜην θεωρήσεις ότι το συμβάν τελείωσε μόνο επειδή επανήλθε το νερό. Ακολούθησε τις οδηγίες της υπηρεσίας για έκπλυση, καθαρισμό και λειτουργία του δικτύου. Πορώδη υλικά που μολύνθηκαν μπορεί να χρειάζονται απόρριψη και σοβαρή ρύπανση από λύματα επαγγελματική αποκατάσταση. Κατέγραψε τον χώρο και την ημερομηνία για μεταγενέστερο έλεγχο.\n\n## Πηγές αναφοράς\n- CDC: έκτακτες ανάγκες νερού, αποχέτευσης και υγιεινής.\n- WHO: αποχέτευση και περιβαλλοντική υγεία σε καταστροφές.\n- Τοπική υπηρεσία αποχέτευσης και δημόσιας υγείας."}},{"id":8,"en":{"title":"Hand hygiene and food-zone control during disruption","body":"## Build a flow, not just a cleaning rule\nDuring an outage or evacuation, the same small table may be used for food, medical items, charging, and dirty equipment. That is a cross-contamination problem. Designate a clean food surface and keep raw foods, waste, pet bowls, used first-aid material, and toilet supplies away from it. If space is extremely limited, separate uses by time and disinfect the surface between them rather than allowing simultaneous tasks.\n\n## Handwashing points need four elements\nA practical handwashing station needs safe water, soap, a controlled way for water to flow over the hands, and a way to keep wastewater from pooling in the clean zone. A shared basin of standing water can transfer contamination between users. Place the station where people naturally pass after the toilet and before food preparation, not in a distant location that will be skipped when everyone is tired.\n\n## Sanitizer has limits\nAlcohol-based sanitizer is useful in many situations when soap and water are not immediately available, but it is not universal. Public-health guidance still prioritises washing when hands are visibly dirty, after certain contamination events, and before tasks where residue matters. Keep sanitizer as a complement to a functioning handwashing plan, not as the only hygiene resource.\n\n## Protect high-risk foods and people\nInfant feeding equipment, allergy-safe preparation, medically necessary diets, and food for immunocompromised people deserve a clearly protected preparation area. Use separate utensils or carefully cleaned equipment when cross-contact could cause harm. If refrigeration or safe water is uncertain, simplify meals rather than increasing the number of preparation steps.\n\n## Audit the flow once per shift\nWatch one actual meal-preparation cycle. Where do hands touch before the clean surface? Where are dirty utensils placed? Does the water container tap touch cups? Does someone handle rubbish and then food? A short observation can reveal more than a long written rule and can be added to the field log as a corrective action.\n\n## Source anchors\n- CDC: Emergency WASH guidance.\n- WHO: Five Keys to Safer Food.\n- WHO: Water, sanitation and hygiene."},"el":{"title":"Υγιεινή χεριών και έλεγχος ζώνης τροφίμων σε διακοπή υπηρεσιών","body":"## Δημιούργησε ροή εργασίας, όχι μόνο κανόνα καθαρισμού\nΣε διακοπή ρεύματος ή εκκένωση, το ίδιο μικρό τραπέζι μπορεί να χρησιμοποιείται για τρόφιμα, ιατρικά αντικείμενα, φόρτιση και βρώμικο εξοπλισμό. Αυτό δημιουργεί διασταυρούμενη μόλυνση. Όρισε καθαρή επιφάνεια τροφίμων και κράτα ωμά τρόφιμα, απορρίμματα, μπολ ζώων, χρησιμοποιημένα υλικά πρώτων βοηθειών και είδη τουαλέτας μακριά. Αν ο χώρος είναι πολύ μικρός, χώρισε τις χρήσεις χρονικά και απολύμανε την επιφάνεια ανάμεσα στις εργασίες.\n\n## Ένα σημείο πλυσίματος χεριών χρειάζεται τέσσερα στοιχεία\nΧρειάζεται ασφαλές νερό, σαπούνι, ελεγχόμενη ροή πάνω στα χέρια και τρόπο να μη λιμνάζει το χρησιμοποιημένο νερό στην καθαρή ζώνη. Κοινή λεκάνη με στάσιμο νερό μπορεί να μεταφέρει μόλυνση μεταξύ χρηστών. Τοποθέτησε το σημείο εκεί όπου οι άνθρωποι περνούν φυσικά μετά την τουαλέτα και πριν από την προετοιμασία φαγητού, όχι σε απομακρυσμένο χώρο που θα παραλείπεται όταν υπάρχει κόπωση.\n\n## Το αντισηπτικό έχει όρια\nΤο αλκοολούχο αντισηπτικό είναι χρήσιμο σε πολλές περιπτώσεις όταν δεν υπάρχει άμεσα σαπούνι και νερό, αλλά δεν αποτελεί καθολική λύση. Οι οδηγίες δημόσιας υγείας συνεχίζουν να δίνουν προτεραιότητα στο πλύσιμο όταν τα χέρια είναι εμφανώς βρώμικα, μετά από ορισμένες μορφές μόλυνσης και πριν από εργασίες όπου τα κατάλοιπα έχουν σημασία. Κράτησέ το ως συμπλήρωμα και όχι ως μοναδικό μέσο υγιεινής.\n\n## Προστάτεψε τρόφιμα και άτομα υψηλού κινδύνου\nΕξοπλισμός βρεφικής σίτισης, παρασκευή χωρίς αλλεργιογόνα, ιατρικά απαιτούμενη διατροφή και φαγητό για ανοσοκατεσταλμένα άτομα χρειάζονται σαφώς προστατευμένο σημείο. Χρησιμοποίησε ξεχωριστά σκεύη ή προσεκτικά καθαρισμένο εξοπλισμό όταν η διασταυρούμενη επαφή μπορεί να προκαλέσει βλάβη. Αν ψύξη ή ασφαλές νερό είναι αβέβαια, απλοποίησε τα γεύματα αντί να αυξάνεις τα στάδια παρασκευής.\n\n## Έλεγξε τη ροή μία φορά ανά βάρδια\nΠαρατήρησε έναν πραγματικό κύκλο προετοιμασίας γεύματος. Τι αγγίζουν τα χέρια πριν από την καθαρή επιφάνεια; Πού μπαίνουν τα βρώμικα σκεύη; Ακουμπά το στόμιο του δοχείου στα ποτήρια; Χειρίζεται κάποιος σκουπίδια και μετά τρόφιμα; Μια σύντομη παρατήρηση μπορεί να αποκαλύψει περισσότερα από έναν μεγάλο κατάλογο κανόνων.\n\n## Πηγές αναφοράς\n- CDC: υγιεινή σε έκτακτες ανάγκες.\n- WHO: Πέντε Κλειδιά για Ασφαλέστερα Τρόφιμα.\n- WHO: νερό, αποχέτευση και υγιεινή."}},{"id":9,"en":{"title":"Waste accumulation, vectors, and pest control during service interruption","body":"## Waste becomes an environmental-health problem quickly\nWhen municipal collection stops, household rubbish shifts from a convenience issue to a storage and pest-management problem. Food scraps, nappies, animal waste, and contaminated cleanup materials create odour, insects, rodents, leakage, and contact hazards. Separate these from clean recyclables and dry packaging so the highest-risk waste occupies the smallest controlled volume.\n\n## Choose a temporary storage point deliberately\nThe temporary waste area should be away from drinking-water storage, food preparation, children’s play, sleeping spaces, and heat or flame. It should not block an exit or emergency access. Protect bags or bins from animals and rain, and avoid placing them where floodwater could carry contents into the home or drainage system.\n\n## Reduce volume without creating new hazards\nFlatten clean boxes and containers, but do not crush glass, sharp metal, batteries, aerosol cans, unknown chemical containers, or medical sharps. Keep damaged lithium batteries isolated from ordinary rubbish because they can become a fire hazard. Follow local instructions for hazardous and medical waste rather than mixing them into general household waste.\n\n## Monitor signs of pest activity\nGnaw marks, droppings, flies, larvae, ants, or torn bags mean the storage method needs adjustment. Remove food residue from the clean living area promptly, close containers, and correct water leaks or standing water. Avoid indiscriminate pesticide use in occupied, poorly ventilated shelters, especially around children, food, or pets.\n\n## Re-entry into normal collection\nWhen collection resumes, do not move every bag at once if doing so blocks stairs or contaminates clean routes. Stage removal in small loads, clean the storage area afterward, and record any hazardous containers that need a separate disposal route.\n\n## Source anchors\n- WHO: Environmental health in emergencies and disasters.\n- CDC: Emergency sanitation and cleanup guidance.\n- Local municipal waste authority."},"el":{"title":"Συσσώρευση απορριμμάτων, φορείς νόσων και έλεγχος παρασίτων","body":"## Τα απορρίμματα γίνονται γρήγορα ζήτημα περιβαλλοντικής υγείας\nΌταν σταματήσει η δημοτική συλλογή, τα σκουπίδια παύουν να είναι απλή ενόχληση και γίνονται πρόβλημα αποθήκευσης και παρασίτων. Υπολείμματα τροφών, πάνες, περιττώματα ζώων και μολυσμένα υλικά καθαρισμού προκαλούν οσμή, έντομα, τρωκτικά, διαρροές και επαφή με ρύπους. Χώρισέ τα από καθαρές ανακυκλώσιμες συσκευασίες ώστε το πιο επικίνδυνο υλικό να καταλαμβάνει μικρότερο και ελεγχόμενο όγκο.\n\n## Επίλεξε συνειδητά προσωρινό σημείο φύλαξης\nΟ χώρος απορριμμάτων πρέπει να απέχει από πόσιμο νερό, προετοιμασία φαγητού, παιχνίδι παιδιών, ύπνο και πηγές θερμότητας ή φλόγας. Δεν πρέπει να κλείνει έξοδο ή πρόσβαση έκτακτης ανάγκης. Προστάτεψε σακούλες και κάδους από ζώα και βροχή και μην τα τοποθετείς εκεί όπου πλημμυρικό νερό μπορεί να μεταφέρει το περιεχόμενο στο σπίτι ή στο δίκτυο απορροής.\n\n## Μείωσε τον όγκο χωρίς να δημιουργείς νέους κινδύνους\nΔίπλωσε καθαρά χαρτόκουτα και συσκευασίες, αλλά μην συνθλίβεις γυαλί, αιχμηρό μέταλλο, μπαταρίες, αεροζόλ, άγνωστα χημικά δοχεία ή αιχμηρά ιατρικά αντικείμενα. Κατεστραμμένες μπαταρίες λιθίου χρειάζονται απομόνωση από τα κοινά σκουπίδια λόγω κινδύνου φωτιάς. Ακολούθησε τοπικές οδηγίες για επικίνδυνα και ιατρικά απόβλητα.\n\n## Παρακολούθησε ενδείξεις παρασίτων\nΔαγκώματα, περιττώματα, μύγες, προνύμφες, μυρμήγκια ή σκισμένες σακούλες δείχνουν ότι η αποθήκευση χρειάζεται αλλαγή. Απομάκρυνε υπολείμματα τροφών από τον καθαρό χώρο, κλείσε τα δοχεία και διόρθωσε διαρροές ή στάσιμο νερό. Απόφυγε αδιάκριτη χρήση φυτοφαρμάκων σε κατοικημένους, κακώς αεριζόμενους χώρους, ειδικά κοντά σε παιδιά, τρόφιμα ή ζώα.\n\n## Επιστροφή στην κανονική συλλογή\nΌταν επανέλθει η υπηρεσία, μην μετακινήσεις όλες τις σακούλες ταυτόχρονα αν αυτό μπλοκάρει σκάλες ή μολύνει καθαρές διαδρομές. Απομάκρυνέ τες σε μικρές παρτίδες, καθάρισε το σημείο και κατέγραψε επικίνδυνα δοχεία που χρειάζονται ξεχωριστή διάθεση.\n\n## Πηγές αναφοράς\n- WHO: περιβαλλοντική υγεία σε έκτακτες ανάγκες και καταστροφές.\n- CDC: υγιεινή και καθαρισμός σε έκτακτες ανάγκες.\n- Τοπική δημοτική υπηρεσία απορριμμάτων."}},{"id":10,"en":{"title":"Water planning during extreme heat and physical work","body":"## Heat changes both demand and risk\nA household water plan based on mild indoor conditions can fail quickly during a heatwave, evacuation on foot, cleanup work, or a power outage without cooling. CDC emergency-water guidance explicitly notes that hot climates and some health conditions can require more than the basic reserve. Increase the protected supply before high-temperature periods instead of waiting until people are already dehydrated and transport is difficult.\n\n## Separate hydration planning from rationing pressure\nDo not create a rigid “everyone gets the same bottle” rule. Age, pregnancy, illness, medications, acclimatisation, work intensity, and heat exposure can change needs. Use the project to track stock and consumption while leaving individual medical requirements to qualified advice. If the available reserve cannot support safe conditions, reducing heat exposure, stopping heavy work, moving to a cooling location, or evacuating can be more important than stretching the water mathematically.\n\n## Work-rest-water coordination\nSchedule physically demanding tasks for cooler periods where possible. Put drinking water at the work area rather than forcing repeated long trips, and assign a second person to notice confusion, weakness, unusual behaviour, or loss of coordination. Heat illness can impair judgement before the person recognises their own decline. The operational plan should therefore connect weather/temperature, task duration, check-ins, and remaining water.\n\n## Protect the reserve from contamination\nIn hot conditions people drink more frequently, which increases handling. Use personal cups or bottles, avoid mouth contact with the main dispensing tap, and keep refill points shaded and clean. Do not leave emergency drinking water in a vehicle where extreme heat can damage containers or make access impossible during evacuation.\n\n## Escalation\nConfusion, collapse, loss of consciousness, seizures, or suspected heat stroke are medical emergencies. Move away from heat and activate emergency medical help; do not let an inventory calculation delay care. For Greece and the EU, 112 provides emergency access, while local heat instructions from civil-protection and health authorities take precedence over generic planning guidance.\n\n## Source anchors\n- CDC: Emergency water supply guidance.\n- Ready.gov: Extreme heat.\n- American Red Cross: Heat exhaustion and heat stroke resources.\n- Greek Civil Protection: Heatwave guidance."},"el":{"title":"Σχεδιασμός νερού σε καύσωνα και σωματική εργασία","body":"## Η ζέστη αλλάζει τόσο τη ζήτηση όσο και τον κίνδυνο\nΣχέδιο νερού που βασίζεται σε ήπιες εσωτερικές συνθήκες μπορεί να αποτύχει γρήγορα σε καύσωνα, εκκένωση με τα πόδια, εργασίες καθαρισμού ή διακοπή ρεύματος χωρίς ψύξη. Η καθοδήγηση του CDC επισημαίνει ότι θερμό κλίμα και ορισμένες ανάγκες υγείας μπορούν να απαιτούν περισσότερο νερό από το βασικό απόθεμα. Αύξησε την προστατευμένη ποσότητα πριν από περίοδο υψηλών θερμοκρασιών, όχι όταν η αφυδάτωση έχει ήδη αρχίσει και η μεταφορά έχει δυσκολέψει.\n\n## Χώρισε τον σχεδιασμό ενυδάτωσης από την πίεση «δελτίου»\nΜην εφαρμόζεις άκαμπτο κανόνα ίδιας ποσότητας για όλους. Ηλικία, εγκυμοσύνη, ασθένεια, φάρμακα, εγκλιματισμός, ένταση εργασίας και έκθεση στη ζέστη μεταβάλλουν τις ανάγκες. Χρησιμοποίησε το έργο για καταγραφή αποθέματος και κατανάλωσης, αφήνοντας τις ατομικές ιατρικές απαιτήσεις σε επαγγελματία. Αν το απόθεμα δεν επαρκεί για ασφαλείς συνθήκες, η μείωση εργασίας, η μετακίνηση σε χώρο δροσιάς ή η εκκένωση μπορεί να είναι σημαντικότερη από μαθηματική «παράταση» του νερού.\n\n## Συντόνισε εργασία, ανάπαυση και νερό\nΠρογραμμάτισε βαριές εργασίες στις πιο δροσερές ώρες όταν γίνεται. Βάλε νερό κοντά στο σημείο εργασίας και όρισε δεύτερο άτομο να παρατηρεί σύγχυση, αδυναμία, ασυνήθιστη συμπεριφορά ή απώλεια συντονισμού. Η θερμική νόσος μπορεί να μειώσει την κρίση πριν το αντιληφθεί ο ίδιος ο άνθρωπος. Το σχέδιο πρέπει να συνδέει θερμοκρασία, διάρκεια εργασίας, ελέγχους και υπόλοιπο νερού.\n\n## Προστάτεψε το απόθεμα από μόλυνση\nΣτη ζέστη οι άνθρωποι πίνουν συχνότερα και αυξάνεται ο χειρισμός. Χρησιμοποίησε ατομικά ποτήρια ή μπουκάλια, μην ακουμπά στόμα ή δοχείο στο κύριο βρυσάκι και κράτα το σημείο ανεφοδιασμού στη σκιά και καθαρό. Μην βασίζεσαι σε νερό που μένει μέσα σε όχημα όπου ακραία θερμοκρασία ή συνθήκες εκκένωσης μπορούν να το κάνουν μη προσβάσιμο.\n\n## Κλιμάκωση\nΣύγχυση, κατάρρευση, απώλεια συνείδησης, σπασμοί ή υποψία θερμοπληξίας είναι επείγοντα ιατρικά περιστατικά. Απομάκρυνε το άτομο από τη ζέστη και ενεργοποίησε επείγουσα ιατρική βοήθεια· μην αφήσεις έναν υπολογισμό αποθέματος να καθυστερήσει τη φροντίδα. Στην Ελλάδα και την ΕΕ το 112 είναι ο ενιαίος αριθμός έκτακτης ανάγκης, ενώ οι οδηγίες των αρμόδιων αρχών υπερισχύουν της γενικής καθοδήγησης.\n\n## Πηγές αναφοράς\n- CDC: οδηγίες αποθέματος νερού έκτακτης ανάγκης.\n- Ready.gov: ακραία ζέστη.\n- American Red Cross: θερμική εξάντληση και θερμοπληξία.\n- Ελληνική Πολιτική Προστασία: οδηγίες καύσωνα."}},{"id":11,"en":{"title":"Refrigeration outage food triage","body":"## Start the clock and keep doors closed\nA power outage becomes a food-safety event as soon as reliable refrigeration is lost. Record when power failed and avoid opening the refrigerator or freezer except for a planned retrieval. CDC guidance states that an unopened refrigerator keeps food safe for about four hours, while a full freezer can hold a safe temperature for about 48 hours and a half-full freezer about 24 hours if the door remains closed. These are planning limits, not permission to ignore actual temperatures or local public-health advice.\n\n## Use temperature history, not smell\nPathogenic bacteria may grow without changing a food’s appearance, smell, or taste. Do not taste questionable food to test it. A refrigerator or freezer thermometer gives much better evidence than intuition. If perishable food has been above the safe cold range for too long or the history is unknown, follow official discard guidance. Keep a separate “uncertain” area rather than returning a questionable package to normal stock.\n\n## Prioritise opening strategy\nIf the outage is expected to be short, the best action may be doing nothing. If it will be longer, retrieve a planned group of items at once. Move ice packs or frozen bottles only if doing so does not require repeated door opening. If you have a cooler and a verified source of ice, use it for the highest-priority perishables; do not spend scarce fuel driving repeatedly for ice unless the overall situation justifies it.\n\n## Special foods deserve explicit decisions\nInfant food, medically necessary nutrition, allergy-safe items, and foods for immunocompromised household members may require stricter handling. Do not substitute a product with an unknown allergen profile simply because the safe option spoiled. Record these items separately in Food Operations so the household sees them before general calories.\n\n## After power returns\nPower restoration does not automatically prove that all food is safe. Review the outage duration, thermometer records, ice crystals in frozen items, and the current official food-safety guidance. Clean spills promptly and label any food that remains under review. If floodwater entered the appliance, use the separate flood-exposure decision process rather than ordinary outage rules.\n\n## Source anchors\n- CDC: Keep food safe after an emergency.\n- CDC: Power outage safety.\n- USDA FSIS: Freezing and food safety."},"el":{"title":"Διαλογή τροφίμων μετά από απώλεια ψύξης","body":"## Ξεκίνα το χρονόμετρο και κράτα τις πόρτες κλειστές\nΗ διακοπή ρεύματος γίνεται ζήτημα ασφάλειας τροφίμων μόλις χαθεί η αξιόπιστη ψύξη. Κατέγραψε πότε κόπηκε το ρεύμα και μην ανοίγεις ψυγείο ή κατάψυξη παρά μόνο για προγραμματισμένη λήψη. Το CDC αναφέρει ότι ένα κλειστό ψυγείο διατηρεί ασφαλή θερμοκρασία περίπου τέσσερις ώρες, ενώ μια γεμάτη κατάψυξη περίπου 48 ώρες και μια μισογεμάτη περίπου 24 ώρες, εφόσον παραμένουν κλειστές. Αυτά είναι όρια σχεδιασμού και δεν αντικαθιστούν πραγματική μέτρηση θερμοκρασίας ή επίσημη οδηγία.\n\n## Χρησιμοποίησε ιστορικό θερμοκρασίας, όχι οσμή\nΠαθογόνα μπορούν να αναπτυχθούν χωρίς να αλλάξει η εμφάνιση, η οσμή ή η γεύση. Μην δοκιμάζεις αμφίβολο τρόφιμο για να ελέγξεις την ασφάλειά του. Θερμόμετρο ψυγείου ή κατάψυξης δίνει πολύ καλύτερη πληροφορία. Αν ευπαθές τρόφιμο έμεινε για υπερβολικό διάστημα εκτός ασφαλούς ψύξης ή το ιστορικό είναι άγνωστο, ακολούθησε τις επίσημες οδηγίες απόρριψης. Κράτα ξεχωριστή ζώνη «αβεβαιότητας».\n\n## Στρατηγική ανοίγματος\nΑν η διακοπή αναμένεται σύντομη, η καλύτερη ενέργεια μπορεί να είναι καμία. Αν συνεχιστεί, πάρε μαζί όσα χρειάζονται για το επόμενο διάστημα και ξανακλείσε. Μετακίνησε παγοκύστες ή παγωμένα μπουκάλια μόνο όταν δεν απαιτείται συνεχές άνοιγμα. Αν υπάρχει ψυγειάκι και επαληθευμένη πηγή πάγου, χρησιμοποίησέ το για τρόφιμα υψηλής προτεραιότητας αντί για επανειλημμένες διαδρομές ανεφοδιασμού.\n\n## Ειδικές τροφές χρειάζονται ξεχωριστή απόφαση\nΒρεφικές τροφές, ιατρικά απαιτούμενη διατροφή, τρόφιμα χωρίς συγκεκριμένα αλλεργιογόνα και διατροφή ανοσοκατεσταλμένων ατόμων μπορεί να απαιτούν αυστηρότερο χειρισμό. Μην αντικαθιστάς ασφαλές προϊόν με κάτι αγνώστου σύνθεσης μόνο επειδή χάλασε το πρώτο. Κατέγραψέ τα ξεχωριστά ώστε να εμφανίζονται πριν από τη γενική μέτρηση θερμίδων.\n\n## Μετά την επιστροφή του ρεύματος\nΗ αποκατάσταση ρεύματος δεν αποδεικνύει αυτόματα ότι όλα τα τρόφιμα είναι ασφαλή. Έλεγξε διάρκεια διακοπής, μετρήσεις θερμοκρασίας, παρουσία παγοκρυστάλλων στα κατεψυγμένα και τις ισχύουσες οδηγίες. Καθάρισε διαρροές και σήμανε τρόφιμα που παραμένουν υπό αξιολόγηση. Αν μπήκε πλημμυρικό νερό στη συσκευή, ακολούθησε ειδική διαδικασία για ρύπανση από πλημμύρα.\n\n## Πηγές αναφοράς\n- CDC: ασφάλεια τροφίμων μετά από έκτακτη ανάγκη.\n- CDC: ασφάλεια σε διακοπή ρεύματος.\n- USDA FSIS: κατάψυξη και ασφάλεια τροφίμων."}},{"id":12,"en":{"title":"Food exposed to floodwater or stormwater","body":"## Floodwater changes the discard threshold\nFloodwater can contain sewage, chemicals, fuel, soil, and debris. Food that has directly contacted floodwater should be treated much more conservatively than food affected only by a power outage. Porous packaging such as cardboard, paper, cloth, twist caps, snap lids, screw tops, and many home containers cannot be reliably disinfected once contaminated water reaches them. Follow current public-health guidance rather than trying to “save” food by washing the outside.\n\n## Separate the kitchen into three decisions\nCreate three groups: clearly protected food, food requiring official container-specific evaluation, and food to discard. Do not let leaking or wet packages remain beside accepted food. If a refrigerator or pantry was flooded, photograph the condition before cleanup if it is safe to do so, then remove damaged material without spreading contaminated water through the clean kitchen.\n\n## Canned goods need container-specific guidance\nCommercially sealed metal cans that are undamaged may sometimes be recoverable through a specific cleaning and sanitizing process described by public-health authorities. Bulging, leaking, badly dented, rusted, or damaged cans are different. Home-canned jars and containers with non-waterproof closures generally require more conservative decisions. Do not invent a cleanup process when the official guidance distinguishes packaging types.\n\n## Food-contact surfaces matter too\nFloodwater on a worktop, utensil drawer, cutting board, or appliance can contaminate later food even after the original groceries are removed. Clean and disinfect hard food-contact surfaces according to public-health instructions and discard porous items that cannot be effectively cleaned where guidance requires it. Keep children and pets out of the cleanup zone.\n\n## Record what was lost\nA simple list of discarded food, photos, and purchase evidence can help with insurance, assistance, or household resupply planning. The Recovery Cost ledger can store the financial impact without keeping contaminated items as “proof.”\n\n## Source anchors\n- CDC: Food safety after disasters and floods.\n- USDA FSIS: Emergency food-safety guidance.\n- Local public-health authority."},"el":{"title":"Τρόφιμα που εκτέθηκαν σε πλημμυρικό ή όμβριο νερό","body":"## Η πλημμύρα αλλάζει το όριο απόρριψης\nΤο πλημμυρικό νερό μπορεί να περιέχει λύματα, χημικά, καύσιμα, χώμα και μπάζα. Τρόφιμο που ήρθε άμεσα σε επαφή με τέτοιο νερό χρειάζεται πολύ πιο αυστηρή αντιμετώπιση από τρόφιμο που επηρεάστηκε μόνο από διακοπή ρεύματος. Πορώδεις συσκευασίες όπως χαρτόνι, χαρτί, ύφασμα, καπάκια με σπείρωμα ή άλλες μη στεγανές συσκευασίες δεν απολυμαίνονται αξιόπιστα όταν μολυσμένο νερό φτάσει στο εσωτερικό. Ακολούθησε την επίσημη υγειονομική καθοδήγηση αντί να προσπαθείς να «σώσεις» το προϊόν πλένοντας μόνο την εξωτερική επιφάνεια.\n\n## Χώρισε την κουζίνα σε τρεις κατηγορίες\nΔημιούργησε τρεις ομάδες: σαφώς προστατευμένα τρόφιμα, τρόφιμα που χρειάζονται αξιολόγηση ανά τύπο συσκευασίας και τρόφιμα προς απόρριψη. Μην αφήνεις βρεγμένες ή διαρρέουσες συσκευασίες δίπλα σε αποδεκτά τρόφιμα. Αν πλημμύρισε ψυγείο ή αποθήκη, φωτογράφισε την κατάσταση πριν από τον καθαρισμό όταν είναι ασφαλές και απομάκρυνε τα κατεστραμμένα χωρίς να διασπείρεις το νερό στον καθαρό χώρο.\n\n## Οι κονσέρβες χρειάζονται οδηγία ανά δοχείο\nΟρισμένες άθικτες εμπορικές μεταλλικές κονσέρβες μπορεί να μπορούν να σωθούν με συγκεκριμένη διαδικασία καθαρισμού και απολύμανσης που περιγράφουν οι αρμόδιες υπηρεσίες. Διογκωμένα, διαρρέοντα, έντονα χτυπημένα, σκουριασμένα ή κατεστραμμένα δοχεία είναι διαφορετική περίπτωση. Οικιακές κονσέρβες και δοχεία με μη στεγανό κλείσιμο απαιτούν πιο συντηρητική απόφαση. Μην αυτοσχεδιάζεις όταν οι επίσημες οδηγίες ξεχωρίζουν τους τύπους συσκευασίας.\n\n## Σημασία των επιφανειών που αγγίζουν τρόφιμα\nΠλημμυρικό νερό σε πάγκο, συρτάρι μαχαιροπίρουνων, ξύλο κοπής ή συσκευή μπορεί να μολύνει μελλοντικό φαγητό ακόμη και αφού φύγουν τα αρχικά τρόφιμα. Καθάρισε και απολύμανε σκληρές επιφάνειες σύμφωνα με τις οδηγίες και απόρριψε πορώδη αντικείμενα που δεν καθαρίζονται αποτελεσματικά όπου απαιτείται. Κράτησε παιδιά και ζώα έξω από τη ζώνη καθαρισμού.\n\n## Κατέγραψε την απώλεια\nΜια σύντομη λίστα απορριφθέντων τροφίμων, φωτογραφίες και στοιχεία αγοράς μπορούν να βοηθήσουν σε ασφάλιση, κρατική βοήθεια ή επανατροφοδοσία. Το Ημερολόγιο Κόστους Αποκατάστασης μπορεί να κρατήσει την οικονομική επίπτωση χωρίς να διατηρούνται μολυσμένα αντικείμενα ως «αποδείξεις».\n\n## Πηγές αναφοράς\n- CDC: ασφάλεια τροφίμων μετά από καταστροφές και πλημμύρες.\n- USDA FSIS: ασφάλεια τροφίμων σε έκτακτες ανάγκες.\n- Τοπική υγειονομική αρχή."}},{"id":13,"en":{"title":"Shelf-stable meals when electricity and cooking fuel are limited","body":"## Design meals around what does not need rescue\nDuring a prolonged outage, the most reliable food is food that remains safe without refrigeration and does not require scarce fuel or unsafe indoor combustion. Build several “no-cook” meal combinations from foods your household already tolerates: shelf-stable protein, grains or crackers, fruit or vegetables, and a safe drink. Avoid stockpiling foods that require large amounts of water or long boiling if water and fuel are likely to be the limiting resources.\n\n## Open-package size matters\nA large container may be economical in normal life but inefficient during an outage if it requires refrigeration after opening. Smaller units can reduce waste, especially for milk substitutes, sauces, spreads, and medically important foods. Record whether a product becomes perishable after opening and plan the meal so the whole package is used safely.\n\n## Food safety does not pause during a disaster\nKeep clean utensils and hands separate from waste and raw foods. Do not leave prepared shelf-stable food sitting for long periods in heat merely because the ingredients began at room temperature. Follow normal safe-food principles and local health guidance. If water for washing is scarce, choose meals that create fewer dirty utensils rather than lowering hygiene standards.\n\n## Nutrition planning is broader than calories\nCalories help estimate endurance, but an emergency menu also needs protein sources, appropriate foods for children, fibre, familiar foods that reduce stress, allergy-safe options, and any medically directed diet. The project’s food-energy calculator intentionally does not prescribe a universal daily intake. Use it as stock arithmetic, then build the real menu around the people present.\n\n## Build a three-layer pantry\nKeep a rapid-access layer for the first day, a routine shelf-stable layer for several days, and a reserve layer that is not casually opened. Rotate normal household consumption through the stock so emergency food is not a forgotten box of expired items. Include a manual can opener wherever cans are stored.\n\n## Source anchors\n- Ready.gov: Emergency food supply and kits.\n- WHO: Five Keys to Safer Food.\n- CDC: Food safety in emergencies."},"el":{"title":"Γεύματα μακράς διάρκειας όταν λείπουν ρεύμα και καύσιμο μαγειρέματος","body":"## Σχεδίασε γύρω από τρόφιμα που δεν χρειάζονται «διάσωση»\nΣε παρατεταμένη διακοπή, τα πιο αξιόπιστα τρόφιμα είναι όσα παραμένουν ασφαλή χωρίς ψύξη και δεν απαιτούν πολύ καύσιμο ή επικίνδυνη καύση μέσα στο σπίτι. Δημιούργησε αρκετούς συνδυασμούς χωρίς μαγείρεμα από τρόφιμα που το νοικοκυριό ήδη καταναλώνει: πηγή πρωτεΐνης μακράς διάρκειας, δημητριακό ή κράκερ, φρούτο ή λαχανικό και ασφαλές ποτό. Απόφυγε υπερβολικό απόθεμα τροφών που χρειάζονται πολύ νερό ή μακρύ βράσιμο όταν ακριβώς αυτά τα δύο μπορεί να είναι περιορισμένα.\n\n## Το μέγεθος συσκευασίας έχει σημασία\nΜεγάλη συσκευασία μπορεί να είναι οικονομική στην κανονική ζωή αλλά αναποτελεσματική σε διακοπή αν απαιτεί ψύξη μετά το άνοιγμα. Μικρότερες μονάδες μειώνουν απώλειες, ειδικά για υποκατάστατα γάλακτος, σάλτσες, αλείμματα και ειδικά τρόφιμα. Κατέγραψε αν το προϊόν γίνεται ευπαθές μετά το άνοιγμα και σχεδίασε το γεύμα ώστε να καταναλωθεί με ασφάλεια.\n\n## Η ασφάλεια τροφίμων δεν αναστέλλεται στην καταστροφή\nΚράτα καθαρά σκεύη και χέρια χωριστά από απορρίμματα και ωμά τρόφιμα. Μην αφήνεις έτοιμο φαγητό για πολλές ώρες στη ζέστη μόνο επειδή τα αρχικά συστατικά ήταν προϊόντα ραφιού. Ακολούθησε τις συνήθεις αρχές ασφαλούς χειρισμού και τις τοπικές οδηγίες. Αν λείπει νερό για πλύσιμο, επίλεξε γεύματα με λιγότερα σκεύη αντί να χαμηλώσεις το επίπεδο υγιεινής.\n\n## Η διατροφή είναι κάτι περισσότερο από θερμίδες\nΟι θερμίδες βοηθούν στην εκτίμηση διάρκειας, αλλά ένα μενού έκτακτης ανάγκης χρειάζεται επίσης πρωτεΐνη, κατάλληλα τρόφιμα για παιδιά, φυτικές ίνες, γνώριμα φαγητά που μειώνουν το στρες, επιλογές ασφαλείς για αλλεργίες και οποιαδήποτε ιατρικά καθορισμένη διατροφή. Ο υπολογιστής ενέργειας του έργου είναι εργαλείο αποθέματος και όχι γενική διατροφική συνταγή.\n\n## Δημιούργησε αποθήκη τριών επιπέδων\nΚράτα άμεσο επίπεδο για την πρώτη ημέρα, κανονικό επίπεδο για αρκετές ημέρες και εφεδρικό επίπεδο που δεν ανοίγεται χωρίς λόγο. Περιστρέφεις τα τρόφιμα μέσα από την καθημερινή κατανάλωση ώστε το απόθεμα ανάγκης να μην γίνει ξεχασμένο κουτί ληγμένων προϊόντων. Φύλαξε χειροκίνητο ανοιχτήρι εκεί όπου βρίσκονται οι κονσέρβες.\n\n## Πηγές αναφοράς\n- Ready.gov: τρόφιμα και κιτ έκτακτης ανάγκης.\n- WHO: Πέντε Κλειδιά για Ασφαλέστερα Τρόφιμα.\n- CDC: ασφάλεια τροφίμων σε έκτακτες ανάγκες."}},{"id":14,"en":{"title":"Food allergy and special-diet continuity","body":"## Emergency substitutions can create hidden risk\nA disrupted supply chain often forces households to change brands, buy unfamiliar imported products, accept donated food, or eat in shelters. For a person with a serious food allergy, that is a safety problem rather than merely a preference issue. Keep a written list of allergens, tolerated staple foods, trusted brands where relevant, and cross-contact concerns. Do not assume two similarly named products have identical ingredients.\n\n## Maintain an allergy-safe reserve separately\nStore some clearly identified food that does not depend on the ordinary family pantry. Protect it from accidental consumption and from cross-contact with shared utensils. If a household member depends on a medically prescribed formula or specialised nutrition product, include supply-chain contacts and reorder lead time in the continuity plan rather than only recording calories.\n\n## Donations and communal kitchens need a verification step\nUnlabelled homemade food, food removed from its original package, or a communal dish with unknown utensils should be treated cautiously when the allergy is severe. Ask for the original label or ingredient record where possible. A volunteer’s assurance that a dish “should be fine” is not equivalent to verified ingredients and preparation.\n\n## Emergency medication continuity belongs beside the food plan\nPeople at risk of anaphylaxis should keep their prescribed emergency medication accessible and follow their clinician’s plan. The survival project should record where the medication is stored, expiry/refill timing, and who knows the emergency plan; it should not invent a substitute dose or tell someone to use another person’s prescription.\n\n## Evacuation communication\nPrepare a short bilingual card stating the allergy and the need to avoid cross-contact. In Greece, include a Greek version even if the household normally speaks another language. Show the card before accepting food rather than after symptoms appear.\n\n## Source anchors\n- American Red Cross: Severe allergic reaction/anaphylaxis first aid.\n- Ready.gov: Disability and medical-needs planning.\n- Treating clinician and product labels."},"el":{"title":"Συνέχεια διατροφής σε τροφική αλλεργία ή ειδική δίαιτα","body":"## Οι αναγκαστικές αντικαταστάσεις μπορούν να κρύβουν σοβαρό κίνδυνο\nΔιακοπή της εφοδιαστικής αλυσίδας συχνά αναγκάζει το νοικοκυριό να αλλάξει μάρκες, να αγοράσει άγνωστα εισαγόμενα προϊόντα, να δεχτεί δωρεές ή να φάει σε οργανωμένο καταφύγιο. Για άτομο με σοβαρή αλλεργία αυτό είναι θέμα ασφάλειας και όχι απλή προτίμηση. Κράτα γραπτό κατάλογο αλλεργιογόνων, βασικών ασφαλών τροφών, γνωστών προϊόντων όπου έχει σημασία και κινδύνων διασταυρούμενης επαφής. Μην θεωρείς ότι δύο παρόμοια προϊόντα έχουν ίδια σύνθεση.\n\n## Διατήρησε ξεχωριστό ασφαλές απόθεμα\nΦύλαξε σαφώς αναγνωρίσιμα τρόφιμα που δεν εξαρτώνται από το κοινό ντουλάπι. Προστάτεψέ τα από τυχαία κατανάλωση και από κοινά σκεύη. Αν κάποιος εξαρτάται από ιατρικά καθορισμένη φόρμουλα ή ειδικό διατροφικό προϊόν, βάλε στο σχέδιο στοιχεία προμηθευτή και χρόνο επαναπαραγγελίας και όχι μόνο θερμίδες.\n\n## Οι δωρεές και οι κοινόχρηστες κουζίνες χρειάζονται επαλήθευση\nΣπιτικό φαγητό χωρίς ετικέτα, προϊόν που αφαιρέθηκε από την αρχική συσκευασία ή κοινό πιάτο με άγνωστα σκεύη χρειάζεται ιδιαίτερη προσοχή όταν η αλλεργία είναι σοβαρή. Ζήτησε την αρχική ετικέτα ή καταγραφή συστατικών όπου είναι δυνατό. Η διαβεβαίωση ότι ένα πιάτο «μάλλον δεν έχει» δεν είναι ισοδύναμη με επαληθευμένα συστατικά και διαδικασία παρασκευής.\n\n## Η επείγουσα φαρμακευτική αγωγή ανήκει δίπλα στο σχέδιο τροφίμων\nΆτομα με κίνδυνο αναφυλαξίας πρέπει να έχουν διαθέσιμη την αγωγή που τους έχει συνταγογραφηθεί και να ακολουθούν το σχέδιο του επαγγελματία υγείας. Το έργο μπορεί να καταγράφει θέση φαρμάκου, λήξη/ανανέωση και ποιοι γνωρίζουν το σχέδιο, αλλά δεν πρέπει να επινοεί δοσολογία ή να προτείνει χρήση ξένης συνταγής.\n\n## Επικοινωνία κατά την εκκένωση\nΕτοίμασε σύντομη δίγλωσση κάρτα που αναφέρει την αλλεργία και την ανάγκη αποφυγής διασταυρούμενης επαφής. Στην Ελλάδα συμπεριέλαβε ελληνική διατύπωση ακόμη και αν το νοικοκυριό μιλά συνήθως άλλη γλώσσα. Δείξε την κάρτα πριν αποδεχτείς φαγητό.\n\n## Πηγές αναφοράς\n- American Red Cross: αναφυλαξία και σοβαρή αλλεργική αντίδραση.\n- Ready.gov: σχεδιασμός για αναπηρία και ιατρικές ανάγκες.\n- Θεράπων επαγγελματίας υγείας και ετικέτες προϊόντων."}},{"id":15,"en":{"title":"Medication continuity during evacuation and outages","body":"## Build the plan before the pharmacy is unreachable\nMedication continuity requires more than a list of drug names. Record the exact product, strength as printed on the label, normal schedule, prescriber, pharmacy, refill date, storage requirement, and the reason the medicine is important. Keep the original labelled containers when practical. This lets a clinician or pharmacist understand what the person normally uses without relying on memory during an emergency.\n\n## Refrigerated or temperature-sensitive medicine needs a separate power plan\nDo not assume a household refrigerator is an adequate backup during a long outage. Identify which medicines are temperature-sensitive and obtain manufacturer/pharmacist guidance in advance on acceptable storage, transport, and what to do after temperature excursions. Use a dedicated cooler or monitoring method only as directed; freezing some medicines can be as harmful as warming them.\n\n## Create redundancy in access, not in self-prescribing\nKnow an alternate pharmacy, how to reach the prescriber, and what local emergency prescription programs exist. A backup copy of the prescription record can help, but the project should never tell a person to double a dose, stretch a controlled medicine, or substitute another drug without qualified advice. If access is interrupted, contact a pharmacist, clinician, emergency service, or official assistance channel as appropriate.\n\n## Power-dependent care needs an evacuation threshold\nOxygen concentrators, suction devices, dialysis-related equipment, powered mobility systems, refrigerated medicine, and other health technologies can turn a power outage into a medical emergency. Record battery runtime, charging options, supplier emergency contact, and the condition that triggers relocation to a powered facility. Do not wait until the last battery reaches zero before acting.\n\n## Protect privacy while keeping the information usable\nA medication card can be life-saving, but it contains sensitive health information. Keep one copy accessible to the person or caregiver and protect full digital backups. The redacted project template intentionally excludes personal state; a full export should be handled as private medical/emergency data.\n\n## Source anchors\n- CDC: Chronic disease and medication safety during disasters.\n- Ready.gov: Disability and medical equipment preparedness.\n- Pharmacist, prescriber, and manufacturer instructions."},"el":{"title":"Συνέχεια φαρμακευτικής αγωγής σε εκκένωση και διακοπές","body":"## Φτιάξε το σχέδιο πριν γίνει μη προσβάσιμο το φαρμακείο\nΗ συνέχεια φαρμάκων χρειάζεται περισσότερα από μια λίστα ονομάτων. Κατέγραψε ακριβές προϊόν, περιεκτικότητα όπως γράφεται στην ετικέτα, κανονικό πρόγραμμα, γιατρό, φαρμακείο, ημερομηνία ανανέωσης, απαιτήσεις αποθήκευσης και γιατί είναι σημαντικό. Όπου είναι πρακτικό, κράτα τα αρχικά δοχεία με την ετικέτα. Έτσι επαγγελματίας υγείας μπορεί να καταλάβει τι χρησιμοποιείται συνήθως χωρίς να βασίζεται στη μνήμη σε κατάσταση πίεσης.\n\n## Ψυχόμενα ή θερμοευαίσθητα φάρμακα χρειάζονται ξεχωριστό σχέδιο ενέργειας\nΜην θεωρείς ότι το οικιακό ψυγείο αποτελεί αξιόπιστη εφεδρεία σε παρατεταμένη διακοπή. Εντόπισε ποια φάρμακα επηρεάζονται από τη θερμοκρασία και ζήτησε εκ των προτέρων καθοδήγηση από κατασκευαστή ή φαρμακοποιό για αποθήκευση, μεταφορά και ενέργειες μετά από απόκλιση θερμοκρασίας. Χρησιμοποίησε ψυγειάκι ή μέθοδο παρακολούθησης μόνο σύμφωνα με τις οδηγίες· για ορισμένα φάρμακα η κατάψυξη είναι επίσης επιβλαβής.\n\n## Δημιούργησε εφεδρεία πρόσβασης, όχι αυτοσχέδια θεραπεία\nΓνώριζε εναλλακτικό φαρμακείο, τρόπο επικοινωνίας με τον γιατρό και τυχόν επίσημα προγράμματα έκτακτης παροχής. Αντίγραφο των στοιχείων συνταγής βοηθά, αλλά το έργο δεν πρέπει να προτείνει διπλασιασμό δόσης, αυθαίρετη παράταση ελεγχόμενου φαρμάκου ή αντικατάσταση με άλλο χωρίς κατάλληλη οδηγία. Αν διακοπεί η πρόσβαση, επικοινώνησε με φαρμακοποιό, γιατρό ή αρμόδια υπηρεσία.\n\n## Η εξάρτηση από ρεύμα χρειάζεται όριο εκκένωσης\nΣυμπυκνωτές οξυγόνου, συσκευές αναρρόφησης, εξοπλισμός σχετικός με αιμοκάθαρση, ηλεκτρικά βοηθήματα κινητικότητας, ψυχόμενα φάρμακα και άλλες τεχνολογίες υγείας μπορούν να μετατρέψουν μια διακοπή ρεύματος σε ιατρικό επείγον. Κατέγραψε αυτονομία μπαταρίας, επιλογές φόρτισης, επείγουσα επαφή προμηθευτή και το σημείο που ενεργοποιεί μεταφορά σε χώρο με αξιόπιστο ρεύμα.\n\n## Προστάτεψε την ιδιωτικότητα αλλά κράτα τις πληροφορίες χρησιμοποιήσιμες\nΚάρτα φαρμάκων μπορεί να είναι κρίσιμη, αλλά περιέχει ευαίσθητα δεδομένα. Κράτα ένα αντίγραφο προσβάσιμο στο άτομο ή στον φροντιστή και προστάτεψε τα πλήρη ψηφιακά αντίγραφα. Το κενό ανωνυμοποιημένο πρότυπο του έργου δεν περιλαμβάνει προσωπική κατάσταση· το πλήρες αντίγραφο ασφαλείας πρέπει να αντιμετωπίζεται ως ιδιωτικό ιατρικό και επιχειρησιακό αρχείο.\n\n## Πηγές αναφοράς\n- CDC: χρόνια νοσήματα και φάρμακα σε καταστροφές.\n- Ready.gov: αναπηρία και ιατρικός εξοπλισμός στην προετοιμασία.\n- Φαρμακοποιός, θεράπων και οδηγίες κατασκευαστή."}},{"id":16,"en":{"title":"Power-dependent medical equipment continuity","body":"## Treat runtime as a medical dependency, not a gadget specification\nFor equipment that supports breathing, mobility, communication, feeding, suction, refrigeration of medicine, or other health needs, battery runtime is part of the person’s care plan. Record the device model, normal power draw, battery count, realistic tested runtime, charging time, supplier, and whether the device can safely operate from an inverter or alternative power source. Manufacturer guidance takes precedence over generic electrical calculations.\n\n## Test the real backup before an emergency\nA battery labelled for many watt-hours may deliver less under the actual load, temperature, age, or inverter losses. Run a supervised test under safe conditions and record the result. Check whether alarms remain audible, whether the device restarts automatically after power loss, and whether a caregiver knows how to switch to backup without changing clinical settings.\n\n## Build a relocation trigger\nDo not plan to remain at home until the final battery is exhausted. Define a conservative trigger such as loss of mains power plus a specific remaining runtime, failure of the charging source, extreme indoor temperature, or loss of caregiver support. Identify powered medical shelters, hospitals, clinics, or other appropriate destinations according to local emergency planning.\n\n## Generator use adds carbon-monoxide and electrical risk\nIf a generator is part of the approved backup plan, it must be used outside and away from openings according to current safety guidance. CDC specifies more than 20 feet from windows, doors, and vents, with a battery-powered or battery-backup carbon-monoxide detector inside. Never connect a generator to household wiring through an improvised “backfeed” cable.\n\n## Keep one paper handover sheet\nIf the person must be moved, a short sheet with device name, power needs, battery status, accessories, medications, communication needs, and supplier contacts reduces delays. It should travel with the person, not remain in the evacuation binder at home.\n\n## Source anchors\n- CDC: Power outages and chronic medical needs.\n- CDC: Carbon-monoxide prevention.\n- Ready.gov: Medical equipment and disability preparedness."},"el":{"title":"Συνέχεια ιατρικού εξοπλισμού που εξαρτάται από ρεύμα","body":"## Η αυτονομία είναι ιατρική εξάρτηση και όχι απλό τεχνικό χαρακτηριστικό\nΓια εξοπλισμό που υποστηρίζει αναπνοή, κινητικότητα, επικοινωνία, σίτιση, αναρρόφηση, ψύξη φαρμάκων ή άλλη ανάγκη υγείας, η διάρκεια μπαταρίας αποτελεί μέρος του σχεδίου φροντίδας. Κατέγραψε μοντέλο, συνήθη κατανάλωση, αριθμό μπαταριών, πραγματικά δοκιμασμένη αυτονομία, χρόνο φόρτισης, προμηθευτή και αν επιτρέπεται ασφαλής λειτουργία από μετατροπέα ή εναλλακτική πηγή. Οι οδηγίες κατασκευαστή υπερισχύουν γενικών ηλεκτρικών υπολογισμών.\n\n## Δοκίμασε την πραγματική εφεδρεία πριν από την ανάγκη\nΜια μπαταρία με συγκεκριμένη θεωρητική χωρητικότητα μπορεί να αποδώσει λιγότερο λόγω φορτίου, θερμοκρασίας, ηλικίας ή απωλειών μετατροπής. Κάνε επιτηρούμενη δοκιμή σε ασφαλείς συνθήκες και κατέγραψε το αποτέλεσμα. Έλεγξε αν ακούγονται οι συναγερμοί, αν η συσκευή επανεκκινεί αυτόματα μετά από απώλεια ρεύματος και αν ο φροντιστής μπορεί να περάσει στην εφεδρεία χωρίς να αλλάξει ιατρικές ρυθμίσεις.\n\n## Όρισε έγκαιρο όριο μετακίνησης\nΜην σχεδιάζεις παραμονή στο σπίτι μέχρι να εξαντληθεί και η τελευταία μπαταρία. Όρισε συντηρητικό σημείο ενεργοποίησης, όπως απώλεια δικτύου μαζί με συγκεκριμένη εναπομένουσα αυτονομία, βλάβη της φόρτισης, ακραία θερμοκρασία εσωτερικού χώρου ή απώλεια υποστήριξης φροντιστή. Εντόπισε κατάλληλα νοσοκομεία, δομές ή οργανωμένους χώρους με ρεύμα σύμφωνα με τον τοπικό σχεδιασμό.\n\n## Η γεννήτρια προσθέτει κίνδυνο μονοξειδίου και ηλεκτροπληξίας\nΑν υπάρχει γεννήτρια στο εγκεκριμένο σχέδιο, λειτουργεί μόνο έξω και μακριά από ανοίγματα. Το CDC ορίζει απόσταση μεγαλύτερη από 20 πόδια, περίπου έξι μέτρα, από παράθυρα, πόρτες και αεραγωγούς και συνιστά ανιχνευτή μονοξειδίου με μπαταρία μέσα στο σπίτι. Μην συνδέεις ποτέ γεννήτρια στην οικιακή καλωδίωση με αυτοσχέδιο καλώδιο αντίστροφης τροφοδότησης.\n\n## Κράτα ένα σύντομο έντυπο παράδοσης\nΑν χρειαστεί μετακίνηση, μια σελίδα με όνομα συσκευής, ανάγκες ισχύος, κατάσταση μπαταριών, παρελκόμενα, φάρμακα, ανάγκες επικοινωνίας και στοιχεία προμηθευτή μειώνει καθυστερήσεις. Πρέπει να ταξιδεύει μαζί με το άτομο και όχι να παραμένει στον φάκελο του σπιτιού.\n\n## Πηγές αναφοράς\n- CDC: διακοπές ρεύματος και χρόνιες ιατρικές ανάγκες.\n- CDC: πρόληψη δηλητηρίασης από μονοξείδιο του άνθρακα.\n- Ready.gov: ιατρικός εξοπλισμός και προετοιμασία αναπηρίας."}},{"id":17,"en":{"title":"Life-threatening bleeding: first-aid boundaries for an offline reference","body":"## Scene safety comes first\nSevere bleeding may occur after debris, glass, vehicle crashes, tools, or structural damage. Do not become another casualty by entering moving traffic, unstable rubble, electrical hazards, fire, or contaminated water. Call the local emergency number early and use protective barriers such as gloves when available.\n\n## Direct pressure is the core immediate action\nAmerican Red Cross guidance for life-threatening external bleeding starts with finding the source, placing a dressing where available, and applying firm, steady direct pressure. Keep pressure in place while emergency help is activated. Do not repeatedly lift the dressing to “check” the wound if that interrupts effective pressure. If blood soaks through, follow current first-aid training rather than removing clotting material casually.\n\n## Tourniquets and wound packing are trained skills\nCurrent first-aid systems may use tourniquets for severe limb bleeding and wound packing for certain deep wounds, but correct placement and use matter. The offline project should prompt trained responders to follow the technique they were taught and the device instructions; it should not pretend that reading one paragraph replaces hands-on training. Record the time a tourniquet was applied and communicate it to emergency medical personnel.\n\n## Do not improvise invasive treatment\nDo not probe a wound, push exposed tissue back into the body, remove a deeply embedded object, or apply chemicals, powders, coffee, ash, or househol
