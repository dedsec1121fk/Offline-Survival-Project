, ντουλάπια, θερμοσίφωνες, φωτιστικά και αποθηκευμένα αντικείμενα μπορούν να πέσουν ή να μετακινηθούν ακόμη κι αν ο κύριος σκελετός παραμένει όρθιος. Έλεγξε χώρους ύπνου, εξόδους και σημεία όπου κάθεστε συχνά και εντόπισε βαριά αντικείμενα ψηλά ή κατά μήκος διαδρομών.\n\n## Στερέωση κατάλληλη για αντικείμενο και κτίριο\nΧρησιμοποίησε προϊόντα συγκράτησης κατάλληλα και ακολούθησε οδηγίες κατασκευαστή/κτιρίου. Αδύναμος αυτοσχέδιος δεσμός μπορεί να δημιουργήσει ψεύτικη ασφάλεια ή ζημιά στον τοίχο. Οι ενοικιαστές ακολουθούν τις απαιτήσεις του κτιρίου και ζητούν εγκεκριμένες λύσεις αντί να τρυπούν άγνωστα δομικά στοιχεία.\n\n## Βαριά αντικείμενα χαμηλά\nΑποθήκευσε πυκνά δοχεία, εργαλεία και μεγάλες προμήθειες σε χαμηλά ράφια. Χρησιμοποίησε κατάλληλα κλεισίματα ώστε ντουλάπια να μην αδειάσουν στους διαδρόμους. Κράτησε γυαλί και βαριά διακόσμηση μακριά από κρεβάτια και καναπέδες όπου είναι δυνατό.\n\n## Προστάτευσε τη διαδρομή μετά τη δόνηση\nΜετά τον σεισμό περίμενε σπασμένα γυαλιά και πεσμένα αντικείμενα. Κράτησε γερά παπούτσια και φακό κοντά στον ύπνο. Μην τρέχεις σε σκοτεινούς διαδρόμους. Ακολούθησε την Ελληνική Πολιτική Προστασία για μετασεισμούς και εκκένωση και μην χρησιμοποιείς ανελκυστήρες όπου οι οδηγίες προβλέπουν σκάλες.\n\n## Επανέλεγχος μετά από κάθε σημαντική δόνηση\nΣτήριγμα, ράφι ή ντουλάπι μπορεί να έχει χαλαρώσει χωρίς να πέσει. Μην στέκεσαι κάτω από εμφανώς μετακινημένο βαρύ αντικείμενο για να το εξετάσεις. Απομόνωσε μη ασφαλή δωμάτια και ζήτησε αρμόδια αξιολόγηση για δομικές ανησυχίες.\n\n## Μετέτρεψε τον έλεγχο σε βελτίωση\nΦωτογράφισε την κανονική διάταξη και κατέγραψε τις διορθώσεις. Μετά από συμβάν σημείωσε τι μετακινήθηκε. Είναι από τα ευκολότερα σημεία όπου μια πραγματική παρατήρηση μετατρέπεται σε συγκεκριμένο προληπτικό μέτρο.\n\nΚωδικοί τεκμηρίωσης: GR-EQ-1, READY-PLAN-1."}},{"id":91,"en":{"title":"Pre-disaster home inventory: document what exists before damage makes reconstruction difficult","body":"## Inventory the things that would be hard to remember\nStart with rooms and major categories: appliances, electronics, tools, furniture, bicycles, important collections and higher-value household equipment. You do not need to catalog every spoon. The purpose is to give future-you enough evidence to reconstruct significant losses and identify serial/model information.\n\n## Photograph from wide to close\nTake an overview of each room, then important items and model/serial labels where relevant. Open cupboards or storage only if doing so does not expose sensitive information unnecessarily. A short walkthrough video can capture context, but still photos make indexing easier.\n\n## Attach purchase evidence selectively\nReceipts, invoices, warranty emails and manuals can support an inventory, but copying every payment record creates a large privacy burden. Link only useful evidence and keep financial account data minimized. Store a protected offline copy separate from the home if your threat model allows it.\n\n## Include emergency infrastructure\nDocument smoke/CO alarms, extinguishers, water storage, solar/power equipment, mobility/medical-support equipment and major tools. These are not only claim items; the inventory helps maintenance and replacement planning.\n\n## Review after material changes\nUpdate after renovation, major purchase, disposal or move. A date-stamped inventory older than the property itself may mislead. Delete sold/discarded items so the file remains credible.\n\n## Keep the inventory private\nA detailed list of valuables can help a thief as much as an insurer. Do not publish the full document or store it unprotected in a public cloud link. Share only the relevant subset during a claim.\n\nEvidence IDs: READY-PLAN-1, READY-KIT-1."},"el":{"title":"Απογραφή κατοικίας πριν από καταστροφή: τεκμηρίωσε ό,τι υπάρχει πριν η ζημιά δυσκολέψει την ανακατασκευή","body":"## Κατέγραψε όσα θα είναι δύσκολο να θυμηθείς\nΞεκίνα ανά δωμάτιο και βασική κατηγορία: συσκευές, ηλεκτρονικά, εργαλεία, έπιπλα, ποδήλατα, σημαντικές συλλογές και ακριβότερο οικιακό εξοπλισμό. Δεν χρειάζεται να καταγράψεις κάθε κουτάλι. Στόχος είναι να υπάρχει αρκετή απόδειξη για σημαντικές απώλειες και στοιχεία μοντέλου ή σειριακού αριθμού.\n\n## Φωτογράφισε από γενικό σε κοντινό\nΠάρε γενική εικόνα κάθε χώρου και μετά σημαντικά αντικείμενα και ετικέτες μοντέλου/σειριακού όπου σχετίζεται. Άνοιξε ντουλάπια μόνο αν δεν αποκαλύπτεις άσκοπα ευαίσθητες πληροφορίες. Ένα σύντομο βίντεο δίνει πλαίσιο, ενώ οι στατικές φωτογραφίες ταξινομούνται ευκολότερα.\n\n## Σύνδεσε επιλεκτικά αποδείξεις αγοράς\nΑποδείξεις, τιμολόγια, εγγυήσεις και εγχειρίδια μπορούν να στηρίξουν την απογραφή, αλλά η αντιγραφή κάθε οικονομικού εγγράφου δημιουργεί μεγάλο βάρος ιδιωτικότητας. Κράτησε μόνο ό,τι είναι χρήσιμο και ελαχιστοποίησε στοιχεία λογαριασμών. Φύλαξε προστατευμένο offline αντίγραφο εκτός κατοικίας όπου ταιριάζει στο μοντέλο κινδύνου σου.\n\n## Συμπερίλαβε υποδομή έκτακτης ανάγκης\nΚατέγραψε ανιχνευτές καπνού/μονοξειδίου, πυροσβεστήρες, αποθήκευση νερού, ηλιακό ή μπαταριακό εξοπλισμό, βοηθήματα κινητικότητας/υγείας και σημαντικά εργαλεία. Δεν είναι μόνο αντικείμενα αποζημίωσης· η απογραφή βοηθά συντήρηση και αντικατάσταση.\n\n## Ενημέρωση μετά από ουσιαστική αλλαγή\nΑναθεώρησε μετά από ανακαίνιση, μεγάλη αγορά, απόρριψη ή μετακόμιση. Ένα πολύ παλιό αρχείο μπορεί να παραπλανήσει. Αφαίρεσε αντικείμενα που πωλήθηκαν ή πετάχτηκαν ώστε το έγγραφο να παραμένει αξιόπιστο.\n\n## Κράτησε την απογραφή ιδιωτική\nΛεπτομερής λίστα αξίας μπορεί να βοηθήσει κλέφτη όσο και ασφαλιστή. Μην δημοσιεύεις όλο το αρχείο και μην το αφήνεις απροστάτευτο σε δημόσιο σύνδεσμο. Κατά την αποζημίωση μοιράσου μόνο το σχετικό τμήμα.\n\nΚωδικοί τεκμηρίωσης: READY-PLAN-1, READY-KIT-1."}},{"id":92,"en":{"title":"Emergency fuel log: track quantity, compatibility, storage and safe refill decisions","body":"## Fuel is a hazardous resource, not only an energy number\nRecord fuel type, approved container, quantity, storage location, purchase/rotation date and the equipment it serves. Gasoline, diesel, LPG and other fuels are not interchangeable. Follow local law, fire code, building rules and manufacturer instructions for storage limits and locations.\n\n## Keep fuel out of occupied/storage-sensitive areas\nDo not store fuel with food, drinking water, medicines or inside living/sleeping spaces. Containers must be suitable, closed and protected from heat/ignition. Apartment buildings and shared properties may have stricter restrictions; those rules override a generic preparedness plan.\n\n## Separate consumption from reserve\nLog each refill into the generator/vehicle/tool and the remaining amount. Define a protected reserve for evacuation or critical use rather than letting comfort loads consume it unnoticed. Fuel estimates should include realistic engine/generator consumption, not the label’s best-case figure alone.\n\n## Refuel only under safe conditions\nFollow equipment instructions for shutdown, cooling and refueling. Never refuel a hot/running generator or create vapors near ignition sources. Spills require appropriate cleanup and ventilation; do not wash fuel into drains or soil.\n\n## Rotate without stockpiling indefinitely\nFuel properties and container seals change with time. Use a rotation schedule suitable for the fuel/product and local guidance. Remove leaking, swollen, corroded or damaged containers from service safely rather than transferring risk to a new location.\n\n## Reconcile after the incident\nCompare actual fuel use with the power/vehicle logs. If the reserve disappeared faster than expected, identify the load or travel that consumed it. Improve the demand plan before simply increasing stored quantity.\n\nEvidence IDs: CDC-CO-1, READY-PLAN-1, POWER-1."},"el":{"title":"Ημερολόγιο καυσίμου έκτακτης ανάγκης: ποσότητα, συμβατότητα, αποθήκευση και ασφαλής ανεφοδιασμός","body":"## Το καύσιμο είναι επικίνδυνος πόρος και όχι μόνο αριθμός ενέργειας\nΚατέγραψε τύπο, εγκεκριμένο δοχείο, ποσότητα, θέση αποθήκευσης, ημερομηνία αγοράς ή περιστροφής και τον εξοπλισμό που εξυπηρετεί. Βενζίνη, πετρέλαιο, υγραέριο και άλλα καύσιμα δεν είναι εναλλάξιμα. Ακολούθησε τοπική νομοθεσία, πυρασφάλεια, κανόνες κτιρίου και οδηγίες κατασκευαστή για επιτρεπόμενες ποσότητες και θέσεις.\n\n## Μακριά από κατοικημένους και ευαίσθητους χώρους\nΜην αποθηκεύεις καύσιμο μαζί με τρόφιμα, πόσιμο νερό, φάρμακα ή μέσα σε χώρους ύπνου/διαβίωσης. Τα δοχεία πρέπει να είναι κατάλληλα, κλειστά και προστατευμένα από θερμότητα και πηγές ανάφλεξης. Πολυκατοικίες και κοινόχρηστες ιδιοκτησίες μπορεί να έχουν αυστηρότερους κανόνες, οι οποίοι υπερισχύουν ενός γενικού σχεδίου.\n\n## Ξεχώρισε κατανάλωση από εφεδρεία\nΣημείωσε κάθε ανεφοδιασμό σε γεννήτρια, όχημα ή εργαλείο και την υπόλοιπη ποσότητα. Όρισε προστατευμένη εφεδρεία για εκκένωση ή κρίσιμη χρήση ώστε να μην καταναλώνεται αθόρυβα από φορτία άνεσης. Οι εκτιμήσεις βασίζονται σε ρεαλιστική κατανάλωση και όχι μόνο στην καλύτερη θεωρητική τιμή της ετικέτας.\n\n## Ανεφοδιασμός μόνο σε ασφαλείς συνθήκες\nΑκολούθησε το εγχειρίδιο για απενεργοποίηση, ψύξη και γέμισμα. Μην ανεφοδιάζεις ζεστή ή ενεργή γεννήτρια και μην δημιουργείς ατμούς δίπλα σε πηγή ανάφλεξης. Διαρροές καθαρίζονται κατάλληλα και δεν ξεπλένονται σε φρεάτια ή έδαφος.\n\n## Περιστροφή χωρίς άπειρη αποθήκευση\nΙδιότητες καυσίμου και στεγανοποιήσεις δοχείων αλλάζουν με τον χρόνο. Εφάρμοσε κύκλο κατάλληλο για το προϊόν και τις τοπικές οδηγίες. Δοχεία με διαρροή, διόγκωση, σκουριά ή ζημιά αποσύρονται με ασφαλή τρόπο και δεν μεταφέρουν απλώς τον κίνδυνο αλλού.\n\n## Συμφωνία μετά το συμβάν\nΣύγκρινε πραγματική χρήση με ημερολόγιο ισχύος και οχήματος. Αν το απόθεμα έφυγε γρηγορότερα, εντόπισε ποια φορτία ή διαδρομές το κατανάλωσαν. Βελτίωσε πρώτα τη ζήτηση πριν απλώς αυξήσεις την αποθηκευμένη ποσότητα.\n\nΚωδικοί τεκμηρίωσης: CDC-CO-1, READY-PLAN-1, POWER-1."}},{"id":93,"en":{"title":"Shared charging station: allocate limited electricity without losing critical devices","body":"## Rank devices by function\nSeparate life/safety and accessibility equipment, communications, lighting, navigation and convenience electronics. The order may change during the incident. A phone at 80% may not need charging while a radio or caregiver device is nearly empty.\n\n## Label cables and ports\nKeep compatible cables with each device and mark high-power/proprietary chargers. A shared box of similar black cables can waste time and cause incorrect charging. Reject damaged cords and connectors.\n\n## Use time windows\nCreate a charging schedule tied to generator, solar or mains-restoration windows. Record start/end percentage and estimated energy used where the source can provide it. This helps the Power Operations ledger predict whether the reserve is lasting.\n\n## Protect the station physically\nKeep it dry, ventilated according to equipment instructions and away from bedding, exits, children’s play and combustible clutter. Do not stack hot chargers under clothing. Power strips, adapters and extension cords must remain within their ratings.\n\n## Reserve one communication path\nAvoid charging every device to full while leaving no energy for the final night. Designate a primary emergency phone/radio and preserve a minimum reserve. If a device can be turned off completely between check-in windows, do that rather than relying on low-power mode alone.\n\n## Close each cycle\nReturn devices to their owners/roles and mark failures. A charger that intermittently disconnects should leave the emergency kit even if it sometimes works. Refill the cable/spare inventory after the incident.\n\nEvidence IDs: READY-KIT-1, POWER-1, READY-COMMS-1."},"el":{"title":"Κοινός σταθμός φόρτισης: μοίρασε περιορισμένη ενέργεια χωρίς να χαθούν κρίσιμες συσκευές","body":"## Κατάταξε τις συσκευές ανά λειτουργία\nΧώρισε εξοπλισμό υγείας/ασφάλειας και προσβασιμότητας, επικοινωνίες, φωτισμό, πλοήγηση και ηλεκτρονικά άνεσης. Η σειρά μπορεί να αλλάξει μέσα στο συμβάν. Τηλέφωνο στο 80% ίσως δεν χρειάζεται φόρτιση ενώ ραδιόφωνο ή συσκευή φροντιστή είναι σχεδόν άδεια.\n\n## Σήμανε καλώδια και θύρες\nΚράτησε συμβατά καλώδια με κάθε συσκευή και σημείωσε ισχυρούς ή ειδικούς φορτιστές. Ένα κουτί με παρόμοια μαύρα καλώδια χάνει χρόνο και οδηγεί σε λάθος συνδέσεις. Κατεστραμμένα καλώδια και βύσματα αποσύρονται.\n\n## Χρησιμοποίησε χρονικά παράθυρα\nΦτιάξε πρόγραμμα φόρτισης που συνδέεται με γεννήτρια, ηλιακή πηγή ή στιγμές επαναφοράς δικτύου. Κατέγραψε αρχικό/τελικό ποσοστό και εκτιμώμενη ενέργεια όπου η πηγή παρέχει δεδομένα. Έτσι το Power Operations μπορεί να προβλέπει αν η εφεδρεία διαρκεί.\n\n## Προστάτευσε φυσικά τον σταθμό\nΚράτησέ τον στεγνό, αεριζόμενο σύμφωνα με τον εξοπλισμό και μακριά από κλινοσκεπάσματα, εξόδους, παιχνίδι παιδιών και εύφλεκτη ακαταστασία. Μην σκεπάζεις ζεστούς φορτιστές με ρούχα. Πολύπριζα, αντάπτορες και προεκτάσεις μένουν μέσα στις προδιαγραφές τους.\n\n## Διατήρησε μία επικοινωνιακή εφεδρεία\nΜην φορτίζεις κάθε συσκευή στο 100% αν αυτό αφήνει μηδενική ενέργεια για την τελευταία νύχτα. Όρισε κύριο τηλέφωνο ή ραδιόφωνο έκτακτης ανάγκης και ελάχιστο απόθεμα. Αν συσκευή μπορεί να κλείνει εντελώς ανάμεσα στα check-in, προτίμησέ το αντί να βασίζεσαι μόνο σε λειτουργία χαμηλής κατανάλωσης.\n\n## Κλείσε κάθε κύκλο\nΕπέστρεψε συσκευές στους ιδιοκτήτες ή ρόλους τους και σημείωσε βλάβες. Φορτιστής που αποσυνδέεται τυχαία βγαίνει από το κιτ ακόμη κι αν «μερικές φορές δουλεύει». Αναπλήρωσε καλώδια και εφεδρείες μετά το συμβάν.\n\nΚωδικοί τεκμηρίωσης: READY-KIT-1, POWER-1, READY-COMMS-1."}},{"id":94,"en":{"title":"Radio and official monitoring plan: listen on purpose instead of chasing every signal","body":"## Define the sources before the incident\nRecord which national/local broadcasters, Civil Protection channels, municipality pages or emergency frequencies/services are authoritative for your area. A radio can receive information without mobile data, but the household still needs to know which station is credible.\n\n## Schedule listening windows\nContinuous listening consumes batteries and attention. Check at planned intervals, then increase frequency when warnings or rapidly changing hazards justify it. Log the time and source of important instructions so later messages can be compared accurately.\n\n## Separate instruction from commentary\nNews discussion, callers and social posts may repeat unverified reports. Mark official instructions separately in the incident log. Do not change evacuation or shelter action based on a rumor when an authoritative channel is available.\n\n## Prepare reception and power\nTest the radio in the actual shelter area, not only outdoors on a clear day. Keep compatible batteries or charging method and know how to tune/store stations without internet. A hand-crank feature is a backup, not an excuse to ignore battery planning.\n\n## Share one concise household update\nAfter monitoring, the information lead should give the group the action, source and time—not a stream of alarming details. This reduces contradictory interpretations and conserves everyone’s phone batteries.\n\n## Preserve the last confirmed instruction\nIf the signal disappears, keep the last verified instruction and its timestamp visible while seeking an update. Do not silently replace it with speculation. In Greece, 112 alerts and Civil Protection information are key official pathways during dangerous events.\n\nEvidence IDs: GR-112-1, GR-GENERAL-1, READY-COMMS-1."},"el":{"title":"Ραδιόφωνο και παρακολούθηση επίσημων πηγών: άκου με σκοπό και όχι κάθε διαθέσιμο σήμα","body":"## Καθόρισε τις πηγές πριν από το συμβάν\nΚατέγραψε ποιοι εθνικοί/τοπικοί σταθμοί, κανάλια Πολιτικής Προστασίας, δήμου ή άλλες υπηρεσίες είναι αρμόδιες για την περιοχή. Το ραδιόφωνο μπορεί να δώσει πληροφορίες χωρίς δεδομένα κινητής, αλλά το νοικοκυριό πρέπει να γνωρίζει ποια πηγή είναι αξιόπιστη.\n\n## Προγραμμάτισε παράθυρα ακρόασης\nΗ συνεχής ακρόαση καταναλώνει μπαταρία και προσοχή. Έλεγχε σε προκαθορισμένα διαστήματα και αύξησε συχνότητα όταν οι προειδοποιήσεις ή η γρήγορη εξέλιξη του κινδύνου το απαιτούν. Κατέγραψε ώρα και πηγή σημαντικής οδηγίας ώστε να συγκρίνεται σωστά με μεταγενέστερα μηνύματα.\n\n## Ξεχώρισε οδηγία από σχολιασμό\nΣυζητήσεις ειδήσεων, τηλεφωνικές παρεμβάσεις και αναρτήσεις μπορεί να αναπαράγουν ανεπιβεβαίωτες πληροφορίες. Σήμανε τις επίσημες οδηγίες χωριστά στο ημερολόγιο. Μην αλλάζεις εκκένωση ή καταφύγιο βάσει φήμης όταν υπάρχει αρμόδιο κανάλι.\n\n## Προετοίμασε λήψη και τροφοδοσία\nΔοκίμασε το ραδιόφωνο στο πραγματικό σημείο καταφυγίου και όχι μόνο έξω σε καλή μέρα. Κράτησε συμβατές μπαταρίες ή φόρτιση και μάθε να συντονίζεις/αποθηκεύεις σταθμούς χωρίς διαδίκτυο. Η μανιβέλα είναι εφεδρεία και όχι λόγος να αγνοείται η ενεργειακή σχεδίαση.\n\n## Μία σύντομη ενημέρωση προς το νοικοκυριό\nΜετά την ακρόαση, ο υπεύθυνος πληροφοριών μεταδίδει ενέργεια, πηγή και ώρα και όχι συνεχή ροή τρομακτικών λεπτομερειών. Έτσι μειώνονται οι αντικρουόμενες ερμηνείες και εξοικονομούνται οι μπαταρίες των τηλεφώνων.\n\n## Διατήρησε την τελευταία επιβεβαιωμένη οδηγία\nΑν χαθεί το σήμα, κράτησε εμφανή την τελευταία επίσημη οδηγία και την ώρα της μέχρι να υπάρξει ενημέρωση. Μην την αντικαθιστάς σιωπηρά με εικασία. Στην Ελλάδα οι ειδοποιήσεις 112 και η Πολιτική Προστασία είναι βασικές επίσημες διαδρομές σε επικίνδυνα γεγονότα.\n\nΚωδικοί τεκμηρίωσης: GR-112-1, GR-GENERAL-1, READY-COMMS-1."}},{"id":95,"en":{"title":"Offline information cache: save the guidance you may need after the network disappears","body":"## Cache stable references, not live conditions\nStore local copies of emergency numbers, household plans, equipment manuals, medication lists, maps and official hazard guidance that remains useful offline. Do not treat a saved weather forecast, evacuation order or shelter list as current after its timestamp expires.\n\n## Put a visible “checked” date on external guidance\nThe project’s official-source index should show when links were last verified. When the internet is available, refresh time-sensitive pages and note their date. A downloaded document without context can outlive the rule it describes.\n\n## Prefer common readable formats\nPlain text, Markdown, PDF and images are usually more resilient than a web app that needs online scripts. Test files in airplane mode. Keep the most critical pages small enough to open on an older phone with limited memory.\n\n## Separate official source from project interpretation\nThe manuals can summarize operational implications, but keep the source ID and official link so a user can verify when connectivity returns. Do not copy large proprietary documents into the project without permission.\n\n## Back up the cache with the project\nInclude offline references in the same backup/restore plan as the Command Center, but avoid storing sensitive personal documents in a publicly shared release folder. Public knowledge and private state have different security requirements.\n\n## Refresh after major policy or product changes\nEmergency-number capability, shelter policy, medication instructions and manufacturer procedures can change. Review the source map at each release and retire obsolete references rather than accumulating conflicting versions.\n\nEvidence IDs: GR-112-1, READY-PLAN-1, EPA-WATER-1."},"el":{"title":"Offline αποθήκη πληροφοριών: κράτησε ό,τι θα χρειαστεί όταν χαθεί το δίκτυο","body":"## Αποθήκευσε σταθερές αναφορές και όχι ζωντανές συνθήκες\nΚράτησε τοπικά αριθμούς έκτακτης ανάγκης, οικιακά σχέδια, εγχειρίδια εξοπλισμού, λίστες φαρμάκων, χάρτες και επίσημες οδηγίες κινδύνων που παραμένουν χρήσιμες χωρίς σύνδεση. Μην θεωρείς παλιά αποθηκευμένη πρόγνωση, εντολή εκκένωσης ή λίστα καταφυγίων ως τρέχουσα όταν έχει λήξει η χρονική της αξία.\n\n## Εμφανής ημερομηνία «τελευταίου ελέγχου»\nΟ κατάλογος επίσημων πηγών του έργου πρέπει να δείχνει πότε επαληθεύτηκαν οι σύνδεσμοι. Όταν υπάρχει διαδίκτυο, ανανέωσε χρονικά ευαίσθητες σελίδες και σημείωσε ημερομηνία. Ένα κατεβασμένο αρχείο χωρίς πλαίσιο μπορεί να επιβιώσει περισσότερο από τον κανόνα που περιγράφει.\n\n## Προτίμησε κοινές αναγνώσιμες μορφές\nΑπλό κείμενο, Markdown, PDF και εικόνες είναι συνήθως πιο ανθεκτικά από διαδικτυακή εφαρμογή που χρειάζεται εξωτερικά σενάρια. Δοκίμασε τα αρχεία σε λειτουργία πτήσης. Κράτησε τις πιο κρίσιμες αναφορές αρκετά μικρές ώστε να ανοίγουν σε παλιότερο τηλέφωνο με περιορισμένη μνήμη.\n\n## Ξεχώρισε επίσημη πηγή από ερμηνεία του έργου\nΤα εγχειρίδια μπορούν να συνοψίζουν επιχειρησιακή εφαρμογή, αλλά κράτησε τον κωδικό και τον επίσημο σύνδεσμο ώστε να γίνεται επαλήθευση όταν επιστρέψει η σύνδεση. Μην αντιγράφεις μεγάλα προστατευόμενα έγγραφα μέσα στο έργο χωρίς άδεια.\n\n## Δημιούργησε εφεδρεία μαζί με το έργο\nΒάλε τις offline αναφορές στο ίδιο σχέδιο αντιγράφου με το Command Center, αλλά μην αποθηκεύεις ιδιωτικά έγγραφα μέσα στον δημόσια διανεμόμενο φάκελο του project. Η δημόσια γνώση και η προσωπική κατάσταση έχουν διαφορετικές απαιτήσεις ασφάλειας.\n\n## Ανανέωσε μετά από σημαντικές αλλαγές\nΔυνατότητες αριθμών έκτακτης ανάγκης, πολιτικές καταφυγίων, οδηγίες φαρμάκων και διαδικασίες κατασκευαστών μπορεί να αλλάξουν. Επανέλεγξε τον χάρτη πηγών σε κάθε έκδοση και αφαίρεσε παρωχημένες αναφορές αντί να συσσωρεύεις αντικρουόμενες εκδόσεις.\n\nΚωδικοί τεκμηρίωσης: GR-112-1, READY-PLAN-1, EPA-WATER-1."}},{"id":96,"en":{"title":"Timekeeping during a long outage: preserve sequence when clocks, networks and sleep cycles drift","body":"## Accurate time supports every other log\nMedication schedules, check-ins, food cold-chain decisions, generator runtime and official warnings depend on knowing when something happened. Keep at least one independent clock/watch that does not require network time and know whether it uses replaceable or rechargeable power.\n\n## Establish an incident time reference\nAt the start, note local date/time and the source used to verify it. If phones lose network synchronization, use the designated reference clock for logs. Avoid mixing devices with different incorrect times without noting the offset.\n\n## Use simple shift blocks\nFor overnight monitoring or care, define who is responsible during each block and the exact handover time. Do not create excessively short rotations that destroy sleep. The shift schedule should include protected rest, meals and a backup person.\n\n## Time-stamp official instructions\nWrite the time a 112 alert, utility notice or evacuation instruction was received. A later update can reverse or supersede it. Keeping both timestamps prevents the household from acting on an older instruction because it was printed or screenshotted.\n\n## Track duration explicitly\nInstead of saying “the freezer has been off all day,” calculate from the recorded outage start. For batteries/fuel, log runtime. Duration estimates become more accurate after each event and improve v6/v7 calculators.\n\n## Reset when normal time sources return\nCompare the reference clock to restored network/broadcast time and note any difference before correcting old records. This preserves the meaning of the incident timeline.\n\nEvidence IDs: READY-PLAN-1, GR-112-1."},"el":{"title":"Χρονομέτρηση σε μεγάλη διακοπή: διατήρησε τη σειρά όταν ρολόγια, δίκτυα και ύπνος αποσυντονίζονται","body":"## Η σωστή ώρα υποστηρίζει κάθε άλλο ημερολόγιο\nΠρόγραμμα φαρμάκων, check-in, ψυχρή αλυσίδα τροφίμων, χρόνος γεννήτριας και επίσημες προειδοποιήσεις εξαρτώνται από το πότε συνέβη κάτι. Κράτησε τουλάχιστον ένα ανεξάρτητο ρολόι που δεν χρειάζεται δίκτυο και γνώριζε αν λειτουργεί με αντικαταστάσιμη ή επαναφορτιζόμενη μπαταρία.\n\n## Όρισε χρονική αναφορά συμβάντος\nΣτην αρχή σημείωσε τοπική ημερομηνία/ώρα και την πηγή επαλήθευσης. Αν τα τηλέφωνα χάσουν αυτόματο συγχρονισμό, χρησιμοποίησε το συγκεκριμένο ρολόι για τις καταγραφές. Μην αναμειγνύεις συσκευές με διαφορετικά λάθος ρολόγια χωρίς να σημειώνεις την απόκλιση.\n\n## Απλά τμήματα βάρδιας\nΓια νυχτερινή παρακολούθηση ή φροντίδα όρισε ποιος είναι υπεύθυνος σε κάθε διάστημα και την ακριβή ώρα παράδοσης. Μην φτιάχνεις υπερβολικά μικρές βάρδιες που καταστρέφουν τον ύπνο. Το πρόγραμμα περιλαμβάνει προστατευμένη ανάπαυση, γεύματα και εφεδρικό άτομο.\n\n## Χρονική σήμανση επίσημων οδηγιών\nΓράψε πότε έλαβες ειδοποίηση 112, ανακοίνωση υπηρεσίας ή οδηγία εκκένωσης. Νεότερη ενημέρωση μπορεί να την αντικαταστήσει. Η διατήρηση και των δύο ωρών αποτρέπει να εφαρμοστεί παλιότερη οδηγία επειδή απλώς ήταν εκτυπωμένη ή σε στιγμιότυπο.\n\n## Μέτρα διάρκεια ρητά\nΑντί για «η κατάψυξη είναι κλειστή όλη μέρα», υπολόγισε από την καταγεγραμμένη ώρα απώλειας ρεύματος. Για μπαταρίες και καύσιμο γράψε χρόνο λειτουργίας. Οι πραγματικές διάρκειες βελτιώνουν τους υπολογισμούς της επόμενης φοράς.\n\n## Επαναφορά όταν επιστρέψει η κανονική ώρα\nΣύγκρινε το ρολόι αναφοράς με δίκτυο ή επίσημη μετάδοση και σημείωσε τυχόν διαφορά πριν διορθώσεις παλιές εγγραφές. Έτσι διατηρείται η σημασία της χρονογραμμής.\n\nΚωδικοί τεκμηρίωσης: READY-PLAN-1, GR-112-1."}},{"id":97,"en":{"title":"Household dependency map: find the single points of failure before an incident does","body":"## Every critical need has a chain\nA medication may depend on prescription, pharmacy, refrigeration and transport. Drinking water may depend on electricity for a pump. Communications may depend on one phone and one charger. Draw the chain for each critical need instead of writing only the final item.\n\n## Mark components with no backup\nIf one caregiver, one key, one cable, one road or one power source is the only way a need is met, highlight it. Some single points can be duplicated cheaply; others require an early relocation trigger rather than equipment.\n\n## Add time-to-failure\nEstimate how long each dependency can be unavailable before the household must change strategy. A phone charger can fail immediately but be replaced easily; a refrigerated medicine may have clinically defined limits that require healthcare guidance. Use conservative, source-based timing.\n\n## Connect chains that share the same resource\nWater pumping, refrigeration and communications may all compete for one battery station. Treating them as independent plans overestimates resilience. The Power Operations ledger can expose this competition when loads are recorded honestly.\n\n## Avoid “backup” systems with the same hidden dependency\nA second internet messaging app is not communications redundancy if both require the same cellular data. A second electric heater is not heat redundancy if the same grid supplies it. Look one level deeper.\n\n## Review after every change\nA new medical device, electric vehicle, move to a high-rise or change in caregiver can create new dependencies. Update the map and drill the highest-impact failure first.\n\nEvidence IDs: READY-PLAN-1, READY-DISABILITY-1, POWER-1."},"el":{"title":"Χάρτης εξαρτήσεων νοικοκυριού: βρες τα μοναδικά σημεία αποτυχίας πριν τα βρει η έκτακτη ανάγκη","body":"## Κάθε κρίσιμη ανάγκη έχει αλυσίδα\nΈνα φάρμακο μπορεί να εξαρτάται από συνταγή, φαρμακείο, ψύξη και μεταφορά. Το πόσιμο νερό μπορεί να εξαρτάται από ηλεκτρική αντλία. Οι επικοινωνίες από ένα τηλέφωνο και έναν φορτιστή. Σχεδίασε την αλυσίδα και όχι μόνο το τελικό αντικείμενο.\n\n## Σήμανε ό,τι δεν έχει εφεδρεία\nΑν ένας φροντιστής, ένα κλειδί, ένα καλώδιο, ένας δρόμος ή μία πηγή ισχύος είναι ο μοναδικός τρόπος να καλυφθεί ανάγκη, τόνισέ το. Κάποια σημεία διπλασιάζονται φθηνά, ενώ άλλα απαιτούν νωρίτερο όριο μετακίνησης και όχι αγορά εξοπλισμού.\n\n## Πρόσθεσε χρόνο μέχρι την αποτυχία\nΕκτίμησε πόσο μπορεί να λείψει κάθε εξάρτηση πριν αλλάξει στρατηγική. Ένας φορτιστής τηλεφώνου μπορεί να χαλάσει αμέσως αλλά να αντικατασταθεί εύκολα· ένα ψυχόμενο φάρμακο μπορεί να έχει κλινικά όρια που απαιτούν καθοδήγηση επαγγελματία. Χρησιμοποίησε συντηρητικούς χρόνους βάσει πηγής.\n\n## Σύνδεσε αλυσίδες που μοιράζονται τον ίδιο πόρο\nΑντλία νερού, ψύξη και επικοινωνίες μπορεί να ανταγωνίζονται για μία μπαταριακή μονάδα. Αν αντιμετωπιστούν ως τρία ανεξάρτητα σχέδια, η ανθεκτικότητα υπερεκτιμάται. Το Power Operations μπορεί να εμφανίσει αυτή τη σύγκρουση όταν τα φορτία καταγράφονται ειλικρινά.\n\n## Απόφυγε «εφεδρείες» με την ίδια κρυφή εξάρτηση\nΔεύτερη εφαρμογή μηνυμάτων δεν είναι πλεονασμός αν και οι δύο χρειάζονται το ίδιο δίκτυο κινητής. Δεύτερος ηλεκτρικός θερμαντήρας δεν είναι εναλλακτική αν τροφοδοτείται από το ίδιο δίκτυο. Κοίτα ένα επίπεδο βαθύτερα.\n\n## Αναθεώρηση μετά από κάθε αλλαγή\nΝέα ιατρική συσκευή, ηλεκτρικό όχημα, μετακόμιση σε ψηλό κτίριο ή αλλαγή φροντιστή μπορούν να δημιουργήσουν νέες εξαρτήσεις. Ενημέρωσε τον χάρτη και δοκίμασε πρώτα την αποτυχία με τη μεγαλύτερη επίπτωση.\n\nΚωδικοί τεκμηρίωσης: READY-PLAN-1, READY-DISABILITY-1, POWER-1."}},{"id":98,"en":{"title":"Specialist care and scheduled treatment continuity: plan the interruption before the appointment is missed","body":"## Some care cannot simply be postponed\nDialysis, infusion, wound care, oxygen supply, device support, prenatal follow-up and other scheduled services can have different urgency. The person and treating team should define what happens if the normal site is closed, transport fails or the appointment is cancelled. Do not invent a universal delay limit.\n\n## Keep the care pathway offline\nRecord clinic/service name, phone numbers, treating team, normal schedule, referral/prescription information and backup location if one has been assigned. Keep the minimum necessary medical summary with the person, not only in an online portal.\n\n## Watch transport and utility threats early\nA wildfire warning, ferry cancellation, snowstorm or long power outage may disrupt care before the appointment date. Contact the provider early when disruption is likely. For island/rural patients, travel may need to occur before the last normal transport window.\n\n## Prepare equipment and consumables for transfer\nUse the manufacturer/clinical plan for packing and power. Keep chargers, prescribed supplies and documentation together. Do not alter therapy settings to extend battery life unless the clinical plan explicitly instructs it.\n\n## Know the emergency threshold\nAsk the treating team which symptoms, device failures or missed treatments require emergency evaluation. Put that answer in the medical continuity card. The survival project stores the plan; it does not determine clinical urgency.\n\n## Reconcile after service returns\nConfirm the next appointment, replacement prescriptions/supplies and any missed-care follow-up. Update the contingency if the backup provider, travel time or equipment requirement proved different from the plan.\n\nEvidence IDs: READY-DISABILITY-1, READY-OLDER-1, ACCESS-1."},"el":{"title":"Συνέχεια εξειδικευμένης και προγραμματισμένης φροντίδας: σχεδίασε τη διακοπή πριν χαθεί το ραντεβού","body":"## Ορισμένες θεραπείες δεν μετατίθενται απλά\nΑιμοκάθαρση, έγχυση, περιποίηση τραύματος, παροχή οξυγόνου, υποστήριξη συσκευών, προγεννητική παρακολούθηση και άλλες υπηρεσίες έχουν διαφορετική χρονική κρισιμότητα. Το άτομο και η θεραπευτική ομάδα πρέπει να έχουν καθορίσει τι γίνεται αν κλείσει η κανονική μονάδα, αποτύχει η μεταφορά ή ακυρωθεί το ραντεβού. Δεν υπάρχει καθολικό «ασφαλές διάστημα» που μπορεί να εφεύρει το πρόγραμμα.\n\n## Κράτησε τη διαδρομή φροντίδας offline\nΚατέγραψε μονάδα, τηλέφωνα, θεραπευτική ομάδα, κανονικό πρόγραμμα, βασικές πληροφορίες παραπομπής/συνταγής και εφεδρικό σημείο αν έχει οριστεί. Κράτησε το ελάχιστο απαραίτητο ιατρικό σύνολο με το άτομο και όχι μόνο σε διαδικτυακή πύλη.\n\n## Παρακολούθησε έγκαιρα απειλές μεταφοράς και υποδομών\nΠροειδοποίηση πυρκαγιάς, ακύρωση πλοίου, χιονόπτωση ή μεγάλη διακοπή μπορεί να επηρεάσει τη φροντίδα πριν έρθει η ημερομηνία. Επικοινώνησε νωρίς με τον πάροχο όταν η διαταραχή είναι πιθανή. Για νησιωτικούς ή αγροτικούς ασθενείς μπορεί να απαιτηθεί μετακίνηση πριν χαθεί το τελευταίο φυσιολογικό παράθυρο μεταφοράς.\n\n## Προετοίμασε εξοπλισμό και αναλώσιμα για μεταφορά\nΧρησιμοποίησε το σχέδιο κατασκευαστή και θεραπευτικής ομάδας για συσκευασία και τροφοδοσία. Κράτησε φορτιστές, συνταγογραφημένα αναλώσιμα και έγγραφα μαζί. Μην αλλάζεις ρυθμίσεις θεραπείας για να «κρατήσει η μπαταρία» εκτός αν το κλινικό σχέδιο το ορίζει ρητά.\n\n## Γνώρισε το όριο επείγοντος\nΡώτησε την ομάδα ποια συμπτώματα, βλάβες συσκευής ή χαμένες θεραπείες απαιτούν επείγουσα αξιολόγηση. Βάλε την απάντηση στην κάρτα ιατρικής συνέχειας. Το έργο αποθηκεύει το σχέδιο και δεν αποφασίζει την κλινική επείγουσα ανάγκη.\n\n## Συμφωνία όταν επιστρέψει η υπηρεσία\nΕπιβεβαίωσε το επόμενο ραντεβού, αντικατάσταση συνταγών/αναλωσίμων και τυχόν παρακολούθηση λόγω χαμένης φροντίδας. Ενημέρωσε το εφεδρικό σχέδιο αν αποδείχθηκαν διαφορετικά ο πάροχος, ο χρόνος μεταφοράς ή οι απαιτήσεις εξοπλισμού.\n\nΚωδικοί τεκμηρίωσης: READY-DISABILITY-1, READY-OLDER-1, ACCESS-1."}},{"id":99,"en":{"title":"Oxygen, CPAP and other power-dependent respiratory equipment: plan continuity with the clinical team","body":"## Treat power loss as a medical-continuity event\nPeople using prescribed oxygen, CPAP/BiPAP or other respiratory equipment should have an outage plan from their healthcare/equipment provider. Device models, therapies and individual risks differ. Do not change flow, pressure, settings or treatment schedules to conserve electricity unless the clinical plan says to do so.\n\n## Record equipment precisely\nKeep device model, power requirements, battery type/runtime information supplied by the manufacturer, supplier contact, prescription/clinical summary and backup method approved for the person. Label proprietary adapters so they are not lost among general chargers.\n\n## Test the approved backup\nA battery that powers a phone may not support a respiratory device safely. Use only compatible equipment within manufacturer ratings. Periodically verify the backup without intentionally interrupting necessary therapy; coordinate testing with the provider when appropriate.\n\n## Define relocation before the battery is low\nKnow which outage duration, battery threshold or symptom should trigger movement to a powered location or emergency evaluation. Arrange accessible transport. Waiting until the last battery percent can turn an orderly relocation into an emergency.\n\n## Keep combustion sources away\nDo not operate generators indoors or near openings, and follow oxygen-specific fire-safety instructions from the supplier/clinical team. Oxygen can increase fire risk around ignition sources. No smoking/open flame rules around prescribed oxygen must be taken seriously.\n\n## Handover with the person\nIf care transfers to a shelter/caregiver, provide device settings as documented by the clinical plan, current power source, remaining approved reserve and supplier/healthcare contact. The receiving person should not have to guess how the equipment normally operates.\n\nEvidence IDs: READY-DISABILITY-1, POWER-CARE-1, CDC-CO-1."},"el":{"title":"Οξυγόνο, CPAP και άλλος αναπνευστικός εξοπλισμός που χρειάζεται ρεύμα: συνέχεια με την κλινική ομάδα","body":"## Η απώλεια ρεύματος είναι συμβάν ιατρικής συνέχειας\nΆτομα που χρησιμοποιούν συνταγογραφημένο οξυγόνο, CPAP/BiPAP ή άλλο αναπνευστικό εξοπλισμό χρειάζονται σχέδιο διακοπής από τον πάροχο υγείας ή εξοπλισμού. Τα μοντέλα, οι θεραπείες και οι ατομικοί κίνδυνοι διαφέρουν. Μην αλλάζεις ροή, πίεση, ρυθμίσεις ή πρόγραμμα για εξοικονόμηση ενέργειας εκτός αν το κλινικό σχέδιο το επιτρέπει.\n\n## Κατέγραψε με ακρίβεια τον εξοπλισμό\nΚράτησε μοντέλο, απαιτήσεις ισχύος, πληροφορίες μπαταρίας/αυτονομίας του κατασκευαστή, επαφή προμηθευτή, βασική συνταγή ή κλινική περίληψη και εφεδρική μέθοδο που έχει εγκριθεί για το άτομο. Σήμανε ειδικούς αντάπτορες ώστε να μην χαθούν ανάμεσα σε γενικούς φορτιστές.\n\n## Δοκίμασε την εγκεκριμένη εφεδρεία\nΜπαταρία που φορτίζει τηλέφωνο δεν σημαίνει ότι υποστηρίζει με ασφάλεια αναπνευστική συσκευή. Χρησιμοποίησε μόνο συμβατό εξοπλισμό εντός προδιαγραφών. Έλεγχε περιοδικά την εφεδρεία χωρίς σκόπιμη διακοπή απαραίτητης θεραπείας και συντόνισε με τον πάροχο όπου χρειάζεται.\n\n## Όρισε μετακίνηση πριν χαμηλώσει πολύ η μπαταρία\nΓνώρισε ποια διάρκεια διακοπής, ποιο όριο εφεδρείας ή ποιο σύμπτωμα οδηγεί σε μεταφορά σε τροφοδοτούμενο χώρο ή επείγουσα αξιολόγηση. Οργάνωσε προσβάσιμη μεταφορά. Η αναμονή μέχρι το τελευταίο ποσοστό μετατρέπει οργανωμένη μετακίνηση σε επείγον.\n\n## Μακριά οι πηγές καύσης\nΜην λειτουργείς γεννήτριες μέσα ή κοντά σε ανοίγματα και ακολούθησε ειδικούς κανόνες πυρασφάλειας οξυγόνου από προμηθευτή/κλινική ομάδα. Το οξυγόνο μπορεί να αυξήσει τον κίνδυνο φωτιάς κοντά σε πηγές ανάφλεξης. Οι απαγορεύσεις καπνίσματος και φλόγας γύρω από θεραπευτικό οξυγόνο είναι κρίσιμες.\n\n## Παράδοση μαζί με το άτομο\nΑν η φροντίδα περάσει σε καταφύγιο ή άλλο φροντιστή, δώσε τις ρυθμίσεις όπως είναι καταγεγραμμένες στο κλινικό σχέδιο, την ενεργή πηγή ισχύος, την υπόλοιπη εγκεκριμένη εφεδρεία και επαφή παρόχου/υγείας. Ο παραλήπτης δεν πρέπει να μαντεύει πώς λειτουργεί κανονικά η συσκευή.\n\nΚωδικοί τεκμηρίωσης: READY-DISABILITY-1, POWER-CARE-1, CDC-CO-1."}},{"id":100,"en":{"title":"Pregnancy and postpartum emergency continuity: keep care, transport and infant needs connected","body":"## Pregnancy changes evacuation and care logistics\nPrenatal appointments, prescribed medicines, mobility, hydration, temperature exposure and transport needs may change across pregnancy. Keep the maternity/clinical contact, expected care location, due-date information and any clinician-defined warning signs with the medical continuity card.\n\n## Plan more than one route to care\nKnow the usual facility and an alternative if the normal route or hospital is unavailable. For island/rural settings, transport disruption may justify earlier contact with the care team. Emergency services should be used for urgent symptoms according to clinical guidance; the project does not determine obstetric triage.\n\n## Protect medication and records\nCarry the current medicine list, allergies, relevant pregnancy/postpartum information and identification required by the healthcare system. Do not change prescribed medicines because of heat, evacuation or supply problems without professional advice.\n\n## Postpartum plans include the baby and the recovering parent\nSafe water, hygiene, infant feeding, temperature control, sleep and follow-up care all become linked. If breastfeeding/expressing milk, use current CDC/health guidance during power and water outages. If formula feeding, emergency-safe preparation depends on safe water and clean feeding equipment; ready-to-feed options may simplify some emergency situations when appropriate and available.\n\n## Protect privacy and physical support\nShared sheltering should provide access to a private feeding/changing area when possible, sanitation and a safe place to rest. Identify a second caregiver who can carry supplies or assist if the recovering parent cannot manage the normal load.\n\n## Escalate concerns promptly\nThe person should know the warning signs and contact pathway given by their maternity/medical team for pregnancy and postpartum complications. Severe or concerning symptoms require professional care, not troubleshooting by a preparedness manual.\n\nEvidence IDs: CDC-INFANT-1, READY-PLAN-1, READY-DISABILITY-1."},"el":{"title":"Συνέχεια φροντίδας εγκυμοσύνης και λοχείας σε έκτακτη ανάγκη: σύνδεσε υγεία, μεταφορά και ανάγκες βρέφους","body":"## Η εγκυμοσύνη αλλάζει την εφοδιαστική εκκένωσης και φροντίδας\nΠρογεννητικά ραντεβού, συνταγογραφημένα φάρμακα, κινητικότητα, ενυδάτωση, έκθεση σε θερμοκρασία και μεταφορικές ανάγκες μεταβάλλονται στη διάρκεια της εγκυμοσύνης. Κράτησε επαφή μαιευτικής/κλινικής ομάδας, προβλεπόμενο χώρο φροντίδας, πληροφορίες αναμενόμενου τοκετού και όποια προειδοποιητικά σημάδια έχει ορίσει ο θεράπων μέσα στην κάρτα ιατρικής συνέχειας.\n\n## Περισσότερες από μία διαδρομές προς φροντίδα\nΓνώρισε τη συνήθη μονάδα και εναλλακτική αν κλείσει ο δρόμος ή το νοσοκομείο δεν είναι διαθέσιμο. Σε νησιωτικό ή αγροτικό περιβάλλον, διακοπή μεταφοράς μπορεί να απαιτεί νωρίτερη επικοινωνία με την ομάδα. Σε επείγοντα συμπτώματα χρησιμοποιούνται οι υπηρεσίες σύμφωνα με κλινική καθοδήγηση· το έργο δεν αποφασίζει μαιευτική διαλογή.\n\n## Προστάτευσε φάρμακα και αρχεία\nΜετέφερε τρέχουσα λίστα φαρμάκων, αλλεργίες, σχετικές πληροφορίες εγκυμοσύνης/λοχείας και ταυτοποίηση που απαιτεί το σύστημα υγείας. Μην αλλάζεις συνταγογραφημένα φάρμακα λόγω ζέστης, εκκένωσης ή έλλειψης χωρίς επαγγελματική συμβουλή.\n\n## Η λοχεία συνδέει ανάγκες γονέα και βρέφους\nΑσφαλές νερό, υγιεινή, βρεφική διατροφή, θερμοκρασία, ύπνος και παρακολούθηση γίνονται ένα σύστημα. Για θηλασμό ή άντληση ακολούθησε την τρέχουσα καθοδήγηση CDC/υγείας σε διακοπή νερού και ρεύματος. Για φόρμουλα, η ασφαλής παρασκευή εξαρτάται από ασφαλές νερό και καθαρό εξοπλισμό· έτοιμη προς χρήση μορφή μπορεί σε ορισμένες έκτακτες συνθήκες να απλοποιεί τη διαδικασία όταν είναι κατάλληλη και διαθέσιμη.\n\n## Ιδιωτικότητα και φυσική υποστήριξη\nΚοινό καταφύγιο πρέπει όπου γίνεται να προσφέρει ιδιωτικό σημείο σίτισης/αλλαγής, υγιεινή και ασφαλή ανάπαυση. Όρισε δεύτερο φροντιστή που μπορεί να μεταφέρει εφόδια ή να βοηθήσει αν ο γονέας σε ανάρρωση δεν μπορεί να αναλάβει το συνηθισμένο φορτίο.\n\n## Έγκαιρη κλιμάκωση ανησυχιών\nΤο άτομο πρέπει να γνωρίζει τα προειδοποιητικά σημεία και το κανάλι επικοινωνίας που έχει δώσει η μαιευτική/ιατρική ομάδα για επιπλοκές εγκυμοσύνης ή λοχείας. Σοβαρά ή ανησυχητικά συμπτώματα απαιτούν επαγγελματική φροντίδα και όχι αντιμετώπιση από εγχειρίδιο ετοιμότητας.\n\nΚωδικοί τεκμηρίωσης: CDC-INFANT-1, READY-PLAN-1, READY-DISABILITY-1."}},{"id":101,"en":{"title":"Infant feeding during water, power, and evacuation emergencies","body":"## Protect the feeding method that already works\nAn emergency can remove safe water, refrigeration, electricity, privacy, cleaning facilities, transport, or access to normal supplies at the same time. The safest plan starts before the disruption: record how the infant is normally fed, what equipment is genuinely required, where replacement supplies can be obtained, and who can help if the primary caregiver is separated or exhausted. Do not change feeding methods during an emergency merely because a donated product is available.\n\n## Breastfeeding usually removes several infrastructure dependencies\nWhere breastfeeding is already established, maintaining it can avoid the need for mixing water, sterilizing preparation equipment, or preserving prepared formula. A displaced breastfeeding caregiver still needs safe drinking water, food, rest, privacy where possible, and access to skilled feeding support if pain, illness, stress, separation, or supply concerns arise. An emergency plan should identify where that support can be reached rather than assuming the caregiver must solve feeding problems alone.\n\n## Formula feeding becomes a water-and-hygiene operation\nCDC emergency guidance identifies ready-to-feed liquid infant formula as the safest formula option in an emergency because it does not need water for mixing and is packaged for direct use. If powdered or concentrated formula is the only available option, follow current public-health and product instructions and use water that authorities identify as safe for infant feeding. Do not dilute formula to make it last longer, and do not improvise homemade formula.\n\n## Cleaning capacity matters as much as the formula supply\nBottles, nipples, cups, pump parts, hands, work surfaces, and storage containers can become contamination routes when water is limited. Keep a dedicated clean feeding zone, preserve single-use items for situations where cleaning is difficult, and separate dirty items from prepared feeds. If safe cleaning cannot be maintained, seek public-health, shelter, maternity, pediatric, or feeding-support assistance early rather than stretching a failing process.\n\n## Power loss changes expressed-milk and prepared-feed decisions\nCold storage should be managed according to current CDC breast-milk/formula storage guidance and the actual temperature history, not by smell or appearance. Minimize unnecessary opening of refrigerators/freezers. If relocation is likely, plan an insulated transport method and confirm cold-storage access at the destination. Record when power was lost, when milk/feed moved to another cold source, and any uncertainty so the caregiver can make the next decision from evidence rather than memory.\n\n## Escalate feeding difficulty early\nAn infant who is feeding poorly, producing fewer wet diapers than expected, unusually sleepy, repeatedly vomiting, or otherwise appears unwell needs prompt medical assessment. The offline project should support continuity and records; it does not diagnose dehydration, prescribe feeding volumes, or replace pediatric care.\n\n## Verification anchors\n- CDC Infant and Young Child Feeding in Emergencies Toolkit: https://www.cdc.gov/infant-feeding-emergencies-toolkit/\n- CDC emergency infant-feeding checklist and formula preparation guidance.\n- Current product label, pediatric clinician, maternity/infant-feeding service, and local public-health instructions.\n\nBuild verification: 2026-08-09."},"el":{"title":"Σίτιση βρέφους σε έκτακτη ανάγκη με απώλεια νερού, ρεύματος ή μετακίνηση","body":"## Προστάτευσε τη μέθοδο σίτισης που ήδη λειτουργεί\nΜια έκτακτη ανάγκη μπορεί να αφαιρέσει ταυτόχρονα ασφαλές νερό, ψύξη, ηλεκτρικό ρεύμα, ιδιωτικότητα, δυνατότητα καθαρισμού, μεταφορά ή πρόσβαση στα συνηθισμένα εφόδια. Το ασφαλέστερο σχέδιο αρχίζει πριν από τη διακοπή: κατέγραψε πώς τρέφεται συνήθως το βρέφος, ποιος εξοπλισμός είναι πραγματικά απαραίτητος, πού βρίσκονται εναλλακτικά εφόδια και ποιος μπορεί να βοηθήσει αν ο βασικός φροντιστής απομακρυνθεί ή εξαντληθεί. Μην αλλάζεις μέθοδο σίτισης μέσα στην κρίση μόνο επειδή εμφανίστηκε ένα δωρημένο προϊόν.\n\n## Ο θηλασμός συνήθως αφαιρεί αρκετές εξαρτήσεις από υποδομές\nΌταν ο θηλασμός είναι ήδη καθιερωμένος, η συνέχισή του μπορεί να αποφεύγει την ανάγκη ανάμιξης με νερό, καθαρισμού εξοπλισμού παρασκευής ή διατήρησης έτοιμου γάλακτος. Ο φροντιστής που θηλάζει εξακολουθεί να χρειάζεται ασφαλές πόσιμο νερό, τροφή, ξεκούραση, ιδιωτικότητα όπου είναι δυνατή και πρόσβαση σε κατάλληλη υποστήριξη αν εμφανιστούν πόνος, ασθένεια, άγχος, χωρισμός ή ανησυχίες για τη σίτιση. Το σχέδιο πρέπει να δείχνει πού βρίσκεται αυτή η βοήθεια και όχι να θεωρεί ότι το πρόβλημα θα λυθεί χωρίς υποστήριξη.\n\n## Η σίτιση με φόρμουλα γίνεται επιχείρηση νερού και υγιεινής\nΗ καθοδήγηση του CDC για έκτακτες ανάγκες θεωρεί την έτοιμη προς χρήση υγρή βρεφική φόρμουλα την ασφαλέστερη επιλογή φόρμουλας σε συνθήκες κρίσης, επειδή δεν απαιτεί νερό για ανάμιξη και διατίθεται έτοιμη για χρήση. Αν υπάρχει μόνο σκόνη ή συμπυκνωμένο προϊόν, ακολούθησε τις τρέχουσες οδηγίες δημόσιας υγείας και της συσκευασίας και χρησιμοποίησε νερό που οι αρμόδιες αρχές θεωρούν κατάλληλο για βρεφική σίτιση. Μην αραιώνεις τη φόρμουλα για να διαρκέσει περισσότερο και μην αυτοσχεδιάζεις σπιτική φόρμουλα.\n\n## Η δυνατότητα καθαρισμού είναι τόσο σημαντική όσο και το ίδιο το απόθεμα\nΜπιμπερό, θηλές, κύπελλα, εξαρτήματα άντλησης, χέρια, επιφάνειες και δοχεία μπορούν να μεταδώσουν μόλυνση όταν το νερό είναι περιορισμένο. Κράτησε ξεχωριστή καθαρή ζώνη σίτισης, φύλαξε αναλώσιμα μίας χρήσης για περιπτώσεις όπου ο καθαρισμός είναι δύσκολος και χώρισε τα λερωμένα αντικείμενα από την προετοιμασμένη τροφή. Αν δεν μπορεί να διατηρηθεί ασφαλής διαδικασία, ζήτησε έγκαιρα βοήθεια από υπηρεσία δημόσιας υγείας, καταφύγιο, μαιευτική/παιδιατρική υπηρεσία ή ειδικό σίτισης.\n\n## Η διακοπή ρεύματος αλλάζει τις αποφάσεις για αντλημένο γάλα και έτοιμες τροφές\nΗ ψύξη πρέπει να ακολουθεί τις τρέχουσες οδηγίες του CDC για αποθήκευση μητρικού γάλακτος και φόρμουλας και το πραγματικό ιστορικό θερμοκρασίας, όχι την οσμή ή την εμφάνιση. Περιόρισε το άσκοπο άνοιγμα ψυγείου ή κατάψυξης. Αν πιθανόν απαιτηθεί μετακίνηση, σχεδίασε μονωμένη μεταφορά και επιβεβαίωσε ότι υπάρχει ψυχρός χώρος στον προορισμό. Κατέγραψε πότε κόπηκε το ρεύμα, πότε μεταφέρθηκε το γάλα σε άλλο ψυχρό μέσο και κάθε αβεβαιότητα.\n\n## Κλιμάκωσε έγκαιρα τη δυσκολία σίτισης\nΒρέφος που δεν τρέφεται όπως συνήθως, εμφανίζει αισθητά λιγότερες βρεγμένες πάνες, ασυνήθιστη υπνηλία, επαναλαμβανόμενο εμετό ή γενικά φαίνεται άρρωστο χρειάζεται έγκαιρη ιατρική αξιολόγηση. Το έργο υποστηρίζει συνέχεια και καταγραφή· δεν διαγιγνώσκει αφυδάτωση, δεν καθορίζει ποσότητες σίτισης και δεν αντικαθιστά παιδιατρική φροντίδα.\n\n## Πηγές επαλήθευσης\n- Εργαλειοθήκη CDC για σίτιση βρεφών και μικρών παιδιών σε έκτακτες ανάγκες: https://www.cdc.gov/infant-feeding-emergencies-toolkit/\n- Οδηγίες CDC για λίστα ετοιμότητας, παρασκευή φόρμουλας και αποθήκευση γάλακτος σε έκτακτη ανάγκη.\n- Τρέχουσα ετικέτα προϊόντος, παιδίατρος, υπηρεσία μητρότητας/σίτισης βρέφους και τοπικές οδηγίες δημόσιας υγείας.\n\nΕπαλήθευση έκδοσης: 2026-08-09."}},{"id":102,"en":{"title":"Diabetes, insulin, and glucose-management continuity during emergencies","body":"## Treat continuity as a clinical dependency, not a generic food problem\nPower loss, evacuation, heat, disrupted meals, stress, damaged pharmacies, and reduced access to clean water can all change diabetes management at once. Before an incident, keep an up-to-date medication/device list, clinician and pharmacy contacts, normal supplies, prescription information, and a written sick-day or emergency plan supplied by the person’s clinical team. The household plan should preserve access to care; it must not invent dose changes.\n\n## Insulin storage needs a documented contingency\nCDC advises keeping insulin as cool as practical during a power outage while avoiding freezing, direct heat, and direct sunlight. Different insulin products and delivery systems can have different storage limits, so the product label, pharmacist, manufacturer, and treating clinician remain the authority for a specific product. A cooler is not automatically safe if it can freeze the medicine. Record any period when storage conditions were uncertain and replace affected supplies as professional guidance recommends.\n\n## Keep the entire treatment chain together\nA diabetes kit may involve insulin or other medicines, glucose meter/continuous-monitor supplies, test strips, lancets, charging cables, batteries, pump/infusion supplies, glucagon if prescribed, identification, snacks or glucose sources specified by the care plan, and sharps disposal. Store compatible spares together and note which components expire. A working phone does not help if the only proprietary charger or sensor is left behind.\n\n## Food and hydration changes require earlier monitoring, not improvisation\nEmergency meals may contain more carbohydrate, less variety, or irregular timing. Heat illness, infection, vomiting, dehydration, and unusual physical exertion can further change glucose control. Follow the individual clinical plan for monitoring and sick days. Do not use an offline manual to decide insulin corrections, alter basal settings, or substitute medicines.\n\n## Identify escalation triggers before transport is difficult\nThe person and caregiver should know the clinician-defined signs that require urgent advice or emergency care, especially persistent extreme glucose readings, inability to keep fluids down, altered consciousness, severe weakness, breathing difficulty, suspected ketoacidosis, or other serious symptoms. If transport routes may close, the evacuation threshold should be earlier than the point at which the last supply or battery is exhausted.\n\n## Recovery includes replacing uncertain stock and restoring routine\nAfter the incident, reconcile medicines and devices, replace anything damaged by heat/water, restore normal refill timing, download or preserve relevant monitoring data if useful to the clinical team, and document the infrastructure failure that created the highest risk.\n\n## Verification anchors\n- CDC Diabetes Care During Emergencies: https://www.cdc.gov/diabetes/articles/diabetes-care-emergencies.html\n- CDC Managing Insulin in an Emergency: https://www.cdc.gov/diabetes/articles/managing-insulin-in-emergency.html\n- Individual clinician, pharmacist, manufacturer, and device instructions.\n\nBuild verification: 2026-08-09."},"el":{"title":"Συνέχεια διαβήτη, ινσουλίνης και παρακολούθησης γλυκόζης σε έκτακτη ανάγκη","body":"## Αντιμετώπισε τη συνέχεια ως κλινική εξάρτηση και όχι ως γενικό θέμα τροφίμων\nΔιακοπή ρεύματος, εκκένωση, ζέστη, ακανόνιστα γεύματα, άγχος, πρόβλημα στο φαρμακείο και περιορισμένο καθαρό νερό μπορούν να επηρεάσουν ταυτόχρονα τη διαχείριση του διαβήτη. Πριν από συμβάν κράτησε ενημερωμένη λίστα φαρμάκων/συσκευών, στοιχεία ιατρού και φαρμακείου, συνήθη εφόδια, πληροφορίες συνταγής και γραπτό σχέδιο ασθένειας ή έκτακτης ανάγκης από την κλινική ομάδα. Το οικιακό σχέδιο διατηρεί την πρόσβαση στη φροντίδα· δεν εφευρίσκει αλλαγές δοσολογίας.\n\n## Η αποθήκευση ινσουλίνης χρειάζεται καταγεγραμμένο εναλλακτικό σχέδιο\nΤο CDC συστήνει σε διακοπή ρεύματος η ινσουλίνη να διατηρείται όσο γίνεται δροσερή χωρίς να παγώνει και να προστατεύεται από άμεση θερμότητα και ηλιακή ακτινοβολία. Διαφορετικά προϊόντα και συστήματα χορήγησης έχουν διαφορετικά όρια αποθήκευσης, επομένως η ετικέτα, ο φαρμακοποιός, ο κατασκευαστής και ο θεράπων παραμένουν η αρχή για το συγκεκριμένο προϊόν. Ένα ψυγειάκι δεν είναι αυτομάτως ασφαλές αν μπορεί να παγώσει το φάρμακο. Κατέγραψε κάθε περίοδο αβέβαιων συνθηκών και αντικατάστησε το απόθεμα σύμφωνα με επαγγελματική καθοδήγηση.\n\n## Κράτησε ολόκληρη την αλυσίδα θεραπείας μαζί\nΈνα κιτ διαβήτη μπορεί να περιλαμβάνει ινσουλίνη ή άλλα φάρμακα, μετρητή ή σύστημα συνεχούς μέτρησης, ταινίες, βελόνες, καλώδια/μπαταρίες, υλικά αντλίας, γλυκαγόνη αν έχει συνταγογραφηθεί, ταυτοποίηση, πηγή γλυκόζης που προβλέπει το προσωπικό σχέδιο και ασφαλή απόρριψη αιχμηρών. Φύλαξε συμβατά ανταλλακτικά μαζί και σημείωσε λήξεις. Ένα φορτισμένο τηλέφωνο δεν βοηθά αν έχει μείνει πίσω ο μοναδικός ειδικός φορτιστής ή αισθητήρας.\n\n## Οι αλλαγές σε τροφή και ενυδάτωση απαιτούν νωρίτερη παρακολούθηση, όχι αυτοσχεδιασμό\nΤα γεύματα ανάγκης μπορεί να έχουν διαφορετικούς υδατάνθρακες, μικρότερη ποικιλία ή ακανόνιστο χρόνο. Θερμική νόσος, λοίμωξη, εμετός, αφυδάτωση και ασυνήθιστη σωματική προσπάθεια μπορούν επίσης να αλλάξουν τον γλυκαιμικό έλεγχο. Ακολούθησε το εξατομικευμένο κλινικό σχέδιο για μετρήσεις και ημέρες ασθένειας. Μην χρησιμοποιείς offline εγχειρίδιο για διορθώσεις ινσουλίνης, αλλαγές βασικού ρυθμού ή υποκατάσταση φαρμάκων.\n\n## Καθόρισε όρια κλιμάκωσης πριν γίνει δύσκολη η μεταφορά\nΤο άτομο και ο φροντιστής πρέπει να γνωρίζουν τα κλινικά καθορισμένα σημεία που απαιτούν άμεση συμβουλή ή επείγουσα φροντίδα, ιδιαίτερα επίμονες ακραίες μετρήσεις, αδυναμία διατήρησης υγρών, μεταβολή συνείδησης, έντονη αδυναμία, δυσκολία αναπνοής, υποψία κετοξέωσης ή άλλα σοβαρά συμπτώματα. Αν μπορεί να κλείσουν δρόμοι, το όριο εκκένωσης πρέπει να προηγείται της εξάντλησης του τελευταίου εφοδίου ή της μπαταρίας.\n\n## Η αποκατάσταση περιλαμβάνει αντικατάσταση αβέβαιου αποθέματος και επιστροφή στη ρουτίνα\nΜετά το συμβάν συμφώνησε ξανά φάρμακα και συσκευές, αντικατάστησε ό,τι εκτέθηκε σε θερμότητα ή νερό, επανάφερε το πρόγραμμα ανανέωσης, διατήρησε χρήσιμα δεδομένα μετρήσεων για την κλινική ομάδα και κατέγραψε ποια αστοχία υποδομής δημιούργησε τον μεγαλύτερο κίνδυνο.\n\n## Πηγές επαλήθευσης\n- CDC — φροντίδα διαβήτη σε έκτακτες ανάγκες: https://www.cdc.gov/diabetes/articles/diabetes-care-emergencies.html\n- CDC — διαχείριση ινσουλίνης σε έκτακτη ανάγκη: https://www.cdc.gov/diabetes/articles/managing-insulin-in-emergency.html\n- Εξατομικευμένες οδηγίες θεράποντα, φαρμακοποιού, κατασκευαστή και ιατρικής συσκευής.\n\nΕπαλήθευση έκδοσης: 2026-08-09."}},{"id":103,"en":{"title":"Epilepsy and seizure continuity during evacuation, sheltering, and disrupted access","body":"## Missed medication is an operational risk to plan around\nFor a person whose seizure control depends on regular medication, evacuation and pharmacy disruption can create risk even when the primary hazard does not cause injury. Keep the current medicine list, schedule, prescriber/pharmacy details, medical identification, and a protected carry supply according to clinician/pharmacy advice. Store it where it leaves with the person rather than in a distant household reserve.\n\n## Teach the household the person’s established seizure plan\nCaregivers, family, school/work contacts, and shelter companions who may be responsible should know the individual’s usual seizure pattern and what the treating clinician has instructed. General seizure first aid emphasizes protecting the person from injury, staying with them, and avoiding harmful myths such as restraining them or placing objects in the mouth. A personalized rescue-medication plan, if prescribed, must come from the clinician and product instructions.\n\n## Build environmental protection into shelter selection\nFalls, open flames, stairs, water, traffic, machinery, and extreme heat can make an otherwise manageable seizure more dangerous. Choose sleeping and waiting areas away from obvious secondary hazards. If the person has a seizure-related drowning risk, plan supervision and safer hygiene/water arrangements rather than assuming swimming ability removes that risk.\n\n## Sleep, stress, illness, and schedule disruption matter\nAn evacuation can create sleep deprivation, missed meals, medication delays, alcohol exposure, illness, or flashing/visual triggers for some individuals. The plan should preserve the person’s known routine and clinician-identified triggers where practical. It should not claim that every seizure has the same trigger or that a household can prevent all seizures.\n\n## Define when emergency help is required\nFollow the person’s clinical seizure action plan and local emergency-service guidance. Households should know when a seizure is unusual for that person, prolonged beyond the action-plan threshold, repeated without recovery, associated with serious injury, breathing difficulty, water exposure, pregnancy, or another condition that requires urgent care. The offline manual does not replace emergency assessment.\n\n## Make shelter staff aware without oversharing\nIf staying in a public shelter or evacuation center, tell appropriate staff what support is needed, how to contact the caregiver, and where essential medicine or rescue instructions are kept. Share the minimum health information necessary for safety.\n\n## Verification anchors\n- CDC archived Epilepsy and Disaster Preparedness guidance.\n- CDC seizure-first-aid and disaster-health messaging.\n- Individual neurologist/clinician seizure action plan and prescribed rescue-medication instructions.\n\nBuild verification: 2026-08-09."},"el":{"title":"Συνέχεια επιληψίας και κρίσεων κατά την εκκένωση, παραμονή σε καταφύγιο και διακοπή πρόσβασης","body":"## Η απώλεια προγραμματισμένης αγωγής είναι επιχειρησιακός κίνδυνος\nΓια άτομο του οποίου ο έλεγχος κρίσεων εξαρτάται από τακτική φαρμακευτική αγωγή, η εκκένωση και η διακοπή λειτουργίας φαρμακείου δημιουργούν κίνδυνο ακόμη κι αν ο αρχικός κίνδυνος δεν προκαλέσει τραυματισμό. Κράτησε την τρέχουσα λίστα φαρμάκων, πρόγραμμα λήψης, στοιχεία ιατρού/φαρμακείου, ιατρική ταυτοποίηση και προστατευμένο φορητό απόθεμα σύμφωνα με οδηγίες κλινικού/φαρμακοποιού. Το απόθεμα πρέπει να φεύγει μαζί με το άτομο και όχι να βρίσκεται σε απομακρυσμένη αποθήκη.\n\n## Δίδαξε στο νοικοκυριό το ήδη καθορισμένο σχέδιο κρίσης\nΦροντιστές, οικογένεια, σχολείο/εργασία και όσοι μπορεί να βοηθούν σε καταφύγιο πρέπει να γνωρίζουν το συνήθες πρότυπο κρίσεων και τις οδηγίες του θεράποντα. Η γενική πρώτη βοήθεια σε κρίση επικεντρώνεται στην προστασία από τραυματισμό, στην παραμονή δίπλα στο άτομο και στην αποφυγή επικίνδυνων μύθων όπως ακινητοποίηση ή τοποθέτηση αντικειμένων στο στόμα. Εξατομικευμένη χρήση φαρμάκου διάσωσης, αν υπάρχει, προέρχεται αποκλειστικά από κλινική οδηγία και τις οδηγίες του προϊόντος.\n\n## Ενσωμάτωσε την προστασία περιβάλλοντος στην επιλογή χώρου\nΠτώσεις, ανοιχτή φλόγα, σκάλες, νερό, κυκλοφορία, μηχανήματα και ακραία θερμοκρασία μπορούν να κάνουν μια κατά τα άλλα διαχειρίσιμη κρίση πιο επικίνδυνη. Διάλεξε χώρο ύπνου/αναμονής μακριά από προφανείς δευτερογενείς κινδύνους. Αν υπάρχει κίνδυνος πνιγμού που σχετίζεται με κρίσεις, σχεδίασε επίβλεψη και ασφαλέστερη χρήση νερού αντί να θεωρείς ότι η ικανότητα κολύμβησης καταργεί τον κίνδυνο.\n\n## Ύπνος, άγχος, ασθένεια και ανατροπή προγράμματος έχουν σημασία\nΗ εκκένωση μπορεί να προκαλέσει στέρηση ύπνου, καθυστερημένα γεύματα, καθυστέρηση φαρμάκου, έκθεση σε αλκοόλ, ασθένεια ή οπτικά ερεθίσματα σε ορισμένα άτομα. Το σχέδιο διατηρεί όσο γίνεται τη γνωστή ρουτίνα και τους εξατομικευμένους παράγοντες που έχει αναγνωρίσει ο θεράπων. Δεν ισχυρίζεται ότι όλες οι κρίσεις έχουν τα ίδια ερεθίσματα ούτε ότι μπορούν να προληφθούν όλες στο σπίτι.\n\n## Καθόρισε πότε απαιτείται επείγουσα βοήθεια\nΑκολούθησε το προσωπικό σχέδιο και τις οδηγίες των τοπικών υπηρεσιών έκτακτης ανάγκης. Το νοικοκυριό πρέπει να γνωρίζει πότε μια κρίση είναι ασυνήθιστη για το άτομο, διαρκεί πέρα από το όριο του σχεδίου, επαναλαμβάνεται χωρίς επαρκή αποκατάσταση ή συνδέεται με σοβαρό τραυματισμό, δυσκολία αναπνοής, έκθεση σε νερό, εγκυμοσύνη ή άλλη κατάσταση που απαιτεί επείγουσα αξιολόγηση. Το offline εγχειρίδιο δεν αντικαθιστά ιατρική εκτίμηση.\n\n## Ενημέρωσε το προσωπικό καταφυγίου χωρίς υπερβολική αποκάλυψη\nΣε δημόσιο καταφύγιο ή κέντρο εκκένωσης ενημέρωσε το κατάλληλο προσωπικό για την απαιτούμενη υποστήριξη, τον τρόπο επικοινωνίας με φροντιστή και πού βρίσκονται ουσιώδη φάρμακα ή γραπτές οδηγίες. Μοιράσου μόνο τις πληροφορίες υγείας που είναι αναγκαίες για ασφάλεια.\n\n## Πηγές επαλήθευσης\n- CDC: Epilepsy and Disaster Preparedness (αρχειοθετημένη επίσημη καθοδήγηση).\n- CDC: πρώτες βοήθειες κρίσεων και μηνύματα υγείας σε καταστροφές.\n- Εξατομικευμένο σχέδιο νευρολόγου/θεράποντα και οδηγίες συνταγογραφημένου φαρμάκου διάσωσης.\n\nΕπαλήθευση έκδοσης: 2026-08-09."}},{"id":104,"en":{"title":"Dialysis continuity when roads, power, water, or treatment access fail","body":"## Dialysis disruption can become time-critical\nA disaster can close roads, interrupt electrical power or water, damage a dialysis center, displace the patient, or disrupt delivery of home-dialysis supplies. People receiving dialysis need an individualized emergency plan from their renal team before such conditions occur. The household role is to preserve contacts, transport, records, supplies, power continuity where applicable, and early communication—not to invent a substitute dialysis regimen.\n\n## Build multiple contact and destination options\nRecord the usual dialysis center, renal clinician, supplier, transport provider, and at least one alternate treatment location or network contact if the care team provides one. Keep the dialysis prescription/summary and important medical information available for another facility. If a warning is issued days before likely disruption, contact the renal team early rather than waiting until a scheduled session is missed.\n\n## Home dialysis needs infrastructure-specific planning\nHome hemodialysis or peritoneal dialysis may depend on electricity, clean water, drainage, temperature-controlled supplies, sterile technique, lifting/storage space, and delivery services. Document which components are essential and what the manufacturer/renal program permits during outages. Never connect improvised water, generator, battery, or plumbing arrangements to medical equipment without explicit professional/equipment guidance.\n\n## Diet and fluid changes require the renal team’s emergency instructions\nCDC emergency information notes that dialysis access may be interrupted and points patients toward emergency renal guidance. Diet, fluid, potassium, sodium, and medication restrictions are individualized and can be dangerous if generalized. Keep the renal team’s written emergency diet/fluid instructions with the person; do not use a generic offline list as a replacement.\n\n## Transport planning should activate early\nIf the patient cannot safely miss or delay treatment according to the renal team, road closure, fuel shortage, severe weather, wildfire, or evacuation orders should trigger relocation planning before the usual route is lost. Record mobility needs, wheelchair transfer requirements, oxygen/other equipment, and whether the destination can support them.\n\n## After treatment resumes, reconcile what changed\nDocument missed/delayed sessions, substitute locations, medicine changes made by clinicians, symptoms, supply shortages, and transport failures. Replenish home supplies and update the plan while the failure chain is still clear.\n\n## Verification anchors\n- CDC: What to Do When You Need Dialysis During an Emergency: https://www.cdc.gov/kidney-disease/caring/index.html\n- CDC diabetes/emergency pages that cross-reference dialysis continuity.\n- Individual nephrologist, dialysis center, renal dietitian, equipment supplier, and treatment-program instructions.\n\nBuild verification: 2026-08-09."},"el":{"title":"Συνέχεια αιμοκάθαρσης ή περιτοναϊκής κάθαρσης όταν διακόπτονται δρόμοι, ρεύμα, νερό ή θεραπεία","body":"## Η διακοπή κάθαρσης μπορεί να γίνει χρονικά κρίσιμη\nΜια καταστροφή μπορεί να κλείσει δρόμους, να διακόψει ηλεκτρικό ρεύμα ή νερό, να προκαλέσει ζημιά στη μονάδα, να μετακινήσει τον ασθενή ή να σταματήσει την παράδοση υλικών κατ’ οίκον θεραπείας. Άτομα που λαμβάνουν κάθαρση χρειάζονται εξατομικευμένο σχέδιο από τη νεφρολογική ομάδα πριν εμφανιστεί η κρίση. Ο ρόλος του νοικοκυριού είναι επαφές, μεταφορά, αρχεία, εφόδια, συνέχεια ενέργειας όπου απαιτείται και έγκαιρη επικοινωνία — όχι αυτοσχέδιο υποκατάστατο θεραπείας.\n\n## Δημιούργησε περισσότερες από μία επιλογές επικοινωνίας και προορισμού\nΚατέγραψε τη συνήθη μονάδα, τον νεφρολόγο, τον προμηθευτή, τον τρόπο μεταφοράς και τουλάχιστον μία εναλλακτική μονάδα ή επαφή δικτύου αν την έχει δώσει η ομάδα φροντίδας. Κράτησε διαθέσιμη τη σύνοψη θεραπείας και σημαντικές ιατρικές πληροφορίες για πιθανή χρήση σε άλλη μονάδα. Αν υπάρχει προειδοποίηση αρκετές ημέρες πριν από πιθανή διακοπή, επικοινώνησε έγκαιρα αντί να περιμένεις να χαθεί προγραμματισμένη συνεδρία.\n\n## Η θεραπεία στο σπίτι απαιτεί σχέδιο ειδικό για την υποδομή\nΑιμοκάθαρση ή περιτοναϊκή κάθαρση στο σπίτι μπορεί να εξαρτάται από ρεύμα, καθαρό νερό, αποχέτευση, κατάλληλη θερμοκρασία υλικών, άσηπτη τεχνική, χώρο αποθήκευσης και υπηρεσία παράδοσης. Κατέγραψε ποια στοιχεία είναι απαραίτητα και τι επιτρέπουν κατασκευαστής και πρόγραμμα θεραπείας σε διακοπή. Μην συνδέεις αυτοσχέδιες πηγές νερού, γεννήτριες, μπαταρίες ή υδραυλικά σε ιατρικό εξοπλισμό χωρίς σαφή επαγγελματική/τεχνική οδηγία.\n\n## Αλλαγές σε δίαιτα και υγρά απαιτούν τις εξατομικευμένες οδηγίες της νεφρολογικής ομάδας\nΗ επίσημη πληροφόρηση του CDC αναγνωρίζει ότι η πρόσβαση σε κάθαρση μπορεί να διακοπεί και παραπέμπει σε ειδική καθοδήγηση έκτακτης ανάγκης. Περιορισμοί σε υγρά, κάλιο, νάτριο, τροφές και φάρμακα είναι εξατομικευμένοι και μπορεί να γίνουν επικίνδυνοι αν γενικευτούν. Κράτησε μαζί με τον ασθενή το γραπτό σχέδιο έκτακτης ανάγκης της ομάδας και όχι μια γενική offline «δίαιτα» ως υποκατάστατο.\n\n## Η μεταφορά πρέπει να ενεργοποιείται νωρίς\nΑν η νεφρολογική ομάδα θεωρεί ότι δεν είναι ασφαλής η καθυστέρηση θεραπείας, κλείσιμο δρόμων, έλλειψη καυσίμου, κακοκαιρία, πυρκαγιά ή εντολή εκκένωσης πρέπει να ενεργοποιούν μετακίνηση πριν χαθεί η συνήθης διαδρομή. Κατέγραψε ανάγκες κινητικότητας, μεταφορά αμαξιδίου, οξυγόνο ή άλλο εξοπλισμό και αν ο προορισμός μπορεί πράγματι να τα υποστηρίξει.\n\n## Μετά την επανέναρξη κατέγραψε τι άλλαξε\nΣημείωσε συνεδρίες που καθυστέρησαν ή χάθηκαν, προσωρινές μονάδες, αλλαγές φαρμάκων που έκαναν οι κλινικοί, συμπτώματα, ελλείψεις υλικών και αποτυχίες μεταφοράς. Αναπλήρωσε τα οικιακά εφόδια και ενημέρωσε το σχέδιο όσο η αλυσίδα αστοχίας είναι ακόμη σαφής.\n\n## Πηγές επαλήθευσης\n- CDC — τι να κάνεις όταν χρειάζεσαι αιμοκάθαρση σε έκτακτη ανάγκη: https://www.cdc.gov/kidney-disease/caring/index.html\n- Σελίδες CDC για διαχείριση χρόνιων παθήσεων σε έκτακτες ανάγκες που παραπέμπουν σε συνέχεια κάθαρσης.\n- Εξατομικευμένες οδηγίες νεφρολόγου, μονάδας, διαιτολόγου, προμηθευτή εξοπλισμού και θεραπευτικού προγράμματος.\n\nΕπαλήθευση έκδοσης: 2026-08-09."}},{"id":105,"en":{"title":"Chronic respiratory and cardiac conditions during wildfire-smoke episodes","body":"## Smoke risk continues even when the flame front is distant\nWildfire smoke contains fine particles and other pollutants that can aggravate asthma, COPD, cardiovascular disease and other chronic conditions. CDC notes that some people with chronic disease, children, pregnant people, and older adults may be more vulnerable. A household with a medically vulnerable person should therefore manage smoke as a health-continuity problem, not wait until visible flames approach.\n\n## Start from the clinician’s action plan\nKeep prescribed inhalers, spacers, nebulizer equipment if used, heart/lung medicines, oxygen instructions, peak-flow or other monitoring tools if prescribed, and the written action plan together. Verify expiration dates and the power requirements of any nebulizer, concentrator, CPAP/BiPAP, or monitoring device. The project can track those dependencies but should never increase medicine frequency or change oxygen settings on its own.\n\n## Reduce exposure using the cleanest practical indoor space\nWhen evacuation is not ordered, close the building against outdoor smoke as appropriate, avoid indoor particle sources, and use compatible filtration/air cleaning if available. If the building cannot maintain tolerable air because of leakage, heat, or power failure, identify a cleaner-air location or public facility before symptoms worsen. A generator must never be moved indoors to power air-cleaning or medical equipment.\n\n## Outdoor tasks need a necessity test\nDo not send the medically vulnerable household member outside simply because another person wants a visual update. Combine essential outdoor tasks, use official air-quality/smoke information, and minimize exposure. Respiratory protection can reduce particulate exposure when correctly selected and worn, but it does not make an evacuation route safe from flame, extreme heat, carbon monoxide, or all gases.\n\n## Symptoms override the household plan\nNew or worsening breathing difficulty, chest pain, severe wheezing, fainting, confusion, blue/gray discoloration, or symptoms that do not improve according to the person’s action plan require urgent professional assessment. Follow local emergency-service instructions. If the person’s normal care depends on power or a nearby hospital, smoke plus outage may justify earlier relocation.\n\n## Keep monitoring after visible smoke decreases\nCDC notes that smoke can remain after a wildfire is no longer visibly active nearby. Continue checking local air-quality/health instructions and keep the cleaner-air plan ready until conditions genuinely improve. Replace filters and clean ash/dust according to safe post-fire guidance rather than immediately stirring deposits indoors.\n\n## Verification anchors\n- CDC wildfire and wildfire-smoke safety: https://www.cdc.gov/wildfires/safety/\n- CDC wildfire smoke and chronic conditions.\n- Individual asthma/COPD/cardiac action plan and local public-health air-quality guidance.\n\nBuild verification: 2026-08-09."},"el":{"title":"Χρόνια αναπνευστικά και καρδιακά νοσήματα κατά τη διάρκεια καπνού πυρκαγιάς","body":"## Ο κίνδυνος καπνού συνεχίζεται ακόμη κι όταν η φλόγα βρίσκεται μακριά\nΟ καπνός δασικής πυρκαγιάς περιέχει λεπτά σωματίδια και άλλους ρύπους που μπορούν να επιδεινώσουν άσθμα, ΧΑΠ, καρδιαγγειακή νόσο και άλλες χρόνιες καταστάσεις. Το CDC επισημαίνει ότι ορισμένοι χρονίως πάσχοντες, παιδιά, έγκυες και ηλικιωμένοι μπορεί να είναι πιο ευάλωτοι. Ένα νοικοκυριό με ευάλωτο άτομο πρέπει επομένως να διαχειρίζεται τον καπνό ως πρόβλημα συνέχειας υγείας και όχι να περιμένει να πλησιάσει ορατή φλόγα.\n\n## Ξεκίνα από το κλινικό σχέδιο δράσης\nΚράτησε μαζί τα συνταγογραφημένα εισπνεόμενα, αεροθάλαμο, νεφελοποιητή αν χρησιμοποιείται, φάρμακα καρδιάς/πνεύμονα, οδηγίες οξυγόνου, μετρητή ροής ή άλλο εργαλείο παρακολούθησης αν έχει δοθεί, και το γραπτό σχέδιο δράσης. Έλεγξε λήξεις και απαιτήσεις ρεύματος για νεφελοποιητή, συμπυκνωτή, CPAP/BiPAP ή άλλες συσκευές. Το έργο μπορεί να καταγράφει αυτές τις εξαρτήσεις αλλά δεν αυξάνει συχνότητα φαρμάκου ούτε αλλάζει ρυθμίσεις οξυγόνου.\n\n## Μείωσε την έκθεση με τον καθαρότερο πρακτικό εσωτερικό χώρο\nΌταν δεν υπάρχει εντολή εκκένωσης, περιόρισε την είσοδο εξωτερικού καπνού όπως είναι κατάλληλο, απόφυγε εσωτερικές πηγές σωματιδίων και χρησιμοποίησε συμβατή διήθηση/καθαρισμό αέρα όπου υπάρχει. Αν το κτίριο δεν μπορεί να διατηρήσει ανεκτό αέρα λόγω διαρροών, ζέστης ή διακοπής ρεύματος, όρισε νωρίς καθαρότερο χώρο ή δημόσια εγκατάσταση. Γεννήτρια δεν μεταφέρεται ποτέ σε εσωτερικό χώρο για να τροφοδοτήσει καθαριστή αέρα ή ιατρικό εξοπλισμό.\n\n## Οι εξωτερικές εργασίες χρειάζονται έλεγχο αναγκαιότητας\nΜην στέλνεις το ευάλωτο άτομο έξω μόνο για οπτικό «έλεγχο κατάστασης». Συνδύασε απαραίτητες εξωτερικές εργασίες, χρησιμοποίησε επίσημη ενημέρωση ποιότητας αέρα/καπνού και περιόρισε τον χρόνο έκθεσης. Κατάλληλη αναπνευστική προστασία μπορεί να μειώσει έκθεση σε σωματίδια όταν επιλέγεται και εφαρμόζεται σωστά, αλλά δεν κάνει μια διαδρομή ασφαλή από φλόγα, ακραία θερμότητα, μονοξείδιο ή όλα τα αέρια.\n\n## Τα συμπτώματα υπερισχύουν του οικιακού σχεδίου\nΝέα ή επιδεινούμενη δύσπνοια, πόνος στο στήθος, έντονος συριγμός, λιποθυμία, σύγχυση, μπλε/γκρι χρώμα ή συμπτώματα που δεν βελτιώνονται σύμφωνα με το προσωπικό σχέδιο απαιτούν επείγουσα επαγγελματική αξιολόγηση. Ακολούθησε τις τοπικές υπηρεσίες έκτακτης ανάγκης. Αν η συνήθης φροντίδα εξαρτάται από ρεύμα ή κοντινό νοσοκομείο, ο συνδυασμός καπνού και διακοπής μπορεί να απαιτεί νωρίτερη μετακίνηση.\n\n## Συνέχισε την παρακολούθηση και μετά τη μείωση του ορατού καπνού\nΤο CDC σημειώνει ότι ο καπνός μπορεί να παραμένει αφού η πυρκαγιά δεν είναι πλέον ορατά ενεργή κοντά. Συνέχισε να ελέγχεις επίσημες οδηγίες ποιότητας αέρα/υγείας και κράτησε έτοιμο τον καθαρό χώρο μέχρι να βελτιωθούν πραγματικά οι συνθήκες. Αντικατάστησε φίλτρα και καθάρισε τέφρα/σκόνη με ασφαλή μεταπυρική διαδικασία και όχι με άμεση ανατάραξη των αποθέσεων μέσα στο σπίτι.\n\n## Πηγές επαλήθευσης\n- CDC — ασφάλεια σε δασικές πυρκαγιές και καπνό: https://www.cdc.gov/wildfires/safety/\n- CDC: καπνός πυρκαγιάς και άτομα με χρόνιες παθήσεις.\n- Εξατομικευμένο σχέδιο άσθματος/ΧΑΠ/καρδιολογικής φροντίδας και τοπικές οδηγίες ποιότητας αέρα.\n\nΕπαλήθευση έκδοσης: 2026-08-09."}},{"id":106,"en":{"title":"Radiation emergency: shelter, contamination, food, water, and movement boundaries","body":"## Radiation emergencies can require sheltering instead of immediate evacuation\nA radiological release, nuclear power-plant accident, dirty-bomb event, or nuclear detonation is not managed like an ordinary chemical odor or house fire. CDC and Ready.gov guidance emphasizes getting inside a substantial building, moving toward the basement or central interior area away from exterior walls/roof, staying inside, and staying tuned for official instructions. Do not self-evacuate through a contaminated outdoor area merely because leaving feels more active.\n\n## Reduce removable contamination without creating a new exposure\nIf a person was outside when material was released, follow current official decontamination instructions. In general, removing the outer layer of clothing and carefully washing exposed skin can reduce external contamination. Keep contaminated items separated from clean living space. Do not use harsh scrubbing that damages skin, and do not delay urgent medical care for serious injuries.\n\n## Food and water decisions differ from microbial contamination\nCDC radiation guidance says sealed food/drink containers and food that was already protected indoors are generally preferred, while authorities assess public water supplies. A crucial boundary: boiling water can kill many microorganisms but does not remove radioactive material. Do not apply the ordinary boil-water chapter to a radiological advisory unless authorities specifically instruct it.\n\n## Medication usually remains important\nCDC guidance notes that medicines kept indoors should generally continue to be taken; externally contaminated containers can be wiped according to instructions. Do not stop essential medicine merely because a radiation event occurred unless a clinician or authority directs otherwise. Likewise, do not take potassium iodide or any other protective medicine unless public-health authorities instruct the relevant population to do so.\n\n## Ventilation decisions depend on official instructions and building safety\nClose doors/windows and reduce outside-air intake if authorities direct sheltering. However, do not create dangerous overheating, carbon monoxide, fire, or medical-equipment failure by following a generic ventilation rule blindly. If the building becomes unsafe for another reason, follow emergency officials’ relocation directions.\n\n## Evacuation comes when authorities identify route and timing\nEmergency officials may later direct evacuation, screening, or movement to a shelter. Bring essential medicines, identification, important papers, necessary accessibility equipment, and required pet supplies. Use the route officials identify; an apparently shorter route may pass through a contaminated area.\n\n## Verification anchors\n- CDC Radiation Emergencies — Stay Inside / Get Inside / Evacuation: https://www.cdc.gov/radiation-emergencies/\n- Ready.gov Radiation Emergencies: https://www.ready.gov/radiation\n- Current national/local civil-protection, public-health, nuclear-safety, and emergency-service instructions.\n\nBuild verification: 2026-08-09."},"el":{"title":"Ραδιολογική έκτακτη ανάγκη: όρια καταφυγής, επιμόλυνσης, τροφίμων, νερού και μετακίνησης","body":"## Μια ραδιολογική έκτακτη ανάγκη μπορεί να απαιτεί παραμονή μέσα αντί για άμεση εκκένωση\nΡαδιολογική διαρροή, ατύχημα πυρηνικής εγκατάστασης, συσκευή διασποράς ή πυρηνικό συμβάν δεν διαχειρίζονται όπως μια απλή χημική οσμή ή οικιακή φωτιά. Η καθοδήγηση CDC και Ready.gov δίνει έμφαση στην είσοδο σε στιβαρό κτίριο, μετακίνηση προς υπόγειο ή κεντρικό εσωτερικό χώρο μακριά από εξωτερικούς τοίχους/οροφή, παραμονή μέσα και συνεχή επίσημη ενημέρωση. Μην αυτοεκκενώνεσαι μέσα από πιθανώς επιμολυσμένο εξωτερικό χώρο μόνο επειδή η αποχώρηση φαίνεται πιο «δραστήρια» επιλογή.\n\n## Μείωσε την αφαιρούμενη επιμόλυνση χωρίς να δημιουργήσεις νέο κίνδυνο\nΑν κάποιος βρισκόταν έξω κατά την απελευθέρωση υλικού, ακολούθησε τις τρέχουσες επίσημες οδηγίες απορρύπανσης. Γενικά, η προσεκτική αφαίρεση του εξωτερικού ρουχισμού και το πλύσιμο εκτεθειμένου δέρματος μπορούν να μειώσουν εξωτερική επιμόλυνση. Κράτησε ύποπτα αντικείμενα χωριστά από τον καθαρό χώρο. Μην τρίβεις επιθετικά ώστε να τραυματίζεται το δέρμα και μην καθυστερείς επείγουσα φροντίδα σοβαρού τραυματισμού.\n\n## Οι αποφάσεις για τρόφιμα και νερό διαφέρουν από τη μικροβιακή μόλυνση\nΗ καθοδήγηση του CDC για ραδιολογικά συμβάντα προτιμά κλειστά δοχεία τροφίμων/ποτών και τρόφιμα που ήταν ήδη προστατευμένα σε εσωτερικό χώρο, ενώ οι αρχές αξιολογούν την παροχή νερού. Κρίσιμο όριο: το βράσιμο μπορεί να καταστρέψει πολλούς μικροοργανισμούς αλλά δεν αφαιρεί ραδιενεργό υλικό. Μην εφαρμόζεις το συνηθισμένο κεφάλαιο «βράσε το νερό» σε ραδιολογική οδηγία εκτός αν το ζητήσουν ρητά οι αρχές.\n\n## Η συνέχιση σημαντικών φαρμάκων συνήθως παραμένει απαραίτητη\nΤο CDC αναφέρει ότι τα φάρμακα που βρίσκονταν μέσα συνήθως συνεχίζονται· εξωτερικά επιμολυσμένο δοχείο μπορεί να καθαριστεί σύμφωνα με επίσημες οδηγίες. Μην σταματάς απαραίτητη αγωγή επειδή συνέβη ραδιολογικό περιστατικό χωρίς οδηγία κλινικού ή αρχής. Επίσης μην λαμβάνεις ιωδιούχο κάλιο ή άλλο «προστατευτικό» φάρμακο αν δεν δοθεί σαφής δημόσια οδηγία για τον σχετικό πληθυσμό.\n\n## Ο αερισμός εξαρτάται από τις επίσημες οδηγίες και την ασφάλεια του κτιρίου\nΚλείσε πόρτες/παράθυρα και μεί
