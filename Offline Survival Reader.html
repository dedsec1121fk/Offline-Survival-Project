ected area and follow the gas provider, fire service and civil-protection instructions. Avoid actions that could create an ignition source in the affected space. Do not search for a leak with a match, lighter or improvised flame. If authorities tell you to evacuate, leave without delaying to complete a checklist.\n\n## Shutoff knowledge belongs in preparedness\n\nLearn in advance where the main shutoff is, what tool is required and whether residents are actually expected or permitted to operate it in your system. Label the location and keep access clear. A shutoff can create its own risks if a person does not understand the equipment; do not improvise on unfamiliar valves, damaged meters or pressurized systems.\n\n## Re-entry and restoration\n\nTreat a building with unresolved gas odor, damaged service equipment or fire damage as unavailable. Ventilation and service restoration should follow professional instructions. Do not reopen a supply because the smell seems weaker. After an earthquake, remember that electrical, water and structural problems may exist at the same time, so one cleared utility does not mean the building is fully safe.\n\n## Household record\n\nKeep provider contact details, meter/shutoff location, responsible adult, last inspection and any known appliance issues in the offline plan. During an event log time, odor/location, visible damage, evacuation, calls made and who gave clearance.\n\n**Source anchors:** local gas utility, fire service and civil-protection guidance. This chapter intentionally avoids equipment-specific shutoff instructions because systems differ."},"el":{"title":"Οσμή αερίου, πιθανή διαρροή και όρια απομόνωσης παροχής","body":"Μια πιθανή διαρροή καυσίμου αερίου δεν είναι άσκηση εντοπισμού βλάβης. Οσμή, συριγμός, κατεστραμμένος σωλήνας, χτύπημα συσκευής, ζημιά από σεισμό ή ανεξήγητα συμπτώματα σε κλειστό χώρο απαιτούν απόσταση, καθαρό αέρα και επαγγελματική απόκριση αντί για δοκιμές με διακόπτες ή φλόγες.\n\n## Άμεσες προτεραιότητες\n\nΜετακίνησε ανθρώπους μακριά από την ύποπτη περιοχή και ακολούθησε τις οδηγίες παρόχου αερίου, Πυροσβεστικής και Πολιτικής Προστασίας. Απόφυγε ενέργειες που μπορούν να δημιουργήσουν ανάφλεξη στον επηρεασμένο χώρο. Μην ψάχνεις διαρροή με σπίρτο, αναπτήρα ή αυτοσχέδια φλόγα. Αν δοθεί εντολή εκκένωσης, φύγε χωρίς καθυστέρηση για ολοκλήρωση λίστας.\n\n## Η γνώση της βάνας ανήκει στην προετοιμασία\n\nΜάθε εκ των προτέρων πού βρίσκεται η κύρια απομόνωση, ποιο εργαλείο απαιτείται και αν οι κάτοικοι επιτρέπεται ή αναμένεται πράγματι να τη χειριστούν στο συγκεκριμένο σύστημα. Σήμανε τη θέση και κράτησε την πρόσβαση ελεύθερη. Η απομόνωση μπορεί να δημιουργήσει νέο κίνδυνο όταν το άτομο δεν γνωρίζει τον εξοπλισμό· μην αυτοσχεδιάζεις σε άγνωστες βάνες, κατεστραμμένους μετρητές ή συστήματα υπό πίεση.\n\n## Επανείσοδος και επαναφορά\n\nΘεώρησε μη διαθέσιμο ένα κτίριο με ανεπίλυτη οσμή αερίου, κατεστραμμένο εξοπλισμό παροχής ή ζημιά από φωτιά. Ο αερισμός και η επαναφορά υπηρεσίας πρέπει να ακολουθούν επαγγελματικές οδηγίες. Μην ανοίξεις ξανά την παροχή επειδή η οσμή φαίνεται ασθενέστερη. Μετά από σεισμό μπορεί να συνυπάρχουν ηλεκτρικές, υδραυλικές και δομικές βλάβες· η έγκριση μιας παροχής δεν σημαίνει ότι ολόκληρο το κτίριο είναι ασφαλές.\n\n## Καταγραφή νοικοκυριού\n\nΚράτησε στοιχεία παρόχου, θέση μετρητή/απομόνωσης, υπεύθυνο ενήλικο, τελευταία επιθεώρηση και γνωστές βλάβες συσκευών στο offline σχέδιο. Στο συμβάν κατέγραψε ώρα, θέση οσμής, ορατές ζημιές, εκκένωση, κλήσεις και ποιος έδωσε έγκριση.\n\n**Βασικές πηγές:** ισχύουσες οδηγίες παρόχου αερίου, Πυροσβεστικού Σώματος και Πολιτικής Προστασίας. Το κεφάλαιο αποφεύγει σκόπιμα ειδικές οδηγίες χειρισμού βάνας επειδή τα συστήματα διαφέρουν."}},{"id":53,"en":{"title":"Sewage backup and indoor contamination control","body":"A sewage backup changes a room from a housekeeping problem into a contamination problem. The priority is preventing contact, keeping contamination away from food and sleeping areas, protecting vulnerable people and obtaining qualified cleanup guidance.\n\n## Establish a dirty boundary\n\nKeep children, pets, food, clean water containers and people with open wounds or weakened immunity away from the affected area. Mark a single entry point for necessary access and a place to remove contaminated footwear or outer gloves without carrying contamination deeper into the home. Do not use a contaminated sink, floor drain or toilet simply because water is moving again until the system’s status is known.\n\n## Protect clean functions\n\nMove food preparation and handwashing to a verified clean zone. If the normal handwashing point is affected, establish a temporary clean-water station before cleanup begins. Separate cloths, tools and containers used in the contaminated area; do not return them to ordinary household use without appropriate decontamination or disposal.\n\n## Cleanup boundaries\n\nStanding sewage, electrical hazards, structural damage, chemical mixing and extensive contamination can exceed safe household cleanup. Avoid mixing cleaning chemicals or creating poorly ventilated fumes. Porous materials can be difficult or impossible to restore safely depending on the contamination and local guidance.\n\n## Document the event\n\nPhotograph damage from a safe position before major disposal when claims or landlord reports may matter. Record the start time, affected rooms, depth/extent, plumbing status, electricity status, professional contacts and items discarded. Keep personal medical details out of shared damage logs unless they are necessary.\n\n**Source anchors:** WHO emergency WASH principles, CDC disaster/environmental-health guidance, local wastewater utility and public-health instructions."},"el":{"title":"Επιστροφή λυμάτων και έλεγχος εσωτερικής μόλυνσης","body":"Η επιστροφή λυμάτων μετατρέπει ένα πρόβλημα καθαριότητας σε πρόβλημα μόλυνσης. Προτεραιότητα είναι να αποτραπεί η επαφή, να μείνουν οι ρύποι μακριά από τρόφιμα και χώρους ύπνου, να προστατευτούν ευάλωτα άτομα και να ζητηθούν κατάλληλες οδηγίες καθαρισμού.\n\n## Όρισε μολυσμένη ζώνη\n\nΚράτησε παιδιά, ζώα, τρόφιμα, δοχεία καθαρού νερού και άτομα με ανοιχτές πληγές ή μειωμένη άμυνα μακριά από την περιοχή. Όρισε ένα μόνο σημείο εισόδου για απαραίτητη πρόσβαση και χώρο αφαίρεσης μολυσμένων παπουτσιών ή εξωτερικών γαντιών ώστε να μη μεταφέρεται ρύπανση στο σπίτι. Μην χρησιμοποιείς επηρεασμένο νεροχύτη, σιφόνι ή τουαλέτα μόνο επειδή το νερό άρχισε πάλι να κινείται χωρίς να γνωρίζεις την κατάσταση του συστήματος.\n\n## Προστάτευσε τις καθαρές λειτουργίες\n\nΜετέφερε προετοιμασία τροφής και πλύσιμο χεριών σε επαληθευμένα καθαρή ζώνη. Αν το συνηθισμένο σημείο πλυσίματος έχει επηρεαστεί, δημιούργησε προσωρινό σταθμό ασφαλούς νερού πριν αρχίσει ο καθαρισμός. Χώρισε πανιά, εργαλεία και δοχεία που χρησιμοποιήθηκαν στη μολυσμένη περιοχή και μην τα επιστρέψεις σε κοινή χρήση χωρίς κατάλληλη απολύμανση ή απόρριψη.\n\n## Όρια καθαρισμού\n\nΣτάσιμα λύματα, ηλεκτρικός κίνδυνος, δομική ζημιά, ανάμειξη χημικών και εκτεταμένη μόλυνση μπορεί να ξεπερνούν την ασφαλή οικιακή αντιμετώπιση. Μην αναμειγνύεις καθαριστικά και μην δημιουργείς ατμούς σε ανεπαρκώς αεριζόμενο χώρο. Πορώδη υλικά μπορεί να μην αποκαθίστανται με ασφάλεια, ανάλογα με το είδος μόλυνσης και τις τοπικές οδηγίες.\n\n## Τεκμηρίωσε το συμβάν\n\nΦωτογράφισε τη ζημιά από ασφαλή θέση πριν από μεγάλη απόρριψη, όταν χρειάζεται για ασφάλιση ή ιδιοκτήτη. Κατέγραψε ώρα έναρξης, δωμάτια, έκταση/βάθος, κατάσταση αποχέτευσης, ρεύματος, επαγγελματικές επαφές και αντικείμενα που απορρίφθηκαν. Μην βάζεις περιττές προσωπικές ιατρικές λεπτομέρειες σε κοινόχρηστα αρχεία ζημιών.\n\n**Βασικές πηγές:** αρχές έκτακτης WASH του WHO, οδηγίες CDC για περιβαλλοντική υγεία μετά από καταστροφές και ισχύουσες οδηγίες αποχέτευσης και δημόσιας υγείας."}},{"id":54,"en":{"title":"Mold, damp materials and post-flood drying decisions","body":"After water intrusion, the visible water may disappear while damp building materials continue to support microbial growth and structural deterioration. Drying is therefore a controlled recovery task, not simply opening every room and turning on any available fan.\n\n## Make the area safe before drying\n\nConfirm that electricity, structure, sewage and chemical hazards are addressed. Do not energize wet equipment or extension leads. Identify where the water came from: clean rainwater is different from sewage, floodwater or an unknown industrial source, and that difference affects what can be salvaged.\n\n## Separate clean and dirty airflow\n\nMoving air can help drying in appropriate conditions, but it can also spread dust or contamination from a dirty room into a clean sleeping or food area. Keep contaminated materials isolated and follow professional guidance when water was polluted. People with respiratory disease, significant allergies or immune compromise may need to avoid cleanup exposure.\n\n## Decide what to keep\n\nHard, cleanable surfaces and some materials may be recoverable; deeply contaminated porous items can be much harder to restore. Do not keep an item solely because it looks dry on the surface. Record odor, visible growth, softness, swelling, delamination and moisture history. When uncertain about structural materials or extensive mold, obtain qualified assessment.\n\n## Prevent recurrence\n\nFind the water source before rebuilding. Photograph hidden damage as areas are safely opened, keep invoices and drying records, and avoid sealing a wall or floor while moisture remains trapped. Re-check after rain or plumbing use.\n\n**Source anchors:** CDC environmental-health/disaster guidance and local building/public-health advice. This chapter avoids species identification and does not treat home mold tests as a substitute for correcting moisture and contamination."},"el":{"title":"Μούχλα, υγρασία και αποφάσεις ξήρανσης μετά από πλημμύρα","body":"Μετά από εισροή νερού, το ορατό νερό μπορεί να φύγει ενώ δομικά υλικά παραμένουν υγρά και συνεχίζουν να ευνοούν μικροβιακή ανάπτυξη και φθορά. Η ξήρανση είναι ελεγχόμενη εργασία αποκατάστασης και όχι απλώς άνοιγμα όλων των δωματίων με οποιονδήποτε ανεμιστήρα.\n\n## Ασφάλισε τον χώρο πριν τη ξήρανση\n\nΕπιβεβαίωσε ότι έχουν αντιμετωπιστεί ρεύμα, δομική σταθερότητα, λύματα και χημικοί κίνδυνοι. Μην ηλεκτροδοτείς βρεγμένο εξοπλισμό ή προεκτάσεις. Αναγνώρισε την πηγή του νερού: καθαρό βρόχινο νερό διαφέρει από λύματα, πλημμυρικό νερό ή άγνωστη βιομηχανική πηγή και αυτή η διαφορά επηρεάζει τι μπορεί να σωθεί.\n\n## Χώρισε καθαρή και μολυσμένη ροή αέρα\n\nΗ κίνηση αέρα μπορεί να βοηθήσει τη ξήρανση όταν είναι κατάλληλη, αλλά μπορεί επίσης να μεταφέρει σκόνη ή ρύπους από μολυσμένο δωμάτιο σε καθαρό χώρο ύπνου ή τροφίμων. Κράτησε μολυσμένα υλικά απομονωμένα και ακολούθησε επαγγελματικές οδηγίες όταν το νερό ήταν ρυπασμένο. Άτομα με αναπνευστική νόσο, σοβαρές αλλεργίες ή ανοσοκαταστολή μπορεί να χρειάζεται να αποφεύγουν την έκθεση στον καθαρισμό.\n\n## Απόφαση διατήρησης\n\nΣκληρές καθαριζόμενες επιφάνειες και ορισμένα υλικά μπορεί να αποκατασταθούν, ενώ βαθιά μολυσμένα πορώδη αντικείμενα είναι πολύ δυσκολότερα. Μην κρατάς κάτι μόνο επειδή η επιφάνεια φαίνεται στεγνή. Κατέγραψε οσμή, ορατή ανάπτυξη, μαλάκωμα, διόγκωση, αποκόλληση και ιστορικό υγρασίας. Για δομικά υλικά ή εκτεταμένη μούχλα χρειάζεται κατάλληλη αξιολόγηση όταν υπάρχει αβεβαιότητα.\n\n## Απόφυγε την επανάληψη\n\nΒρες την πηγή νερού πριν από την αποκατάσταση. Φωτογράφισε κρυφές ζημιές καθώς ανοίγονται με ασφάλεια, κράτησε παραστατικά και αρχείο ξήρανσης και μην κλείνεις τοίχο ή δάπεδο ενώ παραμένει εγκλωβισμένη υγρασία. Κάνε νέο έλεγχο μετά από βροχή ή χρήση υδραυλικών.\n\n**Βασικές πηγές:** οδηγίες CDC για περιβαλλοντική υγεία/καταστροφές και ισχύουσες τοπικές οικοδομικές και υγειονομικές οδηγίες. Δεν γίνεται αναγνώριση είδους μούχλας ούτε αντιμετωπίζονται οικιακά τεστ ως υποκατάστατο διόρθωσης της υγρασίας."}},{"id":55,"en":{"title":"Rainwater collection and non-potable boundaries","body":"Rain falling from the sky does not automatically become safe drinking water after touching a roof, gutter, tarp or container. Collection surfaces can contribute dust, bird or rodent waste, metals, chemicals and debris. Emergency planning should distinguish water collection from water treatment and should label intended use clearly.\n\n## Design the collection chain\n\nInspect the catchment, gutter or tarp before an emergency. Keep animal access, peeling coatings, fuel residues and unknown roofing materials out of the collection path. Use clean containers that can be closed and labelled. A dirty open bucket beside a road is not equivalent to a protected catchment simply because both contain rainwater.\n\n## Separate uses\n\nIf water has not been verified or treated for drinking according to authoritative guidance, keep it physically separate from potable reserves. It may have a role in flushing, some cleaning or other non-potable tasks when local conditions allow, but the container must make that boundary obvious to every household member. Never rely on memory alone when several water types are stored together.\n\n## After dry periods or contamination\n\nThe first runoff after dust, wildfire ash, bird activity or long dry weather may carry concentrated contamination. Industrial fallout or chemical-release conditions can make ordinary biological disinfection irrelevant; follow official do-not-use or water-quality notices instead of assuming boiling solves every hazard.\n\n## Log each batch\n\nRecord date, catchment, weather context, container, visible condition, intended use and any treatment performed. Link it to the Water Batch module so nobody later mistakes an unverified batch for ready drinking water.\n\n**Source anchors:** CDC/EPA emergency-water principles, WHO WASH guidance and local water authority rules. Rainwater regulations and safe uses vary by location."},"el":{"title":"Συλλογή βρόχινου νερού και όρια μη πόσιμης χρήσης","body":"Η βροχή δεν γίνεται αυτόματα ασφαλές πόσιμο νερό αφού αγγίξει στέγη, υδρορροή, μουσαμά ή δοχείο. Οι επιφάνειες συλλογής μπορούν να προσθέσουν σκόνη, περιττώματα πτηνών ή τρωκτικών, μέταλλα, χημικά και υπολείμματα. Το σχέδιο ανάγκης πρέπει να ξεχωρίζει τη συλλογή από την επεξεργασία και να δηλώνει καθαρά την προβλεπόμενη χρήση.\n\n## Σχεδίασε την αλυσίδα συλλογής\n\nΈλεγξε λεκάνη, υδρορροή ή μουσαμά πριν την ανάγκη. Κράτησε ζώα, απολεπιζόμενες επιστρώσεις, υπολείμματα καυσίμων και άγνωστα υλικά στέγης έξω από την πορεία συλλογής. Χρησιμοποίησε καθαρά δοχεία που κλείνουν και επισημαίνονται. Ένας βρόμικος ανοιχτός κουβάς δίπλα σε δρόμο δεν είναι ισοδύναμος με προστατευμένη συλλογή μόνο επειδή και τα δύο έχουν βρόχινο νερό.\n\n## Χώρισε τις χρήσεις\n\nΑν το νερό δεν έχει επαληθευτεί ή επεξεργαστεί για πόση σύμφωνα με αξιόπιστες οδηγίες, κράτησέ το φυσικά ξεχωριστό από τα πόσιμα αποθέματα. Μπορεί να χρησιμοποιείται για καζανάκι, ορισμένες εργασίες καθαρισμού ή άλλες μη πόσιμες ανάγκες όταν οι συνθήκες το επιτρέπουν, αλλά η ετικέτα του δοχείου πρέπει να κάνει το όριο προφανές σε όλους. Μην βασίζεσαι στη μνήμη όταν αποθηκεύονται διαφορετικές κατηγορίες νερού.\n\n## Μετά από ξηρασία ή ρύπανση\n\nΗ πρώτη απορροή μετά από σκόνη, τέφρα πυρκαγιάς, δραστηριότητα πτηνών ή μεγάλη ξηρή περίοδο μπορεί να μεταφέρει συγκεντρωμένους ρύπους. Βιομηχανική ή χημική ρύπανση μπορεί να κάνει την απλή βιολογική απολύμανση ανεπαρκή· ακολούθησε επίσημες απαγορεύσεις χρήσης ή ανακοινώσεις ποιότητας νερού αντί να θεωρήσεις ότι ο βρασμός λύνει κάθε κίνδυνο.\n\n## Αρχείο παρτίδας\n\nΚατέγραψε ημερομηνία, επιφάνεια συλλογής, καιρικό πλαίσιο, δοχείο, ορατή κατάσταση, προβλεπόμενη χρήση και τυχόν επεξεργασία. Σύνδεσε την εγγραφή με το Water Batch ώστε κανείς να μη θεωρήσει αργότερα μια ανεπιβεβαίωτη παρτίδα έτοιμη για πόση.\n\n**Βασικές πηγές:** αρχές έκτακτου νερού CDC/EPA, WHO WASH και ισχύοντες κανόνες τοπικής ύδρευσης. Οι επιτρεπόμενες χρήσεις βρόχινου νερού διαφέρουν ανά περιοχή."}},{"id":56,"en":{"title":"Solar, USB and small-battery charging strategy","body":"Small solar panels and power banks can extend communications and lighting during an outage, but poor energy accounting can waste scarce daylight or overheat damaged batteries. Treat charging as a scheduled resource operation rather than a permanent collection of cables.\n\n## Start with the loads\n\nList devices by consequence of failure: medical support and emergency communications first, navigation and essential lighting next, convenience last. Note each device’s connector, approximate energy need, minimum usable charge and whether it can operate while charging. Disable unnecessary background use before buying more batteries.\n\n## Match source, converter and device\n\nUse intact cables and equipment with compatible ratings. Do not improvise bare-wire connections or use swollen, leaking, wet or abnormally hot batteries. Place charging equipment where it stays dry, ventilated and protected from foot traffic. A solar panel should be positioned according to its instructions without creating a fall, roof or electrical hazard.\n\n## Use charging windows\n\nDuring useful sunlight, charge the storage device or highest-priority load first according to system design. Record starting and ending percentages or watt-hours when available; this reveals whether the setup is actually producing enough energy. At night, stop low-value loads before the reserve falls below the amount assigned to emergency communications or medical needs.\n\n## Plan for failure\n\nKeep one manual fallback for critical functions: paper contacts, printed maps, non-electric medication schedule, mechanical key and low-power light. A battery system is a continuity aid, not a guarantee.\n\n**Source anchors:** manufacturer electrical limits, fire-service battery-safety guidance and Ready.gov outage planning. This chapter does not provide custom wiring instructions."},"el":{"title":"Στρατηγική φόρτισης με ηλιακά, USB και μικρές μπαταρίες","body":"Μικρά φωτοβολταϊκά και φορητές μπαταρίες μπορούν να παρατείνουν επικοινωνίες και φωτισμό σε διακοπή ρεύματος, αλλά κακή διαχείριση ενέργειας μπορεί να σπαταλήσει τις λίγες ώρες ήλιου ή να υπερθερμάνει κατεστραμμένες μπαταρίες. Αντιμετώπισε τη φόρτιση ως προγραμματισμένη λειτουργία πόρων και όχι ως μόνιμο κουβάρι καλωδίων.\n\n## Ξεκίνα από τα φορτία\n\nΚατάγραψε τις συσκευές με βάση τη συνέπεια αν σταματήσουν: ιατρική υποστήριξη και επικοινωνία ανάγκης πρώτα, πλοήγηση και βασικός φωτισμός μετά, άνεση τελευταία. Σημείωσε σύνδεσμο, περίπου ενεργειακή ανάγκη, ελάχιστη χρήσιμη φόρτιση και αν η συσκευή λειτουργεί ενώ φορτίζει. Περιόρισε περιττή χρήση στο παρασκήνιο πριν αγοράσεις περισσότερες μπαταρίες.\n\n## Ταίριαξε πηγή, μετατροπέα και συσκευή\n\nΧρησιμοποίησε άθικτα καλώδια και εξοπλισμό με συμβατά ονομαστικά χαρακτηριστικά. Μην αυτοσχεδιάζεις με γυμνά καλώδια και μην χρησιμοποιείς διογκωμένες, διαρρέουσες, βρεγμένες ή ασυνήθιστα θερμές μπαταρίες. Τοποθέτησε τη φόρτιση σε στεγνό, αεριζόμενο σημείο χωρίς κίνδυνο να πατηθεί. Ένα φωτοβολταϊκό πρέπει να τοποθετείται σύμφωνα με τις οδηγίες του χωρίς να δημιουργεί κίνδυνο πτώσης, οροφής ή ηλεκτροπληξίας.\n\n## Παράθυρα φόρτισης\n\nΣτις χρήσιμες ώρες ήλιου φόρτισε πρώτα την αποθήκευση ή το φορτίο μεγαλύτερης προτεραιότητας σύμφωνα με τον σχεδιασμό του συστήματος. Κατέγραψε αρχικό και τελικό ποσοστό ή βατώρες όταν υπάρχουν· έτσι φαίνεται αν η εγκατάσταση παράγει πράγματι αρκετή ενέργεια. Τη νύχτα σταμάτησε χαμηλής αξίας φορτία πριν το απόθεμα πέσει κάτω από το όριο που προορίζεται για επικοινωνία ανάγκης ή ιατρικές ανάγκες.\n\n## Προετοιμάσου για αστοχία\n\nΚράτησε μη ηλεκτρική εφεδρεία για κρίσιμες λειτουργίες: χάρτινες επαφές, τυπωμένους χάρτες, χειρόγραφο πρόγραμμα φαρμάκων, μηχανικό κλειδί και φωτισμό χαμηλής κατανάλωσης. Η μπαταρία βοηθά στη συνέχεια λειτουργίας αλλά δεν την εγγυάται.\n\n**Βασικές πηγές:** ηλεκτρικά όρια κατασκευαστή, οδηγίες πυρασφάλειας μπαταριών και σχεδιασμός διακοπής ρεύματος Ready.gov. Δεν παρέχονται οδηγίες αυτοσχέδιας καλωδίωσης."}},{"id":57,"en":{"title":"Radio listening, message logging and frequency discipline","body":"A radio is most useful when the household knows what to listen for, how to preserve battery and how to write down information accurately. Owning a receiver without a listening plan can produce either silence or a stream of unverified fragments.\n\n## Prepare the listening card\n\nBefore an emergency, write the legal local broadcast sources you actually use: public radio, civil-protection channels or licensed services that apply to your equipment and country. Do not copy random internet frequency lists into the plan without verifying legality, mode and current use. Record how the radio is powered and where spare batteries or charging equipment are stored.\n\n## Use scheduled listening windows\n\nWhen the situation is stable enough, choose brief monitoring windows rather than leaving every device on continuously. Increase monitoring when official alerts, weather conditions or evacuation decisions are changing. Keep one person responsible for the written log so the household does not turn repeated broadcasts into contradictory retellings.\n\n## Log the message, not the rumor\n\nWrite time, station/source, exact location affected, instruction, deadline and whether the message was repeated or updated. Separate what the source said from your household’s interpretation. If a later bulletin changes an instruction, cross out the old action without erasing the history.\n\n## Transmission boundaries\n\nIf using two-way equipment, follow licensing, power and channel rules. Keep messages brief and operational; do not disclose unnecessary medical, identity or location details over an open channel. Emergency traffic and official responders take priority.\n\n**Source anchors:** Greek Civil Protection/112 information, relevant communications regulator rules, official broadcasters and device manuals. No fixed frequency is embedded because allocations and services change."},"el":{"title":"Ακρόαση ραδιοφώνου, αρχείο μηνυμάτων και πειθαρχία συχνοτήτων","body":"Το ραδιόφωνο είναι πραγματικά χρήσιμο όταν το νοικοκυριό γνωρίζει τι ακούει, πώς διατηρεί την μπαταρία και πώς καταγράφει σωστά τις πληροφορίες. Ένας δέκτης χωρίς σχέδιο ακρόασης μπορεί να δώσει είτε σιωπή είτε μια σειρά από μη επαληθευμένα αποσπάσματα.\n\n## Ετοίμασε κάρτα ακρόασης\n\nΠριν από ανάγκη γράψε τις νόμιμες τοπικές πηγές που χρησιμοποιείς πράγματι: δημόσια ραδιοφωνία, ανακοινώσεις Πολιτικής Προστασίας ή αδειοδοτημένες υπηρεσίες που αντιστοιχούν στον εξοπλισμό και τη χώρα. Μην αντιγράφεις τυχαίες λίστες συχνοτήτων από το διαδίκτυο χωρίς επιβεβαίωση νομιμότητας, τρόπου λειτουργίας και τρέχουσας χρήσης. Σημείωσε πώς τροφοδοτείται η συσκευή και πού βρίσκονται εφεδρικές μπαταρίες ή φόρτιση.\n\n## Προγραμματισμένα παράθυρα ακρόασης\n\nΌταν η κατάσταση το επιτρέπει, χρησιμοποίησε σύντομα διαστήματα παρακολούθησης αντί να μένουν όλες οι συσκευές συνεχώς ανοικτές. Αύξησε την ακρόαση όταν αλλάζουν επίσημες ειδοποιήσεις, καιρικές συνθήκες ή αποφάσεις εκκένωσης. Όρισε ένα άτομο για το γραπτό αρχείο ώστε οι επαναλαμβανόμενες μεταδόσεις να μη μετατρέπονται σε αντικρουόμενες προφορικές εκδοχές.\n\n## Κατέγραψε το μήνυμα, όχι τη φήμη\n\nΓράψε ώρα, σταθμό/πηγή, ακριβή περιοχή που αφορά, οδηγία, προθεσμία και αν το μήνυμα επαναλήφθηκε ή ενημερώθηκε. Ξεχώρισε τι είπε η πηγή από την ερμηνεία του νοικοκυριού. Αν νεότερη ανακοίνωση αλλάξει οδηγία, ακύρωσε ορατά την παλιά χωρίς να σβήσεις το ιστορικό.\n\n## Όρια εκπομπής\n\nΣε αμφίδρομο εξοπλισμό ακολούθησε κανόνες αδειοδότησης, ισχύος και καναλιών. Κράτησε τα μηνύματα σύντομα και επιχειρησιακά και μην μεταδίδεις περιττές ιατρικές, ταυτοποιητικές ή τοπογραφικές λεπτομέρειες σε ανοικτό κανάλι. Η επείγουσα κίνηση και οι επίσημοι διασώστες έχουν προτεραιότητα.\n\n**Βασικές πηγές:** Ελληνική Πολιτική Προστασία/112, ισχύοντες κανόνες αρμόδιας ρυθμιστικής αρχής επικοινωνιών, επίσημοι ραδιοτηλεοπτικοί φορείς και εγχειρίδια συσκευών. Δεν ενσωματώνεται σταθερή συχνότητα επειδή οι κατανομές και υπηρεσίες αλλάζουν."}},{"id":58,"en":{"title":"Lost-person self-rescue: stop or move decision","body":"Becoming disoriented is often made worse by continued movement without a verified destination. The objective is not to prove navigation skill; it is to reduce exposure, make your position easier to find and avoid converting a manageable error into injury or separation.\n\n## Recognize the loss of certainty\n\nStop when landmarks no longer match the map, the route has disappeared, daylight is becoming limited, weather is worsening, a person is exhausted or repeated “shortcuts” fail to reconnect with a known point. Record the last place you were certain of, approximate time, direction travelled and any distinctive feature passed since then.\n\n## Decide whether movement improves safety\n\nMoving may be appropriate when there is an immediate hazard such as fire, rising water, rockfall or dangerous cold exposure and a clearly safer location is known. Otherwise, random searching can make a rescue area larger. Follow the local rescue authority’s guidance and the plan left with your contact. Do not descend cliffs, enter water, caves or closed terrain merely because they appear to shorten the route.\n\n## Make yourself findable\n\nUse visible clothing, light or signalling equipment appropriate to the environment without creating a fire or electrical hazard. Conserve phone battery after communicating useful coordinates, route name, group status and urgent medical needs. If coverage is intermittent, use scheduled checks rather than constant searching when that is safe.\n\n## Household prevention\n\nLeave route, destination, turnaround time, vehicle location and overdue action with a reliable person before departure. Carry a paper map or route note even when using a phone.\n\n**Source anchors:** local mountain/rescue service instructions, civil protection and park/trail rules. This chapter does not prescribe a universal survival signal because approved methods vary by country and environment."},"el":{"title":"Αποπροσανατολισμός: απόφαση παραμονής ή μετακίνησης","body":"Ο αποπροσανατολισμός συχνά χειροτερεύει όταν κάποιος συνεχίζει να κινείται χωρίς επαληθευμένο προορισμό. Ο στόχος δεν είναι να αποδείξεις ικανότητα πλοήγησης αλλά να μειώσεις την έκθεση, να κάνεις τη θέση σου ευκολότερη στον εντοπισμό και να μην μετατρέψεις ένα διαχειρίσιμο λάθος σε τραυματισμό ή διάσπαση της ομάδας.\n\n## Αναγνώρισε την απώλεια βεβαιότητας\n\nΣταμάτα όταν τα σημεία αναφοράς δεν ταιριάζουν πια στον χάρτη, η διαδρομή έχει χαθεί, το φως μειώνεται, ο καιρός χειροτερεύει, κάποιος εξαντλείται ή επαναλαμβανόμενες «συντομεύσεις» δεν σε επιστρέφουν σε γνωστό σημείο. Κατέγραψε το τελευταίο βέβαιο σημείο, περίπου ώρα, κατεύθυνση κίνησης και χαρακτηριστικό που πέρασες μετά.\n\n## Αποφάσισε αν η κίνηση αυξάνει την ασφάλεια\n\nΗ μετακίνηση μπορεί να είναι απαραίτητη όταν υπάρχει άμεσος κίνδυνος, όπως φωτιά, ανερχόμενο νερό, βραχοπτώσεις ή επικίνδυνη έκθεση στο κρύο, και γνωρίζεις καθαρά ασφαλέστερη θέση. Διαφορετικά, τυχαία αναζήτηση μπορεί να μεγαλώσει την περιοχή έρευνας. Ακολούθησε τις οδηγίες της αρμόδιας υπηρεσίας διάσωσης και το σχέδιο που έχεις αφήσει σε επαφή. Μην κατεβαίνεις γκρεμούς, μπαίνεις σε νερό, σπηλιές ή κλειστό έδαφος επειδή φαίνεται να συντομεύει τη διαδρομή.\n\n## Κάνε τη θέση σου εντοπίσιμη\n\nΧρησιμοποίησε ορατά ρούχα, φωτισμό ή κατάλληλο εξοπλισμό σήμανσης χωρίς να δημιουργείς κίνδυνο φωτιάς ή ηλεκτρισμού. Μετά από χρήσιμη επικοινωνία συντεταγμένων, ονόματος διαδρομής, κατάστασης ομάδας και επείγουσας ιατρικής ανάγκης, εξοικονόμησε μπαταρία. Αν το σήμα εμφανίζεται περιοδικά, προτίμησε προγραμματισμένους ελέγχους αντί για συνεχή αναζήτηση όταν αυτό είναι ασφαλές.\n\n## Πρόληψη\n\nΠριν φύγεις, άφησε σε αξιόπιστο άτομο διαδρομή, προορισμό, ώρα αναστροφής, θέση οχήματος και ενέργεια αν καθυστερήσεις. Κράτησε χάρτινο χάρτη ή γραπτή κάρτα πορείας ακόμη κι όταν χρησιμοποιείς κινητό.\n\n**Βασικές πηγές:** οδηγίες τοπικών υπηρεσιών ορεινής/διασωστικής βοήθειας, Πολιτικής Προστασίας και κανόνες πάρκου ή μονοπατιού. Δεν δίνεται ένα «παγκόσμιο» σήμα διάσωσης επειδή οι εγκεκριμένες μέθοδοι διαφέρουν ανά χώρα και περιβάλλον."}},{"id":59,"en":{"title":"Paper map, route card and turnaround discipline","body":"Offline navigation becomes more resilient when a phone map is backed by a simple paper record that explains where the group intended to go. The paper does not need to be beautiful; it needs to remain readable after the battery is gone.\n\n## Build a route card\n\nWrite start point, destination, primary route, alternate route, major junctions, water crossings, steep or exposed sections, planned rest points, vehicle location and a conservative turnaround time. Add the coordinates of only the few waypoints that matter; a page filled with numbers can be harder to use under stress than a short sequence of obvious checkpoints.\n\n## Orient before moving\n\nAt every major junction compare the real terrain with map features and confirm the direction before walking or driving farther. If the map, compass, road sign and memory disagree, stop and resolve the disagreement while you still have a known point behind you. Do not use a compass bearing to justify crossing terrain that is visibly unsafe or officially closed.\n\n## Protect the paper\n\nKeep one route card with the traveller and another with the contact or vehicle when appropriate. Use pencil or waterproof storage if conditions demand it. Mark closures and changes with date/time rather than erasing the original route, so the handover explains why the group deviated.\n\n## Turnaround is a safety tool\n\nDefine the time, daylight, weather, fuel/water reserve or physical condition that triggers return. A turnaround point prevents “almost there” thinking from consuming the reserve needed to get back.\n\n**Source anchors:** official mapping/park guidance, local rescue advice and the project’s Navigation module. Map data can become stale; closures and emergency instructions override the route card."},"el":{"title":"Χάρτινος χάρτης, κάρτα διαδρομής και πειθαρχία αναστροφής","body":"Η offline πλοήγηση γίνεται πιο ανθεκτική όταν ο χάρτης στο κινητό υποστηρίζεται από μια απλή χάρτινη εγγραφή που εξηγεί πού σκόπευε να πάει η ομάδα. Το χαρτί δεν χρειάζεται να είναι όμορφο· πρέπει να παραμένει κατανοητό όταν τελειώσει η μπαταρία.\n\n## Δημιούργησε κάρτα πορείας\n\nΓράψε σημείο έναρξης, προορισμό, κύρια και εναλλακτική πορεία, μεγάλες διασταυρώσεις, περάσματα νερού, απότομα ή εκτεθειμένα τμήματα, προβλεπόμενες στάσεις, θέση οχήματος και συντηρητική ώρα αναστροφής. Πρόσθεσε συντεταγμένες μόνο για τα λίγα κρίσιμα σημεία· μια σελίδα γεμάτη αριθμούς μπορεί να είναι δυσκολότερη υπό πίεση από μια σύντομη ακολουθία σαφών σημείων.\n\n## Προσανατολίσου πριν συνεχίσεις\n\nΣε κάθε σημαντική διασταύρωση σύγκρινε το πραγματικό έδαφος με τα χαρακτηριστικά του χάρτη και επιβεβαίωσε κατεύθυνση πριν κινηθείς πιο μακριά. Αν χάρτης, πυξίδα, πινακίδα και μνήμη διαφωνούν, σταμάτα και λύσε τη διαφωνία ενώ υπάρχει ακόμη γνωστό σημείο πίσω σου. Μην χρησιμοποιείς μια ένδειξη πυξίδας ως δικαιολογία για να περάσεις έδαφος που φαίνεται επικίνδυνο ή είναι επίσημα κλειστό.\n\n## Προστάτευσε το χαρτί\n\nΚράτησε ένα αντίγραφο με τον ταξιδιώτη και ένα με την επαφή ή στο όχημα όταν είναι κατάλληλο. Χρησιμοποίησε μολύβι ή αδιάβροχη θήκη αν το απαιτούν οι συνθήκες. Σήμανε κλεισίματα και αλλαγές με ημερομηνία/ώρα αντί να σβήσεις την αρχική πορεία, ώστε η παράδοση να εξηγεί την απόκλιση.\n\n## Η αναστροφή είναι εργαλείο ασφάλειας\n\nΌρισε ώρα, διαθέσιμο φως, καιρό, απόθεμα καυσίμου/νερού ή φυσική κατάσταση που ενεργοποιεί επιστροφή. Το προκαθορισμένο όριο εμποδίζει τη σκέψη «λίγο ακόμη» να καταναλώσει το απόθεμα που χρειάζεται για την επιστροφή.\n\n**Βασικές πηγές:** επίσημοι χάρτες και κανόνες περιοχής, τοπικές οδηγίες διάσωσης και η ενότητα Navigation του έργου. Τα χαρτογραφικά δεδομένα παλιώνουν· κλεισίματα και εντολές ανάγκης υπερισχύουν."}},{"id":60,"en":{"title":"Fatigue, sleep and shift-handover control","body":"Long emergencies are often damaged by ordinary fatigue rather than dramatic equipment failure. Tired people miss medication times, repeat work, forget a shutoff, misread messages and take risks they would reject when rested. A household therefore needs a rest plan as much as a task list.\n\n## Protect minimum functioning\n\nIdentify tasks that truly require continuous watch: fire/smoke risk, a medically vulnerable person, rapidly changing weather or security. Everything else should be grouped into scheduled checks so at least one capable person can sleep. Do not make the most exhausted person the permanent night watch simply because they volunteered first.\n\n## Make shifts explicit\n\nWrite who is responsible, start/end time, what must be checked, what conditions wake the next person and what equipment changes hands. Keep the shift short enough that attention remains useful. If only one adult is available, simplify the operation: reduce optional tasks, use alarms where safe and seek outside support rather than pretending continuous vigilance is possible indefinitely.\n\n## Handover before rest\n\nThe outgoing person states people accounted for, urgent hazards, medical issues, water/food/power status, active decisions, next official-information check and any unresolved problem. The incoming person repeats the critical points back. This prevents a notebook entry from being mistaken for actual understanding.\n\n## Watch for degraded judgement\n\nRepeated mistakes, irritability, microsleeps, confusion, unsafe shortcuts and inability to remember the last action are operational warnings. Stop complex work and reassign or rest when possible. Severe confusion or unusual medical symptoms require appropriate medical evaluation rather than being labelled “just tired.”\n\n**Source anchors:** emergency-management human-factors practice, WHO psychosocial/emergency principles and local occupational-safety guidance."},"el":{"title":"Κόπωση, ύπνος και έλεγχος παράδοσης βάρδιας","body":"Σε μια μακρά κρίση, η συνηθισμένη κόπωση μπορεί να προκαλέσει περισσότερα λάθη από μια εντυπωσιακή βλάβη εξοπλισμού. Κουρασμένοι άνθρωποι χάνουν ώρες φαρμάκων, επαναλαμβάνουν δουλειές, ξεχνούν απομόνωση παροχής, παρερμηνεύουν μηνύματα και παίρνουν ρίσκα που θα απέρριπταν ξεκούραστοι. Το νοικοκυριό χρειάζεται σχέδιο ανάπαυσης όσο χρειάζεται λίστα εργασιών.\n\n## Προστάτευσε τη βασική λειτουργικότητα\n\nΞεχώρισε ποιες εργασίες απαιτούν πραγματικά συνεχή επιτήρηση: κίνδυνος φωτιάς/καπνού, ιατρικά ευάλωτο άτομο, γρήγορη αλλαγή καιρού ή ασφάλειας. Όλα τα υπόλοιπα ομαδοποίησέ τα σε προγραμματισμένους ελέγχους ώστε τουλάχιστον ένα ικανό άτομο να κοιμηθεί. Μην κάνεις τον πιο εξαντλημένο μόνιμο νυχτερινό υπεύθυνο επειδή προσφέρθηκε πρώτος.\n\n## Κάνε τις βάρδιες σαφείς\n\nΓράψε υπεύθυνο, ώρα αρχής/λήξης, υποχρεωτικούς ελέγχους, ποια συνθήκη ξυπνά το επόμενο άτομο και ποιος εξοπλισμός παραδίδεται. Η βάρδια πρέπει να είναι αρκετά σύντομη ώστε η προσοχή να παραμένει χρήσιμη. Αν υπάρχει μόνο ένας ενήλικος, απλοποίησε τη λειτουργία: κόψε προαιρετικές εργασίες, χρησιμοποίησε ασφαλείς υπενθυμίσεις και ζήτησε εξωτερική υποστήριξη αντί να προσποιείσαι ότι η συνεχής επιτήρηση μπορεί να διαρκέσει απεριόριστα.\n\n## Παράδοση πριν την ανάπαυση\n\nΟ εξερχόμενος αναφέρει καταμέτρηση ανθρώπων, επείγοντες κινδύνους, ιατρικά ζητήματα, κατάσταση νερού/τροφής/ενέργειας, ενεργές αποφάσεις, επόμενο έλεγχο επίσημων πληροφοριών και κάθε ανοιχτό πρόβλημα. Ο εισερχόμενος επαναλαμβάνει τα κρίσιμα σημεία. Έτσι μια σημείωση στο χαρτί δεν θεωρείται λανθασμένα ότι έχει γίνει κατανοητή.\n\n## Σημάδια υποβάθμισης κρίσης\n\nΕπαναλαμβανόμενα λάθη, ευερεθιστότητα, μικρο-ύπνοι, σύγχυση, επικίνδυνες συντομεύσεις και αδυναμία ανάκλησης της τελευταίας ενέργειας είναι επιχειρησιακές προειδοποιήσεις. Σταμάτα σύνθετη εργασία και άλλαξε υπεύθυνο ή ξεκουράσου όταν γίνεται. Σοβαρή σύγχυση ή ασυνήθιστα ιατρικά συμπτώματα χρειάζονται κατάλληλη αξιολόγηση και δεν πρέπει να αποδίδονται απλώς στην κούραση.\n\n**Βασικές πηγές:** πρακτικές ανθρώπινων παραγόντων στη διαχείριση κρίσεων, αρχές ψυχοκοινωνικής υποστήριξης WHO και ισχύουσες οδηγίες επαγγελματικής ασφάλειας."}},{"id":61,"en":{"title":"Psychological first aid and distress-support boundaries","body":"People in a disaster may be frightened, silent, angry, confused, grieving or intensely practical. Support does not require forcing them to describe the event. Psychological first aid focuses on humane, practical assistance, connection and referral while respecting dignity and choice.\n\n## Start with safety and basic needs\n\nMove the conversation away from immediate physical danger. Offer simple information about shelter, water, food, family contact, medicines or transport. Ask what the person needs now rather than assuming that emotional discussion is the priority. Use clear language and an interpreter or communication support when needed.\n\n## Listen without interrogation\n\nLet the person decide whether to talk. Avoid demanding a detailed retelling, making promises you cannot keep or telling someone exactly how they “should” feel. For a child, maintain connection with a safe caregiver wherever possible and keep explanations appropriate to age and development.\n\n## Restore small choices\n\nDisasters remove control. Offer manageable choices: where to sit, whom to contact first, whether they want water, whether they prefer written or spoken information. Protect privacy and do not turn someone’s distress into a group story or social-media update.\n\n## Know the escalation boundary\n\nImmediate danger to self or others, severe disorientation, inability to care for essential needs, acute medical symptoms or worsening mental-health symptoms require qualified professional/emergency support. Volunteers should work within training and local referral systems.\n\n## Support the helper too\n\nRotate demanding roles, debrief operational facts without pressuring emotional disclosure, eat/drink/rest when possible and watch for degraded judgement. A helper who is exhausted is also part of the safety system.\n\n**Source anchors:** WHO/IASC psychological first-aid and emergency psychosocial principles; local health and emergency referral pathways."},"el":{"title":"Ψυχολογικές πρώτες βοήθειες και όρια υποστήριξης έντονης δυσφορίας","body":"Σε μια καταστροφή οι άνθρωποι μπορεί να είναι φοβισμένοι, σιωπηλοί, θυμωμένοι, μπερδεμένοι, πενθούντες ή απόλυτα πρακτικοί. Η υποστήριξη δεν απαιτεί να τους πιέσεις να περιγράψουν το συμβάν. Οι ψυχολογικές πρώτες βοήθειες εστιάζουν σε ανθρώπινη, πρακτική βοήθεια, σύνδεση και παραπομπή με σεβασμό στην αξιοπρέπεια και την επιλογή.\n\n## Ξεκίνα από ασφάλεια και βασικές ανάγκες\n\nΜετέφερε τη συζήτηση μακριά από άμεσο φυσικό κίνδυνο. Πρόσφερε απλή πληροφορία για καταφύγιο, νερό, τρόφιμα, επαφή με οικογένεια, φάρμακα ή μεταφορά. Ρώτησε τι χρειάζεται το άτομο τώρα αντί να θεωρήσεις ότι προτεραιότητα είναι η συναισθηματική συζήτηση. Χρησιμοποίησε καθαρή γλώσσα και διερμηνεία ή άλλη υποστήριξη επικοινωνίας όταν απαιτείται.\n\n## Άκου χωρίς ανάκριση\n\nΆφησε το άτομο να αποφασίσει αν θέλει να μιλήσει. Μην απαιτείς λεπτομερή επανάληψη του γεγονότος, μην υπόσχεσαι πράγματα που δεν ελέγχεις και μην λες πώς «πρέπει» να νιώθει. Για παιδί, διατήρησε σύνδεση με ασφαλή φροντιστή όπου γίνεται και δώσε εξηγήσεις κατάλληλες για ηλικία και ανάπτυξη.\n\n## Επανέφερε μικρές επιλογές\n\nΗ κρίση αφαιρεί έλεγχο. Πρόσφερε διαχειρίσιμες επιλογές: πού θα καθίσει, ποιον θα καλέσει πρώτα, αν θέλει νερό, αν προτιμά γραπτή ή προφορική πληροφορία. Προστάτευσε την ιδιωτικότητα και μην μετατρέπεις τη δυσφορία του σε ιστορία για την ομάδα ή τα κοινωνικά δίκτυα.\n\n## Γνώριζε το όριο παραπομπής\n\nΆμεσος κίνδυνος για τον ίδιο ή άλλους, σοβαρός αποπροσανατολισμός, αδυναμία κάλυψης βασικών αναγκών, οξέα ιατρικά συμπτώματα ή επιδείνωση ψυχικής υγείας απαιτούν κατάλληλη επαγγελματική/επείγουσα υποστήριξη. Οι εθελοντές πρέπει να λειτουργούν μέσα στα όρια εκπαίδευσής τους και του τοπικού συστήματος παραπομπής.\n\n## Προστάτευσε και τον βοηθό\n\nΕναλλάσσετε απαιτητικούς ρόλους, κάντε επιχειρησιακή ανασκόπηση χωρίς πίεση για συναισθηματική αποκάλυψη, φάτε/πιείτε/ξεκουραστείτε όταν είναι εφικτό και προσέξτε την υποβάθμιση κρίσης. Ένας εξαντλημένος βοηθός είναι επίσης μέρος του συστήματος ασφάλειας.\n\n**Βασικές πηγές:** αρχές ψυχολογικών πρώτων βοηθειών WHO/IASC και τοπικές διαδρομές παραπομπής υγείας και έκτακτης ανάγκης."}},{"id":62,"en":{"title":"Foodborne-illness cluster and kitchen stop rule","body":"When several people become ill after sharing food or water, the priority is not to prove the exact organism at home. The useful household action is to stop exposing more people, preserve factual information and obtain medical/public-health advice when indicated.\n\n## Recognize a possible common exposure\n\nRecord who is ill, symptoms, when symptoms began and what foods/water were shared in the preceding period. Do not assume the last meal is automatically responsible. Keep the record factual; avoid labelling a person or cook as the cause without evidence.\n\n## Stop the suspected pathway\n\nSet aside the suspect food or water so nobody else consumes it. Do not “test” questionable food by tasting. Clean hands and separate food-preparation surfaces according to safe-food guidance. If a refrigerator outage, flood, sewage event or water advisory occurred, include that timeline because it changes the investigation.\n\n## Medical boundaries\n\nSevere dehydration, blood in stool or vomit, persistent high fever, neurological symptoms, severe pain, breathing difficulty, signs of shock, illness in an infant or other vulnerable person, or rapidly worsening condition require prompt professional assessment. Medication decisions belong with appropriate clinicians/pharmacists.\n\n## Preserve useful evidence\n\nKeep packaging, product name, lot/date information, receipts and photos when safe. If authorities or a clinician advise retaining a food sample, follow their instructions; otherwise do not keep hazardous food where it can be eaten accidentally.\n\n## Reopen the kitchen deliberately\n\nResume normal preparation only after the contamination pathway is understood and the affected surfaces, water source and cold chain are safe for use.\n\n**Source anchors:** WHO food-safety principles, CDC food-safety/disaster guidance and local public-health reporting requirements."},"el":{"title":"Συστάδα τροφιμογενούς νόσου και κανόνας παύσης κουζίνας","body":"Όταν πολλά άτομα αρρωσταίνουν αφού μοιράστηκαν τρόφιμο ή νερό, προτεραιότητα δεν είναι να αναγνωριστεί στο σπίτι ο ακριβής μικροοργανισμός. Η χρήσιμη ενέργεια είναι να σταματήσει νέα έκθεση, να διατηρηθούν πραγματικά στοιχεία και να ζητηθεί ιατρική ή υγειονομική καθοδήγηση όταν χρειάζεται.\n\n## Πιθανή κοινή έκθεση\n\nΚατέγραψε ποιος είναι άρρωστος, συμπτώματα, ώρα έναρξης και ποια τρόφιμα/νερό μοιράστηκαν το προηγούμενο διάστημα. Μην θεωρείς αυτόματα υπεύθυνο το τελευταίο γεύμα. Κράτησε ουδέτερο αρχείο και μην αποδίδεις ευθύνη σε άτομο ή μάγειρα χωρίς στοιχεία.\n\n## Σταμάτα την ύποπτη οδό\n\nΑπομόνωσε το ύποπτο τρόφιμο ή νερό ώστε να μην καταναλωθεί ξανά. Μην δοκιμάζεις αμφίβολο τρόφιμο για να κρίνεις ασφάλεια. Καθάρισε χέρια και χώρισε επιφάνειες προετοιμασίας σύμφωνα με ασφαλείς πρακτικές τροφίμων. Αν προηγήθηκε διακοπή ψυγείου, πλημμύρα, λύματα ή ανακοίνωση νερού, πρόσθεσε το χρονικό επειδή αλλάζει την εκτίμηση.\n\n## Ιατρικά όρια\n\nΣοβαρή αφυδάτωση, αίμα σε κόπρανα ή εμετό, επίμονος υψηλός πυρετός, νευρολογικά συμπτώματα, έντονος πόνος, δυσκολία αναπνοής, σημεία καταπληξίας, νόσος σε βρέφος ή άλλο ευάλωτο άτομο ή γρήγορη επιδείνωση απαιτούν έγκαιρη επαγγελματική αξιολόγηση. Οι αποφάσεις φαρμακευτικής αγωγής ανήκουν σε κατάλληλους επαγγελματίες υγείας.\n\n## Διατήρησε χρήσιμα στοιχεία\n\nΚράτησε συσκευασία, όνομα προϊόντος, παρτίδα/ημερομηνία, αποδείξεις και φωτογραφίες όταν είναι ασφαλές. Αν αρχή ή κλινικός ζητήσει δείγμα τροφής, ακολούθησε τις οδηγίες· διαφορετικά μην κρατάς επικίνδυνο τρόφιμο εκεί όπου μπορεί να καταναλωθεί κατά λάθος.\n\n## Επανέναρξη κουζίνας\n\nΕπανέφερε κανονική προετοιμασία μόνο αφού γίνει κατανοητή η οδός μόλυνσης και οι επηρεασμένες επιφάνειες, η πηγή νερού και η ψυχρή αλυσίδα είναι κατάλληλες για χρήση.\n\n**Βασικές πηγές:** αρχές ασφάλειας τροφίμων WHO, οδηγίες CDC για τρόφιμα/καταστροφές και ισχύουσες απαιτήσεις αναφοράς δημόσιας υγείας."}},{"id":63,"en":{"title":"Mosquito, tick and biting-pest control after disruption","body":"Flooding, damaged screens, outdoor sleeping and interrupted waste collection can increase contact with mosquitoes, ticks and other pests. The goal is to reduce breeding places and human exposure without creating new chemical or fire hazards.\n\n## Remove avoidable breeding water\n\nWhen it is safe, empty or cover small containers that hold stagnant water: buckets, trays, discarded packaging and uncovered storage. Do not empty contaminated water into food, play or drinking-water areas. Larger drainage or flood problems may require municipal action rather than household improvisation.\n\n## Build a physical barrier\n\nRepair screens, use intact bed nets where appropriate, close sleeping areas and choose clothing that reduces exposed skin when conditions allow. Inspect people and animals after travel through vegetation according to local health guidance. Keep sleeping equipment away from refuse, standing water and animal waste.\n\n## Use repellents and pesticides correctly\n\nFollow the product label and local health authority. More product is not automatically more protection. Keep chemicals away from food, drinking-water containers and children, and never burn or mix products unless the label specifically instructs it. For pets, use only products approved for that species; some substances safe for people or dogs can harm other animals.\n\n## Track illness patterns\n\nNote fever, rash or other concerning symptoms and recent bites/travel for a clinician if illness develops. Do not attempt to diagnose a vector-borne disease from a bite mark alone. During an outbreak, official public-health instructions override household routines.\n\n**Source anchors:** CDC vector/disaster health guidance and local public-health/pest-control instructions."},"el":{"title":"Κουνούπια, κρότωνες και έλεγχος νυγμών μετά από διαταραχή","body":"Πλημμύρα, κατεστραμμένες σίτες, ύπνος σε εξωτερικό χώρο και διακοπή αποκομιδής μπορούν να αυξήσουν την επαφή με κουνούπια, κρότωνες και άλλα παράσιτα. Στόχος είναι να μειωθούν οι εστίες αναπαραγωγής και η ανθρώπινη έκθεση χωρίς νέους χημικούς ή πυρικούς κινδύνους.\n\n## Μείωσε το στάσιμο νερό\n\nΌταν είναι ασφαλές, άδειασε ή κάλυψε μικρά δοχεία που κρατούν στάσιμο νερό: κουβάδες, δίσκους, πεταμένες συσκευασίες και ακάλυπτη αποθήκευση. Μην αδειάζεις μολυσμένο νερό σε χώρους τροφίμων, παιχνιδιού ή πόσιμου νερού. Μεγαλύτερα προβλήματα αποστράγγισης ή πλημμύρας μπορεί να απαιτούν δημοτική παρέμβαση και όχι οικιακό αυτοσχεδιασμό.\n\n## Δημιούργησε φυσικό φράγμα\n\nΕπισκεύασε σίτες, χρησιμοποίησε άθικτες κουνουπιέρες όπου είναι κατάλληλες, κλείσε χώρους ύπνου και επίλεξε ρούχα που μειώνουν το εκτεθειμένο δέρμα όταν οι συνθήκες το επιτρέπουν. Έλεγξε ανθρώπους και ζώα μετά από κίνηση σε βλάστηση σύμφωνα με τοπικές υγειονομικές οδηγίες. Κράτησε εξοπλισμό ύπνου μακριά από απορρίμματα, στάσιμα νερά και ζωικά απόβλητα.\n\n## Σωστή χρήση απωθητικών και εντομοκτόνων\n\nΑκολούθησε την ετικέτα και την αρμόδια υγειονομική αρχή. Περισσότερο προϊόν δεν σημαίνει αυτόματα μεγαλύτερη προστασία. Κράτησε χημικά μακριά από τρόφιμα, δοχεία πόσιμου νερού και παιδιά και μην καίς ή αναμειγνύεις προϊόντα εκτός αν το αναφέρει ρητά η ετικέτα. Για ζώα χρησιμοποίησε μόνο προϊόν εγκεκριμένο για το συγκεκριμένο είδος.\n\n## Παρακολούθηση νόσου\n\nΑν εμφανιστεί ασθένεια, σημείωσε πυρετό, εξάνθημα ή άλλα ανησυχητικά συμπτώματα και πρόσφατους νυγμούς/μετακινήσεις για τον επαγγελματία υγείας. Μην προσπαθείς να διαγνώσεις νόσο από το σημάδι ενός τσιμπήματος. Σε επιδημική έξαρση υπερισχύουν οι επίσημες οδηγίες δημόσιας υγείας.\n\n**Βασικές πηγές:** οδηγίες CDC για διαβιβαστές και υγεία μετά από καταστροφές και ισχύουσες τοπικές οδηγίες δημόσιας υγείας/απεντόμωσης."}},{"id":64,"en":{"title":"Community mutual aid: intake, distribution and safeguarding","body":"Neighbour-to-neighbour help can fill urgent gaps before normal services recover, but an unstructured donation pile can create congestion, unfair access, spoiled food and privacy problems. A small distribution point should operate with clear boundaries and a written handover.\n\n## Define what the point does\n\nChoose a narrow mission such as sealed water distribution, charging queue, information board or collection of requested supplies. Do not present an informal household station as an official shelter, clinic or government service. Display opening times, stock limits and who is responsible for decisions.\n\n## Receive supplies deliberately\n\nRecord item, quantity, donor/source when relevant, expiry or condition, storage requirement and acceptance decision. Reject leaking, opened, temperature-abused, recalled or otherwise unsafe food/medical items. Separate unknown goods until someone competent can assess them. Do not collect prescription medicines for casual redistribution.\n\n## Distribute with dignity\n\nUse a simple queue or token system that allows priority accommodations for people who cannot stand, caregivers, disability needs or urgent water/medical-support requirements. Do not require unnecessary identity details. Keep children and vulnerable adults out of isolated collection areas and maintain a visible, well-lit working space where possible.\n\n## Protect information\n\nPublish quantities and operating status, not recipients’ private stories. A public needs board can say “two infant-formula requests pending” without naming a family. Report safeguarding, violence or exploitation concerns through appropriate local channels rather than trying to investigate them alone.\n\n## Close cleanly\n\nAt the end of a shift count remaining stock, isolate waste, record unresolved requests and hand over keys, cash or equipment with two-person verification when practical.\n\n**Source anchors:** WHO community-engagement/risk-communication principles, local civil-protection/municipal arrangements and applicable food/medical regulations."},"el":{"title":"Κοινοτική αλληλοβοήθεια: παραλαβή, διανομή και προστασία","body":"Η βοήθεια μεταξύ γειτόνων μπορεί να καλύψει επείγοντα κενά πριν αποκατασταθούν οι υπηρεσίες, αλλά ένας άναρχος σωρός δωρεών μπορεί να προκαλέσει συμφόρηση, άνιση πρόσβαση, αλλοίωση τροφίμων και προβλήματα ιδιωτικότητας. Ένα μικρό σημείο διανομής χρειάζεται σαφή όρια και γραπτή παράδοση.\n\n## Όρισε ακριβώς τη λειτουργία\n\nΔιάλεξε στενή αποστολή, όπως διανομή σφραγισμένου νερού, ουρά φόρτισης, πίνακα πληροφοριών ή συλλογή συγκεκριμένων ζητούμενων ειδών. Μην παρουσιάζεις έναν ανεπίσημο οικιακό σταθμό ως επίσημο καταφύγιο, ιατρείο ή κρατική υπηρεσία. Ανάρτησε ώρες λειτουργίας, όρια αποθέματος και ποιος είναι υπεύθυνος για αποφάσεις.\n\n## Παραλαβή με έλεγχο\n\nΚατέγραψε είδος, ποσότητα, πηγή όταν χρειάζεται, λήξη ή κατάσταση, απαιτήσεις αποθήκευσης και απόφαση αποδοχής. Απόρριψε τρόφιμα ή ιατρικά είδη που διαρρέουν, έχουν ανοιχτεί, έχουν κακοδιατηρηθεί θερμοκρασιακά, έχουν ανακληθεί ή είναι με άλλο τρόπο μη ασφαλή. Κράτησε άγνωστα είδη χωριστά μέχρι να αξιολογηθούν από κατάλληλο άτομο. Μην συλλέγεις συνταγογραφούμενα φάρμακα για ανεπίσημη αναδιανομή.\n\n## Διανομή με αξιοπρέπεια\n\nΧρησιμοποίησε απλή σειρά ή σύστημα αριθμών που επιτρέπει προσαρμογές προτεραιότητας για άτομα που δεν μπορούν να περιμένουν όρθια, φροντιστές, ανάγκες αναπηρίας ή επείγουσα υποστήριξη νερού/υγείας. Μην απαιτείς περιττά στοιχεία ταυτότητας. Κράτησε παιδιά και ευάλωτους ενήλικους μακριά από απομονωμένους χώρους παραλαβής και διατήρησε ορατό, φωτισμένο χώρο εργασίας όταν γίνεται.\n\n## Προστάτευσε τις πληροφορίες\n\nΔημοσίευσε ποσότητες και κατάσταση λειτουργίας, όχι ιδιωτικές ιστορίες παραληπτών. Ένας δημόσιος πίνακας μπορεί να γράφει «δύο εκκρεμή αιτήματα βρεφικής τροφής» χωρίς να κατονομάζει οικογένεια. Αναφορά ανησυχιών για κακοποίηση, βία ή εκμετάλλευση πρέπει να γίνεται μέσω των κατάλληλων τοπικών διαύλων και όχι με ανεπίσημη προσωπική έρευνα.\n\n## Καθαρό κλείσιμο βάρδιας\n\nΣτο τέλος μέτρησε υπόλοιπο αποθέματος, απομόνωσε απορρίμματα, κατέγραψε ανοιχτά αιτήματα και παρέδωσε κλειδιά, χρήματα ή εξοπλισμό με επαλήθευση δύο ατόμων όπου είναι πρακτικό.\n\n**Βασικές πηγές:** αρχές κοινοτικής συμμετοχής και επικοινωνίας κινδύνου WHO, τοπικές ρυθμίσεις Πολιτικής Προστασίας/δήμου και ισχύοντες κανόνες τροφίμων και ιατρικών ειδών."}},{"id":65,"en":{"title":"Walking evacuation: match load, pace and route to the slowest critical need","body":"## Walking is a system, not a fitness test\nA route that looks short on a map can become demanding with heat, smoke, rain, stairs, children, luggage or mobility limitations. Estimate distance and elevation, then test representative sections before an emergency. Do not base the plan on the fastest adult’s pace.\n\n## Reduce load before increasing effort\nCarry water, essential medicines, identification, communication, weather protection and only the equipment needed for the destination/route. Remove duplicate comfort items before overloading a child, older adult or caregiver. If a mobility aid is required, ensure the route surface and width actually permit it.\n\n## Set checkpoints\nUse recognizable locations where the group stops, accounts for people, checks feet, drinks, reviews official information and decides whether the next leg remains safe. A checkpoint is also a reunification point if the group becomes separated.\n\n## Time the route against hazard movement\nWildfire, flood, extreme heat or severe weather may close the walking route faster than the household can travel. Leave according to official warnings and pre-agreed triggers, not after the group is fully packed. If evacuation on foot is the backup, it must be activated before vehicle routes fail completely.\n\n## Protect communications energy\nOne device should remain in reserve rather than every phone running navigation continuously. Use offline route notes, street names, landmarks and coordinates. Send concise status updates at planned points instead of maintaining a continuous call.\n\n## Stop when walking becomes unsafe\nSevere heat/cold stress, worsening smoke, rising water, lightning exposure, injury or loss of route integrity require a new decision. Continuing because “we already started” is not a safety strategy. Move to the nearest safer option and seek official assistance when necessary.\n\nEvidence IDs: READY-PLAN-1, GR-GENERAL-1, ACCESS-1."},"el":{"title":"Εκκένωση με τα πόδια: προσαρμόσε φορτίο, ρυθμό και διαδρομή στη δυσκολότερη ανάγκη","body":"## Η πεζή μετακίνηση είναι σύστημα και όχι τεστ φυσικής κατάστασης\nΜια μικρή απόσταση στον χάρτη γίνεται δύσκολη με ζέστη, καπνό, βροχή, σκάλες, παιδιά, αποσκευές ή περιορισμούς κινητικότητας. Υπολόγισε απόσταση και υψομετρικές αλλαγές και δοκίμασε αντιπροσωπευτικά τμήματα πριν από έκτακτη ανάγκη. Μην βασίζεις το σχέδιο στον ρυθμό του ταχύτερου ενήλικα.\n\n## Μείωσε βάρος πριν αυξήσεις προσπάθεια\nΜετέφερε νερό, απαραίτητα φάρμακα, ταυτοποίηση, επικοινωνίες, προστασία από καιρό και μόνο τον εξοπλισμό που χρειάζεται η διαδρομή/προορισμός. Αφαίρεσε διπλά είδη άνεσης πριν φορτώσεις παιδί, ηλικιωμένο ή φροντιστή. Αν απαιτείται βοήθημα κινητικότητας, η επιφάνεια και το πλάτος της διαδρομής πρέπει πραγματικά να το επιτρέπουν.\n\n## Όρισε σημεία ελέγχου\nΧρησιμοποίησε αναγνωρίσιμα σημεία όπου η ομάδα σταματά, μετρά ανθρώπους, ελέγχει πόδια, πίνει, ενημερώνεται από επίσημες πηγές και αποφασίζει αν το επόμενο τμήμα παραμένει ασφαλές. Το ίδιο σημείο μπορεί να λειτουργεί ως επανένωση αν η ομάδα χωριστεί.\n\n## Σύγκρινε τον χρόνο πορείας με την εξέλιξη του κινδύνου\nΠυρκαγιά, πλημμύρα, ακραία ζέστη ή κακοκαιρία μπορούν να κλείσουν τη διαδρομή γρηγορότερα από την κίνηση του νοικοκυριού. Φύγε σύμφωνα με επίσημες προειδοποιήσεις και προαποφασισμένα όρια, όχι όταν «τελειώσει το πακετάρισμα». Αν η πεζή λύση είναι εφεδρική, πρέπει να ενεργοποιηθεί πριν καταρρεύσουν πλήρως οι οδικές επιλογές.\n\n## Προστάτευσε την ενέργεια επικοινωνιών\nΚράτησε μία συσκευή ως εφεδρεία αντί να έχουν όλα τα τηλέφωνα συνεχώς ανοιχτή πλοήγηση. Χρησιμοποίησε offline σημειώσεις, ονόματα δρόμων, σημεία αναφοράς και συντεταγμένες. Στείλε σύντομες ενημερώσεις στα προγραμματισμένα σημεία αντί για συνεχή κλήση.\n\n## Σταμάτησε όταν η πορεία παύει να είναι ασφαλής\nΣοβαρή θερμική/ψυχρή καταπόνηση, επιδείνωση καπνού, ανερχόμενο νερό, κεραυνοί, τραυματισμός ή απώλεια της διαδρομής απαιτούν νέα απόφαση. Η συνέχιση επειδή «ήδη ξεκινήσαμε» δεν είναι στρατηγική ασφάλειας. Μετακινήσου στην πλησιέστερη ασφαλέστερη επιλογή και ζήτησε επίσημη βοήθεια όπου χρειάζεται.\n\nΚωδικοί τεκμηρίωσης: READY-PLAN-1, GR-GENERAL-1, ACCESS-1."}},{"id":66,"en":{"title":"Bicycle emergency mobility: useful redundancy with strict terrain and load limits","body":"## A bicycle can bypass fuel shortages, not every hazard\nBicycles can extend range when roads are congested or fuel is scarce, but they are poor choices in deep floodwater, heavy smoke, severe wind, icy roads or routes requiring hazardous highway travel. Treat the bicycle as one transport option and define conditions that cancel its use.\n\n## Maintain the simple failure points\nBefore emergencies, check tires, brakes, chain/drivetrain, lights, reflectors and the fit of racks or bags. Keep the correct pump, basic repair items and any proprietary tool the bicycle genuinely needs. An untested repair kit is weight, not capability.\n\n## Carry load low and secure\nAvoid bags swinging from handlebars or loose items that affect steering. Water is dense; distribute it within the bicycle/rider capacity and leave room for safe control. A trailer or cargo bicycle changes turning/braking and must be practiced before relying on it.\n\n## Plan visibility and communication\nNight or smoke reduces visibility. Use legally required lighting/reflectors and high-visibility placement where appropriate. Keep a small offline route card rather than handling a phone while riding. Stop in a safe place to check messages or navigation.\n\n## Pair riders deliberately\nA child, novice rider or person with a mechanical problem can reduce group speed sharply. Establish regroup points and never leave someone alone because another rider can travel faster. If one bicycle carries medical or communication equipment, have a transfer plan if that bike fails.\n\n## Inspect after hard use\nDebris, ash, salt water, mud and crashes can damage braking or drivetrain components. Clean/inspect before the bicycle returns to emergency reserve. Record tires, tubes, brake pads or parts consumed so the redundancy remains real.\n\nEvidence IDs: READY-PLAN-1, READY-LOCATIONS-1."},"el":{"title":"Ποδήλατο ως μέσο έκτακτης μετακίνησης: χρήσιμη εφεδρεία με αυστηρά όρια εδάφους και φορτίου","body":"## Το ποδήλατο παρακάμπτει την έλλειψη καυσίμου, όχι κάθε κίνδυνο\nΜπορεί να αυξήσει την ακτίνα κίνησης όταν υπάρχει συμφόρηση ή έλλειψη καυσίμου, αλλά είναι κακή επιλογή σε βαθιά πλημμυρικά νερά, πυκνό καπνό, ισχυρό άνεμο, παγωμένο δρόμο ή διαδρομή που απαιτεί επικίνδυνη κίνηση σε αυτοκινητόδρομο. Θεώρησέ το μία επιλογή μεταφοράς και καθόρισε συνθήκες που ακυρώνουν τη χρήση του.\n\n## Συντήρησε τα απλά σημεία βλάβης\nΠριν από συμβάν, έλεγξε ελαστικά, φρένα, αλυσίδα/μετάδοση, φώτα, ανακλαστήρες και τη στερέωση σχαρών ή τσαντών. Κράτησε σωστή τρόμπα, βασικά υλικά επισκευής και οποιοδήποτε ειδικό εργαλείο χρειάζεται πράγματι το συγκεκριμένο ποδήλατο. Ένα κιτ που δεν έχει δοκιμαστεί είναι βάρος και όχι ικανότητα.\n\n## Μετέφερε φορτίο χαμηλά και στερεωμένο\nΑπόφυγε σακούλες που κρέμονται από το τιμόνι ή ελεύθερα αντικείμενα που επηρεάζουν το στρίψιμο. Το νερό είναι βαρύ· μοίρασέ το μέσα στα όρια ποδηλάτου και αναβάτη και κράτησε επαρκή έλεγχο. Τρέιλερ ή ποδήλατο φορτίου αλλάζει φρενάρισμα/στροφή και πρέπει να έχει δοκιμαστεί πριν βασιστείς σε αυτό.\n\n## Ορατότητα και επικοινωνίες\nΝύχτα ή καπνός μειώνουν την ορατότητα. Χρησιμοποίησε τον νόμιμα απαιτούμενο φωτισμό/ανακλαστήρες και εμφανή θέση όπου χρειάζεται. Κράτησε μικρή offline κάρτα διαδρομής αντί να χειρίζεσαι τηλέφωνο ενώ κινείσαι. Σταμάτησε σε ασφαλές σημείο για μηνύματα ή πλοήγηση.\n\n## Ομαδοποίησε τους αναβάτες συνειδητά\nΠαιδί, άπειρος αναβάτης ή μηχανικό πρόβλημα μπορεί να ρίξει απότομα τον ρυθμό. Όρισε σημεία επανένωσης και μην αφήνεις κάποιον μόνο επειδή άλλος κινείται γρηγορότερα. Αν ένα ποδήλατο μεταφέρει ιατρικό ή επικοινωνιακό εξοπλισμό, χρειάζεται σχέδιο μεταφοράς του φορτίου σε περίπτωση βλάβης.\n\n## Έλεγχος μετά από δύσκολη χρήση\nΦερτά υλικά, στάχτη, αλμυρό νερό, λάσπη ή πτώση μπορούν να επηρεάσουν φρένα και μετάδοση. Καθάρισε και έλεγξε πριν επιστρέψει το ποδήλατο στην εφεδρεία. Κατέγραψε ελαστικά, σαμπρέλες, τακάκια ή άλλα αναλώσιμα ώστε η εναλλακτική μετακίνηση να παραμένει πραγματική.\n\nΚωδικοί τεκμηρίωσης: READY-PLAN-1, READY-LOCATIONS-1."}},{"id":67,"en":{"title":"Family reunification: design meeting points that still work when phones do not","body":"## One meeting point is not enough\nChoose an immediate point just outside the home for fire/rapid evacuation, a neighborhood point if the block cannot be reached, and an out-of-area contact who can relay status. Every family member capable of doing so should know the plan without opening an app.\n\n## Describe locations unambiguously\n“Meet at the school” is weak if the campus has several gates or is itself closed. Use a specific entrance, landmark or coordinate and define an alternate nearby location. Confirm that the point is accessible to the household’s mobility needs and safe for children to wait with a responsible adult.\n\n## Define waiting rules\nPeople need to know how long to remain, when to move to the alternate point and what message to leave if communications briefly work. Without a rule, two groups can repeatedly move past each other while both believe they are “looking for the family.”\n\n## Use an out-of-area relay\nA person outside the affected region may be easier to reach than nearby contacts during local network congestion. Give everyone the same relay contact and keep the number on paper. The relay should record who checked in, time, location and intended next step rather than interpreting rumors.\n\n## Include schools, work and care settings\nKnow the reunification/authorized pickup procedures for children, care facilities and workplaces. Do not rush into a controlled site or ask a child to leave with someone not authorized. Emergency plans should list who is allowed to collect each dependent.\n\n## Drill the plan without creating panic\nWalk to the local points, verify accessibility and have family members explain the sequence back in their own words. Update after moves, school changes or road construction. Reunification is successful when people can follow it under stress without relying on memory fragments.\n\nEvidence IDs: READY-COMMS-1, READY-PLAN-1, GR-GENERAL-1."},"el":{"title":"Επανένωση οικογένειας: σημεία συνάντησης που λειτουργούν ακόμη και χωρίς τηλέφωνα","body":"## Ένα σημείο δεν αρκεί\nΌρισε άμεσο εξωτερικό σημείο κοντά στο σπίτι για φωτιά ή γρήγορη εκκένωση, δεύτερο στη γειτονιά αν δεν μπορείς να επιστρέψεις στο τετράγωνο και μία επαφή εκτός περιοχής που μπορεί να μεταφέρει πληροφορίες. Κάθε μέλος που είναι ικανό πρέπει να γνωρίζει το σχέδιο χωρίς να ανοίξει εφαρμογή.\n\n## Περιέγραψε τοποθεσίες χωρίς αμφισημία\n«Στο σχολείο» είναι αδύναμη οδηγία αν υπάρχουν πολλές πύλες ή αν το σχολείο κλείσει. Χρησιμοποίησε συγκεκριμένη είσοδο, αναγνωρίσιμο σημείο ή συντεταγμένες και όρισε κοντινή εναλλακτική. Επιβεβαίωσε ότι το σημείο είναι προσβάσιμο με τις ανάγκες κινητικότητας του νοικοκυριού και κατάλληλο για να περιμένει παιδί με υπεύθυνο ενήλικα.\n\n## Όρισε κανόνες αναμονής\nΌλοι πρέπει να ξέρουν πόσο μένουν, πότε μετακινούνται στο εναλλακτικό σημείο και ποιο μήνυμα αφήνουν αν λειτουργήσει προσωρινά η επικοινωνία. Χωρίς κανόνα, δύο ομάδες μπορεί να κινούνται συνεχώς η μία πίσω από την άλλη επειδή και οι δύο «ψάχνουν την οικογένεια».\n\n## Χρησιμοποίησε επαφή εκτός πληγείσας περιοχής\nΆτομο σε άλλη περιοχή μπορεί να είναι ευκολότερο να προσεγγιστεί όταν το τοπικό δίκτυο είναι υπερφορτωμένο. Όλοι κρατούν την ίδια επαφή και τον αριθμό και σε χαρτί. Ο ενδιάμεσος καταγράφει ποιος επικοινώνησε, ώρα, θέση και επόμενο βήμα χωρίς να ερμηνεύει φήμες.\n\n## Συμπερίλαβε σχολείο, εργασία και δομές φροντίδας\nΓνώρισε τις διαδικασίες επανένωσης και εξουσιοδοτημένης παραλαβής για παιδιά, δομές φροντίδας και εργασιακούς χώρους. Μην εισέρχεσαι βιαστικά σε ελεγχόμενο χώρο και μην ζητάς από παιδί να φύγει με μη εξουσιοδοτημένο άτομο. Το σχέδιο γράφει ποιος επιτρέπεται να παραλάβει κάθε εξαρτώμενο μέλος.\n\n## Άσκηση χωρίς πανικό\nΠερπάτησε μέχρι τα σημεία, έλεγξε προσβασιμότητα και ζήτησε από τα μέλη να περιγράψουν τη σειρά με δικά τους λόγια. Ενημέρωσε το σχέδιο μετά από μετακόμιση, αλλαγή σχολείου ή έργα δρόμων. Η επανένωση λειτουργεί όταν μπορεί να εφαρμοστεί υπό πίεση χωρίς αποσπασματική μνήμη.\n\nΚωδικοί τεκμηρίωσης: READY-COMMS-1, READY-PLAN-1, GR-GENERAL-1."}},{"id":68,"en":{"title":"Neighborhood resource mapping: know capabilities before asking for help","body":"## Map assets, not just hazards\nA preparedness map should include safe meeting areas, water distribution points, pharmacies/clinics, public shelters, accessible routes and official notice locations where known. It can also record voluntary household capabilities such as a first-aid trained neighbor, a vehicle with extra seats or a person able to translate—only with consent.\n\n## Protect privacy\nDo not create a public list labeling a home as containing expensive equipment, medications, cash or a vulnerable person. Separate sensitive welfare information from a general resource map. Share only what is necessary with people who need it.\n\n## Verify resources periodically\nA business may close, a clinic may change hours, a road may be under construction and a neighbor may move. Date the map and recheck important points. During an incident, mark confirmed-open versus assumed-open rather than treating old information as current.\n\n## Include constraints\nA resource is useful only when its limitations are known. A well may not be potable, a generator may be reserved for one medical device, a four-wheel-drive vehicle may still be unable to cross a closed road, and a community building may not accept pets. Record constraints alongside capability.\n\n## Build a lightweight welfare network\nAgree on who checks which nearby households after a local outage, especially where older adults or people with access needs have opted in. A check should be simple and nonintrusive: status, immediate need, next contact time. Emergency services remain the path for urgent danger.\n\n## Update after every event\nAdd blocked routes, useful contacts and resource failures from the incident log. Remove resources that were unreliable. A neighborhood map becomes valuable when it reflects tested reality rather than optimistic assumptions.\n\nEvidence IDs: READY-PLAN-1, READY-DISABILITY-1, GR-GENERAL-1."},"el":{"title":"Χαρτογράφηση πόρων γειτονιάς: γνώρισε τις δυνατότητες πριν ζητήσεις βοήθεια","body":"## Χαρτογράφησε πόρους και όχι μόνο κινδύνους\nΈνας χάρτης ετοιμότητας μπορεί να δείχνει ασφαλή σημεία συνάντησης, διανομές νερού, φαρμακεία/κλινικές, δημόσια καταφύγια, προσβάσιμες διαδρομές και σημεία επίσημων ανακοινώσεων όπου είναι γνωστά. Με συναίνεση μπορεί να σημειώνει εθελοντικές ικανότητες, όπως γείτονα με εκπαίδευση πρώτων βοηθειών, όχημα με ελεύθερες θέσεις ή άτομο που μπορεί να μεταφράσει.\n\n## Προστάτευσε την ιδιωτικότητα\nΜην δημιουργείς δημόσιο κατάλογο που δείχνει ποιο σπίτι έχει ακριβό εξοπλισμό, φάρμακα, μετρητά ή ευάλωτο άτομο. Χώρισε ευαίσθητες πληροφορίες ευημερίας από τον γενικό χάρτη. Μοιράσου μόνο ό,τι χρειάζεται με όσους πραγματικά το χρειάζονται.\n\n## Επιβεβαίωνε τους πόρους περιοδικά\nΈνα κατάστημα μπορεί να κλείσει, μια κλινική να αλλάξει ωράριο, ένας δρόμος να έχει έργα και ένας γείτονας να μετακομίσει. Βάλε ημερομηνία στον χάρτη και ξαναέλεγξε τα κρίσιμα σημεία. Μέσα στο συμβάν ξεχώρισε «επιβεβαιωμένα ανοικτό» από «υποθέτουμε ότι είναι ανοικτό».\n\n## Κατέγραψε περιορισμούς\nΠόρος είναι χρήσιμος μόνο όταν είναι γνωστά τα όριά του. Ένα πηγάδι μπορεί να μην είναι πόσιμο, μια γεννήτρια να προορίζεται αποκλειστικά για ιατρικό εξοπλισμό, ένα τετρακίνητο να μην δικαιούται να περάσει κλειστό δρόμο και ένα κοινοτικό κτίριο να μην δέχεται ζώα. Γράψε τον περιορισμό δίπλα στην ικανότητα.\n\n## Δημιούργησε ελαφρύ δίκτυο ελέγχου ευημερίας\nΣυμφώνησε ποιος ελέγχει ποια κοντινά νοικοκυριά μετά από τοπική διακοπή, ιδιαίτερα όπου ηλικιωμένοι ή άτομα με ανάγκες πρόσβασης έχουν επιλέξει να συμμετέχουν. Ο έλεγχος είναι απλός: κατάσταση, άμεση ανάγκη, επόμενη ώρα επικοινωνίας. Για επείγον κίνδυνο χρησιμοποιούνται οι υπηρεσίες έκτακτης ανάγκης.\n\n## Ενημέρωση μετά από κάθε συμβάν\nΠρόσθεσε αποκλεισμένους δρόμους, χρήσιμες επαφές και αποτυχημένους πόρους από το ημερολόγιο. Αφαίρεσε ό,τι αποδείχθηκε αναξιόπιστο. Ο χάρτης γίνεται πολύτιμος όταν αποτυπώνει δοκιμασμένη πραγματικότητα και όχι αισιόδοξες υποθέσεις.\n\nΚωδικοί τεκμηρίωσης: READY-PLAN-1, READY-DISABILITY-1, GR-GENERAL-1."}},{"id":69,"en":{"title":"Mutual aid tasking: help neighbors without losing accountability","body":"## Good intentions need a task structure\nDuring a disruption, several people may offer vehicles, tools, food or labor. Assign one clear task at a time: who is doing it, where, by when, what hazard is known and who they report back to. Avoid vague instructions such as “go see who needs help,” which can send volunteers into unsafe areas and produce duplicated effort.\n\n## Do not exceed competence\nCommunity members can carry supplies, share verified information and perform welfare checks, but should not take on hazardous electrical work, structural rescue, contaminated cleanup or medical procedures beyond training. Emergency services and qualified professionals remain responsible for specialized hazards.\n\n## Track people in and out\nFor field tasks, record names, destination, departure time, expected return/check-in and communication method. If the route changes, update the coordinator. This is especially important when smoke, flood or communications outages make it difficult to know whether a delayed person is merely busy or in trouble.\n\n## Match aid to the stated need\nAsk before delivering. A household may need drinking water rather than food, accessible transport rather than a box of supplies, or a particular diet rather than generic meals. Unrequested donations can create storage and waste problems.\n\n## Protect dignity and data\nDo not publicize who received medication, financial help or disability support. Share enough information to coordinate the task, not a person’s full private history. Photographs of recipients should not be a condition of assistance.\n\n## Close every task\nThe person reports outcome, unmet need, resources consumed and any new hazard. Update the decision board instead of leaving a verbal promise floating between shifts. Mutual aid becomes dependable when tasks are closed and learned from.\n\nEvidence IDs: READY-PLAN-1, READY-DISABILITY-1, GR-GENERAL-1."},"el":{"title":"Ανάθεση αλληλοβοήθειας: βοήθησε τη γειτονιά χωρίς να χαθεί ο έλεγχος","body":"## Η καλή πρόθεση χρειάζεται σαφή εργασία\nΣε διαταραχή μπορεί να προσφέρονται οχήματα, εργαλεία, τρόφιμα ή εργασία από πολλούς ανθρώπους. Ανάθεσε μία σαφή εργασία κάθε φορά: ποιος, πού, μέχρι πότε, ποιος κίνδυνος είναι γνωστός και σε ποιον αναφέρει αποτέλεσμα. Απόφυγε αόριστες οδηγίες όπως «πήγαινε να δεις ποιος χρειάζεται βοήθεια», που μπορούν να στείλουν εθελοντές σε επικίνδυνη περιοχή και να διπλασιάσουν προσπάθεια.\n\n## Μην ξεπερνάς την ικανότητα\nΚάτοικοι μπορούν να μεταφέρουν εφόδια, να μοιράζουν επιβεβαιωμένες πληροφορίες και να κάνουν ελέγχους ευημερίας, αλλά δεν αναλαμβάνουν επικίνδυνη ηλεκτρολογική εργασία, δομική διάσωση, βαριά μολυσμένο καθαρισμό ή ιατρικές πράξεις πέρα από την εκπαίδευσή τους. Οι ειδικές υπηρεσίες και επαγγελματίες παραμένουν υπεύθυνοι για εξειδικευμένους κινδύνους.\n\n## Κατέγραψε ποιος βγαίνει και επιστρέφει\nΓια εξωτερικές εργασίες σημείωσε ονόματα, προορισμό, ώρα αναχώρησης, αναμενόμενο check-in και τρόπο επικοινωνίας. Αν αλλάξει η διαδρομή, ενημέρωσε τον συντονιστή. Αυτό έχει ιδιαίτερη σημασία όταν καπνός, πλημμύρα ή διακοπή επικοινωνιών κάνει αδύνατο να ξέρεις αν μια καθυστέρηση είναι απλώς καθυστέρηση ή πρόβλημα.\n\n## Ταίριαξε τη βοήθεια με την πραγματική ανάγκη\nΡώτησε πριν παραδώσεις. Ένα σπίτι μπορεί να χρειάζεται πόσιμο νερό αντί για φαγητό, προσβάσιμη μεταφορά αντί για κουτί προμηθειών ή συγκεκριμένη δίαιτα αντί για γενικά γεύματα. Μη ζητημένες δωρεές μπορούν να δημιουργήσουν αποθήκευση και απόβλητα.\n\n## Προστάτευσε αξιοπρέπεια και δεδομένα\nΜην δημοσιοποιείς ποιος έλαβε φάρμακα, οικονομική βοήθεια ή υποστήριξη αναπηρίας. Μοιράσου μόνο όσα απαιτεί ο συντονισμός και όχι ολόκληρο το ιδιωτικό ιστορικό. Η φωτογράφιση ανθρώπων δεν πρέπει να είναι προϋπόθεση βοήθειας.\n\n## Κλείσε κάθε εργασία\nΟ υπεύθυνος αναφέρει αποτέλεσμα, ανεκπλήρωτη ανάγκη, πόρους που καταναλώθηκαν και νέο κίνδυνο. Ενημέρωσε τον πίνακα αποφάσεων αντί να αφήνεις προφορικές υποσχέσεις να χάνονται μεταξύ βαρδιών. Η αλληλοβοήθεια γίνεται αξιόπιστη όταν οι εργασίες ολοκληρώνονται και αξιολογούνται.\n\nΚωδικοί τεκμηρίωσης: READY-PLAN-1, READY-DISABILITY-1, GR-GENERAL-1."}},{"id":70,"en":{"title":"Emergency supply intake: inspect, record and quarantine before distribution","body":"## More supplies can create more uncertainty\nDonations and emergency purchases may arrive with damaged packaging, unknown storage history, wrong specifications or no clear owner. Create a small intake point instead of placing everything directly into the household pantry or medical kit.\n\n## Record basic provenance\nFor important items note date received, source, quantity, expiration/best-before where relevant and any storage requirement. For batteries, chargers, filters or spare parts record model compatibility. For food, preserve labels and allergen information.\n\n## Quarantine questionable items\nFlood-wet packages, leaking chemicals, swollen batteries, opened medicines, unlabeled food or equipment with visible damage should not be mixed with verified stock. Mark them for review/disposal according to appropriate guidance. “It was donated” does not establish safety.\n\n## Separate controlled/special items\nPrescription medicines belong to the intended patient and should be handled according to pharmacy/clinical rules; a neighborhood supply table is not a medication exchange. Allergy-safe and infant foods should remain identifiable. Fuel and hazardous chemicals stay physically outside food/water storage.\n\n## Update the inventory at distribution\nWhen supplies leave intake, assign them to the correct household kit, food lot, power reserve or sanitation point. This prevents double counting and helps the next shift know which resources are still unallocated.\n\n## Learn which supply channels are reliable\nAfter the event, note vendors, public points or community channels that delivered usable items and those that produced unsuitable stock. A good intake log improves future procurement rather than becoming paperwork for its own sake.\n\nEvidence IDs: READY-KIT-1, FOOD-1, EPA-WATER-1."},"el":{"title":"Παραλαβή εφοδίων έκτακτης ανάγκης: έλεγχος, καταγραφή και καραντίνα πριν από τη διανομή","body":"## Περισσότερα εφόδια μπορούν να δημιουργήσουν περισσότερη αβεβαιότητα\nΔωρεές και αγορές ανάγκης μπορεί να φτάσουν με κατεστραμμένη συσκευασία, άγνωστο ιστορικό αποθήκευσης, λάθος προδιαγραφές ή χωρίς σαφή υπεύθυνο. Δημιούργησε μικρό σημείο παραλαβής αντί να βάζεις τα πάντα κατευθείαν στην αποθήκη τροφίμων ή ιατρικό κιτ.\n\n## Κατέγραψε βασική προέλευση\nΓια σημαντικά είδη σημείωσε ημερομηνία παραλαβής, πηγή, ποσότητα, λήξη όπου σχετίζεται και τυχόν συνθήκες αποθήκευσης. Για μπαταρίες, φορτιστές, φίλτρα ή ανταλλακτικά γράψε συμβατότητα μοντέλου. Για τρόφιμα διατήρησε ετικέτες και πληροφορίες αλλεργιογόνων.\n\n## Απομόνωσε αμφίβολα αντικείμενα\nΣυσκευασίες που βράχηκαν σε πλημμύρα, διαρρέοντα χημικά, διογκωμένες μπαταρίες, ανοιγμένα φάρμακα, τρόφιμα χωρίς ετικέτα ή εξοπλισμός με ορατή ζημιά δεν αναμειγνύονται με επιβεβαιωμένο απόθεμα. Σημείωσέ τα για αξιολόγηση ή απόρριψη σύμφωνα με την κατάλληλη καθοδήγηση. Το ότι κάτι «δωρίστηκε» δεν αποδεικνύει ασφάλεια.\n\n## Χώρισε ελεγχόμενα ή ειδικά είδη\nΣυνταγογραφούμενα φάρμακα ανήκουν στον προβλεπόμενο ασθενή και ακολουθούν φαρμακευτικούς/κλινικούς κανόνες· ένα κοινοτικό τραπέζι εφοδίων δεν είναι ανταλλαγή φαρμάκων. Τρόφιμα αλλεργιών και βρεφικά προϊόντα διατηρούνται αναγνωρίσιμα. Καύσιμα και επικίνδυνα χημικά μένουν φυσικά έξω από αποθήκευση τροφίμων/νερού.\n\n## Ενημέρωσε την απογραφή κατά τη διανομή\nΌταν ένα είδος φύγει από την παραλαβή, ανάθεσέ το στο σωστό κιτ, παρτίδα τροφίμων, ενεργειακή εφεδρεία ή σημείο υγιεινής. Έτσι αποφεύγεται διπλή καταμέτρηση και η επόμενη βάρδια γνωρίζει τι παραμένει αδιάθετο.\n\n## Μάθε ποια κανάλια είναι αξιόπιστα\nΜετά το συμβάν, σημείωσε προμηθευτές, δημόσια σημεία ή κοινοτικές πηγές που έδωσαν κατάλληλα είδη και όσες παρήγαγαν ακατάλληλο απόθεμα. Ένα καλό ημερολόγιο παραλαβής βελτιώνει τις μελλοντικές προμήθειες και δεν γίνεται γραφειοκρατία για την ίδια τη γραφειοκρατία.\n\nΚωδικοί τεκμηρίωσης: READY-KIT-1, FOOD-1, EPA-WATER-1."}},{"id":71,"en":{"title":"Shared shelter sleeping and privacy zones: organize space before fatigue creates conflict","body":"## Divide the room by function\nA crowded shelter works better when sleeping, eating, medical/support, charging, animal and waste areas are visibly separated. Keep exits, extinguishers, fire doors and staff routes clear. Do not create private spaces by hanging material over equipment, heaters or emergency signs.\n\n## Build a quiet-sleep period\nAgree on lower-light and lower-noise hours while preserving required safety lighting. Assign phone calls, charging conversations and supply sorting away from sleeping rows. Families with infants, night medical needs or irregular work shifts may need a designated area rather than repeated conflict with the main sleep zone.\n\n## Protect personal boundaries\nUse simple visual barriers where the facility allows them, but maintain ventilation and line-of-travel requirements. Never require someone to disclose a diagnosis to request a quieter, accessible or more private arrangement. Staff/coordinators need only the information necessary to meet the operational need.\n\n## Keep critical items reachable\nGlasses, hearing equipment, mobility aids, medicines and shoes should have a consistent location beside the person without obstructing paths. High-value documents and electronics remain secured rather than left in common charging areas without oversight.\n\n## Plan nighttime accountability\nKnow who is expected in the shelter and where dependents are sleeping. If someone leaves at night, record destination and expected return when practical. Children should not move through unfamiliar shared facilities alone.\n\n## Reset the space each morning\nRemove trip hazards, air/dry bedding where possible, clean high-contact areas according to facility guidance, empty waste and restore emergency routes. A shelter that is not reset gradually becomes harder and less safe to operate.\n\nEvidence IDs: READY-SHELTER-1, READY-DISABILITY-1, READY-PLAN-1."},"el":{"title":"Ύπνος και ιδιωτικότητα σε κοινό καταφύγιο: οργάνωσε τον χώρο πριν η κόπωση φέρει σύγκρουση","body":"## Χώρισε τον χώρο ανά λειτουργία\nΈνα γεμάτο καταφύγιο λειτουργεί καλύτερα όταν οι ζώνες ύπνου, φαγητού, υγειονομικής υποστήριξης, φόρτισης, ζώων και αποβλήτων είναι εμφανώς χωρισμένες. Κράτα ελεύθερες εξόδους,
