εξόδους όπου υπάρχουν, μέτρησε πόρτες ή βασικά σημεία μεταξύ χώρου ύπνου και εξόδου, βρες σημεία συναγερμού και έλεγξε ότι βοηθήματα κινητικότητας χωρούν στη διαδρομή. Η U.S. Fire Administration προτείνει στα ξενοδοχεία να εντοπίζονται οι δύο κοντινότερες έξοδοι και να μετρώνται πόρτες ώστε η διαδρομή να ακολουθείται και με χαμηλή ορατότητα.\n\n## Μικρό κιτ εξόδου\nΠαπούτσια, ταυτότητα, απαραίτητα φάρμακα, βοηθήματα κινητικότητας/επικοινωνίας και φως πρέπει να είναι προσβάσιμα χωρίς να αδειάζει ολόκληρη η τσάντα. Μην φράζεις πόρτες ή διαδρόμους με αποσκευές. Συμφώνησε εξωτερικό σημείο συνάντησης ώστε μέλη της οικογένειας να μην επιστρέψουν ψάχνοντας κάποιον που βγήκε από άλλη διαδρομή.\n\n## Ακολούθησε τις οδηγίες του κτιρίου στον συναγερμό\nΧρησιμοποίησε σκάλες αντί ανελκυστήρα εκτός αν διασώστες ή η επίσημη διαδικασία του κτιρίου δώσει διαφορετική οδηγία. Αν καπνός ή φωτιά μπλοκάρουν την κύρια διαδρομή, χρησιμοποίησε την εναλλακτική αντί να πιέσεις μέσα από τον κίνδυνο. Δήλωσε αγνοούμενους ή άτομα με περιορισμένη κινητικότητα στους διασώστες· μην στέλνεις απροστάτευτο μέλος ξανά μέσα.\n\n## Πηγή επαλήθευσης\n- U.S. Fire Administration — πυρασφάλεια ξενοδοχείων και προσωρινής διαμονής: https://www.usfa.fema.gov/prevention/hotel-fires/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":161,"en":{"title":"CPR and AED Readiness: Recognition, Action, and Responder Handoff","body":"A survival library cannot replace hands-on CPR training, but it can help a household prevent the most common preparedness failure: having an AED nearby, emergency numbers available, and nobody who knows where the equipment is or what to do when a person suddenly becomes unresponsive.\n\n## Prepare before the emergency\nKnow where the nearest AEDs are in places you use repeatedly: apartment common areas, workplaces, gyms, schools, ferries, hotels, community buildings, or shelters. Keep first-aid/CPR training current for more than one household member. If a home AED is present, record its model, pad expiry dates, battery status, storage location, and the people trained to use it. Do not bury it beneath other supplies.\n\n## If someone becomes unresponsive\nFirst make sure the scene is safe. Check responsiveness and normal breathing according to the CPR training you have received. Activate emergency medical services immediately and have someone bring an AED if available. If the person is not breathing normally, begin CPR according to your training. The American Red Cross teaches adult chest compressions at 100–120 per minute and emphasizes firm, continuous compressions with full chest recoil; trained rescuers should use the current technique appropriate to the person's age and condition.\n\n## Let the AED guide the shock decision\nTurn on the AED and follow its spoken/visual prompts. The device analyzes the rhythm and decides whether a shock is advised. Keep people clear during analysis and shock delivery. Resume CPR when the device instructs you. Do not delay basic resuscitation while searching for obscure settings or trying to diagnose the rhythm yourself.\n\n## Build a useful responder handoff\nOne person should track the approximate collapse time, when CPR started, whether an AED shock was delivered, known medical conditions, medications/allergies if readily available, and changes observed. Hand this information to responders without interrupting lifesaving care.\n\n## What this chapter deliberately does not do\nIt does not substitute for certified CPR/AED training, pediatric-specific instruction, professional dispatch guidance, or emergency medical care. Practice with a training manikin/AED trainer if possible; reading alone is not sufficient skill preparation.\n\n## Verification sources\n- American Red Cross — CPR steps: https://www.redcross.org/take-a-class/cpr/performing-cpr/cpr-steps\n- American Red Cross — AED use: https://www.redcross.org/take-a-class/aed/using-an-aed/aed-steps\n\nVerification date: 2026-08-09."},"el":{"title":"Ετοιμότητα ΚΑΡΠΑ και AED: Αναγνώριση, Δράση και Παράδοση στους Διασώστες","body":"Ένα offline εγχειρίδιο δεν αντικαθιστά πρακτική εκπαίδευση ΚΑΡΠΑ, μπορεί όμως να διορθώσει ένα συχνό κενό ετοιμότητας: να υπάρχει απινιδωτής κοντά, αλλά κανείς να μην ξέρει πού βρίσκεται, αν λειτουργεί ή τι πρέπει να γίνει όταν κάποιος καταρρεύσει.\n\n## Προετοιμασία πριν το συμβάν\nΜάθε πού υπάρχουν οι κοντινότεροι αυτόματοι εξωτερικοί απινιδωτές σε χώρους που χρησιμοποιείς συχνά: κοινόχρηστους χώρους πολυκατοικίας, εργασία, γυμναστήριο, σχολείο, πλοίο, ξενοδοχείο, δημοτικό κτίριο ή καταφύγιο. Φρόντισε περισσότερα από ένα άτομα του νοικοκυριού να έχουν πρόσφατη εκπαίδευση πρώτων βοηθειών/ΚΑΡΠΑ. Αν υπάρχει οικιακός AED, κατέγραψε μοντέλο, λήξη ηλεκτροδίων, κατάσταση μπαταρίας, θέση και ποιοι έχουν εκπαιδευτεί. Μην τον θάβεις κάτω από άλλα εφόδια.\n\n## Όταν κάποιος δεν ανταποκρίνεται\nΒεβαιώσου πρώτα ότι ο χώρος είναι ασφαλής. Έλεγξε ανταπόκριση και φυσιολογική αναπνοή σύμφωνα με την εκπαίδευση ΚΑΡΠΑ που έχεις λάβει. Ενεργοποίησε αμέσως τις υπηρεσίες έκτακτης ανάγκης και ζήτησε από κάποιον να φέρει AED, αν υπάρχει. Αν το άτομο δεν αναπνέει φυσιολογικά, ξεκίνα ΚΑΡΠΑ όπως έχεις εκπαιδευτεί. Ο Αμερικανικός Ερυθρός Σταυρός διδάσκει για ενήλικες ρυθμό θωρακικών συμπιέσεων 100–120 ανά λεπτό και πλήρη επαναφορά του θώρακα· ο εκπαιδευμένος διασώστης ακολουθεί την τρέχουσα τεχνική για την ηλικία και την κατάσταση του ατόμου.\n\n## Άφησε τον AED να αποφασίσει για απινίδωση\nΆνοιξε τη συσκευή και ακολούθησε τα ηχητικά/οπτικά μηνύματα. Ο AED αναλύει τον ρυθμό και αποφασίζει αν ενδείκνυται απινίδωση. Κανείς δεν πρέπει να αγγίζει το άτομο κατά την ανάλυση ή την εκφόρτιση. Ξεκίνα ξανά ΚΑΡΠΑ όταν το ζητήσει η συσκευή. Μην καθυστερείς βασική ανάνηψη προσπαθώντας να διαγνώσεις τον καρδιακό ρυθμό.\n\n## Χρήσιμη παράδοση στους διασώστες\nΈνα άτομο μπορεί να σημειώνει περίπου πότε έγινε η κατάρρευση, πότε ξεκίνησε ΚΑΡΠΑ, αν δόθηκε απινίδωση, γνωστά νοσήματα, φάρμακα/αλλεργίες αν είναι άμεσα διαθέσιμα και τι αλλαγές παρατηρήθηκαν. Δώσε αυτές τις πληροφορίες στους διασώστες χωρίς να διακόπτεται η φροντίδα.\n\n## Όρια του κεφαλαίου\nΔεν αντικαθιστά πιστοποιημένη εκπαίδευση ΚΑΡΠΑ/AED, παιδιατρική εκπαίδευση, οδηγίες τηλεφωνικού κέντρου ή επείγουσα ιατρική φροντίδα. Η πρακτική με εκπαιδευτικό πρόπλασμα και εκπαιδευτικό AED είναι πολύ πιο αξιόπιστη από την ανάγνωση μόνο.\n\n## Πηγές επαλήθευσης\n- American Red Cross — βήματα ΚΑΡΠΑ: https://www.redcross.org/take-a-class/cpr/performing-cpr/cpr-steps\n- American Red Cross — χρήση AED: https://www.redcross.org/take-a-class/aed/using-an-aed/aed-steps\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":162,"en":{"title":"Stroke Recognition and Time-Critical Transfer","body":"Stroke is a time-critical emergency. The household task is not to determine the stroke type; it is to recognize sudden neurological change, record when the person was last known well, call emergency medical services, and avoid delays caused by waiting for symptoms to improve.\n\n## Sudden changes matter\nCDC lists sudden weakness or numbness of the face, arm, or leg—especially on one side—along with sudden speech/confusion, vision difficulty, balance/walking problems, or a severe unexplained headache as stroke warning signs. A transient episode can still be a medical emergency; there is no safe household method for distinguishing a temporary ischemic event from a major stroke at the beginning.\n\n## Record the clock, not a guess\nWrite down the exact time symptoms were first noticed and, if different, the last time the person was known to be normal. If symptoms are discovered after sleep, record when the person was last seen well. This is more useful to clinicians than an estimate created later under stress.\n\n## Call rather than self-triage\nUse the emergency medical system. Do not wait for a relative, routine appointment, or online search. Do not give food, drink, or unprescribed medicine to “test” whether the person improves. If the person has a prescribed emergency plan for another condition, tell dispatch/responders, but do not assume familiar symptoms explain away a possible stroke.\n\n## Prepare the handoff\nBring identification, a concise medication/allergy list, known medical history, and the recorded onset/last-known-well time if these can be obtained without delaying care. Note whether the person uses anticoagulants or has had recent surgery/bleeding only if already known; do not search the home for paperwork while transport is waiting.\n\n## Offline readiness\nKeep a printed medical card and emergency contact sheet where another person can find them. A person living alone should include a plan for unlocking/access, pets, and medication information so responders are not delayed by avoidable logistics.\n\n## Verification source\n- CDC — Signs and Symptoms of Stroke: https://www.cdc.gov/stroke/signs-symptoms/index.html\n\nVerification date: 2026-08-09."},"el":{"title":"Αναγνώριση Εγκεφαλικού και Μεταφορά Χωρίς Καθυστέρηση","body":"Το εγκεφαλικό είναι επείγον περιστατικό όπου ο χρόνος έχει σημασία. Το νοικοκυριό δεν χρειάζεται να αποφασίσει τον τύπο του εγκεφαλικού· χρειάζεται να αναγνωρίσει ξαφνική νευρολογική αλλαγή, να καταγράψει πότε το άτομο ήταν τελευταία φορά φυσιολογικό, να καλέσει επείγουσα βοήθεια και να μην περιμένει μήπως «περάσει».\n\n## Οι ξαφνικές αλλαγές είναι προειδοποιητικές\nΤο CDC αναφέρει ως ενδείξεις ξαφνική αδυναμία ή μούδιασμα προσώπου, χεριού ή ποδιού, ιδιαίτερα στη μία πλευρά, ξαφνική σύγχυση ή δυσκολία ομιλίας/κατανόησης, πρόβλημα όρασης, βάδισης ή ισορροπίας και έντονο ανεξήγητο πονοκέφαλο. Ακόμη και επεισόδιο που υποχωρεί μπορεί να είναι επείγον· στην αρχή δεν υπάρχει ασφαλής οικιακός τρόπος να ξεχωρίσεις ένα παροδικό επεισόδιο από μεγάλο εγκεφαλικό.\n\n## Κατέγραψε τον χρόνο, όχι μια μεταγενέστερη εκτίμηση\nΣημείωσε την ακριβή ώρα που παρατηρήθηκαν πρώτα τα συμπτώματα και, αν διαφέρει, πότε το άτομο ήταν τελευταία φορά γνωστό ότι ήταν φυσιολογικό. Αν τα συμπτώματα ανακαλύφθηκαν μετά τον ύπνο, σημείωσε πότε είχε τελευταία φυσιολογική εικόνα. Αυτή η πληροφορία είναι χρησιμότερη από μια πρόχειρη εκτίμηση μετά από ώρα.\n\n## Κάλεσε βοήθεια αντί να κάνεις αυτοδιάγνωση\nΧρησιμοποίησε το σύστημα επείγουσας ιατρικής βοήθειας. Μην περιμένεις συγγενή, τακτικό ραντεβού ή αναζήτηση στο διαδίκτυο. Μη δίνεις τροφή, ποτό ή μη συνταγογραφημένο φάρμακο για να «δοκιμάσεις» αν βελτιώνεται. Αν υπάρχει ήδη ιατρικό σχέδιο για άλλη πάθηση, ενημέρωσε το τηλεφωνικό κέντρο/διασώστες, αλλά μην θεωρείς ότι γνωστά συμπτώματα αποκλείουν εγκεφαλικό.\n\n## Προετοίμασε σύντομη παράδοση\nΠάρε ταυτοποίηση, σύντομη λίστα φαρμάκων/αλλεργιών, γνωστό ιστορικό και τον χρόνο έναρξης ή τελευταίας φυσιολογικής κατάστασης αν είναι άμεσα διαθέσιμα. Αν ήδη γνωρίζεις ότι λαμβάνει αντιπηκτικά ή είχε πρόσφατη επέμβαση/αιμορραγία, ανέφερέ το. Μην καθυστερείς το ασθενοφόρο ψάχνοντας χαρτιά.\n\n## Offline ετοιμότητα\nΚράτησε έντυπη ιατρική κάρτα και επαφή έκτακτης ανάγκης σε γνωστή θέση. Για άτομο που ζει μόνο του, σχεδίασε πρόσβαση στην κατοικία, φροντίδα ζώων και εύρεση φαρμακευτικών πληροφοριών ώστε να μη χαθεί χρόνος σε πρακτικά εμπόδια.\n\n## Πηγή επαλήθευσης\n- CDC — σημεία και συμπτώματα εγκεφαλικού: https://www.cdc.gov/stroke/signs-symptoms/index.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":163,"en":{"title":"Possible Heart Attack: Chest Pain and Emergency Boundaries","body":"A blackout, wildfire evacuation, heat event, or long drive can tempt people to explain chest symptoms as stress, dehydration, smoke, indigestion, or fatigue. A survival plan should instead make it easy to escalate possible heart-attack symptoms quickly and provide responders with the information they need.\n\n## Warning patterns\nCDC describes chest pain or discomfort—often pressure, squeezing, fullness, or pain—as a major warning sign, along with shortness of breath, weakness/light-headedness, cold sweating, and discomfort that may involve the jaw, neck, back, arms, or shoulders. Symptoms do not have to be dramatic, and not every person experiences the same pattern.\n\n## Do not create a transport delay\nCall emergency medical services when a heart attack is suspected. Do not make the person walk a long distance to a vehicle if ambulance access is possible, and do not delay to finish packing or secure property. If dispatch gives instructions, follow them. If the person becomes unresponsive and is not breathing normally, move into the CPR/AED response covered in the dedicated chapter.\n\n## Medication boundaries\nDo not invent an emergency medication plan from an offline guide. A person with known heart disease should keep their clinician-prescribed emergency plan and medicines accessible and use them exactly as instructed. Tell responders what was taken, when, and in what prescribed form. Avoid giving someone else’s prescription medicine.\n\n## Outage-specific preparation\nIf the household relies on elevators, gated access, oxygen, powered medical equipment, or a remote location, plan how responders will reach the person. Keep address/location coordinates, floor/unit, gate instructions, and a brief medical card offline. During heat or smoke events, do not assume the environmental hazard is the only explanation for chest symptoms.\n\n## Verification source\n- CDC — Heart Attack: https://www.cdc.gov/heart-disease/about/heart-attack.html\n\nVerification date: 2026-08-09."},"el":{"title":"Πιθανό Έμφραγμα: Πόνος στο Στήθος και Όρια Οικιακής Αντιμετώπισης","body":"Σε διακοπή ρεύματος, εκκένωση λόγω πυρκαγιάς, καύσωνα ή πολύωρη μετακίνηση είναι εύκολο να αποδοθεί πόνος στο στήθος σε άγχος, αφυδάτωση, καπνό, δυσπεψία ή κόπωση. Ένα σχέδιο επιβίωσης πρέπει αντίθετα να κάνει εύκολη τη γρήγορη κλήση βοήθειας και την παράδοση σωστών πληροφοριών.\n\n## Προειδοποιητικά μοτίβα\nΤο CDC περιγράφει πόνο ή δυσφορία στο στήθος—συχνά ως πίεση, σφίξιμο, βάρος ή πόνο—μαζί με δύσπνοια, αδυναμία/ζάλη, κρύο ιδρώτα και ενόχληση που μπορεί να φτάνει σε γνάθο, αυχένα, πλάτη, χέρια ή ώμους. Τα συμπτώματα δεν είναι πάντα θεαματικά και διαφέρουν από άνθρωπο σε άνθρωπο.\n\n## Μην δημιουργείς καθυστέρηση μεταφοράς\nΚάλεσε επείγουσα ιατρική βοήθεια όταν υπάρχει υποψία εμφράγματος. Μην αναγκάζεις το άτομο να περπατήσει μεγάλη απόσταση μέχρι αυτοκίνητο αν μπορεί να έρθει ασθενοφόρο και μη χάνεις χρόνο ολοκληρώνοντας πακετάρισμα ή προστασία αντικειμένων. Ακολούθησε τις οδηγίες του τηλεφωνικού κέντρου. Αν το άτομο χάσει τις αισθήσεις του και δεν αναπνέει φυσιολογικά, πέρασε στη διαδικασία ΚΑΡΠΑ/AED του αντίστοιχου κεφαλαίου.\n\n## Όρια σχετικά με φάρμακα\nΜην δημιουργείς σχέδιο επείγουσας φαρμακευτικής αγωγής από offline οδηγό. Άτομο με γνωστή καρδιοπάθεια πρέπει να έχει διαθέσιμο το σχέδιο και τα φάρμακα που έχει δώσει ο γιατρός και να τα χρησιμοποιεί ακριβώς όπως έχει οριστεί. Ενημέρωσε τους διασώστες τι λήφθηκε και πότε. Μη δίνεις συνταγογραφημένο φάρμακο άλλου ανθρώπου.\n\n## Ετοιμότητα ειδικά για διακοπή\nΑν το νοικοκυριό εξαρτάται από ανελκυστήρα, ηλεκτρική πόρτα, οξυγόνο, ιατρικό εξοπλισμό ή βρίσκεται απομονωμένα, σχεδίασε πώς θα φτάσουν οι διασώστες. Κράτησε offline διεύθυνση/συντεταγμένες, όροφο/διαμέρισμα, οδηγίες πύλης και σύντομη ιατρική κάρτα. Σε καύσωνα ή καπνό μην θεωρείς ότι το περιβάλλον εξηγεί αυτόματα τον πόνο στο στήθος.\n\n## Πηγή επαλήθευσης\n- CDC — πληροφορίες για έμφραγμα: https://www.cdc.gov/heart-disease/about/heart-attack.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":164,"en":{"title":"Asthma Action-Plan Continuity During Smoke, Mold, and Displacement","body":"Disasters can combine several asthma triggers at once: smoke, dust, mold, cleaning chemicals, stress, disrupted sleep, heat, cold, and missed medication access. The safest offline plan is therefore built around the person’s existing clinician-created Asthma Action Plan rather than improvised treatment.\n\n## Protect the written plan\nKeep a paper copy and an offline digital copy of the Asthma Action Plan, medication list, inhaler/spacer instructions, prescriber/pharmacy contacts, and known triggers. CDC advises taking asthma medicines exactly as prescribed and not changing the treatment plan without a health-care provider. Mark refill/review dates early enough that an approaching storm or evacuation does not coincide with an empty controller or rescue medicine.\n\n## Separate air-quality control from medication\nDuring wildfire smoke, post-flood mold cleanup, dusty debris work, or chemical cleaning, reduce exposure first: move to cleaner air, keep the person away from cleanup zones, and use building/filtration controls appropriate to the hazard. Medication cannot make an unsafe exposure environment safe. If the normal safe room becomes too hot during an outage, heat risk must also be considered.\n\n## Know the escalation point in advance\nThe person’s action plan should state what symptoms/measurements require rescue medicine and what indicates urgent/emergency care. Household members should know where the plan is stored and how to describe worsening breathing to emergency dispatch. If severe breathing difficulty, inability to speak normally, bluish/gray lips or altered consciousness appears, treat it as an emergency rather than waiting for another household remedy.\n\n## Protect devices and supplies\nKeep inhalers away from extreme heat, contamination, and water; follow label/manufacturer storage limits. If a nebulizer or other device needs electricity, link it to the power-dependent medical equipment plan and relocation threshold.\n\n## Verification sources\n- CDC — Asthma Emergency Care: https://www.cdc.gov/asthma/emergency/index.html\n- CDC — Asthma Care Before, During, and After Disasters: https://www.cdc.gov/natural-disasters/communication-resources/asthma-care-before-during-and-after-a-hurricane-or-other-tropical-storm-factsheet.html\n\nVerification date: 2026-08-09."},"el":{"title":"Συνέχεια Σχεδίου Άσθματος σε Καπνό, Μούχλα και Μετακίνηση","body":"Μια καταστροφή μπορεί να συνδυάσει πολλούς εκλυτικούς παράγοντες άσθματος: καπνό, σκόνη, μούχλα, καθαριστικά, στρες, κακό ύπνο, ζέστη, κρύο και δυσκολία πρόσβασης σε φάρμακα. Γι’ αυτό το ασφαλέστερο offline σχέδιο βασίζεται στο υπάρχον Σχέδιο Δράσης για Άσθμα που έχει συμφωνηθεί με επαγγελματία υγείας, όχι σε αυτοσχέδια θεραπεία.\n\n## Προστάτευσε το γραπτό σχέδιο\nΚράτησε έντυπο και offline ψηφιακό αντίγραφο του σχεδίου, της λίστας φαρμάκων, των οδηγιών για εισπνευστήρα/αεροθάλαμο, των επαφών γιατρού/φαρμακείου και των γνωστών εκλυτικών παραγόντων. Το CDC συνιστά τα φάρμακα να λαμβάνονται ακριβώς όπως έχουν συνταγογραφηθεί και να μην αλλάζει το θεραπευτικό σχέδιο χωρίς επαγγελματία υγείας. Βάλε υπενθύμιση ανανέωσης αρκετά νωρίς ώστε καταιγίδα ή εκκένωση να μη συμπέσει με άδειο απόθεμα.\n\n## Χώρισε τον έλεγχο αέρα από τη φαρμακευτική αγωγή\nΣε καπνό πυρκαγιάς, μούχλα μετά από πλημμύρα, σκόνη μπάζων ή χημικό καθαρισμό, μείωσε πρώτα την έκθεση: πήγαινε σε καθαρότερο αέρα, κράτησε το άτομο μακριά από ζώνες καθαρισμού και χρησιμοποίησε κατάλληλο έλεγχο αέρα/φιλτραρίσματος. Το φάρμακο δεν μετατρέπει ένα επικίνδυνο περιβάλλον σε ασφαλές. Αν ένας «καθαρός χώρος» υπερθερμανθεί χωρίς ρεύμα, πρέπει να συνυπολογιστεί και ο κίνδυνος θερμότητας.\n\n## Όρισε από πριν πότε χρειάζεται κλιμάκωση\nΤο προσωπικό σχέδιο πρέπει να αναφέρει ποια συμπτώματα ή μετρήσεις ενεργοποιούν το φάρμακο ανακούφισης και πότε απαιτείται επείγουσα φροντίδα. Τα μέλη του νοικοκυριού πρέπει να ξέρουν πού βρίσκεται το σχέδιο και πώς θα περιγράψουν επιδείνωση της αναπνοής στο τηλεφωνικό κέντρο. Σοβαρή δύσπνοια, αδυναμία φυσιολογικής ομιλίας, κυανή/γκρι χροιά χειλιών ή αλλαγή επιπέδου συνείδησης απαιτούν επείγουσα βοήθεια.\n\n## Προστάτευσε συσκευές και εφόδια\nΦύλαξε εισπνευστήρες μακριά από ακραία θερμότητα, μόλυνση και νερό σύμφωνα με ετικέτα/κατασκευαστή. Αν νεφελοποιητής ή άλλη συσκευή χρειάζεται ρεύμα, σύνδεσέ τον με το σχέδιο ιατρικής συσκευής που εξαρτάται από ηλεκτρική ισχύ και με σαφές κριτήριο μετακίνησης.\n\n## Πηγές επαλήθευσης\n- CDC — επείγουσα φροντίδα για άσθμα: https://www.cdc.gov/asthma/emergency/index.html\n- CDC — φροντίδα άσθματος πριν/κατά/μετά από καταστροφή: https://www.cdc.gov/natural-disasters/communication-resources/asthma-care-before-during-and-after-a-hurricane-or-other-tropical-storm-factsheet.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":165,"en":{"title":"Anaphylaxis Continuity: Prescribed Emergency Plan, Auto-Injector, and Evacuation","body":"A severe allergic reaction can progress quickly, so preparedness is less about carrying a generic first-aid list and more about keeping the person’s prescribed emergency medication, written plan, safe food controls, and emergency transport available during disruption.\n\n## Keep the person-specific plan with the medicine\nIf a clinician has prescribed an epinephrine auto-injector or other emergency product, store it according to the manufacturer instructions and keep it with the person rather than in a distant household cache. CDC advises people at risk to learn when and how to use prescribed epinephrine products with their health-care provider; emergency evaluation is still needed after their use. Check expiry and physical condition during routine preparedness maintenance.\n\n## Avoid exposure during shared-food operations\nEvacuation centers, mutual-aid kitchens, donated food, unpackaged meals, and unfamiliar cookware increase cross-contact uncertainty. Keep the allergy written in clear language, carry safe backup food when feasible, and do not rely on “looks safe” or informal ingredient guesses. A person who cannot verify a food should have a preplanned alternative rather than being pressured to accept it because supplies are scarce.\n\n## Recognize the emergency chain\nHousehold members should know the person’s prescribed action plan, where the medicine is, how emergency services are called, and which meeting/entry point responders should use. Do not replace the person’s plan with antihistamines, improvised dosing, or delayed observation. If the emergency product is used, record the time and tell responders exactly what was administered.\n\n## Protect against displacement loss\nSplit documentation from supply: keep the allergy/emergency-plan information in the medical card and backup contact sheet even if the medicine bag is lost. During evacuation, perform a medication/equipment check at each handoff point rather than discovering the missing injector hours later.\n\n## Verification sources\n- CDC — Managing Alpha-gal Syndrome / emergency epinephrine preparedness principles: https://www.cdc.gov/alpha-gal-syndrome/managing/index.html\n- CDC — Food Allergy Emergency Planning resources.\n\nVerification date: 2026-08-09."},"el":{"title":"Συνέχεια σε Αναφυλαξία: Συνταγογραφημένο Σχέδιο, Αυτοενιέμενη Αδρεναλίνη και Εκκένωση","body":"Μια σοβαρή αλλεργική αντίδραση μπορεί να εξελιχθεί γρήγορα. Η ετοιμότητα επομένως δεν είναι μια γενική λίστα πρώτων βοηθειών, αλλά η συνεχής διαθεσιμότητα του προσωπικού σχεδίου, του συνταγογραφημένου επείγοντος φαρμάκου, ασφαλούς τροφής και πρόσβασης σε επείγουσα μεταφορά.\n\n## Κράτησε το προσωπικό σχέδιο μαζί με το φάρμακο\nΑν γιατρός έχει συνταγογραφήσει αυτοενιέμενη αδρεναλίνη ή άλλο επείγον προϊόν, φύλαξέ το σύμφωνα με τις οδηγίες κατασκευαστή και κράτησέ το μαζί με το άτομο αντί σε μακρινή αποθήκη. Το CDC συστήνει το άτομο να έχει εκπαιδευτεί από τον επαγγελματία υγείας για το πότε και πώς χρησιμοποιείται το συνταγογραφημένο προϊόν· μετά τη χρήση εξακολουθεί να απαιτείται επείγουσα αξιολόγηση. Έλεγχε λήξη και φυσική κατάσταση του προϊόντος στην τακτική συντήρηση ετοιμότητας.\n\n## Μείωσε την έκθεση σε κοινόχρηστη σίτιση\nΚαταφύγια, κοινοτικές κουζίνες, δωρεές τροφίμων, μη συσκευασμένα γεύματα και άγνωστα σκεύη αυξάνουν την αβεβαιότητα διασταυρούμενης επαφής. Κατέγραψε καθαρά την αλλεργία, κράτησε ασφαλή εναλλακτική τροφή όπου είναι εφικτό και μην βασίζεσαι σε πρόχειρες εκτιμήσεις συστατικών. Όταν ένα τρόφιμο δεν μπορεί να επαληθευτεί, το σχέδιο πρέπει να προβλέπει εναλλακτική και όχι πίεση να καταναλωθεί επειδή υπάρχει έλλειψη.\n\n## Γνώρισε την αλυσίδα επείγουσας αντίδρασης\nΤα μέλη του νοικοκυριού πρέπει να ξέρουν το προσωπικό σχέδιο, πού βρίσκεται το φάρμακο, πώς καλούνται οι υπηρεσίες έκτακτης ανάγκης και ποιο σημείο πρόσβασης θα χρησιμοποιήσουν. Μην αντικαθιστάς το σχέδιο με αντιισταμινικά, αυτοσχέδιες δόσεις ή καθυστερημένη παρακολούθηση. Αν χρησιμοποιηθεί το επείγον προϊόν, σημείωσε την ώρα και ενημέρωσε ακριβώς τους διασώστες.\n\n## Προστάτευσε το σχέδιο από απώλεια κατά τη μετακίνηση\nΚράτησε τις πληροφορίες αλλεργίας/σχεδίου και στην ιατρική κάρτα/εφεδρικό αρχείο ώστε να παραμένουν διαθέσιμες ακόμη κι αν χαθεί το σακίδιο φαρμάκων. Σε κάθε στάδιο εκκένωσης κάνε έλεγχο φαρμάκου και εξοπλισμού αντί να ανακαλύψεις ώρες αργότερα ότι λείπει.\n\n## Πηγές επαλήθευσης\n- CDC — διαχείριση σοβαρής αλλεργίας και ετοιμότητα με συνταγογραφημένη αδρεναλίνη: https://www.cdc.gov/alpha-gal-syndrome/managing/index.html\n- CDC — πόροι σχεδίων έκτακτης ανάγκης για τροφικές αλλεργίες.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":166,"en":{"title":"Vomiting, Diarrhea, and Dehydration During an Outage","body":"Gastrointestinal illness becomes more dangerous when safe water, refrigeration, toilets, pharmacies, and transport are disrupted. The operational goals are to prevent contamination from spreading, maintain safe hydration when possible, and recognize when home management is no longer appropriate.\n\n## Stop the contamination chain\nAssign a separate toilet if available; otherwise clean high-touch bathroom surfaces with products used exactly according to their labels and never mix cleaning chemicals. Wash hands with soap and safe water, especially after toileting/diapering and before food preparation. A symptomatic food handler should not prepare meals for the group. Keep vomit/diarrhea cleanup materials away from food and drinking-water zones.\n\n## Protect the water source\nUse water that authorities consider safe. If a boil-water or do-not-use advisory is active, follow that specific advisory rather than a generic treatment rule. Do not make infant formula, ice, oral medicines, or drinks with water known or suspected to be unsafe. When commercial oral rehydration solution is available, use it according to its label/clinical advice; do not improvise concentrated salt/sugar mixtures by guesswork.\n\n## Watch for dangerous dehydration\nUrgent evaluation is warranted when the person cannot keep fluids down, becomes very weak, confused, unusually sleepy, has signs of shock, severe or persistent abdominal pain, blood in stool/vomit, or markedly reduced urination. Infants, young children, older adults, pregnant people, and people with kidney, heart, or metabolic disease can deteriorate faster and need a lower threshold for professional advice.\n\n## Log the cluster\nRecord who became ill, approximate onset, foods/water shared, fever if measured, and whether multiple people are affected. A cluster may indicate contaminated food/water rather than an isolated stomach illness. Stop serving the suspected source and contact public-health/medical services when available.\n\n## Verification sources\n- CDC Natural Disasters — diarrheal illness and safe water resources: https://www.cdc.gov/natural-disasters/site.html\n- WHO — Water, sanitation and hygiene in emergencies: https://www.who.int/teams/environment-climate-change-and-health/water-sanitation-and-health/environmental-health-in-emergencies/humanitarian-emergencies\n\nVerification date: 2026-08-09."},"el":{"title":"Έμετος, Διάρροια και Αφυδάτωση σε Διακοπή Υποδομών","body":"Γαστρεντερική νόσος γίνεται πιο επικίνδυνη όταν λείπουν ασφαλές νερό, ψύξη τροφίμων, τουαλέτες, φαρμακείο ή μεταφορά. Οι στόχοι είναι να μη μεταδοθεί η μόλυνση, να διατηρηθεί ασφαλής ενυδάτωση όπου γίνεται και να αναγνωριστεί έγκαιρα πότε η οικιακή αντιμετώπιση δεν αρκεί.\n\n## Σπάσε την αλυσίδα μόλυνσης\nΧρησιμοποίησε ξεχωριστή τουαλέτα αν υπάρχει· διαφορετικά καθάριζε συχνά τα σημεία επαφής στο μπάνιο με προϊόντα ακριβώς όπως ορίζει η ετικέτα και ποτέ μην αναμειγνύεις καθαριστικά. Πλύνε χέρια με σαπούνι και ασφαλές νερό μετά από τουαλέτα/αλλαγή πάνας και πριν από τρόφιμα. Άτομο με συμπτώματα δεν πρέπει να μαγειρεύει για την ομάδα. Υλικά καθαρισμού εμετού/διάρροιας μένουν μακριά από ζώνες τροφής και πόσιμου νερού.\n\n## Προστάτευσε την πηγή νερού\nΧρησιμοποίησε νερό που οι αρχές θεωρούν ασφαλές. Αν υπάρχει οδηγία βρασμού, «μην πίνετε» ή «μην χρησιμοποιείτε», ακολούθησε τη συγκεκριμένη οδηγία αντί για γενικό κανόνα. Μην ετοιμάζεις βρεφικό γάλα, πάγο, πόσιμα διαλύματα ή φάρμακα με νερό που θεωρείται μη ασφαλές. Αν υπάρχει εμπορικό διάλυμα ενυδάτωσης, χρησιμοποίησέ το σύμφωνα με ετικέτα/ιατρική οδηγία και όχι με αυτοσχέδιες συγκεντρώσεις αλατιού ή ζάχαρης.\n\n## Πρόσεξε σημεία σοβαρής αφυδάτωσης\nΧρειάζεται επείγουσα αξιολόγηση όταν το άτομο δεν μπορεί να κρατήσει υγρά, γίνεται πολύ αδύναμο, μπερδεμένο ή ασυνήθιστα υπνηλικό, παρουσιάζει σημεία καταπληξίας, έντονο/επίμονο κοιλιακό πόνο, αίμα σε κόπρανα/έμετο ή πολύ μειωμένη ούρηση. Βρέφη, μικρά παιδιά, ηλικιωμένοι, εγκυμοσύνη και άτομα με νεφρική, καρδιακή ή μεταβολική νόσο μπορεί να επιδεινωθούν γρηγορότερα.\n\n## Κατέγραψε αν είναι συρροή\nΣημείωσε ποιος αρρώστησε, περίπου πότε ξεκίνησε, ποια τρόφιμα/νερό μοιράστηκαν, πυρετό αν μετρήθηκε και αν υπάρχουν πολλά περιστατικά. Πολλά άτομα με κοινή έκθεση μπορεί να δείχνουν μολυσμένο τρόφιμο/νερό. Σταμάτησε τη χρήση της ύποπτης πηγής και ζήτησε υγειονομική/ιατρική καθοδήγηση όταν είναι διαθέσιμη.\n\n## Πηγές επαλήθευσης\n- CDC Natural Disasters — διάρροια και ασφαλές νερό: https://www.cdc.gov/natural-disasters/site.html\n- WHO — νερό, αποχέτευση και υγιεινή σε έκτακτες ανάγκες: https://www.who.int/teams/environment-climate-change-and-health/water-sanitation-and-health/environmental-health-in-emergencies/humanitarian-emergencies\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":167,"en":{"title":"Dental Emergencies During Isolation: Pain, Trauma, and Infection Boundaries","body":"Dental problems can become operationally serious during isolation because pain interferes with sleep, eating, hydration, and concentration, while an infection can progress beyond the tooth. The goal of an offline guide is to preserve the tooth/tissue where reasonable, reduce additional injury, and identify situations that require urgent professional care.\n\n## Trauma needs gentle handling\nFor a broken tooth or mouth injury, rinse gently with safe water and control bleeding with clean gauze/cloth and steady pressure when appropriate. Keep fractured pieces if easily recovered. A knocked-out permanent tooth is time-sensitive dental trauma; professional dental guidance should be sought immediately. Do not scrub the root or force a tooth back if you are unsure whether it is permanent, if the person is very young, or if the situation is unsafe.\n\n## Swelling changes the urgency\nFacial/neck swelling, difficulty breathing or swallowing, spreading redness, fever with severe dental pain, confusion, or rapid deterioration are not “wait until the roads reopen” problems. Escalate to emergency care. A localized toothache without these features still needs dental review, but the transport priority is different.\n\n## Avoid unsafe improvisation\nDo not place aspirin, caustic chemicals, fuel, alcohol, or household disinfectants directly on gums or teeth. Do not attempt home extraction. Use only pain medicines the person can normally take and exactly according to the labeled/prescribed directions; this project does not calculate doses.\n\n## Prepare for access disruption\nKeep dentist details, dental insurance/record information, denture/retainer cases, cleaning supplies, and spare essentials in the continuity register. People with dentures or orthodontic appliances should have a plan for cleaning with safe water and for sharp/broken components that injure soft tissue.\n\n## Verification sources\n- American Red Cross first-aid principles for bleeding/trauma.\n- Professional dental emergency guidance should supersede this offline continuity note.\n\nVerification date: 2026-08-09."},"el":{"title":"Οδοντιατρικά Επείγοντα σε Απομόνωση: Πόνος, Τραύμα και Λοίμωξη","body":"Ένα οδοντιατρικό πρόβλημα μπορεί να γίνει σοβαρό σε απομόνωση επειδή ο πόνος επηρεάζει ύπνο, σίτιση, ενυδάτωση και συγκέντρωση, ενώ μια λοίμωξη μπορεί να επεκταθεί πέρα από το δόντι. Στόχος του offline οδηγού είναι να περιορίσει πρόσθετη βλάβη, να διατηρήσει δόντι/ιστούς όπου είναι λογικό και να ξεχωρίσει πότε απαιτείται επείγουσα επαγγελματική φροντίδα.\n\n## Χειρίσου απαλά το τραύμα\nΣε σπασμένο δόντι ή τραυματισμό στόματος, ξέπλυνε απαλά με ασφαλές νερό και έλεγξε αιμορραγία με καθαρή γάζα/ύφασμα και σταθερή πίεση όπου ενδείκνυται. Κράτησε κομμάτια δοντιού αν βρίσκονται εύκολα. Η πλήρης αποκόλληση μόνιμου δοντιού είναι χρονικά ευαίσθητο περιστατικό και χρειάζεται άμεση οδοντιατρική καθοδήγηση. Μην τρίβεις τη ρίζα και μην προσπαθείς να επανατοποθετήσεις δόντι αν δεν είσαι βέβαιος ότι είναι μόνιμο ή αν η κατάσταση δεν είναι ασφαλής.\n\n## Το πρήξιμο αλλάζει την προτεραιότητα\nΠρήξιμο προσώπου/λαιμού, δυσκολία αναπνοής ή κατάποσης, ερυθρότητα που επεκτείνεται, πυρετός με έντονο οδοντικό πόνο, σύγχυση ή γρήγορη επιδείνωση απαιτούν επείγουσα αξιολόγηση. Δεν είναι προβλήματα που πρέπει να περιμένουν απλώς «μέχρι να ανοίξει ο δρόμος».\n\n## Απόφυγε επικίνδυνους αυτοσχεδιασμούς\nΜην τοποθετείς ασπιρίνη, καυστικές ουσίες, καύσιμα, αλκοόλ ή οικιακά απολυμαντικά πάνω σε ούλα/δόντια. Μην επιχειρείς εξαγωγή στο σπίτι. Χρησιμοποίησε μόνο παυσίπονα που το άτομο μπορεί κανονικά να λάβει και ακριβώς σύμφωνα με ετικέτα/συνταγή· το project δεν υπολογίζει δόσεις.\n\n## Προετοιμάσου για διακοπή πρόσβασης\nΚράτησε στοιχεία οδοντιάτρου, βασικό οδοντιατρικό ιστορικό, θήκες οδοντοστοιχίας/νάρθηκα, υλικά καθαρισμού και απαραίτητα αναλώσιμα. Άτομα με οδοντοστοιχίες ή ορθοδοντικά εξαρτήματα χρειάζονται σχέδιο καθαρισμού με ασφαλές νερό και διαχείρισης αιχμηρού/σπασμένου εξαρτήματος που τραυματίζει τον βλεννογόνο.\n\n## Πηγές επαλήθευσης\n- Βασικές αρχές πρώτων βοηθειών του American Red Cross για τραύμα/αιμορραγία.\n- Η επαγγελματική οδοντιατρική καθοδήγηση υπερισχύει αυτού του offline σημειώματος.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":168,"en":{"title":"Eye Chemical Splash and Eye-Injury Boundaries","body":"Eye emergencies are especially unforgiving of delay. During cleanup, battery work, fuel handling, bleach use, dust/debris removal, or workshop repair, an eye exposure may occur when normal medical access is already disrupted.\n\n## Chemical splash: rinse immediately\nFor a chemical splashed into the eye, begin rinsing with plentiful clean, room-temperature water immediately. Poison Control guidance emphasizes irrigating first rather than spending time identifying every ingredient. Remove contact lenses if they come out easily and keep water moving across the eye while the person blinks. Continue for the duration advised by the product safety guidance/poison service; many poison-control protocols use at least 15–20 minutes for eye irrigation.\n\n## Do not neutralize chemicals in the eye\nDo not add vinegar, baking soda, bleach, alcohol, antiseptic, or another chemical to “neutralize” the exposure. Do not rub the eye. If a solid particle is embedded, an object penetrated the eye, or trauma caused visible deformity, protect the eye from pressure and obtain emergency care rather than attempting removal.\n\n## Escalation signs\nSevere pain, persistent redness/tearing, visual change, light sensitivity, inability to open the eye, chemical burns, or any high-velocity/penetrating injury warrants urgent professional assessment. A splash involving a concentrated industrial cleaner, pesticide, fuel, battery electrolyte, or unknown chemical should be discussed with poison/emergency professionals as soon as possible.\n\n## Prevent the second casualty\nThe helper should avoid direct contact with the chemical. Remove contaminated gloves/clothing safely, protect the clean water supply, and ventilate if inhalation exposure is also possible. Record the product name/label and time of exposure for responders.\n\n## Verification source\n- Poison Control — First Aid for Poisonings / Eye Exposures: https://www.poison.org/first-aid-for-poisonings\n\nVerification date: 2026-08-09."},"el":{"title":"Χημικό Πιτσίλισμα και Τραυματισμός Ματιού: Άμεσα Όρια Αντιμετώπισης","body":"Τα επείγοντα του ματιού δεν συγχωρούν καθυστέρηση. Κατά καθαρισμό, εργασία με μπαταρίες/καύσιμα, χρήση χλωρίνης, απομάκρυνση σκόνης/μπάζων ή επισκευή μπορεί να συμβεί έκθεση ακριβώς όταν η ιατρική πρόσβαση είναι περιορισμένη.\n\n## Χημικό πιτσίλισμα: ξέπλυνε αμέσως\nΑν χημική ουσία μπει στο μάτι, ξεκίνα αμέσως έκπλυση με άφθονο καθαρό νερό θερμοκρασίας δωματίου. Η Poison Control δίνει προτεραιότητα στο άμεσο ξέπλυμα και όχι στην καθυστέρηση για πλήρη αναγνώριση των συστατικών. Αφαίρεσε φακούς επαφής αν βγαίνουν εύκολα και άφησε το νερό να περνά συνεχώς από το μάτι ενώ το άτομο ανοιγοκλείνει τα βλέφαρα. Συνέχισε για όσο ορίζει η ετικέτα/υπηρεσία δηλητηριάσεων· πολλά πρωτόκολλα χρησιμοποιούν τουλάχιστον 15–20 λεπτά έκπλυσης.\n\n## Μην προσπαθείς να «εξουδετερώσεις» το χημικό\nΜην βάζεις ξίδι, σόδα, χλωρίνη, οινόπνευμα, αντισηπτικό ή άλλη ουσία στο μάτι. Μην τρίβεις. Αν υπάρχει ενσφηνωμένο ξένο σώμα, διαμπερές τραύμα ή εμφανής παραμόρφωση μετά από χτύπημα, προστάτευσε το μάτι από πίεση και ζήτησε επείγουσα φροντίδα αντί να επιχειρήσεις αφαίρεση.\n\n## Σημεία κλιμάκωσης\nΈντονος πόνος, επίμονη ερυθρότητα/δάκρυα, αλλαγή όρασης, φωτοφοβία, αδυναμία να ανοίξει το μάτι, χημικό έγκαυμα ή τραυματισμός υψηλής ταχύτητας/διείσδυσης χρειάζονται επείγουσα αξιολόγηση. Έκθεση σε συμπυκνωμένο βιομηχανικό καθαριστικό, φυτοφάρμακο, καύσιμο, ηλεκτρολύτη μπαταρίας ή άγνωστη ουσία πρέπει να συζητηθεί άμεσα με υπηρεσία δηλητηριάσεων/επείγουσας βοήθειας.\n\n## Μην δημιουργήσεις δεύτερο θύμα\nΟ βοηθός πρέπει να αποφεύγει επαφή με την ουσία. Αφαίρεσε μολυσμένα γάντια/ρούχα με ασφάλεια, προστάτευσε την καθαρή παροχή νερού και αέρισε τον χώρο αν υπάρχει πιθανότητα εισπνοής. Κράτησε όνομα/ετικέτα προϊόντος και ώρα έκθεσης για τους διασώστες.\n\n## Πηγή επαλήθευσης\n- Poison Control — πρώτες βοήθειες σε δηλητηριάσεις/έκθεση ματιού: https://www.poison.org/first-aid-for-poisonings\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":169,"en":{"title":"Suspected Fracture or Severe Sprain: Immobilization and Transport Boundaries","body":"Falls, debris, stair evacuation, vehicle incidents, and cleanup work can cause limb injuries when professional care is delayed. The household objective is to prevent further injury and arrange appropriate assessment—not to force a diagnosis or “set” a bone.\n\n## Start with the whole person\nSevere bleeding, breathing problems, altered consciousness, major head/neck/back injury, crush injury, or signs of shock take priority over the limb. If the mechanism was high energy or the person cannot be moved safely, call emergency services and avoid unnecessary movement.\n\n## Protect the injured position\nFor an obviously injured arm or leg, support it in the position found and limit movement. Remove rings, watches, or tight items early if swelling is developing and they can be removed without manipulating the injury. A trained first aider may use a splint, but do not straighten a visibly deformed limb or push exposed bone back into a wound.\n\n## Check circulation and sensation\nBefore and after any support/splinting, note skin color/temperature, ability to move fingers/toes if appropriate, sensation, and the presence of circulation signs. Increasing numbness, a cold/pale/blue extremity, severe worsening pain, or loss of circulation is urgent.\n\n## Open injury or contamination\nCover open wounds with a clean dressing and control bleeding without pressing directly on protruding bone. Floodwater, soil, or dirty debris contamination increases infection/tetanus concerns and should be reported to the clinician.\n\n## Transport planning\nA person who cannot bear weight safely may need assisted evacuation or professional transport. Do not turn an unstable staircase, motorcycle, or overloaded car into the second injury. Record time, mechanism, visible changes, and any first aid provided.\n\n## Verification source\n- American Red Cross first-aid training principles for musculoskeletal injury and emergency assessment.\n\nVerification date: 2026-08-09."},"el":{"title":"Ύποπτο Κάταγμα ή Σοβαρό Διάστρεμμα: Ακινητοποίηση και Όρια Μεταφοράς","body":"Πτώσεις, μπάζα, εκκένωση από σκάλες, τροχαία και εργασίες καθαρισμού μπορούν να προκαλέσουν τραυματισμό άκρου όταν η πρόσβαση σε επαγγελματική φροντίδα καθυστερεί. Στόχος του νοικοκυριού είναι να αποτρέψει πρόσθετη βλάβη και να οργανώσει αξιολόγηση, όχι να «βάλει το κόκαλο στη θέση του».\n\n## Ξεκίνα από ολόκληρο το άτομο\nΣοβαρή αιμορραγία, πρόβλημα αναπνοής, αλλαγή συνείδησης, μεγάλο τραύμα κεφαλής/αυχένα/σπονδυλικής στήλης, σύνθλιψη ή σημεία καταπληξίας έχουν προτεραιότητα από το άκρο. Αν ο μηχανισμός ήταν υψηλής ενέργειας ή το άτομο δεν μπορεί να μετακινηθεί με ασφάλεια, κάλεσε βοήθεια και απόφυγε περιττή κίνηση.\n\n## Στήριξε τη θέση που βρήκες\nΣε εμφανώς τραυματισμένο χέρι ή πόδι, στήριξέ το στη θέση που βρίσκεται και περιόρισε την κίνηση. Αφαίρεσε δαχτυλίδια, ρολόγια ή στενά αντικείμενα νωρίς όταν αρχίζει πρήξιμο, εφόσον βγαίνουν χωρίς χειρισμό του τραυματισμού. Εκπαιδευμένος πρώτος βοηθός μπορεί να χρησιμοποιήσει νάρθηκα, αλλά μην ισιώνεις εμφανή παραμόρφωση και μην σπρώχνεις εκτεθειμένο οστό πίσω σε τραύμα.\n\n## Έλεγξε κυκλοφορία και αισθητικότητα\nΠριν και μετά οποιαδήποτε στήριξη/νάρθηκα, σημείωσε χρώμα/θερμοκρασία δέρματος, δυνατότητα κίνησης δακτύλων όπου είναι λογικό, αισθητικότητα και ενδείξεις κυκλοφορίας. Αυξανόμενο μούδιασμα, κρύο/ωχρό/κυανό άκρο, απότομη επιδείνωση πόνου ή απώλεια κυκλοφορίας είναι επείγοντα σημεία.\n\n## Ανοιχτό τραύμα ή μόλυνση\nΚάλυψε ανοιχτό τραύμα με καθαρό επίθεμα και έλεγξε αιμορραγία χωρίς πίεση πάνω σε προεξέχον οστό. Επαφή με πλημμυρόνερα, χώμα ή βρώμικα μπάζα αυξάνει τον κίνδυνο λοίμωξης/τετάνου και πρέπει να αναφερθεί στον επαγγελματία υγείας.\n\n## Σχεδιασμός μεταφοράς\nΆτομο που δεν μπορεί να πατήσει με ασφάλεια μπορεί να χρειάζεται υποβοηθούμενη εκκένωση ή επαγγελματική μεταφορά. Μην μετατρέπεις ασταθή σκάλα, μοτοσικλέτα ή υπερφορτωμένο όχημα σε δεύτερο τραυματισμό. Κατέγραψε ώρα, μηχανισμό, ορατές αλλαγές και πρώτες βοήθειες που δόθηκαν.\n\n## Πηγή επαλήθευσης\n- Αρχές εκπαίδευσης πρώτων βοηθειών American Red Cross για μυοσκελετικό τραύμα και επείγουσα εκτίμηση.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":170,"en":{"title":"Wound Cleaning, Dressing, and Infection Warning Signs After a Disaster","body":"Cuts and punctures are common after earthquakes, floods, storm debris, broken glass, and cleanup. The risk is not only bleeding: dirty water, soil, rusted/contaminated objects, animal waste, and delayed care can increase infection and tetanus concerns.\n\n## Control dangerous bleeding first\nLife-threatening bleeding takes priority over detailed cleaning. Use direct pressure and the severe-bleeding methods for which you are trained. Once bleeding is controlled and the wound is appropriate for household first aid, wash hands and use clean/safe water to gently remove visible dirt. Do not pour fuels, bleach, concentrated disinfectants, or caustic substances into tissue.\n\n## Cover and monitor\nUse a clean dressing that protects the wound without cutting off circulation. Change it when wet/dirty and inspect the wound. Record date/time and what contaminated the wound if relevant. Increasing redness that spreads, warmth, swelling, pus, worsening pain, fever, red streaks, or systemic illness warrant medical assessment.\n\n## Floodwater and puncture injuries deserve more caution\nCDC specifically warns that floodwater may contain sewage, chemicals, sharp objects, and pathogens. A wound exposed to floodwater should be cleaned and professionally evaluated when appropriate. Deep punctures, crush injuries, bites, wounds with retained foreign bodies, and injuries involving tendons/joints/eyes/face/hands can require urgent specialized care even if bleeding looks modest.\n\n## Tetanus status is part of the handoff\nDo not guess whether a “rusty object” alone determines tetanus risk. Tell the clinician the wound type/contamination and the person’s known vaccination history; they determine whether a booster or other treatment is needed.\n\n## Verification sources\n- CDC Natural Disasters — Emergency Wound Care resources: https://www.cdc.gov/natural-disasters/site.html\n- CDC — Flood re-entry safety: https://www.cdc.gov/floods/safety/reentering-your-flooded-home-safety.html\n\nVerification date: 2026-08-09."},"el":{"title":"Καθαρισμός Τραύματος, Επίδεση και Σημεία Λοίμωξης Μετά από Καταστροφή","body":"Κοψίματα και τρυπήματα είναι συχνά μετά από σεισμό, πλημμύρα, θύελλα, σπασμένα τζάμια και καθαρισμό μπάζων. Ο κίνδυνος δεν είναι μόνο η αιμορραγία: βρώμικο νερό, χώμα, μολυσμένα αντικείμενα, ζωικά απόβλητα και καθυστερημένη φροντίδα αυξάνουν τον κίνδυνο λοίμωξης και την ανάγκη αξιολόγησης για τέτανο.\n\n## Πρώτα έλεγξε επικίνδυνη αιμορραγία\nΗ απειλητική αιμορραγία έχει προτεραιότητα από τον λεπτομερή καθαρισμό. Χρησιμοποίησε άμεση πίεση και τις τεχνικές σοβαρής αιμορραγίας στις οποίες έχεις εκπαιδευτεί. Αφού ελεγχθεί και το τραύμα είναι κατάλληλο για οικιακή πρώτη βοήθεια, πλύνε χέρια και χρησιμοποίησε καθαρό/ασφαλές νερό για ήπια απομάκρυνση ορατής βρωμιάς. Μην ρίχνεις καύσιμα, χλωρίνη, συμπυκνωμένα απολυμαντικά ή καυστικές ουσίες στον ιστό.\n\n## Κάλυψε και παρακολούθησε\nΧρησιμοποίησε καθαρό επίθεμα που προστατεύει χωρίς να κόβει την κυκλοφορία. Άλλαξέ το όταν βραχεί/λερωθεί και έλεγχε το τραύμα. Κατέγραψε ημερομηνία/ώρα και την πηγή μόλυνσης αν έχει σημασία. Ερυθρότητα που επεκτείνεται, θερμότητα, πρήξιμο, πύον, αυξανόμενος πόνος, πυρετός, κόκκινες γραμμές ή γενικευμένη κακουχία απαιτούν ιατρική εκτίμηση.\n\n## Πλημμυρόνερα και βαθιά τραύματα χρειάζονται μεγαλύτερη προσοχή\nΤο CDC προειδοποιεί ότι πλημμυρόνερα μπορεί να περιέχουν λύματα, χημικά, αιχμηρά αντικείμενα και παθογόνα. Τραύμα που εκτέθηκε σε αυτά πρέπει να καθαριστεί και να αξιολογηθεί επαγγελματικά όπου ενδείκνυται. Βαθιά τρυπήματα, συνθλίψεις, δαγκώματα, ξένα σώματα και τραύματα σε αρθρώσεις, μάτια, πρόσωπο ή χέρια μπορεί να χρειάζονται επείγουσα εξειδικευμένη φροντίδα ακόμη και με μικρή αιμορραγία.\n\n## Η κατάσταση τετάνου είναι πληροφορία για τον γιατρό\nΜην θεωρείς ότι μόνο η «σκουριά» καθορίζει τον κίνδυνο. Ανέφερε τύπο/μόλυνση τραύματος και γνωστό ιστορικό εμβολιασμού· ο επαγγελματίας υγείας αποφασίζει αν απαιτείται αναμνηστική δόση ή άλλη αγωγή.\n\n## Πηγές επαλήθευσης\n- CDC Natural Disasters — πόροι επείγουσας φροντίδας τραυμάτων: https://www.cdc.gov/natural-disasters/site.html\n- CDC — ασφάλεια επανεισόδου μετά από πλημμύρα: https://www.cdc.gov/floods/safety/reentering-your-flooded-home-safety.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":171,"en":{"title":"Poison Exposure: Preserve the Label, Stop Exposure, and Get Expert Guidance","body":"During an outage or cleanup, poison exposures may involve cleaners, fuels, pesticides, batteries, medications, carbon monoxide, solvents, plants, or contaminated containers. The wrong household “antidote” can add a second injury, so the offline plan focuses on immediate decontamination and expert contact.\n\n## First priority depends on the exposure route\nIf dangerous fumes are involved, move to fresh air without entering an unsafe atmosphere. For skin exposure, remove contaminated clothing and rinse with plentiful water when appropriate. For eye exposure, begin immediate irrigation. For a swallowed substance, do not induce vomiting or give a homemade neutralizer unless a poison professional/product-specific instruction explicitly tells you to do so.\n\n## Preserve information\nKeep the container, label, product name, concentration if shown, approximate amount involved, route of exposure, time, and the person’s age/weight if known. Photograph the label if the container cannot travel safely. Do not bring a leaking/contaminated container into a vehicle or shelter just to show it to clinicians.\n\n## Call for expert help\nIf the person collapses, has a seizure, has serious breathing difficulty, or cannot be awakened, activate emergency services immediately. Otherwise contact the appropriate local poison-information/emergency medical service as soon as possible. Poison Control guidance emphasizes getting specific expert advice rather than guessing because treatment varies greatly by substance and route.\n\n## Offline preparation\nWrite your country/region poison-information contact on the emergency contact card before an incident. This project should not hard-code a foreign poison number as if it applies everywhere. Keep chemical safety data/labels offline for products stored in bulk at home, workshop, farm, or boat.\n\n## Verification source\n- Poison Control — First Aid for Poisonings: https://www.poison.org/first-aid-for-poisonings\n\nVerification date: 2026-08-09."},"el":{"title":"Έκθεση σε Δηλητηριώδη Ουσία: Διατήρησε την Ετικέτα, Σταμάτησε την Έκθεση και Ζήτησε Εξειδικευμένη Οδηγία","body":"Σε διακοπή ή καθαρισμό μια δηλητηρίαση μπορεί να προέρχεται από καθαριστικά, καύσιμα, φυτοφάρμακα, μπαταρίες, φάρμακα, μονοξείδιο του άνθρακα, διαλύτες, φυτά ή λάθος δοχεία. Ένα αυτοσχέδιο «αντίδοτο» μπορεί να προκαλέσει δεύτερο τραυματισμό, γι’ αυτό το offline σχέδιο επικεντρώνεται στη διακοπή της έκθεσης, την απορρύπανση και την εξειδικευμένη συμβουλή.\n\n## Η πρώτη ενέργεια εξαρτάται από τον τρόπο έκθεσης\nΣε επικίνδυνους ατμούς πήγαινε σε καθαρό αέρα χωρίς να μπεις σε μη ασφαλή ατμόσφαιρα. Σε έκθεση δέρματος αφαίρεσε μολυσμένα ρούχα και ξέπλυνε με άφθονο νερό όπου ενδείκνυται. Σε έκθεση ματιού ξεκίνα αμέσως έκπλυση. Αν καταποθεί ουσία, μην προκαλείς εμετό και μην δίνεις σπιτικό «εξουδετερωτικό» εκτός αν ειδικός δηλητηριάσεων ή συγκεκριμένη επίσημη οδηγία προϊόντος το ζητήσει.\n\n## Διατήρησε τις πληροφορίες\nΚράτησε δοχείο/ετικέτα, όνομα προϊόντος, συγκέντρωση αν αναγράφεται, περίπου ποσότητα, οδό έκθεσης, ώρα και ηλικία/βάρος του ατόμου αν είναι γνωστά. Φωτογράφισε την ετικέτα αν το δοχείο δεν μπορεί να μεταφερθεί με ασφάλεια. Μην βάζεις διαρρέον ή μολυσμένο δοχείο σε όχημα/καταφύγιο μόνο για να το δείξεις σε γιατρό.\n\n## Ζήτησε εξειδικευμένη βοήθεια\nΑν το άτομο καταρρεύσει, κάνει σπασμούς, δυσκολεύεται σοβαρά να αναπνεύσει ή δεν ξυπνά, ενεργοποίησε αμέσως επείγουσα βοήθεια. Διαφορετικά επικοινώνησε γρήγορα με την αρμόδια τοπική υπηρεσία δηλητηριάσεων/επείγουσας ιατρικής. Η Poison Control τονίζει ότι η αντιμετώπιση διαφέρει έντονα ανά ουσία και οδό έκθεσης, άρα δεν πρέπει να γίνεται μαντεψιά.\n\n## Offline προετοιμασία\nΓράψε στην κάρτα επαφών το κέντρο δηλητηριάσεων/αρμόδιο αριθμό της χώρας ή περιοχής σου πριν από το συμβάν. Το project δεν πρέπει να εμφανίζει έναν ξένο αριθμό ως παγκόσμια λύση. Για χημικά που αποθηκεύονται σε ποσότητα σε σπίτι, εργαστήριο, αγρόκτημα ή σκάφος, κράτησε offline ετικέτες/δελτία ασφαλείας.\n\n## Πηγή επαλήθευσης\n- Poison Control — πρώτες βοήθειες σε δηλητηριάσεις: https://www.poison.org/first-aid-for-poisonings\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":172,"en":{"title":"Snakebite: First Response and Dangerous Myths to Avoid","body":"Snakebite is a medical emergency when venomous species are possible. The most useful household response is calm, rapid medical access and prevention of additional tissue injury—not cutting, suction, ice, electric shock, or a tourniquet.\n\n## Move away from the snake\nDo not try to catch, kill, or handle the snake, including a dead or decapitated animal. Move the person and group out of striking range. If it can be done without approaching the animal, remember or photograph general appearance from a safe distance; identification should never delay care.\n\n## Keep the person still and remove constriction\nCall emergency medical services. Encourage the person to remain calm and limit unnecessary movement. Remove rings, watches, tight footwear, or other constricting items from the affected limb before swelling increases, if this can be done without manipulating the bite.\n\n## Do not use destructive folk methods\nCDC/NIOSH guidance specifically warns against tourniquets, cutting the wound, sucking venom, ice, immersion, electric shock, and folk therapies. These can worsen tissue damage or delay effective treatment. Do not wait for dramatic symptoms before seeking care.\n\n## Record progression without causing delay\nNote bite time, location, symptoms, and any change in swelling. If transport is delayed and a professional directs monitoring, mark/record the progression only in a way that does not constrict the limb. Do not give alcohol or use someone else’s medication as a substitute for antivenom/medical care.\n\n## Greece and field planning\nPeople working in scrub, farms, ruins, or remote trails should wear appropriate footwear, use a light at night, avoid placing hands into unseen holes/rock piles, and have an evacuation/communication plan. Keep pets away from snakes too.\n\n## Verification source\n- CDC/NIOSH — Venomous Snakes: https://www.cdc.gov/niosh/outdoor-workers/about/venomous-snakes.html\n\nVerification date: 2026-08-09."},"el":{"title":"Δάγκωμα Φιδιού: Πρώτη Αντίδραση και Επικίνδυνοι Μύθοι που Πρέπει να Αποφεύγονται","body":"Δάγκωμα φιδιού είναι ιατρικό επείγον όταν υπάρχει πιθανότητα δηλητηριώδους είδους. Η πιο χρήσιμη οικιακή αντίδραση είναι η ψυχραιμία, η γρήγορη πρόσβαση σε φροντίδα και η αποφυγή πρόσθετης βλάβης—όχι κόψιμο, αναρρόφηση, πάγος, ηλεκτρικό ρεύμα ή τουρνικέ.\n\n## Απομακρύνσου από το φίδι\nΜην προσπαθείς να το πιάσεις, να το σκοτώσεις ή να το αγγίξεις, ακόμη κι αν φαίνεται νεκρό. Μετέφερε το άτομο και την ομάδα εκτός εμβέλειας. Αν γίνεται χωρίς να πλησιάσεις, θυμήσου ή φωτογράφισε τη γενική εμφάνιση από ασφαλή απόσταση· η αναγνώριση δεν πρέπει να καθυστερεί τη φροντίδα.\n\n## Κράτησε το άτομο ήρεμο και αφαίρεσε στενά αντικείμενα\nΚάλεσε επείγουσα ιατρική βοήθεια. Περιόρισε την περιττή κίνηση. Αφαίρεσε δαχτυλίδια, ρολόγια, στενά παπούτσια ή άλλα αντικείμενα από το προσβεβλημένο άκρο πριν αυξηθεί το πρήξιμο, εφόσον γίνεται χωρίς χειρισμό του τραύματος.\n\n## Μην χρησιμοποιείς καταστροφικές «λαϊκές» τεχνικές\nΗ καθοδήγηση CDC/NIOSH προειδοποιεί ρητά κατά του τουρνικέ, κοψίματος, αναρρόφησης δηλητηρίου, πάγου, βύθισης στο νερό, ηλεκτροσόκ και λαϊκών θεραπειών. Μπορούν να επιδεινώσουν τη βλάβη ή να καθυστερήσουν αποτελεσματική θεραπεία. Μην περιμένεις να εμφανιστούν θεαματικά συμπτώματα πριν ζητήσεις βοήθεια.\n\n## Κατέγραψε την εξέλιξη χωρίς καθυστέρηση\nΣημείωσε ώρα, θέση δαγκώματος, συμπτώματα και αλλαγές στο πρήξιμο. Αν η μεταφορά καθυστερεί και επαγγελματίας ζητήσει παρακολούθηση, κατέγραψε την επέκταση χωρίς περίδεση που πιέζει το άκρο. Μη δίνεις αλκοόλ ή φάρμακο άλλου ανθρώπου αντί για ιατρική αντιμετώπιση.\n\n## Ελλάδα και πεδίο\nΆτομα που κινούνται σε θαμνώδεις περιοχές, αγροτικές εργασίες, ερείπια ή απομονωμένα μονοπάτια χρειάζονται κατάλληλα παπούτσια, φωτισμό τη νύχτα, αποφυγή χεριών σε τρύπες/σωρούς λίθων χωρίς ορατότητα και σχέδιο επικοινωνίας/εκκένωσης. Κράτησε και τα ζώα συντροφιάς μακριά από φίδια.\n\n## Πηγή επαλήθευσης\n- CDC/NIOSH — δηλητηριώδη φίδια: https://www.cdc.gov/niosh/outdoor-workers/about/venomous-snakes.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":173,"en":{"title":"Marine Stings and Coastal First-Response Boundaries","body":"A coastal emergency can combine heat, crowding, poor communications, and marine injury. Jellyfish, venomous fish/spines, sea urchins, or other organisms require different care, so the offline rule is to remove the person from immediate danger, prevent drowning, avoid unsupported universal remedies, and obtain local medical guidance for significant symptoms.\n\n## Water safety comes first\nGet the person to a safe place without creating another drowning victim. A rescuer should not enter dangerous surf, rocks, or current without appropriate skill/equipment. If the person has breathing difficulty, collapse, severe allergic symptoms, or altered consciousness, activate emergency services immediately.\n\n## Do not treat every sting the same\nDifferent marine organisms respond differently to heat, water type, spine removal, or topical treatments. Avoid applying an unverified mixture simply because it is popular online. If tentacles/spines are visible, avoid bare-hand contact and follow species/local medical guidance where known. Do not dig deeply for embedded spines in the field.\n\n## Watch the whole person\nSevere pain, rapidly spreading swelling, chest symptoms, breathing difficulty, vomiting with weakness, fainting, confusion, or extensive exposure needs urgent evaluation. A person with a history of anaphylaxis follows their prescribed emergency plan while emergency care is activated.\n\n## Document the exposure\nRecord beach/location, approximate time, water conditions, visible organism description if known, and any first aid already used. In a mass-sting event, notify lifeguards/authorities so others can be warned rather than repeatedly treating isolated cases.\n\n## Greece-specific preparation\nOn islands or remote beaches, know the nearest lifeguarded area, access point for ambulance/boat, coordinates, and the route back to road access before swimming. Keep footwear for rocky exits and a phone/radio in a dry container.\n\n## Verification anchors\n- Local lifeguard/emergency medical guidance and regional poison information.\n- CDC/NIOSH envenomation principles: avoid destructive first-aid myths and seek prompt care for systemic symptoms.\n\nVerification date: 2026-08-09."},"el":{"title":"Θαλάσσιο Τσίμπημα και Πρώτη Αντίδραση σε Παράκτιο Περιβάλλον","body":"Ένα παράκτιο συμβάν μπορεί να συνδυάζει ζέστη, συνωστισμό, κακή επικοινωνία και τραυματισμό από θαλάσσιο οργανισμό. Μέδουσες, δηλητηριώδη ψάρια/άκανθες, αχινοί και άλλα είδη δεν αντιμετωπίζονται όλα με τον ίδιο τρόπο. Ο offline κανόνας είναι να απομακρυνθεί το άτομο από τον άμεσο κίνδυνο, να αποτραπεί πνιγμός, να μη χρησιμοποιηθούν καθολικές «θεραπείες» χωρίς τεκμηρίωση και να ζητηθεί τοπική ιατρική καθοδήγηση όταν τα συμπτώματα είναι σημαντικά.\n\n## Πρώτα η ασφάλεια στο νερό\nΒγάλε το άτομο σε ασφαλές σημείο χωρίς να δημιουργήσεις δεύτερο θύμα. Διασώστης δεν πρέπει να μπει σε επικίνδυνο κυματισμό, βράχια ή ρεύμα χωρίς κατάλληλη ικανότητα/εξοπλισμό. Δυσκολία αναπνοής, κατάρρευση, σοβαρή αλλεργική αντίδραση ή μεταβολή συνείδησης απαιτούν άμεση ενεργοποίηση επείγουσας βοήθειας.\n\n## Μην αντιμετωπίζεις όλα τα τσιμπήματα σαν να είναι ίδια\nΔιαφορετικοί οργανισμοί χρειάζονται διαφορετική προσέγγιση ως προς θερμότητα, τύπο νερού, αφαίρεση ακίδων ή τοπικά μέσα. Μην βάζεις ένα πρόχειρο μείγμα επειδή είναι δημοφιλές στο διαδίκτυο. Αν υπάρχουν πλοκάμια/αγκάθια, απόφυγε γυμνό χέρι και ακολούθησε ειδική/τοπική καθοδήγηση όταν είναι γνωστό το είδος. Μην σκαλίζεις βαθιά ενσφηνωμένες άκανθες στο πεδίο.\n\n## Παρακολούθησε ολόκληρο το άτομο\nΈντονος πόνος, γρήγορη επέκταση πρηξίματος, θωρακικά συμπτώματα, δύσπνοια, έμετος με αδυναμία, λιποθυμία, σύγχυση ή μεγάλη έκταση έκθεσης χρειάζονται επείγουσα αξιολόγηση. Άτομο με ιστορικό αναφυλαξίας ακολουθεί το προσωπικό συνταγογραφημένο σχέδιο ενώ καλείται βοήθεια.\n\n## Κατέγραψε την έκθεση\nΣημείωσε παραλία/θέση, ώρα, κατάσταση θάλασσας, περιγραφή οργανισμού αν είναι γνωστή και τι πρώτες βοήθειες δόθηκαν. Σε πολλά περιστατικά ενημέρωσε ναυαγοσώστη/αρχές ώστε να προειδοποιηθούν και οι υπόλοιποι.\n\n## Ειδικά για Ελλάδα\nΣε νησί ή απομονωμένη παραλία μάθε πριν το μπάνιο ποιο είναι το κοντινότερο φυλασσόμενο σημείο, η πρόσβαση για ασθενοφόρο/σκάφος, οι συντεταγμένες και η διαδρομή προς δρόμο. Κράτησε παπούτσια για βραχώδη έξοδο και τηλέφωνο/ασύρματο σε στεγανή θήκη.\n\n## Πηγές επαλήθευσης\n- Τοπική ναυαγοσωστική/ιατρική καθοδήγηση και αρμόδια υπηρεσία δηλητηριάσεων.\n- Αρχές CDC/NIOSH για δηλητηριώδη τσιμπήματα: αποφυγή καταστροφικών μύθων και γρήγορη φροντίδα σε συστηματικά συμπτώματα.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":174,"en":{"title":"Heat Work, Acclimatization, and Work-Rest Control","body":"Cleanup and evacuation often begin exactly when heat exposure is highest. People who are normally sedentary may suddenly carry water, move debris, climb stairs, work in protective clothing, or stand in sun for hours. Heat safety therefore needs a work plan, not only a reminder to drink water.\n\n## Reduce the workload before adding endurance\nSchedule heavy tasks for cooler periods, create shade, shorten carries, use carts/teams, and rotate workers. New or returning workers may be less acclimatized than people who have been doing the task regularly; do not use yesterday’s performance as proof that a newcomer can match the same pace.\n\n## Use planned breaks\nBreaks should happen before a person becomes confused or collapses. During high heat/humidity, increase rest frequency, move rest into shade/cooling, and reduce heavy protective clothing where the hazard permits. A buddy should watch for unusual behavior, poor coordination, headache, nausea, weakness, cramps, dizziness, or cessation of effective work.\n\n## Heat stroke is an emergency\nAltered mental status, collapse, seizure, or severe overheating suggests a life-threatening emergency. Activate emergency services and begin rapid cooling using the methods supported by current first-aid/medical guidance while waiting. Do not leave the person alone or assume that drinking water is enough.\n\n## Hydration is not unlimited water\nProvide safe drinking water regularly, but do not force extreme volumes or treat all symptoms as simple dehydration. People with fluid restrictions or significant heart/kidney disease need their clinician’s emergency plan. Long work may also require normal food/electrolyte intake; avoid concentrated homemade mixtures.\n\n## Log exposure\nFor community cleanup, record heat conditions if available, work/rest periods, who has medical limitations, and any symptoms. Stop the operation if multiple people become symptomatic; the work plan itself may be unsafe.\n\n## Verification anchors\n- CDC/NIOSH heat-safety resources.\n- Greek Civil Protection heatwave instructions: https://civilprotection.gov.gr/en/odigies-prostasias\n\nVerification date: 2026-08-09."},"el":{"title":"Εργασία σε Καύσωνα, Εγκλιματισμός και Έλεγχος Εργασίας–Ανάπαυσης","body":"Καθαρισμός και εκκένωση συχνά αρχίζουν όταν η έκθεση στη ζέστη είναι ήδη μεγάλη. Άτομα που συνήθως δεν κάνουν βαριά εργασία μπορεί ξαφνικά να μεταφέρουν νερό, μπάζα, να ανεβαίνουν σκάλες, να φορούν προστατευτικό εξοπλισμό ή να δουλεύουν ώρες στον ήλιο. Η ασφάλεια στη ζέστη χρειάζεται σχέδιο εργασίας και όχι μόνο υπενθύμιση «πιες νερό».\n\n## Μείωσε πρώτα το φορτίο εργασίας\nΒάλε τις βαριές εργασίες σε πιο δροσερές ώρες, δημιούργησε σκιά, κάνε μικρότερες μεταφορές, χρησιμοποίησε καρότσια/ομάδες και εναλλαγές. Άτομα που μόλις ξεκινούν ή επιστρέφουν σε εργασία μπορεί να είναι λιγότερο εγκλιματισμένα από όσους δουλεύουν συστηματικά. Η απόδοση κάποιου άλλου δεν αποδεικνύει ότι ένας νέος εργαζόμενος αντέχει τον ίδιο ρυθμό.\n\n## Προγραμμάτισε διαλείμματα πριν εμφανιστεί πρόβλημα\nΤα διαλείμματα πρέπει να γίνονται πριν υπάρξει σύγχυση ή κατάρρευση. Σε υψηλή θερμοκρασία/υγρασία αύξησε τη συχνότητα, βάλε την ανάπαυση σε σκιά/δροσιά και μείωσε βαριά προστατευτικά ρούχα μόνο όπου το επιτρέπει ο άλλος κίνδυνος. Ο συνεργάτης παρακολουθεί για ασυνήθιστη συμπεριφορά, κακό συντονισμό, πονοκέφαλο, ναυτία, αδυναμία, κράμπες ή ζάλη.\n\n## Η θερμοπληξία είναι επείγον\nΑλλαγή νοητικής κατάστασης, κατάρρευση, σπασμοί ή σοβαρή υπερθέρμανση υποδεικνύουν απειλητικό περιστατικό. Κάλεσε επείγουσα βοήθεια και ξεκίνα γρήγορη ψύξη σύμφωνα με τρέχουσα εκπαίδευση πρώτων βοηθειών/ιατρική καθοδήγηση. Μην αφήνεις το άτομο μόνο και μην θεωρείς ότι ένα ποτήρι νερό αρκεί.\n\n## Η ενυδάτωση δεν σημαίνει απεριόριστο νερό\nΠαρείχε ασφαλές νερό τακτικά, αλλά μην πιέζεις για υπερβολικές ποσότητες και μην αποδίδεις κάθε σύμπτωμα σε απλή αφυδάτωση. Άτομα με περιορισμό υγρών ή σημαντική καρδιακή/νεφρική νόσο χρειάζονται το προσωπικό ιατρικό σχέδιο. Πολύωρη εργασία χρειάζεται και φυσιολογική σίτιση/ηλεκτρολύτες, όχι συμπυκνωμένα αυτοσχέδια μείγματα.\n\n## Κατέγραψε την έκθεση\nΣε κοινοτικό καθαρισμό σημείωσε συνθήκες ζέστης αν είναι διαθέσιμες, κύκλους εργασίας/ανάπαυσης, ιατρικούς περιορισμούς και συμπτώματα. Αν πολλοί παρουσιάζουν πρόβλημα, σταμάτησε· μπορεί να είναι λάθος το ίδιο το σχέδιο εργασίας.\n\n## Πηγές επαλήθευσης\n- CDC/NIOSH — πόροι ασφάλειας σε θερμότητα.\n- Ελληνική Πολιτική Προστασία — οδηγίες καύσωνα: https://civilprotection.gov.gr/en/odigies-prostasias\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":175,"en":{"title":"Cold-Water Immersion: Escape, Rescue, and Hypothermia Boundaries","body":"Cold water can rapidly impair breathing, hand function, swimming ability, and judgment even when the air feels mild. Floods, boating incidents, winter crossings, coastal storms, and accidental falls therefore need a different plan from ordinary cold-weather exposure.\n\n## Prevent entry when possible\nDo not walk or drive into floodwater to save distance. Wear a properly fitted personal flotation device for boating and water work. Keep throw lines/rings accessible on boats and at high-risk work areas. Clothing that is warm on land is not a substitute for flotation.\n\n## Rescue without creating another victim\nUse reach/throw/boat-assisted rescue methods when possible rather than entering hazardous water. Fast current, cold shock, submerged obstacles, and low visibility can overwhelm a strong swimmer. Activate professional rescue early and give precise location/last-seen information.\n\n## After removal from cold water\nHandle the person gently, protect them from wind and further heat loss, remove wet clothing when this can be done safely, dry/insulate, and seek medical evaluation according to symptoms and duration. Altered consciousness, abnormal breathing, severe shivering followed by reduced shivering, inability to walk normally, or collapse require urgent care.\n\n## Do not assume apparent lifelessness means futility\nSevere hypothermia complicates assessment. Follow emergency-dispatch/first-aid guidance for breathing and CPR rather than making an independent decision to stop care. Avoid rough handling and avoid direct high heat that can burn the skin or cause unsafe rewarming.\n\n## Coastal/boat readiness\nStore a dry bag with insulating layers, light, whistle, communication device, and location information. Practice how to call 112 and report coordinates from the phone/navigation system before an incident.\n\n## Verification anchors\n- CDC/NIOSH cold-water safety and rescue training principles.\n- Local coast guard/lifeguard instructions for marine emergencies.\n\nVerification date: 2026-08-09."},"el":{"title":"Βύθιση σε Κρύο Νερό: Διαφυγή, Διάσωση και Όρια Υποθερμίας","body":"Το κρύο νερό μπορεί να επηρεάσει γρήγορα αναπνοή, λειτουργία χεριών, ικανότητα κολύμβησης και κρίση ακόμη κι όταν ο αέρας δεν φαίνεται πολύ κρύος. Πλημμύρες, ατυχήματα με σκάφη, χειμερινές διαβάσεις, παράκτιες καταιγίδες και πτώσεις στο νερό χρειάζονται διαφορετικό σχέδιο από μια απλή έκθεση σε χαμηλή θερμοκρασία.\n\n## Απόφυγε την είσοδο όταν γίνεται\nΜην περπατάς ή οδηγείς μέσα σε πλημμυρόνερα για να κερδίσεις απόσταση. Σε σκάφος ή εργασία κοντά σε νερό χρησιμοποίησε σωστά εφαρμοσμένο σωσίβιο. Κράτησε σχοινί/σωσίβιο ρίψης διαθέσιμο. Ζεστά ρούχα στη στεριά δεν αντικαθιστούν την άνωση.\n\n## Διάσωσε χωρίς να δημιουργήσεις δεύτερο θύμα\nΠροτίμησε διάσωση με προσέγγιση από στεριά, ρίψη πλευστού/σχοινιού ή κατάλληλο σκάφος αντί να μπεις σε επικίνδυνο νερό. Γρήγορο ρεύμα, ψυχρό σοκ, υποβρύχια εμπόδια και χαμηλή ορατότητα μπορούν να υπερνικήσουν ακόμη και καλό κολυμβητή. Κάλεσε επαγγελματική διάσωση νωρίς και δώσε ακριβή θέση/τελευταίο σημείο παρατήρησης.\n\n## Μετά την έξοδο από το κρύο νερό\nΧειρίσου το άτομο απαλά, προστάτεψέ το από άνεμο και νέα απώλεια θερμότητας, αφαίρεσε βρεγμένα ρούχα όταν είναι ασφαλές, στέγνωσε και μόνωσε. Αλλαγή συνείδησης, μη φυσιολογική αναπνοή, σοβαρό ρίγος που αργότερα μειώνεται, αδυναμία φυσιολογικής βάδισης ή κατάρρευση απαιτούν επείγουσα φροντίδα.\n\n## Μην θεωρείς ότι φαινομενική ακινησία σημαίνει ότι δεν υπάρχει ελπίδα\nΗ σοβαρή υποθερμία περιπλέκει την εκτίμηση. Ακολούθησε οδηγίες επείγουσας βοήθειας/πρώτων βοηθειών για αναπνοή και ΚΑΡΠΑ αντί να αποφασίσεις μόνος σου διακοπή φροντίδας. Απόφυγε βίαιο χειρισμό και άμεση πολύ υψηλή θερμότητα που μπορεί να προκαλέσει εγκαύματα ή ακατάλληλη επαναθέρμανση.\n\n## Ετοιμότητα σε ακτή/σκάφος\nΚράτησε στεγανό σάκο με μονωτικές στρώσεις, φως, σφυρίχτρα, συσκευή επικοινωνίας και στοιχεία θέσης. Εξασκήσου πριν το συμβάν στο πώς καλείς 112 και πώς αναφέρεις συντεταγμένες από τη συσκευή πλοήγησης.\n\n## Πηγές επαλήθευσης\n- Αρχές CDC/NIOSH για ασφάλεια κρύου νερού και διάσωση.\n- Οδηγίες λιμενικού/ναυαγοσωστών για θαλάσσια επείγοντα.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":176,"en":{"title":"Drowning Rescue: Reach, Throw, and Avoid the Second Victim","body":"A person in distress in water can unintentionally pull an untrained rescuer under. Floodwater adds current, hidden drains, contamination, electricity, and debris. The first rule is therefore scene safety and a rescue method that does not turn one victim into two.\n\n## Raise the alarm early\nCall emergency services/lifeguards as soon as a person is in serious difficulty. Give a fixed landmark, coordinates if available, current direction, clothing, flotation status, and the last point where the person was seen. Assign one person to keep visual contact rather than having everyone run for equipment.\n\n## Prefer rescue from outside the water\nUse a pole, branch, paddle, rope, throw bag, life ring, flotation device, or boat when these can be used safely. Keep your own body low/anchored when reaching from an edge so the person cannot easily pull you in. Do not enter fast floodwater, surf, cold water, or an unknown depth unless you are trained/equipped for that rescue environment.\n\n## After removal\nCheck responsiveness and breathing. If the person is not breathing normally, begin CPR and use an AED according to training/dispatch guidance. If they are breathing but impaired, protect the airway, keep them warm, and obtain medical evaluation. Drowning complications can persist after apparent initial recovery.\n\n## Floodwater is not a swimming pool\nDo not assume a street is safe because the water looks shallow. Open manholes, storm drains, current around vehicles, contaminated water, and energized utilities can make entry lethal. Professional flood rescue may require ropes, boats, flotation and protective equipment unavailable to a household.\n\n## Prepare the rescue environment\nAt boats, pools, wells, cisterns, docks, or flood-prone properties, pre-position throw/reach equipment and teach household members how to use it. Prevention and non-entry rescue are more reliable than relying on a strong swimmer.\n\n## Verification anchor\n- CDC/NIOSH cold-water rescue training: Reach/Throw/Row rather than unprotected entry.\n\nVerification date: 2026-08-09."},"el":{"title":"Διάσωση από Πνιγμό: Προσέγγιση, Ρίψη Βοηθήματος και Αποφυγή Δεύτερου Θύματος","body":"Άτομο που παλεύει στο νερό μπορεί ασυναίσθητα να τραβήξει έναν μη εκπαιδευμένο διασώστη κάτω από την επιφάνεια. Σε πλημμύρα προστίθενται ρεύμα, κρυμμένα φρεάτια, μόλυνση, ηλεκτρισμός και μπάζα. Ο πρώτος κανόνας είναι ασφάλεια σκηνής και μέθοδος διάσωσης που δεν δημιουργεί δεύτερο θύμα.\n\n## Σήμανε συναγερμό νωρίς\nΚάλεσε υπηρεσίες έκτακτης ανάγκης/ναυαγοσώστη μόλις το άτομο βρίσκεται σε σοβαρή δυσκολία. Δώσε σταθερό σημείο αναφοράς, συντεταγμένες αν υπάρχουν, κατεύθυνση ρεύματος, ρούχα, αν έχει σωσίβιο και τελευταίο σημείο που φάνηκε. Ανάθεσε σε ένα άτομο να κρατά συνεχή οπτική επαφή αντί να τρέχουν όλοι για εξοπλισμό.\n\n## Προτίμησε διάσωση χωρίς είσοδο στο νερό\nΧρησιμοποίησε κοντάρι, κλαδί, κουπί, σχοινί, σάκο ρίψης, σωσίβιο ή άλλο πλευστό μέσο όταν γίνεται με ασφάλεια. Αν απλώνεσαι από άκρη, κράτησε το σώμα χαμηλά/στηριγμένο ώστε να μην σε τραβήξει μέσα. Μην μπαίνεις σε γρήγορο πλημμυρικό ρεύμα, κύμα, πολύ κρύο νερό ή άγνωστο βάθος χωρίς κατάλληλη εκπαίδευση και εξοπλισμό.\n\n## Μετά την έξοδο\nΈλεγξε ανταπόκριση και αναπνοή. Αν δεν αναπνέει φυσιολογικά, ξεκίνα ΚΑΡΠΑ και AED σύμφωνα με εκπαίδευση/οδηγίες τηλεφωνικού κέντρου. Αν αναπνέει αλλά δεν είναι καλά, προστάτευσε αεραγωγό, κράτησέ τον ζεστό και ζήτησε ιατρική αξιολόγηση. Επιπλοκές από πνιγμό μπορεί να εμφανιστούν παρότι αρχικά φαίνεται να έχει συνέλθει.\n\n## Το πλημμυρόνερο δεν είναι πισίνα\nΜην θεωρείς ασφαλή έναν δρόμο επειδή το νερό φαίνεται ρηχό. Ανοιχτά φρεάτια, ισχυρό ρεύμα γύρω από οχήματα, λύματα και ηλεκτρικές εγκαταστάσεις μπορούν να κάνουν την είσοδο θανατηφόρα. Επαγγελματική διάσωση πλημμύρας μπορεί να απαιτεί σχοινιά, σκάφος, σωσίβια και προστατευτικό εξοπλισμό που δεν διαθέτει ένα σπίτι.\n\n## Προετοίμασε το περιβάλλον πριν συμβεί κάτι\nΣε σκάφη, πισίνες, πηγάδια, δεξαμενές, προβλήτες ή περιοχές που πλημμυρίζουν, τοποθέτησε εκ των προτέρων εξοπλισμό προσέγγισης/ρίψης και δίδαξε πώς χρησιμοποιείται. Η πρόληψη και η διάσωση χωρίς είσοδο είναι πιο αξιόπιστες από το να βασίζεσαι σε έναν δυνατό κολυμβητή.\n\n## Πηγή επαλήθευσης\n- Εκπαιδευτικές αρχές CDC/NIOSH για διάσωση από κρύο νερό: προσέγγιση/ρίψη/σκάφος αντί για απροστάτευτη είσοδο.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":177,"en":{"title":"LPG Cylinders and Portable Gas Cooking During Outages","body":"Liquefied petroleum gas can keep cooking available during a power outage, but leaks, poor ventilation, damaged regulators/hoses, and improvised indoor use can create fire, explosion, or carbon-monoxide hazards. The fuel reserve is only useful if the appliance is operated exactly within its approved environment.\n\n## Use equipment only where it is designed to operate\nFollow the manufacturer’s location and ventilation instructions. Outdoor-only burners, grills, and camping appliances remain outdoor-only during a blackout. Do not move them into a kitchen, corridor, tent, car, garage, or enclosed balcony because of rain or cold. Never use a gas oven or range as a room heater.\n\n## Treat odor/leak suspicion as a stop condition\nIf gas odor or a suspected leak occurs, avoid flames, smoking, and electrical switching that could create a spark. Move people away and follow supplier/fire-service instructions. Do not test a suspected leak with a flame. Damaged cylinders, valves, hoses, or regulators should be isolated from use and assessed/replaced through the appropriate supplier/professional route.\n\n## Store cylinders deliberately\nKeep cylinders upright and protected from physical damage, heat, ignition sources, and unauthorized access according to local rules and supplier instructions. Do not store a large improvised fuel cache in sleeping areas. Label which cylinder is full/in service/empty so an emergency changeover does not involve guesswork.\n\n## Cooking-zone discipline\nKeep combustibles, curtains, paper, fuel containers, and evacuation bags away from the flame. Never leave cooking unattended. Keep children/pets out of the work zone and maintain a clear exit path. A working smoke/CO alarm appropriate to the space adds warning but does not make unsafe indoor combustion acceptable.\n\n## Verification anchors\n- CDC carbon-monoxide prevention guidance.\n- Local fire service, LPG supplier, appliance manufacturer, and Greek fire/building rules.\n\nVerification date: 2026-08-09."},"el":{"title":"Φιάλες Υγραερίου και Φορητό Μαγείρεμα σε Διακοπή Ρεύματος","body":"Το υγραέριο μπορεί να διατηρήσει δυνατότητα μαγειρέματος σε διακοπή ρεύματος, αλλά διαρροές, ανεπαρκής αερισμός, κατεστραμμένοι ρυθμιστές/σωλήνες και αυτοσχέδια χρήση σε κλειστό χώρο μπορούν να προκαλέσουν φωτιά, έκρηξη ή μονοξείδιο του άνθρακα. Το καύσιμο είναι χρήσιμο μόνο όταν η συσκευή λειτουργεί στο περιβάλλον για το οποίο έχει εγκριθεί.\n\n## Χρησιμοποίησε τη συσκευή μόνο εκεί που προβλέπει ο κατασκευαστής\nΑκολούθησε τις οδηγίες θέσης και αερισμού. Καυστήρες, ψησταριές και συσκευές κατασκήνωσης που είναι μόνο για εξωτερικό χώρο παραμένουν εξωτερικού χώρου και στη διακοπή. Μην τα μεταφέρεις σε κουζίνα, διάδρομο, σκηνή, αυτοκίνητο, γκαράζ ή κλειστό μπαλκόνι επειδή βρέχει ή κάνει κρύο. Μην χρησιμοποιείς φούρνο/κουζίνα αερίου για θέρμανση δωματίου.\n\n## Οσμή ή υποψία διαρροής σημαίνει διακοπή\nΑν μυρίζει αέριο ή υπάρχει υποψία διαρροής, απόφυγε φλόγα, κάπνισμα και ηλεκτρικό διακόπτη που μπορεί να δημιουργήσει σπινθήρα. Απομάκρυνε ανθρώπους και ακολούθησε οδηγίες προμηθευτή/πυροσβεστικής. Μην ελέγχεις διαρροή με φλόγα. Κατεστραμμένες φιάλες, βαλβίδες, σωλήνες ή ρυθμιστές πρέπει να βγαίνουν από χρήση και να αξιολογούνται/αντικαθίστανται από αρμόδιο τεχνικό ή προμηθευτή.\n\n## Αποθήκευσε φιάλες με συγκεκριμένο τρόπο\nΚράτησέ τες όρθιες και προστατευμένες από χτυπήματα, θερμότητα, πηγές ανάφλεξης και μη εξουσιοδοτημένη πρόσβαση σύμφωνα με τοπικούς κανόνες/προμηθευτή. Μην δημιουργείς μεγάλη αυτοσχέδια αποθήκη σε χώρο ύπνου. Σήμανε ποια είναι γεμάτη, σε χρήση ή κενή ώστε η αλλαγή σε έκτακτη ανάγκη να μην γίνεται με μαντεψιά.\n\n## Πειθαρχία ζώνης μαγειρέματος\nΚράτησε κουρτίνες, χαρτί, καύσιμα, σακίδια εκκένωσης και άλλα εύφλεκτα μακριά από τη φλόγα. Μην αφήνεις μαγείρεμα χωρίς επίβλεψη. Κράτησε παιδιά/ζώα εκτός ζώνης και διατήρησε ελεύθερη έξοδο. Λειτουργικός ανιχνευτής καπνού/CO βοηθά στην προειδοποίηση αλλά δεν κάνει ασφαλή μια συσκευή καύσης που δεν επιτρέπεται μέσα.\n\n## Πηγές επαλήθευσης\n- CDC — πρόληψη μονοξειδίου του άνθρακα.\n- Τοπική πυροσβεστική, προμηθευτής υγραερίου, κατασκευαστής συσκευής και ισχύοντες ελληνικοί κανόνες.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":178,"en":{"title":"Kitchen Oil and Grease Fire: Smother, Isolate, and Escape First","body":"Cooking fires remain a major household hazard, and outage cooking can increase risk because people use unfamiliar burners, poor lighting, extension cords, crowded counters, or alternative fuels. A pan of burning oil is especially dangerous if water is thrown onto it.\n\n## Stay with active cooking\nKeep the cooking area clear of paper, towels, curtains, plastic packaging, fuel, and evacuation bags. Turn pot handles inward without placing them over another burner. In low light, use stable electric lighting rather than carrying an open flame near hot oil.\n\n## If a pan ignites\nIf it is safe and you can do so without reaching through flames, turn off the heat. Cover the pan with a suitable metal lid or baking sheet to smother the fire and leave it covered until completely cool. Do not carry the burning pan through the home and never throw water on burning cooking oil/grease; violent splattering can spread flame and cause severe burns.\n\n## Oven or appliance fire\nKeep the door closed when opening it would feed/spread fire, shut off the appliance if safe, and follow fire-service guidance. If fire escapes the container/appliance, smoke is building, you lack a safe exit behind you, or you are uncertain, evacuate and call the fire service rather than trying repeated household extinguishing attempts.\n\n## Extinguisher limits\nA suitable extinguisher can be useful only for a small fire, with a clear exit, and for a person who is trained/comfortable using it. Escape is the priority. Do not let possession of an extinguisher trap someone between the fire and the door.\n\n## Verification anchors\n- U.S. Fire Administration — cooking fire prevention and extinguishing principles: https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/cooking/\n- Local fire service instructions.\n\nVerification date: 2026-08-09."},"el":{"title":"Φωτιά από Λάδι ή Λίπος στην Κουζίνα: Σβήσιμο με Κάλυψη και Προτεραιότητα στην Έξοδο","body":"Οι φωτιές μαγειρέματος είναι σημαντικός οικιακός κίνδυνος και στη διακοπή ρεύματος αυξάνεται η πιθανότητα επειδή χρησιμοποιούνται άγνωστοι καυστήρες, κακός φωτισμός, καλώδια, γεμάτοι
