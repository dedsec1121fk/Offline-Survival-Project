πνόσακος συμπιέζεται. Χρησιμοποίησε στεγνό μονωτικό υπόστρωμα/φράγμα. Στέγνωσε και αέρισε τη μόνωση όταν οι συνθήκες το επιτρέπουν και κράτα εφεδρικά στεγνά στρώματα μακριά από τη ζώνη συμπύκνωσης.\n\n## Παρακολούθησε ανθρώπους, όχι μόνο θερμοκρασία\nΈλεγχε για ρίγος, σύγχυση, αδεξιότητα, ασυνήθιστη υπνηλία και βρεγμένα ρούχα. Άλλαζε βρεγμένα στρώματα νωρίς. Μην περιμένεις να «κρυώσουν αρκετά» όλοι πριν προσθέσεις μόνωση ή μετακινηθείς σε ασφαλέστερο θερμαινόμενο χώρο.\n\n## Πηγές αναφοράς\n- CDC — κρύο και υποθερμία: https://www.cdc.gov/winter-weather/about/index.html\n- Ready.gov — χειμερινός καιρός: https://www.ready.gov/winter-weather\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":198,"en":{"title":"Snow and Ice: Roof Load, Access, and Heating Boundaries","body":"Heavy snow and ice can damage roofs, awnings, solar arrays and temporary shelters while simultaneously making ladder work and travel more dangerous. The survival objective is not to clear every surface; it is to identify unsafe loading and protect people without creating a fall or collapse casualty.\n\n## Watch for structural warning signs\nNew sagging, unusual cracking/popping sounds, doors suddenly binding, ceiling deformation, leaks or visible movement can indicate distress. Leave an unsafe area and seek professional/emergency guidance rather than sending someone onto the roof. A roof already stressed by snow is not a safe work platform simply because it normally supports people.\n\n## Work from safer positions\nWhen local guidance recommends snow removal, use ground-based tools where practical and avoid damaging roofing or overhead electrical equipment. Keep people out of the fall zone. Do not use ladders on ice or improvise roof access during high wind. Consider where falling snow/ice will land before pulling it down.\n\n## Avoid dangerous thawing\nDo not use open flames or improvised high-heat devices to melt roof/pipe ice. Fuel-burning heaters must be used only in the location and ventilation conditions for which they are designed. Carbon-monoxide risk increases when people close buildings tightly during cold outages.\n\n## Solar/utility awareness\nSnow-covered photovoltaic panels and conductors can still present electrical hazards. Treat damaged service lines and downed conductors as energized and keep clear.\n\n## Source anchors\n- Ready.gov — winter weather: https://www.ready.gov/winter-weather\n- OSHA — winter weather safety resources: https://www.osha.gov/winter-weather\n\nVerification date: 2026-08-09."},"el":{"title":"Χιόνι και πάγος: φορτίο στέγης, πρόσβαση και όρια θέρμανσης","body":"Βαρύ χιόνι και πάγος μπορούν να καταπονήσουν στέγες, τέντες, φωτοβολταϊκά και προσωρινά καταφύγια ενώ ταυτόχρονα κάνουν σκάλες και μετακινήσεις πιο επικίνδυνες. Στόχος δεν είναι να καθαριστεί κάθε επιφάνεια, αλλά να αναγνωριστεί η επικίνδυνη φόρτιση χωρίς να προκληθεί πτώση ή κατάρρευση πάνω σε άνθρωπο.\n\n## Σημάδια δομικής καταπόνησης\nΝέα καθίζηση, ασυνήθιστοι ήχοι ρωγμών/κρότων, πόρτες που ξαφνικά σφηνώνουν, παραμόρφωση οροφής, διαρροές ή ορατή κίνηση μπορεί να δείχνουν πρόβλημα. Εγκατέλειψε μη ασφαλή ζώνη και ζήτησε ειδική ή επείγουσα καθοδήγηση αντί να στείλεις κάποιον στη στέγη. Μια στέγη φορτισμένη με χιόνι δεν είναι ασφαλής πλατφόρμα απλώς επειδή κανονικά αντέχει ανθρώπους.\n\n## Εργασία από ασφαλέστερες θέσεις\nΌταν οι τοπικές οδηγίες συνιστούν απομάκρυνση χιονιού, προτίμησε εργαλεία από το έδαφος όπου είναι πρακτικό και μην χτυπάς στέγη ή εναέρια ηλεκτρικά στοιχεία. Κράτα άτομα έξω από τη ζώνη πτώσης. Μην χρησιμοποιείς σκάλα πάνω σε πάγο και μην επιχειρείς πρόσβαση σε ισχυρό άνεμο. Σκέψου πού θα πέσει το χιόνι ή ο πάγος πριν το τραβήξεις.\n\n## Μην ξεπαγώνεις επικίνδυνα\nΜην χρησιμοποιείς ανοιχτή φλόγα ή πρόχειρη έντονη θερμότητα σε στέγη ή παγωμένες σωληνώσεις. Συσκευές καύσης χρησιμοποιούνται μόνο στον χώρο και στον αερισμό που προβλέπει ο κατασκευαστής. Ο κίνδυνος μονοξειδίου αυξάνεται όταν οι άνθρωποι κλείνουν ερμητικά το σπίτι σε διακοπή ρεύματος.\n\n## Φωτοβολταϊκά και δίκτυο\nΧιονισμένα φωτοβολταϊκά και αγωγοί μπορούν ακόμη να έχουν ηλεκτρικό κίνδυνο. Αντιμετώπισε κατεστραμμένες παροχές ή πεσμένους αγωγούς ως ενεργούς και μείνε μακριά.\n\n## Πηγές αναφοράς\n- Ready.gov — χειμερινός καιρός: https://www.ready.gov/winter-weather\n- OSHA — ασφάλεια χειμερινού καιρού: https://www.osha.gov/winter-weather\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":199,"en":{"title":"Evacuation Bag: Fit, Weight, and a Real Walking Test","body":"A go-bag is useful only if the intended person can actually carry it through the likely route. Lists tend to grow; shoulders, stairs, heat, children, mobility aids and evacuation speed impose real limits.\n\n## Build by function, then weigh\nGroup contents by water, food, medical, communications, documents, clothing/shelter, lighting and hygiene. Remove unnecessary duplicates. Weigh the packed bag rather than estimating. Record what is externally attached because swinging bottles/tools can change balance and snag on doors or vegetation.\n\n## Fit the user\nAdjust shoulder straps and hip belt if the pack has one. Heavy dense items should not pull the user backward or sit where they create painful pressure. A child, older adult or person with mobility/respiratory limitations may need a deliberately lighter role and more supplies distributed to another carrier or vehicle.\n\n## Test the real route\nWalk with the actual bag on a safe day: stairs, the first part of the evacuation route and the expected pace. Note hot spots, handrail conflicts, whether the bag interferes with a cane/walker, and whether the user can still carry a child or control an animal if that is part of the plan. Repack after the test.\n\n## Protect access priority\nEmergency medication, identification, phone/power, water and a light should not be buried under rarely used items. Use consistent pockets so another household member can retrieve critical gear. Waterproof essential documents/electronics inside the pack rather than assuming the outer fabric is waterproof.\n\n## Trigger for splitting the load\nIf one bag becomes too heavy, create modular grab units: personal bag, medical module, document pouch, animal kit, vehicle-only module. A bag left behind because nobody can carry it has zero survival value.\n\n## Source anchors\n- Ready.gov — emergency kit: https://www.ready.gov/kit\n- Greek Civil Protection — self-protection instructions: https://civilprotection.gov.gr/odigies-prostasias\n\nVerification date: 2026-08-09."},"el":{"title":"Σακίδιο εκκένωσης: εφαρμογή, βάρος και πραγματική δοκιμή βάδισης","body":"Ένα σακίδιο εκκένωσης είναι χρήσιμο μόνο αν ο συγκεκριμένος άνθρωπος μπορεί πράγματι να το μεταφέρει στη πιθανή διαδρομή. Οι λίστες μεγαλώνουν εύκολα· ώμοι, σκάλες, ζέστη, παιδιά, βοηθήματα κινητικότητας και απαιτούμενη ταχύτητα θέτουν πραγματικά όρια.\n\n## Οργάνωση ανά λειτουργία και πραγματικό ζύγισμα\nΧώρισε τα περιεχόμενα σε νερό, τρόφιμα, ιατρικά, επικοινωνίες, έγγραφα, ρούχα/καταφύγιο, φωτισμό και υγιεινή. Αφαίρεσε περιττές διπλές συσκευασίες. Ζύγισε το ολοκληρωμένο σακίδιο. Κατέγραψε εξωτερικά αντικείμενα, επειδή μπουκάλια ή εργαλεία που κρέμονται αλλάζουν ισορροπία και πιάνονται σε πόρτες ή βλάστηση.\n\n## Προσαρμογή στον χρήστη\nΡύθμισε ιμάντες ώμων και ζώνη μέσης όταν υπάρχει. Πυκνά βαριά αντικείμενα δεν πρέπει να τραβούν το σώμα πίσω ή να δημιουργούν επώδυνη πίεση. Παιδί, ηλικιωμένος ή άτομο με κινητικό/αναπνευστικό περιορισμό μπορεί να χρειάζεται σκόπιμα ελαφρύτερο φορτίο και μεταφορά περισσότερων προμηθειών από άλλο άτομο ή όχημα.\n\n## Δοκίμασε την πραγματική διαδρομή\nΠερπάτησε με το ακριβές σακίδιο σε ασφαλή ημέρα: σκάλες, αρχικό τμήμα διαδρομής και αναμενόμενο ρυθμό. Σημείωσε σημεία τριβής, σύγκρουση με χειρολαβές, αν εμποδίζει μπαστούνι/περπατούρα και αν ο χρήστης μπορεί ταυτόχρονα να κρατήσει παιδί ή ζώο όταν αυτό απαιτείται. Μετά τη δοκιμή ξαναμοίρασε το φορτίο.\n\n## Κρίσιμα αντικείμενα προσβάσιμα\nΕπείγοντα φάρμακα, ταυτότητα, τηλέφωνο/ενέργεια, νερό και φακός δεν πρέπει να είναι θαμμένα κάτω από σπάνια αντικείμενα. Χρησιμοποίησε σταθερές θέσεις ώστε άλλο μέλος να βρίσκει κρίσιμο εξοπλισμό. Προστάτευσε έγγραφα και ηλεκτρονικά εσωτερικά από νερό αντί να θεωρείς το εξωτερικό ύφασμα αδιάβροχο.\n\n## Πότε σπας το φορτίο σε μονάδες\nΑν ένα σακίδιο γίνει πολύ βαρύ, δημιούργησε ανεξάρτητα πακέτα: προσωπικό, ιατρικό, φάκελο εγγράφων, κιτ ζώου, εξοπλισμό μόνο οχήματος. Σακίδιο που μένει πίσω επειδή κανείς δεν μπορεί να το μεταφέρει έχει μηδενική αξία.\n\n## Πηγές αναφοράς\n- Ready.gov — κιτ έκτακτης ανάγκης: https://www.ready.gov/kit\n- Ελληνική Πολιτική Προστασία — οδηγίες αυτοπροστασίας: https://civilprotection.gov.gr/odigies-prostasias\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":200,"en":{"title":"Offline Compass, Bearing, Declination, and Route-Card Fundamentals","body":"A phone can provide coordinates and a compass, but a resilient navigation plan also works when the battery is low, the screen is broken or the downloaded map cannot load. Carry a physical compass and paper map when route failure would have serious consequences, and practice before the emergency.\n\n## Understand the reference\nA magnetic compass points toward magnetic north, while many maps are referenced to true or grid north. The difference varies by location and changes over time. Use the current declination information for the map/location and the method appropriate to your compass/map system; do not reuse an old adjustment from a different country.\n\n## Use bearings as one layer, not blind steering\nA bearing gives direction, not proof that the route is safe. Confirm terrain, roads, rivers, private/restricted land, wildfire/flood zones and daylight. Identify intermediate checkpoints so a small directional error does not grow over many kilometers.\n\n## Build a paper route card\nFor each route write: start point, destination, major checkpoints, approximate distances, decision points, hazards, alternates, turnaround criteria, water points only if verified, and the person who knows the plan. Include coordinates in a consistent format and state the coordinate format/datum if relevant.\n\n## Cross-check the phone\nWhen the phone works, compare its compass to a known direction and move away from vehicles, speakers, magnets, steel structures and power equipment that can distort magnetic readings. Treat sudden heading jumps as a reason to verify, not as a reason to follow the screen faster.\n\n## Lost procedure\nStop uncontrolled movement. Reconstruct the last known point, time and direction. Use map/terrain features and communicate location if possible. Do not turn a small navigation uncertainty into a major search area by continuing to walk without a plan.\n\n## Source anchors\n- U.S. Geological Survey — map/navigation resources: https://www.usgs.gov/programs/national-geospatial-program\n- NOAA/NCEI — geomagnetic/declination resources: https://www.ncei.noaa.gov/products/geomagnetic-models\n\nVerification date: 2026-08-09."},"el":{"title":"Πυξίδα εκτός δικτύου, διόπτευση, μαγνητική απόκλιση και κάρτα διαδρομής","body":"Ένα τηλέφωνο μπορεί να δώσει συντεταγμένες και πυξίδα, αλλά ανθεκτικό σχέδιο πλοήγησης λειτουργεί και όταν η μπαταρία είναι χαμηλή, η οθόνη έχει σπάσει ή ο αποθηκευμένος χάρτης δεν ανοίγει. Όταν η αποτυχία διαδρομής έχει σοβαρές συνέπειες, κράτα φυσική πυξίδα και χάρτη και εξασκήσου πριν από την κρίση.\n\n## Κατανόησε την αναφορά βορρά\nΗ μαγνητική πυξίδα δείχνει προς μαγνητικό βορρά, ενώ πολλοί χάρτες αναφέρονται σε αληθή ή κάνναβο βορρά. Η διαφορά αλλάζει ανά τοποθεσία και με τον χρόνο. Χρησιμοποίησε σύγχρονη τιμή μαγνητικής απόκλισης για τον συγκεκριμένο τόπο και την κατάλληλη μέθοδο για πυξίδα/χάρτη· μην αντιγράφεις παλιά ρύθμιση από άλλη χώρα.\n\n## Η διόπτευση είναι ένα επίπεδο πληροφορίας\nΜια διόπτευση δίνει κατεύθυνση αλλά δεν αποδεικνύει ότι η πορεία είναι ασφαλής. Έλεγξε έδαφος, δρόμους, ποτάμια, ιδιωτικές ή απαγορευμένες ζώνες, πυρκαγιά/πλημμύρα και διαθέσιμο φως. Όρισε ενδιάμεσα σημεία ελέγχου ώστε ένα μικρό σφάλμα να μην μεγαλώσει σε πολλά χιλιόμετρα.\n\n## Χάρτινη κάρτα διαδρομής\nΓια κάθε διαδρομή γράψε: αφετηρία, προορισμό, βασικά σημεία ελέγχου, περίπου αποστάσεις, σημεία απόφασης, κινδύνους, εναλλακτικές, κριτήρια επιστροφής, σημεία νερού μόνο αν είναι επαληθευμένα και ποιος γνωρίζει το σχέδιο. Κατέγραψε συντεταγμένες σε σταθερή μορφή και δήλωσε σύστημα/μορφή όπου χρειάζεται.\n\n## Διασταύρωσε το τηλέφωνο\nΌταν το τηλέφωνο λειτουργεί, σύγκρινε την ένδειξη πυξίδας με γνωστή κατεύθυνση και απομακρύνσου από οχήματα, ηχεία, μαγνήτες, μεταλλικές κατασκευές και ισχυρό ηλεκτρικό εξοπλισμό που μπορούν να παραμορφώσουν την ένδειξη. Απότομη αλλαγή κατεύθυνσης είναι λόγος επαλήθευσης, όχι λόγος να ακολουθήσεις πιο γρήγορα την οθόνη.\n\n## Αν χαθείς\nΣταμάτησε την ανεξέλεγκτη κίνηση. Ανακατασκεύασε τελευταίο γνωστό σημείο, ώρα και κατεύθυνση. Χρησιμοποίησε χάρτη/χαρακτηριστικά εδάφους και επικοινώνησε τη θέση αν μπορείς. Μην μετατρέπεις μικρή αβεβαιότητα σε τεράστια περιοχή αναζήτησης συνεχίζοντας χωρίς σχέδιο.\n\n## Πηγές αναφοράς\n- U.S. Geological Survey — πόροι χαρτών και γεωχωρικών δεδομένων: https://www.usgs.gov/programs/national-geospatial-program\n- NOAA/NCEI — γεωμαγνητικά μοντέλα και μαγνητική απόκλιση: https://www.ncei.noaa.gov/products/geomagnetic-models\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":201,"en":{"title":"Tornado Shelter Location and Post-Impact Exit","body":"Tornado survival depends heavily on reaching the best available shelter before the wind arrives. Decide the location in normal time; do not wait for a warning to debate which room is safest.\n\n## Choose the best available shelter\nA purpose-built safe room or storm shelter designed to recognized standards is preferred where available. Otherwise use a small interior room on the lowest level of a sturdy building, away from windows and exterior walls. In a high-rise, identify an interior room or protected corridor on the lowest level you can safely reach before conditions deteriorate. Mobile/manufactured homes require an external sturdy shelter plan rather than treating the home as adequate tornado protection.\n\n## Protect from debris\nUse sturdy shoes and keep helmets or other head protection accessible if your household plan includes them. Get beneath sturdy protection where appropriate and cover head/neck. Do not spend warning time opening windows. Keep a flashlight and whistle in the shelter because power and exits may fail after impact.\n\n## After the wind\nDo not rush outside into downed lines, broken glass, leaking gas or unstable walls. Check people first, use the safest known exit, and avoid entering visibly damaged sections. Send a short status/location message when communications work. Expect secondary hazards and additional storms.\n\n## Verification sources\n- Ready.gov — tornadoes: https://www.ready.gov/tornadoes\n- FEMA — safe rooms: https://www.fema.gov/emergency-managers/risk-management/building-science/safe-rooms\n\nVerification date: 2026-08-09."},"el":{"title":"Ανεμοστρόβιλος: θέση καταφυγίου και ασφαλής έξοδος μετά το πλήγμα","body":"Η επιβίωση από ανεμοστρόβιλο εξαρτάται σε μεγάλο βαθμό από το αν θα φτάσεις στο καλύτερο διαθέσιμο καταφύγιο πριν φτάσει ο ισχυρός άνεμος. Η θέση αποφασίζεται σε κανονικές συνθήκες· μην περιμένεις την προειδοποίηση για να συζητήσεις ποιο δωμάτιο είναι ασφαλέστερο.\n\n## Καλύτερο διαθέσιμο καταφύγιο\nΕιδικό ασφαλές δωμάτιο ή καταφύγιο καταιγίδας σχεδιασμένο σύμφωνα με αναγνωρισμένα πρότυπα είναι προτιμότερο όπου υπάρχει. Διαφορετικά, προτίμησε μικρό εσωτερικό χώρο στο χαμηλότερο επίπεδο ανθεκτικού κτιρίου, μακριά από παράθυρα και εξωτερικούς τοίχους. Σε πολυώροφο κτίριο, προετοίμασε εσωτερικό δωμάτιο ή προστατευμένο διάδρομο στο χαμηλότερο επίπεδο που μπορείς να φτάσεις εγκαίρως. Τα τροχόσπιτα/προκατασκευασμένες κατοικίες χρειάζονται σχέδιο μετάβασης σε ανθεκτικό καταφύγιο και δεν θεωρούνται επαρκής προστασία.\n\n## Προστασία από συντρίμμια\nΚράτα ανθεκτικά παπούτσια και, αν περιλαμβάνεται στο σχέδιο, προστασία κεφαλής εύκολα προσβάσιμη. Μπες κάτω από ανθεκτική προστασία όπου ενδείκνυται και κάλυψε κεφάλι/αυχένα. Μην σπαταλάς τον χρόνο της προειδοποίησης ανοίγοντας παράθυρα. Φακός και σφυρίχτρα μέσα στο καταφύγιο βοηθούν αν κοπεί το ρεύμα ή μπλοκάρει η έξοδος.\n\n## Μετά το πέρασμα\nΜην βγεις βιαστικά ανάμεσα σε πεσμένα καλώδια, γυαλιά, διαρροή αερίου ή ασταθείς τοίχους. Έλεγξε πρώτα τους ανθρώπους, χρησιμοποίησε την ασφαλέστερη γνωστή έξοδο και μην μπαίνεις σε ορατά κατεστραμμένο τμήμα. Στείλε σύντομη κατάσταση/θέση όταν υπάρχουν επικοινωνίες και περίμενε δευτερογενείς κινδύνους ή νέα καταιγίδα.\n\n## Πηγές επαλήθευσης\n- Ready.gov — ανεμοστρόβιλοι: https://www.ready.gov/tornadoes\n- FEMA — ασφαλή δωμάτια: https://www.fema.gov/emergency-managers/risk-management/building-science/safe-rooms\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":202,"en":{"title":"Hurricane/Cyclone Evacuation and Long-Outage Plan","body":"Tropical cyclones combine several hazards: destructive wind, storm surge/coastal flooding, inland flooding, tornadoes, heat after power loss and long supply interruptions. A single “hurricane kit” is not enough; plan the evacuation and the post-storm outage separately.\n\n## Decide evacuation triggers before landfall\nKnow whether the property lies in an evacuation or storm-surge zone and where official orders come from. Leave when authorities direct you; do not wait for water or wind to prove the forecast. Identify at least two routes because bridges and low roads can close early. Reserve fuel and account for animals, mobility equipment and medicines that need temperature control.\n\n## If sheltering is officially appropriate\nMove loose outdoor objects, charge communications/power storage, protect documents, fill only approved water containers, and choose an interior protected room away from windows. Never run a generator or charcoal/fuel-burning appliance inside a home, garage or other enclosed/partially enclosed shelter.\n\n## Plan for the days after\nAssume roads, refrigeration, mobile networks, pharmacies, payment terminals and fuel stations may not recover together. Use the Command Center to track water, food, power loads, medicines, fuel and verified information. Do not return to an evacuated area until authorities allow it.\n\n## Verification sources\n- Ready.gov — hurricanes: https://www.ready.gov/hurricanes\n- National Hurricane Center preparedness resources: https://www.noaa.gov/hurricane-prep\n\nVerification date: 2026-08-09."},"el":{"title":"Τυφώνας/κυκλώνας: εκκένωση και σχέδιο παρατεταμένης διακοπής","body":"Οι τροπικοί κυκλώνες συνδυάζουν πολλούς κινδύνους: καταστροφικό άνεμο, ανύψωση θάλασσας/παράκτια πλημμύρα, εσωτερικές πλημμύρες, ανεμοστρόβιλους, ζέστη μετά από απώλεια ρεύματος και μακρά διακοπή εφοδιασμού. Ένα γενικό «κιτ τυφώνα» δεν αρκεί· σχεδίασε ξεχωριστά την εκκένωση και τη ζωή μετά το πέρασμα.\n\n## Όρια εκκένωσης πριν την άφιξη\nΜάθε αν το ακίνητο βρίσκεται σε ζώνη εκκένωσης ή παράκτιας πλημμύρας και από ποια επίσημη πηγή έρχονται οι εντολές. Φύγε όταν το ζητούν οι αρχές· μην περιμένεις το νερό ή τον άνεμο να αποδείξει την πρόγνωση. Προετοίμασε τουλάχιστον δύο διαδρομές επειδή γέφυρες και χαμηλοί δρόμοι μπορεί να κλείσουν νωρίς. Κράτα καύσιμο και υπολόγισε ζώα, βοηθήματα κινητικότητας και φάρμακα που χρειάζονται θερμοκρασιακό έλεγχο.\n\n## Όταν η παραμονή επιτρέπεται επίσημα\nΑσφάλισε χαλαρά εξωτερικά αντικείμενα, φόρτισε επικοινωνίες/αποθήκευση ενέργειας, προστάτευσε έγγραφα, γέμισε μόνο κατάλληλα δοχεία νερού και επίλεξε προστατευμένο εσωτερικό δωμάτιο μακριά από παράθυρα. Ποτέ γεννήτρια, κάρβουνο ή άλλη συσκευή καύσης μέσα σε σπίτι, γκαράζ ή κλειστό/ημίκλειστο καταφύγιο.\n\n## Σχέδιο για τις επόμενες ημέρες\nΥπόθεσε ότι δρόμοι, ψύξη, δίκτυα κινητής, φαρμακεία, ηλεκτρονικές πληρωμές και πρατήρια δεν θα επανέλθουν ταυτόχρονα. Χρησιμοποίησε το Κέντρο Ελέγχου για νερό, τρόφιμα, φορτία ρεύματος, φάρμακα, καύσιμο και επαληθευμένες πληροφορίες. Μην επιστρέφεις σε εκκενωμένη περιοχή μέχρι να επιτραπεί επίσημα.\n\n## Πηγές επαλήθευσης\n- Ready.gov — τυφώνες/κυκλώνες: https://www.ready.gov/hurricanes\n- NOAA — προετοιμασία για τυφώνες: https://www.noaa.gov/hurricane-prep\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":203,"en":{"title":"Storm Surge and Coastal Flooding: High-Ground Decision","body":"Storm surge is not simply “large waves.” Wind and pressure can push seawater inland, raising water level over roads, buildings and evacuation routes. The safest decision often occurs before water is visible.\n\n## Know the elevation problem\nUse official evacuation/surge maps before the season and identify a destination outside the mapped zone. A nearby building that is slightly taller is not automatically a safe substitute for official evacuation. Bridges, causeways and coastal roads may become unusable well before the worst conditions.\n\n## Do not use the shoreline as an observation point\nLarge waves, debris and rapidly rising water can overtake people who approach to watch. Keep away from beaches, seawalls, harbors, river mouths and flooded roads during warnings. Never drive through water covering a roadway; depth, current and pavement damage cannot be judged reliably from the vehicle.\n\n## Protect the return decision\nAfter water retreats, salt water, sewage, fuel, electrical hazards and structural damage can remain. Do not treat receding water as an all-clear. Wait for access guidance, avoid downed lines and use protective footwear/gloves appropriate to cleanup tasks.\n\n## Verification sources\n- Ready.gov — hurricanes/coastal flooding: https://www.ready.gov/hurricanes\n- National Hurricane Center — storm surge overview: https://www.nhc.noaa.gov/surge/\n\nVerification date: 2026-08-09."},"el":{"title":"Ανύψωση θάλασσας και παράκτια πλημμύρα: απόφαση για ψηλότερο έδαφος","body":"Η ανύψωση θάλασσας από καταιγίδα δεν είναι απλώς «μεγάλα κύματα». Άνεμος και ατμοσφαιρική πίεση μπορούν να σπρώξουν θαλασσινό νερό προς την ξηρά και να καλύψουν δρόμους, κτίρια και διαδρομές εκκένωσης. Η ασφαλέστερη απόφαση συχνά λαμβάνεται πριν φανεί το νερό.\n\n## Κατανόησε το πρόβλημα υψομέτρου\nΜελέτησε επίσημους χάρτες εκκένωσης/παράκτιας πλημμύρας πριν την εποχή κινδύνου και επίλεξε προορισμό έξω από τη ζώνη. Ένα κοντινό, λίγο ψηλότερο κτίριο δεν είναι αυτόματα ασφαλές υποκατάστατο επίσημης εκκένωσης. Γέφυρες, στενοί παράκτιοι δρόμοι και αναχώματα μπορεί να γίνουν αδιάβατα πολύ πριν κορυφωθεί το συμβάν.\n\n## Μην παρατηρείς από την ακτή\nΜεγάλα κύματα, συντρίμμια και γρήγορη άνοδος νερού μπορούν να εγκλωβίσουν ανθρώπους που πλησιάζουν για να δουν. Μείνε μακριά από παραλίες, κυματοθραύστες, λιμάνια, εκβολές και πλημμυρισμένους δρόμους όταν υπάρχουν προειδοποιήσεις. Ποτέ μην οδηγείς σε νερό που καλύπτει οδό· βάθος, ρεύμα και βλάβη οδοστρώματος δεν αξιολογούνται αξιόπιστα από το όχημα.\n\n## Προστάτευσε την απόφαση επιστροφής\nΜετά την υποχώρηση μπορεί να παραμένουν αλάτι, λύματα, καύσιμα, ηλεκτρικοί κίνδυνοι και δομική ζημιά. Η υποχώρηση του νερού δεν είναι «λήξη συναγερμού». Περίμενε οδηγίες πρόσβασης, απέφυγε πεσμένα καλώδια και χρησιμοποίησε κατάλληλη προστασία σε εργασίες καθαρισμού.\n\n## Πηγές επαλήθευσης\n- Ready.gov — τυφώνες και παράκτια πλημμύρα: https://www.ready.gov/hurricanes\n- National Hurricane Center — πληροφορίες για ανύψωση θάλασσας: https://www.nhc.noaa.gov/surge/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":204,"en":{"title":"Flash Floods: Underpasses, Canyons, and Rapid-Rise Escape","body":"Flash floods can develop faster than a household can move equipment. Low crossings, urban underpasses, drainage channels and narrow valleys concentrate water and should be treated as route hazards, not convenient shortcuts.\n\n## Move early to higher ground\nWhen a flash-flood warning or obvious rapid rise affects your location, move away from the flood path promptly. Do not go into a basement/underground garage to save a vehicle when water is entering. In a canyon or dry wash, rain can create dangerous flow even when the storm is not directly overhead.\n\n## Never test floodwater with a vehicle or feet\nMoving water can hide missing pavement, open drains, debris and electrical hazards. Turn around rather than using another vehicle's successful crossing as proof. Pedestrians should not wade into moving water to retrieve objects or animals; find a safer route or call rescue services.\n\n## Plan urban escape vertically and horizontally\nKnow which nearby roads climb rather than descend into tunnels or river corridors. In a building, identify higher safe levels while preserving a route for rescue and avoiding roofs unless necessary for immediate life safety. Carry a light because power can fail in garages/stairs.\n\n## Verification sources\n- National Weather Service — flood safety: https://www.weather.gov/safety/flood\n- Ready.gov — floods: https://www.ready.gov/floods\n\nVerification date: 2026-08-09."},"el":{"title":"Ξαφνική πλημμύρα: υπόγειες διαβάσεις, φαράγγια και γρήγορη διαφυγή","body":"Οι ξαφνικές πλημμύρες μπορούν να αναπτυχθούν γρηγορότερα από όσο ένα νοικοκυριό μπορεί να μεταφέρει εξοπλισμό. Χαμηλές διαβάσεις, υπόγειες διαβάσεις πόλης, κανάλια απορροής και στενές κοιλάδες συγκεντρώνουν νερό και πρέπει να θεωρούνται κίνδυνοι διαδρομής, όχι συντομεύσεις.\n\n## Κινήσου νωρίς προς ψηλότερο σημείο\nΌταν προειδοποίηση ξαφνικής πλημμύρας ή προφανής γρήγορη άνοδος αφορά την περιοχή σου, απομακρύνσου έγκαιρα από τη ροή. Μην κατεβαίνεις σε υπόγειο ή γκαράζ για να σώσεις όχημα όταν μπαίνει νερό. Σε φαράγγι ή ξεροπόταμο, επικίνδυνη ροή μπορεί να εμφανιστεί ακόμη και όταν η καταιγίδα δεν βρίσκεται ακριβώς από πάνω.\n\n## Μην «δοκιμάζεις» το νερό με όχημα ή πόδια\nΤο κινούμενο νερό μπορεί να κρύβει κατεστραμμένο οδόστρωμα, ανοιχτά φρεάτια, συντρίμμια και ηλεκτρικούς κινδύνους. Γύρισε πίσω αντί να θεωρείς το πέρασμα άλλου οχήματος απόδειξη ασφάλειας. Πεζοί δεν πρέπει να μπαίνουν σε ρεύμα για αντικείμενα ή ζώα· αναζήτησε ασφαλέστερη διαδρομή ή διάσωση.\n\n## Σχεδίασε αστική διαφυγή οριζόντια και κατακόρυφα\nΓνώριζε ποιοι κοντινοί δρόμοι ανεβαίνουν αντί να κατεβαίνουν σε τούνελ ή κοίτες. Σε κτίριο εντόπισε υψηλότερα ασφαλή επίπεδα, κρατώντας δυνατότητα διάσωσης και αποφεύγοντας τη στέγη εκτός αν απαιτείται άμεσα για τη ζωή. Κράτα φακό επειδή ρεύμα σε γκαράζ/κλιμακοστάσια μπορεί να χαθεί.\n\n## Πηγές επαλήθευσης\n- National Weather Service — ασφάλεια πλημμυρών: https://www.weather.gov/safety/flood\n- Ready.gov — πλημμύρες: https://www.ready.gov/floods\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":205,"en":{"title":"Rip Currents: Self-Rescue and Shore-Rescue Boundaries","body":"Rip currents move water away from shore and can rapidly exhaust a swimmer who tries to fight directly against the current. Prevention is stronger than rescue: use guarded beaches, obey flags/signs and stay out when conditions exceed your ability.\n\n## If caught\nStay as calm as possible and conserve energy. Do not continuously fight straight toward shore against the current. Signal for help. Follow current local lifeguard/weather guidance for escaping the flow—often moving parallel to the shoreline or otherwise out of the narrow current before returning toward shore. If unable to escape, float/tread water and keep signaling rather than exhausting yourself.\n\n## If you see someone in trouble\nCall/alert the lifeguard or emergency services. From shore, throw or extend flotation when possible. Do not enter hazardous surf without training/equipment; untrained rescuers can become additional victims. Keep visual contact and point rescuers toward the person.\n\n## After rescue\nA person who inhaled water, lost consciousness or has persistent coughing/breathing problems needs medical assessment. Keep them warm and monitor while professional help is arranged.\n\n## Verification sources\n- National Weather Service — rip current safety: https://www.weather.gov/safety/ripcurrent\n- NWS local awareness guidance: https://www.weather.gov/mhx/ripcurrents\n\nVerification date: 2026-08-09."},"el":{"title":"Ρεύματα επιστροφής: αυτοδιάσωση και όρια διάσωσης από την ακτή","body":"Τα ρεύματα επιστροφής μετακινούν νερό από την ακτή προς τα ανοιχτά και μπορούν να εξαντλήσουν γρήγορα έναν κολυμβητή που προσπαθεί να κινηθεί συνεχώς κόντρα στο ρεύμα. Η πρόληψη είναι ισχυρότερη από τη διάσωση: προτίμησε φυλασσόμενες παραλίες, ακολούθησε σημαίες/πινακίδες και μην μπαίνεις όταν οι συνθήκες ξεπερνούν την ικανότητά σου.\n\n## Αν εγκλωβιστείς\nΠροσπάθησε να διατηρήσεις ψυχραιμία και ενέργεια. Μην παλεύεις συνεχώς κατευθείαν προς την ακτή κόντρα στο ρεύμα. Κάνε σήμα για βοήθεια. Ακολούθησε την τρέχουσα καθοδήγηση ναυαγοσώστη/καιρού για έξοδο από τη ροή — συχνά με κίνηση παράλληλα προς την ακτογραμμή ή έξω από το στενό ρεύμα πριν επιστρέψεις προς την ακτή. Αν δεν μπορείς να βγεις, επίπλευσε ή κράτησε το κεφάλι πάνω από το νερό και συνέχισε να σημαίνεις αντί να εξαντλείσαι.\n\n## Αν δεις άλλον σε κίνδυνο\nΕιδοποίησε ναυαγοσώστη ή υπηρεσίες έκτακτης ανάγκης. Από την ακτή ρίξε ή τέντωσε πλευστό μέσο όταν είναι δυνατό. Μην μπεις σε επικίνδυνα νερά χωρίς εκπαίδευση/εξοπλισμό· ο μη εκπαιδευμένος διασώστης μπορεί να γίνει δεύτερο θύμα. Κράτησε οπτική επαφή και δείξε στους διασώστες τη θέση.\n\n## Μετά τη διάσωση\nΆτομο που εισέπνευσε νερό, έχασε τις αισθήσεις ή έχει επίμονο βήχα/δυσκολία αναπνοής χρειάζεται ιατρική αξιολόγηση. Διατήρησέ το ζεστό και παρακολούθησέ το μέχρι να οργανωθεί επαγγελματική βοήθεια.\n\n## Πηγές επαλήθευσης\n- National Weather Service — ασφάλεια από ρεύματα επιστροφής: https://www.weather.gov/safety/ripcurrent\n- NWS — ενημέρωση παραλίας και ρευμάτων: https://www.weather.gov/mhx/ripcurrents\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":206,"en":{"title":"Avalanche Terrain: Avoidance, Group Exposure, and Rescue Readiness","body":"Avalanche safety cannot be reduced to a slope-angle number or a phone app. Snow stability changes with weather, wind and terrain, while consequences change with cliffs, gullies, trees and terrain traps. Formal avalanche education and current local forecasts are essential for people who deliberately enter avalanche terrain.\n\n## Avoid exposure when uncertain\nThe strongest field control is choosing terrain that is not exposed to avalanche start zones, paths or runout. Avalanches can affect gentler terrain below steeper slopes. If you do not have the training to recognize the terrain and current hazard, choose a route that avoids it rather than trying to “read” the snow during an emergency trip.\n\n## Group movement matters\nDo not cluster the entire group in one exposed area. Identify safer regroup points outside runout/terrain traps and keep visual/communication accountability. A single person crossing at a time can reduce the number exposed, but this is not a substitute for choosing safe terrain.\n\n## Rescue equipment requires practice\nBeacon, probe and shovel are not magic equipment; they require compatible devices, correct wear and repeated practice. People traveling in avalanche terrain should know how to perform a companion rescue and should not assume cellular rescue will arrive immediately.\n\n## Verification sources\n- National Avalanche Center/Avalanche.org — terrain: https://avalanche.org/avalanche-tutorial/avalanche-terrain.php\n- Avalanche.org — travel safely: https://avalanche.org/avalanche-tutorial/travel-safely.php\n\nVerification date: 2026-08-09."},"el":{"title":"Χιονοστιβαδικό πεδίο: αποφυγή, έκθεση ομάδας και ετοιμότητα διάσωσης","body":"Η ασφάλεια από χιονοστιβάδα δεν μπορεί να μειωθεί σε έναν αριθμό κλίσης ή σε μια εφαρμογή τηλεφώνου. Η σταθερότητα του χιονιού αλλάζει με καιρό, άνεμο και ανάγλυφο, ενώ οι συνέπειες αλλάζουν με γκρεμούς, ρεματιές, δέντρα και παγίδες εδάφους. Όποιος επιλέγει να κινείται σε χιονοστιβαδικό πεδίο χρειάζεται πραγματική εκπαίδευση και τρέχουσα τοπική πρόγνωση.\n\n## Απόφυγε την έκθεση όταν υπάρχει αβεβαιότητα\nΟ ισχυρότερος έλεγχος είναι η επιλογή εδάφους που δεν εκτίθεται σε ζώνη έναρξης, διαδρομή ή απόθεση χιονοστιβάδας. Χιονοστιβάδα μπορεί να φτάσει και σε ηπιότερο έδαφος κάτω από απότομη πλαγιά. Αν δεν έχεις εκπαίδευση αναγνώρισης εδάφους και κινδύνου, επίλεξε διαδρομή που το αποφεύγει αντί να προσπαθείς να «διαβάσεις» το χιόνι μέσα σε έκτακτη μετακίνηση.\n\n## Η κίνηση ομάδας αλλάζει την έκθεση\nΜην συγκεντρώνεις όλη την ομάδα σε ένα εκτεθειμένο σημείο. Όρισε ασφαλέστερα σημεία ανασύνταξης έξω από διαδρομές και παγίδες εδάφους και διατήρησε οπτική/επικοινωνιακή λογοδοσία. Διέλευση ενός ατόμου κάθε φορά μπορεί να μειώσει πόσα άτομα εκτίθενται ταυτόχρονα, αλλά δεν υποκαθιστά την επιλογή ασφαλούς εδάφους.\n\n## Ο εξοπλισμός διάσωσης απαιτεί εξάσκηση\nΠομπός-δέκτης, ανιχνευτική ράβδος και φτυάρι δεν είναι «μαγικός» εξοπλισμός. Χρειάζονται συμβατές συσκευές, σωστή χρήση και επαναλαμβανόμενη άσκηση. Άτομα σε τέτοιο πεδίο πρέπει να γνωρίζουν διάσωση συντρόφου και να μην βασίζονται στην υπόθεση ότι η τηλεφωνική διάσωση θα φτάσει άμεσα.\n\n## Πηγές επαλήθευσης\n- National Avalanche Center/Avalanche.org — αναγνώριση εδάφους: https://avalanche.org/avalanche-tutorial/avalanche-terrain.php\n- Avalanche.org — ασφαλέστερη κίνηση: https://avalanche.org/avalanche-tutorial/travel-safely.php\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":207,"en":{"title":"Dust Storm: Road Visibility and Indoor Air Protection","body":"Dense dust can reduce road visibility to almost nothing and can worsen respiratory symptoms. The safest travel decision may be not entering the dust area at all.\n\n## If driving\nFollow local weather/transport instructions. If dense blowing dust makes safe travel impossible, leave the traffic lane as far as practical onto a safe area, stop, set the parking brake and follow the local road-safety guidance for vehicle lighting so following drivers do not mistake your stopped vehicle for moving traffic. Do not stop in a travel lane.\n\n## If indoors\nClose openings that admit dust when doing so does not create another ventilation hazard. Use appropriate filtration if available and protect people with asthma/respiratory disease according to their medical plan. Avoid adding indoor particles through smoking, candles or unnecessary combustion.\n\n## After the event\nDust can hide road debris and reduce traction. Clean respiratory/eye protection and filters according to their instructions rather than beating contaminated dust into living areas. People with persistent breathing difficulty or eye injury need medical evaluation.\n\n## Verification sources\n- National Weather Service — weather safety rules/dust storms: https://www.weather.gov/lmk/weathersafetyrules\n- CDC — particulate/air-quality health resources: https://www.cdc.gov/air-quality/about/index.html\n\nVerification date: 2026-08-09."},"el":{"title":"Καταιγίδα σκόνης: οδική ορατότητα και προστασία εσωτερικού αέρα","body":"Πυκνή σκόνη μπορεί να μειώσει την ορατότητα στον δρόμο σχεδόν στο μηδέν και να επιδεινώσει αναπνευστικά προβλήματα. Η ασφαλέστερη απόφαση μπορεί να είναι να μην μπεις καθόλου στη ζώνη σκόνης.\n\n## Αν οδηγείς\nΑκολούθησε τις τοπικές οδηγίες καιρού και μεταφορών. Αν η πυκνή σκόνη κάνει την οδήγηση μη ασφαλή, βγες όσο είναι πρακτικά δυνατό από τη λωρίδα κυκλοφορίας σε ασφαλές σημείο, σταμάτησε, βάλε χειρόφρενο και ακολούθησε την τοπική οδική καθοδήγηση για τα φώτα ώστε οι οδηγοί πίσω να μην θεωρήσουν το σταματημένο όχημα ως κινούμενη κυκλοφορία. Μην σταματάς μέσα στη λωρίδα.\n\n## Αν βρίσκεσαι σε κτίριο\nΚλείσε ανοίγματα που φέρνουν σκόνη όταν αυτό δεν δημιουργεί άλλο πρόβλημα αερισμού. Χρησιμοποίησε κατάλληλη φίλτρανση αν υπάρχει και προστάτευσε άτομα με άσθμα/αναπνευστική νόσο σύμφωνα με το ιατρικό τους σχέδιο. Μην προσθέτεις σωματίδια στο εσωτερικό με κάπνισμα, κεριά ή περιττή καύση.\n\n## Μετά το φαινόμενο\nΗ σκόνη μπορεί να κρύβει συντρίμμια και να μειώνει πρόσφυση. Καθάρισε προστασία ματιών/αναπνοής και φίλτρα σύμφωνα με τις οδηγίες τους αντί να τινάζεις ρύπους μέσα στον χώρο. Επίμονη δυσκολία αναπνοής ή τραυματισμός ματιού χρειάζονται ιατρική αξιολόγηση.\n\n## Πηγές επαλήθευσης\n- National Weather Service — κανόνες ασφάλειας και σκόνη: https://www.weather.gov/lmk/weathersafetyrules\n- CDC — ποιότητα αέρα και υγεία: https://www.cdc.gov/air-quality/about/index.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":208,"en":{"title":"Severe Thunderstorm: Hail, Wind, and Window Protection","body":"Severe thunderstorms can produce damaging wind, large hail, lightning, flash flooding and tornadoes within the same event. Treat the warning as a multi-hazard problem rather than waiting to see which one arrives.\n\n## Move indoors early\nUse a sturdy building or hard-topped vehicle when no building is available and local guidance recognizes it as safer lightning shelter. Move away from windows and exterior glass before hail/wind peaks. Bring people and animals inside; outdoor objects can become debris.\n\n## Do not rely on a covered porch\nA roof with open sides is not adequate lightning protection. Avoid plumbing/wired equipment during close lightning according to local guidance and do not use trees, isolated shelters or open fields as lightning refuge.\n\n## Prepare for power loss\nUnplug or protect sensitive equipment when safe and before the storm if needed, charge essential devices, and place lights where they can be reached without walking through broken glass. After the storm, assume downed lines are energized and keep away from water touching electrical infrastructure.\n\n## Verification sources\n- Ready.gov — thunderstorms and lightning: https://www.ready.gov/thunderstorms-lightning\n- National Weather Service — weather safety: https://www.weather.gov/safety/\n\nVerification date: 2026-08-09."},"el":{"title":"Ισχυρή καταιγίδα: χαλάζι, άνεμος και προστασία από τζάμια","body":"Ισχυρές καταιγίδες μπορούν να παράγουν καταστροφικό άνεμο, μεγάλο χαλάζι, κεραυνούς, ξαφνικές πλημμύρες και ανεμοστρόβιλους στο ίδιο συμβάν. Αντιμετώπισε την προειδοποίηση ως πολλαπλό κίνδυνο αντί να περιμένεις να δεις ποιος θα εμφανιστεί.\n\n## Μπες νωρίς σε κλειστό ασφαλή χώρο\nΧρησιμοποίησε ανθεκτικό κτίριο ή, όταν δεν υπάρχει κτίριο, σκληροκέλυφο όχημα όταν η τοπική καθοδήγηση το αναγνωρίζει ως ασφαλέστερη προστασία από κεραυνό. Απομακρύνσου από παράθυρα και εξωτερικά τζάμια πριν κορυφωθούν χαλάζι/άνεμος. Βάλε ανθρώπους και ζώα μέσα· εξωτερικά αντικείμενα μπορούν να μετατραπούν σε βλήματα.\n\n## Η σκεπαστή βεράντα δεν αρκεί\nΣτέγη με ανοιχτές πλευρές δεν παρέχει κατάλληλη προστασία από κεραυνό. Απόφυγε υδραυλικά και ενσύρματο εξοπλισμό όταν ο κεραυνός είναι κοντά σύμφωνα με τις τοπικές οδηγίες και μην χρησιμοποιείς δέντρα, απομονωμένα σκέπαστρα ή ανοιχτό χωράφι ως καταφύγιο.\n\n## Προετοιμασία για διακοπή ρεύματος\nΑποσύνδεσε ή προστάτευσε ευαίσθητο εξοπλισμό όταν είναι ασφαλές και πριν την καταιγίδα, φόρτισε κρίσιμες συσκευές και βάλε φακούς σε σημεία που φτάνεις χωρίς να περπατάς σε σπασμένα γυαλιά. Μετά την καταιγίδα θεώρησε πεσμένα καλώδια ενεργά και μείνε μακριά από νερό που αγγίζει ηλεκτρική υποδομή.\n\n## Πηγές επαλήθευσης\n- Ready.gov — καταιγίδες και κεραυνοί: https://www.ready.gov/thunderstorms-lightning\n- National Weather Service — ασφάλεια καιρού: https://www.weather.gov/safety/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":209,"en":{"title":"Winter-Stranded Vehicle: Shelter, Signaling, and Carbon Monoxide","body":"A stranded vehicle can provide wind protection and visibility to rescuers, but snow can also block the exhaust and create carbon-monoxide danger if the engine is run. Decide whether remaining with the vehicle is safer than walking based on official guidance, location, weather and known nearby shelter—not panic.\n\n## Make the vehicle visible\nUse hazard/marker methods that do not drain the battery unnecessarily and that local authorities recognize. Clear snow around identifying surfaces when safe. Communicate coordinates, road name/direction, vehicle description, occupants and medical needs before battery/network deteriorates.\n\n## Conserve heat\nAdd dry layers, hats, gloves and insulation beneath/around occupants. Keep wet clothing out of the main insulation. Share blankets without restricting circulation. Small movements can help circulation, but avoid sweating.\n\n## Engine/CO boundary\nIf guidance supports periodic engine use for heat, the exhaust outlet must remain completely clear of snow and the vehicle must not be in an enclosed/partially enclosed location. Cracked windows are not a substitute for a clear exhaust and safe location. If anyone develops headache, dizziness, nausea or confusion, stop the suspected exposure and move to fresh air safely while seeking help.\n\n## Verification sources\n- Ready.gov — winter weather: https://www.ready.gov/winter-weather\n- CDC — carbon monoxide: https://www.cdc.gov/carbon-monoxide/about/index.html\n\nVerification date: 2026-08-09."},"el":{"title":"Ακινητοποιημένο όχημα τον χειμώνα: καταφύγιο, σήμα και μονοξείδιο","body":"Ένα ακινητοποιημένο όχημα μπορεί να παρέχει προστασία από άνεμο και να είναι πιο ορατό στους διασώστες, όμως το χιόνι μπορεί να φράξει την εξάτμιση και να δημιουργήσει κίνδυνο μονοξειδίου αν λειτουργεί ο κινητήρας. Η απόφαση παραμονής ή πεζής μετακίνησης βασίζεται σε επίσημη καθοδήγηση, θέση, καιρό και γνωστό κοντινό καταφύγιο — όχι σε πανικό.\n\n## Κάνε το όχημα εντοπίσιμο\nΧρησιμοποίησε σήματα/φώτα με τρόπο που δεν αδειάζει άσκοπα την μπαταρία και είναι αναγνωρίσιμος από τις τοπικές αρχές. Καθάρισε χιόνι από σημεία αναγνώρισης όταν είναι ασφαλές. Στείλε συντεταγμένες, δρόμο/κατεύθυνση, περιγραφή οχήματος, αριθμό ατόμων και ιατρικές ανάγκες πριν επιδεινωθεί δίκτυο ή ενέργεια.\n\n## Διατήρησε θερμότητα\nΠρόσθεσε στεγνές στρώσεις, σκούφο, γάντια και μόνωση κάτω/γύρω από τους επιβάτες. Κράτα βρεγμένα ρούχα έξω από τη βασική μόνωση. Μοιράσου κουβέρτες χωρίς να περιορίζεται η κυκλοφορία. Μικρές κινήσεις βοηθούν, αλλά απόφυγε έντονη άσκηση που προκαλεί ιδρώτα.\n\n## Κινητήρας και μονοξείδιο\nΑν η επίσημη καθοδήγηση επιτρέπει περιοδική χρήση κινητήρα για θέρμανση, η έξοδος εξάτμισης πρέπει να είναι εντελώς καθαρή από χιόνι και το όχημα να μην βρίσκεται σε κλειστό ή ημίκλειστο χώρο. Ένα μισάνοιχτο παράθυρο δεν υποκαθιστά καθαρή εξάτμιση και ασφαλή θέση. Πονοκέφαλος, ζάλη, ναυτία ή σύγχυση απαιτούν διακοπή ύποπτης έκθεσης, ασφαλή καθαρό αέρα και βοήθεια.\n\n## Πηγές επαλήθευσης\n- Ready.gov — χειμερινός καιρός: https://www.ready.gov/winter-weather\n- CDC — μονοξείδιο άνθρακα: https://www.cdc.gov/carbon-monoxide/about/index.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":210,"en":{"title":"Extreme-Heat Stranded Vehicle: Shade, Water, and Rescue","body":"A disabled vehicle in extreme heat can become dangerously hot, especially for children, older adults, animals and people with chronic illness. Do not treat the vehicle cabin as a safe waiting room just because it blocks the sun.\n\n## Get help early\nShare exact location, road direction, vehicle description and number/condition of occupants. If the vehicle is in a dangerous traffic position, prioritize traffic safety while waiting for professional help. Do not send a vulnerable person walking along an exposed road toward an uncertain destination.\n\n## Reduce heat load\nUse safe shade outside the vehicle when traffic/environment make it appropriate, or improve shading/airflow without entering hazardous terrain. Keep direct sun off people and minimize exertion. Use available safe drinking water according to individual medical needs and watch for worsening heat illness.\n\n## Never leave a person or animal in a closed hot vehicle\nCabin temperature can rise rapidly. If the air conditioning stops, reassess immediately rather than relying on “just a few minutes.” Follow local emergency guidance when a child/person/animal is trapped.\n\n## Walking is a deliberate decision\nDistance signs are not proof that the route has shade, water or an open facility. Walking in extreme heat increases water demand and can turn a vehicle problem into a medical emergency. Move only when the route and destination are known and safer than remaining.\n\n## Verification sources\n- CDC — extreme heat: https://www.cdc.gov/heat-health/about/index.html\n- Ready.gov — extreme heat: https://www.ready.gov/heat\n\nVerification date: 2026-08-09."},"el":{"title":"Ακινητοποιημένο όχημα σε ακραία ζέστη: σκιά, νερό και διάσωση","body":"Ακινητοποιημένο όχημα σε ακραία ζέστη μπορεί να γίνει επικίνδυνα θερμό, ιδιαίτερα για παιδιά, ηλικιωμένους, ζώα και άτομα με χρόνια προβλήματα. Η καμπίνα δεν είναι ασφαλής αίθουσα αναμονής απλώς επειδή κόβει τον ήλιο.\n\n## Ζήτησε βοήθεια νωρίς\nΣτείλε ακριβή θέση, κατεύθυνση δρόμου, περιγραφή οχήματος και αριθμό/κατάσταση επιβατών. Αν το όχημα βρίσκεται σε επικίνδυνη θέση κυκλοφορίας, προτεραιότητα έχει η οδική ασφάλεια όσο περιμένεις επαγγελματική βοήθεια. Μην στείλεις ευάλωτο άτομο να περπατήσει σε εκτεθειμένο δρόμο προς άγνωστο προορισμό.\n\n## Μείωσε το θερμικό φορτίο\nΧρησιμοποίησε ασφαλή σκιά έξω από το όχημα όταν κυκλοφορία και περιβάλλον το επιτρέπουν, ή βελτίωσε σκίαση/ροή αέρα χωρίς να μπεις σε επικίνδυνο έδαφος. Κράτα τον άμεσο ήλιο μακριά από τους ανθρώπους και περιόρισε την προσπάθεια. Χρησιμοποίησε διαθέσιμο ασφαλές πόσιμο νερό σύμφωνα με ατομικές ιατρικές ανάγκες και παρακολούθησε για επιδείνωση θερμικής νόσου.\n\n## Ποτέ άνθρωπος ή ζώο κλεισμένο σε θερμό όχημα\nΗ θερμοκρασία καμπίνας μπορεί να αυξηθεί γρήγορα. Αν σταματήσει ο κλιματισμός, επανεκτίμησε αμέσως αντί να βασιστείς σε «λίγα λεπτά». Ακολούθησε τις τοπικές επείγουσες οδηγίες όταν παιδί, άνθρωπος ή ζώο είναι εγκλωβισμένο.\n\n## Η πεζή κίνηση είναι συνειδητή απόφαση\nΜια πινακίδα απόστασης δεν αποδεικνύει ότι η διαδρομή έχει σκιά, νερό ή ανοιχτή εγκατάσταση. Περπάτημα σε ακραία ζέστη αυξάνει ανάγκες νερού και μπορεί να μετατρέψει μηχανική βλάβη σε ιατρικό επείγον. Κινήσου μόνο αν γνωρίζεις ότι διαδρομή και προορισμός είναι ασφαλέστερα.\n\n## Πηγές επαλήθευσης\n- CDC — ακραία ζέστη: https://www.cdc.gov/heat-health/about/index.html\n- Ready.gov — καύσωνας: https://www.ready.gov/heat\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":211,"en":{"title":"Roadside Breakdown: Visibility, Traffic, and Safe Waiting Zone","body":"A breakdown on a high-speed road can be more immediately dangerous than the mechanical fault. Protect people from traffic first; repairs come second.\n\n## Move out of the traffic stream if possible\nIf the vehicle can safely reach a shoulder, turnout or other protected area, do so. Do not stop around a blind curve, crest or narrow lane when a safer location is reachable. Use hazard signaling according to local road rules.\n\n## Decide where occupants wait\nThe safest place varies by road geometry, barriers, weather and traffic. Avoid standing between vehicles, beside the traffic-facing side, or in a location where an errant vehicle would hit the group. Follow police/road-operator guidance. Children and animals should remain controlled and away from the carriageway.\n\n## Do not attempt unsafe roadside repair\nChanging a tire or inspecting under a vehicle inches from fast traffic may be unacceptable even if technically simple. Call road assistance/emergency services when the work zone cannot be made safe. Never crawl beneath a vehicle supported only by a jack.\n\n## Make the handoff precise\nReport road number, travel direction, nearest marker/exit, vehicle description, exact hazard (lane blocked, smoke, injury, fuel leak) and number of people. Preserve phone battery after contact.\n\n## Source anchors\n- Ready.gov — vehicle emergency kit: https://www.ready.gov/car\n- Local road authority/highway code for stopping and warning-device requirements.\n\nVerification date: 2026-08-09."},"el":{"title":"Οδική βλάβη: ορατότητα, κυκλοφορία και ασφαλής ζώνη αναμονής","body":"Βλάβη σε δρόμο υψηλής ταχύτητας μπορεί να είναι πιο άμεσα επικίνδυνη από το ίδιο το μηχανικό πρόβλημα. Πρώτα προστατεύονται οι άνθρωποι από την κυκλοφορία και μετά γίνεται επισκευή.\n\n## Βγες από τη ροή κυκλοφορίας όταν είναι δυνατό\nΑν το όχημα μπορεί με ασφάλεια να φτάσει σε λωρίδα έκτακτης ανάγκης, εσοχή ή άλλο προστατευμένο σημείο, κάν’ το. Μην σταματάς πίσω από τυφλή στροφή, κορυφή ή σε στενή λωρίδα όταν υπάρχει ασφαλέστερο σημείο προσβάσιμο. Χρησιμοποίησε προειδοποιητικά σήματα σύμφωνα με τους τοπικούς κανόνες.\n\n## Πού περιμένουν οι επιβάτες\nΗ ασφαλέστερη θέση αλλάζει ανάλογα με δρόμο, στηθαία, καιρό και κυκλοφορία. Απόφυγε να στέκεσαι ανάμεσα σε οχήματα, στην πλευρά προς την κυκλοφορία ή σε σημείο όπου ένα όχημα που παρεκκλίνει θα χτυπήσει την ομάδα. Ακολούθησε αστυνομία ή διαχειριστή δρόμου. Παιδιά και ζώα παραμένουν ελεγχόμενα και μακριά από το οδόστρωμα.\n\n## Μην κάνεις επισκευή σε μη ασφαλή ζώνη\nΑλλαγή ελαστικού ή έλεγχος κάτω από όχημα δίπλα σε γρήγορη κυκλοφορία μπορεί να είναι απαράδεκτος ακόμη κι αν τεχνικά είναι απλή εργασία. Κάλεσε οδική βοήθεια ή υπηρεσίες όταν δεν δημιουργείται ασφαλής χώρος εργασίας. Ποτέ μην μπαίνεις κάτω από όχημα που στηρίζεται μόνο σε γρύλο.\n\n## Ακριβής αναφορά\nΔώσε αριθμό δρόμου, κατεύθυνση, κοντινό χιλιομετρικό σημείο/έξοδο, περιγραφή οχήματος, ακριβή κίνδυνο (κλειστή λωρίδα, καπνός, τραυματισμός, διαρροή) και αριθμό ανθρώπων. Μετά την επικοινωνία διατήρησε μπαταρία τηλεφώνου.\n\n## Πηγές αναφοράς\n- Ready.gov — κιτ έκτακτης ανάγκης οχήματος: https://www.ready.gov/car\n- Τοπική οδική αρχή και κώδικας για στάση και προειδοποιητικά μέσα.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":212,"en":{"title":"Boating: Life Jacket, Float Plan, and Passenger Brief","body":"A boat emergency often happens too fast for someone to locate and correctly put on a stowed life jacket. Wear an approved life jacket appropriate to the activity, user and local requirements, and brief passengers before departure.\n\n## Make flotation personal\nCheck that each person has the correct size/type and knows how it is worn. Children and people with limited swimming ability need particular attention. Inflatable devices have maintenance and user limitations; inspect according to the manufacturer rather than assuming an unused-looking device is ready.\n\n## Leave a float plan\nTell a reliable shore contact the vessel description/registration if relevant, people aboard, departure point, intended route/destination, expected return and what action to take if overdue. Update them if the plan materially changes. An offline paper copy in the vehicle/home can be useful when cloud accounts are unavailable.\n\n## Passenger safety brief\nBefore departure, show life jackets, communication/emergency gear, how to stop the engine if appropriate, fire extinguisher location, and the importance of staying with the vessel unless immediate hazards require otherwise. Secure loose equipment that could injure someone during sudden movement.\n\n## Verification sources\n- U.S. Coast Guard Boating Safety — life jackets: https://www.uscgboating.org/recreational-boaters/life-jacket-wear-wearing-your-life-jacket.php\n- U.S. Coast Guard Boating Safety: https://www.uscgboating.org/recreational-boaters/\n\nVerification date: 2026-08-09."},"el":{"title":"Σκάφος: σωσίβιο, σχέδιο πλεύσης και ενημέρωση επιβατών","body":"Ένα συμβάν σε σκάφος συχνά εξελίσσεται πολύ γρήγορα για να ψάξει κάποιος σωσίβιο και να το φορέσει σωστά αφού ήδη βρίσκεται σε κίνδυνο. Φόρα εγκεκριμένο σωσίβιο κατάλληλο για δραστηριότητα, χρήστη και τοπικές απαιτήσεις και ενημέρωσε τους επιβάτες πριν την αναχώρηση.\n\n## Η πλευστότητα είναι προσωπικός εξοπλισμός\nΈλεγξε ότι κάθε άτομο έχει σωστό μέγεθος/τύπο και γνωρίζει πώς φοριέται. Παιδιά και άτομα με περιορισμένη κολυμβητική ικανότητα χρειάζονται ιδιαίτερη προσοχή. Τα φουσκωτά μέσα έχουν απαιτήσεις συντήρησης και περιορισμούς χρήστη· επιθεώρησέ τα σύμφωνα με τον κατασκευαστή αντί να θεωρείς ότι ένα «αχρησιμοποίητο» σωσίβιο είναι έτοιμο.\n\n## Άφησε σχέδιο πλεύσης\nΔώσε σε αξιόπιστο άτομο στη στεριά περιγραφή/στοιχεία σκάφους όπου χρειάζεται, ποιοι επιβαίνουν, σημείο αναχώρησης, προβλεπόμενη πορεία/προορισμό, ώρα επιστροφής και τι πρέπει να κάνει αν καθυστερήσεις. Ενημέρωσέ το αν αλλάξει ουσιαστικά το σχέδιο. Ένα χάρτινο αντίγραφο στο σπίτι ή όχημα είναι χρήσιμο όταν δεν λειτουργούν υπηρεσίες cloud.\n\n## Ενημέρωση επιβατών\nΠριν φύγετε, δείξε σωσίβια, επικοινωνίες/εξοπλισμό έκτακτης ανάγκης, τρόπο διακοπής κινητήρα όπου είναι κατάλληλο, θέση πυροσβεστήρα και τη σημασία παραμονής κοντά στο σκάφος εκτός αν άμεσος κίνδυνος απαιτεί άλλο. Στερέωσε χαλαρά αντικείμενα που μπορούν να τραυματίσουν σε απότομη κίνηση.\n\n## Πηγές επαλήθευσης\n- U.S. Coast Guard Boating Safety — σωσίβια: https://www.uscgboating.org/recreational-boaters/life-jacket-wear-wearing-your-life-jacket.php\n- U.S. Coast Guard — ασφάλεια σκαφών: https://www.uscgboating.org/recreational-boaters/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":213,"en":{"title":"Small-Boat Capsize: Stay With the Vessel and Count People","body":"After a capsize, cold shock, waves and panic can turn a short swim into a life-threatening effort. The exact response depends on fire, surf, current and vessel type, but accountability and flotation come first.\n\n## Count people immediately\nEstablish who is in the water and who is missing. Put on or keep life jackets secured. If the capsized vessel is floating and not presenting an immediate hazard, it can be easier for rescuers to see than individual swimmers and may provide flotation/support. Do not leave it for a distant shore simply because land looks close.\n\n## Reduce energy loss\nLimit unnecessary swimming, keep airway clear and use the flotation/device techniques taught for your equipment. In cold water, protect heat and get out of the water onto a stable craft/platform when safely possible. Avoid climbing actions that repeatedly roll the craft onto other people.\n\n## Signal and communicate\nUse marine radio, emergency beacon, phone or visual signals appropriate to the voyage. Give position, number of people, vessel description and immediate hazards. Keep the group together when conditions allow so nobody disappears unnoticed.\n\n## Verification sources\n- U.S. Coast Guard Boating Safety: https://www.uscgboating.org/\n- National Weather Service — cold-water safety resources: https://www.weather.gov/safety/coldwater\n\nVerification date: 2026-08-09."},"el":{"title":"Ανατροπή μικρού σκάφους: παραμονή κοντά στο σκάφος και καταμέτρηση ανθρώπων","body":"Μετά από ανατροπή μικρού σκάφους, το ψυχρό σοκ, τα κύματα και ο πανικός μπορούν να μετατρέψουν μικρή απόσταση κολύμβησης σε απειλή ζωής. Η ακριβής αντίδραση εξαρτάται από φωτιά, κύμα, ρεύμα και τύπο σκάφους, όμως πρώτα έρχονται η λογοδοσία και η πλευστότητα.\n\n## Μέτρησε αμέσως τους ανθρώπους\nΔιαπίστωσε ποιος είναι στο νερό και ποιος λείπει. Φόρα ή κράτησε σωστά ασφαλισμένα τα σωσίβια. Αν το αναποδογυρισμένο σκάφος επιπλέει και δεν δημιουργεί άμεσο κίνδυνο, συνήθως είναι πιο ορατό στους διασώστες από έναν μεμονωμένο κολυμβητή και μπορεί να προσφέρει πλευστότητα/στήριξη. Μην το εγκαταλείπεις για μια μακρινή ακτή μόνο επειδή η ξηρά φαίνεται κοντά.\n\n## Μείωσε την απώλεια ενέργειας\nΠεριόρισε περιττό κολύμπι, κράτα τον αεραγωγό ελεύθερο και χρησιμοποίησε τις τεχνικές πλευστότητας που αντιστοιχούν στον εξοπλισμό σου. Σε κρύο νερό, προστάτευσε θερμότητα και βγες σε σταθερό σκάφος/πλατφόρμα όταν αυτό είναι ασφαλές. Απόφυγε προσπάθειες που ανατρέπουν ξανά το σκάφος πάνω σε άλλους.\n\n## Σήμα και επικοινωνία\nΧρησιμοποίησε ναυτικό ασύρματο, συσκευή κινδύνου, τηλέφωνο ή οπτικό σήμα κατάλληλο για το ταξίδι. Δώσε θέση, αριθμό ανθρώπων, περιγραφή σκάφους και άμεσους κινδύνους. Κράτα την ομάδα μαζί όταν οι συνθήκες το επιτρέπουν ώστε να μην εξαφανιστεί κάποιος χωρίς να γίνει αντιληπτό.\n\n## Πηγές επαλήθευσης\n- U.S. Coast Guard — ασφάλεια σκαφών: https://www.uscgboating.org/\n- National Weather Service — ασφάλεια κρύου νερού: https://www.weather.gov/safety/coldwater\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":214,"en":{"title":"Search-and-Rescue Signaling: Light, Whistle, Contrast, and Battery Discipline","body":"Being findable is a survival system. Signals should increase the chance that a rescuer detects you without consuming all power, causing fire, or requiring repeated risky movement.\n\n## Make location easier to describe\nRecord coordinates and the coordinate format, last known road/trail, visible landmarks, elevation if known, group size and hazards around the site. Send the compact message early when coverage appears. Do not continuously stream media if it drains the only communication battery.\n\n## Use layered signals\nA whistle can carry farther than a voice with much less effort. A flashlight can be used deliberately at night. High-contrast fabric/marker material can make a static location easier to see. A signal mirror can be useful in sunlight if the user understands safe aiming and does not direct glare at nearby drivers/aircraft indiscriminately.\n\n## Avoid dangerous signal fires\nDo not create open flame in wildfire conditions, fuel-contaminated areas, dry grass or where fire restrictions prohibit it. Smoke/fire can create a second emergency. Prefer non-fire methods unless trained local guidance explicitly supports a signal fire.\n\n## Preserve a signaling reserve\nKeep one light and one communication device from being consumed by entertainment/general use. Use scheduled check windows rather than leaving every radio/device transmitting. Mark the planned signal schedule in the route card.\n\n## Source anchors\n- Ready.gov — emergency communication planning: https://www.ready.gov/plan\n- U.S. Coast Guard boating distress-signal resources: https://www.uscgboating.org/\n\nVerification date: 2026-08-09."},"el":{"title":"Σήμανση έρευνας-διάσωσης: φως, σφυρίχτρα, αντίθεση και διαχείριση μπαταρίας","body":"Το να μπορείς να εντοπιστείς είναι ολόκληρο σύστημα επιβίωσης. Τα σήματα πρέπει να αυξάνουν την πιθανότητα εντοπισμού χωρίς να καταναλώνουν όλη την ενέργεια, να δημιουργούν φωτιά ή να απαιτούν επαναλαμβανόμενη επικίνδυνη κίνηση.\n\n## Κάνε τη θέση εύκολη να περιγραφεί\nΚατέγραψε συντεταγμένες και μορφή συντεταγμένων, τελευταίο γνωστό δρόμο/μονοπάτι, ορατά σημεία αναφοράς, υψόμετρο αν είναι γνωστό, μέγεθος ομάδας και κινδύνους γύρω από τη θέση. Στείλε σύντομο μήνυμα νωρίς όταν εμφανιστεί κάλυψη. Μην μεταδίδεις συνεχώς βίντεο ή μεγάλα δεδομένα αν αυτό αδειάζει τη μοναδική μπαταρία επικοινωνίας.\n\n## Πολλαπλά είδη σήματος\nΣφυρίχτρα μπορεί να μεταφέρει ήχο πιο μακριά από τη φωνή με πολύ λιγότερη προσπάθεια. Φακός μπορεί να χρησιμοποιηθεί σκόπιμα τη νύχτα. Ύφασμα ή σήμανση υψηλής αντίθεσης κάνει σταθερή θέση πιο ορατή. Καθρέφτης σήμανσης μπορεί να βοηθήσει στον ήλιο αν ο χρήστης ξέρει πώς στοχεύει και δεν ρίχνει τυχαία έντονη αντανάκλαση σε κοντινούς οδηγούς ή αεροσκάφη.\n\n## Απόφυγε επικίνδυνες φωτιές σήμανσης\nΜην ανάβεις φλόγα σε συνθήκες δασικής πυρκαγιάς, περιοχή με καύσιμα, ξηρά χόρτα ή όπου υπάρχουν απαγορεύσεις. Η φωτιά μπορεί να γίνει δεύτερη έκτακτη ανάγκη. Προτίμησε μη φλογερά σήματα εκτός αν εκπαιδευμένη τοπική καθοδήγηση υποδεικνύει διαφορετικά.\n\n## Κράτησε εφεδρεία σήμανσης\nΔιατήρησε έναν φακό και μία συσκευή επικοινωνίας έξω από ψυχαγωγία ή γενική χρήση. Χρησιμοποίησε προγραμματισμένα παράθυρα ελέγχου αντί να αφήνεις κάθε συσκευή να εκπέμπει συνεχώς. Κατέγραψε το πρόγραμμα σήματος στην κάρτα διαδρομής.\n\n## Πηγές αναφοράς\n- Ready.gov — σχέδιο επικοινωνίας: https://www.ready.gov/plan\n- U.S. Coast Guard — μέσα σήματος κινδύνου: https://www.uscgboating.org/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":215,"en":{"title":"Home Fire: Smoke Escape, Door Check, and Meeting Point","body":"A home fire can become unsurvivable quickly. The household plan should prioritize immediate escape, closed doors where appropriate, crawling low when smoke conditions require it, and a fixed meeting point outside—not fighting the fire.\n\n## Know two ways out when possible\nKeep exits, keys and stairs usable. Practice an alternate route from bedrooms and identify who assists children, older adults, disabled people or animals without delaying everyone. Security bars/locks must have a safe emergency-release plan consistent with local fire code.\n\n## Treat smoke as the main route problem\nIf smoke blocks the normal route, use the alternate if it is safe. Stay low beneath smoke as taught by fire-safety authorities. Before opening a closed door on an escape route, check it according to fire-service guidance; if heat/smoke indicates fire on the other side, use the alternate route and keep the door closed.\n\n## Once outside, stay outside\nMeet at the preselected point so responders know whether someone is missing. Call emergency services from outside. Do not re-enter for property or animals. Tell firefighters exactly who may be inside and the last known location.\n\n## Verification sources\n- U.S. Fire Administration — home fire escape planning: https://www.usfa.fema.gov/prevention/home-fires/prepare-for-fire/home-fire-escape-plans/\n- Ready.gov — home fires: https://www.ready.gov/home-fires\n\nVerification date: 2026-08-09."},"el":{"title":"Οικιακή φωτιά: διαφυγή από καπνό, έλεγχος πόρτας και σημείο συνάντησης","body":"Μια οικιακή φωτιά μπορεί να γίνει μη επιβιώσιμη πολύ γρήγορα. Το σχέδιο πρέπει να δίνει προτεραιότητα στην άμεση διαφυγή, σε κλειστές πόρτες όπου ενδείκνυται, σε χαμηλή κίνηση όταν υπάρχει καπνός και σε σταθερό σημείο συνάντησης έξω — όχι στην κατάσβεση της περιουσίας.\n\n## Δύο έξοδοι όπου είναι δυνατό\nΚράτα εξόδους, κλειδιά και σκάλες λειτουργικά. Εξασκήσου σε εναλλακτική διαδρομή από υπνοδωμάτια και όρισε ποιος βοηθά παιδιά, ηλικιωμένους, άτομα με αναπηρία ή ζώα χωρίς να καθυστερεί όλη την ομάδα. Κάγκελα/κλειδαριές χρειάζονται ασφαλές σχέδιο επείγουσας απελευθέρωσης συμβατό με τον τοπικό κανονισμό.\n\n## Ο καπνός καθορίζει τη διαδρομή\nΑν ο καπνός κλείνει τη συνηθισμένη έξοδο, χρησιμοποίησε την εναλλακτική μόνο αν είναι ασφαλής. Κινήσου χαμηλά όταν αυτό διδάσκεται από τις πυροσβεστικές αρχές. Πριν ανοίξεις κλειστή πόρτα στη διαδρομή, έλεγξέ την όπως ορίζει η πυροσβεστική καθοδήγηση· αν θερμότητα ή καπνός υποδηλώνουν φωτιά από την άλλη πλευρά, κράτησέ την κλειστή και χρησιμοποίησε άλλη έξοδο.\n\n## Έξω σημαίνει έξω\nΣυναντηθείτε στο προκαθορισμένο σημείο ώστε οι διασώστες να ξέρουν αν λείπει κάποιος. Κάλεσε από έξω. Μην ξαναμπείς για αντικείμενα ή ζώα. Ενημέρωσε τους πυροσβέστες ποιος μπορεί να βρίσκεται μέσα και την τελευταία γνωστή θέση.\n\n## Πηγές επαλήθευσης\n- U.S. Fire Administration — σχέδιο οικιακής διαφυγής: https://www.usfa.fema.gov/prevention/home-fires/prepare-for-fire/home-fire-escape-plans/\n- Ready.gov — οικιακές πυρκαγιές: https://www.ready.gov/home-fires\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":216,"en":{"title":"Electrical Fire: Breaker, Water, and Re-Energization Boundaries","body":"Electrical faults can ignite wiring, appliances, batteries or extension leads. Electricity also changes how a fire can be approached: water and conductive tools may create shock hazards.\n\n## Escape if the fire is not immediately controllable\nSound the alarm, get people out and call emergency services. Only attempt extinguisher use if the fire is small, you have the correct extinguisher/training, smoke is limited and a clear escape remains behind you. Never let “saving the inverter” block the exit.\n\n## Disconnect power only from a safe position\nIf a known breaker/disconnect can be operated without entering smoke, water or the fire area, isolation may reduce hazard. Do not touch a wet electrical panel, exposed conductors or equipment in standing water. Do not pull a burning plug by grabbing damaged cable.\n\n## Do not re-energize by trial\nAfter fire, flooding, arcing or heat damage, a breaker staying on does not prove the circuit is safe. Burned insulation and hidden connections can fail later. Keep affected circuits/equipment isolated until inspected by a qualified electrician or authority.\n\n## Record what happened\nNote circuit, device, smell/sound, breaker behavior, water exposure and photographs from a safe position. Do not dismantle critical evidence before insurance/fire/electrical review when that review is required.\n\n## Verification sources\n- U.S. Fire Administration — electrical fire safety: https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/electrical/\n- Electrical Safety Foundation International: https://www.esfi.org/\n\nVerification date: 2026-08-09."},"el":{"title":"Ηλεκτρική φωτιά: διακόπτης, νερό και όρια επανατροφοδότησης","body":"Ηλεκτρική βλάβη μπορεί να αναφλέξει καλωδίωση, συσκευή, μπαταρία ή προέκταση. Ο ηλεκτρισμός αλλάζει επίσης τον τρόπο αντιμετώπισης: νερό και αγώγιμα εργαλεία μπορούν να δημιουργήσουν κίνδυνο ηλεκτροπληξίας.\n\n## Διαφυγή όταν η φωτιά δεν είναι άμεσα ελεγχόμενη\nΕνεργοποίησε συναγερμό, βγάλε ανθρώπους και κάλεσε υπηρεσίες. Προσπάθεια με πυροσβεστήρα γίνεται μόνο αν η φωτιά είναι μικρή, υπάρχει σωστός εξοπλισμός/εκπαίδευση, περιορισμένος καπνός και καθαρή έξοδος πίσω σου. Μην αφήσεις την προσπάθεια «να σωθεί ο μετατροπέας» να κλείσει τη διαφυγή.\n\n## Απομόνωση ρεύματος μόνο από ασφαλή θέση\nΑν γνωστός διακόπτης/αποζεύκτης μπορεί να λειτουργήσει χωρίς είσοδο σε καπνό, νερό ή ζώνη φωτιάς, η απομόνωση μπορεί να μειώσει τον κίνδυνο. Μην αγγίζεις βρεγμένο πίνακα, εκτεθειμένους αγωγούς ή εξοπλισμό μέσα σε στάσιμο νερό. Μην τραβάς καμένο φις πιάνοντας χαλασμένο καλώδιο.\n\n## Καμία δοκιμαστική επανατροφοδότηση\nΜετά από φωτιά, πλημμύρα, ηλεκτρικό τόξο ή θερμική ζημιά, το ότι ο διακόπτης «μένει επάνω» δεν αποδεικνύει ασφάλεια. Καμένη μόνωση και κρυφές συνδέσεις μπορεί να αποτύχουν αργότερα. Κράτησε επηρεασμένα κυκλώματα και συσκευές απομονωμένα μέχρι έλεγχο από κατάλληλο ηλεκτρολόγο ή αρχή.\n\n## Κατέγραψε το συμβάν\nΣημείωσε κύκλωμα, συσκευή, μυρωδιά/ήχο, συμπεριφορά διακόπτη, έκθεση σε νερό και φωτογραφίες από ασφαλή θέση. Μην διαλύεις κρίσιμα στοιχεία πριν από απαιτούμενο ασφαλιστικό, πυροσβεστικό ή ηλεκτρολογικό έλεγχο.\n\n## Πηγές επαλήθευσης\n- U.S. Fire Administration — ηλεκτρική πυρασφάλεια: https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/electrical/\n- Electrical Safety Foundation International — ηλεκτρική ασφάλεια: https://www.esfi.org/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":217,"en":{"title":"Portable Fuel Stove/Canister: Storage, Leaks, and Indoor Boundaries","body":"Camping stoves and fuel canisters are useful equipment outdoors, but using them as improvised indoor kitchen/heating systems can create fire, explosion and carbon-monoxide hazards. Equipment labels and local fire rules define where a device may operate.\n\n## Store fuel separately and cool\nKeep canisters/cylinders away from heat, flame, direct sun and vehicle interiors that can become extremely hot. Protect valves from impact. Do not store leaking or heavily corroded containers with normal supplies.\n\n## Check the connection before ignition\nUse only the fuel type and connector intended by the manufacturer. Inspect seals/threads and stop if you smell fuel or hear leakage. Move away from ignition sources and ventilate according to product/emergency guidance. Never search for a leak with a flame.\n\n## Outdoor means outdoor\nA tent, closed balcony, garage with the door partly open, vehicle or small shelter may still trap combustion gases. Do not use outdoor-only fuel-burning appliances inside. Cooking in an outage should be organized around a genuinely safe outdoor location or equipment explicitly rated for the intended indoor use.\n\n## Fire control\nKeep the stove stable and clear of dry vegetation, fabric and children. Have an escape/fire-response plan. Do not move a burning fuel appliance unless its instructions and conditions make that safe.\n\n## Verification sources\n- CDC — carbon monoxide and portable generators/fuel burning: https://www.cdc.gov/carbon-monoxide/about/index.html\n- U.S. Fire Administration — cooking fire safety: https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/cooking/\n\nVerification date: 2026-08-09."},"el":{"title":"Φορητή εστία/δοχείο καυσίμου: αποθήκευση, διαρροές και όρια εσωτερικού χώρου","body":"Οι φορητές εστίες και τα δοχεία καυσίμου είναι χρήσιμος εξωτερικός εξοπλισμός, όμως η πρόχειρη χρήση τους ως εσωτερική κουζίνα ή θέρμανση μπορεί να δημιουργήσει φωτιά, έκρηξη και μονοξείδιο. Η ετικέτα της συσκευής και οι τοπικοί κανόνες καθορίζουν πού επιτρέπεται να λειτουργήσει.\n\n## Αποθήκευση καυσίμου σε δροσερό ξεχωριστό σημείο\nΚράτα δοχεία μακριά από θερμότητα, φλόγα, άμεσο ήλιο και εσωτερικό οχήματος που υπερθερμαίνεται. Προστάτευσε βαλβίδες από χτύπημα. Δοχείο που διαρρέει ή έχει έντονη διάβρωση δεν αποθηκεύεται μαζί με τα φυσιολογικά εφόδια.\n\n## Έλεγχος σύνδεσης πριν την ανάφλεξη\nΧρησιμοποίησε μόνο καύσιμο και σύνδεση που προβλέπει ο κατασκευαστής. Έλεγξε παρεμβύσματα/σπειρώματα και σταμάτησε αν μυρίζεις καύσιμο ή ακούς διαρροή. Απομακρύνσου από πηγές ανάφλεξης και αέρισε σύμφωνα με τις οδηγίες. Ποτέ μην ψάχνεις διαρροή με φλόγα.\n\n## «Εξωτερικού χώρου» σημαίνει πραγματικά έξω\nΣκηνή, κλειστό μπαλκόνι, γκαράζ με μισάνοιχτη πόρτα, όχημα ή μικρό καταφύγιο μπορούν να παγιδεύουν αέρια καύσης. Μην χρησιμοποιείς συσκευές εξωτερικού χώρου μέσα. Το μαγείρεμα σε διακοπή οργανώνεται σε πραγματικά ασφαλή εξωτερική θέση ή με εξοπλισμό που έχει ρητή έγκριση για την προβλεπόμενη εσωτερική χρήση.\n\n## Έλεγχος φωτιάς\nΚράτα την εστία σταθερή, μακριά από ξηρή βλάστηση, ύφασμα και παιδιά. Έχε σχέδιο διαφυγής/πυρασφάλειας. Μην μετακινείς αναμμένη συσκευή καυσίμου εκτός αν οι οδηγίες και οι συνθήκες το επιτρέπουν με ασφάλεια.\n\n## Πηγές επαλήθευσης\n- CDC — μονοξείδιο και συσκευές καύσης: https://www.cdc.gov/carbon-monoxide/about/index.html\n- U.S. Fire Administration — πυρασφάλεια μαγειρέματος: https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/cooking/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":218,"en":{"title":"Urban Debris: Glass, Nails, and a Safer Foot Route","body":"After earthquake, wind, explosion or fire, a familiar street can become an injury field of glass, nails, sharp sheet metal, unstable facades and hidden holes. Route choice and footwear can prevent an otherwise minor evacuation from becoming a wound-care problem.\n\n## Dress for the route\nUse sturdy closed footwear, long trousers and gloves appropriate to the debris task. Eye protection is useful where dust or fragments are being moved. Do not use thin sandals for building re-entry or debris routes simply because the weather is hot.\n\n## Look upward as well as downward\nDamaged signs, glazing, balconies, tiles and masonry can fall after the main event. Avoid walking directly beside visibly damaged facades and keep distance from leaning walls or partially detached material. Aftershocks/wind can release items that initially stayed in place.\n\n## Mark hazards for the next person\nIf a route contains an open hole, sharp protrusion or unstable area, mark/record it without creating another trip hazard. Share the alternate route in the household handover. Keep children and animals out of cleanup zones.\n\n## Wound prevention is easier than wound treatment\nDo not reach blindly into debris piles. Use tools rather than hands where possible and never lift heavy unstable material alone. Any puncture/cut from contaminated debris should be cleaned and assessed according to wound/tetanus guidance rather than ignored because evacuation is busy.\n\n## Verification sources\n- CDC — cleanup safety after disasters: https://www.cdc.gov/natural-disasters/safety/index.html\n- OSHA — disaster cleanup resources: https://www.osha.gov/emergency-preparedness/cleanup\n\nVerification date: 2026-08-09."},"el":{"title":"Αστικά συντρίμμια: γυαλιά, καρφιά και ασφαλέστερη πεζή διαδρομή","body":"Μετά από σεισμό, άνεμο, έκρηξη ή φωτιά, ένας γνωστός δρόμος μπορεί να μετατραπεί σε πεδίο τραυματισμού με γυαλιά, καρφιά, κοφτερά μέταλλα, ασταθείς προσόψεις και κρυφές τρύπες. Η επιλογή διαδρομής και τα υποδήματα μπορούν να εμποδίσουν μια απλή εκκένωση να γίνει πρόβλημα τραύματος.\n\n## Ντύσιμο για τη διαδρομή\nΧρησιμοποίησε ανθεκτικά κλειστά παπούτσια, μακρύ παντελόνι και γάντια κατάλληλα για το έργο. Προστασία ματιών είναι χρήσιμη όταν μετακινούνται σκόνη ή θραύσματα. Μην μπαίνεις σε κτίριο ή συντρίμμια με λεπτά σανδάλια μόνο επειδή κάνει ζέστη.\n\n## Κοίτα πάνω και κάτω\nΚατεστραμμένες πινακίδες, τζάμια, μπαλκόνια, κεραμίδια και τοιχοποιία μπορούν να πέσουν μετά το κύριο συμβάν. Απόφυγε διαδρομή ακριβώς δίπλα σε ορατά κατεστραμμένη πρόσοψη και κράτα απόσταση από κεκλιμένους τοίχους ή μισοαποκολλημένα στοιχεία. Μετασεισμός ή άνεμος μπορεί να απελευθερώσει αντικείμενο που αρχικά έμεινε στη θέση του.\n\n## Σήμανε τον κίνδυνο για τον επόμενο\nΑν υπάρχει ανοιχτή τρύπα, αιχμηρή προεξοχή ή ασταθής ζώνη, σήμανέ την ή κατέγραψέ την χωρίς να δημιουργήσεις νέο εμπόδιο. Μοιράσου την εναλλακτική διαδρομή στην παράδοση ομάδας. Κράτα παιδιά και ζώα έξω από ζώνες καθαρισμού.\n\n## Η πρόληψη τραύματος είναι ευκολότερη από τη θεραπεία\nΜην βάζεις χέρια στα τυφλά μέσα σε σωρό. Χρησιμοποίησε εργαλεία όπου είναι δυνατό και μην σηκώνεις βαρύ ασταθές υλικό μόνος. Τρύπημα ή κόψιμο από μολυσμένα συντρίμμια χρειάζεται καθαρισμό και αξιολόγηση σύμφωνα με οδηγίες τραυμάτων/τετάνου, όχι αγνόηση επειδή όλοι είναι απασχολημένοι.\n\n## Πηγές επαλήθευσης\n- CDC — ασφάλεια καθαρισμού μετά από καταστροφές: https://www.cdc.gov/natural-disasters/safety/index.html\n- OSHA — πόροι καθαρισμού καταστροφών: https://www.osha.gov/emergency-preparedness/cleanup\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":219,"en":{"title":"Evacuation Center Arrival: Registration, Medicine, and Privacy","body":"Arriving at an evacuation center is a transition, not the end of the plan. Crowding, noise, unfamiliar routines and limited power/storage can create new problems for medicines, accessibility, children, animals and privacy.\n\n## Register and preserve accountability\nFollow the center's registration/check-in process and tell household contacts where you are when safe. Keep the group meeting rule active: children and dependent adults should know which staff point or household member to approach if separated.\n\n## Declare critical needs early\nTell staff promptly about mobility/communication accommodations, powered medical equipment, refrigeration-dependent medication, serious food allergy, service animals and urgent prescription gaps. Do not wait until a battery or dose is almost exhausted. Keep medication in original labeled packaging where possible and maintain your own medication list.\n\n## Protect identity and essential documents\nCarry the minimum documents needed for services in a controlled pouch. Do not publicly display full IDs, medical details or contact lists more than necessary. Shared charging stations and public Wi-Fi should not be treated as trusted places for sensitive accounts; prioritize charging and use local/offline copies when possible.\n\n## Reassess daily\nShelter conditions, road access and household needs change. Review the next 24 hours: medicines, charging, food/allergies, bathing/toilet access, sleep, animals, communication and expected relocation. Update the handover brief rather than relying on yesterday's assumptions.\n\n## Source anchors\n- Ready.gov — shelters/evacuation planning: https://www.ready.gov/evacuation\n- American Red Cross — disaster shelter information: https://www.redcross.org/get-help/disaster-relief-and-recovery-services/find-an-open-shelter.html\n\nVerification date: 2026-08-09."},"el":{"title":"Άφιξη σε κέντρο εκκένωσης: καταγραφή, φάρμακα και ιδιωτικότητα","body":"Η άφιξη σε κέντρο εκκένωσης είναι μετάβαση και όχι τέλος του σχεδίου. Συνωστισμός, θόρυβος, άγνωστες διαδικασίες και περιορισμένη ενέργεια/αποθήκευση μπορούν να δημιουργήσουν νέα προβλήματα για φάρμακα, προσβασιμότητα, παιδιά, ζώα και ιδιωτικότητα.\n\n## Καταγραφή και λογοδοσία\nΑκολούθησε τη διαδικασία καταγραφής του κέντρου και ενημέρωσε τις επαφές του νοικοκυριού για τη θέση σου όταν είναι ασφαλές. Ο κανόνας συνάντησης παραμένει ενεργός: παιδιά και εξαρτώμενοι ενήλικες πρέπει να γνωρίζουν ποιο σημείο προσωπικού ή μέλος οικογένειας προσεγγίζουν αν χωριστούν.\n\n## Δήλωσε κρίσιμες ανάγκες νωρίς\nΕνημέρωσε άμεσα για κινητικές/επικοινωνιακές προσαρμογές, ιατρικό εξοπλισμό με ρεύμα, φάρμακα που χρειάζονται ψύξη, σοβαρή τροφική αλλεργία, ζώα υπηρεσίας και επείγον κενό συνταγής. Μην περιμένεις να τελειώσει σχεδόν η μπαταρία ή η επόμενη δόση. Κράτα φάρμακα στην αρχική επισημασμένη συσκευασία όπου είναι δυνατό και δικό σου κατάλογο φαρμάκων.\n\n## Προστάτευσε ταυτότητα και βασικά έγγραφα\nΜετέφερε μόνο τα απαραίτητα έγγραφα σε ελεγχόμενο φάκελο. Μην αφήνεις εκτεθειμένα πλήρη στοιχεία ταυτότητας, ιατρικές λεπτομέρειες ή λίστες επαφών περισσότερο από όσο απαιτείται. Κοινόχρηστοι φορτιστές και δημόσιο Wi-Fi δεν θεωρούνται έμπιστος χώρος για ευαίσθητους λογαριασμούς· δώσε προτεραιότητα στη φόρτιση και σε τοπικά αντίγραφα.\n\n## Καθημερινή επανεκτίμηση\nΣυνθήκες καταφυγίου, δρόμοι και ανάγκες αλλάζουν. Έλεγξε τις επόμενες 24 ώρες: φάρμακα, φόρτιση, τρόφιμα/αλλεργίες, τουαλέτα/μπάνιο, ύπνος, ζώα, επικοινωνία και πιθανή μετακίνηση. Ενημέρωσε το δελτίο παράδοσης αντί να βασίζεσαι στις χθεσινές υποθέσεις.\n\n## Πηγές αναφοράς\n- Ready.gov — εκκένωση και καταφύγια: https://www.ready.gov/evacuation\n- American Red Cross — πληροφορίες καταφυγίων: https://www.redcross.org/get-help/disaster-relief-and-recovery-services/find-an-open-shelter.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":220,"en":{"title":"Offline Survival Knowledge Maintenance Cycle","body":"An offline guide becomes dangerous if nobody notices that phone numbers, medication plans, maps, equipment manuals or official safety guidance have changed. Treat the knowledge base as maintained equipment, not a book written once.\n\n## Separate timeless principles from update-sensitive facts\nPrinciples such as avoiding floodwater or keeping generators outside are relatively stable; evacuation zones, contact numbers, local shelters, medicine instructions, road maps, device firmware/manuals and legal requirements may change. Mark update-sensitive records with the date/source last verified.\n\n## Quarterly household review\nOpen the project without internet and attempt the real tasks: find the emergency card, use the default phone browser, retrieve a route, open the medicine list, export a brief, locate the water chapter and read a Library document. Fix anything that depends on a forgotten password, missing app, dead battery or cloud-only file.\n\n## Annual authoritative refresh\nWhen normal internet is available, re-check the source catalog against official civil-protection, public-health, weather, utility and medical/equipment sources. Replace superseded instructions rather than appending contradictory notes. Run translation and duplicate audits after every content update.\n\n## Preserve multiple forms\nKeep the project on the phone, another local storage device and a small printed core for the few procedures needed when electronics fail. Test backups by restoring them; a backup that has never been opened is an assumption.\n\n## Release rule\nA larger guide is not automatically a better guide. Reject content that cannot name the decision it improves, repeats another chapter, invents clinical/engineering detail, or cannot be maintained in both languages.\n\n## Source anchors\n- Ready.gov — planning and kit maintenance: https://www.ready.gov/plan\n- Greek Civil Protection — current self-protection instructions: https://civilprotection.gov.gr/odigies-prostasias\n\nVerification date: 2026-08-09."},"el":{"title":"Κύκλος συντήρησης γνώσης επιβίωσης χωρίς σύνδεση","body":"Ένας offline οδηγός μπορεί να γίνει επικίνδυνος αν κανείς δεν παρατηρήσει ότι τηλέφωνα, φαρμακευτικά σχέδια, χάρτες, εγχειρίδια εξοπλισμού ή επίσημες οδηγίες έχουν αλλάξει. Αντιμετώπισε τη βάση γνώσης ως εξοπλισμό που συντηρείται και όχι ως βιβλίο που γράφτηκε μία φορά.\n\n## Ξεχώρισε σταθερές αρχές από στοιχεία που γερνούν\nΑρχές όπως η αποφυγή πλημμυρικού νερού ή η χρήση γεννήτριας μόνο έξω είναι σχετικά σταθερές· ζώνες εκκένωσης, τηλέφωνα, τοπικά καταφύγια, οδηγίες φαρμάκων, οδικοί χάρτες, εγχε
