d substances. If an object remains embedded, stabilise around it according to first-aid training and wait for qualified care. Keep the person protected from cold or overheating while monitoring responsiveness and breathing.\n\n## Training and escalation\nA household should practice first-aid activation, glove access, direct-pressure positioning, and emergency calling before a disaster. Severe bleeding, altered responsiveness, breathing difficulty, or signs of shock require emergency medical care. In Greece and the EU, use 112; where another local medical emergency number is designated, follow local instructions.\n\n## Source anchors\n- American Red Cross: Life-threatening external bleeding.\n- American Red Cross: First Aid for Severe Trauma training.\n- Local emergency medical service guidance."},"el":{"title":"Απειλητική για τη ζωή αιμορραγία: όρια πρώτων βοηθειών σε offline αναφορά","body":"## Πρώτα η ασφάλεια του χώρου\nΣοβαρή αιμορραγία μπορεί να προκύψει από μπάζα, γυαλί, τροχαίο, εργαλεία ή δομικές ζημιές. Μην γίνεις δεύτερο θύμα μπαίνοντας σε κίνηση οχημάτων, ασταθή ερείπια, ηλεκτρικό κίνδυνο, φωτιά ή μολυσμένο νερό. Κάλεσε νωρίς τον αρμόδιο αριθμό έκτακτης ανάγκης και χρησιμοποίησε γάντια ή άλλο φραγμό όταν υπάρχει.\n\n## Η άμεση πίεση είναι η βασική αρχική ενέργεια\nΗ καθοδήγηση του American Red Cross για απειλητική εξωτερική αιμορραγία ξεκινά με εντοπισμό της πηγής, τοποθέτηση επιθέματος όπου υπάρχει και σταθερή, ισχυρή άμεση πίεση. Διατήρησέ την ενώ ενεργοποιείται βοήθεια. Μην σηκώνεις συνεχώς το επίθεμα για «έλεγχο» αν αυτό διακόπτει την αποτελεσματική πίεση. Αν διαποτιστεί, ακολούθησε την εκπαίδευση πρώτων βοηθειών και όχι αυτοσχέδιο χειρισμό του θρόμβου.\n\n## Τουρνικέ και πλήρωση τραύματος είναι δεξιότητες εκπαίδευσης\nΣύγχρονα συστήματα πρώτων βοηθειών χρησιμοποιούν σε ορισμένες περιπτώσεις τουρνικέ για βαριά αιμορραγία άκρου και πλήρωση βαθιού τραύματος, αλλά η σωστή εφαρμογή έχει σημασία. Το έργο πρέπει να υπενθυμίζει σε εκπαιδευμένο άτομο να ακολουθεί την τεχνική και τις οδηγίες της συσκευής και όχι να παρουσιάζει μια παράγραφο ως υποκατάστατο πρακτικής εκπαίδευσης. Κατέγραψε την ώρα εφαρμογής τουρνικέ και παρέδωσέ την στους διασώστες.\n\n## Μην αυτοσχεδιάζεις επεμβατική θεραπεία\nΜην εξερευνάς το τραύμα, μην σπρώχνεις εκτεθειμένο ιστό προς τα μέσα, μην αφαιρείς βαθιά σφηνωμένο αντικείμενο και μην βάζεις χημικά, σκόνες, καφέ, στάχτη ή οικιακές ουσίες. Αν υπάρχει ενσφηνωμένο αντικείμενο, σταθεροποίησέ το σύμφωνα με εκπαίδευση πρώτων βοηθειών και περίμενε εξειδικευμένη φροντίδα. Προστάτεψε το άτομο από κρύο ή υπερθέρμανση και παρακολούθησε ανταπόκριση και αναπνοή.\n\n## Εκπαίδευση και κλιμάκωση\nΈνα νοικοκυριό πρέπει να εξασκεί εκ των προτέρων την κλήση βοήθειας, την πρόσβαση σε γάντια και τη σωστή θέση για άμεση πίεση. Σοβαρή αιμορραγία, μεταβολή συνείδησης, δυσκολία αναπνοής ή σημεία καταπληξίας απαιτούν επείγουσα ιατρική φροντίδα. Στην Ελλάδα και την ΕΕ χρησιμοποίησε το 112.\n\n## Πηγές αναφοράς\n- American Red Cross: απειλητική εξωτερική αιμορραγία.\n- American Red Cross: εκπαίδευση σοβαρού τραύματος.\n- Τοπική υπηρεσία επείγουσας ιατρικής βοήθειας."}},{"id":18,"en":{"title":"Burns after fire, scald, electricity, or chemicals","body":"## Stop the source without creating a second injury\nBefore treating a burn, make sure the person is no longer exposed to flame, hot liquid, live electricity, steam, or chemical splash. Do not touch a person who is still in contact with an energised electrical source. For chemical exposure, avoid contaminating yourself and follow the product or emergency-service decontamination instructions.\n\n## Cool thermal burns with safe running water when appropriate\nModern first-aid guidance favours cooling a thermal burn with clean, cool running water rather than ice. Ice and extremely cold applications can injure tissue further. Remove jewellery or tight items early if they are not stuck, because swelling can occur. Do not pull clothing or material that is adherent to the burn.\n\n## Avoid household remedies\nButter, toothpaste, oil, powders, creams not specifically recommended, and other household substances can trap heat, contaminate the injury, or make later medical assessment harder. After appropriate cooling, protect the area with a clean non-stick covering according to first-aid guidance. Large, deep, electrical, chemical, airway, facial, hand, genital, major-joint, or circumferential burns need a lower threshold for professional assessment.\n\n## Electrical burns may hide internal injury\nA small skin mark does not show the full effect of electrical current. Make the power source safe before approach and obtain medical evaluation when significant electrical exposure is suspected. Lightning injury is also a medical emergency and can affect heart rhythm, breathing, the nervous system, and hearing even when skin damage appears limited.\n\n## Watch the whole person\nA burn incident may also involve smoke inhalation, trauma, hypothermia after cooling, or shock. Difficulty breathing, facial burns with soot, altered responsiveness, or severe pain are reasons to escalate urgently. The purpose of the offline chapter is to help the household avoid harmful improvisation, not replace a first-aid course.\n\n## Source anchors\n- American Red Cross: Burns first aid.\n- American Red Cross: Learn First Aid resources.\n- Local emergency medical service."},"el":{"title":"Εγκαύματα από φωτιά, ζεστό υγρό, ηλεκτρισμό ή χημικά","body":"## Σταμάτησε την πηγή χωρίς να δημιουργήσεις δεύτερο τραυματισμό\nΠριν αντιμετωπίσεις ένα έγκαυμα, βεβαιώσου ότι το άτομο δεν εκτίθεται πλέον σε φλόγα, καυτό υγρό, ενεργό ηλεκτρικό ρεύμα, ατμό ή χημικό. Μην αγγίζεις άνθρωπο που παραμένει σε επαφή με ηλεκτρική πηγή υπό τάση. Σε χημική έκθεση, προστάτεψε τον εαυτό σου από επιμόλυνση και ακολούθησε τις οδηγίες του προϊόντος ή των υπηρεσιών για απορρύπανση.\n\n## Ψύξε θερμικό έγκαυμα με ασφαλές δροσερό τρεχούμενο νερό όπου ενδείκνυται\nΗ σύγχρονη καθοδήγηση πρώτων βοηθειών προτιμά δροσερό τρεχούμενο νερό και όχι πάγο. Πάγος και εξαιρετικά ψυχρές εφαρμογές μπορούν να τραυματίσουν περισσότερο τον ιστό. Αφαίρεσε κοσμήματα ή στενά αντικείμενα νωρίς αν δεν έχουν κολλήσει, επειδή μπορεί να αναπτυχθεί οίδημα. Μην τραβάς ρούχο ή υλικό που έχει προσκολληθεί στο τραύμα.\n\n## Απόφυγε οικιακές «θεραπείες»\nΒούτυρο, οδοντόκρεμα, λάδι, σκόνες, μη συνιστώμενες κρέμες και άλλες ουσίες μπορούν να κρατήσουν θερμότητα, να μολύνουν το τραύμα ή να δυσκολέψουν την ιατρική εκτίμηση. Μετά την κατάλληλη ψύξη, προστάτεψε την περιοχή με καθαρό μη προσκολλητικό κάλυμμα σύμφωνα με εκπαίδευση πρώτων βοηθειών. Μεγάλα, βαθιά, ηλεκτρικά, χημικά, εγκαύματα αεραγωγού, προσώπου, χεριών, γεννητικών οργάνων, μεγάλων αρθρώσεων ή κυκλοτερή εγκαύματα χρειάζονται χαμηλό όριο για επαγγελματική αξιολόγηση.\n\n## Τα ηλεκτρικά εγκαύματα μπορεί να κρύβουν εσωτερική βλάβη\nΜικρό σημάδι στο δέρμα δεν δείχνει όλη τη διαδρομή του ρεύματος. Κάνε πρώτα ασφαλή την πηγή και ζήτησε ιατρική αξιολόγηση όταν υπάρχει σημαντική ηλεκτρική έκθεση. Ο κεραυνός είναι επίσης ιατρικό επείγον και μπορεί να επηρεάσει καρδιά, αναπνοή, νευρικό σύστημα και ακοή ακόμη και με περιορισμένη δερματική βλάβη.\n\n## Παρακολούθησε ολόκληρο το άτομο\nΈνα περιστατικό εγκαύματος μπορεί να περιλαμβάνει εισπνοή καπνού, τραύμα, υποθερμία μετά από ψύξη ή καταπληξία. Δυσκολία αναπνοής, εγκαύματα προσώπου με αιθάλη, αλλαγή ανταπόκρισης ή έντονος πόνος απαιτούν άμεση κλιμάκωση. Ο σκοπός του offline κεφαλαίου είναι να αποτρέπει επικίνδυνους αυτοσχεδιασμούς και όχι να αντικαθιστά εκπαίδευση.\n\n## Πηγές αναφοράς\n- American Red Cross: πρώτες βοήθειες σε εγκαύματα.\n- American Red Cross: εκπαιδευτικό υλικό πρώτων βοηθειών.\n- Τοπική υπηρεσία επείγουσας ιατρικής βοήθειας."}},{"id":19,"en":{"title":"Choking response: recognition, training, and handover","body":"## Distinguish effective coughing from severe obstruction\nA person who can cough forcefully or speak still has some airflow and should generally be encouraged to keep coughing while being closely observed. Severe choking may present with inability to speak, cough effectively, or breathe, with silent distress and rapidly worsening colour or responsiveness. Activate emergency help when the obstruction is severe.\n\n## Adult and child techniques should be learned hands-on\nCurrent American Red Cross guidance for a responsive choking adult or child uses cycles of five back blows and five abdominal thrusts when appropriate. Technique changes for infants and for some body types or conditions, which is why a household reference should point toward current first-aid training rather than compress all variations into one generic instruction. Practice with training equipment, not on healthy people with force.\n\n## Never perform a blind finger sweep\nDo not reach into the mouth for an object you cannot see. Blind sweeps can push an obstruction deeper or injure tissue. If an object is clearly visible and easily removable, follow current first-aid training. If the person becomes unresponsive, the response transitions to CPR/AED procedures and emergency medical care according to training.\n\n## Plan for children and high-risk meals\nHouseholds with young children should control food size and eating posture, keep small non-food objects out of reach, and ensure caregivers know the infant-specific response. During outages, dim lighting and hurried eating can increase risk; avoid feeding while walking, driving, or during chaotic evacuation movement.\n\n## Document after the event\nEven if the object is expelled and the person appears better, professional assessment may be needed after a severe choking event, especially if symptoms persist. Record what happened, any first-aid actions, and whether the person lost responsiveness so responders receive an accurate handover.\n\n## Source anchors\n- American Red Cross: Adult and child choking first aid.\n- American Red Cross: Infant choking first aid.\n- CPR/AED/First Aid training provider."},"el":{"title":"Πνιγμονή από ξένο σώμα: αναγνώριση, εκπαίδευση και παράδοση","body":"## Ξεχώρισε τον αποτελεσματικό βήχα από τη σοβαρή απόφραξη\nΆτομο που μπορεί να βήξει δυνατά ή να μιλήσει εξακολουθεί να έχει κάποια ροή αέρα και συνήθως ενθαρρύνεται να συνεχίσει τον βήχα με στενή παρακολούθηση. Σοβαρή πνιγμονή μπορεί να εμφανιστεί με αδυναμία ομιλίας, αποτελεσματικού βήχα ή αναπνοής, σιωπηλή δυσφορία και ταχεία αλλαγή χρώματος ή ανταπόκρισης. Ενεργοποίησε επείγουσα βοήθεια όταν η απόφραξη είναι σοβαρή.\n\n## Οι τεχνικές για ενήλικα και παιδί πρέπει να μαθαίνονται πρακτικά\nΗ τρέχουσα καθοδήγηση του American Red Cross για ανταποκρινόμενο ενήλικα ή παιδί χρησιμοποιεί κύκλους πέντε χτυπημάτων στην πλάτη και πέντε κοιλιακών ωθήσεων όπου είναι κατάλληλο. Η τεχνική αλλάζει για βρέφη και για ορισμένες σωματικές καταστάσεις, γι’ αυτό μια οικιακή αναφορά πρέπει να οδηγεί σε σύγχρονη εκπαίδευση πρώτων βοηθειών και όχι να συμπιέζει όλες τις περιπτώσεις σε μία οδηγία. Η εξάσκηση γίνεται σε εκπαιδευτικό εξοπλισμό και όχι με δύναμη σε υγιή άτομα.\n\n## Ποτέ τυφλή σάρωση με το δάχτυλο\nΜην βάζεις δάχτυλο στο στόμα για αντικείμενο που δεν βλέπεις. Μπορεί να το σπρώξεις βαθύτερα ή να τραυματίσεις ιστό. Αν το αντικείμενο φαίνεται καθαρά και αφαιρείται εύκολα, ακολούθησε την ισχύουσα εκπαίδευση. Αν το άτομο χάσει την ανταπόκριση, η αντιμετώπιση περνά σε διαδικασίες ΚΑΡΠΑ/απινιδωτή και επείγουσα ιατρική φροντίδα ανάλογα με την εκπαίδευση.\n\n## Σχεδιασμός για παιδιά και γεύματα υψηλού κινδύνου\nΣε σπίτι με μικρά παιδιά, έλεγξε το μέγεθος τροφών και τη στάση κατά το φαγητό, κράτα μικρά αντικείμενα μακριά και βεβαιώσου ότι οι φροντιστές γνωρίζουν την ειδική αντιμετώπιση βρέφους. Σε διακοπή ρεύματος, χαμηλός φωτισμός και βιαστικό φαγητό αυξάνουν τον κίνδυνο· απόφυγε σίτιση ενώ κάποιος περπατά, οδηγεί ή μετακινείται μέσα σε χαοτική εκκένωση.\n\n## Καταγραφή μετά το περιστατικό\nΑκόμη κι αν το αντικείμενο αποβληθεί και το άτομο φαίνεται καλά, μπορεί να χρειάζεται επαγγελματική αξιολόγηση μετά από σοβαρό επεισόδιο, ειδικά αν παραμένουν συμπτώματα. Κατέγραψε τι συνέβη, ποιες πρώτες βοήθειες έγιναν και αν υπήρξε απώλεια ανταπόκρισης για σωστή παράδοση στους διασώστες.\n\n## Πηγές αναφοράς\n- American Red Cross: πνιγμονή ενηλίκου και παιδιού.\n- American Red Cross: πνιγμονή βρέφους.\n- Πιστοποιημένη εκπαίδευση ΚΑΡΠΑ, απινιδωτή και πρώτων βοηθειών."}},{"id":20,"en":{"title":"Heat illness recognition and operational escalation","body":"## Heat exhaustion and heat stroke are not the same problem\nHeavy sweating, weakness, dizziness, nausea, cramps, headache, and cool or clammy skin can occur with heat exhaustion. Heat stroke is more dangerous and may involve altered mental status, collapse, seizures, or other signs that the body is failing to control temperature. When a person becomes confused or unresponsive in the heat, treat the situation as a medical emergency rather than waiting to see whether rest alone helps.\n\n## Move away from heat and begin cooling\nStop exertion, move to shade or an air-conditioned/cooler area, loosen unnecessary clothing, and use active cooling appropriate to your training and available resources. For suspected heat stroke, activate emergency medical services immediately and cool the person while help is coming. Do not delay the emergency call while searching the house for a thermometer.\n\n## Hydration is not a universal treatment for every sick person\nA conscious person with heat exhaustion may be able to take fluids according to first-aid guidance, but someone who is confused, vomiting repeatedly, having a seizure, or not fully awake should not be forced to drink. Medical conditions and medications can also change fluid requirements. The household water planner is therefore for logistics, not for prescribing treatment volumes.\n\n## Prevention requires work design\nMove heavy tasks out of the hottest part of the day where possible, increase rest, use shade, allow acclimatisation, and pair people so deterioration is noticed. Check older adults, children, people with chronic illness, pregnant people, and anyone without reliable cooling more frequently. A power outage during a heatwave can justify early relocation before symptoms appear.\n\n## Record environmental and personal warning signs\nThe Field Log can store indoor temperature, power availability, cooling location, water consumption trend, and observed symptoms. These records help the next shift see whether conditions are worsening instead of judging each moment in isolation.\n\n## Source anchors\n- Ready.gov: Extreme heat.\n- American Red Cross: Heat exhaustion and heat stroke.\n- Greek Civil Protection: Heatwave instructions."},"el":{"title":"Αναγνώριση θερμικής νόσου και επιχειρησιακή κλιμάκωση","body":"## Η θερμική εξάντληση και η θερμοπληξία δεν είναι το ίδιο πρόβλημα\nΈντονη εφίδρωση, αδυναμία, ζάλη, ναυτία, κράμπες, πονοκέφαλος και δροσερό ή υγρό δέρμα μπορούν να εμφανιστούν στη θερμική εξάντληση. Η θερμοπληξία είναι πολύ πιο επικίνδυνη και μπορεί να περιλαμβάνει σύγχυση, κατάρρευση, σπασμούς ή άλλες ενδείξεις αποτυχίας ρύθμισης της θερμοκρασίας. Αν κάποιος γίνει μπερδεμένος ή χάσει την ανταπόκριση στη ζέστη, αντιμετώπισε το περιστατικό ως ιατρικό επείγον και μην περιμένεις απλώς να «ξεκουραστεί».\n\n## Απομάκρυνε από τη ζέστη και ξεκίνα ψύξη\nΣταμάτησε την προσπάθεια, μετακίνησε το άτομο σε σκιά ή πιο δροσερό/κλιματιζόμενο χώρο, χαλάρωσε περιττά ρούχα και χρησιμοποίησε ενεργή ψύξη κατάλληλη για την εκπαίδευση και τα διαθέσιμα μέσα. Σε υποψία θερμοπληξίας ενεργοποίησε άμεσα επείγουσα ιατρική βοήθεια και ψύξε το άτομο όσο έρχεται βοήθεια. Μην καθυστερείς την κλήση ψάχνοντας θερμόμετρο.\n\n## Η ενυδάτωση δεν είναι καθολική θεραπεία για κάθε άρρωστο άτομο\nΣυνειδητό άτομο με θερμική εξάντληση μπορεί να μπορεί να πάρει υγρά σύμφωνα με πρώτες βοήθειες, αλλά άνθρωπος με σύγχυση, επαναλαμβανόμενο εμετό, σπασμούς ή μειωμένη συνείδηση δεν πρέπει να εξαναγκάζεται να πιει. Ιατρικές παθήσεις και φάρμακα μπορούν επίσης να αλλάζουν τις ανάγκες. Ο σχεδιαστής νερού είναι εργαλείο εφοδιασμού και όχι δοσολογίας θεραπείας.\n\n## Η πρόληψη απαιτεί σχεδιασμό της εργασίας\nΜετέφερε βαριές εργασίες εκτός των πιο ζεστών ωρών, αύξησε την ανάπαυση, χρησιμοποίησε σκιά, επέτρεψε εγκλιματισμό και δούλεψε σε ζευγάρια ώστε να εντοπίζεται έγκαιρα επιδείνωση. Έλεγχε συχνότερα ηλικιωμένους, παιδιά, άτομα με χρόνια νοσήματα, εγκύους και όσους δεν έχουν αξιόπιστη ψύξη. Διακοπή ρεύματος μέσα σε καύσωνα μπορεί να δικαιολογεί έγκαιρη μετακίνηση πριν εμφανιστούν συμπτώματα.\n\n## Κατέγραψε περιβαλλοντικές και προσωπικές προειδοποιήσεις\nΤο Ημερολόγιο Πεδίου μπορεί να κρατά εσωτερική θερμοκρασία, διαθεσιμότητα ρεύματος, χώρο ψύξης, τάση κατανάλωσης νερού και παρατηρούμενα συμπτώματα. Έτσι η επόμενη βάρδια βλέπει αν οι συνθήκες χειροτερεύουν αντί να αξιολογεί κάθε στιγμή απομονωμένα.\n\n## Πηγές αναφοράς\n- Ready.gov: ακραία ζέστη.\n- American Red Cross: θερμική εξάντληση και θερμοπληξία.\n- Ελληνική Πολιτική Προστασία: οδηγίες καύσωνα."}},{"id":21,"en":{"title":"Cold exposure: hypothermia and frostbite boundaries","body":"## Treat cold as a system problem\nDangerous cold exposure is not limited to snow. Wind, wet clothing, exhaustion, inadequate food, immobility, an unheated home, or a person who cannot communicate discomfort can create risk well above freezing. A household plan should therefore track room temperature, dry clothing, bedding, safe heat sources, calories, medications, mobility needs, and who is checking vulnerable people. Do not wait for a dramatic temperature reading before acting on a person who is becoming confused, unusually sleepy, clumsy, or unable to care for themselves.\n\n## Suspected hypothermia\nMove the person away from continued cold and wet exposure when it is safe to do so. Replace wet layers with dry insulation and protect them from wind and cold surfaces. Handle a severely cold person gently and prioritize the trunk rather than aggressively heating hands and feet. A person with altered mental status, severe shivering that stops, marked weakness, slowed responsiveness, or other concerning symptoms needs urgent professional assessment. Do not use alcohol as a warming strategy and do not assume that a person who says they are “fine” is reliable if their thinking is impaired.\n\n## Frostbite concerns\nFrostbite can affect exposed or poorly perfused tissue, especially fingers, toes, ears, nose and cheeks. Protect suspected frozen tissue from further freezing and from rubbing, pressure or direct high heat. Rewarming tissue that may freeze again can worsen injury, so remote situations require a conservative evacuation decision rather than improvised treatment. Remove constricting jewelry when swelling is possible and seek medical care for suspected deep injury, blistering, loss of sensation, or abnormal skin colour that does not resolve.\n\n## Indoor cold continuity\nDuring a long outage, consolidate people into the safest room rather than trying to heat an entire building. Use layers, dry bedding and room zoning; keep combustion appliances outside their intended use. Never turn a grill, generator or other outdoor fuel-burning equipment into an indoor heater. Carbon-monoxide risk can rise precisely when households are cold and improvising.\n\n## Decision record\nRecord when symptoms were first noticed, environmental conditions, wet exposure, warming actions, medications or conditions that may affect temperature regulation, and whether symptoms improve or worsen. This helps handover to responders and prevents the next shift from restarting the assessment.\n\n## Source anchors\n- American Red Cross: hypothermia and frostbite first-aid guidance.\n- CDC: winter-weather and carbon-monoxide safety.\n- Ready.gov: winter-weather preparedness."},"el":{"title":"Έκθεση στο κρύο: όρια για υποθερμία και κρυοπαγήματα","body":"## Το κρύο είναι πρόβλημα ολόκληρου του συστήματος\nΗ επικίνδυνη έκθεση στο κρύο δεν απαιτεί χιόνι. Άνεμος, βρεγμένα ρούχα, εξάντληση, ανεπαρκής τροφή, ακινησία, σπίτι χωρίς θέρμανση ή άτομο που δεν μπορεί να εκφράσει τη δυσφορία του μπορούν να δημιουργήσουν σοβαρό κίνδυνο ακόμη και πάνω από το μηδέν. Το σχέδιο του νοικοκυριού πρέπει να παρακολουθεί θερμοκρασία χώρου, στεγνά ρούχα, κλινοσκεπάσματα, ασφαλείς πηγές θερμότητας, τροφή, φάρμακα, κινητικότητα και ποιος ελέγχει τα ευάλωτα άτομα. Μην περιμένεις μια «ακραία» ένδειξη θερμομέτρου όταν κάποιος γίνεται συγχυτικός, υπερβολικά νυσταγμένος, αδέξιος ή δεν μπορεί να φροντίσει τον εαυτό του.\n\n## Ύποπτη υποθερμία\nΜετέφερε το άτομο μακριά από συνεχιζόμενη έκθεση σε κρύο και υγρασία όταν αυτό είναι ασφαλές. Αντικατάστησε βρεγμένες στρώσεις με στεγνή μόνωση και προστάτεψέ το από άνεμο και ψυχρές επιφάνειες. Χειρίσου ήπια ένα πολύ κρύο άτομο και δώσε προτεραιότητα στη θέρμανση του κορμού αντί για επιθετική θέρμανση χεριών και ποδιών. Μεταβολή επιπέδου συνείδησης, σοβαρή αδυναμία, ρίγος που σταματά ή πολύ αργή ανταπόκριση απαιτούν επείγουσα επαγγελματική εκτίμηση. Το αλκοόλ δεν είναι μέθοδος θέρμανσης και η διαβεβαίωση «είμαι καλά» δεν είναι αξιόπιστη όταν η κρίση του ατόμου έχει επηρεαστεί.\n\n## Υποψία κρυοπαγήματος\nΤα κρυοπαγήματα προσβάλλουν συχνά δάχτυλα, πέλματα, αυτιά, μύτη και μάγουλα. Προστάτεψε τον ύποπτο παγωμένο ιστό από νέα ψύξη, τρίψιμο, πίεση και άμεση έντονη θερμότητα. Η επαναθέρμανση ιστού που μπορεί να ξαναπαγώσει μπορεί να επιδεινώσει τη βλάβη, επομένως σε απομονωμένο περιβάλλον απαιτείται συντηρητική απόφαση εκκένωσης και όχι αυτοσχεδιασμός. Αφαίρεσε περιοριστικά κοσμήματα αν αναμένεται οίδημα και αναζήτησε ιατρική βοήθεια για βαθιά βλάβη, φουσκάλες, απώλεια αισθητικότητας ή επίμονη μη φυσιολογική χροιά.\n\n## Συνέχεια λειτουργίας σε ψυχρό σπίτι\nΣε μεγάλη διακοπή ρεύματος, συγκέντρωσε τους ανθρώπους στον ασφαλέστερο χώρο αντί να προσπαθείς να θερμάνεις όλο το κτίριο. Χρησιμοποίησε στρώσεις, στεγνά κλινοσκεπάσματα και ζώνες χώρου και κράτησε κάθε συσκευή καύσης μέσα στα όρια της προβλεπόμενης χρήσης της. Μην μετατρέπεις ψησταριά, γεννήτρια ή άλλο εξοπλισμό εξωτερικού χώρου σε εσωτερική θέρμανση. Ο κίνδυνος μονοξειδίου του άνθρακα αυξάνεται ακριβώς όταν ένα νοικοκυριό κρυώνει και αυτοσχεδιάζει.\n\n## Καταγραφή απόφασης\nΚατέγραψε πότε εμφανίστηκαν τα συμπτώματα, τις περιβαλλοντικές συνθήκες, την υγρασία, τις ενέργειες θέρμανσης, παθήσεις ή φάρμακα που μπορεί να επηρεάζουν τη θερμορρύθμιση και αν υπάρχει βελτίωση ή επιδείνωση. Έτσι η παράδοση σε διασώστες ή στην επόμενη βάρδια βασίζεται σε πραγματικό ιστορικό.\n\n## Πηγές αναφοράς\n- Αμερικανικός Ερυθρός Σταυρός: πρώτες βοήθειες για υποθερμία και κρυοπαγήματα.\n- CDC: ασφάλεια σε χειμερινές συνθήκες και μονοξείδιο του άνθρακα.\n- Ready.gov: προετοιμασία για χειμερινά φαινόμενα."}},{"id":22,"en":{"title":"Wildfire smoke: creating a cleaner indoor air zone","body":"## Separate flame threat from smoke threat\nA wildfire can be far enough away that immediate flame evacuation is not required while smoke still makes outdoor air hazardous. Treat these as different decisions. Follow evacuation instructions first; if authorities do not require departure, manage indoor exposure deliberately rather than repeatedly opening the home to “check the air.”\n\n## Build one cleaner-air room\nChoose a room that can be closed, has enough space for household members, and does not contain obvious combustion sources. Close windows and doors when outdoor smoke is worse. If the building has HVAC that can safely recirculate indoor air, use the recirculation setting and the best compatible filter recommended for the system. A correctly sized portable air cleaner can add protection when available. Avoid creating indoor particles by smoking, burning candles or incense, frying foods heavily, vacuuming without suitable filtration, or running fuel-burning devices.\n\n## People who need earlier action\nSmoke can affect anyone, but households should identify people with asthma, chronic lung or heart disease, pregnancy, children, older adults and others whose clinician has given an action plan. Keep prescribed medicines and written action instructions immediately accessible. New or worsening breathing difficulty, chest pain, severe symptoms or symptoms that do not improve are reasons to seek medical help rather than simply remaining in the cleaner-air room.\n\n## Leaving the clean zone\nIf evacuation or essential travel is necessary, minimize time in smoke and follow current public-health guidance on appropriate respiratory protection. A loose cloth or ordinary dust mask should not be treated as equivalent to a properly fitting particulate respirator. Do not let a respirator delay evacuation from fire, heat or structural danger.\n\n## Power failure complication\nAn outage may disable HVAC and air cleaners. The plan should include a low-power fan/cleaner strategy only if it can be operated safely, a charged backup power source, and an alternative cleaner location such as a community facility if local authorities identify one. Never bring a generator indoors to keep an air cleaner running.\n\n## Source anchors\n- CDC: wildfire and wildfire-smoke safety.\n- CDC: wildfire smoke and people with chronic conditions.\n- Local civil-protection and public-health air-quality instructions."},"el":{"title":"Καπνός δασικής πυρκαγιάς: δημιουργία ζώνης καθαρότερου εσωτερικού αέρα","body":"## Ξεχώρισε την απειλή της φωτιάς από την απειλή του καπνού\nΜια πυρκαγιά μπορεί να βρίσκεται αρκετά μακριά ώστε να μην απαιτείται άμεση εκκένωση λόγω φλόγας, ενώ ο καπνός εξακολουθεί να κάνει τον εξωτερικό αέρα επιβαρυντικό. Πρόκειται για δύο διαφορετικές αποφάσεις. Οι εντολές εκκένωσης έχουν πάντα προτεραιότητα· αν οι αρχές δεν ζητούν αποχώρηση, περιόρισε συνειδητά την έκθεση αντί να ανοίγεις συνεχώς το σπίτι «για να δεις πώς είναι έξω».\n\n## Δημιούργησε έναν χώρο καθαρότερου αέρα\nΔιάλεξε δωμάτιο που κλείνει, χωρά τα μέλη του νοικοκυριού και δεν έχει εμφανείς πηγές καύσης. Κράτα κλειστά παράθυρα και πόρτες όταν ο εξωτερικός αέρας είναι επιβαρυμένος. Αν το σύστημα κλιματισμού μπορεί να ανακυκλώνει με ασφάλεια τον εσωτερικό αέρα, χρησιμοποίησε ανακυκλοφορία και το καλύτερο φίλτρο που είναι συμβατό με τον εξοπλισμό. Ένας σωστά διαστασιολογημένος φορητός καθαριστής αέρα μπορεί να προσθέσει προστασία. Μην παράγεις επιπλέον σωματίδια στο εσωτερικό με κάπνισμα, κεριά, θυμίαμα, έντονο τηγάνισμα, ακατάλληλη ηλεκτρική σκούπα ή συσκευές καύσης.\n\n## Ποιοι χρειάζονται νωρίτερα αλλαγή σχεδίου\nΟ καπνός μπορεί να επηρεάσει όλους, αλλά το νοικοκυριό πρέπει να έχει εντοπίσει άτομα με άσθμα, χρόνια πνευμονοπάθεια ή καρδιοπάθεια, εγκύους, παιδιά, ηλικιωμένους και όσους έχουν γραπτό σχέδιο από επαγγελματία υγείας. Τα συνταγογραφημένα φάρμακα και οι σχετικές οδηγίες πρέπει να είναι άμεσα προσβάσιμα. Νέα ή επιδεινούμενη δυσκολία στην αναπνοή, πόνος στο στήθος, σοβαρά συμπτώματα ή συμπτώματα που δεν βελτιώνονται απαιτούν ιατρική βοήθεια και όχι απλώς παραμονή στο δωμάτιο.\n\n## Έξοδος από την καθαρή ζώνη\nΑν απαιτείται εκκένωση ή ουσιώδης μετακίνηση, περιόρισε τον χρόνο μέσα στον καπνό και ακολούθησε την τρέχουσα οδηγία δημόσιας υγείας για κατάλληλη αναπνευστική προστασία. Ένα χαλαρό ύφασμα ή μια απλή μάσκα σκόνης δεν πρέπει να θεωρείται ισοδύναμη με σωστά εφαρμοσμένο αναπνευστήρα σωματιδίων. Καμία μάσκα δεν πρέπει να καθυστερεί την απομάκρυνση από φωτιά, υψηλή θερμοκρασία ή δομικό κίνδυνο.\n\n## Επιπλοκή από διακοπή ρεύματος\nΗ διακοπή μπορεί να απενεργοποιήσει κλιματισμό και καθαριστές. Το σχέδιο χρειάζεται ασφαλή λύση χαμηλής κατανάλωσης, φορτισμένη εφεδρική πηγή και εναλλακτικό καθαρότερο χώρο, όπως δημόσια εγκατάσταση που υποδεικνύουν οι αρχές. Μην φέρεις ποτέ γεννήτρια σε εσωτερικό χώρο για να λειτουργήσει ένας καθαριστής.\n\n## Πηγές αναφοράς\n- CDC: ασφάλεια σε δασικές πυρκαγιές και καπνό.\n- CDC: καπνός πυρκαγιάς και άτομα με χρόνιες παθήσεις.\n- Τρέχουσες οδηγίες Πολιτικής Προστασίας, δημόσιας υγείας και ποιότητας αέρα."}},{"id":23,"en":{"title":"Wildfire pre-evacuation: leaving before the route becomes the emergency","body":"## Define departure triggers in advance\nA household under wildfire threat should not make every decision from scratch while smoke, traffic and alerts are escalating. Write down hard triggers: an official evacuation order, fire crossing a named landmark, loss of the primary road, a vulnerable person becoming symptomatic, or a vehicle/fuel problem that removes the remaining margin. A trigger is useful only if everyone knows what action it causes.\n\n## Stage the household for movement\nKeep identity documents, essential medicines, glasses, mobility equipment, chargers, water, animal carriers, keys and go-bags together. Park for a clean departure where local conditions allow, avoid blocking fire-service access, and keep enough fuel or charge to reach the planned safe area with a reserve. Assign one person to monitor official alerts and another to account for people and animals so the driver is not simultaneously doing every task.\n\n## Route logic\nMaintain at least one alternative route and identify choke points that can be closed by fire, fallen vegetation, police control or congestion. A longer open route is often better than a shorter route whose status is uncertain. Do not drive toward smoke or flames merely because the navigation application still shows the road. Official road closures and responder directions override the stored plan.\n\n## The final ten minutes\nIf departure is triggered, do not turn the house into a last-minute packing exercise. Take the staged essentials, close doors and windows if time permits and authorities recommend it, move everyone into assigned vehicles, perform an accountability check, and leave. Do not re-enter for replaceable property. Share destination and route with the designated contact once safely underway.\n\n## If evacuation is impossible\nA household should know beforehand which local authority or emergency number to contact and where the most defensible available shelter is, but improvised sheltering is not a substitute for a timely evacuation order. If trapped, communicate precise location, number of people, mobility/medical constraints and visible fire/smoke conditions to emergency services.\n\n## Source anchors\n- Ready.gov: wildfire preparedness and evacuation.\n- CDC: wildfire safety.\n- Ministry for Climate Crisis and Civil Protection: forest-fire protection instructions."},"el":{"title":"Προεκκένωση δασικής πυρκαγιάς: φύγε πριν η διαδρομή γίνει το ίδιο το συμβάν","body":"## Όρισε εκ των προτέρων τα σημεία απόφασης\nΈνα νοικοκυριό που απειλείται από δασική πυρκαγιά δεν πρέπει να ξανασκέφτεται τα πάντα από το μηδέν ενώ αυξάνονται καπνός, κίνηση και ειδοποιήσεις. Γράψε σαφείς ενεργοποιητές: επίσημη εντολή εκκένωσης, η φωτιά περνά συγκεκριμένο σημείο αναφοράς, κλείνει ο κύριος δρόμος, ένα ευάλωτο άτομο εμφανίζει συμπτώματα ή πρόβλημα οχήματος/καυσίμου αφαιρεί το περιθώριο ασφαλείας. Κάθε ενεργοποιητής πρέπει να συνδέεται με συγκεκριμένη ενέργεια που γνωρίζουν όλοι.\n\n## Ετοίμασε το νοικοκυριό για άμεση κίνηση\nΣυγκέντρωσε ταυτότητες, βασικά φάρμακα, γυαλιά, εξοπλισμό κινητικότητας, φορτιστές, νερό, κλουβιά ζώων, κλειδιά και σακίδια. Στάθμευσε με τρόπο που επιτρέπει γρήγορη έξοδο χωρίς να εμποδίζεις πυροσβεστικά οχήματα και διατήρησε καύσιμο ή φόρτιση για να φτάσεις στον ασφαλή προορισμό με απόθεμα. Ανάθεσε σε ένα άτομο τις επίσημες ειδοποιήσεις και σε άλλο την καταμέτρηση ανθρώπων και ζώων ώστε ο οδηγός να μην εκτελεί όλες τις εργασίες ταυτόχρονα.\n\n## Λογική διαδρομής\nΔιατήρησε τουλάχιστον μία εναλλακτική διαδρομή και σημείωσε στενά σημεία που μπορούν να κλείσουν από φωτιά, πεσμένη βλάστηση, αστυνομικό αποκλεισμό ή κυκλοφοριακή συμφόρηση. Ένας μακρύτερος ανοιχτός δρόμος μπορεί να είναι ασφαλέστερος από έναν σύντομο δρόμο άγνωστης κατάστασης. Μην οδηγείς προς καπνό ή φλόγες επειδή μια εφαρμογή πλοήγησης εξακολουθεί να εμφανίζει τη διαδρομή. Οι επίσημοι αποκλεισμοί και οι οδηγίες των αρχών υπερισχύουν του αποθηκευμένου σχεδίου.\n\n## Τα τελευταία δέκα λεπτά\nΌταν ενεργοποιηθεί η αναχώρηση, μην μετατρέψεις το σπίτι σε αγώνα τελευταίας στιγμής για αντικείμενα. Πάρε τα ήδη συγκεντρωμένα βασικά, κλείσε πόρτες και παράθυρα μόνο αν υπάρχει χρόνος και το συνιστούν οι αρχές, βάλε όλους στα καθορισμένα οχήματα, κάνε καταμέτρηση και φύγε. Μην επιστρέψεις για αντικαταστάσιμα πράγματα. Μόλις κινείσαι με ασφάλεια, ενημέρωσε την προκαθορισμένη επαφή για προορισμό και διαδρομή.\n\n## Αν δεν είναι δυνατή η εκκένωση\nΤο νοικοκυριό πρέπει να γνωρίζει από πριν ποια υπηρεσία ή αριθμό έκτακτης ανάγκης θα καλέσει και ποιο είναι το καλύτερο διαθέσιμο σημείο προστασίας, αλλά η αυτοσχέδια παραμονή δεν αντικαθιστά μια έγκαιρη εντολή εκκένωσης. Αν εγκλωβιστείς, δώσε στις υπηρεσίες ακριβή θέση, αριθμό ατόμων, περιορισμούς κινητικότητας ή υγείας και τις ορατές συνθήκες φωτιάς/καπνού.\n\n## Πηγές αναφοράς\n- Ready.gov: προετοιμασία και εκκένωση για δασικές πυρκαγιές.\n- CDC: ασφάλεια σε δασικές πυρκαγιές.\n- Υπουργείο Κλιματικής Κρίσης και Πολιτικής Προστασίας: οδηγίες για δασικές πυρκαγιές."}},{"id":24,"en":{"title":"Returning after wildfire: ash, utilities, and hidden structural hazards","body":"## Permission to return is only the first gate\nDo not re-enter an evacuated area until authorities permit it. Permission means the area is open enough for return; it does not certify an individual building, tree, retaining wall, propane system, well, electrical installation or slope as safe. Approach the property as a new hazard scene.\n\n## Conduct an exterior stop\nBefore entering, look for downed lines, leaning poles, damaged trees, unstable masonry, displaced tanks, smouldering material, damaged decks and signs that a slope has changed. After wildfire, later rain can also create debris-flow risk on burned slopes. If the building has obvious structural movement, fire damage, strong fuel odour or active utility damage, remain outside and obtain professional or emergency guidance.\n\n## Ash is not ordinary household dust\nAvoid stirring dry ash. Children and animals should not play in ash or cleanup debris. Follow local public-health instructions for protective clothing and respiratory protection, and use cleanup methods that reduce airborne dust. Do not use a household vacuum that simply redistributes fine particles unless it is specifically suitable for the material and local guidance supports that method.\n\n## Water, food, and utilities need separate acceptance\nA visually intact refrigerator, water tank or private well may still have been affected by heat, smoke, prolonged outage, contaminated runoff or damaged plumbing. Treat each system independently. Follow water-utility or well-testing instructions; discard food according to outage, heat, smoke and contamination guidance rather than smell-testing; and have damaged electrical or fuel systems assessed before normal use.\n\n## Document before discarding\nPhotograph affected rooms, equipment, serial numbers, structural damage and debris before cleanup when it is safe. Keep a short chronology of evacuation, return authorization, utility status and major expenses. This can support insurance, public relief and later repair decisions without requiring you to preserve dangerous items.\n\n## Source anchors\n- CDC/NIOSH: wildfire cleanup hazards.\n- Ready.gov: returning after wildfire and recovery.\n- Local fire service, public-health, utility and civil-protection instructions."},"el":{"title":"Επιστροφή μετά από δασική πυρκαγιά: στάχτη, δίκτυα και κρυφοί δομικοί κίνδυνοι","body":"## Η άδεια επιστροφής είναι μόνο η πρώτη πύλη\nΜην επιστρέφεις σε εκκενωμένη περιοχή πριν το επιτρέψουν οι αρχές. Η άδεια σημαίνει ότι η περιοχή έχει ανοίξει αρκετά για επιστροφή· δεν πιστοποιεί ότι ένα συγκεκριμένο κτίριο, δέντρο, τοίχος αντιστήριξης, δεξαμενή, πηγάδι, ηλεκτρική εγκατάσταση ή πρανές είναι ασφαλές. Αντιμετώπισε το ακίνητο σαν νέο χώρο κινδύνου.\n\n## Σταμάτησε πρώτα για εξωτερικό έλεγχο\nΠριν μπεις, αναζήτησε πεσμένα καλώδια, γερμένους στύλους, κατεστραμμένα δέντρα, ασταθή τοιχοποιία, μετακινημένες δεξαμενές, υλικά που εξακολουθούν να καπνίζουν, καμένες βεράντες και αλλαγές σε πρανή. Μετά από πυρκαγιά, η επόμενη έντονη βροχή μπορεί να αυξήσει και τον κίνδυνο ροής φερτών υλικών. Αν υπάρχουν εμφανείς μετακινήσεις του κτιρίου, σοβαρή πυρκαγιά, έντονη οσμή καυσίμου ή ενεργή βλάβη δικτύων, μείνε έξω και ζήτησε επαγγελματική ή υπηρεσιακή εκτίμηση.\n\n## Η στάχτη δεν είναι κοινή οικιακή σκόνη\nΜην σηκώνεις ξηρή στάχτη χωρίς λόγο. Παιδιά και ζώα δεν πρέπει να παίζουν σε στάχτη ή συντρίμμια. Ακολούθησε τις τοπικές οδηγίες δημόσιας υγείας για ρούχα και αναπνευστική προστασία και καθάριζε με τρόπο που περιορίζει την αιώρηση σωματιδίων. Μη χρησιμοποιείς ηλεκτρική σκούπα που απλώς επαναδιασπείρει λεπτή σκόνη αν δεν είναι κατάλληλη για το υλικό και δεν το επιτρέπει η σχετική οδηγία.\n\n## Νερό, τρόφιμα και δίκτυα χρειάζονται χωριστή αποδοχή\nΈνα ψυγείο, δοχείο νερού ή ιδιωτικό πηγάδι που φαίνεται άθικτο μπορεί να έχει επηρεαστεί από θερμότητα, καπνό, παρατεταμένη διακοπή, ρυπασμένα νερά ή ζημιά στις σωληνώσεις. Έλεγξε κάθε σύστημα ανεξάρτητα. Ακολούθησε οδηγίες ύδρευσης ή ελέγχου πηγαδιού, πέταξε τρόφιμα σύμφωνα με τον χρόνο διακοπής και την έκθεση αντί να τα κρίνεις με την όσφρηση και μην επαναφέρεις κατεστραμμένες ηλεκτρικές ή καυσίμου εγκαταστάσεις χωρίς κατάλληλη εκτίμηση.\n\n## Τεκμηρίωσε πριν απομακρύνεις\nΦωτογράφισε χώρους, εξοπλισμό, σειριακούς αριθμούς, δομικές βλάβες και συντρίμμια πριν από τον καθαρισμό όταν αυτό είναι ασφαλές. Κράτησε σύντομο χρονολόγιο εκκένωσης, άδειας επιστροφής, κατάστασης δικτύων και σημαντικών δαπανών. Έτσι υποστηρίζονται ασφάλιση, κρατική αρωγή και αποφάσεις επισκευής χωρίς να χρειάζεται να κρατήσεις επικίνδυνα αντικείμενα.\n\n## Πηγές αναφοράς\n- CDC και NIOSH: κίνδυνοι κατά τον καθαρισμό μετά από πυρκαγιά.\n- Ready.gov: επιστροφή και αποκατάσταση μετά από δασική πυρκαγιά.\n- Τοπική Πυροσβεστική, δημόσια υγεία, πάροχοι δικτύων και Πολιτική Προστασία."}},{"id":25,"en":{"title":"Earthquake: immediate protection and the first aftershock cycle","body":"## During shaking\nThe objective during strong shaking is to reduce injury from falling, flying and collapsing objects. Indoors, use the established drop/cover/hold-on approach where appropriate: get low, protect head and neck, and take cover under sturdy furniture if it is immediately available. Do not run for stairs or an exterior exit while objects are falling. Stay away from windows, tall unsecured furniture and hanging objects. If already outside, move away from buildings, walls, glass, poles and overhead hazards into an open area when possible.\n\n## When shaking stops\nExpect aftershocks. Put on footwear before moving through broken glass and debris. Check people for injuries, then look and listen for immediate hazards such as fire, damaged wiring, leaking fuel, unstable walls, falling façade material and blocked exits. Use lifts/elevators only if authorities and building procedures specifically permit them; earthquake damage can interrupt power or compromise equipment.\n\n## Utility decisions must be evidence-based\nDo not switch utilities off automatically unless there is a reason or official instruction. If you smell gas or suspect a leak, avoid flames and electrical switching and leave the hazard area according to local utility/emergency guidance. If electrical wiring is visibly damaged, isolate it only if you can do so safely and know the correct disconnect. Photograph or record what was shut down and why so the next person does not restore it blindly.\n\n## Aftershock posture\nIdentify a safer waiting area away from damaged façades, chimneys, glass and unsecured heavy items. Keep shoes, light, keys, phone, radio and essential medicines with the household. Recheck rooms after significant aftershocks because damage can progress. A building that was usable after the first shock may not remain so.\n\n## Accountability and messages\nSend one concise message to the designated contact rather than placing many nonessential calls. Record who is present, injured, missing or away from home. Follow official emergency information for evacuation, tsunami risk in coastal areas, road closures and shelter locations.\n\n## Source anchors\n- Ready.gov: earthquake protective actions.\n- Ministry for Climate Crisis and Civil Protection: earthquake self-protection instructions.\n- Local building, utility and emergency-service guidance."},"el":{"title":"Σεισμός: άμεση προστασία και ο πρώτος κύκλος μετασεισμών","body":"## Κατά τη δόνηση\nΟ στόχος είναι να μειωθούν οι τραυματισμοί από πτώση, εκτόξευση και κατάρρευση αντικειμένων. Σε εσωτερικό χώρο, χρησιμοποίησε την καθιερωμένη αρχή «χαμηλά, κάλυψη, κράτημα» όπου είναι κατάλληλη: χαμήλωσε, προστάτεψε κεφάλι και αυχένα και μπες κάτω από γερό έπιπλο αν βρίσκεται αμέσως δίπλα. Μην τρέχεις προς σκάλες ή έξοδο όσο πέφτουν αντικείμενα. Μείνε μακριά από παράθυρα, ψηλά αστήρικτα έπιπλα και κρεμαστά αντικείμενα. Αν βρίσκεσαι ήδη έξω, πήγαινε όσο μπορείς σε ανοιχτό σημείο μακριά από κτίρια, τοίχους, τζάμια, στύλους και εναέρια αντικείμενα.\n\n## Όταν σταματήσει η δόνηση\nΠερίμενε μετασεισμούς. Φόρεσε παπούτσια πριν κινηθείς ανάμεσα σε σπασμένα γυαλιά και συντρίμμια. Έλεγξε πρώτα τους ανθρώπους για τραυματισμούς και μετά αναζήτησε άμεσους κινδύνους όπως φωτιά, κατεστραμμένη καλωδίωση, διαρροή καυσίμου, ασταθείς τοίχους, υλικά που πέφτουν από προσόψεις και μπλοκαρισμένες εξόδους. Μη χρησιμοποιείς ανελκυστήρα εκτός αν οι αρμόδιες αρχές και η διαδικασία του κτιρίου το επιτρέπουν ρητά.\n\n## Οι αποφάσεις για δίκτυα χρειάζονται λόγο\nΜην κλείνεις αυτόματα όλα τα δίκτυα χωρίς ένδειξη ή επίσημη οδηγία. Αν μυρίζεις αέριο ή υποψιάζεσαι διαρροή, απόφυγε φλόγες και ηλεκτρικούς διακόπτες και απομακρύνσου σύμφωνα με τις οδηγίες του παρόχου και των υπηρεσιών. Αν υπάρχει εμφανής βλάβη σε ηλεκτρική καλωδίωση, απομόνωσέ την μόνο αν γνωρίζεις τη σωστή διαδικασία και μπορείς να το κάνεις με ασφάλεια. Κατέγραψε τι έκλεισε και για ποιο λόγο ώστε να μην το επαναφέρει κάποιος αργότερα χωρίς έλεγχο.\n\n## Στάση απέναντι στους μετασεισμούς\nΔιάλεξε ασφαλέστερο σημείο αναμονής μακριά από κατεστραμμένες προσόψεις, καμινάδες, τζάμια και βαριά μη στερεωμένα αντικείμενα. Κράτα μαζί παπούτσια, φωτισμό, κλειδιά, τηλέφωνο, ραδιόφωνο και βασικά φάρμακα. Μετά από σημαντικό μετασεισμό επανέλεγξε τους χώρους, γιατί η βλάβη μπορεί να εξελιχθεί. Ένα κτίριο που φαινόταν χρησιμοποιήσιμο μετά την πρώτη δόνηση δεν είναι απαραίτητα ασφαλές αργότερα.\n\n## Καταμέτρηση και μηνύματα\nΣτείλε ένα σύντομο μήνυμα στην προκαθορισμένη επαφή αντί για πολλές μη απαραίτητες κλήσεις. Κατέγραψε ποιος είναι παρών, τραυματισμένος, αγνοούμενος ή εκτός κατοικίας. Ακολούθησε επίσημη ενημέρωση για εκκένωση, πιθανότητα τσουνάμι σε παράκτιες περιοχές, κλειστούς δρόμους και σημεία καταφυγής.\n\n## Πηγές αναφοράς\n- Ready.gov: ενέργειες προστασίας σε σεισμό.\n- Υπουργείο Κλιματικής Κρίσης και Πολιτικής Προστασίας: οδηγίες αυτοπροστασίας για σεισμούς.\n- Τοπικές οδηγίες κτιρίου, παρόχων δικτύων και υπηρεσιών έκτακτης ανάγκης."}},{"id":26,"en":{"title":"Post-earthquake home triage: structure, utilities, and habitability","body":"## Use a stop-before-entry rule\nAfter a damaging earthquake, do not let the desire to collect belongings override obvious warning signs. Partial wall separation, leaning masonry, major new cracks, displaced columns, sagging floors or roofs, fallen parapets, strong fuel odour, arcing electricity, fire, or continuing debris fall are reasons to stay out and seek competent assessment.\n\n## Separate “usable” from “comfortable”\nA home can have power and still be unsafe; it can also be uncomfortable yet structurally usable. Make a simple habitability decision using independent domains: structure, fire/fuel, electricity, water/sewage, access/egress, indoor air, weather exposure and aftershock vulnerability. A red condition in one critical domain can make the whole building unsuitable even when the other systems work.\n\n## Water and sanitation\nBroken pipes, loss of pressure and damaged sewer lines can create contamination risk. Do not assume tap water is safe after a major network disruption; follow the water utility and public-health instruction. If toilets or drains back up, stop adding wastewater to the affected system and switch to the household sanitation contingency rather than repeatedly testing it.\n\n## Electrical and fuel systems\nUse smell, sound and visible damage as warning signs, but remember that some hazards are not detectable by smell. Never search for a suspected gas leak with a flame. Do not energize wet or obviously damaged electrical equipment. Restoration decisions involving damaged building wiring, fuel systems or generators belong to qualified personnel or the responsible utility.\n\n## Record the status room by room\nCreate a quick sketch or use Shelter Zoning in the Command Center. Mark rooms green only when checked, amber for restricted/uncertain areas and red for areas nobody should enter. Record photographs, time, aftershock changes and who made the decision. This prevents a later household member from assuming an unopened door leads to a safe room.\n\n## Source anchors\n- Ministry for Climate Crisis and Civil Protection: earthquake instructions.\n- Ready.gov: earthquake recovery.\n- Local utility and building-safety authorities."},"el":{"title":"Διαλογή κατοικίας μετά από σεισμό: δομή, δίκτυα και καταλληλότητα","body":"## Σταμάτησε πριν την είσοδο\nΜετά από καταστροφικό σεισμό, η επιθυμία να πάρεις προσωπικά αντικείμενα δεν πρέπει να υπερισχύει εμφανών προειδοποιήσεων. Αποκόλληση τοίχων, γερμένη τοιχοποιία, μεγάλες νέες ρωγμές, μετακινημένα υποστυλώματα, καθίζηση δαπέδου ή στέγης, πεσμένα στηθαία, έντονη οσμή καυσίμου, ηλεκτρικό τόξο, φωτιά ή συνεχιζόμενη πτώση υλικών είναι λόγοι να μείνεις έξω και να ζητήσεις κατάλληλη εκτίμηση.\n\n## Ξεχώρισε το «χρησιμοποιήσιμο» από το «άνετο»\nΈνα σπίτι μπορεί να έχει ρεύμα και να είναι επικίνδυνο· μπορεί επίσης να είναι άβολο αλλά δομικά χρησιμοποιήσιμο. Κάνε χωριστή αξιολόγηση για δομή, φωτιά/καύσιμο, ηλεκτρισμό, νερό/αποχέτευση, πρόσβαση και έξοδο, εσωτερικό αέρα, προστασία από καιρό και ευπάθεια σε μετασεισμούς. Μία κρίσιμη κόκκινη κατάσταση μπορεί να καταστήσει ακατάλληλο όλο το κτίριο παρότι τα άλλα συστήματα λειτουργούν.\n\n## Νερό και αποχέτευση\nΣπασμένοι σωλήνες, πτώση πίεσης και βλάβη αποχέτευσης μπορούν να δημιουργήσουν κίνδυνο ρύπανσης. Μη θεωρείς ότι το νερό βρύσης είναι ασφαλές μετά από μεγάλη διακοπή του δικτύου· ακολούθησε την ύδρευση και τη δημόσια υγεία. Αν λεκάνες ή αποχετεύσεις επιστρέφουν λύματα, σταμάτησε να προσθέτεις νερό στο επηρεασμένο σύστημα και ενεργοποίησε την εναλλακτική λύση υγιεινής.\n\n## Ηλεκτρισμός και καύσιμα\nΟσμή, ήχος και εμφανής βλάβη είναι προειδοποιήσεις, αλλά ορισμένοι κίνδυνοι δεν εντοπίζονται με την όσφρηση. Μην ψάχνεις διαρροή αερίου με φλόγα. Μην ενεργοποιείς βρεγμένο ή εμφανώς κατεστραμμένο ηλεκτρικό εξοπλισμό. Αποκατάσταση κατεστραμμένης καλωδίωσης, συστημάτων καυσίμου ή σύνδεσης γεννήτριας ανήκει σε κατάλληλους τεχνικούς ή στον υπεύθυνο πάροχο.\n\n## Κατάγραψε την κατάσταση ανά χώρο\nΦτιάξε ένα απλό σχεδιάγραμμα ή χρησιμοποίησε τις Ζώνες Καταφυγίου του Κέντρου Ελέγχου. Σήμανε πράσινο μόνο χώρους που ελέγχθηκαν, πορτοκαλί όσους είναι περιορισμένοι ή αβέβαιοι και κόκκινο όσους δεν πρέπει να προσεγγίσει κανείς. Κατέγραψε φωτογραφίες, ώρα, αλλαγές μετά από μετασεισμούς και ποιος πήρε την απόφαση. Έτσι ο επόμενος άνθρωπος δεν θα υποθέσει ότι μια κλειστή πόρτα οδηγεί σε ασφαλές δωμάτιο.\n\n## Πηγές αναφοράς\n- Υπουργείο Κλιματικής Κρίσης και Πολιτικής Προστασίας: οδηγίες για σεισμούς.\n- Ready.gov: αποκατάσταση μετά από σεισμό.\n- Αρμόδιοι πάροχοι δικτύων και υπηρεσίες ασφάλειας κτιρίων."}},{"id":27,"en":{"title":"Tsunami: natural warnings, vertical urgency, and coastal evacuation","body":"## Do not wait for a phone alert when nature is already warning you\nIn a tsunami-prone coastal area, strong or long earthquake shaking, a sudden unusual rise or fall of the sea, or a loud ocean roar can be natural warnings. If a locally recognized natural warning occurs, move away from the coast and toward the designated safer area immediately when you can do so safely. An official message may arrive later or communications may be degraded.\n\n## Elevation and distance matter more than possessions\nThe household plan should identify the locally designated tsunami evacuation zone and route before an earthquake. After a natural warning, do not spend time packing normal belongings or going to the shoreline to observe. Use the route instructed by local authorities; where walking is recommended, it can avoid traffic gridlock. Keep mobility devices, essential medicines, footwear and a small water supply positioned so a vulnerable person does not require a long preparation phase.\n\n## One wave is not the end\nA tsunami is a series of waves, and dangerous currents can persist for hours. Do not return after the first wave or because the sea appears calm. Remain outside the hazard zone until authorities say it is safe. Harbours, river mouths and low-lying channels can remain dangerous even when nearby land looks undamaged.\n\n## If you are already offshore\nMarine guidance depends on vessel location, harbour conditions and official maritime instructions; do not apply a household land-evacuation rule to a boat without appropriate maritime authority information. The safest action for someone on shore is generally to move inland/uphill as directed, not to launch a vessel.\n\n## Greece-specific preparation\nFor Greek coastal and island locations, identify the route from each frequent location—home, work, school, beach or port—to higher or safer ground and note which route still works if a narrow waterfront road is blocked. Keep 112 alerts enabled and follow local Civil Protection, Coast Guard and municipal instructions.\n\n## Source anchors\n- Ready.gov: tsunami warning signs and evacuation.\n- Greek Civil Protection: natural-disaster self-protection guidance.\n- Local municipal and coastal emergency plans."},"el":{"title":"Τσουνάμι: φυσικές προειδοποιήσεις, επείγουσα ανύψωση και παράκτια εκκένωση","body":"## Μην περιμένεις ειδοποίηση στο τηλέφωνο όταν ήδη προειδοποιεί η φύση\nΣε παράκτια περιοχή με πιθανότητα τσουνάμι, ισχυρή ή παρατεταμένη σεισμική δόνηση, ξαφνική ασυνήθιστη άνοδος ή υποχώρηση της θάλασσας ή έντονος βόμβος από τη θάλασσα μπορούν να αποτελούν φυσικές προειδοποιήσεις. Αν εμφανιστεί αναγνωρισμένο τοπικό φυσικό σημάδι, απομακρύνσου αμέσως από την ακτή προς την καθορισμένη ασφαλέστερη περιοχή όταν μπορείς να το κάνεις με ασφάλεια. Η επίσημη ειδοποίηση μπορεί να αργήσει ή οι επικοινωνίες να έχουν υποστεί βλάβη.\n\n## Υψόμετρο και απόσταση έχουν μεγαλύτερη αξία από τα αντικείμενα\nΤο σχέδιο πρέπει να γνωρίζει από πριν τη ζώνη εκκένωσης και τη διαδρομή που έχει ορίσει η τοπική αρχή. Μετά από φυσική προειδοποίηση, μη χάνεις χρόνο για κανονικές αποσκευές και μην πηγαίνεις στην ακτή για να παρατηρήσεις. Χρησιμοποίησε τη διαδρομή των αρχών· όπου προτείνεται μετακίνηση με τα πόδια, αυτή μπορεί να αποφύγει κυκλοφοριακό αδιέξοδο. Εξοπλισμός κινητικότητας, βασικά φάρμακα, παπούτσια και λίγο νερό πρέπει να είναι έτοιμα ώστε ένα ευάλωτο άτομο να μην χρειάζεται μακρά προετοιμασία.\n\n## Ένα κύμα δεν σημαίνει τέλος\nΤο τσουνάμι είναι σειρά κυμάτων και επικίνδυνα ρεύματα μπορούν να συνεχιστούν για ώρες. Μην επιστρέψεις μετά το πρώτο κύμα ή επειδή η θάλασσα φαίνεται προσωρινά ήρεμη. Μείνε έξω από τη ζώνη κινδύνου μέχρι οι αρχές να ανακοινώσουν ότι είναι ασφαλές. Λιμάνια, εκβολές και χαμηλά κανάλια μπορεί να παραμείνουν επικίνδυνα ακόμη κι αν η γειτονική ξηρά δείχνει άθικτη.\n\n## Αν βρίσκεσαι ήδη στη θάλασσα\nΟι οδηγίες για σκάφη εξαρτώνται από θέση, λιμένα, βάθος και τις επίσημες ναυτικές οδηγίες· μην εφαρμόζεις αυτόματα τον κανόνα εκκένωσης της στεριάς σε ένα πλοίο ή σκάφος. Για κάποιον που βρίσκεται στην ακτή, η ασφαλέστερη αρχική ενέργεια είναι η απομάκρυνση προς την ενδοχώρα ή ψηλότερο σημείο σύμφωνα με τις αρχές, όχι η προσπάθεια καθέλκυσης σκάφους.\n\n## Προετοιμασία ειδικά για την Ελλάδα\nΣε ελληνικές παράκτιες και νησιωτικές περιοχές, εντόπισε διαδρομή από κάθε συχνό σημείο—σπίτι, εργασία, σχολείο, παραλία ή λιμάνι—προς ψηλότερο ή ασφαλέστερο έδαφος και σημείωσε τι γίνεται αν ο παραλιακός δρόμος κλείσει. Κράτα ενεργές τις ειδοποιήσεις 112 και ακολούθησε Πολιτική Προστασία, Λιμενικό και τοπικές αρχές.\n\n## Πηγές αναφοράς\n- Ready.gov: φυσικά σημάδια τσουνάμι και εκκένωση.\n- Ελληνική Πολιτική Προστασία: οδηγίες αυτοπροστασίας για φυσικές καταστροφές.\n- Τοπικά δημοτικά και παράκτια σχέδια έκτακτης ανάγκης."}},{"id":28,"en":{"title":"Flood operations: movement, vehicles, contamination, and re-entry","body":"## Water depth is not the only hazard\nFloodwater can hide missing road surface, open drains, debris, electrical hazards, strong current, chemicals and sewage. A familiar street is not a known surface once covered. Never treat a barricade as an inconvenience to route around; responders may know of bridge, road or current hazards that are invisible from the vehicle.\n\n## Evacuation before water reaches the route\nIf authorities advise evacuation, leaving before low roads flood is safer than waiting to see whether the water rises further. Identify high points and routes that do not depend on underpasses, stream crossings or a single bridge. Move essential medicines, mobility equipment, identity documents, chargers and animal supplies before the household is forced into a rushed departure.\n\n## Vehicle decisions\nDo not deliberately drive into floodwater. Depth, current and road integrity are difficult to judge from the driver’s seat, and a stalled vehicle can become a trap. If a planned route is flooded or barricaded, turn around and use an official alternative. Never stop on a bridge over fast-rising water simply to observe.\n\n## After water enters a building\nAssume floodwater and porous materials it touched may be contaminated. Avoid direct contact when possible, protect cuts, follow public-health cleanup guidance, and keep children and animals out of the affected zone. Electrical systems and appliances that were wet should not be energized until appropriately assessed.\n\n## Re-entry is a staged process\nReturn only when local authorities permit it. Check access, structural movement, electrical/fuel hazards, drinking-water status, sewage function and mould/moisture separately. Photograph high-water marks and damage before cleanup when safe; track discarded items and expenses. If the building cannot be dried and made sanitary, continued occupancy may be a health problem even after the flood recedes.\n\n## Source anchors\n- Ready.gov: floods.\n- CDC: floodwater and cleanup health precautions.\n- Local Civil Protection, utility and public-health instructions."},"el":{"title":"Επιχειρήσεις σε πλημμύρα: μετακίνηση, οχήματα, ρύπανση και επανείσοδος","body":"## Το βάθος του νερού δεν είναι ο μόνος κίνδυνος\nΤο πλημμυρικό νερό μπορεί να κρύβει κατεστραμμένο οδόστρωμα, ανοιχτά φρεάτια, συντρίμμια, ηλεκτρικούς κινδύνους, ισχυρό ρεύμα, χημικά και λύματα. Ένας γνωστός δρόμος παύει να είναι «γνωστή επιφάνεια» όταν καλυφθεί. Μην αντιμετωπίζεις έναν αποκλεισμό ως εμπόδιο που πρέπει απλώς να παρακάμψεις· οι υπηρεσίες μπορεί να γνωρίζουν κίνδυνο γέφυρας, δρόμου ή ρεύματος που δεν φαίνεται από το όχημα.\n\n## Εκκένωση πριν το νερό κόψει τη διαδρομή\nΑν οι αρχές προτείνουν εκκένωση, η αναχώρηση πριν πλημμυρίσουν χαμηλά σημεία είναι ασφαλέστερη από την αναμονή. Εντόπισε ψηλότερες διαδρομές που δεν εξαρτώνται από υπόγειες διαβάσεις, ρέματα ή μία μοναδική γέφυρα. Μετακίνησε βασικά φάρμακα, εξοπλισμό κινητικότητας, έγγραφα, φορτιστές και εφόδια ζώων πριν το νοικοκυριό αναγκαστεί να φύγει βιαστικά.\n\n## Αποφάσεις οχήματος\nΜην οδηγείς σκόπιμα μέσα σε πλημμυρικό νερό. Το βάθος, το ρεύμα και η κατάσταση του δρόμου δεν εκτιμώνται αξιόπιστα από τη θέση του οδηγού και ένα ακινητοποιημένο όχημα μπορεί να γίνει παγίδα. Αν η σχεδιασμένη διαδρομή είναι πλημμυρισμένη ή κλειστή, γύρισε πίσω και χρησιμοποίησε επίσημη εναλλακτική. Μην σταματάς πάνω σε γέφυρα με ταχέως ανερχόμενο νερό για παρατήρηση.\n\n## Όταν το νερό μπει στο κτίριο\nΘεώρησε ότι το νερό και τα πορώδη υλικά που άγγιξε μπορεί να είναι μολυσμένα. Περιόρισε την άμεση επαφή, προστάτεψε ανοιχτές πληγές, ακολούθησε οδηγίες καθαρισμού δημόσιας υγείας και κράτα παιδιά και ζώα έξω από τη ζώνη. Ηλεκτρικές εγκαταστάσεις και συσκευές που βράχηκαν δεν πρέπει να ενεργοποιούνται πριν από κατάλληλο έλεγχο.\n\n## Η επανείσοδος γίνεται σε στάδια\nΕπέστρεψε μόνο όταν το επιτρέψουν οι αρχές. Έλεγξε χωριστά πρόσβαση, δομική μετακίνηση, ηλεκτρικούς/καυσίμου κινδύνους, κατάσταση πόσιμου νερού, λειτουργία αποχέτευσης και υγρασία. Φωτογράφισε σημάδια στάθμης και βλάβες πριν τον καθαρισμό όταν είναι ασφαλές και κατέγραψε αντικείμενα που απορρίπτονται και δαπάνες. Αν το κτίριο δεν μπορεί να στεγνώσει και να εξυγιανθεί, η συνέχιση κατοίκησης μπορεί να παραμένει πρόβλημα υγείας μετά την υποχώρηση του νερού.\n\n## Πηγές αναφοράς\n- Ready.gov: πλημμύρες.\n- CDC: κίνδυνοι υγείας από πλημμυρικά νερά και καθαρισμό.\n- Τοπική Πολιτική Προστασία, πάροχοι δικτύων και δημόσια υγεία."}},{"id":29,"en":{"title":"Lightning and thunderstorms: shelter decisions before the strike","body":"## Thunder means the outdoor plan has failed\nIf thunder is audible, lightning is close enough to present a hazard. Move to a substantial enclosed building or an enclosed hard-topped vehicle rather than trying to identify a “safe” spot outside. Tents, open shelters, porches, isolated trees and small sheds do not provide reliable lightning protection.\n\n## Inside is safer, not risk-free\nDuring the storm, avoid direct contact with plumbing and unnecessary use of corded electrical equipment. Stay away from windows and doors when conditions are severe. Do not step back outside simply because rainfall weakens; lightning can occur away from the heaviest rain. The National Weather Service commonly advises remaining in safe shelter for at least 30 minutes after the last thunder.\n\n## Outdoor activity planning\nFor hiking, beaches, sports, construction or field work, choose the shelter and trigger before the activity begins. The correct plan is not “we will run if lightning gets close,” but “when we hear thunder or receive the relevant warning, this group goes to this specific safe building/vehicle by this route.” A remote ridge, open field or shoreline may require turning around well before the storm arrives.\n\n## If someone is struck\nLightning victims do not retain an electrical charge and can be touched. Activate emergency medical services and provide first aid/CPR according to your training and dispatcher instructions. Multiple casualties are possible; use scene awareness because continuing lightning can expose rescuers.\n\n## Equipment and outage follow-on\nA thunderstorm may also cause power loss, flash flooding, wind damage and falling branches. Once the immediate lightning threat passes, reassess roads, generators, damaged wiring and local flood warnings rather than assuming the incident is over.\n\n## Source anchors\n- National Weather Service: lightning safety.\n- Ready.gov: severe-weather preparedness.\n- Local meteorological and civil-protection alerts."},"el":{"title":"Κεραυνοί και καταιγίδες: απόφαση για καταφύγιο πριν από το πλήγμα","body":"## Αν ακούς βροντή, το υπαίθριο σχέδιο έχει ήδη αποτύχει\nΌταν ακούγεται βροντή, ο κεραυνός βρίσκεται αρκετά κοντά ώστε να αποτελεί κίνδυνο. Πήγαινε σε ουσιαστικό κλειστό κτίριο ή σε κλειστό όχημα με σκληρή οροφή αντί να ψάχνεις «ασφαλές» σημείο στο ύπαιθρο. Σκηνές, ανοιχτά στέγαστρα, βεράντες, μεμονωμένα δέντρα και μικρές αποθήκες δεν παρέχουν αξιόπιστη προστασία.\n\n## Ο εσωτερικός χώρος είναι ασφαλέστερος, όχι χωρίς κίνδυνο\nΚατά την καταιγίδα απόφυγε άμεση επαφή με υδραυλικές εγκαταστάσεις και μη απαραίτητη χρήση ενσύρματων ηλεκτρικών συσκευών. Μείνε μακριά από παράθυρα και πόρτες όταν τα φαινόμενα είναι έντονα. Μην ξαναβγείς επειδή μειώθηκε η βροχή· κεραυνοί μπορούν να εμφανιστούν μακριά από την εντονότερη βροχόπτωση. Η Εθνική Μετεωρολογική Υπηρεσία των ΗΠΑ χρησιμοποιεί ευρέως κανόνα παραμονής σε ασφαλές καταφύγιο για τουλάχιστον 30 λεπτά μετά την τελευταία βροντή.\n\n## Σχεδιασμός υπαίθριας δραστηριότητας\nΓια πεζοπορία, παραλία, αθλητισμό, εργασία ή υπαίθριες εργασίες, διάλεξε το καταφύγιο και το σημείο ενεργοποίησης πριν ξεκινήσεις. Το σχέδιο δεν πρέπει να είναι «θα τρέξουμε αν πλησιάσει», αλλά «με την πρώτη βροντή ή σχετική προειδοποίηση, η ομάδα πηγαίνει στο συγκεκριμένο κτίριο ή όχημα από τη συγκεκριμένη διαδρομή». Σε κορυφογραμμή, ανοιχτό πεδίο ή ακτή μπορεί να χρειάζεται επιστροφή πολύ πριν φτάσει η καταιγίδα.\n\n## Αν χτυπηθεί άνθρωπος\nΤο θύμα κεραυνού δεν παραμένει ηλεκτρικά φορτισμένο και μπορεί να αγγιχθεί. Ενεργοποίησε τις υπηρεσίες έκτακτης ανάγκης και παρείχε πρώτες βοήθειες ή καρδιοπνευμονική αναζωογόνηση σύμφωνα με την εκπαίδευσή σου και τις οδηγίες του τηλεφωνικού κέντρου. Μπορεί να υπάρχουν πολλά θύματα και ο διασώστης πρέπει να προσέχει τον συνεχιζόμενο κεραυνικό κίνδυνο.\n\n## Συνέχεια μετά το φαινόμενο\nΗ ίδια καταιγίδα μπορεί να προκαλέσει διακοπή ρεύματος, ξαφνική πλημμύρα, ζημιές από άνεμο και πτώση κλαδιών. Όταν περάσει ο άμεσος κίνδυνος κεραυνού, επανεκτίμησε δρόμους, γεννήτριες, καλωδίωση και προειδοποιήσεις πλημμύρας αντί να θεωρήσεις ότι το συμβάν τελείωσε.\n\n## Πηγές αναφοράς\n- Εθνική Μετεωρολογική Υπηρεσία των ΗΠΑ: ασφάλεια από κεραυνούς.\n- Ready.gov: προετοιμασία για έντονα καιρικά φαινόμενα.\n- Τοπικές μετεωρολογικές και πολιτικής προστασίας ειδοποιήσεις."}},{"id":30,"en":{"title":"Severe wind: building envelope, falling objects, and post-storm movement","body":"## Wind turns normal objects into hazards\nStrong wind can fail roof tiles, shutters, signs, branches, scaffolding, solar panels and unsecured balcony items. Before conditions worsen, bring loose objects inside or secure them without exposing anyone to an already dangerous exterior. Close and latch openings according to the building’s design; do not improvise by standing outside to hold or repair a failing shutter.\n\n## Choose the protected interior position\nThe safest location depends on the building and local hazard, but a household should identify an interior area away from windows, skylights and large unsupported glazing. Keep sturdy footwear, a light and a way to receive official alerts there. In apartments, also consider objects from balconies or façades above, not only damage to your own unit.\n\n## Power and fire consequences\nWind damage can bring down distribution lines or create arcing and fire. Treat fallen or low wires as energized and keep people and animals away. Do not move branches touching lines. If the building loses power, activate the normal outage plan rather than immediately starting fuel-burning equipment near windows or entrances.\n\n## After the peak\nDo not rush outdoors when the wind briefly eases. Check official warnings and observe from a protected location first. When leaving, watch for hanging roof material, unstable trees, broken glass, damaged walls and overhead lines. Photograph damage only after the area is safe enough to occupy.\n\n## Long-duration exposure\nIf repeated storms are expected, convert the first event into maintenance information: which window leaked, which drain overflowed, which exterior item moved, which room accumulated glass or water and which communications method worked. Repair priority should be driven by life safety and weatherproofing before cosmetic damage.\n\n## Source anchors\n- Ready.gov: severe-weather preparedness.\n- National/local meteorological warnings.\n- Building-management and utility safety instructions."},"el":{"title":"Ισχυροί άνεμοι: κέλυφος κτιρίου, πτώση αντικειμένων και κίνηση μετά το φαινόμενο","body":"## Ο άνεμος μετατρέπει συνηθισμένα αντικείμενα σε κινδύνους\nΙσχυροί άνεμοι μπορούν να αποκολλήσουν κεραμίδια, παντζούρια, πινακίδες, κλαδιά, σκαλωσιές, φωτοβολταϊκά και αντικείμενα μπαλκονιού. Πριν επιδεινωθούν οι συνθήκες, βάλε μέσα ή στερέωσε ό,τι είναι χαλαρό χωρίς να εκθέσεις κάποιον όταν ο εξωτερικός χώρος έχει ήδη γίνει επικίνδυνος. Κλείσε τα ανοίγματα σύμφωνα με τον σχεδιασμό του κτιρίου· μην στέκεσαι έξω προσπαθώντας να κρατήσεις ή να επισκευάσεις παντζούρι που έχει αρχίσει να αστοχεί.\n\n## Διάλεξε προστατευμένο εσωτερικό σημείο\nΗ καταλληλότερη θέση εξαρτάται από το κτίριο και το φαινόμενο, αλλά το νοικοκυριό πρέπει να γνωρίζει έναν εσωτερικό χώρο μακριά από παράθυρα, φεγγίτες και μεγάλες υάλινες επιφάνειες. Κράτα εκεί ανθεκτικά παπούτσια, φακό και τρόπο λήψης επίσημων ειδοποιήσεων. Σε πολυκατοικία, υπολόγισε και αντικείμενα που μπορεί να πέσουν από μπαλκόνια ή προσόψεις ανώτερων ορόφων.\n\n## Συνέπειες σε ρεύμα και φωτιά\nΟ άνεμος μπορεί να ρίξει γραμμές διανομής ή να προκαλέσει ηλεκτρικό τόξο και πυρκαγιά. Θεώρησε κάθε πεσμένο ή χαμηλό καλώδιο ενεργό και κράτα ανθρώπους και ζώα μακριά. Μην μετακινείς κλαδιά που ακουμπούν σε γραμμές. Αν χαθεί το ρεύμα, ενεργοποίησε το σχέδιο διακοπής αντί να ξεκινήσεις αμέσως συσκευή καύσης κοντά σε πόρτες ή παράθυρα.\n\n## Μετά την κορύφωση\nΜην βγαίνεις βιαστικά επειδή ο άνεμος μειώθηκε για λίγα λεπτά. Έλεγξε πρώτα τις επίσημες προειδοποιήσεις και παρατήρησε από προστατευμένη θέση. Όταν βγεις, πρόσεχε κρεμασμένα υλικά στέγης, ασταθή δέντρα, σπασμένα τζάμια, τοίχους και εναέρια καλώδια. Φωτογράφισε ζημιές μόνο αφού ο χώρος είναι αρκετά ασφαλής.\n\n## Παρατεταμένη έκθεση\nΑν αναμένονται επαναλαμβανόμενα φαινόμενα, χρησιμοποίησε το πρώτο ως πληροφορία συντήρησης: ποιο παράθυρο έβαλε νερό, ποια απορροή υπερχείλισε, ποιο εξωτερικό αντικείμενο μετακινήθηκε, ποιος χώρος γέμισε γυαλί ή νερό και ποιος τρόπος επικοινωνίας λειτούργησε. Η προτεραιότητα επισκευής πρέπει να ακολουθεί ασφάλεια ζωής και στεγανοποίηση πριν από την αισθητική.\n\n## Πηγές αναφοράς\n- Ready.gov: προετοιμασία για έντονα καιρικά φαινόμενα.\n- Εθνικές και τοπικές μετεωρολογικές προειδοποιήσεις.\n- Οδηγίες διαχείρισης κτιρίου και παρόχων δικτύων."}},{"id":31,"en":{"title":"Portable generator safety: carbon monoxide, placement, and electrical boundaries","body":"## The generator belongs outside\nPortable fuel-burning generators create carbon monoxide, an invisible poisonous gas. CDC guidance recommends operating a portable generator outside, more than 20 feet (about 6 metres) from windows, doors and vents, with exhaust directed away from the building. A garage, basement, enclosed balcony, shed attached to living space, corridor or “open window” arrangement is not a substitute for true outdoor placement.\n\n## Detect the hazard\nUse working battery-powered or battery-backup carbon-monoxide alarms according to their manufacturer instructions. Headache, dizziness, weakness, nausea, confusion or unusual sleepiness in multiple people during generator or combustion use should be treated as a possible carbon-monoxide emergency: get to fresh air and seek emergency help rather than trying to troubleshoot indoors.\n\n## Electrical isolation\nDo not connect a generator to household wiring through an improvised “backfeed” cable. A proper building connection requires appropriate transfer/isolation equipment installed according to electrical code and qualified guidance; otherwise the generator can energize utility lines and endanger workers or damage equipment. For direct loads, use suitable outdoor-rated cords, protect connections from water and stay within the generator and cord ratings.\n\n## Fuel and hot equipment\nRefuel only after following the manufacturer’s shutdown/cooling instructions. Store fuel in approved containers away from living areas, ignition sources and the running generator. Keep the exhaust area clear of dry vegetation and combustible material. Never move a hot unit into an enclosed space just to protect it from weather.\n\n## Load discipline\nStart with critical loads and calculate continuous demand, startup surge and fuel endurance. Refrigeration, medical equipment and communications may deserve priority over comfort loads. Log run periods and fuel remaining; a generator with no fuel reserve or no safe placement is not a dependable resilience resource.\n\n## Source anchors\n- CDC: portable generator and carbon-monoxide safety.\n- Electrical utility/code guidance for transfer equipment and backfeed prevention.\n- Generator manufacturer operating manual."},"el":{"title":"Φορητή γεννήτρια: μονοξείδιο του άνθρακα, θέση και ηλεκτρικά όρια","body":"## Η γεννήτρια ανήκει έξω\nΟι φορητές γεννήτριες καύσης παράγουν μονοξείδιο του άνθρακα, ένα αόρατο δηλητηριώδες αέριο. Η καθοδήγηση του CDC προτείνει λειτουργία σε εξωτερικό χώρο, περισσότερο από 20 πόδια, δηλαδή περίπου 6 μέτρα, από παράθυρα, πόρτες και αεραγωγούς, με την εξάτμιση στραμμένη μακριά από το κτίριο. Γκαράζ, υπόγειο, κλειστό μπαλκόνι, αποθήκη που επικοινωνεί με το σπίτι, διάδρομος ή «ανοιχτό παράθυρο» δεν αντικαθιστούν τη σωστή εξωτερική τοποθέτηση.\n\n## Εντόπισε τον κίνδυνο\nΧρησιμοποίησε λειτουργικούς ανιχνευτές μονοξειδίου του άνθρακα με μπαταρία ή εφεδρική μπαταρία σύμφωνα με τις οδηγίες τους. Πονοκέφαλος, ζάλη, αδυναμία, ναυτία, σύγχυση ή ασυνήθιστη υπνηλία σε περισσότερα άτομα ενώ λειτουργεί γεννήτρια ή άλλη συσκευή καύσης πρέπει να αντιμετωπίζονται ως πιθανό επείγον περιστατικό: πήγαινε σε καθαρό αέρα και ζήτησε βοήθεια αντί να προσπαθείς να βρεις τη βλάβη μέσα στον χώρο.\n\n## Ηλεκτρική απομόνωση\nΜην συνδέεις γεννήτρια στην οικιακή εγκατάσταση με αυτοσχέδιο καλώδιο αντίστροφης τροφοδότησης. Σύνδεση σε κτίριο απαιτεί κατάλληλη διάταξη μεταγωγής και απομόνωσης σύμφωνα με τον ηλεκτρικό κανονισμό και αρμόδιο τεχνικό· αλλιώς μπορεί να τροφοδοτηθεί επικίνδυνα το δίκτυο ή να καταστραφεί εξοπλισμός. Για απευθείας φορτία, χρησιμοποίησε κατάλληλα καλώδια εξωτερικού χώρου, κράτα τις ενώσεις στεγνές και μην ξεπερνάς τα όρια γεννήτριας και καλωδίων.\n\n## Καύσιμο και θερμός εξοπλισμός\nΑνεφοδίασε μόνο αφού ακολουθήσεις τη διαδικασία διακοπής και ψύξης του κατασκευαστή. Φύλαξε καύσιμο σε εγκεκριμένα δοχεία, μακριά από χώρους διαβίωσης, πηγές ανάφλεξης και τη λειτουργούσα γεννήτρια. Κράτα την εξάτμιση μακριά από ξερή βλάστηση και εύφλεκτα υλικά. Μη μεταφέρεις μια καυτή μονάδα σε κλειστό χώρο για να την προστατεύσεις από τον καιρό.\n\n## Πειθαρχία φορτίου\nΞεκίνα από κρίσιμα φορτία και υπολόγισε συνεχή κατανάλωση, ρεύμα εκκίνησης και διάρκεια καυσίμου. Ψύξη τροφίμων, ιατρικός εξοπλισμός και επικοινωνίες μπορεί να έχουν προτεραιότητα έναντι φορτίων άνεσης. Κατέγραψε ώρες λειτουργίας και υπόλοιπο καυσίμου· γεννήτρια χωρίς απόθεμα ή ασφαλή θέση δεν είναι αξιόπιστος πόρος.\n\n## Πηγές αναφοράς\n- CDC: ασφάλεια φορητών γεννητριών και μονοξειδίου του άνθρακα.\n- Οδηγίες παρόχου και ηλεκτρικού κανονισμού για απομόνωση και αποφυγή αντίστροφης τροφοδότησης.\n- Εγχειρίδιο κατασκευαστή της γεννήτριας."}},{"id":32,"en":{"title":"Battery backup: energy budgeting, load shedding, and safe charging","body":"## Start with watt-hours, not wishful runtime\nA battery system is finite stored energy. List each load’s approximate watts and expected hours of use, then calculate watt-hours. Keep a reserve rather than planning to discharge every available unit. Inverters and conversion losses mean usable energy can be lower than the label suggests, and battery capacity can change with temperature, age and discharge rate.\n\n## Create power tiers\nTier 1 should contain functions whose loss changes safety or medical continuity: prescribed medical devices, essential communications, emergency lighting or temperature-sensitive medicines when applicable. Tier 2 can cover refrigeration cycles, limited networking and work needed for household continuity. Tier 3 contains comfort and discretionary loads. When available energy falls, disable entire lower tiers instead of negotiating every device repeatedly.\n\n## Charge deliberately\nUse chargers, cables and power supplies intended for the battery chemistry and product. Keep charging equipment dry, ventilated as required by the manufacturer and away from flammable clutter. Stop using visibly swollen, damaged, leaking or abnormally hot battery packs. Do not improvise cell-level repairs to lithium packs during an emergency.\n\n## Measure the real system\nRecord state of charge at fixed times, energy source, major loads and charging windows. If the system loses 20 percent overnight when the plan predicted 8 percent, change the plan immediately: locate hidden loads, reduce runtime or find more charging capacity. The Command Center’s Power Operations section can compare stored watt-hours with daily load demand and reserve.\n\n## Solar and vehicle charging are conditional resources\nSolar output depends on weather, panel orientation, shading, temperature and controller limits. Vehicle charging consumes vehicle fuel or traction energy and may affect evacuation range. Treat both as inputs with opportunity costs, not free unlimited power.\n\n## Source anchors\n- Manufacturer battery/inverter manuals and electrical ratings.\n- Local fire/electrical safety guidance for rechargeable batteries.\n- Offline Survival Project Power Operations calculations."},"el":{"title":"Εφεδρικές μπαταρίες: ενεργειακός προϋπολογισμός, αποκοπή φορτίων και ασφαλής φόρτιση","body":"## Ξεκίνα από βατώρες, όχι από αισιόδοξο χρόνο λειτουργίας\nΈνα σύστημα μπαταριών έχει πεπερασμένη αποθηκευμένη ενέργεια. Κατέγραψε την ισχύ κάθε φορτίου και τις αναμενόμενες ώρες λειτουργίας και υπολόγισε βατώρες. Διατήρησε απόθεμα αντί να σχεδιάζεις πλήρη εξάντληση. Απώλειες μετατροπής σημαίνουν ότι η πραγματικά διαθέσιμη ενέργεια μπορεί να είναι μικρότερη από την ονομαστική και η χωρητικότητα επηρεάζεται από θερμοκρασία, ηλικία και ρυθμό εκφόρτισης.\n\n## Δημιούργησε βαθμίδες ισχύος\nΗ πρώτη βαθμίδα πρέπει να περιλαμβάνει λειτουργίες των οποίων η απώλεια αλλάζει την ασφάλεια ή την ιατρική συνέχεια: συνταγογραφημένες ιατρικές συσκευές, βασικές επικοινωνίες, φωτισμό έκτακτης ανάγκης ή ψύξη ευαίσθητων φαρμάκων όπου απαιτείται. Η δεύτερη μπορεί να περιλαμβάνει κύκλους ψυγείου, περιορισμένη δικτύωση και κρίσιμη εργασία. Η τρίτη αφορά άνεση. Όταν πέφτει η διαθέσιμη ενέργεια, απενεργοποίησε ολόκληρη χαμηλότερη βαθμίδα αντί να διαπραγματεύεσαι κάθε συσκευή ξανά.\n\n## Φόρτισε με συγκεκριμένο τρόπο\nΧρησιμοποίησε φορτιστές, καλώδια και τροφοδοτικά που προβλέπονται για το προϊόν και τη χημεία της μπαταρίας. Κράτα τον εξοπλισμό στεγνό, με τον αερισμό που απαιτεί ο κατασκευαστής και μακριά από εύφλεκτη ακαταστασία. Σταμάτησε να χρησιμοποιείς εμφανώς διογκωμένη, χτυπημένη, διαρρέουσα ή ασυνήθιστα θερμή μπαταρία. Μην επιχειρείς επισκευές σε επίπεδο κυψελών λιθίου μέσα σε κατάσταση έκτακτης ανάγκης.\n\n## Μέτρησε το πραγματικό σύστημα\nΚατέγραψε ποσοστό φόρτισης σε σταθερές ώρες, πηγή ενέργειας, μεγάλα φορτία και παράθυρα φόρτισης. Αν το σύστημα χάνει 20% τη νύχτα ενώ το σχέδιο προέβλεπε 8%, άλλαξε αμέσως το σχέδιο: βρες κρυφά φορτία, μείωσε χρόνο λειτουργίας ή αύξησε τη φόρτιση. Η ενότητα Ενέργειας του Κέντρου Ελέγχου συγκρίνει αποθηκευμένες βατώρες με ημερήσια ζήτηση και επιθυμητό απόθεμα.\n\n## Ηλιακή και φόρτιση από όχημα είναι πόροι με προϋποθέσεις\nΗ ηλιακή παραγωγή εξαρτάται από καιρό, προσανατολισμό, σκίαση, θερμοκρασία και ελεγκτή. Η φόρτιση από όχημα καταναλώνει καύσιμο ή ενέργεια κίνησης και μπορεί να μειώσει την εμβέλεια εκκένωσης. Αντιμετώπισε και τις δύο ως εισροές με κόστος ευκαιρίας, όχι ως απεριόριστη δωρεάν ενέργεια.\n\n## Πηγές αναφοράς\n- Εγχειρίδια και ηλεκτρικά όρια κατασκευαστών μπαταριών και μετατροπέων.\n- Τοπικές οδηγίες πυρασφάλειας και ηλεκτρικής ασφάλειας για επαναφορτιζόμενες μπαταρίες.\n- Υπολογισμοί της ενότητας Ενέργειας του Offline Survival Project."}},{"id":33,"en":{"title":"Offline navigation: map, compass, waypoints, and error checking","body":"## A coordinate is not a route\nKnowing latitude and longitude does not tell you whether a road, bridge, slope or shoreline is passable. Offline navigation should combine a paper/offline map, known landmarks, route notes, compass orientation and stored waypoints. Keep at least one method that does not depend on a phone battery.\n\n## Calibrate your mental map\nBefore an emergency, mark home, work, school, hospital/clinic, assembly points, water sources, fuel, high ground, bridges, tunnels and alternative exits. Walk or drive important routes. Record where a route becomes unusable if one bridge closes or a coastal road is cut. A route you have never physically checked is only a hypothesis.\n\n## Compass discipline\nA compass helps maintain direction but can be influenced by nearby metal, vehicles, speakers, electrical equipment and magnets. Move away from obvious interference and compare the reading with terrain and known features. Phone compass sensors also require calibration and power. Do not follow a bearing blindly into a cliff, flood zone, private barrier or fire area.\n\n## Waypoint quality\nStore coordinates with a plain-language description: “north entrance of school assembly area,” not “WP7.” Include access notes, elevation if relevant, last verification date and why the point matters. If coordinates come from another person, verify the datum/format and plot them before relying on them.\n\n## Position uncertainty\nGPS accuracy can degrade near buildings, steep terrain, canopy or poor satellite geometry. If the marker jumps, stop and use multiple clues instead of walking farther to make the screen “agree.” In an evacuation, safe route status is more important than geometric shortest distance.\n\n## Source anchors\n- Official topographic/local maps and civil-protection evacuation maps.\n- Device GNSS/compass manufacturer guidance.\n- Offline Survival Project waypoint and route tools."},"el":{"title":"Πλοήγηση χωρίς δίκτυο: χάρτης, πυξίδα, σημεία και έλεγχος λάθους","body":"## Μια συντεταγμένη δεν είναι διαδρομή\nΤο γεωγραφικό πλάτος και μήκος δεν αποκαλύπτουν αν ένας δρόμος, γέφυρα, πρανές ή ακτή είναι βατά. Η πλοήγηση χωρίς δίκτυο πρέπει να συνδυάζει χάρτη σε χαρτί ή αποθηκευμένο τοπικά, γνωστά σημεία αναφοράς, σημειώσεις διαδρομής, προσανατολισμό με πυξίδα και αποθηκευμένα σημεία. Διατήρησε τουλάχιστον μία μέθοδο που δεν εξαρτάται από μπαταρία τηλεφώνου.\n\n## Δημιούργησε νοητικό χάρτη πριν το συμβάν\nΣημείωσε σπίτι, εργασία, σχολείο, κλινική ή νοσοκομείο, σημεία συγκέντρωσης, πηγές νερού, καύσιμα, ψηλό έδαφος, γέφυρες, σήραγγες και εναλλακτικές εξόδους. Περπάτησε ή οδήγησε τις σημαντικές διαδρομές. Κατέγραψε τι παύει να λειτουργεί αν κλείσει μία γέφυρα ή ένας παραλιακός δρόμος. Μια διαδρομή που δεν έχεις ελέγξει ποτέ στην πράξη είναι μόνο υπόθεση.\n\n## Πειθαρχία πυξίδας\nΗ πυξίδα βοηθά στον προσανατολισμό αλλά επηρεάζεται από μέταλλα, οχήματα, ηχεία, ηλεκτρικό εξοπλισμό και μαγνήτες. Απομακρύνσου από εμφανείς παρεμβολές και σύγκρινε την ένδειξη με το ανάγλυφο και γνωστά σημεία. Οι αισθητήρες πυξίδας του τηλεφώνου χρειάζονται επίσης σωστή βαθμονόμηση και ενέργεια. Μην ακολουθείς μια διόπτευση τυφλά προς γκρεμό, πλημμύρα, κλειστό χώρο ή περιοχή φωτιάς.\n\n## Ποιότητα σημείων\nΑποθήκευσε συντεταγμένες με σαφή περιγραφή, π.χ. «βόρεια είσοδος σχολείου, σημείο συγκέντρωσης», όχι «Σημείο 7». Πρόσθεσε σημειώσεις πρόσβασης, υψόμετρο όπου έχει σημασία, ημερομηνία τελευταίου ελέγχου και σκοπό. Αν οι συντεταγμένες προέρχονται από άλλο άτομο, έλεγξε μορφή και απεικόνισέ τες πριν βασιστείς σε αυτές.\n\n## Αβεβαιότητα θέσης\nΗ ακρίβεια δορυφορικού εντοπισμού μπορεί να χειροτερεύσει ανάμεσα σε κτίρια, σε απότομο ανάγλυφο, κάτω από πυκνή βλάστηση ή με κακή γεωμετρία δορυφόρων. Αν ο δείκτης μετακινείται απότομα, σταμάτησε και χρησιμοποίησε περισσότερα στοιχεία αντί να περπατάς για να «ταιριάξει» η οθόνη. Σε εκκένωση, η πραγματική κατάσταση της διαδρομής είναι σημαντικότερη από τη γεωμετρικά μικρότερη απόσταση.\n\n## Πηγές αναφοράς\n- Επίσημοι τοπογραφικοί, τοπικοί και χάρτες εκκένωσης Πολιτικής Προστασίας.\n- Οδηγίες κατασκευαστή συσκευής για δορυφορικό εντοπισμό και πυξίδα.\n- Εργαλεία σημείων και διαδρομών του Offline Survival Project."}},{"id":34,"en":{"title":"Evacuation vehicle: range, loading, and departure readiness","body":"## The vehicle is part of t
