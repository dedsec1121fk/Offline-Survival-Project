ωση ασφαλούς νερού. Μην πλένεις με χημικά ύποπτο νερό ρούχα που θα ακουμπούν στο δέρμα.\n\n## Το στέγνωμα είναι μέρος της διαδικασίας\nΥγρά υφάσματα σε σωρό μπορούν να αναπτύξουν οσμές και μικροβιακή ανάπτυξη. Δημιούργησε ροή αέρα και χώρο στεγνώματος χωρίς να κλείνεις εξόδους, θερμαντικά σώματα ή ηλεκτρικό εξοπλισμό. Σε αποκατάσταση μετά από υγρασία/πλημμύρα, η μείωση εσωτερικής υγρασίας και το γρήγορο στέγνωμα μπορεί να είναι εξίσου σημαντικά με το πλύσιμο.\n\n## Προστάτευσε αυτόν που εκτελεί την εργασία\nΠλύνε χέρια μετά τον χειρισμό βρόμικων ρούχων και πριν αγγίξεις καθαρά. Αν απαιτούνται γάντια ή άλλα μέσα προστασίας, αφαίρεσέ τα χωρίς να μολύνεις την καθαρή πλευρά. Άτομα με αναπνευστικά προβλήματα, μειωμένη ανοσία ή άλλη ευαλωτότητα αποφεύγουν εργασίες με μούχλα/λύματα όταν αυτό συστήνεται από τη δημόσια υγεία.\n\n## Επανέναρξη κανονικού πλυσίματος με έλεγχο\nΜετά την επιστροφή νερού/ρεύματος, έλεγξε το πλυντήριο και την περιοχή για έκθεση σε πλημμύρα ή λύματα πριν από χρήση. Καθάρισε κατάλληλα μολυσμένες επιφάνειες και ξεκίνησε μόνο όταν η παροχή είναι ασφαλής. Τεκμηρίωσε σημαντικές απώλειες υφασμάτων για αποκατάσταση αντί να τις αναμειγνύεις ξανά στην απογραφή.\n\nΚωδικοί τεκμηρίωσης: CLEANUP-1, CDC-HYGIENE-1, CDC-DISASTER-1."}},{"id":122,"en":{"title":"Sleep, bedding and the dry-warm zone: protect recovery capacity during a long incident","body":"## Sleep is an operational resource\nPoor sleep compounds judgment errors, irritability, falls and missed tasks. During a multi-day outage, do not treat every night as an improvised camp. Establish a protected sleep zone with known occupants, clear exits, ventilation appropriate to the conditions and a plan for night check-ins.\n\n## Keep bedding dry\nSeparate sleeping gear from wet boots, flood cleanup clothing, cooking steam and water storage. If a room becomes damp, move bedding before it absorbs moisture where practical. Dry insulation is far more useful in cold conditions than extra layers that have become wet.\n\n## Match warmth to the person\nChildren, older adults and people with certain health conditions may tolerate temperature extremes differently. Use layered bedding and clothing so heat can be adjusted without overheating. Avoid unsafe heating appliances or bringing outdoor combustion equipment into sleeping spaces. Carbon-monoxide risk does not disappear because people are asleep.\n\n## Assign night-light and exit discipline\nKeep a light within reach without requiring someone to cross the room in darkness. Do not pile bags or emergency supplies in the exit route. In shared rooms, decide where mobility aids, glasses, hearing devices, shoes and medications are kept so they can be found quickly.\n\n## Schedule rest around essential duties\nIf one person is responsible for generator checks, communications or care, provide a backup rather than keeping that person awake indefinitely. Use handover notes. A fatigued operator is more likely to misread fuel, skip a sanitation step or make a poor evacuation decision.\n\n## Reassess the shelter if sleep becomes impossible\nPersistent smoke infiltration, dangerous heat/cold, repeated water entry, structural noise/damage or inability to meet a dependent person’s needs may mean the location is no longer a viable shelter. Rest quality is not merely comfort; it can reveal that the operating environment itself is failing.\n\nEvidence IDs: READY-SHELTER-1, READY-WINTER-1, READY-OLDER-1."},"el":{"title":"Ύπνος, κλινοσκεπάσματα και ξηρή-ζεστή ζώνη: προστάτευσε την ικανότητα ανάκαμψης","body":"## Ο ύπνος είναι επιχειρησιακός πόρος\nΗ έλλειψη ύπνου αυξάνει λάθη κρίσης, ευερεθιστότητα, πτώσεις και παραλείψεις εργασιών. Σε πολυήμερη διακοπή, μην αντιμετωπίζεις κάθε νύχτα ως αυτοσχέδιο κάμπινγκ. Όρισε προστατευμένο χώρο ύπνου με γνωστούς χρήστες, ελεύθερες εξόδους, αερισμό κατάλληλο για τις συνθήκες και σχέδιο νυχτερινού ελέγχου.\n\n## Κράτησε τα κλινοσκεπάσματα στεγνά\nΧώρισέ τα από βρεγμένα παπούτσια, ρούχα καθαρισμού πλημμύρας, ατμούς μαγειρέματος και αποθήκη νερού. Αν ένα δωμάτιο γίνει υγρό, μετακίνησε τα είδη ύπνου πριν απορροφήσουν υγρασία όπου είναι εφικτό. Η στεγνή μόνωση είναι πολύ πιο χρήσιμη στο κρύο από επιπλέον στρώσεις που έχουν βραχεί.\n\n## Προσαρμόσε τη ζέστη στο άτομο\nΠαιδιά, ηλικιωμένοι και άτομα με ορισμένες παθήσεις μπορεί να ανέχονται διαφορετικά τις ακραίες θερμοκρασίες. Χρησιμοποίησε στρώσεις ρούχων και κλινοσκεπασμάτων ώστε η θερμότητα να ρυθμίζεται χωρίς υπερθέρμανση. Μην χρησιμοποιείς επικίνδυνες θερμαντικές συσκευές και μην φέρνεις εξοπλισμό καύσης εξωτερικού χώρου στο σημείο ύπνου. Ο κίνδυνος μονοξειδίου δεν εξαφανίζεται όταν οι άνθρωποι κοιμούνται.\n\n## Νυχτερινός φωτισμός και ελεύθερη έξοδος\nΚράτησε φως σε απόσταση χεριού χωρίς να απαιτείται κίνηση στο σκοτάδι. Μην στοιβάζεις σακίδια ή εφόδια πάνω στη διαδρομή εξόδου. Σε κοινό χώρο αποφάσισε πού μένουν βοηθήματα κινητικότητας, γυαλιά, ακουστικές συσκευές, παπούτσια και φάρμακα ώστε να βρίσκονται γρήγορα.\n\n## Προγραμμάτισε ξεκούραση γύρω από τις κρίσιμες εργασίες\nΑν ένα άτομο είναι υπεύθυνο για γεννήτρια, επικοινωνίες ή φροντίδα, όρισε εφεδρικό αντί να το κρατάς ξύπνιο επ’ αόριστον. Χρησιμοποίησε σημειώσεις παράδοσης βάρδιας. Η κόπωση αυξάνει την πιθανότητα λανθασμένης ανάγνωσης καυσίμου, παράλειψης υγιεινής ή κακής απόφασης εκκένωσης.\n\n## Επανεκτίμησε το καταφύγιο αν ο ύπνος γίνεται αδύνατος\nΣυνεχής εισροή καπνού, επικίνδυνη ζέστη ή ψύχος, επαναλαμβανόμενη είσοδος νερού, δομικοί θόρυβοι/ζημιές ή αδυναμία κάλυψης εξαρτώμενου ατόμου μπορεί να σημαίνουν ότι η θέση δεν είναι πλέον βιώσιμη. Η ποιότητα ανάπαυσης δεν είναι μόνο άνεση· μπορεί να αποκαλύψει αποτυχία του ίδιου του περιβάλλοντος.\n\nΚωδικοί τεκμηρίωσης: READY-SHELTER-1, READY-WINTER-1, READY-OLDER-1."}},{"id":123,"en":{"title":"Clothing in cold, rain and wind: manage moisture before adding more layers","body":"## Start dry whenever possible\nWet clothing conducts heat away from the body and can make a mild temperature more dangerous, especially with wind. Keep at least one dry base layer and socks sealed inside the evacuation or shelter kit. Do not use that reserve for ordinary convenience; it exists for a person who becomes wet.\n\n## Build layers with different jobs\nA base layer manages moisture, an insulating layer traps warm air, and an outer layer protects from wind/rain. The exact garments depend on climate and activity. More insulation is not always better during hard physical work because sweat can soak inner layers and become a cold problem when activity stops.\n\n## Vent before soaking\nOpen or remove an outer layer during exertion when conditions allow, then add insulation before resting. Protect head, hands and feet but avoid garments so tight that they impair circulation or movement. Replace wet gloves/socks early rather than waiting until they become a medical problem.\n\n## Keep the clean/dry reserve separate\nUse a waterproof inner bag or container rather than trusting the outside of a backpack. Floodwater-contaminated clothes do not belong in the same bag as dry sleep clothing. Mark one set as sleep/emergency reserve if the incident may last several days.\n\n## Dry without creating a new hazard\nHang clothes where air can circulate but not directly against heaters, flames, generators or cooking equipment. Do not block exits. If indoor humidity is already high after flooding, drying large amounts of wet gear inside may worsen moisture problems; choose the driest safe area available.\n\n## Recognize when clothing is no longer enough\nPersistent shivering, confusion, loss of coordination, unusual drowsiness or skin changes from cold require prompt warming and medical evaluation according to current health guidance. Clothing management is prevention, not treatment for severe cold injury.\n\nEvidence IDs: READY-WINTER-1, CDC-DISASTER-1, COLD-1."},"el":{"title":"Ρουχισμός σε κρύο, βροχή και άνεμο: διαχειρίσου πρώτα την υγρασία","body":"## Ξεκίνα στεγνός όπου είναι δυνατό\nΒρεγμένα ρούχα απομακρύνουν θερμότητα από το σώμα και μπορούν να κάνουν ακόμη και μέτρια θερμοκρασία πιο επικίνδυνη, ιδιαίτερα με άνεμο. Κράτησε τουλάχιστον ένα στεγνό εσωτερικό στρώμα και κάλτσες σφραγισμένα μέσα στο κιτ διαφυγής ή καταφυγίου. Μην ξοδεύεις αυτή την εφεδρεία για καθημερινή άνεση· προορίζεται για άνθρωπο που θα βραχεί.\n\n## Δώσε διαφορετική δουλειά σε κάθε στρώση\nΤο εσωτερικό στρώμα διαχειρίζεται υγρασία, το μονωτικό συγκρατεί θερμό αέρα και το εξωτερικό προστατεύει από άνεμο/βροχή. Τα συγκεκριμένα ρούχα εξαρτώνται από κλίμα και δραστηριότητα. Περισσότερη μόνωση δεν είναι πάντα καλύτερη σε έντονη εργασία, επειδή ο ιδρώτας μπορεί να βρέξει τα εσωτερικά στρώματα και να γίνει πρόβλημα όταν σταματήσει η κίνηση.\n\n## Αερίσου πριν ιδρώσεις υπερβολικά\nΆνοιξε ή αφαίρεσε εξωτερική στρώση κατά την έντονη κίνηση όταν το επιτρέπουν οι συνθήκες και πρόσθεσε μόνωση πριν από την ανάπαυση. Προστάτευσε κεφάλι, χέρια και πόδια αλλά απόφυγε τόσο στενά ρούχα που μειώνουν κυκλοφορία ή κίνηση. Άλλαξε βρεγμένα γάντια ή κάλτσες νωρίς αντί να περιμένεις να εξελιχθούν σε ιατρικό πρόβλημα.\n\n## Χώρισε το καθαρό/στεγνό απόθεμα\nΧρησιμοποίησε αδιάβροχη εσωτερική σακούλα ή δοχείο και όχι μόνο το εξωτερικό σακίδιο. Ρούχα μολυσμένα από πλημμύρα δεν μπαίνουν μαζί με στεγνό εξοπλισμό ύπνου. Σε πολυήμερο συμβάν σημείωσε ένα σύνολο ως εφεδρεία ύπνου/ανάγκης.\n\n## Στέγνωμα χωρίς νέο κίνδυνο\nΚρέμασε ρούχα με ροή αέρα αλλά όχι πάνω σε θερμαντικά σώματα, φλόγες, γεννήτριες ή εξοπλισμό μαγειρέματος. Μην κλείνεις εξόδους. Αν η εσωτερική υγρασία είναι ήδη υψηλή μετά από πλημμύρα, η ξήρανση μεγάλου όγκου βρεγμένων ρούχων μέσα μπορεί να επιδεινώσει το πρόβλημα· προτίμησε την ξηρότερη ασφαλή ζώνη.\n\n## Αναγνώρισε πότε ο ρουχισμός δεν αρκεί\nΕπίμονο ρίγος, σύγχυση, απώλεια συντονισμού, ασυνήθιστη υπνηλία ή μεταβολές δέρματος από κρύο απαιτούν άμεση θέρμανση και ιατρική αξιολόγηση σύμφωνα με την τρέχουσα υγειονομική καθοδήγηση. Η διαχείριση ρουχισμού είναι πρόληψη και όχι θεραπεία σοβαρού τραυματισμού από ψύχος.\n\nΚωδικοί τεκμηρίωσης: READY-WINTER-1, CDC-DISASTER-1, COLD-1."}},{"id":124,"en":{"title":"Feet and walking mobility: protect the evacuation system you carry on your body","body":"## Foot problems become transport problems\nA small hot spot, wet sock or poorly fitting shoe can become a reason someone cannot continue walking. During evacuation, inspect feet at planned stops rather than waiting for pain to become severe. People with diabetes, circulation problems or reduced sensation should follow their clinician’s foot-care plan and avoid self-treatment that could create injury.\n\n## Start with tested footwear\nEmergency footwear should already fit with the socks normally used. A brand-new pair stored untouched in a go-bag may create problems on the first long walk. Keep laces, closures and soles in good condition and include an alternative if one person depends on specialized footwear or orthotics.\n\n## Keep feet dry and manage friction early\nChange wet socks when possible, air feet during safe rests and remove grit from shoes. Address a friction “hot spot” before the skin breaks using a familiar protective method suitable for the person. Do not cut, drain or aggressively treat a blister when you cannot maintain clean wound care.\n\n## Load affects the feet\nAn overloaded pack changes gait and increases fatigue. Remove unnecessary weight before trying to solve the resulting pain with more padding. Distribute shared water/equipment according to people’s actual carrying ability and update the route plan if pace falls below what the evacuation window requires.\n\n## Build rest into the route\nChoose stops where people can sit safely, inspect footwear, drink and reassess. Long continuous walking without a check can hide a developing problem until the group is far from alternatives. Record anyone whose mobility is deteriorating and move them earlier to available transport if appropriate.\n\n## Escalate injuries\nDeep wounds, signs of infection, inability to bear weight, major swelling, loss of sensation or significant trauma need professional medical evaluation. The operational objective is to preserve mobility without turning minor discomfort into a more serious injury.\n\nEvidence IDs: READY-PLAN-1, READY-KIT-1, ACCESS-1."},"el":{"title":"Πόδια και ικανότητα βάδισης: προστάτευσε το μέσο μετακίνησης που κουβαλάς πάνω σου","body":"## Ένα πρόβλημα στο πόδι γίνεται πρόβλημα μεταφοράς\nΜικρή ενόχληση τριβής, βρεγμένη κάλτσα ή ακατάλληλο παπούτσι μπορούν να εμποδίσουν τη συνέχεια της πορείας. Σε εκκένωση, έλεγξε τα πόδια σε προγραμματισμένες στάσεις και όχι όταν ο πόνος έχει ήδη γίνει έντονος. Άτομα με διαβήτη, προβλήματα κυκλοφορίας ή μειωμένη αισθητικότητα ακολουθούν το σχέδιο φροντίδας του ιατρού τους και αποφεύγουν αυτοσχέδιες παρεμβάσεις που μπορεί να δημιουργήσουν τραυματισμό.\n\n## Ξεκίνα με δοκιμασμένα υποδήματα\nΤα παπούτσια ανάγκης πρέπει να έχουν ήδη χρησιμοποιηθεί με τις κάλτσες που θα φορεθούν. Ένα εντελώς καινούργιο ζευγάρι αποθηκευμένο σε σακίδιο μπορεί να αποτύχει στην πρώτη μεγάλη διαδρομή. Κράτησε κορδόνια, κλεισίματα και σόλες σε καλή κατάσταση και πρόβλεψε εναλλακτική αν κάποιος χρειάζεται ειδικά υποδήματα ή ορθωτικά.\n\n## Κράτησε τα πόδια στεγνά και έλεγξε την τριβή νωρίς\nΆλλαξε βρεγμένες κάλτσες όπου γίνεται, αέρισε τα πόδια σε ασφαλείς στάσεις και αφαίρεσε χαλίκια/ρύπους από το παπούτσι. Αντιμετώπισε έγκαιρα ένα σημείο τριβής με γνώριμη προστατευτική μέθοδο κατάλληλη για το άτομο. Μην κόβεις, τρυπάς ή επεμβαίνεις επιθετικά σε φουσκάλα όταν δεν μπορεί να διατηρηθεί καθαρή φροντίδα τραύματος.\n\n## Το φορτίο επηρεάζει τη βάδιση\nΥπερφορτωμένο σακίδιο αλλάζει τον βηματισμό και αυξάνει την κόπωση. Αφαίρεσε περιττό βάρος πριν προσπαθήσεις να λύσεις τον πόνο με περισσότερη επένδυση. Μοίρασε κοινό νερό και εξοπλισμό ανάλογα με την πραγματική ικανότητα μεταφοράς και άλλαξε τη διαδρομή αν ο ρυθμός πέσει κάτω από το διαθέσιμο παράθυρο εκκένωσης.\n\n## Ενσωμάτωσε στάσεις στη διαδρομή\nΔιάλεξε σημεία όπου οι άνθρωποι μπορούν να καθίσουν με ασφάλεια, να ελέγξουν υποδήματα, να πιουν και να επανεκτιμήσουν. Συνεχής πολύωρη πορεία μπορεί να κρύψει πρόβλημα μέχρι η ομάδα να απομακρυνθεί από εναλλακτικές. Κατέγραψε ποιο άτομο χάνει κινητικότητα και μετακίνησέ το έγκαιρα σε διαθέσιμο μέσο αν χρειάζεται.\n\n## Πότε απαιτείται ιατρική αξιολόγηση\nΒαθύ τραύμα, σημεία λοίμωξης, αδυναμία φόρτισης του ποδιού, μεγάλη διόγκωση, απώλεια αισθητικότητας ή σημαντικό τραύμα χρειάζονται επαγγελματική φροντίδα. Ο στόχος είναι να διατηρηθεί η κινητικότητα χωρίς μια μικρή ενόχληση να μετατραπεί σε σοβαρότερο τραυματισμό.\n\nΚωδικοί τεκμηρίωσης: READY-PLAN-1, READY-KIT-1, ACCESS-1."}},{"id":125,"en":{"title":"High-rise utility outage: plan for stairs, water pressure and vertical dependency","body":"## Height changes ordinary preparedness\nIn a tower or multi-storey apartment building, loss of power can stop lifts, pumps, access systems, corridor lighting and sometimes water delivery to upper floors. A household that can manage a three-day outage at ground level may be unable to carry the same water, equipment or dependent person up many flights of stairs.\n\n## Know the building systems before failure\nIdentify stairwells, alternative exits, refuge/accessibility arrangements, fire doors, emergency lighting, building management contacts and where official notices are posted. Never assume a lift will be available for evacuation. Residents who cannot use stairs need a building-specific assistance plan developed before the emergency, consistent with local fire and accessibility rules.\n\n## Water is a vertical logistics problem\nStored water is heavy. Keep a sensible reserve inside the dwelling before an outage instead of planning repeated stair carries after pumps fail. Divide the reserve into containers that can be safely handled. If building management provides temporary distribution at ground level, assign carriers, protect stairs from spills and do not exceed individual lifting ability.\n\n## Entry systems can fail\nElectronic locks, intercoms and garage gates may behave differently without power. Know the lawful/manual emergency procedures and keep required physical keys accessible. Do not wedge fire doors open to make movement easier; that can defeat smoke compartmentation.\n\n## Reduce unnecessary trips\nCoordinate errands between households where appropriate. One descent for verified information or supplies is safer than repeated independent journeys in dark stairs. Keep the mobile phone/radio reserve for essential communication and use the building check-in system to identify residents needing assistance.\n\n## Decide early when the building is no longer workable\nDangerous indoor temperature, loss of safe water, smoke, repeated aftershocks/structural concerns, fire-system failure or inability to support power-dependent care may justify relocation under official guidance. The correct decision can be leaving before stairs become harder, not proving the household can remain indefinitely.\n\nEvidence IDs: READY-LOCATIONS-1, READY-DISABILITY-1, GR-GENERAL-1."},"el":{"title":"Διακοπή υποδομών σε πολυώροφο κτίριο: σκάλες, πίεση νερού και κατακόρυφη εξάρτηση","body":"## Το ύψος αλλάζει την ετοιμότητα\nΣε πολυκατοικία ή πύργο, η απώλεια ρεύματος μπορεί να σταματήσει ανελκυστήρες, αντλίες, συστήματα πρόσβασης, φωτισμό διαδρόμων και σε ορισμένα κτίρια την παροχή νερού στους ψηλότερους ορόφους. Νοικοκυριό που αντέχει τρεις ημέρες σε ισόγειο μπορεί να μην μπορεί να μεταφέρει το ίδιο νερό, εξοπλισμό ή εξαρτώμενο άτομο σε πολλές σκάλες.\n\n## Γνώρισε τα συστήματα πριν από τη βλάβη\nΕντόπισε κλιμακοστάσια, εναλλακτικές εξόδους, προβλέψεις προσβασιμότητας/αναμονής, πυράντοχες πόρτες, φωτισμό ανάγκης, επαφές διαχείρισης και σημεία επίσημων ανακοινώσεων. Μην θεωρείς ότι ανελκυστήρας θα είναι διαθέσιμος στην εκκένωση. Κάτοικοι που δεν μπορούν να χρησιμοποιήσουν σκάλες χρειάζονται σχέδιο βοήθειας ειδικό για το κτίριο, συμβατό με τους τοπικούς κανόνες πυρασφάλειας και προσβασιμότητας.\n\n## Το νερό είναι πρόβλημα κατακόρυφης εφοδιαστικής\nΤο νερό είναι βαρύ. Κράτησε λογικό απόθεμα μέσα στην κατοικία πριν από τη διακοπή αντί να σχεδιάζεις συνεχείς μεταφορές από το ισόγειο αφού σταματήσουν οι αντλίες. Μοίρασέ το σε δοχεία που μπορούν να σηκωθούν με ασφάλεια. Αν η διαχείριση οργανώσει διανομή χαμηλά, όρισε μεταφορείς, πρόλαβε νερά στις σκάλες και μην υπερβαίνεις τις δυνατότητες κάθε ατόμου.\n\n## Τα ηλεκτρονικά συστήματα εισόδου μπορεί να αποτύχουν\nΗλεκτρονικές κλειδαριές, θυροτηλέφωνα και πόρτες γκαράζ μπορεί να λειτουργούν διαφορετικά χωρίς ρεύμα. Γνώρισε τις νόμιμες χειροκίνητες διαδικασίες έκτακτης ανάγκης και κράτα τα απαραίτητα φυσικά κλειδιά προσβάσιμα. Μην σφηνώνεις πυράντοχες πόρτες ανοιχτές για ευκολότερη κίνηση· έτσι μπορεί να χαθεί ο διαχωρισμός καπνού.\n\n## Μείωσε τις άσκοπες διαδρομές\nΣυντόνισε ανάγκες μεταξύ γειτόνων όπου είναι κατάλληλο. Μία οργανωμένη κάθοδος για επιβεβαιωμένες πληροφορίες ή εφόδια είναι ασφαλέστερη από συνεχείς ανεξάρτητες κινήσεις σε σκοτεινές σκάλες. Κράτησε την εφεδρεία τηλεφώνου/ραδιοφώνου για ουσιαστικές επικοινωνίες και χρησιμοποίησε το σύστημα check-in για να εντοπίζονται κάτοικοι που χρειάζονται βοήθεια.\n\n## Αποφάσισε έγκαιρα πότε το κτίριο δεν είναι πλέον βιώσιμο\nΕπικίνδυνη εσωτερική θερμοκρασία, απώλεια ασφαλούς νερού, καπνός, επαναλαμβανόμενοι μετασεισμοί ή δομική ανησυχία, βλάβη πυρασφάλειας ή αδυναμία υποστήριξης εξοπλισμού υγείας μπορεί να απαιτούν μετακίνηση σύμφωνα με τις Αρχές. Η σωστή απόφαση μπορεί να είναι η αποχώρηση πριν γίνουν δυσκολότερες οι σκάλες και όχι η απόδειξη ότι «αντέχουμε επ’ αόριστον».\n\nΚωδικοί τεκμηρίωσης: READY-LOCATIONS-1, READY-DISABILITY-1, GR-GENERAL-1."}},{"id":126,"en":{"title":"Apartment fire and smoke: make the exit decision from conditions and official building guidance","body":"## Fire behavior in multi-unit buildings is not a simple house-fire copy\nA fire may be inside your unit, elsewhere in the building, in a corridor or below you. Smoke in the common route can make an otherwise familiar staircase dangerous. Know the building’s fire instructions, alarm system and designated escape routes before an incident. Local fire-service instructions override a generic checklist.\n\n## If the fire is in your dwelling, escape comes first\nAlert others, use the planned exit if it is tenable and call emergency services from safety. Close doors behind you when possible to limit smoke/fire spread. Do not delay for property. Do not use an elevator unless the building/fire authority specifically provides an evacuation lift and instructs its use.\n\n## Test the route without entering smoke\nBefore opening a door into a common area, look/listen/smell for signs of fire and follow recognized fire-safety guidance for checking whether the route is tenable. If the corridor or stairwell is smoke-filled or the route is unsafe, do not push through blindly. Use the building’s alternative/protected strategy and communicate your location to emergency services.\n\n## Keep fire doors functional\nDoors designed to limit smoke/fire spread must not be propped open for convenience during an outage or evacuation. Storage in corridors and stairs can narrow escape routes. Keep mobility aids positioned so they are accessible without obstructing others.\n\n## Meeting and accountability\nThe household should have a meeting point outside and away from fire-service access. Report missing people; do not re-enter to search. In a larger building, a neighbor check should never delay a required evacuation or place someone into smoke.\n\n## Recovery starts after clearance\nDo not return because visible flames are gone. Wait for fire-service/building clearance, then consider smoke contamination, water damage, electrical damage and alarm replacement. Photograph losses only after the area is safe.\n\nEvidence IDs: READY-FIRE-1, GR-GENERAL-1, GR-112-1."},"el":{"title":"Πυρκαγιά και καπνός σε διαμέρισμα: η απόφαση εξόδου βασίζεται στις συνθήκες και στις οδηγίες του κτιρίου","body":"## Η φωτιά σε πολυκατοικία δεν είναι απλή αντιγραφή μιας μονοκατοικίας\nΗ πυρκαγιά μπορεί να βρίσκεται μέσα στο διαμέρισμα, αλλού στο κτίριο, στον διάδρομο ή σε χαμηλότερο όροφο. Καπνός στην κοινή διαδρομή μπορεί να κάνει επικίνδυνο ένα γνώριμο κλιμακοστάσιο. Γνώρισε πριν το συμβάν τις οδηγίες πυρασφάλειας του κτιρίου, τον συναγερμό και τις προβλεπόμενες διαδρομές. Η καθοδήγηση της αρμόδιας Πυροσβεστικής υπερισχύει ενός γενικού καταλόγου.\n\n## Αν η φωτιά είναι μέσα στην κατοικία, προέχει η διαφυγή\nΕιδοποίησε τους άλλους, χρησιμοποίησε την προβλεπόμενη έξοδο αν είναι βατή και κάλεσε βοήθεια από ασφαλές σημείο. Κλείσε πόρτες πίσω σου όπου γίνεται για να περιοριστεί η εξάπλωση καπνού/φωτιάς. Μην καθυστερείς για αντικείμενα. Μην χρησιμοποιείς ανελκυστήρα εκτός αν το κτίριο διαθέτει ειδικό σύστημα εκκένωσης και οι αρμόδιες υπηρεσίες δίνουν τέτοια οδηγία.\n\n## Έλεγξε τη διαδρομή χωρίς είσοδο σε καπνό\nΠριν ανοίξεις προς κοινόχρηστο χώρο, παρατήρησε σημάδια φωτιάς/καπνού και ακολούθησε αναγνωρισμένες οδηγίες πυρασφάλειας για να κρίνεις αν η διαδρομή είναι ασφαλής. Αν διάδρομος ή σκάλα είναι γεμάτα καπνό, μην προχωράς στα τυφλά. Χρησιμοποίησε την εναλλακτική/προστατευμένη στρατηγική του κτιρίου και ενημέρωσε τις υπηρεσίες για τη θέση σου.\n\n## Κράτησε λειτουργικές τις πυράντοχες πόρτες\nΠόρτες που περιορίζουν καπνό και φωτιά δεν σφηνώνονται ανοιχτές για ευκολία στη διακοπή ή στην εκκένωση. Αποθήκευση σε διαδρόμους και σκάλες μειώνει το πλάτος διαφυγής. Βοηθήματα κινητικότητας τοποθετούνται ώστε να είναι άμεσα διαθέσιμα χωρίς να εμποδίζουν άλλους.\n\n## Σημείο συνάντησης και καταμέτρηση\nΤο νοικοκυριό χρειάζεται εξωτερικό σημείο συνάντησης μακριά από την πρόσβαση της Πυροσβεστικής. Δήλωσε αγνοούμενους· μην ξαναμπείς για αναζήτηση. Σε μεγάλο κτίριο, έλεγχος γείτονα δεν πρέπει να καθυστερεί απαιτούμενη εκκένωση ούτε να βάζει κάποιον μέσα σε καπνό.\n\n## Η αποκατάσταση αρχίζει μετά την άδεια\nΜην επιστρέψεις επειδή δεν φαίνονται φλόγες. Περίμενε την άδεια της Πυροσβεστικής/διαχείρισης και μετά αξιολόγησε καπνό, νερά κατάσβεσης, ηλεκτρική ζημιά και ανάγκη αντικατάστασης συναγερμών. Φωτογράφιση ζημιών γίνεται μόνο όταν η περιοχή είναι ασφαλής.\n\nΚωδικοί τεκμηρίωσης: READY-FIRE-1, GR-GENERAL-1, GR-112-1."}},{"id":127,"en":{"title":"Apartment water storage: balance litres, lifting, floor space and contamination control","body":"## The largest container is rarely the best answer\nWater is heavy and apartment storage is constrained by floor space, stairs and the ability of household members to move it. Build the reserve from multiple manageable containers instead of one tank nobody can relocate. Keep the total distributed in sensible locations rather than concentrated on a weak shelf or unstable furniture.\n\n## Separate daily access from strategic reserve\nKeep a small working supply in the kitchen and a larger sealed reserve in a protected location. This reduces repeated opening of the long-term stock. If the apartment has several levels, consider where water will actually be needed when lifts or pumps fail.\n\n## Protect from household contaminants\nDo not store drinking water beside fuels, solvents, pesticides, cleaning chemicals or flood-prone floor drains. Keep containers closed, labeled and away from direct sun/excess heat. A leak should not be able to reach electrical equipment or destroy documents.\n\n## Plan carrying before the outage\nIf resupply will come from a building lobby or public point, determine who can carry which container and how many stair trips are realistic. A 20-litre container may be an excellent storage unit for one household and unusable for another. Include a small trolley only if stairs/terrain permit it; do not rely on an elevator during a power failure.\n\n## Track potable and utility water separately\nWater collected for toilet flushing or cleaning must never become indistinguishable from drinking water. Use different containers or prominent labels. The Command Center water-batch ledger can record source and treatment but physical separation in the home remains essential.\n\n## Review the reserve after a real drill\nCarry one day’s planned volume through the actual route, open the containers, dispense water and replace them. Note leaks, grip problems and inaccessible storage. A theoretically sufficient number of litres is not preparedness if nobody can safely use them.\n\nEvidence IDs: READY-KIT-1, EPA-WATER-1, READY-LOCATIONS-1."},"el":{"title":"Αποθήκευση νερού σε διαμέρισμα: ισορρόπησε λίτρα, ανύψωση, χώρο και έλεγχο μόλυνσης","body":"## Το μεγαλύτερο δοχείο σπάνια είναι η καλύτερη λύση\nΤο νερό είναι βαρύ και ο χώρος διαμερίσματος περιορίζεται από δάπεδα, σκάλες και την ικανότητα των μελών να το μεταφέρουν. Δημιούργησε απόθεμα από πολλά διαχειρίσιμα δοχεία αντί για μία δεξαμενή που κανείς δεν μπορεί να μετακινήσει. Μοίρασε το συνολικό βάρος σε λογικές θέσεις και όχι πάνω σε αδύναμο ράφι ή ασταθές έπιπλο.\n\n## Χώρισε την καθημερινή χρήση από τη στρατηγική εφεδρεία\nΚράτησε μικρή ποσότητα εργασίας στην κουζίνα και μεγαλύτερο σφραγισμένο απόθεμα σε προστατευμένη θέση. Έτσι δεν ανοίγεται συνεχώς η μακροχρόνια εφεδρεία. Αν η κατοικία έχει περισσότερα επίπεδα, σκέψου πού θα χρειάζεται πραγματικά το νερό όταν ανελκυστήρες ή αντλίες δεν λειτουργούν.\n\n## Προστασία από οικιακούς ρύπους\nΜην αποθηκεύεις πόσιμο νερό δίπλα σε καύσιμα, διαλύτες, φυτοφάρμακα, καθαριστικά ή αποχετεύσεις που μπορούν να πλημμυρίσουν. Κράτα τα δοχεία κλειστά, σημειωμένα και μακριά από έντονο ήλιο/θερμότητα. Μια διαρροή δεν πρέπει να μπορεί να φτάσει σε ηλεκτρικό εξοπλισμό ή να καταστρέψει έγγραφα.\n\n## Σχεδίασε τη μεταφορά πριν από τη διακοπή\nΑν ο ανεφοδιασμός γίνει από ισόγειο ή δημόσιο σημείο, καθόρισε ποιος μπορεί να κουβαλήσει ποιο δοχείο και πόσες διαδρομές σκάλας είναι ρεαλιστικές. Ένα δοχείο 20 λίτρων μπορεί να είναι ιδανικό για ένα νοικοκυριό και αδύνατο για άλλο. Μικρό καρότσι βοηθά μόνο αν το επιτρέπουν σκάλες και έδαφος· μην βασίζεσαι σε ανελκυστήρα όταν λείπει το ρεύμα.\n\n## Χώρισε πόσιμο από νερό τεχνικής χρήσης\nΝερό για καζανάκι ή καθαρισμό δεν πρέπει να γίνεται αδύνατο να ξεχωρίσει από το πόσιμο. Χρησιμοποίησε διαφορετικά δοχεία ή πολύ εμφανή σήμανση. Το ημερολόγιο παρτίδων του Command Center μπορεί να κρατά πηγή και επεξεργασία, αλλά ο φυσικός διαχωρισμός στο σπίτι παραμένει απαραίτητος.\n\n## Δοκίμασε το απόθεμα στην πράξη\nΜετέφερε την προγραμματισμένη ποσότητα μιας ημέρας από την πραγματική διαδρομή, άνοιξε τα δοχεία, μοίρασε νερό και ξανατοποθέτησέ τα. Κατέγραψε διαρροές, προβλήματα λαβής και απρόσιτες θέσεις. Ένας θεωρητικά επαρκής αριθμός λίτρων δεν είναι ετοιμότητα αν δεν μπορούν να χρησιμοποιηθούν με ασφάλεια.\n\nΚωδικοί τεκμηρίωσης: READY-KIT-1, EPA-WATER-1, READY-LOCATIONS-1."}},{"id":128,"en":{"title":"Drinking-Water Advisories: Distinguishing Boil, Do-Not-Drink, and Do-Not-Use","body":"A household should not treat every water warning as a generic “boil it” problem. The action depends on the contaminant and on the exact wording issued by the water authority. CDC distinguishes boil-water, do-not-drink, and do-not-use advisories because boiling can control many biological hazards but cannot make every chemical or toxic contamination safe. A do-not-use notice is more restrictive still because skin contact or other use may also be unsafe.\n\n## Convert the notice into household rules\nWrite the advisory type, affected address or zone, issue time, official source, and next review time at the top of the water board. Under it, list each activity separately: drinking, food preparation, ice, teeth brushing, infant feeding, dishwashing, handwashing, bathing, pet water, medication preparation, and cleaning. Use the authority’s instructions for each activity rather than assuming one rule applies to all of them. Mark containers that were filled before the advisory separately from water collected after the advisory began.\n\n## Prevent a “safe-looking water” mistake\nClarity, smell, and taste cannot establish safety. Do not let a household filter create false confidence: during a boil-water advisory, CDC says filtered tap water may still need boiling. During a chemical do-not-drink warning, boiling may not remove the hazard and can be inappropriate. If the authority says do not use, isolate the tap source from routine household tasks until the restriction is lifted.\n\n## Track the end of the advisory\nDo not end restrictions because service pressure returns or the water looks normal. Record the official cancellation and any flushing, fixture, filter, ice-machine, or appliance instructions issued afterward. Replace or sanitize items only according to the applicable authority/manufacturer guidance. The command center can record the decision, but the local water authority remains the source of truth.\n\n## Verification sources\n- CDC — Drinking Water Advisories: https://www.cdc.gov/water-emergency/about/drinking-water-advisories-an-overview.html\n- CDC — Making Water Safe in an Emergency: https://www.cdc.gov/water-emergency/about/index.html\n\nVerification date: 2026-08-09."},"el":{"title":"Ειδοποιήσεις Πόσιμου Νερού: Βράσιμο, Μη Πόση και Καθόλου Χρήση","body":"Ένα νοικοκυριό δεν πρέπει να αντιμετωπίζει κάθε προειδοποίηση νερού σαν ένα γενικό πρόβλημα «βράσ’ το». Η σωστή ενέργεια εξαρτάται από τον ρύπο και από την ακριβή διατύπωση της αρμόδιας υπηρεσίας ύδρευσης. Το CDC ξεχωρίζει τις ειδοποιήσεις βρασμού, μη πόσης και καθόλου χρήσης, επειδή το βράσιμο μπορεί να ελέγξει πολλούς βιολογικούς κινδύνους αλλά δεν κάνει κάθε χημική ή τοξική ρύπανση ασφαλή. Η απαγόρευση χρήσης είναι ακόμη αυστηρότερη, επειδή μπορεί να είναι επικίνδυνη ακόμη και η επαφή με το νερό.\n\n## Μετέτρεψε την ειδοποίηση σε σαφείς κανόνες\nΓράψε στον πίνακα νερού τον τύπο της ειδοποίησης, την επηρεαζόμενη διεύθυνση ή ζώνη, την ώρα έκδοσης, την επίσημη πηγή και την επόμενη ώρα επανελέγχου. Από κάτω χώρισε τις χρήσεις: πόση, μαγείρεμα, πάγος, βούρτσισμα δοντιών, σίτιση βρέφους, πλύσιμο πιάτων, χέρια, μπάνιο, νερό ζώων, προετοιμασία φαρμάκων και καθαρισμός. Ακολούθησε την επίσημη οδηγία για κάθε χρήση αντί να θεωρείς ότι ένας κανόνας καλύπτει τα πάντα. Ξεχώρισε τα δοχεία που γέμισαν πριν από την ειδοποίηση από όσα γέμισαν μετά.\n\n## Μην εμπιστεύεσαι την εμφάνιση\nΗ διαύγεια, η οσμή και η γεύση δεν αποδεικνύουν ασφάλεια. Ένα οικιακό φίλτρο επίσης δεν πρέπει να δημιουργεί ψευδή βεβαιότητα: σε ειδοποίηση βρασμού, το CDC αναφέρει ότι ακόμη και φιλτραρισμένο νερό βρύσης μπορεί να χρειάζεται βράσιμο. Σε χημική ειδοποίηση μη πόσης, το βράσιμο μπορεί να μην αφαιρεί τον κίνδυνο και μπορεί να είναι ακατάλληλο. Αν η οδηγία είναι «μη χρήση», απομόνωσε πρακτικά την παροχή από τις καθημερινές εργασίες μέχρι την επίσημη άρση.\n\n## Κατάγραψε την άρση\nΜην σταματήσεις τους περιορισμούς επειδή επέστρεψε η πίεση ή επειδή το νερό φαίνεται φυσιολογικό. Κατέγραψε την επίσημη άρση και τυχόν οδηγίες για έκπλυση, βρύσες, φίλτρα, παγομηχανές ή συσκευές. Αντικατάστησε ή απολύμανε εξαρτήματα μόνο σύμφωνα με τις σχετικές οδηγίες υπηρεσίας ή κατασκευαστή. Το Κέντρο Ελέγχου βοηθά στην καταγραφή· η αρμόδια υπηρεσία ύδρευσης παραμένει η πηγή αλήθειας.\n\n## Πηγές επαλήθευσης\n- CDC — ειδοποιήσεις πόσιμου νερού: https://www.cdc.gov/water-emergency/about/drinking-water-advisories-an-overview.html\n- CDC — ασφαλές νερό σε έκτακτη ανάγκη: https://www.cdc.gov/water-emergency/about/index.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":129,"en":{"title":"Chemical Release Self-Decontamination: Get Away, Get It Off, Get Help","body":"Chemical releases require a different mindset from ordinary dirt or smoke. The first objective is to leave the contaminated area or follow an official shelter instruction, then reduce the material remaining on the body without spreading it to other people, rooms, vehicles, or pets. CDC emergency guidance emphasizes rapid decontamination rather than waiting to identify the exact chemical before taking any action.\n\n## Break the transfer chain\nMove away from the release if officials say evacuation is safe, or remain in the instructed shelter zone if outside air is the greater hazard. Once in a safer place, keep potentially contaminated people and clothing away from clean sleeping, food, and medical areas. Avoid shaking clothing. Place removed items in a sealable bag or container and keep that package away from other occupants and animals until authorities give disposal instructions.\n\n## Remove contamination gently\nCDC advises removing clothing and washing exposed skin promptly after many chemical exposures. Blot visible liquid or material rather than aggressively rubbing it into skin. If clothing must pass over the head, avoid dragging contamination across the face when possible. Shower with water and soap when official guidance permits. Do not improvise neutralizing chemicals, solvents, bleach mixtures, or acids/alkalis on skin; an attempted “neutralization” can create heat, fumes, or a second injury.\n\n## Escalate rather than experiment\nEye exposure, breathing difficulty, persistent coughing, burns, confusion, collapse, or a known hazardous-material release warrants urgent professional guidance. Do not induce vomiting after a swallowed chemical unless specifically instructed by poison-control or medical professionals. Preserve the product label, container name, official alert, and exposure time if this can be done safely; that information is more useful to clinicians than a home-made treatment guess.\n\n## Verification sources\n- CDC — Getting Clean After a Chemical Emergency: https://www.cdc.gov/chemical-emergencies/response/get-clean.html\n- CDC — Chemical Emergencies: https://www.cdc.gov/chemical-emergencies/\n\nVerification date: 2026-08-09."},"el":{"title":"Απορρύπανση Μετά από Χημική Διαρροή: Απομάκρυνση, Καθαρισμός, Βοήθεια","body":"Μια χημική διαρροή απαιτεί διαφορετική λογική από τη συνηθισμένη βρωμιά ή τον καπνό. Πρώτος στόχος είναι η απομάκρυνση από τη μολυσμένη περιοχή ή η τήρηση επίσημης οδηγίας παραμονής σε καταφύγιο και έπειτα η μείωση του υλικού που παραμένει στο σώμα χωρίς να μεταφερθεί σε άλλα άτομα, δωμάτια, οχήματα ή ζώα. Η καθοδήγηση του CDC δίνει έμφαση στη γρήγορη απορρύπανση και όχι στην αναμονή μέχρι να ταυτοποιηθεί με βεβαιότητα η ουσία.\n\n## Σπάσε την αλυσίδα μεταφοράς\nΑπομακρύνσου από την έκλυση όταν οι αρχές λένε ότι η εκκένωση είναι ασφαλής ή μείνε στην καθορισμένη προστατευμένη ζώνη όταν ο εξωτερικός αέρας είναι ο μεγαλύτερος κίνδυνος. Μόλις βρεθείς σε ασφαλέστερο σημείο, κράτησε πιθανώς μολυσμένα άτομα και ρούχα μακριά από καθαρούς χώρους ύπνου, τροφίμων και ιατρικών υλικών. Μην τινάζεις τα ρούχα. Τοποθέτησε τα αφαιρεμένα αντικείμενα σε κλειστή σακούλα ή δοχείο και κράτησέ τα μακριά από ανθρώπους και ζώα μέχρι να δοθούν οδηγίες διάθεσης.\n\n## Αφαίρεσε το υλικό ήπια\nΤο CDC συνιστά για πολλές χημικές εκθέσεις γρήγορη αφαίρεση ρούχων και πλύσιμο του εκτεθειμένου δέρματος. Σκούπισε απαλά ορατό υγρό ή υλικό αντί να το τρίβεις μέσα στο δέρμα. Αν ένα ρούχο πρέπει να περάσει πάνω από το κεφάλι, προσπάθησε να μην σύρεις τη ρύπανση πάνω στο πρόσωπο. Χρησιμοποίησε νερό και σαπούνι όταν αυτό επιτρέπεται από την επίσημη οδηγία. Μην αυτοσχεδιάζεις με «εξουδετερωτικά» χημικά, διαλύτες, μίγματα χλωρίνης ή οξέα/βάσεις πάνω στο δέρμα· μπορεί να προκληθούν θερμότητα, ατμοί ή δεύτερος τραυματισμός.\n\n## Κλιμάκωσε αντί να πειραματίζεσαι\nΈκθεση στα μάτια, δυσκολία αναπνοής, επίμονος βήχας, εγκαύματα, σύγχυση, κατάρρευση ή γνωστή διαρροή επικίνδυνου υλικού απαιτούν άμεση επαγγελματική καθοδήγηση. Μην προκαλείς εμετό μετά από κατάποση χημικής ουσίας εκτός αν το ζητήσει ειδικός δηλητηριάσεων ή ιατρός. Αν μπορεί να γίνει με ασφάλεια, φύλαξε πληροφορίες από την ετικέτα, το όνομα του προϊόντος, την επίσημη ειδοποίηση και την ώρα έκθεσης· αυτά βοηθούν περισσότερο την ιατρική ομάδα από μια αυτοσχέδια θεραπεία.\n\n## Πηγές επαλήθευσης\n- CDC — καθαρισμός μετά από χημική έκθεση: https://www.cdc.gov/chemical-emergencies/response/get-clean.html\n- CDC — χημικές έκτακτες ανάγκες: https://www.cdc.gov/chemical-emergencies/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":130,"en":{"title":"Carbon Monoxide Incident Response During an Outage","body":"Carbon monoxide is especially dangerous during outages because the substitute equipment people introduce—generators, grills, camp stoves, engines, and improvised heaters—can create an invisible, odorless poison. A CO alarm or unexplained illness affecting several occupants should be treated as an environment problem first, not as a puzzle to solve indoors.\n\n## Leave the exposure zone\nIf a CO alarm sounds or occupants develop concerning symptoms around fuel-burning equipment, move people and animals to fresh air and contact emergency services or the appropriate medical service. Do not stay inside to search room by room for the source. A person who becomes weak or confused may not be able to evacuate independently, so the household plan should identify who assists children, older adults, and mobility-limited members.\n\n## Do not “ventilate and retry” a dangerous setup\nOpening a garage door or window does not make indoor generator use safe. CDC guidance places portable generators outdoors and well away from doors, windows, and vents, and recommends working CO alarms with battery capability. Never use charcoal grills, camping stoves, or fuel-burning engines inside living areas, tents, garages, or other enclosed/partly enclosed spaces. Equipment that repeatedly triggers alarms should remain out of service until the hazard is professionally resolved.\n\n## Record the incident for the next shift\nLog what equipment was operating, where it was located, alarm times, who was exposed, whether anyone needed medical assessment, and what corrective action was taken. This prevents a later shift from reconnecting the same hazardous device because “the power is still out.” Replace depleted detector batteries and preserve the detector model/manual for maintenance checks.\n\n## Verification sources\n- CDC — Power Outage Safety: https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-during-a-power-outage.html\n- CDC — Generator Safety and Carbon Monoxide: https://www.cdc.gov/carbon-monoxide/factsheets/generator-safety-fact-sheet.html\n\nVerification date: 2026-08-09."},"el":{"title":"Αντιμετώπιση Μονοξειδίου του Άνθρακα σε Διακοπή Ρεύματος","body":"Το μονοξείδιο του άνθρακα γίνεται ιδιαίτερα επικίνδυνο στις διακοπές ρεύματος, επειδή ο εξοπλισμός που εισάγεται ως υποκατάστατο — γεννήτριες, ψησταριές, φορητές εστίες, κινητήρες και αυτοσχέδιες θερμάστρες — μπορεί να παράγει ένα αόρατο και άοσμο δηλητηριώδες αέριο. Συναγερμός CO ή ανεξήγητη αδιαθεσία σε περισσότερους από έναν ενοίκους πρέπει πρώτα να αντιμετωπίζονται ως πρόβλημα του περιβάλλοντος.\n\n## Βγες από τη ζώνη έκθεσης\nΑν ενεργοποιηθεί συναγερμός CO ή εμφανιστούν ανησυχητικά συμπτώματα ενώ λειτουργεί εξοπλισμός καύσης, μετακίνησε ανθρώπους και ζώα σε καθαρό αέρα και επικοινώνησε με τις υπηρεσίες έκτακτης ανάγκης ή την κατάλληλη ιατρική υπηρεσία. Μην παραμένεις μέσα ψάχνοντας δωμάτιο-δωμάτιο την πηγή. Ένα άτομο που έχει αδυναμία ή σύγχυση μπορεί να μην μπορεί να εκκενώσει μόνο του, γι’ αυτό το σχέδιο πρέπει να ορίζει ποιος βοηθά παιδιά, ηλικιωμένους και άτομα με περιορισμένη κινητικότητα.\n\n## Μην αερίσεις απλώς και ξαναδοκιμάσεις\nΤο άνοιγμα μιας πόρτας γκαράζ ή παραθύρου δεν κάνει ασφαλή τη χρήση γεννήτριας μέσα σε κλειστό χώρο. Η καθοδήγηση του CDC τοποθετεί τις φορητές γεννήτριες έξω και μακριά από πόρτες, παράθυρα και ανοίγματα αερισμού, με λειτουργικούς ανιχνευτές CO και εφεδρική τροφοδοσία. Μη χρησιμοποιείς ψησταριά με κάρβουνο, φορητή εστία ή κινητήρα σε κατοικία, σκηνή, γκαράζ ή άλλο κλειστό/ημίκλειστο χώρο. Εξοπλισμός που προκαλεί επανειλημμένα συναγερμό μένει εκτός χρήσης μέχρι επαγγελματικό έλεγχο.\n\n## Κατάγραψε το συμβάν\nΣημείωσε ποιος εξοπλισμός λειτουργούσε, πού βρισκόταν, τις ώρες συναγερμού, ποιοι εκτέθηκαν, αν χρειάστηκε ιατρική αξιολόγηση και ποια διορθωτική ενέργεια έγινε. Έτσι η επόμενη βάρδια δεν θα επανασυνδέσει την ίδια επικίνδυνη διάταξη επειδή «το ρεύμα ακόμη λείπει». Αντικατάστησε εξαντλημένες μπαταρίες ανιχνευτών και κράτησε το μοντέλο/εγχειρίδιο για έλεγχο συντήρησης.\n\n## Πηγές επαλήθευσης\n- CDC — ασφάλεια σε διακοπή ρεύματος: https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-during-a-power-outage.html\n- CDC — γεννήτριες και μονοξείδιο του άνθρακα: https://www.cdc.gov/carbon-monoxide/factsheets/generator-safety-fact-sheet.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":131,"en":{"title":"Operating a Cleaner-Air Room During Wildfire Smoke","body":"A cleaner-air room is not simply “the room with the air purifier.” It is a managed indoor zone whose doors, activities, filtration, occupancy, and heat conditions are controlled to reduce smoke exposure while it remains safe to stay inside. EPA guidance recommends choosing a suitable room, limiting smoke entry, reducing indoor particle-generating activities, and using appropriately sized filtration where available.\n\n## Choose the room for people, not just equipment\nSelect a space large enough for the occupants who need it most, particularly children, older adults, and people with heart or lung conditions. Minimize exterior openings, but never block the ability to leave during an evacuation. Bring medicines, drinking water, communication devices, chargers, and essential accessibility equipment into the zone so occupants do not repeatedly open doors to retrieve them.\n\n## Control the particle sources inside\nDuring heavy smoke, cooking methods that create particles, smoking, candles, incense, and unnecessary aerosol use can worsen indoor air. Manage entry/exit as a deliberate action: close the door promptly, avoid propping exterior doors open, and move dirty outdoor clothing away from the sleeping zone when practical. If using a portable air cleaner, follow its room-size and filter guidance; higher-efficiency mechanical filters capture smoke particles without intentionally generating ozone.\n\n## Heat can override the shelter plan\nA sealed room can become dangerously hot, especially during wildfire weather or a power outage. The room plan therefore needs a heat escape condition: indoor temperature/occupant symptoms, loss of safe ventilation, official evacuation order, or worsening fire threat can require relocation. Smoke protection never overrides an immediate fire evacuation order.\n\n## Maintain the system\nRecord filter changes, air-cleaner power demand, spare filter count, door/window status, and any observed smoke infiltration. A heavily loaded filter may need earlier replacement. When outdoor air improves and authorities say conditions permit, controlled ventilation can help reset the room.\n\n## Verification sources\n- EPA — Cleaner Air Room: https://www.epa.gov/wildfires/how-create-cleaner-air-room-home\n- EPA — Reduce Smoke Exposure: https://www.epa.gov/wildfires/reduce-your-smoke-exposure\n- EPA — Indoor Air Filtration: https://www.epa.gov/wildfires/indoor-air-filtration\n\nVerification date: 2026-08-09."},"el":{"title":"Λειτουργία Δωματίου Καθαρότερου Αέρα σε Καπνό Δασικής Πυρκαγιάς","body":"Ένα δωμάτιο καθαρότερου αέρα δεν είναι απλώς «το δωμάτιο με τον καθαριστή αέρα». Είναι μια ελεγχόμενη εσωτερική ζώνη όπου διαχειρίζονται πόρτες, δραστηριότητες, φίλτρανση, αριθμός ατόμων και θερμικές συνθήκες ώστε να μειώνεται η έκθεση στον καπνό όσο παραμένει ασφαλής η παραμονή μέσα. Η EPA προτείνει κατάλληλη επιλογή χώρου, περιορισμό εισόδου καπνού, μείωση δραστηριοτήτων που παράγουν σωματίδια και χρήση φίλτρανσης κατάλληλης για το μέγεθος του χώρου όταν είναι διαθέσιμη.\n\n## Διάλεξε χώρο για τους ανθρώπους\nΕπίλεξε δωμάτιο αρκετά μεγάλο για όσους το χρειάζονται περισσότερο, ιδιαίτερα παιδιά, ηλικιωμένους και άτομα με καρδιολογικά ή αναπνευστικά προβλήματα. Περιόρισε τα εξωτερικά ανοίγματα, αλλά μην εμποδίζεις ποτέ την έξοδο σε εκκένωση. Μετέφερε φάρμακα, πόσιμο νερό, συσκευές επικοινωνίας, φορτιστές και απαραίτητο εξοπλισμό προσβασιμότητας στη ζώνη, ώστε να μη χρειάζονται συνεχείς μετακινήσεις και ανοίγματα θυρών.\n\n## Έλεγξε τις πηγές σωματιδίων μέσα\nΣε έντονο καπνό, μαγείρεμα που παράγει σωματίδια, κάπνισμα, κεριά, θυμίαμα και άσκοπα αερολύματα επιβαρύνουν τον εσωτερικό αέρα. Κάνε την είσοδο και έξοδο σκόπιμη διαδικασία: κλείσε γρήγορα την πόρτα, μην αφήνεις εξωτερικά ανοίγματα μόνιμα ανοιχτά και κράτησε βρώμικα εξωτερικά ρούχα μακριά από τη ζώνη ύπνου όταν είναι πρακτικό. Αν υπάρχει καθαριστής αέρα, ακολούθησε τις οδηγίες μεγέθους χώρου και φίλτρου· τα μηχανικά φίλτρα υψηλότερης απόδοσης συγκρατούν σωματίδια καπνού χωρίς να παράγουν σκόπιμα όζον.\n\n## Η ζέστη μπορεί να ακυρώσει το σχέδιο παραμονής\nΈνα κλειστό δωμάτιο μπορεί να υπερθερμανθεί, ιδιαίτερα σε καιρό πυρκαγιάς ή διακοπή ρεύματος. Το σχέδιο χρειάζεται λοιπόν συνθήκη εξόδου για θερμότητα: επικίνδυνη εσωτερική θερμοκρασία ή συμπτώματα, απώλεια ασφαλούς αερισμού, επίσημη εντολή εκκένωσης ή επιδείνωση της πυρκαγιάς μπορεί να απαιτήσουν μετακίνηση. Η προστασία από καπνό δεν υπερισχύει ποτέ άμεσης εντολής εκκένωσης από πυρκαγιά.\n\n## Συντήρησε τη ζώνη\nΚατάγραψε αλλαγές φίλτρου, κατανάλωση ρεύματος καθαριστή, απόθεμα ανταλλακτικών φίλτρων, κατάσταση θυρών/παραθύρων και τυχόν διείσδυση καπνού. Πολύ φορτωμένο φίλτρο μπορεί να χρειαστεί νωρίτερα αντικατάσταση. Όταν ο εξωτερικός αέρας βελτιωθεί και οι αρχές το επιτρέπουν, ελεγχόμενος αερισμός μπορεί να επαναφέρει τον χώρο.\n\n## Πηγές επαλήθευσης\n- EPA — δωμάτιο καθαρότερου αέρα: https://www.epa.gov/wildfires/how-create-cleaner-air-room-home\n- EPA — μείωση έκθεσης σε καπνό: https://www.epa.gov/wildfires/reduce-your-smoke-exposure\n- EPA — φίλτρανση εσωτερικού αέρα: https://www.epa.gov/wildfires/indoor-air-filtration\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":132,"en":{"title":"Flood Re-entry: Moisture, Mold, Structure, and Work-Zone Control","body":"Re-entering a flooded building is a staged safety decision, not the start of cleanup by default. Floodwater can combine structural damage, energized electrical equipment, sewage, sharp debris, unstable floors, mold, fuel residues, and poor indoor air. The first question is whether the building is safe to enter at all.\n\n## Separate inspection from cleanup\nBefore moving belongings, identify structural, electrical, gas, and contamination hazards. Do not enter standing water to reach an electrical panel. If the building was closed for days, CDC advises airing it before prolonged occupancy and treating mold as likely after significant wetting. Photograph major damage before disposal when this can be done safely, especially if insurance or assistance documentation will be required.\n\n## Stop moisture before cosmetic repair\nDrying and removal of water-damaged material are more important than hiding stains or spraying fragrance. Wet porous materials can hold contamination and moisture behind visible surfaces. Create “clean,” “dirty,” and disposal paths so contaminated debris does not pass through sleeping/food areas. People with asthma, severe allergies, immune compromise, or other relevant conditions may need to avoid mold cleanup and seek professional advice.\n\n## Electrical restoration is a separate gate\nA dry-looking outlet or appliance is not proof of electrical safety. Flooded circuits and equipment require qualified inspection before re-energization. Keep generators outdoors and away from openings; cleanup often creates CO incidents when power is unavailable and fuel-powered equipment is brought too close to a building.\n\n## Close the recovery loop\nMaintain a moisture/drying log, photos, discarded-item list, professional inspection notes, and the date each zone was returned to service. If odor, visible growth, recurrent dampness, electrical problems, or structural movement persists, the zone remains unresolved rather than being marked “clean.”\n\n## Verification sources\n- CDC — Reentering a Flooded Home: https://www.cdc.gov/floods/safety/reentering-your-flooded-home-safety.html\n- CDC — Mold Cleanup After Disasters: https://www.cdc.gov/mold-health/media/Homeowners_and_Renters_Guide.pdf\n\nVerification date: 2026-08-09."},"el":{"title":"Επανείσοδος Μετά από Πλημμύρα: Υγρασία, Μούχλα, Δομή και Ζώνες Εργασίας","body":"Η επανείσοδος σε πλημμυρισμένο κτίριο είναι σταδιακή απόφαση ασφάλειας και όχι αυτόματη έναρξη καθαρισμού. Το νερό πλημμύρας μπορεί να συνδυάζει δομικές ζημιές, ηλεκτρικό εξοπλισμό υπό τάση, λύματα, αιχμηρά αντικείμενα, ασταθή δάπεδα, μούχλα, καύσιμα και κακή ποιότητα αέρα. Η πρώτη ερώτηση είναι αν επιτρέπεται ασφαλής είσοδος.\n\n## Χώρισε την επιθεώρηση από τον καθαρισμό\nΠριν μετακινήσεις αντικείμενα, εντόπισε δομικούς, ηλεκτρικούς, αέριους και μολυσματικούς κινδύνους. Μην μπεις σε στάσιμο νερό για να φτάσεις ηλεκτρικό πίνακα. Αν το κτίριο έμεινε κλειστό για ημέρες, το CDC προτείνει αερισμό πριν από παρατεταμένη παραμονή και αντιμετώπιση της μούχλας ως πιθανής μετά από σημαντική διαβροχή. Φωτογράφισε μεγάλες ζημιές πριν από την απόρριψη όταν αυτό είναι ασφαλές, ιδιαίτερα αν θα χρειαστούν στοιχεία για ασφάλιση ή βοήθεια.\n\n## Σταμάτησε την υγρασία πριν από αισθητικές επισκευές\nΤο στέγνωμα και η αφαίρεση υλικών που καταστράφηκαν από νερό είναι σημαντικότερα από το κρύψιμο λεκέδων ή την κάλυψη οσμών. Πορώδη υλικά μπορούν να κρατήσουν ρύπανση και υγρασία πίσω από ορατές επιφάνειες. Δημιούργησε «καθαρή», «βρώμικη» και διαδρομή απορριμμάτων ώστε μολυσμένα υλικά να μην περνούν από χώρους ύπνου ή τροφίμων. Άτομα με άσθμα, σοβαρές αλλεργίες, ανοσοκαταστολή ή άλλες σχετικές καταστάσεις μπορεί να χρειάζεται να αποφεύγουν τον καθαρισμό μούχλας και να ζητούν επαγγελματική συμβουλή.\n\n## Η επαναφορά ρεύματος είναι ξεχωριστή πύλη\nΜια στεγνή στην όψη πρίζα ή συσκευή δεν αποδεικνύει ηλεκτρική ασφάλεια. Πλημμυρισμένα κυκλώματα και εξοπλισμός χρειάζονται ειδικευμένο έλεγχο πριν την επανατροφοδότηση. Οι γεννήτριες παραμένουν έξω και μακριά από ανοίγματα· στον καθαρισμό συμβαίνουν περιστατικά CO όταν εξοπλισμός καύσης χρησιμοποιείται πολύ κοντά στο κτίριο.\n\n## Κλείσε τον κύκλο αποκατάστασης\nΚράτησε ημερολόγιο υγρασίας/στεγνώματος, φωτογραφίες, λίστα απορριφθέντων αντικειμένων, σημειώσεις επαγγελματικών ελέγχων και την ημερομηνία που κάθε ζώνη επέστρεψε σε χρήση. Αν παραμένουν οσμή, ορατή ανάπτυξη, επαναλαμβανόμενη υγρασία, ηλεκτρικά προβλήματα ή δομική μετακίνηση, η ζώνη παραμένει ανοικτό ζήτημα και δεν χαρακτηρίζεται «καθαρή».\n\n## Πηγές επαλήθευσης\n- CDC — επανείσοδος σε πλημμυρισμένο σπίτι: https://www.cdc.gov/floods/safety/reentering-your-flooded-home-safety.html\n- CDC — καθαρισμός μούχλας μετά από καταστροφές: https://www.cdc.gov/mold-health/media/Homeowners_and_Renters_Guide.pdf\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":133,"en":{"title":"Power-Dependent Medical Devices: Deciding When to Relocate","body":"A backup battery is only one part of continuity for a power-dependent medical device. The household also needs to know the device’s actual power demand, battery age, charging time, safe environmental limits, transport requirements, and what happens if backup power cannot be restored. Ready.gov specifically recommends alternate plans for power-dependent medical devices during outages.\n\n## Build a device-specific endurance picture\nRecord the manufacturer/model, power adapter rating, battery type, normal runtime, verified backup runtime, required accessories, and whether the device can safely operate from a vehicle inverter or portable battery. Do not assume the wattage printed on one adapter equals real-world endurance. Test the backup plan before an emergency under the clinician/manufacturer’s constraints.\n\n## Define relocation triggers in advance\nRelocation should not begin only when the battery reaches zero. Triggers can include declining backup reserve, inability to recharge, unsafe indoor temperature, transport service availability, official outage estimates, oxygen or consumable shortages, or loss of the caregiver needed to operate the equipment. Record a primary and alternate powered destination and confirm that the destination can support the device before travel.\n\n## Protect medical continuity during movement\nMove the device with its cables, batteries, consumables, prescription/device documentation, settings information that the care team says should travel, and a simple handover note. Avoid changing prescribed settings or substituting improvised power connections. If the device fails, alarms, overheats, gets wet, or behaves abnormally, follow its emergency instructions and seek professional support rather than repeatedly resetting it.\n\n## Verification sources\n- Ready.gov — Power Outages: https://www.ready.gov/power-outages\n- Ready.gov — Disability and Emergency Preparedness: https://www.ready.gov/disability\n\nVerification date: 2026-08-09."},"el":{"title":"Ιατρικές Συσκευές που Χρειάζονται Ρεύμα: Πότε Χρειάζεται Μετακίνηση","body":"Μια εφεδρική μπαταρία είναι μόνο ένα μέρος της συνέχειας για ιατρική συσκευή που εξαρτάται από ρεύμα. Το νοικοκυριό πρέπει επίσης να γνωρίζει την πραγματική κατανάλωση, την ηλικία μπαταρίας, τον χρόνο φόρτισης, τα ασφαλή περιβαλλοντικά όρια, τις απαιτήσεις μεταφοράς και τι γίνεται αν η εφεδρική τροφοδοσία δεν μπορεί να αποκατασταθεί. Το Ready.gov συνιστά εναλλακτικά σχέδια για συσκευές που εξαρτώνται από ηλεκτρική ενέργεια κατά τις διακοπές.\n\n## Φτιάξε πραγματική εικόνα αυτονομίας\nΚατάγραψε κατασκευαστή/μοντέλο, στοιχεία τροφοδοτικού, τύπο μπαταρίας, συνήθη διάρκεια, επαληθευμένη εφεδρική διάρκεια, απαραίτητα αναλώσιμα και αν η συσκευή επιτρέπεται να λειτουργεί από μετατροπέα οχήματος ή φορητή μπαταρία. Μην θεωρείς ότι η ισχύς που γράφει ένα τροφοδοτικό ισούται με την πραγματική αυτονομία. Δοκίμασε το εφεδρικό σχέδιο πριν από έκτακτη ανάγκη, μέσα στα όρια που θέτουν κλινική ομάδα και κατασκευαστής.\n\n## Όρισε εκ των προτέρων πότε φεύγεις\nΗ μετακίνηση δεν πρέπει να αρχίζει μόνο όταν η μπαταρία φτάσει στο μηδέν. Κριτήρια μπορεί να είναι η πτώση του αποθέματος, αδυναμία επαναφόρτισης, επικίνδυνη θερμοκρασία χώρου, διαθεσιμότητα μεταφοράς, επίσημη εκτίμηση διακοπής, έλλειψη οξυγόνου/αναλωσίμων ή απουσία του φροντιστή που χειρίζεται τη συσκευή. Κατάγραψε κύριο και εναλλακτικό προορισμό με ρεύμα και επιβεβαίωσε πριν την αναχώρηση ότι μπορεί να υποστηρίξει τη συσκευή.\n\n## Διατήρησε τη συνέχεια στη μεταφορά\nΜετέφερε τη συσκευή μαζί με καλώδια, μπαταρίες, αναλώσιμα, συνταγές/έγγραφα συσκευής, τις πληροφορίες ρυθμίσεων που η κλινική ομάδα θεωρεί απαραίτητες και σύντομη σημείωση παράδοσης. Μην αλλάζεις συνταγογραφημένες ρυθμίσεις και μην χρησιμοποιείς αυτοσχέδιες ηλεκτρικές συνδέσεις. Αν η συσκευή αποτύχει, δίνει συναγερμό, υπερθερμαίνεται, βραχεί ή λειτουργεί ασυνήθιστα, ακολούθησε τις οδηγίες έκτακτης ανάγκης και ζήτησε επαγγελματική βοήθεια αντί για συνεχείς επανεκκινήσεις.\n\n## Πηγές επαλήθευσης\n- Ready.gov — διακοπές ρεύματος: https://www.ready.gov/power-outages\n- Ready.gov — αναπηρία και ετοιμότητα: https://www.ready.gov/disability\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":134,"en":{"title":"Medicine Cold-Chain Transfer: Evidence, Handover, and Escalation","body":"Temperature-sensitive medicine cannot be managed safely by a household rule such as “it still feels cold.” Different products have different storage ranges, excursion allowances, light protection, freezing sensitivity, and disposal/replacement rules. The purpose of an emergency cold-chain log is to preserve the history needed for a pharmacist, manufacturer, or clinician to make a product-specific decision.\n\n## Start the clock when conditions change\nRecord the last known normal refrigeration time, outage start, refrigerator temperature if measured, each container transfer, the cold source used, and every period when temperature is unknown. Keep medicines physically separated from melting ice or freezing elements if the product guidance requires it. Do not freeze a medicine merely because “colder is safer.”\n\n## Move information with the medicine\nThe transfer pack should include the medicine name, strength/form, lot/expiry when visible, patient name, prescription details, storage instructions, and the contact route for the pharmacy or care team. If the medicine changes hands, record who received it and when. This prevents a later caregiver from assuming uninterrupted refrigeration when a period was actually unknown.\n\n## Do not guess whether an excursion is acceptable\nIf storage conditions leave the labeled range, contact the pharmacist, manufacturer, or treating team for that specific product. Avoid changing doses, skipping essential therapy, or discarding a critical supply solely because of a generic internet rule. If the medicine is visibly damaged, contaminated by floodwater, or its packaging integrity is compromised, isolate it and seek product-specific advice.\n\n## Recovery action\nAfter stable power returns, reconcile all temperature-sensitive medicines: which remained usable, which require replacement, what backup equipment failed, and whether the reserve plan needs more cold packs, a monitored cooler, or an earlier relocation trigger.\n\n## Verification anchors\n- Ready.gov — Power Outages and medicine refrigeration planning: https://www.ready.gov/power-outages\n- Product label, pharmacist, manufacturer, and treating clinician remain the controlling sources for a specific medicine.\n\nVerification date: 2026-08-09."},"el":{"title":"Μεταφορά Φαρμάκων Ψυχρής Αλυσίδας: Ιστορικό, Παράδοση και Κλιμάκωση","body":"Ένα φάρμακο που εξαρτάται από θερμοκρασία δεν μπορεί να διαχειριστεί με τον κανόνα «ακόμη φαίνεται κρύο». Διαφορετικά προϊόντα έχουν διαφορετικά εύρη αποθήκευσης, ανεκτές αποκλίσεις, προστασία από φως, ευαισθησία στην κατάψυξη και κανόνες αντικατάστασης. Σκοπός του ημερολογίου ψυχρής αλυσίδας είναι να διατηρεί το ιστορικό που χρειάζεται φαρμακοποιός, κατασκευαστής ή κλινικός για απόφαση πάνω στο συγκεκριμένο προϊόν.\n\n## Ξεκίνα το χρονικό όταν αλλάξουν οι συνθήκες\nΚατάγραψε την τελευταία γνωστή ώρα κανονικής ψύξης, την έναρξη διακοπής, θερμοκρασία ψυγείου αν μετρήθηκε, κάθε μεταφορά δοχείου, το ψυχρό μέσο που χρησιμοποιήθηκε και κάθε περίοδο άγνωστης θερμοκρασίας. Κράτησε τα φάρμακα μακριά από νερό που λιώνει ή παγωμένα στοιχεία αν αυτό απαιτεί η οδηγία του προϊόντος. Μην καταψύξεις ένα φάρμακο επειδή υποθέτεις ότι «πιο κρύο είναι καλύτερο».\n\n## Οι πληροφορίες ταξιδεύουν μαζί με το φάρμακο\nΤο πακέτο μεταφοράς πρέπει να περιλαμβάνει όνομα φαρμάκου, μορφή/περιεκτικότητα, παρτίδα και λήξη όταν φαίνονται, όνομα ασθενούς, στοιχεία συνταγής, οδηγίες αποθήκευσης και τρόπο επικοινωνίας με φαρμακείο ή κλινική ομάδα. Αν το φάρμακο αλλάξει χέρια, σημείωσε ποιος το παρέλαβε και πότε. Έτσι ο επόμενος φροντιστής δεν θα θεωρήσει ότι υπήρχε συνεχής ψύξη όταν υπήρξε άγνωστο διάστημα.\n\n## Μην αποφασίζεις μόνος αν η απόκλιση ήταν αποδεκτή\nΑν οι συνθήκες βγουν από το εύρος της ετικέτας, επικοινώνησε με φαρμακοποιό, κατασκευαστή ή θεράποντα για το συγκεκριμένο προϊόν. Μην αλλάζεις δόσεις, μην διακόπτεις απαραίτητη θεραπεία και μην πετάς κρίσιμο απόθεμα μόνο από έναν γενικό διαδικτυακό κανόνα. Αν το φάρμακο έχει ορατή ζημιά, ήρθε σε επαφή με νερό πλημμύρας ή έχει χαλασμένη συσκευασία, απομόνωσέ το και ζήτησε ειδική καθοδήγηση.\n\n## Ενέργεια αποκατάστασης\nΌταν σταθεροποιηθεί το ρεύμα, συμφώνησε όλα τα θερμοευαίσθητα φάρμακα: ποια έμειναν κατάλληλα, ποια χρειάζονται αντικατάσταση, ποιος εφεδρικός εξοπλισμός απέτυχε και αν το σχέδιο χρειάζεται περισσότερα ψυχρά στοιχεία, παρακολουθούμενο φορητό ψυγείο ή νωρίτερο κριτήριο μετακίνησης.\n\n## Πηγές επαλήθευσης\n- Ready.gov — διακοπές ρεύματος και σχεδιασμός ψύξης φαρμάκων: https://www.ready.gov/power-outages\n- Η ετικέτα του προϊόντος, ο φαρμακοποιός, ο κατασκευαστής και ο θεράπων είναι οι καθοριστικές πηγές για συγκεκριμένο φάρμακο.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":135,"en":{"title":"Hearing and Vision Assistive Technology During an Outage","body":"Assistive technology failures can turn a manageable outage into an information and mobility emergency. Hearing aids, cochlear-implant processors, magnifiers, electronic braille devices, screen readers, low-vision lighting, and phone accessibility features may depend on batteries, charging, internet access, or a specific caregiver workflow.\n\n## Inventory the whole communication chain\nList the device, charger/cable, spare batteries, cleaning/drying supplies, protective case, compatible backup device, and any adapter required for portable power. Store written or printed communication cards for situations where speech, hearing, vision, or phone access is impaired. Critical instructions—medicines, evacuation assistance, allergies, contact person, and meeting point—should not exist only inside one powered device.\n\n## Build redundancy around the person\nAgree on at least two ways to receive alerts: for example visual plus vibration, spoken plus written, or a buddy system plus official phone alert. Mark who checks on the person if the usual alert method fails. Keep pathways and essential objects in consistent positions; moving furniture or supplies during a dark outage can create a new fall/collision hazard for someone relying on memorized layout.\n\n## Protect batteries without exhausting them\nDo not keep every device charging continuously from a limited reserve. Prioritize the assistive device needed for immediate safety and communication, schedule recharge windows, and preserve a manual fallback where possible. If a rechargeable hearing/vision device becomes unavailable, shift early to the agreed communication method rather than waiting for complete power loss.\n\n## Verification source\n- Ready.gov — Emergency Preparedness for People with Disabilities: https://www.ready.gov/disability\n\nVerification date: 2026-08-09."},"el":{"title":"Συνέχεια Βοηθημάτων Ακοής και Όρασης σε Διακοπή Ρεύματος","body":"Η απώλεια βοηθητικής τεχνολογίας μπορεί να μετατρέψει μια διαχειρίσιμη διακοπή σε κρίση πληροφόρησης και κινητικότητας. Ακουστικά βαρηκοΐας, επεξεργαστές κοχλιακών εμφυτευμάτων, ηλεκτρονικοί μεγεθυντές, συσκευές Braille, αναγνώστες οθόνης, φωτισμός χαμηλής όρασης και λειτουργίες προσβασιμότητας τηλεφώνου μπορεί να εξαρτώνται από μπαταρίες, φόρτιση, διαδίκτυο ή συγκεκριμένη ρουτίνα φροντιστή.\n\n## Κατέγραψε ολόκληρη την αλυσίδα επικοινωνίας\nΣημείωσε συσκευή, φορτιστή/καλώδιο, εφεδρικές μπαταρίες, υλικά καθαρισμού/στεγνώματος, προστατευτική θήκη, συμβατή εφεδρική συσκευή και κάθε αντάπτορα που χρειάζεται για φορητή τροφοδοσία. Φύλαξε έντυπες κάρτες επικοινωνίας για περιπτώσεις όπου ο λόγος, η ακοή, η όραση ή το τηλέφωνο δεν λειτουργούν. Κρίσιμες πληροφορίες — φάρμακα, ανάγκη βοήθειας στην εκκένωση, αλλεργίες, πρόσωπο επικοινωνίας και σημείο συνάντησης — δεν πρέπει να υπάρχουν μόνο σε μία ηλεκτρονική συσκευή.\n\n## Δημιούργησε πλεονασμό γύρω από το άτομο\nΣυμφώνησε τουλάχιστον δύο τρόπους λήψης ειδοποιήσεων: για παράδειγμα οπτικό και δόνηση, προφορικό και γραπτό ή σύστημα συνοδού μαζί με επίσημη ειδοποίηση τηλεφώνου. Όρισε ποιος ελέγχει το άτομο αν αποτύχει ο συνήθης τρόπος ειδοποίησης. Κράτησε διαδρομές και βασικά αντικείμενα σε σταθερές θέσεις· η μετακίνηση επίπλων ή προμηθειών στο σκοτάδι μπορεί να δημιουργήσει νέο κίνδυνο πτώσης ή σύγκρουσης για κάποιον που βασίζεται στη μνήμη του χώρου.\n\n## Προστάτευσε τις μπαταρίες χωρίς να τις εξαντλείς\nΜην κρατάς όλες τις συσκευές συνεχώς σε φόρτιση από περιορισμένο απόθεμα. Δώσε προτεραιότητα στο βοήθημα που χρειάζεται για άμεση ασφάλεια και επικοινωνία, όρισε παράθυρα φόρτισης και διατήρησε χειροκίνητη εναλλακτική όπου γίνεται. Αν ένα επαναφορτιζόμενο βοήθημα γίνει μη διαθέσιμο, πέρασε νωρίς στον συμφωνημένο τρόπο επικοινωνίας αντί να περιμένεις πλήρη απώλεια ισχύος.\n\n## Πηγή επαλήθευσης\n- Ready.gov — ετοιμότητα ατόμων με αναπηρία: https://www.ready.gov/disability\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":136,"en":{"title":"Cognitive Impairment and Dementia: Reducing Disorientation During Disruption","body":"An emergency can remove the routines and landmarks that help a person with dementia or other cognitive impairment function safely. Noise, unfamiliar shelters, darkness, heat, rushed instructions, caregiver changes, and sleep loss can increase confusion or wandering risk. The plan should reduce decisions demanded from the person rather than expecting them to learn a complex emergency routine under stress.\n\n## Preserve recognizable anchors\nKeep a small set of familiar items, a simple written/visual daily routine, identification, medication list, preferred name, communication style, and calming activities with the evacuation kit. Use the same bag and the same place for essential objects whenever possible. In a new shelter, orient the person to toilet, sleeping place, caregiver, exits that staff permit residents to use, and the next planned activity.\n\n## Design supervision as a shift task\nDo not rely on “someone is watching.” Assign a named caregiver for each period and a named backup. Record handovers, last medication administration as maintained by the appropriate caregiver/clinical plan, food/fluid concerns, sleep, distress triggers, and any wandering attempt. If the person normally uses a tracking or identification device, plan what happens if its battery or network connection fails.\n\n## Simplify communication\nGive one instruction at a time, use familiar words, and show rather than repeatedly argue when possible. Avoid unnecessary relocation once a safe area is established. Sudden major behavior change, injury, fever, severe dehydration concern, or inability to provide necessary care warrants medical evaluation rather than being dismissed as “just confusion.”\n\n## Verification anchor\n- Ready.gov — Disability and Emergency Preparedness: https://www.ready.gov/disability\n- Individual clinical/care plan and the person’s usual care team remain essential for medical decisions.\n\nVerification date: 2026-08-09."},"el":{"title":"Γνωστική Διαταραχή και Άνοια: Μείωση Αποπροσανατολισμού σε Κρίση","body":"Μια έκτακτη ανάγκη μπορεί να αφαιρέσει τις ρουτίνες και τα σημεία αναφοράς που βοηθούν ένα άτομο με άνοια ή άλλη γνωστική διαταραχή να λειτουργεί με ασφάλεια. Θόρυβος, άγνωστο καταφύγιο, σκοτάδι, ζέστη, βιαστικές οδηγίες, αλλαγές φροντιστών και έλλειψη ύπνου μπορούν να αυξήσουν σύγχυση ή κίνδυνο περιπλάνησης. Το σχέδιο πρέπει να μειώνει τις αποφάσεις που απαιτούνται από το άτομο αντί να περιμένει να μάθει πολύπλοκη διαδικασία μέσα στο στρες.\n\n## Διατήρησε αναγνωρίσιμα σημεία\nΒάλε στο κιτ λίγα οικεία αντικείμενα, απλή γραπτή/οπτική καθημερινή ρουτίνα, ταυτότητα, λίστα φαρμάκων, προτιμώμενο όνομα, τρόπο επικοινωνίας και δραστηριότητες που συνήθως ηρεμούν το άτομο. Χρησιμοποίησε την ίδια τσάντα και την ίδια θέση για βασικά αντικείμενα όπου γίνεται. Σε νέο καταφύγιο, δείξε τουαλέτα, χώρο ύπνου, φροντιστή, τις εξόδους που επιτρέπεται να χρησιμοποιούνται και την επόμενη προγραμματισμένη δραστηριότητα.\n\n## Κάνε την επίβλεψη εργασία βάρδιας\nΜην βασίζεσαι στο «κάποιος τον προσέχει». Ανάθεσε συγκεκριμένο φροντιστή για κάθε περίοδο και συγκεκριμένο αναπληρωτή. Κατέγραψε παραδόσεις, την τελευταία χορήγηση φαρμάκου όπως προβλέπει το κατάλληλο σχέδιο φροντίδας, ανησυχίες για τροφή/υγρά, ύπνο, ερεθίσματα που αυξάνουν αναστάτωση και κάθε προσπάθεια περιπλάνησης. Αν χρησιμοποιείται συσκευή εντοπισμού ή ταυτοποίησης, σχεδίασε τι γίνεται όταν χαθεί μπαταρία ή δίκτυο.\n\n## Απλοποίησε την επικοινωνία\nΔώσε μία οδηγία κάθε φορά, χρησιμοποίησε οικείες λέξεις και προτίμησε επίδειξη αντί για επαναλαμβανόμενη αντιπαράθεση. Απόφυγε άσκοπες μετακινήσεις όταν έχει βρεθεί ασφαλής ζώνη. Ξαφνική σημαντική αλλαγή συμπεριφοράς, τραυματισμός, πυρετός, σοβαρή ανησυχία αφυδάτωσης ή αδυναμία παροχής της απαραίτητης φροντίδας απαιτούν ιατρική αξιολόγηση και δεν πρέπει να αποδίδονται απλώς στη σύγχυση.\n\n## Πηγές επαλήθευσης\n- Ready.gov — αναπηρία και ετοιμότητα: https://www.ready.gov/disability\n- Το εξατομικευμένο κλινικό/φροντιστικό σχέδιο και η συνήθης ομάδα φροντίδας παραμένουν απαραίτητα για ιατρικές αποφάσεις.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":137,"en":{"title":"Infant Diapering and Hygiene When Water Is Limited","body":"Infant care can consume clean water quickly because feeding, hand hygiene, diapering, bottle/equipment cleaning, and laundry all compete for the same reserve. The household should protect the clean-water chain around feeding and hand hygiene rather than using drinking-quality water indiscriminately for every cleanup task.\n\n## Create a one-way diaper station\nSeparate clean diapers, wipes, barrier products, changing surface covers, waste bags, and clean clothing from used materials. Position the station away from food preparation and infant feeding equipment. Keep a dedicated waste container and remove waste on a schedule before it attracts insects or contaminates the living area. After diaper changes, prioritize caregiver hand hygiene using the safest method available under the current water advisory.\n\n## Do not let shortage blur water-status labels\nIf tap water is under an advisory, follow the authority’s instruction for handwashing, bathing, and cleaning; boil-water, do-not-drink, and do-not-use notices are not interchangeable. Keep water intended for formula preparation or drinking in clearly marked containers that are not dipped into with dirty cups or hands. Ready-to-feed formula can reduce dependence on safe mixing water when formula feeding is necessary during an emergency, according to CDC emergency infant-feeding guidance.\n\n## Watch the infant, not only the supply count\nA diaper log can help caregivers notice a meaningful change in feeding or wet diapers, but the app should not diagnose dehydration. Repeated vomiting, unusual sleepiness, poor feeding, markedly fewer wet diapers, fever, or an infant who appears unwell should prompt timely clinical advice. Record concerns for the next caregiver and avoid waiting for a shift change if symptoms are urgent.\n\n## Verification sources\n- CDC — Infant Feeding in Emergencies: https://www.cdc.gov/infant-feeding-emergencies-toolkit/\n- CDC — Personal Hygiene During Water Emergencies: https://www.cdc.gov/water-emergency/safety/guidelines-for-personal-hygiene-during-an-emergency.html\n\nVerification date: 2026-08-09."},"el":{"title":"Αλλαγή Πάνας και Υγιεινή Βρέφους με Περιορισμένο Νερό","body":"Η φροντίδα βρέφους μπορεί να καταναλώσει γρήγορα καθαρό νερό, επειδή σίτιση, υγιεινή χεριών, αλλαγές πάνας, καθαρισμός εξοπλισμού και πλύσιμο ρούχων ανταγωνίζονται για το ίδιο απόθεμα. Το νοικοκυριό πρέπει να προστατεύει την αλυσίδα καθαρού νερού γύρω από τη σίτιση και τα χέρια αντί να χρησιμοποιεί πόσιμο νερό αδιάκριτα για κάθε εργασία καθαρισμού.\n\n## Δημιούργησε σταθμό πάνας μονής κατεύθυνσης\nΧώρισε καθαρές πάνες, μωρομάντηλα, προϊόντα προστασίας δέρματος, καλύμματα επιφάνειας, σακούλες απορριμμάτων και καθαρά ρούχα από τα χρησιμοποιημένα υλικά. Τοποθέτησε τον σταθμό μακριά από παρασκευή τροφίμων και εξοπλισμό σίτισης. Χρησιμοποίησε ξεχωριστό δοχείο απορριμμάτων και άδειασέ το με πρόγραμμα πριν προσελκύσει έντομα ή μολύνει τον χώρο. Μετά την αλλαγή, δώσε προτεραιότητα στην υγιεινή χεριών του φροντιστή με την ασφαλέστερη διαθέσιμη μέθοδο σύμφωνα με την τρέχουσα κατάσταση νερού.\n\n## Μην αφήσεις την έλλειψη να μπερδέψει τις κατηγορίες νερού\nΑν υπάρχει ειδοποίηση για το νερό βρύσης, ακολούθησε τις οδηγίες για χέρια, μπάνιο και καθαρισμό· οι ειδοποιήσεις βρασμού, μη πόσης και μη χρήσης δεν είναι ίδιες. Κράτησε το νερό για φόρμουλα ή πόση σε σαφώς σημειωμένα δοχεία όπου δεν μπαίνουν βρώμικα ποτήρια ή χέρια. Όταν απαιτείται φόρμουλα σε έκτακτη ανάγκη, η έτοιμη προς κατανάλωση μορφή μειώνει την εξάρτηση από ασφαλές νερό ανάμιξης σύμφωνα με την καθοδήγηση του CDC.\n\n## Παρακολούθησε το βρέφος, όχι μόνο το απόθεμα\nΗ καταγραφή αλλαγών πάνας μπορεί να βοηθήσει τους φροντιστές να εντοπίσουν σημαντική αλλαγή στη σίτιση ή στις βρεγμένες πάνες, αλλά η εφαρμογή δεν διαγιγνώσκει αφυδάτωση. Επαναλαμβανόμενος εμετός, ασυνήθιστη υπνηλία, κακή σίτιση, αισθητά λιγότερες βρεγμένες πάνες, πυρετός ή βρέφος που φαίνεται άρρωστο χρειάζονται έγκαιρη κλινική συμβουλή. Κατάγραψε την ανησυχία για τον επόμενο φροντιστή, αλλά μην περιμένεις αλλαγή βάρδιας όταν τα συμπτώματα είναι επείγοντα.\n\n## Πηγές επαλήθευσης\n- CDC — σίτιση βρεφών σε έκτακτες ανάγκες: https://www.cdc.gov/infant-feeding-emergencies-toolkit/\n- CDC — προσωπική υγιεινή σε έκτακτη ανάγκη νερού: https://www.cdc.gov/water-emergency/safety/guidelines-for-personal-hygiene-during-an-emergency.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":138,"en":{"title":"Shared Shelter Respiratory Illness: Separation, Ventilation, and Handover","body":"Crowded evacuation shelters combine close contact, shared toilets, stress, disrupted sleep, and people with different health vulnerabilities. A household-level plan cannot run clinical infection control, but it can reduce unnecessary exposure and make symptoms visible to shelter staff early.\n\n## Report illness instead of hiding it\nIf a household member develops fever, repeated vomiting/diarrhea, significant cough with breathing difficulty, rash with systemic illness, or another concerning symptom, inform shelter staff or medical personnel promptly. Do not silently move the person between sleeping areas. Follow the facility’s separation, masking, hygiene, and medical-evaluation procedures; these may change with the disease and local public-health situation.\n\n## Keep personal items personal\nDo not share drinking containers, eating utensils, towels, toothbrushes, medicines, respiratory equipment, or items that contact the face unless they are designed and cleaned for shared use. Assign a small clean area for the ill person’s essentials and a separate bag for laundry/waste. Caregivers should know where hand hygiene is available before beginning food or personal-care tasks.\n\n## Preserve accessibility and dignity\nSeparation measures must not strand a person from mobility assistance, communication support, service animals, or essential medical devices. Record who remains responsible for care and how the person can summon help. Avoid public labeling that discloses unnecessary medical information; staff need actionable facts, not household gossip.\n\n## Handover what changed\nAt shift changes, communicate symptoms, staff instructions, last meaningful change, hydration/food concern, equipment needs, and whether the shelter assigned a different area. This reduces duplicated questioning and prevents a new caregiver from unintentionally breaking the facility’s infection-control plan.\n\n## Verification anchor\n- CDC — Infection Control Guidance for Community Evacuation Centers: https://archive.cdc.gov/www_cdc_gov/disasters/commshelters.html\n\nVerification date: 2026-08-09."},"el":{"title":"Αναπνευστική Νόσος σε Κοινό Καταφύγιο: Διαχωρισμός, Αερισμός και Παράδοση","body":"Τα κοινά καταφύγια εκκένωσης συνδυάζουν στενή επαφή, κοινές τουαλέτες, στρες, διαταραγμένο ύπνο και ανθρώπους με διαφορετικές ευπάθειες υγείας. Ένα οικογενειακό σχέδιο δεν αντικαθιστά κλινικό έλεγχο λοιμώξεων, αλλά μπορεί να μειώσει περιττές εκθέσεις και να κάνει τα συμπτώματα ορατά έγκαιρα στο προσωπικό.\n\n## Δήλωσε την ασθένεια αντί να την κρύβεις\nΑν μέλος του νοικοκυριού εμφανίσει πυρετό, επαναλαμβανόμενο εμετό/διάρροια, σημαντικό βήχα με δυσκολία αναπνοής, εξάνθημα με γενική αδιαθεσία ή άλλο ανησυχητικό σύμπτωμα, ενημέρωσε γρήγορα το προσωπικό ή την ιατρική ομάδα. Μην μετακινείς αθόρυβα το άτομο μεταξύ χώρων ύπνου. Ακολούθησε τις διαδικασίες του καταφυγίου για διαχωρισμό, μάσκα, υγιεινή και ιατρική αξιολόγηση· μπορεί να αλλάζουν ανάλογα με τη νόσο και την τοπική δημόσια υγεία.\n\n## Προσωπικά αντικείμενα μένουν προσωπικά\nΜην μοιράζεστε δοχεία πόσης, μαχαιροπίρουνα, πετσέτες, οδοντόβουρτσες, φάρμακα, αναπνευστικό εξοπλισμό ή αντικείμενα που ακουμπούν στο πρόσωπο, εκτός αν έχουν σχεδιαστεί και καθαρίζονται για κοινή χρήση. Όρισε μικρή καθαρή περιοχή για τα απαραίτητα του ασθενούς και ξεχωριστή σακούλα για ρούχα/απορρίμματα. Οι φροντιστές πρέπει να γνωρίζουν πού υπάρχει υγιεινή χεριών πριν αρχίσουν εργασίες φαγητού ή προσωπικής φροντίδας.\n\n## Διατήρησε προσβασιμότητα και αξιοπρέπεια\nΤα μέτρα διαχωρισμού δεν πρέπει να αποκόπτουν κάποιον από βοήθεια κινητικότητας, υποστήριξη επικοινωνίας, ζώο υπηρεσίας ή απαραίτητη ιατρική συσκευή. Κατάγραψε ποιος παραμένει υπεύθυνος φροντίδας και πώς το άτομο καλεί βοήθεια. Απόφυγε δημόσιες ετικέτες που αποκαλύπτουν περιττές ιατρικές πληροφορίες· το προσωπικό χρειάζεται χρήσιμα γεγονότα, όχι κουτσομπολιό.\n\n## Παράδωσε ό,τι άλλαξε\nΣτην αλλαγή βάρδιας μετέφερε συμπτώματα, οδηγίες προσωπικού, τελευταία σημαντική αλλαγή, ανησυχία για υγρά/τροφή, ανάγκες εξοπλισμού και αν το καταφύγιο άλλαξε ζώνη. Έτσι αποφεύγονται επαναλαμβανόμενες ερωτήσεις και ο νέος φροντιστής δεν χαλάει κατά λάθος το σχέδιο ελέγχου λοιμώξεων.\n\n## Πηγή επαλήθευσης\n- CDC — έλεγχος λοιμώξεων σε κέντρα εκκένωσης: https://archive.cdc.gov/www_cdc_gov/disasters/commshelters.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":139,"en":{"title":"Shared-Kitchen Food Allergy Control During Displacement","body":"Displacement changes where food is prepared, who handles it, which utensils are shared, and whether original packaging remains available. For a person with a serious food allergy, the hazard may be cross-contact or an unknown ingredient rather than lack of calories. The continuity plan should make uncertainty visible instead of pressuring the person to “eat something.”\n\n## Protect identifiable food\nKeep allergy-safe food in a clearly marked container or bag with the person’s name and allergen information. Preserve original labels whenever possible. If food is repacked, copy the product name, ingredients/allergen statement, lot or expiry when relevant, and who repacked it. Unlabeled communal food should be treated as unknown unless the responsible kitchen can verify ingredients and handling.\n\n## Control utensils and surfaces\nWhere feasible, designate cleaned utensils, cutting surfaces, sto
