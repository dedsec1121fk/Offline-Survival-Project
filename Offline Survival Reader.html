 πάγκοι ή εναλλακτικά καύσιμα. Λάδι που καίγεται σε τηγάνι γίνεται ιδιαίτερα επικίνδυνο αν ριχτεί νερό.\n\n## Μην αφήνεις ενεργό μαγείρεμα χωρίς επίβλεψη\nΚράτησε χαρτί, πετσέτες, κουρτίνες, πλαστικές συσκευασίες, καύσιμα και σακίδια εκκένωσης μακριά από τη ζώνη. Γύρισε λαβές προς τα μέσα χωρίς να τις βάζεις πάνω από άλλο μάτι. Σε χαμηλό φωτισμό χρησιμοποίησε σταθερό ηλεκτρικό φως αντί για γυμνή φλόγα κοντά σε ζεστό λάδι.\n\n## Αν ανάψει το τηγάνι\nΑν γίνεται με ασφάλεια και χωρίς να περάσεις πάνω από φλόγες, κλείσε τη θερμότητα. Κάλυψε το σκεύος με κατάλληλο μεταλλικό καπάκι ή μεταλλικό ταψί ώστε να κοπεί το οξυγόνο και άφησέ το κλειστό μέχρι να κρυώσει πλήρως. Μην μεταφέρεις το φλεγόμενο τηγάνι μέσα στο σπίτι και ποτέ μην ρίχνεις νερό σε καμένο λάδι/λίπος· μπορεί να εκτοξεύσει φλεγόμενα σταγονίδια και να προκαλέσει σοβαρά εγκαύματα.\n\n## Φωτιά σε φούρνο ή συσκευή\nΚράτησε κλειστή την πόρτα όταν το άνοιγμα θα τροφοδοτήσει/διαδώσει τη φωτιά, κλείσε τη συσκευή αν είναι ασφαλές και ακολούθησε οδηγίες πυροσβεστικής. Αν η φωτιά βγει από το σκεύος/συσκευή, αυξάνεται ο καπνός, δεν έχεις καθαρή έξοδο πίσω σου ή δεν είσαι βέβαιος, εκκένωσε και κάλεσε την πυροσβεστική.\n\n## Όρια πυροσβεστήρα\nΚατάλληλος πυροσβεστήρας βοηθά μόνο σε μικρή φωτιά, με ελεύθερη έξοδο και άνθρωπο που ξέρει να τον χρησιμοποιεί. Η διαφυγή είναι προτεραιότητα. Μην αφήσεις την ύπαρξη πυροσβεστήρα να κρατήσει κάποιον παγιδευμένο ανάμεσα στη φωτιά και την πόρτα.\n\n## Πηγές επαλήθευσης\n- U.S. Fire Administration — πρόληψη οικιακών φωτιών μαγειρέματος: https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/cooking/\n- Οδηγίες τοπικής πυροσβεστικής.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":179,"en":{"title":"Candles and Open-Flame Lighting During Blackouts","body":"A candle solves darkness by introducing an ignition source. During outages people are more likely to fall asleep in unusual rooms, move bedding, stage bags by exits, use oxygen, charge batteries, or cook nearby—exactly the conditions that make unattended flame more dangerous.\n\n## Prefer electric light\nUse LED flashlights, headlamps, lanterns, and low-power area lights as the primary outage lighting. Store them where they can be reached in the dark and keep spare batteries/charging plans distributed so one failed device does not force a switch to open flame.\n\n## If a candle is used despite safer alternatives\nPlace it on a stable, noncombustible surface well away from curtains, bedding, paper, decorations, fuel, and the edge of furniture. Keep it out of reach of children and pets. Never carry a lit candle while searching cluttered rooms, and never leave it burning while people sleep or leave the room.\n\n## Oxygen and fuel change the rule\nDo not use candles/open flame near medical oxygen or in areas where fuel/LPG/solvent vapors may be present. A suspected gas leak makes ignition sources unacceptable. Do not use a candle to inspect a fuel tank, battery compartment, gas appliance, or damaged utility space.\n\n## Build a blackout-light map\nAssign a light to each sleeping zone, toilet route, exit, medical equipment area, and utility shutoff location. Photoluminescent or reflective markers can make stairs/doors easier to find without continuous power. Keep one headlamp with the first-aid/medical kit so both hands remain free.\n\n## Verification anchors\n- U.S. Fire Administration home-fire prevention resources.\n- CDC carbon-monoxide/open-flame outage safety principles.\n\nVerification date: 2026-08-09."},"el":{"title":"Κεριά και Γυμνή Φλόγα σε Διακοπή Ρεύματος","body":"Ένα κερί λύνει το σκοτάδι δημιουργώντας ταυτόχρονα πηγή ανάφλεξης. Σε διακοπές οι άνθρωποι κοιμούνται σε ασυνήθιστους χώρους, μετακινούν κλινοσκεπάσματα, στοιβάζουν σακίδια κοντά σε εξόδους, χρησιμοποιούν οξυγόνο, φορτίζουν μπαταρίες ή μαγειρεύουν—συνθήκες που κάνουν μια αφύλακτη φλόγα ακόμη πιο επικίνδυνη.\n\n## Προτίμησε ηλεκτρικό φωτισμό\nΧρησιμοποίησε φακούς LED, φακούς κεφαλής, φανάρια και χαμηλής κατανάλωσης φωτισμό ως κύρια λύση. Αποθήκευσέ τα εκεί όπου βρίσκονται εύκολα στο σκοτάδι και μοίρασε εφεδρικές μπαταρίες/φόρτιση ώστε μία βλάβη να μη σε αναγκάσει να χρησιμοποιήσεις φλόγα.\n\n## Αν παρ’ όλα αυτά χρησιμοποιηθεί κερί\nΒάλ’ το σε σταθερή, μη εύφλεκτη επιφάνεια, πολύ μακριά από κουρτίνες, κρεβάτια, χαρτί, διακοσμητικά, καύσιμα και άκρες επίπλων. Κράτησέ το μακριά από παιδιά και ζώα. Μην περπατάς με αναμμένο κερί ψάχνοντας σε γεμάτο χώρο και ποτέ μην το αφήνεις όταν κοιμάσαι ή βγαίνεις από το δωμάτιο.\n\n## Οξυγόνο και καύσιμα αλλάζουν τον κανόνα\nΜην χρησιμοποιείς κερί/γυμνή φλόγα κοντά σε ιατρικό οξυγόνο ή όπου μπορεί να υπάρχουν ατμοί καυσίμου, υγραερίου ή διαλύτη. Σε υποψία διαρροής αερίου καμία πηγή ανάφλεξης δεν είναι αποδεκτή. Μην χρησιμοποιείς κερί για να εξετάσεις δεξαμενή καυσίμου, χώρο μπαταριών, συσκευή αερίου ή κατεστραμμένη υποδομή.\n\n## Φτιάξε χάρτη φωτισμού διακοπής\nΑνάθεσε ένα φως σε κάθε χώρο ύπνου, διαδρομή προς τουαλέτα, έξοδο, ιατρικό εξοπλισμό και σημείο διακοπής παροχών. Φωσφορίζουσες/ανακλαστικές σημάνσεις βοηθούν σε σκάλες και πόρτες χωρίς συνεχή ρεύμα. Κράτησε έναν φακό κεφαλής μαζί με το κιτ πρώτων βοηθειών ώστε τα χέρια να μένουν ελεύθερα.\n\n## Πηγές επαλήθευσης\n- U.S. Fire Administration — πόροι πρόληψης οικιακής πυρκαγιάς.\n- Αρχές CDC για ασφαλή χρήση εναλλακτικών πηγών κατά τη διακοπή.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":180,"en":{"title":"Fire Extinguisher Readiness: Selection, Maintenance, and Escape-First Use","body":"A fire extinguisher is a limited tool for an early, small fire. It is not a reason to remain in smoke, block an exit, or fight a growing fire. Readiness means choosing an extinguisher suitable for local hazards, mounting it where it can be reached while moving toward an exit, maintaining it, and training before the emergency.\n\n## Match the extinguisher to the hazard\nFire classifications and extinguisher labels vary by region, but the principle is universal: the extinguishing agent must be compatible with what is burning and with energized electrical equipment where relevant. Follow local fire-service/building requirements and the extinguisher label. Kitchen oils/fats can require specific extinguishing agents; water can be dangerous on burning oil or energized electrical equipment.\n\n## Position for escape\nDo not store the only extinguisher behind the likely fire source. Place suitable units on accessible escape paths according to local code/manufacturer guidance. Everyone should know the location, but children/untrained users should not be assigned fire-fighting duties.\n\n## Maintenance is part of the tool\nInspect the pressure/status indicator where present, pin/seal, hose/nozzle, corrosion/damage, and access. Follow manufacturer/service intervals and replacement/inspection requirements. An extinguisher that is discharged, damaged, expired/out of service, or inaccessible behind stored boxes should be treated as unavailable.\n\n## Fight only a small fire with a safe exit\nRaise the alarm and ensure others are leaving. Use an extinguisher only if the fire is small/contained, smoke conditions allow safe breathing/visibility, you know how to use the unit, and you keep an unobstructed exit behind you. If one extinguisher does not control the fire immediately, leave; do not advance deeper into the building for a second attempt.\n\n## Verification anchors\n- U.S. Fire Administration — home fire prevention/extinguisher education.\n- Local fire service and extinguisher manufacturer instructions.\n\nVerification date: 2026-08-09."},"el":{"title":"Ετοιμότητα Πυροσβεστήρα: Επιλογή, Συντήρηση και Χρήση με Προτεραιότητα στην Έξοδο","body":"Ο πυροσβεστήρας είναι περιορισμένο εργαλείο για μικρή φωτιά στο αρχικό στάδιο. Δεν είναι λόγος να μείνεις σε καπνό, να χάσεις την έξοδο ή να παλέψεις με φωτιά που μεγαλώνει. Ετοιμότητα σημαίνει σωστός τύπος για τους κινδύνους του χώρου, προσβάσιμη θέση κοντά σε πορεία διαφυγής, συντήρηση και εκπαίδευση πριν το συμβάν.\n\n## Ταίριαξε τον πυροσβεστήρα στον κίνδυνο\nΟι κατηγορίες φωτιάς και οι ετικέτες διαφέρουν ανά περιοχή, αλλά η αρχή είναι ίδια: το κατασβεστικό υλικό πρέπει να είναι κατάλληλο για αυτό που καίγεται και για τυχόν ηλεκτρική τάση. Ακολούθησε τοπικές απαιτήσεις πυροσβεστικής/κτιρίου και την ετικέτα. Λάδια και λίπη κουζίνας μπορεί να απαιτούν συγκεκριμένο μέσο· νερό μπορεί να είναι επικίνδυνο σε καμένο λάδι ή ενεργό ηλεκτρικό εξοπλισμό.\n\n## Τοποθέτησέ τον με σκέψη στη διαφυγή\nΜην αποθηκεύεις τον μοναδικό πυροσβεστήρα πίσω από την πιθανή πηγή φωτιάς. Βάλε κατάλληλες μονάδες σε προσβάσιμες διαδρομές εξόδου σύμφωνα με κανονισμό/κατασκευαστή. Όλοι πρέπει να ξέρουν πού είναι, αλλά παιδιά ή μη εκπαιδευμένοι χρήστες δεν πρέπει να έχουν ρόλο πυρόσβεσης.\n\n## Η συντήρηση είναι μέρος του εξοπλισμού\nΈλεγχε ένδειξη πίεσης/κατάστασης όπου υπάρχει, ασφάλεια/σφράγισμα, σωλήνα/στόμιο, διάβρωση/ζημιά και πρόσβαση. Ακολούθησε διαστήματα ελέγχου/συντήρησης. Πυροσβεστήρας που έχει χρησιμοποιηθεί, καταστραφεί, λήξει ή είναι κρυμμένος πίσω από κουτιά πρέπει να θεωρείται μη διαθέσιμος.\n\n## Μόνο μικρή φωτιά και μόνο με ασφαλή έξοδο\nΣήμανε συναγερμό και βεβαιώσου ότι οι άλλοι φεύγουν. Χρησιμοποίησε πυροσβεστήρα μόνο αν η φωτιά είναι μικρή/περιορισμένη, ο καπνός επιτρέπει ασφαλή αναπνοή/ορατότητα, ξέρεις να χρησιμοποιήσεις τη μονάδα και έχεις καθαρή έξοδο πίσω σου. Αν δεν ελεγχθεί αμέσως, φύγε· μην προχωράς βαθύτερα για δεύτερη προσπάθεια.\n\n## Πηγές επαλήθευσης\n- U.S. Fire Administration — εκπαίδευση πρόληψης/πυροσβεστήρων.\n- Τοπική πυροσβεστική και οδηγίες κατασκευαστή πυροσβεστήρα.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":181,"en":{"title":"Lithium Battery Everyday Charging and Storage Safety","body":"Rechargeable lithium batteries make phones, power banks, radios and tools extremely useful during outages, but normal charging practices matter long before a battery is visibly damaged. Treat heat, swelling, unusual odor, hissing, leaking, smoke or a sudden change in behavior as stop-use signs rather than something to “test one more time.”\n\n## Set up a safer charging area\nCharge on a stable, nonflammable surface with airflow around the device. Keep charging equipment away from bedding, paper piles, curtains and direct sun. Use a charger/cable intended for the device and retire connectors that are crushed, loose, scorched or intermittently arcing. Do not cover a charging device to keep it warm or hide its light.\n\n## Watch temperature and behavior\nSome warmth during charging can be normal; rapidly increasing heat or behavior that is new for that device is not a reason to keep charging unattended. Disconnect from power if it can be done safely. A swollen battery should not be punctured, compressed, bent or forced back into a case. Follow local hazardous-battery disposal guidance rather than putting damaged lithium cells into ordinary household waste.\n\n## Store for continuity, not neglect\nRotate power banks through periodic function checks. Record capacity, last test date and which critical device each one supports. Avoid storing packs where summer vehicle temperatures or freezing conditions are routine. Separate spare batteries from loose conductive metal that could short terminals.\n\n## Incident boundary\nIf a battery is smoking, venting or on fire, prioritize people, evacuation and emergency services. Do not create a second injury by handling a hot or unstable cell. A battery incident can re-ignite; do not assume that visible flame stopping means the hazard is over.\n\n## Verification sources\n- U.S. Fire Administration — battery fire safety: https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/batteries/\n- U.S. Consumer Product Safety Commission — lithium-ion battery safety resources: https://www.cpsc.gov/Safety-Education/Safety-Education-Centers/Batteries\n\nVerification date: 2026-08-09."},"el":{"title":"Ασφαλής καθημερινή φόρτιση και αποθήκευση μπαταριών λιθίου","body":"Οι επαναφορτιζόμενες μπαταρίες λιθίου κάνουν τα τηλέφωνα, τα power bank, τα ραδιόφωνα και τα εργαλεία εξαιρετικά χρήσιμα σε διακοπές ρεύματος, όμως οι σωστές συνήθειες φόρτισης έχουν σημασία πολύ πριν εμφανιστεί ορατή βλάβη. Θεώρησε τη διόγκωση, την ασυνήθιστη μυρωδιά, το σφύριγμα, τη διαρροή, τον καπνό, την υπερβολική θερμότητα ή μια ξαφνική αλλαγή συμπεριφοράς ως λόγο άμεσης διακοπής χρήσης — όχι ως κάτι που «θα δοκιμάσουμε άλλη μία φορά».\n\n## Ασφαλέστερο σημείο φόρτισης\nΦόρτιζε σε σταθερή, μη εύφλεκτη επιφάνεια με ελεύθερο αέρα γύρω από τη συσκευή. Κράτα φορτιστές μακριά από κλινοσκεπάσματα, χαρτιά, κουρτίνες και άμεσο ήλιο. Χρησιμοποίησε φορτιστή και καλώδιο κατάλληλα για τη συσκευή και απόσυρε συνδέσμους που έχουν λιώσει, μαυρίσει, τσακίσει ή κάνουν διακοπές. Μην καλύπτεις μια συσκευή που φορτίζει.\n\n## Παρακολούθησε θερμοκρασία και συμπεριφορά\nΜικρή θέρμανση μπορεί να είναι φυσιολογική· γρήγορη άνοδος θερμοκρασίας ή συμπεριφορά που δεν υπήρχε πριν δεν είναι λόγος να συνεχίσεις χωρίς επίβλεψη. Αποσύνδεσε την παροχή μόνο αν αυτό μπορεί να γίνει με ασφάλεια. Μην τρυπάς, πιέζεις, λυγίζεις ή προσπαθείς να επαναφέρεις διογκωμένη μπαταρία μέσα στη θήκη. Ακολούθησε τις τοπικές οδηγίες διάθεσης επικίνδυνων μπαταριών.\n\n## Αποθήκευση για πραγματική ετοιμότητα\nΈλεγχε περιοδικά τα power bank. Κατέγραψε χωρητικότητα, ημερομηνία τελευταίας δοκιμής και ποια κρίσιμη συσκευή υποστηρίζει το καθένα. Απόφυγε μόνιμη αποθήκευση σε αυτοκίνητο με ακραία καλοκαιρινή ζέστη ή σε σημεία που παγώνουν. Κράτα εφεδρικές μπαταρίες μακριά από χαλαρά μεταλλικά αντικείμενα που μπορούν να βραχυκυκλώσουν τους πόλους.\n\n## Όριο σε περιστατικό\nΑν μπαταρία καπνίζει, εκτονώνει αέρια ή καίγεται, προτεραιότητα έχουν οι άνθρωποι, η εκκένωση και οι υπηρεσίες έκτακτης ανάγκης. Μην προκαλέσεις δεύτερο τραυματισμό αγγίζοντας θερμή ή ασταθή κυψέλη. Είναι δυνατό να υπάρξει επανάφλεξη, άρα η εξαφάνιση της φλόγας δεν σημαίνει ότι ο κίνδυνος τελείωσε.\n\n## Πηγές επαλήθευσης\n- U.S. Fire Administration — ασφάλεια μπαταριών: https://www.usfa.fema.gov/prevention/home-fires/prevent-fires/batteries/\n- U.S. Consumer Product Safety Commission — πόροι για μπαταρίες λιθίου: https://www.cpsc.gov/Safety-Education/Safety-Education-Centers/Batteries\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":182,"en":{"title":"Lead-Acid Batteries: Acid, Hydrogen, and Charging Boundaries","body":"Lead-acid batteries remain common in cars, UPS systems and some solar installations. Their hazards differ from lithium systems: corrosive electrolyte, very high short-circuit current, heavy weight and hydrogen that can be produced during charging.\n\n## Before touching the system\nIdentify whether the battery is flooded, AGM, gel or another type and follow the manufacturer's charging limits. Remove jewelry that could bridge terminals. Keep metal tools controlled. Eye protection and appropriate gloves matter when working around exposed electrolyte. Never improvise an unknown charger profile because “12 volts is 12 volts.”\n\n## Ventilation is part of the system\nDo not charge a vented lead-acid battery in a sealed living compartment. Keep sparks, cigarettes and flame away from a charging bank. A power cabinet that traps gases is not made safe by simply closing its door. If a system was flooded, physically damaged or has a cracked case, isolate it from routine use until qualified assessment.\n\n## Acid exposure\nBattery electrolyte is corrosive. If exposure occurs, begin immediate first-aid flushing appropriate to the body area and obtain professional/poison guidance. Do not neutralize chemicals on skin or eyes with improvised mixtures. Contaminated clothing should be handled so acid is not transferred to another person.\n\n## Field continuity practice\nLabel each bank with nominal voltage, chemistry, charger, disconnect point and last inspection. Track resting voltage only if you understand the system and know that voltage alone does not prove capacity. Plan lifting/movement for the actual battery mass; dropped batteries create both electrical and chemical hazards.\n\n## Verification sources\n- OSHA — battery charging and handling requirements/resources: https://www.osha.gov/etools/shipyard/general-requirements/batteries\n- CDC/NIOSH — sulfuric acid safety information: https://www.cdc.gov/niosh/npg/npgd0577.html\n\nVerification date: 2026-08-09."},"el":{"title":"Μπαταρίες μολύβδου-οξέος: οξύ, υδρογόνο και όρια φόρτισης","body":"Οι μπαταρίες μολύβδου-οξέος παραμένουν συνηθισμένες σε αυτοκίνητα, UPS και ορισμένα φωτοβολταϊκά συστήματα. Οι κίνδυνοί τους διαφέρουν από τις μπαταρίες λιθίου: διαβρωτικός ηλεκτρολύτης, πολύ μεγάλο ρεύμα βραχυκυκλώματος, μεγάλο βάρος και υδρογόνο που μπορεί να παράγεται κατά τη φόρτιση.\n\n## Πριν αγγίξεις το σύστημα\nΕντόπισε αν η μπαταρία είναι ανοικτού τύπου, AGM, gel ή άλλης τεχνολογίας και ακολούθησε τα όρια φόρτισης του κατασκευαστή. Αφαίρεσε κοσμήματα που θα μπορούσαν να γεφυρώσουν πόλους και έλεγξε τα μεταλλικά εργαλεία. Προστασία ματιών και κατάλληλα γάντια είναι σημαντικά όταν υπάρχει πιθανότητα έκθεσης σε ηλεκτρολύτη. Μην αυτοσχεδιάζεις άγνωστο προφίλ φόρτισης επειδή «όλα είναι 12 V».\n\n## Ο αερισμός είναι μέρος του συστήματος\nΜην φορτίζεις αεριζόμενη μπαταρία μολύβδου σε σφραγισμένο χώρο κατοίκησης. Κράτα σπινθήρες, τσιγάρα και φλόγες μακριά από συστοιχία που φορτίζει. Ένα ντουλάπι που παγιδεύει αέρια δεν γίνεται ασφαλές απλώς επειδή έκλεισε η πόρτα του. Αν το σύστημα πλημμύρισε, χτυπήθηκε ή το περίβλημα ράγισε, απομόνωσέ το μέχρι να αξιολογηθεί κατάλληλα.\n\n## Έκθεση σε οξύ\nΟ ηλεκτρολύτης είναι διαβρωτικός. Σε έκθεση ξεκίνησε αμέσως την κατάλληλη έκπλυση για το σημείο του σώματος και ζήτησε επαγγελματική ή τοξικολογική καθοδήγηση. Μην προσπαθείς να «εξουδετερώσεις» χημικό πάνω σε δέρμα ή μάτια με αυτοσχέδια μίγματα. Χειρίσου μολυσμένα ρούχα ώστε να μην μεταφερθεί οξύ σε άλλο άτομο.\n\n## Πρακτική συνέχειας\nΣήμανε κάθε συστοιχία με ονομαστική τάση, χημεία, φορτιστή, σημείο αποσύνδεσης και τελευταία επιθεώρηση. Η τάση ηρεμίας μπορεί να είναι χρήσιμη μόνο αν κατανοείς το σύστημα· από μόνη της δεν αποδεικνύει πραγματική χωρητικότητα. Σχεδίασε μεταφορά με βάση το πραγματικό βάρος, επειδή μια πτώση δημιουργεί ταυτόχρονα ηλεκτρικό και χημικό κίνδυνο.\n\n## Πηγές επαλήθευσης\n- OSHA — φόρτιση και χειρισμός μπαταριών: https://www.osha.gov/etools/shipyard/general-requirements/batteries\n- CDC/NIOSH — πληροφορίες για θειικό οξύ: https://www.cdc.gov/niosh/npg/npgd0577.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":183,"en":{"title":"Solar Charging in the Field: Setup, Yield, and Connector Discipline","body":"A portable solar panel is not a guaranteed number of watt-hours. Output changes with sun angle, cloud, shade, panel temperature, charge-controller limits, battery state and conversion losses. Survival planning should therefore use measured performance from your own equipment, not only the number printed on the panel.\n\n## Build a measured baseline\nOn a normal clear day, record panel rating, controller, battery, time window, weather and actual energy delivered if your equipment can report it. Repeat in imperfect conditions. The useful result is a range: what your system normally produces, what it produces under poor conditions and which loads must be cut when generation falls below demand.\n\n## Shade matters disproportionately\nPartial shade across a panel can reduce output far more than the shaded area might suggest, depending on panel design. Inspect the site repeatedly as the sun moves. Keep panels where they will not become a trip hazard, vehicle hazard or windborne object. Secure portable panels against gusts without puncturing or bending them.\n\n## Respect electrical compatibility\nConfirm panel open-circuit voltage/current and controller input limits before connecting unfamiliar panels in series or parallel. Do not improvise polarity. Do not mate visually similar connectors unless their pinout and electrical ratings are known. Stop using cables that become unusually hot or have damaged insulation.\n\n## Operational priority\nCharge the storage system first when doing so gives you better control over critical loads; direct charging may be appropriate for equipment designed for it. Reserve energy for communications, medical equipment, lighting and information before comfort loads. Recalculate the plan after two poor solar days rather than waiting for the battery to reach an emergency threshold.\n\n## Verification sources\n- U.S. Department of Energy — solar photovoltaic basics: https://www.energy.gov/eere/solar/solar-photovoltaic-technology-basics\n- National Renewable Energy Laboratory — photovoltaic resources: https://www.nrel.gov/pv/\n\nVerification date: 2026-08-09."},"el":{"title":"Φωτοβολταϊκή φόρτιση πεδίου: εγκατάσταση, απόδοση και συνδέσεις","body":"Ένα φορητό φωτοβολταϊκό πάνελ δεν εγγυάται συγκεκριμένες βατώρες ενέργειας. Η απόδοση αλλάζει με τη γωνία του ήλιου, τα σύννεφα, τη σκιά, τη θερμοκρασία του πάνελ, τα όρια του ρυθμιστή φόρτισης, την κατάσταση της μπαταρίας και τις απώλειες μετατροπής. Γι’ αυτό ο σχεδιασμός έκτακτης ανάγκης πρέπει να βασίζεται σε μετρήσεις του δικού σου εξοπλισμού και όχι μόνο στον αριθμό της ετικέτας.\n\n## Δημιούργησε πραγματική βάση μέτρησης\nΣε μια συνηθισμένη καθαρή ημέρα κατέγραψε ισχύ πάνελ, ρυθμιστή, μπαταρία, χρονικό παράθυρο, καιρό και την πραγματική ενέργεια που παραδόθηκε, αν ο εξοπλισμός τη μετρά. Επανάλαβε σε χειρότερες συνθήκες. Το χρήσιμο αποτέλεσμα είναι ένα εύρος: φυσιολογική παραγωγή, κακή παραγωγή και ποια φορτία κόβονται όταν η παραγωγή πέσει κάτω από τη ζήτηση.\n\n## Η σκιά μπορεί να έχει δυσανάλογη επίδραση\nΜερική σκίαση μπορεί να μειώσει την απόδοση πολύ περισσότερο από όσο υποδηλώνει το σκιασμένο εμβαδόν, ανάλογα με τον σχεδιασμό του πάνελ. Έλεγχε ξανά τη θέση καθώς κινείται ο ήλιος. Μην τοποθετείς πάνελ εκεί όπου γίνονται εμπόδιο, κίνδυνος για όχημα ή αντικείμενο που μπορεί να παρασυρθεί από τον άνεμο. Στερέωσε τα φορητά πάνελ χωρίς να τα τρυπάς ή να τα λυγίζεις.\n\n## Σεβάσου την ηλεκτρική συμβατότητα\nΈλεγξε τάση ανοικτού κυκλώματος, ρεύμα και όρια εισόδου του ρυθμιστή πριν συνδέσεις άγνωστα πάνελ σε σειρά ή παράλληλα. Μην μαντεύεις πολικότητα. Μην ενώνεις παρόμοιους οπτικά συνδέσμους χωρίς γνωστή συνδεσμολογία και ονομαστικά όρια. Απόσυρε καλώδιο που θερμαίνεται ασυνήθιστα ή έχει χαλασμένη μόνωση.\n\n## Επιχειρησιακή προτεραιότητα\nΦόρτισε πρώτα την αποθήκευση ενέργειας όταν αυτό επιτρέπει καλύτερο έλεγχο των κρίσιμων φορτίων· άμεση φόρτιση είναι κατάλληλη μόνο για συσκευές σχεδιασμένες γι’ αυτή. Κράτα απόθεμα για επικοινωνίες, ιατρικό εξοπλισμό, φωτισμό και πληροφορίες πριν από φορτία άνεσης. Επανυπολόγισε το σχέδιο μετά από δύο κακές ηλιακές ημέρες, όχι όταν η μπαταρία έχει ήδη φτάσει σε κρίσιμο επίπεδο.\n\n## Πηγές επαλήθευσης\n- U.S. Department of Energy — βασικές αρχές φωτοβολταϊκών: https://www.energy.gov/eere/solar/solar-photovoltaic-technology-basics\n- National Renewable Energy Laboratory — πόροι φωτοβολταϊκών: https://www.nrel.gov/pv/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":184,"en":{"title":"Inverters, DC Loads, and a Realistic Power Budget","body":"An outage power plan fails when it counts battery capacity but ignores conversion losses, inverter standby consumption, startup surges and loads that run intermittently. Build the budget from the devices you actually intend to support.\n\n## Measure the load path\nA device powered through an inverter uses battery energy after conversion losses. A device that can safely run from a compatible DC output may avoid one conversion stage, but only use voltage, polarity and connectors intended by the manufacturer. Do not create improvised adapters for critical medical or communications equipment during an emergency.\n\n## Separate three numbers\nRecord continuous watts while running, startup/surge behavior, and hours of use. Refrigerators, pumps and compressors can draw substantially more during startup than their steady state. An inverter must be compatible with both the continuous and transient demand. If the device's waveform requirements are unknown, test the exact combination before an emergency.\n\n## Budget usable energy conservatively\nBattery nameplate energy is not automatically fully usable. Chemistry, temperature, battery-management limits, age and desired depth of discharge affect what is realistically available. Use measured runtime from periodic drills to replace assumptions. Include inverter idle consumption if the inverter stays on for long periods.\n\n## Create shedding tiers\nTier 1: medical and life-safety equipment. Tier 2: communications, minimum lighting, refrigeration when food/medicine requires it. Tier 3: information/maintenance devices. Tier 4: comfort/convenience. Define the shutdown order before the battery is low, and record the threshold that triggers each cut.\n\n## Source anchors\n- U.S. Department of Energy — energy storage and solar basics: https://www.energy.gov/eere/solar/solar-integration-solar-energy-and-energy-storage\n- Manufacturer documentation for the exact inverter, battery and loads in use.\n\nVerification date: 2026-08-09."},"el":{"title":"Μετατροπείς, φορτία συνεχούς ρεύματος και ρεαλιστικός προϋπολογισμός ισχύος","body":"Ένα σχέδιο εφεδρικής ισχύος αποτυγχάνει όταν μετρά μόνο τη χωρητικότητα της μπαταρίας αλλά αγνοεί απώλειες μετατροπής, κατανάλωση αναμονής του μετατροπέα, ρεύματα εκκίνησης και φορτία που λειτουργούν διακοπτόμενα. Χτίσε τον προϋπολογισμό πάνω στις πραγματικές συσκευές που θέλεις να διατηρήσεις.\n\n## Μέτρησε όλη τη διαδρομή ισχύος\nΜια συσκευή που τροφοδοτείται μέσω μετατροπέα καταναλώνει ενέργεια μπαταρίας αφού προστεθούν οι απώλειες μετατροπής. Συμβατή έξοδος συνεχούς ρεύματος μπορεί να αποφεύγει ένα στάδιο, αλλά χρησιμοποίησε μόνο τάση, πολικότητα και συνδέσμους που προβλέπει ο κατασκευαστής. Μην κατασκευάζεις πρόχειρους αντάπτορες για κρίσιμο ιατρικό ή επικοινωνιακό εξοπλισμό μέσα στην έκτακτη ανάγκη.\n\n## Ξεχώρισε τρεις αριθμούς\nΚατέγραψε συνεχή ισχύ λειτουργίας, συμπεριφορά εκκίνησης και ώρες χρήσης. Ψυγεία, αντλίες και συμπιεστές μπορούν να ζητούν πολύ περισσότερη ισχύ κατά την εκκίνηση από τη σταθερή λειτουργία. Ο μετατροπέας πρέπει να αντέχει τόσο το συνεχές όσο και το στιγμιαίο φορτίο. Αν οι απαιτήσεις κυματομορφής είναι άγνωστες, δοκίμασε τον ακριβή συνδυασμό πριν την ανάγκη.\n\n## Συντηρητικός υπολογισμός διαθέσιμης ενέργειας\nΗ ονομαστική ενέργεια μιας μπαταρίας δεν είναι αυτόματα πλήρως αξιοποιήσιμη. Χημεία, θερμοκρασία, όρια διαχείρισης μπαταρίας, ηλικία και επιθυμητό βάθος εκφόρτισης αλλάζουν την πραγματική διαθεσιμότητα. Χρησιμοποίησε μετρημένο χρόνο λειτουργίας από δοκιμές και πρόσθεσε την κατανάλωση αναμονής του μετατροπέα όταν μένει ενεργός.\n\n## Βαθμίδες απόρριψης φορτίου\nΒαθμίδα 1: ιατρικός και σωστικός εξοπλισμός. Βαθμίδα 2: επικοινωνίες, ελάχιστος φωτισμός, ψύξη όταν απαιτείται για τρόφιμα ή φάρμακα. Βαθμίδα 3: πληροφορίες και συντήρηση. Βαθμίδα 4: άνεση. Όρισε σειρά διακοπής πριν πέσει η μπαταρία και κατέγραψε ποιο όριο ενεργοποιεί κάθε περικοπή.\n\n## Πηγές αναφοράς\n- U.S. Department of Energy — αποθήκευση και ηλιακή ενέργεια: https://www.energy.gov/eere/solar/solar-integration-solar-energy-and-energy-storage\n- Τεκμηρίωση κατασκευαστή για τον συγκεκριμένο μετατροπέα, μπαταρία και φορτία.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":185,"en":{"title":"Private Wells After Flooding: Isolation, Return, and Testing","body":"A flooded private well should not be treated as safe simply because the water becomes clear again. Floodwater can enter through the wellhead, casing, nearby soil or damaged plumbing and carry microorganisms or chemicals that are invisible.\n\n## During and immediately after flooding\nAvoid using flooded well water for drinking, cooking, brushing teeth or other ingestion-related uses until the well has been appropriately assessed and tested. Electrical well equipment can also be hazardous after immersion; do not energize damaged pumps or controls casually. Use an alternate safe water supply while the well is out of service.\n\n## Inspect before restoration\nLook for displacement, cracked casing, a damaged cap, debris, erosion around the wellhead and damage to pressure tanks/piping. A licensed well or pump professional may be needed before disinfection or sampling, especially if electrical parts or the well structure were affected.\n\n## Testing matters\nFollow your public-health/environmental authority's post-flood sampling instructions. Microbiological testing is commonly part of return-to-service; suspected fuel, pesticide, industrial or septic contamination may require additional testing. Boiling can address many microbial hazards but does not remove many chemical contaminants.\n\n## Keep a recovery record\nDocument flood level, photographs, inspection, repairs, disinfection performed by qualified guidance, laboratory results, date returned to service and any follow-up sampling. This record is valuable after later illness or repeated flooding.\n\n## Verification sources\n- CDC — private wells after a disaster: https://www.cdc.gov/water-emergency/about/how-to-keep-private-wells-safe-after-a-disaster.html\n- EPA — emergency disinfection/drinking-water resources: https://www.epa.gov/ground-water-and-drinking-water/emergency-disinfection-drinking-water\n\nVerification date: 2026-08-09."},"el":{"title":"Ιδιωτικά πηγάδια μετά από πλημμύρα: απομόνωση, επαναφορά και έλεγχος","body":"Ένα ιδιωτικό πηγάδι που πλημμύρισε δεν πρέπει να θεωρείται ασφαλές απλώς επειδή το νερό έγινε ξανά διαυγές. Πλημμυρικό νερό μπορεί να εισέλθει από την κεφαλή, την επένδυση, το γύρω έδαφος ή κατεστραμμένες σωληνώσεις και να μεταφέρει μικροοργανισμούς ή χημικά που δεν φαίνονται.\n\n## Κατά τη διάρκεια και αμέσως μετά την πλημμύρα\nΜην χρησιμοποιείς νερό από πλημμυρισμένο πηγάδι για πόση, μαγείρεμα, βούρτσισμα δοντιών ή άλλες χρήσεις που οδηγούν σε κατάποση μέχρι να γίνει κατάλληλη αξιολόγηση και έλεγχος. Ηλεκτρικός εξοπλισμός αντλίας μπορεί επίσης να είναι επικίνδυνος μετά από βύθιση· μην τον ενεργοποιείς πρόχειρα. Χρησιμοποίησε εναλλακτική ασφαλή παροχή νερού.\n\n## Επιθεώρηση πριν την επαναφορά\nΈλεγξε μετατόπιση, ρωγμές επένδυσης, κατεστραμμένο καπάκι, συντρίμμια, διάβρωση γύρω από την κεφαλή και βλάβες σε δοχείο πίεσης ή σωληνώσεις. Μπορεί να χρειάζεται αδειοδοτημένος τεχνικός πριν από απολύμανση ή δειγματοληψία, ιδιαίτερα όταν επηρεάστηκαν ηλεκτρικά μέρη ή η κατασκευή του πηγαδιού.\n\n## Ο εργαστηριακός έλεγχος έχει σημασία\nΑκολούθησε τις οδηγίες της αρμόδιας υγειονομικής ή περιβαλλοντικής αρχής για δειγματοληψία μετά από πλημμύρα. Ο μικροβιολογικός έλεγχος είναι συχνά μέρος της επαναφοράς· υποψία καυσίμων, φυτοφαρμάκων, βιομηχανικών ουσιών ή σηπτικής ρύπανσης μπορεί να απαιτεί πρόσθετες αναλύσεις. Ο βρασμός αντιμετωπίζει πολλούς μικροβιακούς κινδύνους αλλά δεν αφαιρεί πολλές χημικές ουσίες.\n\n## Κράτησε αρχείο αποκατάστασης\nΚατέγραψε ύψος πλημμύρας, φωτογραφίες, επιθεώρηση, επισκευές, απολύμανση σύμφωνα με κατάλληλη καθοδήγηση, εργαστηριακά αποτελέσματα, ημερομηνία επαναφοράς και επόμενες δειγματοληψίες. Το αρχείο είναι χρήσιμο σε μελλοντική ασθένεια ή επαναλαμβανόμενη πλημμύρα.\n\n## Πηγές επαλήθευσης\n- CDC — ιδιωτικά πηγάδια μετά από καταστροφή: https://www.cdc.gov/water-emergency/about/how-to-keep-private-wells-safe-after-a-disaster.html\n- EPA — απολύμανση πόσιμου νερού σε έκτακτη ανάγκη: https://www.epa.gov/ground-water-and-drinking-water/emergency-disinfection-drinking-water\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":186,"en":{"title":"Rainwater Capture: First-Flush, Storage, and Potable Separation","body":"Rainwater can extend nonpotable supplies, but a roof and tank do not automatically create drinking water. Dust, bird/animal waste, roofing materials, smoke/ash and maintenance chemicals can enter the collection stream.\n\n## Define the intended use first\nLabel the system clearly as potable or nonpotable according to how it is designed, treated and regulated locally. A nonpotable rainwater system can support cleaning, toilet flushing or other approved uses while protecting known-safe drinking water. Do not allow cross-connections where someone can accidentally drink from an untreated line.\n\n## Keep the collection path inspectable\nClean gutters and screens, exclude animals/insects where practical, and divert the dirtiest initial roof runoff with a suitable first-flush design when applicable. After wildfire ash, chemical deposition or roofing work, suspend collection until the catchment has been assessed rather than assuming normal treatment is sufficient.\n\n## Protect stored water\nUse covered, cleanable containers that prevent light/debris entry and mosquito access. Keep an overflow path that does not undermine foundations. Mark the collection date/batch if you rotate stored water. Do not use a container that previously held unknown or hazardous chemicals for water storage.\n\n## Drinking-water boundary\nIf rainwater is intended for drinking, treatment and testing must match local public-health guidance and the specific contamination risks. Clear appearance is not proof of microbiological or chemical safety.\n\n## Source anchors\n- CDC — collecting rainwater and health considerations: https://www.cdc.gov/drinking-water/about/about-collecting-rainwater.html\n- WHO — household water treatment and safe storage resources: https://www.who.int/teams/environment-climate-change-and-health/water-sanitation-and-health/water-safety-and-quality/household-water-treatment-and-safe-storage\n\nVerification date: 2026-08-09."},"el":{"title":"Συλλογή βρόχινου νερού: πρώτη έκπλυση, αποθήκευση και διαχωρισμός πόσιμου","body":"Το βρόχινο νερό μπορεί να επεκτείνει τα αποθέματα για μη πόσιμες χρήσεις, όμως μια στέγη και μια δεξαμενή δεν δημιουργούν αυτόματα πόσιμο νερό. Σκόνη, περιττώματα ζώων και πτηνών, υλικά στέγης, καπνός ή τέφρα και χημικά συντήρησης μπορούν να μπουν στη συλλογή.\n\n## Όρισε πρώτα τη χρήση\nΣήμανε καθαρά το σύστημα ως πόσιμο ή μη πόσιμο ανάλογα με τον σχεδιασμό, την επεξεργασία και τους τοπικούς κανόνες. Μη πόσιμο βρόχινο νερό μπορεί να χρησιμοποιηθεί για καθαρισμό, καζανάκι ή άλλες εγκεκριμένες χρήσεις, προστατεύοντας το γνωστό ασφαλές πόσιμο απόθεμα. Μην δημιουργείς διασυνδέσεις όπου κάποιος μπορεί κατά λάθος να πιει από ακατέργαστη γραμμή.\n\n## Διατήρησε τη διαδρομή συλλογής επιθεωρήσιμη\nΚαθάριζε υδρορροές και σίτες, περιόριζε την είσοδο ζώων και εντόμων και, όπου ενδείκνυται, απόρριπτε το πιο βρόμικο αρχικό νερό της στέγης με κατάλληλο σύστημα πρώτης έκπλυσης. Μετά από τέφρα πυρκαγιάς, χημική εναπόθεση ή εργασίες στη στέγη, σταμάτησε τη συλλογή μέχρι να αξιολογηθεί η επιφάνεια.\n\n## Προστάτευσε την αποθήκευση\nΧρησιμοποίησε καλυμμένα δοχεία που καθαρίζονται και εμποδίζουν φως, σκουπίδια και κουνούπια. Προέβλεψε υπερχείλιση που δεν υποσκάπτει θεμέλια. Σήμανε ημερομηνία ή παρτίδα όταν γίνεται περιστροφή αποθέματος. Μην αποθηκεύεις νερό σε δοχείο που είχε άγνωστα ή επικίνδυνα χημικά.\n\n## Όριο πόσιμης χρήσης\nΑν το βρόχινο νερό προορίζεται για πόση, η επεξεργασία και ο έλεγχος πρέπει να ταιριάζουν στις τοπικές υγειονομικές οδηγίες και στους συγκεκριμένους κινδύνους. Η διαύγεια δεν αποδεικνύει μικροβιολογική ή χημική ασφάλεια.\n\n## Πηγές αναφοράς\n- CDC — συλλογή βρόχινου νερού και υγεία: https://www.cdc.gov/drinking-water/about/about-collecting-rainwater.html\n- WHO — οικιακή επεξεργασία και ασφαλής αποθήκευση νερού: https://www.who.int/teams/environment-climate-change-and-health/water-sanitation-and-health/water-safety-and-quality/household-water-treatment-and-safe-storage\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":187,"en":{"title":"Greywater: Hygiene Boundaries and Cross-Connection Control","body":"Greywater can reduce demand on potable water, but it is not clean water. Water from bathing, handwashing or laundry can contain microorganisms, detergents, skin material and chemicals. Kitchen and toilet waste may be classified differently and should not be casually mixed into a greywater plan.\n\n## Keep potable and reuse systems unmistakably separate\nUse labels, dedicated containers and physically separate hoses/lines. Do not dip a drinking-water scoop into a greywater container. Prevent backflow or cross-connection into potable plumbing. If household members cannot reliably distinguish two systems under stress or darkness, simplify the setup.\n\n## Match reuse to exposure risk\nChoose uses that minimize human contact and aerosol generation, following local rules. Avoid storing untreated greywater for long periods; microbial growth and odor can increase quickly. Do not use greywater where it can contact food that will be eaten raw unless authoritative local guidance specifically supports that use and treatment.\n\n## Track chemicals\nBleach, solvents, strong cleaners, medication residues and high-salt detergents can change whether a batch is suitable for reuse. A single contaminated laundry load can make the whole collection unsuitable for the planned destination. When in doubt, route it to the approved waste path rather than trying to “fix” it with another chemical.\n\n## Outage planning\nIf sewer service is impaired, do not increase greywater discharge into a system that is already backing up. Sanitation and wastewater authority instructions override your normal reuse plan.\n\n## Source anchors\n- WHO — water, sanitation and hygiene technical resources: https://www.who.int/health-topics/water-sanitation-and-hygiene-wash\n- EPA — water reuse resources: https://www.epa.gov/waterreuse\n\nVerification date: 2026-08-09."},"el":{"title":"Γκρίζο νερό: όρια υγιεινής και έλεγχος διασυνδέσεων","body":"Το γκρίζο νερό μπορεί να μειώσει την κατανάλωση πόσιμου νερού, όμως δεν είναι καθαρό νερό. Νερό από μπάνιο, πλύσιμο χεριών ή ρούχων μπορεί να περιέχει μικροοργανισμούς, απορρυπαντικά, υλικό δέρματος και χημικές ουσίες. Απόβλητα κουζίνας και τουαλέτας μπορεί να ταξινομούνται διαφορετικά και δεν πρέπει να αναμειγνύονται πρόχειρα σε σχέδιο επαναχρησιμοποίησης.\n\n## Απόλυτος διαχωρισμός από το πόσιμο δίκτυο\nΧρησιμοποίησε σήμανση, ξεχωριστά δοχεία και φυσικά διαφορετικούς σωλήνες. Μην βάζεις κουτάλα πόσιμου νερού σε δοχείο γκρίζου νερού. Απότρεψε επιστροφή ή διασύνδεση προς σωληνώσεις πόσιμου νερού. Αν σε στρες ή σκοτάδι τα μέλη του νοικοκυριού δεν μπορούν να ξεχωρίσουν με βεβαιότητα τα δύο συστήματα, απλοποίησε τη διάταξη.\n\n## Η χρήση πρέπει να ταιριάζει στον κίνδυνο έκθεσης\nΕπίλεξε χρήσεις που ελαχιστοποιούν ανθρώπινη επαφή και αερολύματα, σύμφωνα με τους τοπικούς κανόνες. Μην κρατάς ακατέργαστο γκρίζο νερό για μεγάλο διάστημα· η μικροβιακή ανάπτυξη και οι οσμές μπορούν να αυξηθούν γρήγορα. Μην το χρησιμοποιείς εκεί όπου μπορεί να έρθει σε επαφή με τρόφιμο που τρώγεται ωμό χωρίς σαφή έγκυρη τοπική καθοδήγηση.\n\n## Κατέγραψε τα χημικά\nΧλωρίνη, διαλύτες, ισχυρά καθαριστικά, υπολείμματα φαρμάκων και απορρυπαντικά με πολύ αλάτι μπορεί να αλλάξουν την καταλληλότητα μιας παρτίδας. Ένα μόνο μολυσμένο πλύσιμο μπορεί να καταστήσει όλη τη συλλογή ακατάλληλη για τον προορισμό της. Σε αμφιβολία, ακολούθησε την εγκεκριμένη οδό αποβλήτων αντί να προσθέτεις άλλο χημικό για «διόρθωση».\n\n## Σε βλάβη αποχέτευσης\nΑν το δίκτυο αποχέτευσης δεν λειτουργεί σωστά, μην αυξάνεις απορρίψεις σε σύστημα που ήδη επιστρέφει λύματα. Οι οδηγίες της αρμόδιας αρχής ύδρευσης/αποχέτευσης υπερισχύουν του κανονικού σχεδίου επαναχρησιμοποίησης.\n\n## Πηγές αναφοράς\n- WHO — τεχνικοί πόροι ύδρευσης, αποχέτευσης και υγιεινής: https://www.who.int/health-topics/water-sanitation-and-hygiene-wash\n- EPA — επαναχρησιμοποίηση νερού: https://www.epa.gov/waterreuse\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":188,"en":{"title":"Emergency Toilet and Waste Containment When Sewers Fail","body":"A working toilet bowl does not prove that the sewer system can accept another flush. After flooding, earthquake damage, pump failure or a prolonged outage, continued flushing can push sewage back into a building or worsen a community failure.\n\n## Confirm the system status early\nWatch for slow drains, gurgling, sewage odor, backups or official requests to reduce/stop wastewater discharge. If the sewer authority says not to flush, stop before the household has an indoor contamination event. Close off affected rooms if sewage has already entered.\n\n## Plan a controlled fallback\nUse a purpose-built portable toilet or a locally recommended emergency sanitation method. Keep the collection method stable, private and isolated from food/water preparation. Provide hand hygiene immediately adjacent to the toilet zone. Use liners/absorbent material only according to the waste method you have chosen and local disposal rules.\n\n## Separate waste streams\nHuman waste, household trash, sharps, medication waste and chemical waste should not automatically share one bag or container. Keep sharps puncture-resistant and labeled. Keep cleaning chemicals out of the toilet system unless the product and local authority explicitly allow it. Mixing bleach with ammonia-containing waste or cleaners can create dangerous gas.\n\n## Protect the handler\nAssign the fewest practical people to waste handling, provide gloves/handwashing, and create a clean-to-dirty workflow so bags do not cross food or sleeping areas. Track how many containment units remain and trigger resupply/relocation before the last unit is used.\n\n## Verification sources\n- CDC — sanitation and hygiene after emergencies: https://www.cdc.gov/hygiene/about/when-and-how-to-wash-your-hands.html\n- WHO — WASH in emergencies resources: https://www.who.int/health-topics/water-sanitation-and-hygiene-wash\n\nVerification date: 2026-08-09."},"el":{"title":"Τουαλέτα και διαχείριση αποβλήτων όταν αποτυγχάνει η αποχέτευση","body":"Το ότι η λεκάνη φαίνεται να λειτουργεί δεν αποδεικνύει ότι το δίκτυο αποχέτευσης μπορεί να δεχθεί άλλο καζανάκι. Μετά από πλημμύρα, σεισμό, βλάβη αντλιοστασίου ή παρατεταμένη διακοπή, η συνέχιση της χρήσης μπορεί να φέρει λύματα πίσω στο κτίριο ή να επιβαρύνει τη γενικότερη βλάβη.\n\n## Επιβεβαίωσε νωρίς την κατάσταση\nΠαρατήρησε αργές αποχετεύσεις, γουργουρητά, οσμή λυμάτων, επιστροφές ή επίσημα αιτήματα περιορισμού απορρίψεων. Αν η αρμόδια υπηρεσία ζητήσει να μην χρησιμοποιούνται καζανάκια, σταμάτησε πριν δημιουργηθεί εσωτερική μόλυνση. Αν έχουν ήδη εισέλθει λύματα, απομόνωσε τον χώρο.\n\n## Ελεγχόμενη εναλλακτική τουαλέτα\nΧρησιμοποίησε ειδική φορητή τουαλέτα ή μέθοδο έκτακτης υγιεινής που συνιστά η τοπική αρχή. Η συλλογή πρέπει να είναι σταθερή, ιδιωτική και μακριά από προετοιμασία τροφίμων/νερού. Βάλε δυνατότητα υγιεινής χεριών ακριβώς δίπλα στη ζώνη. Χρησιμοποίησε σακούλες ή απορροφητικό υλικό μόνο σύμφωνα με τη μέθοδο και τους κανόνες διάθεσης.\n\n## Διαχώρισε τα απόβλητα\nΑνθρώπινα απόβλητα, κοινά σκουπίδια, αιχμηρά, φάρμακα και χημικά δεν πρέπει αυτομάτως να μπαίνουν στο ίδιο δοχείο. Τα αιχμηρά χρειάζονται ανθεκτικό σε διάτρηση δοχείο και σήμανση. Μην ρίχνεις καθαριστικά στην αυτοσχέδια τουαλέτα εκτός αν επιτρέπεται ρητά. Η ανάμειξη χλωρίνης με ουσίες ή καθαριστικά που περιέχουν αμμωνία μπορεί να δημιουργήσει επικίνδυνα αέρια.\n\n## Προστάτεψε τον χειριστή\nΑνάθεσε τον χειρισμό σε όσο το δυνατό λιγότερα άτομα, με γάντια και πλύσιμο χεριών. Δημιούργησε διαδρομή από καθαρό προς βρόμικο ώστε οι σακούλες να μη διασχίζουν χώρο τροφίμων ή ύπνου. Κατέγραψε πόσες μονάδες συλλογής απομένουν και ενεργοποίησε ανεφοδιασμό ή μετακίνηση πριν χρησιμοποιηθεί η τελευταία.\n\n## Πηγές επαλήθευσης\n- CDC — υγιεινή μετά από έκτακτες ανάγκες: https://www.cdc.gov/hygiene/about/when-and-how-to-wash-your-hands.html\n- WHO — πόροι ύδρευσης, αποχέτευσης και υγιεινής σε έκτακτες ανάγκες: https://www.who.int/health-topics/water-sanitation-and-hygiene-wash\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":189,"en":{"title":"Drinking Water: Clear Does Not Mean Safe","body":"Water can look, smell and taste normal while containing disease-causing microorganisms or chemicals. Sensory checks are useful for detecting some obvious problems, but they are not a safety test.\n\n## Use a source hierarchy\nPrefer sealed commercial water or a public supply that authorities say is safe. Next use water you stored safely before the incident. Treat uncertain sources only with a method appropriate to the suspected hazard. A filter designed for sediment or microorganisms may not remove dissolved chemicals; boiling kills many pathogens but does not remove many chemicals and can concentrate some contaminants as water evaporates.\n\n## Let the advisory determine the action\nA boil-water advisory, do-not-drink advisory and do-not-use advisory mean different things. Keep the exact wording and issuing authority in the incident log. Do not convert every advisory into “boil it” by habit. If authorities suspect chemical contamination, boiling can be the wrong response.\n\n## Prevent recontamination\nTreatment is only half of safe-water practice. Store treated water in a clean, covered container, use a clean dispensing method, and keep hands/utensils out of the bulk supply. Mark treatment time and batch when multiple containers are in rotation.\n\n## Watch vulnerable users\nInfants, pregnant people, older adults and people with weakened immune systems can face greater consequences from unsafe water. When guidance provides stricter instructions for a vulnerable person, use those instructions rather than the household default.\n\n## Verification sources\n- CDC — creating and storing an emergency water supply: https://www.cdc.gov/water-emergency/about/how-to-create-and-store-an-emergency-water-supply.html\n- EPA — emergency disinfection of drinking water: https://www.epa.gov/ground-water-and-drinking-water/emergency-disinfection-drinking-water\n\nVerification date: 2026-08-09."},"el":{"title":"Πόσιμο νερό: το διαυγές δεν σημαίνει ασφαλές","body":"Το νερό μπορεί να φαίνεται, να μυρίζει και να έχει φυσιολογική γεύση ενώ περιέχει παθογόνους μικροοργανισμούς ή χημικές ουσίες. Οι αισθήσεις βοηθούν να εντοπιστούν ορισμένα προφανή προβλήματα, αλλά δεν αποτελούν δοκιμή ασφάλειας.\n\n## Ιεράρχηση πηγών\nΠροτίμησε σφραγισμένο εμπορικό νερό ή δημόσια παροχή που η αρμόδια αρχή δηλώνει ασφαλή. Έπειτα χρησιμοποίησε νερό που αποθηκεύτηκε σωστά πριν το συμβάν. Αβέβαιες πηγές χρειάζονται μέθοδο επεξεργασίας κατάλληλη για τον ύποπτο κίνδυνο. Φίλτρο για ίζημα ή μικροοργανισμούς μπορεί να μην αφαιρεί διαλυμένα χημικά. Ο βρασμός καταστρέφει πολλούς παθογόνους οργανισμούς αλλά δεν αφαιρεί πολλές χημικές ουσίες και μπορεί να αυξήσει τη συγκέντρωση ορισμένων καθώς εξατμίζεται νερό.\n\n## Η ανακοίνωση καθορίζει την ενέργεια\nΟδηγία βρασμού, οδηγία «μην πίνετε» και οδηγία «μην χρησιμοποιείτε» δεν είναι το ίδιο. Κατέγραψε την ακριβή διατύπωση και την αρχή που την εξέδωσε. Μην μετατρέπεις από συνήθεια κάθε ανακοίνωση σε «βράσε το». Σε ύποπτη χημική ρύπανση, ο βρασμός μπορεί να είναι λανθασμένη αντίδραση.\n\n## Απότρεψε την επαναμόλυνση\nΗ επεξεργασία είναι μόνο η μισή διαδικασία. Φύλαξε το επεξεργασμένο νερό σε καθαρό, κλειστό δοχείο, χρησιμοποίησε καθαρό τρόπο άντλησης και μην βάζεις χέρια ή σκεύη μέσα στο κύριο απόθεμα. Σήμανε ώρα επεξεργασίας και παρτίδα όταν υπάρχουν πολλά δοχεία.\n\n## Ευάλωτα άτομα\nΒρέφη, εγκυμονούσες, ηλικιωμένοι και άτομα με εξασθενημένο ανοσοποιητικό μπορεί να υποστούν μεγαλύτερες συνέπειες. Όταν υπάρχει αυστηρότερη επίσημη οδηγία για ευάλωτο άτομο, αυτή υπερισχύει της γενικής οικιακής πρακτικής.\n\n## Πηγές επαλήθευσης\n- CDC — δημιουργία και αποθήκευση αποθέματος νερού: https://www.cdc.gov/water-emergency/about/how-to-create-and-store-an-emergency-water-supply.html\n- EPA — απολύμανση πόσιμου νερού σε έκτακτη ανάγκη: https://www.epa.gov/ground-water-and-drinking-water/emergency-disinfection-drinking-water\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":190,"en":{"title":"Home Canning: Botulism Risk and Research-Tested Methods","body":"Home-canned food can be a valuable shelf-stable reserve, but canning is not a place for improvising process time, pressure, jar size or recipe acidity. Low-acid foods can support botulism toxin production when processing is inadequate, and a contaminated jar may not look or smell spoiled.\n\n## Use a tested recipe exactly\nUse current recipes from a recognized research-based source such as the National Center for Home Food Preservation or USDA. Match food, preparation, jar size, canner type, processing time, pressure and altitude adjustments. Do not shorten a process because the food was “already hot,” the jar sealed, or a family recipe has “always worked.”\n\n## Water-bath and pressure canning are not interchangeable\nHigh-acid foods may use boiling-water canning when a tested recipe specifies it. Low-acid vegetables, meat, poultry and seafood generally require pressure canning under tested instructions. An electric multi-cooker is not automatically a validated pressure canner for a canning process.\n\n## Treat suspicious jars as hazardous\nBulging, leaking, spurting, cracked or unsealed containers are warning signs, but absence of those signs does not prove safety. Never taste food to decide whether botulism toxin is present. If a product was canned by an unknown or unverified method, do not “rescue” it by tasting or casual reheating. Follow public-health disposal instructions.\n\n## Keep a batch record\nRecord recipe/source, food, date, jar size, processing method/time/pressure and any altitude adjustment. A batch label makes later recalls or process mistakes traceable. Rotate stock and inspect seals before use.\n\n## Verification sources\n- National Center for Home Food Preservation: https://nchfp.uga.edu/\n- CDC — home-canned foods and botulism: https://www.cdc.gov/botulism/prevention/home-canned-foods.html\n\nVerification date: 2026-08-09."},"el":{"title":"Σπιτική κονσερβοποίηση: αλλαντίαση και ερευνητικά δοκιμασμένες μέθοδοι","body":"Τα σπιτικά κονσερβοποιημένα τρόφιμα μπορούν να αποτελέσουν πολύτιμο απόθεμα, όμως η κονσερβοποίηση δεν επιτρέπει αυτοσχεδιασμό στον χρόνο, την πίεση, το μέγεθος βάζου ή την οξύτητα της συνταγής. Τρόφιμα χαμηλής οξύτητας μπορούν να επιτρέψουν παραγωγή τοξίνης αλλαντίασης όταν η επεξεργασία είναι ανεπαρκής και ένα επικίνδυνο βάζο μπορεί να μη φαίνεται ούτε να μυρίζει χαλασμένο.\n\n## Ακολούθησε ακριβώς δοκιμασμένη συνταγή\nΧρησιμοποίησε σύγχρονες οδηγίες από αναγνωρισμένη ερευνητική πηγή, όπως το National Center for Home Food Preservation ή το USDA. Ταίριαξε τρόφιμο, προετοιμασία, μέγεθος βάζου, τύπο κονσερβοποιητή, χρόνο, πίεση και προσαρμογή υψομέτρου. Μην μειώνεις διαδικασία επειδή το φαγητό ήταν ήδη ζεστό, το καπάκι «έπιασε» ή μια οικογενειακή μέθοδος «δούλευε πάντα».\n\n## Υδατόλουτρο και κονσερβοποίηση υπό πίεση δεν είναι εναλλάξιμα\nΤρόφιμα υψηλής οξύτητας μπορούν να υποβάλλονται σε υδατόλουτρο όταν το προβλέπει δοκιμασμένη συνταγή. Λαχανικά χαμηλής οξύτητας, κρέας, πουλερικά και θαλασσινά γενικά απαιτούν κονσερβοποίηση υπό πίεση σύμφωνα με επαληθευμένες οδηγίες. Μια ηλεκτρική πολυσυσκευή μαγειρέματος δεν είναι αυτομάτως πιστοποιημένος κονσερβοποιητής πίεσης.\n\n## Ύποπτο βάζο σημαίνει κίνδυνος\nΦούσκωμα, διαρροή, εκτόξευση υγρού, ρωγμή ή χαλαρή σφράγιση είναι προειδοποιήσεις, όμως η απουσία τους δεν αποδεικνύει ασφάλεια. Μην δοκιμάζεις τρόφιμο για να ελέγξεις αν υπάρχει τοξίνη αλλαντίασης. Αν η μέθοδος παρασκευής είναι άγνωστη ή μη επαληθευμένη, μην προσπαθείς να το «σώσεις» με γεύση ή πρόχειρη αναθέρμανση. Ακολούθησε υγειονομικές οδηγίες διάθεσης.\n\n## Αρχείο παρτίδας\nΚατέγραψε συνταγή/πηγή, τρόφιμο, ημερομηνία, μέγεθος βάζου, μέθοδο, χρόνο/πίεση και προσαρμογή υψομέτρου. Η ετικέτα παρτίδας επιτρέπει ιχνηλάτηση λάθους ή ανάκλησης. Κάνε περιστροφή αποθέματος και έλεγχο σφράγισης πριν τη χρήση.\n\n## Πηγές επαλήθευσης\n- National Center for Home Food Preservation — τεκμηριωμένες οδηγίες συντήρησης τροφίμων: https://nchfp.uga.edu/\n- CDC — σπιτικές κονσέρβες και αλλαντίαση: https://www.cdc.gov/botulism/prevention/home-canned-foods.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":191,"en":{"title":"Wild Mushrooms and Foraging: Poisoning-Avoidance Rules","body":"Hunger and supply disruption can make wild food look like an easy reserve. The safest survival rule is that a plant or mushroom is not food merely because an app, photo, folklore test, animal behavior or one visual feature appears to identify it.\n\n## Identification must be stronger than resemblance\nSome toxic mushrooms and plants closely resemble edible species. Cooking, drying or freezing does not reliably make an unknown poisonous species safe. “Silver spoon,” color-change and insect/animal-eating myths are not reliable toxicity tests. If expert-level identification is not already a practiced skill, an emergency is a poor time to begin eating unknown species.\n\n## Separate learning specimens from food\nIf you collect specimens for identification, keep them physically separate from known food. Use a paper container/label where appropriate, record location and photographs, and wash hands/tools when plant sap or unknown mushrooms are handled. Children and pets should not have access to the collection.\n\n## If ingestion occurs\nDo not wait for symptoms before seeking poison/emergency advice when a potentially toxic species was eaten. Preserve a sample/photo if safe because identification can help treatment. Do not induce vomiting unless specifically instructed by a medical/poison professional. Different toxins can produce delayed symptoms, so feeling well immediately is not proof of safety.\n\n## Preparedness alternative\nBuild calories through shelf-stable staples, verified local crops and food-preservation skills before relying on wild foods. If foraging is part of your plan, learn a small number of locally distinctive species from qualified local experts during normal times and learn their dangerous look-alikes just as thoroughly.\n\n## Verification sources\n- Poison Control — mushroom poisoning information: https://www.poison.org/articles/wild-mushroom-warning\n- CDC — general poison prevention resources: https://www.cdc.gov/poisoning-prevention/about/index.html\n\nVerification date: 2026-08-09."},"el":{"title":"Άγρια μανιτάρια και συλλογή τροφής: κανόνες αποφυγής δηλητηρίασης","body":"Η πείνα και η διακοπή εφοδιασμού μπορούν να κάνουν την άγρια τροφή να φαίνεται εύκολη λύση. Ο ασφαλέστερος κανόνας είναι ότι ένα φυτό ή μανιτάρι δεν γίνεται τρόφιμο επειδή μια εφαρμογή, φωτογραφία, λαϊκό «τεστ», συμπεριφορά ζώου ή ένα μόνο οπτικό χαρακτηριστικό φαίνεται να το αναγνωρίζει.\n\n## Η ταυτοποίηση πρέπει να είναι ισχυρότερη από την ομοιότητα\nΟρισμένα τοξικά μανιτάρια και φυτά μοιάζουν πολύ με βρώσιμα είδη. Μαγείρεμα, ξήρανση ή κατάψυξη δεν καθιστούν αξιόπιστα ασφαλές ένα άγνωστο δηλητηριώδες είδος. Μύθοι με ασημένιο κουτάλι, αλλαγή χρώματος ή ζώα/έντομα που τρώνε το είδος δεν είναι αξιόπιστοι έλεγχοι. Αν η ταυτοποίηση δεν είναι ήδη εξασκημένη δεξιότητα υψηλού επιπέδου, μια κρίση είναι κακή στιγμή για πρώτη δοκιμή άγνωστου είδους.\n\n## Ξεχώρισε τα δείγματα από τα τρόφιμα\nΑν συλλέγεις δείγματα μόνο για ταυτοποίηση, κράτησέ τα φυσικά χωριστά από γνωστά τρόφιμα. Χρησιμοποίησε κατάλληλο χάρτινο δοχείο/ετικέτα, κατέγραψε θέση και φωτογραφίες και πλύνε χέρια ή εργαλεία μετά από άγνωστο φυτικό υλικό. Παιδιά και ζώα δεν πρέπει να έχουν πρόσβαση στη συλλογή.\n\n## Αν υπάρξει κατάποση\nΜην περιμένεις συμπτώματα πριν ζητήσεις τοξικολογική ή επείγουσα καθοδήγηση όταν καταναλώθηκε πιθανώς τοξικό είδος. Κράτησε δείγμα ή φωτογραφία αν είναι ασφαλές, επειδή η αναγνώριση μπορεί να βοηθήσει τη θεραπεία. Μην προκαλείς εμετό χωρίς συγκεκριμένη οδηγία επαγγελματία. Ορισμένες τοξίνες δίνουν καθυστερημένα συμπτώματα, άρα η αρχική καλή κατάσταση δεν αποδεικνύει ασφάλεια.\n\n## Καλύτερη προετοιμασία\nΔημιούργησε αποθέματα από τρόφιμα μακράς διάρκειας, γνωστές τοπικές καλλιέργειες και επαληθευμένες τεχνικές συντήρησης πριν βασιστείς σε άγρια τροφή. Αν η συλλογή είναι μέρος του σχεδίου, μάθε λίγα τοπικά, χαρακτηριστικά είδη από ειδικούς σε κανονικές συνθήκες και μελέτησε εξίσου προσεκτικά τα επικίνδυνα παρόμοιά τους.\n\n## Πηγές επαλήθευσης\n- Poison Control — δηλητηρίαση από άγρια μανιτάρια: https://www.poison.org/articles/wild-mushroom-warning\n- CDC — πρόληψη δηλητηριάσεων: https://www.cdc.gov/poisoning-prevention/about/index.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":192,"en":{"title":"Dry Staple Storage: Moisture, Pests, and Rotation","body":"Rice, pasta, oats, flour, legumes and similar staples can provide a large fraction of outage calories, but only if they remain dry, pest-free and actually usable with the water/fuel you have. A pantry full of food that requires long cooking can become a fuel problem.\n\n## Protect from moisture first\nStore dry foods in clean, food-grade, tightly closing containers appropriate to the product and planned storage period. Keep containers off damp floors and away from leaking walls. Condensation can develop when cold containers are repeatedly moved into warm humid air; inspect rather than assuming a sealed-looking bin is dry inside.\n\n## Detect pests early\nUse a first-in/first-out rotation and inspect packaging for holes, webbing, larvae, insects, rodent gnawing or droppings. Isolate a suspect package from the main pantry before opening it. Rodent contamination is a sanitation issue, not just lost calories.\n\n## Plan cooking energy and water\nGroup staples by cooking burden. Quick-cooking oats, couscous or precooked/dehydrated foods can reduce fuel demand. Dried beans may be calorie-efficient to store but require water and significant cooking unless soaked/pressure-cooked appropriately. Keep some ready-to-eat food for periods when cooking is unsafe or impossible.\n\n## Make the inventory operational\nRecord package count/weight, normal serving use, opening date and minimum reserve. Rotate what the household actually eats. Do not build the emergency menu around unfamiliar foods that someone cannot tolerate, prepare, chew or digest.\n\n## Source anchors\n- Ready.gov — emergency supply kit/food planning: https://www.ready.gov/kit\n- USDA FoodKeeper/food storage resources: https://www.foodsafety.gov/keep-food-safe/foodkeeper-app\n\nVerification date: 2026-08-09."},"el":{"title":"Αποθήκευση ξηρών βασικών τροφίμων: υγρασία, παράσιτα και περιστροφή","body":"Ρύζι, ζυμαρικά, βρώμη, αλεύρι, όσπρια και παρόμοια βασικά τρόφιμα μπορούν να δώσουν μεγάλο μέρος των θερμίδων μιας διακοπής, αλλά μόνο αν παραμείνουν στεγνά, χωρίς παράσιτα και μπορούν να μαγειρευτούν με το διαθέσιμο νερό και καύσιμο. Μια αποθήκη γεμάτη τρόφιμα που χρειάζονται πολύωρο μαγείρεμα μπορεί να μετατραπεί σε πρόβλημα καυσίμου.\n\n## Πρώτα προστασία από υγρασία\nΦύλαξε τα ξηρά τρόφιμα σε καθαρά δοχεία κατάλληλα για τρόφιμα, με καλή στεγανοποίηση ανάλογη με το προϊόν και τη διάρκεια αποθήκευσης. Μην τα αφήνεις σε υγρό δάπεδο ή δίπλα σε τοίχο που στάζει. Συμπύκνωση μπορεί να εμφανιστεί όταν κρύα δοχεία μεταφέρονται συχνά σε ζεστό, υγρό αέρα· κάνε πραγματική επιθεώρηση αντί να θεωρείς ότι ένα κλειστό δοχείο είναι στεγνό εσωτερικά.\n\n## Εντόπισε νωρίς τα παράσιτα\nΧρησιμοποίησε σειρά «πρώτο μέσα, πρώτο έξω» και έλεγχε για τρύπες, ιστούς, προνύμφες, έντομα, σημάδια τρωκτικών ή περιττώματα. Απομόνωσε ύποπτη συσκευασία πριν την ανοίξεις μέσα στην κύρια αποθήκη. Η μόλυνση από τρωκτικά είναι θέμα υγιεινής και όχι απλώς χαμένες θερμίδες.\n\n## Υπολόγισε νερό και ενέργεια μαγειρέματος\nΧώρισε τα αποθέματα με βάση το πόσο μαγείρεμα απαιτούν. Γρήγορη βρώμη, κουσκούς ή προμαγειρεμένες/αφυδατωμένες επιλογές μειώνουν την κατανάλωση καυσίμου. Τα ξηρά φασόλια αποθηκεύονται αποδοτικά αλλά χρειάζονται νερό και σημαντικό χρόνο εκτός αν χρησιμοποιείται κατάλληλη προετοιμασία. Κράτησε και έτοιμες προς κατανάλωση επιλογές για περιόδους χωρίς ασφαλές μαγείρεμα.\n\n## Επιχειρησιακή απογραφή\nΚατέγραψε αριθμό ή βάρος συσκευασιών, φυσιολογική κατανάλωση, ημερομηνία ανοίγματος και ελάχιστο απόθεμα. Περιστρέφε τρόφιμα που πράγματι τρώει το νοικοκυριό. Μην βασίζεις το σχέδιο σε άγνωστα τρόφιμα που κάποιο μέλος δεν μπορεί να ανεχθεί, να προετοιμάσει, να μασήσει ή να χωνέψει.\n\n## Πηγές αναφοράς\n- Ready.gov — απόθεμα έκτακτης ανάγκης και τρόφιμα: https://www.ready.gov/kit\n- USDA FoodKeeper και πόροι αποθήκευσης τροφίμων: https://www.foodsafety.gov/keep-food-safe/foodkeeper-app\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":193,"en":{"title":"Community Kitchen: Clean/Dirty Workflow and Allergen Control","body":"Shared cooking can stretch fuel, labor and equipment, but it also concentrates food-safety and allergy risks. Treat a community kitchen as a small operation with roles and flow, not as many households improvising on one table.\n\n## Draw the flow before cooking\nSeparate receiving, raw-food preparation, cooking, serving and dish/waste areas as far as the site allows. Keep raw animal products and their utensils away from ready-to-eat food. Assign handwashing access that does not require touching the potable-water dispensing spout with dirty hands.\n\n## Control time and temperature\nUse a food thermometer where relevant instead of judging doneness by color alone. Minimize the time perishable food remains in unsafe temperature conditions and follow current public-health guidance after refrigeration failure. If cold holding cannot be maintained, change the menu and batch size rather than pretending the cooler is a refrigerator.\n\n## Make allergens visible\nList major ingredients for each communal dish and keep the original package/label when possible. Use separate clean utensils/areas when an individual's allergy plan requires avoiding cross-contact. Do not promise that a meal is “allergen free” if the shared environment cannot support that claim.\n\n## Assign sanitation responsibility\nSomeone must own surface cleaning, dish flow, waste removal and water-batch status. A single dirty cloth moved everywhere can spread contamination. Establish which cloth/brush belongs to food-contact cleaning and which belongs to floors/waste.\n\n## Keep a simple meal log\nRecord date/time, dishes, source of high-risk ingredients, cold-storage status, cook/serve time and known allergy accommodations. If several people become ill, the log makes the exposure easier to reconstruct.\n\n## Verification sources\n- CDC — food safety during power outages and emergencies: https://www.cdc.gov/food-safety/communication-resources/eat-safe-food-after-a-power-outage.html\n- USDA/FoodSafety.gov — safe food handling: https://www.foodsafety.gov/keep-food-safe/4-steps-to-food-safety\n\nVerification date: 2026-08-09."},"el":{"title":"Κοινόχρηστη κουζίνα: ροή καθαρού/βρόμικου και έλεγχος αλλεργιογόνων","body":"Η κοινή κουζίνα μπορεί να εξοικονομήσει καύσιμο, εργασία και εξοπλισμό, αλλά συγκεντρώνει επίσης κινδύνους τροφικής ασφάλειας και αλλεργιών. Αντιμετώπισέ την ως μικρή οργανωμένη λειτουργία με ρόλους και ροή, όχι ως πολλά νοικοκυριά που αυτοσχεδιάζουν πάνω στο ίδιο τραπέζι.\n\n## Σχεδίασε τη ροή πριν το μαγείρεμα\nΧώρισε όσο επιτρέπει ο χώρος την παραλαβή, την προετοιμασία ωμών τροφίμων, το μαγείρεμα, το σερβίρισμα και τη ζώνη πλυσίματος/αποβλήτων. Κράτα ωμά ζωικά προϊόντα και τα εργαλεία τους μακριά από έτοιμα τρόφιμα. Η υγιεινή χεριών πρέπει να είναι διαθέσιμη χωρίς να αγγίζεται το στόμιο πόσιμου νερού με βρόμικα χέρια.\n\n## Έλεγξε χρόνο και θερμοκρασία\nΧρησιμοποίησε θερμόμετρο τροφίμων όπου χρειάζεται αντί να κρίνεις μόνο από το χρώμα. Μείωσε τον χρόνο που ευπαθή τρόφιμα μένουν σε μη ασφαλείς συνθήκες και ακολούθησε σύγχρονες υγειονομικές οδηγίες μετά από απώλεια ψύξης. Αν δεν μπορείς να διατηρήσεις ψυχρή αλυσίδα, άλλαξε μενού και μέγεθος παρτίδας αντί να θεωρείς το φορητό ψυγείο ισοδύναμο με κανονικό ψυγείο.\n\n## Κάνε τα αλλεργιογόνα ορατά\nΚατέγραψε βασικά συστατικά κάθε κοινόχρηστου πιάτου και κράτησε την αρχική συσκευασία όταν είναι δυνατό. Χρησιμοποίησε ξεχωριστά καθαρά εργαλεία ή χώρο όταν το ατομικό σχέδιο αλλεργίας απαιτεί αποφυγή διασταυρούμενης επαφής. Μην χαρακτηρίζεις γεύμα «χωρίς αλλεργιογόνα» όταν το περιβάλλον δεν επιτρέπει τέτοια εγγύηση.\n\n## Ανάθεσε την υγιεινή\nΈνα συγκεκριμένο άτομο πρέπει να έχει ευθύνη για επιφάνειες, πλύσιμο σκευών, απομάκρυνση αποβλήτων και κατάσταση παρτίδων νερού. Ένα μόνο βρόμικο πανί που χρησιμοποιείται παντού μπορεί να μεταφέρει ρύπανση. Ξεχώρισε υλικά για επιφάνειες τροφίμων από αυτά για δάπεδα και σκουπίδια.\n\n## Απλό ημερολόγιο γεύματος\nΚατέγραψε ημερομηνία/ώρα, φαγητά, προέλευση ευπαθών υλικών, κατάσταση ψύξης, ώρα μαγειρέματος/σερβιρίσματος και γνωστές προσαρμογές αλλεργιών. Αν αρρωστήσουν πολλά άτομα, το ημερολόγιο βοηθά να ανασυσταθεί η πιθανή έκθεση.\n\n## Πηγές επαλήθευσης\n- CDC — ασφάλεια τροφίμων σε διακοπές ρεύματος: https://www.cdc.gov/food-safety/communication-resources/eat-safe-food-after-a-power-outage.html\n- USDA/FoodSafety.gov — ασφαλής χειρισμός τροφίμων: https://www.foodsafety.gov/keep-food-safe/4-steps-to-food-safety\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":194,"en":{"title":"Infant and Child Feeding During Supply Disruption","body":"Infants and young children have less margin for unsafe water, incorrect formula preparation and prolonged food disruption. Household plans should protect the child's normal feeding method and caregiver instructions rather than inventing emergency substitutions.\n\n## Preserve the established plan\nFor breastfeeding families, support continued breastfeeding where possible by protecting the caregiver's safety, hydration, privacy and access to skilled support when problems occur. For formula-fed infants, maintain the exact type normally used unless a qualified clinician/public-health authority advises a change. Do not dilute formula to make it last longer.\n\n## Water safety is part of formula safety\nUse water that public-health guidance considers safe for infant feeding and follow the product/authority's preparation instructions. Clean hands and feeding equipment matter. In an emergency with unreliable water/sanitation, ready-to-feed liquid formula can reduce preparation-water risks when it is appropriate and available, but storage and individual clinical needs still matter.\n\n## Keep enough small equipment\nPlan clean feeding cups/bottles as appropriate, cleaning supplies, backup nipples/parts, a way to measure safely and enough product to bridge a realistic disruption. Record the child's normal schedule, allergies/intolerances, clinician contact and minimum reserve.\n\n## Watch for illness/dehydration\nVomiting, diarrhea, poor intake or fewer wet diapers can become serious more quickly in infants. Seek medical advice promptly rather than using improvised electrolyte recipes or adult medications.\n\n## Verification sources\n- CDC — infant and young child feeding in emergencies: https://www.cdc.gov/infant-feeding-emergencies/about/index.html\n- WHO — infant and young child feeding resources: https://www.who.int/health-topics/breastfeeding\n\nVerification date: 2026-08-09."},"el":{"title":"Σίτιση βρεφών και παιδιών σε διακοπή εφοδιασμού","body":"Τα βρέφη και τα μικρά παιδιά έχουν μικρότερα περιθώρια απέναντι σε μη ασφαλές νερό, λανθασμένη παρασκευή γάλακτος και παρατεταμένη διακοπή τροφής. Το οικιακό σχέδιο πρέπει να προστατεύει τον καθιερωμένο τρόπο σίτισης και τις οδηγίες φροντιστή αντί να εφευρίσκει υποκατάστατα μέσα στην κρίση.\n\n## Διατήρησε το υπάρχον σχέδιο\nΓια οικογένειες που θηλάζουν, υποστήριξε τη συνέχιση όπου είναι δυνατό προστατεύοντας την ασφάλεια, την ενυδάτωση, την ιδιωτικότητα του φροντιστή και την πρόσβαση σε εξειδικευμένη βοήθεια όταν υπάρχει πρόβλημα. Για βρέφη που τρέφονται με φόρμουλα, διατήρησε τον ίδιο τύπο που χρησιμοποιείται κανονικά εκτός αν επαγγελματίας υγείας ή δημόσια υγειονομική αρχή δώσει άλλη οδηγία. Μην αραιώνεις τη φόρμουλα για να διαρκέσει περισσότερο.\n\n## Η ασφάλεια νερού είναι μέρος της ασφάλειας σίτισης\nΧρησιμοποίησε νερό που η υγειονομική καθοδήγηση θεωρεί ασφαλές για βρεφική σίτιση και ακολούθησε ακριβώς τις οδηγίες προϊόντος και αρχών. Καθαρά χέρια και εξοπλισμός είναι κρίσιμα. Σε κρίση με αβέβαιο νερό/υγιεινή, έτοιμη προς χρήση υγρή φόρμουλα μπορεί να μειώσει κινδύνους προετοιμασίας όταν είναι κατάλληλη και διαθέσιμη, αλλά εξακολουθούν να ισχύουν όρια αποθήκευσης και ατομικές ιατρικές ανάγκες.\n\n## Αρκετός μικρός εξοπλισμός\nΠροέβλεψε κατάλληλα καθαρά κύπελλα ή μπιμπερό, καθαριστικά, εφεδρικές θηλές/εξαρτήματα, ασφαλή μέτρηση και αρκετή ποσότητα προϊόντος για ρεαλιστική διακοπή. Κατέγραψε συνήθη πρόγραμμα, αλλεργίες ή δυσανεξίες, επαγγελματία υγείας και ελάχιστο απόθεμα.\n\n## Παρακολούθησε ασθένεια και αφυδάτωση\nΕμετός, διάρροια, μειωμένη πρόσληψη ή λιγότερες βρεγμένες πάνες μπορούν να γίνουν σοβαρά γρηγορότερα στα βρέφη. Ζήτησε έγκαιρα ιατρική συμβουλή αντί να χρησιμοποιήσεις αυτοσχέδια διαλύματα ή φάρμακα ενηλίκων.\n\n## Πηγές επαλήθευσης\n- CDC — σίτιση βρεφών και μικρών παιδιών σε έκτακτες ανάγκες: https://www.cdc.gov/infant-feeding-emergencies/about/index.html\n- WHO — πόροι θηλασμού: https://www.who.int/health-topics/breastfeeding\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":195,"en":{"title":"Rationing Food: Calories, Protein, Special Diets, and Reserve Triggers","body":"Emergency rationing should reduce waste and match activity before it becomes arbitrary deprivation. The goal is to know how long food can support the group, which foods are medically important, and when the situation requires resupply or relocation.\n\n## Start from the people, not just calories\nRecord household size, ages, pregnancy/lactation, allergies, diabetes or other diet-sensitive conditions, texture/swallowing needs and typical activity. A single “calories per person” number cannot represent all of those needs. Use clinical diet plans where they exist and do not override them with a generic survival table.\n\n## Count usable food\nInventory food by portions/energy only if labels or reliable recipes make that meaningful. Subtract spoiled, contaminated or inaccessible food. Separate items that require large amounts of cooking water/fuel from ready-to-eat foods. Track protein and diet-specific staples, not only total calories.\n\n## Create decision thresholds\nDefine a minimum reserve that is not consumed under normal shelter-in-place operations. When forecasted coverage reaches the trigger, act: reduce waste, simplify menus, seek verified distribution, coordinate with neighbors or prepare relocation. Waiting until the final day's food removes choices.\n\n## Adjust work to the reserve\nHeavy unnecessary labor increases energy and water demand. During scarcity, organize tasks, avoid duplicated trips and shift strenuous work to safer temperatures. Rationing is partly demand management.\n\n## Avoid unsafe “stretching”\nDo not dilute infant formula, consume spoiled food, eat unknown plants or use foods that violate a person's serious allergy/medical restrictions simply to increase days on paper.\n\n## Source anchors\n- Ready.gov — emergency food planning: https://www.ready.gov/food\n- CDC — emergency food and water safety resources: https://www.cdc.gov/food-water-safety/about/index.html\n\nVerification date: 2026-08-09."},"el":{"title":"Διαχείριση τροφίμων: θερμίδες, πρωτεΐνη, ειδικές δίαιτες και όρια αποθέματος","body":"Η διαχείριση τροφίμων σε έκτακτη ανάγκη πρέπει πρώτα να μειώνει σπατάλη και περιττή κατανάλωση, όχι να μετατρέπεται σε αυθαίρετη στέρηση. Στόχος είναι να γνωρίζεις πόσο διαρκεί το απόθεμα, ποια τρόφιμα είναι ιατρικά σημαντικά και πότε χρειάζεται ανεφοδιασμός ή μετακίνηση.\n\n## Ξεκίνα από τους ανθρώπους και όχι μόνο από θερμίδες\nΚατέγραψε αριθμό ατόμων, ηλικίες, εγκυμοσύνη/θηλασμό, αλλεργίες, διαβήτη ή άλλες διατροφικά ευαίσθητες καταστάσεις, ανάγκες υφής/κατάποσης και συνηθισμένη δραστηριότητα. Ένας ενιαίος αριθμός «θερμίδων ανά άτομο» δεν περιγράφει όλα αυτά. Όπου υπάρχει κλινικό διαιτολόγιο, ακολούθησέ το και μην το αντικαθιστάς με γενικό πίνακα επιβίωσης.\n\n## Μέτρα το πραγματικά χρησιμοποιήσιμο απόθεμα\nΚατέγραψε μερίδες ή ενέργεια μόνο όταν ετικέτες ή αξιόπιστες συνταγές επιτρέπουν λογικό υπολογισμό. Αφαίρεσε χαλασμένα, μολυσμένα ή μη προσβάσιμα τρόφιμα. Ξεχώρισε όσα απαιτούν πολύ νερό/καύσιμο από τα έτοιμα. Παρακολούθησε πρωτεΐνη και ειδικά βασικά τρόφιμα, όχι μόνο συνολικές θερμίδες.\n\n## Όρια απόφασης\nΌρισε ελάχιστο απόθεμα που δεν καταναλώνεται σε φυσιολογική παραμονή στο σπίτι. Όταν η πρόβλεψη πλησιάζει το όριο, ενέργησε: μείωσε σπατάλη, απλοποίησε μενού, αναζήτησε επαληθευμένη διανομή, συνεργάσου με γείτονες ή προετοίμασε μετακίνηση. Η αναμονή μέχρι την τελευταία ημέρα αφαιρεί επιλογές.\n\n## Προσαρμογή εργασίας\nΒαριά περιττή εργασία αυξάνει ανάγκες σε ενέργεια και νερό. Οργάνωσε καθήκοντα, απέφυγε διπλές διαδρομές και μετέφερε απαιτητικές εργασίες σε ασφαλέστερες θερμοκρασίες. Η διαχείριση αποθέματος είναι και διαχείριση ζήτησης.\n\n## Μην «τεντώνεις» με επικίνδυνους τρόπους\nΜην αραιώνεις βρεφική φόρμουλα, μην τρως χαλασμένο φαγητό ή άγνωστα φυτά και μην παραβιάζεις σοβαρή αλλεργία ή ιατρικό περιορισμό απλώς για να αυξηθούν οι ημέρες στο χαρτί.\n\n## Πηγές αναφοράς\n- Ready.gov — προετοιμασία τροφίμων: https://www.ready.gov/food\n- CDC — ασφάλεια τροφίμων και νερού: https://www.cdc.gov/food-water-safety/about/index.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":196,"en":{"title":"Tarp Shelter: Weatherproofing and Structural Limits","body":"A tarp can block rain, wind and sun, but it is not a substitute for a structurally safe building when severe weather, falling debris, wildfire, flood or lightning hazards are present. Site selection is more important than a clever knot.\n\n## Choose the site before the shape\nAvoid dry stream channels, flood paths, unstable slopes, dead trees/branches, cliff/rockfall zones, shorelines exposed to surge, and places where vehicles cannot see you. Look uphill and upwind for hazards. In thunderstorms, a tarp does not make an exposed ridge or isolated tall-tree site safe.\n\n## Manage water\nPitch so rain runs away from the sleeping area. Keep the tarp edge from funneling water under the groundsheet. Do not dig drainage trenches where excavation is prohibited or would worsen erosion; choose naturally drained ground instead. Keep bedding insulated from ground moisture.\n\n## Manage wind load\nLower profiles and more anchor points generally reduce flapping and point loads. Use attachment methods that spread force instead of concentrating it on one fragile grommet. Inspect anchors as wind changes. Do not place heavy rocks or improvised spikes where a failure can launch them into people.\n\n## Ventilation and fire\nDo not seal a small tarp shelter around combustion appliances. Never operate a generator, charcoal device or fuel-burning stove inside or immediately adjacent to an enclosed shelter. Keep flames/sparks away from synthetic fabric.\n\n## Exit criteria\nIf water rises, anchors repeatedly fail, trees/structures become unstable, smoke/heat approaches or authorities order evacuation, abandon the shelter. Protecting the tarp is never the priority over moving people.\n\n## Source anchors\n- Ready.gov — severe weather/flood preparedness: https://www.ready.gov/\n- CDC — carbon monoxide and generator safety: https://www.cdc.gov/carbon-monoxide/about/index.html\n\nVerification date: 2026-08-09."},"el":{"title":"Καταφύγιο με tarp: στεγάνωση και δομικά όρια","body":"Ένα tarp μπορεί να κόψει βροχή, άνεμο και ήλιο, αλλά δεν αντικαθιστά ένα δομικά ασφαλές κτίριο όταν υπάρχουν έντονα καιρικά φαινόμενα, πτώσεις αντικειμένων, πυρκαγιά, πλημμύρα ή κεραυνός. Η επιλογή θέσης είναι σημαντικότερη από έναν έξυπνο κόμπο.\n\n## Πρώτα θέση, μετά σχήμα\nΑπόφυγε ξεροπόταμα, διαδρομές πλημμύρας, ασταθείς πλαγιές, νεκρά δέντρα/κλαδιά, ζώνες κατολίσθησης ή πτώσης βράχων, ακτές εκτεθειμένες σε κύμα και σημεία όπου οχήματα δεν μπορούν να σε δουν. Έλεγξε τι υπάρχει ανάντη και προς την κατεύθυνση του ανέμου. Σε καταιγίδα, ένα tarp δεν μετατρέπει κορυφογραμμή ή απομονωμένο ψηλό δέντρο σε ασφαλές σημείο.\n\n## Διαχείριση νερού\nΣτήσε κλίση ώστε η βροχή να φεύγει από τον χώρο ύπνου. Μην αφήνεις την άκρη να διοχετεύει νερό κάτω από το υπόστρωμα. Μην σκάβεις αυλάκια όπου απαγορεύεται ή προκαλείται διάβρωση· προτίμησε φυσικά καλά στραγγιζόμενο έδαφος. Μόνωσε τα στρώματα ύπνου από την υγρασία του εδάφους.\n\n## Φορτίο ανέμου\nΧαμηλότερο προφίλ και περισσότερα σημεία αγκύρωσης συνήθως μειώνουν το φτερούγισμα και τη συγκέντρωση δύναμης. Μοίρασε το φορτίο αντί να το βάζεις σε ένα αδύναμο κρίκο. Έλεγχε αγκυρώσεις όταν αλλάζει ο άνεμος. Μην χρησιμοποιείς βαριές πέτρες ή αιχμές με τρόπο που μπορεί να τις εκτοξεύσει σε αστοχία.\n\n## Αερισμός και φωτιά\nΜην κλείνεις μικρό καταφύγιο γύρω από συσκευή καύσης. Ποτέ γεννήτρια, κάρβουνο ή καυστήρας καυσίμου μέσα ή ακριβώς δίπλα σε κλειστό χώρο. Κράτα φλόγες και σπινθήρες μακριά από συνθετικό ύφασμα.\n\n## Πότε εγκαταλείπεις\nΑν ανεβαίνει το νερό, αποτυγχάνουν συνεχώς οι αγκυρώσεις, δέντρα/κατασκευές γίνονται ασταθή, πλησιάζει καπνός/θερμότητα ή υπάρχει εντολή εκκένωσης, άφησε το καταφύγιο. Η προστασία του υλικού δεν υπερισχύει ποτέ της μετακίνησης ανθρώπων.\n\n## Πηγές αναφοράς\n- Ready.gov — ακραία φαινόμενα και πλημμύρες: https://www.ready.gov/\n- CDC — μονοξείδιο άνθρακα και γεννήτριες: https://www.cdc.gov/carbon-monoxide/about/index.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":197,"en":{"title":"Cold Shelter: Condensation, Ventilation, and Moisture Control","body":"A cold shelter can become wet from the inside even when the roof does not leak. Breathing, cooking, drying clothes and warm bodies add moisture; when that vapor reaches a cold surface it can condense into water that wets insulation and reduces comfort/safety.\n\n## Keep wet and dry zones separate\nCreate an entry area for wet footwear and outer layers instead of bringing them directly into bedding. Store dry sleep clothing in a protected bag. If something must be dried, do it with ventilation and a safe heat source rather than sealing moisture into the sleeping area.\n\n## Ventilate deliberately\nMore sealing is not always better. Maintain ventilation appropriate to the shelter and heating equipment. Never block required vents on fuel-burning appliances or use outdoor combustion devices indoors. If carbon-monoxide alarms are available, place/maintain them according to manufacturer guidance; an alarm does not make unsafe combustion acceptable.\n\n## Protect insulation from compression and moisture\nInsulation under the body matters because compressed sleeping bags provide less insulation beneath you. Use a dry ground pad/barrier. Shake/dry insulation when conditions permit and keep spare dry layers protected from the condensation zone.\n\n## Manage people, not just temperature\nCheck for shivering, confusion, clumsiness, unusual sleepiness and wet clothing. Change wet clothing early. Do not wait for everyone to “feel cold enough” before adjusting layers or moving to a safer heated location.\n\n## Source anchors\n- CDC — cold weather/hypothermia resources: https://www.cdc.gov/winter-weather/about/index.html\n- Ready.gov — winter weather: https://www.ready.gov/winter-weather\n\nVerification date: 2026-08-09."},"el":{"title":"Κρύο καταφύγιο: συμπύκνωση, αερισμός και έλεγχος υγρασίας","body":"Ένα κρύο καταφύγιο μπορεί να βραχεί από μέσα ακόμη και χωρίς διαρροή στη στέγη. Αναπνοή, μαγείρεμα, στέγνωμα ρούχων και ζεστά σώματα προσθέτουν υγρασία· όταν οι υδρατμοί φτάσουν σε κρύα επιφάνεια συμπυκνώνονται και μπορούν να βρέξουν τη μόνωση.\n\n## Ξεχώρισε βρόμικη/υγρή από καθαρή/στεγνή ζώνη\nΔημιούργησε είσοδο για βρεγμένα παπούτσια και εξωτερικά ρούχα αντί να τα φέρνεις στα κλινοσκεπάσματα. Φύλαξε στεγνά ρούχα ύπνου σε προστατευμένη σακούλα. Αν κάτι πρέπει να στεγνώσει, χρειάζεται αερισμό και ασφαλή πηγή θερμότητας, όχι σφράγισμα της υγρασίας μέσα στον χώρο ύπνου.\n\n## Ελεγχόμενος αερισμός\nΠερισσότερο κλείσιμο δεν σημαίνει πάντα περισσότερη ασφάλεια. Διατήρησε αερισμό κατάλληλο για το καταφύγιο και το σύστημα θέρμανσης. Μην κλείνεις απαιτούμενους αεραγωγούς συσκευών καύσης και μην χρησιμοποιείς εξωτερικές συσκευές καύσης σε εσωτερικό χώρο. Αν υπάρχουν ανιχνευτές μονοξειδίου, τοποθέτησέ τους σύμφωνα με τον κατασκευαστή· ο ανιχνευτής δεν νομιμοποιεί μη ασφαλή καύση.\n\n## Προστάτευσε τη μόνωση\nΗ μόνωση κάτω από το σώμα είναι κρίσιμη επειδή ο υ
