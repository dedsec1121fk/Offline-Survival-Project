ωσε την εισαγωγή εξωτερικού αέρα όταν οι αρχές δίνουν οδηγία καταφυγής. Μην δημιουργείς όμως επικίνδυνη υπερθέρμανση, μονοξείδιο, πυρκαγιά ή αποτυχία ιατρικού εξοπλισμού εφαρμόζοντας μηχανικά έναν γενικό κανόνα. Αν το κτίριο γίνει μη ασφαλές για άλλο λόγο, ακολούθησε τις οδηγίες μετακίνησης των υπηρεσιών.\n\n## Η εκκένωση γίνεται όταν οι αρχές καθορίσουν χρόνο και διαδρομή\nΟι υπηρεσίες μπορεί αργότερα να ζητήσουν εκκένωση, έλεγχο επιμόλυνσης ή μετακίνηση σε καταφύγιο. Πάρε απαραίτητα φάρμακα, ταυτοποίηση, κρίσιμα έγγραφα, εξοπλισμό προσβασιμότητας και αναγκαία είδη ζώων. Χρησιμοποίησε τη διαδρομή που έχει δοθεί επίσημα· μια φαινομενικά συντομότερη διαδρομή μπορεί να περνά από επιβαρυμένη περιοχή.\n\n## Πηγές επαλήθευσης\n- CDC — ραδιολογικές έκτακτες ανάγκες, καταφύγιο και εκκένωση: https://www.cdc.gov/radiation-emergencies/\n- Ready.gov — ραδιολογικές έκτακτες ανάγκες: https://www.ready.gov/radiation\n- Τρέχουσες οδηγίες εθνικής/τοπικής πολιτικής προστασίας, δημόσιας υγείας, πυρηνικής ασφάλειας και υπηρεσιών έκτακτης ανάγκης.\n\nΕπαλήθευση έκδοσης: 2026-08-09."}},{"id":107,"en":{"title":"V7 source-verification register and maintenance method","body":"## Why this register exists\nAn offline survival library can remain readable for years while the official guidance behind it changes. V7 therefore treats sources as maintenance anchors rather than decorative citations. A chapter should state which authority controls the safety-critical claim, avoid copying long passages, and be rechecked before a future release changes numeric thresholds, medical instructions, evacuation behavior, or water-treatment procedures.\n\n## Primary public-health anchors\n**CDC** — disaster health, floodwater, wildfire smoke, chronic-disease continuity, infant feeding, radiation emergencies, food safety, vector exposure, and selected first-aid/public-health boundaries. Start at https://www.cdc.gov and prefer current topic pages over archived documents when both exist.\n\n**WHO** — emergency water/sanitation, risk communication, psychological first aid, community-health and broader international public-health principles. Start at https://www.who.int. WHO material is useful where country-neutral principles are needed, but local emergency orders still override a generic manual.\n\n## Drinking-water and environmental anchors\n**US EPA** — emergency drinking-water disinfection, private wells after flooding, water-system advisories, environmental contamination, and indoor/environmental recovery boundaries. Start at https://www.epa.gov. A water manual must distinguish biological contamination from chemical or radiological contamination; ordinary boiling/disinfection does not solve every hazard.\n\n## General preparedness and hazard anchors\n**Ready.gov / FEMA** — household planning, kits, sheltering, accessibility, communications, evacuation, power outage, winter/severe-weather and hazard-specific preparedness. Start at https://www.ready.gov.\n\n**National Weather Service / NOAA and USGS** — weather, lightning, flood, tsunami and geologic-hazard principles where relevant. Their role is hazard recognition and official alerting, not individualized medical treatment.\n\n## Greece-specific anchors\n**Greek Ministry for Climate Crisis and Civil Protection / General Secretariat for Civil Protection** — local protective actions for wildfire, earthquake, flood, severe weather, technological hazards and 112 alerting. Start at https://civilprotection.gov.gr. Greek official instructions, evacuation orders, closure notices and emergency messages take priority over stored generic guidance for an incident in Greece.\n\n**112 Greece / responsible local authorities** — emergency alerts and incident-specific instructions. Store the meaning of a message and the location/action it specifies; do not assume a previous event’s wording applies to a new one.\n\n## Clinical and equipment anchors\nFor prescription medicines, oxygen, CPAP/BiPAP, dialysis, diabetes technology, pregnancy, infant feeding problems, epilepsy rescue medicine, mobility devices or other individualized care, the controlling source is the person’s clinician plus current pharmacy/manufacturer/equipment instructions. A public preparedness page can identify the dependency; it cannot safely create a dose, device setting, or individualized treatment plan.\n\n## Verification workflow for future releases\n1. Identify every chapter that contains a numeric threshold, treatment/disinfection step, health escalation rule, or evacuation/shelter instruction.\n2. Open the current official source, not a search-result snippet or third-party summary.\n3. Record the source page title and review date in the maintenance notes.\n4. Compare the claim with the offline chapter; update only the affected passage.\n5. Mirror the conceptual change in English and Greek rather than translating words mechanically.\n6. Run translation, duplicate, sentence-repetition, Library-quality, structural, API, UI, and Deep Audit gates.\n7. If an official recommendation is ambiguous or equipment-specific, narrow the offline chapter instead of guessing.\n\n## Current-build verification date\nThe new safety-critical additions in this compendium were checked against current official pages available on 2026-08-09. A future release should re-verify them rather than treating that date as permanent approval."},"el":{"title":"Μητρώο επαλήθευσης πηγών και μέθοδος συντήρησης V7","body":"## Γιατί υπάρχει αυτό το μητρώο\nΜια offline βιβλιοθήκη επιβίωσης μπορεί να παραμένει αναγνώσιμη για χρόνια ενώ η επίσημη καθοδήγηση που τη στηρίζει αλλάζει. Η V7 αντιμετωπίζει τις πηγές ως σημεία συντήρησης και όχι ως διακοσμητικές παραπομπές. Κάθε κεφάλαιο πρέπει να δηλώνει ποια αρχή ελέγχει τον κρίσιμο ισχυρισμό, να αποφεύγει μεγάλα αντιγραμμένα αποσπάσματα και να επανελέγχεται πριν μια μελλοντική έκδοση αλλάξει αριθμητικά όρια, ιατρικές οδηγίες, συμπεριφορά εκκένωσης ή διαδικασίες επεξεργασίας νερού.\n\n## Κύριες πηγές δημόσιας υγείας\n**CDC** — υγεία σε καταστροφές, πλημμυρικά νερά, καπνός πυρκαγιάς, συνέχεια χρόνιων παθήσεων, σίτιση βρέφους, ραδιολογικές καταστάσεις, ασφάλεια τροφίμων, έκθεση σε έντομα/κρότωνες και επιλεγμένα όρια πρώτων βοηθειών. Αφετηρία: https://www.cdc.gov. Προτίμησε τρέχουσες θεματικές σελίδες αντί για αρχειοθετημένο υλικό όταν υπάρχουν και τα δύο.\n\n**WHO** — νερό και υγιεινή σε έκτακτες ανάγκες, επικοινωνία κινδύνου, ψυχολογικές πρώτες βοήθειες, κοινοτική υγεία και διεθνείς αρχές δημόσιας υγείας. Αφετηρία: https://www.who.int. Οι γενικές αρχές είναι χρήσιμες, αλλά οι τοπικές εντολές υπερισχύουν σε πραγματικό συμβάν.\n\n## Πηγές πόσιμου νερού και περιβάλλοντος\n**US EPA** — απολύμανση πόσιμου νερού σε έκτακτη ανάγκη, ιδιωτικά πηγάδια μετά από πλημμύρα, ειδοποιήσεις δικτύου, περιβαλλοντική μόλυνση και όρια αποκατάστασης. Αφετηρία: https://www.epa.gov. Ένα εγχειρίδιο νερού πρέπει να ξεχωρίζει τη βιολογική μόλυνση από χημική ή ραδιολογική· το συνηθισμένο βράσιμο/απολύμανση δεν λύνει κάθε κίνδυνο.\n\n## Γενική ετοιμότητα και κίνδυνοι\n**Ready.gov / FEMA** — οικιακό σχέδιο, κιτ, καταφυγή, προσβασιμότητα, επικοινωνίες, εκκένωση, διακοπή ρεύματος, χειμώνας/έντονα καιρικά φαινόμενα και θεματική ετοιμότητα. Αφετηρία: https://www.ready.gov.\n\n**National Weather Service / NOAA και USGS** — καιρός, κεραυνοί, πλημμύρες, τσουνάμι και γεωλογικοί κίνδυνοι όπου σχετίζονται. Ο ρόλος τους είναι αναγνώριση κινδύνου και επίσημη προειδοποίηση, όχι εξατομικευμένη ιατρική θεραπεία.\n\n## Πηγές ειδικά για την Ελλάδα\n**Υπουργείο Κλιματικής Κρίσης και Πολιτικής Προστασίας / Γενική Γραμματεία Πολιτικής Προστασίας** — τοπικές ενέργειες προστασίας για πυρκαγιά, σεισμό, πλημμύρα, έντονα καιρικά φαινόμενα, τεχνολογικούς κινδύνους και ειδοποιήσεις 112. Αφετηρία: https://civilprotection.gov.gr. Επίσημες ελληνικές εντολές, εκκενώσεις, κλεισίματα και μηνύματα έκτακτης ανάγκης έχουν προτεραιότητα έναντι γενικού αποθηκευμένου εγχειριδίου για συμβάν στην Ελλάδα.\n\n**112 Ελλάδας / αρμόδιες τοπικές αρχές** — ειδοποιήσεις και οδηγίες συγκεκριμένου συμβάντος. Κατέγραψε τι ακριβώς λέει το μήνυμα και σε ποια περιοχή/ενέργεια αναφέρεται· μην θεωρείς ότι το κείμενο προηγούμενου συμβάντος εφαρμόζεται στο επόμενο.\n\n## Κλινικές και τεχνικές πηγές\nΓια συνταγογραφούμενα φάρμακα, οξυγόνο, CPAP/BiPAP, κάθαρση, τεχνολογία διαβήτη, εγκυμοσύνη, δυσκολίες βρεφικής σίτισης, φάρμακο διάσωσης επιληψίας, βοηθήματα κινητικότητας ή άλλη εξατομικευμένη φροντίδα, η καθοριστική πηγή είναι ο θεράπων μαζί με τρέχουσες οδηγίες φαρμακείου, κατασκευαστή και εξοπλισμού. Μια δημόσια σελίδα ετοιμότητας αναγνωρίζει την εξάρτηση· δεν δημιουργεί ασφαλώς δόση, ρύθμιση συσκευής ή προσωπικό θεραπευτικό σχέδιο.\n\n## Ροή επαλήθευσης για μελλοντικές εκδόσεις\n1. Εντόπισε κάθε κεφάλαιο με αριθμητικό όριο, βήμα θεραπείας/απολύμανσης, κανόνα κλιμάκωσης υγείας ή οδηγία εκκένωσης/καταφυγής.\n2. Άνοιξε την τρέχουσα επίσημη πηγή και όχι απόσπασμα μηχανής αναζήτησης ή τρίτη σύνοψη.\n3. Κατέγραψε τίτλο σελίδας και ημερομηνία ελέγχου στις σημειώσεις συντήρησης.\n4. Σύγκρινε τον ισχυρισμό με το offline κεφάλαιο και άλλαξε μόνο το σχετικό τμήμα.\n5. Αντέγραψε την εννοιολογική αλλαγή σε Αγγλικά και Ελληνικά αντί για μηχανική μετάφραση λέξεων.\n6. Εκτέλεσε ελέγχους μετάφρασης, διπλοτύπων, επαναλαμβανόμενων προτάσεων, ποιότητας Βιβλιοθήκης, δομής, API, UI και Deep Audit.\n7. Αν η επίσημη σύσταση είναι ασαφής ή εξαρτάται από εξοπλισμό, περιόρισε το offline κεφάλαιο αντί να μαντέψεις.\n\n## Ημερομηνία επαλήθευσης τρέχουσας έκδοσης\nΟι νέες κρίσιμες για την ασφάλεια προσθήκες της συλλογής ελέγχθηκαν απέναντι σε τρέχουσες επίσημες σελίδες διαθέσιμες στις 2026-08-09. Μια μελλοντική έκδοση πρέπει να τις επανελέγξει και να μην αντιμετωπίζει αυτή την ημερομηνία ως μόνιμη έγκριση."}},{"id":108,"en":{"title":"Hygiene, Infection Control and a Temporary Sick Area","body":"## Reduce transmission before diagnosing\nDuring evacuation, outage or crowded sheltering, vomiting, diarrhea, cough and fever can spread quickly even when the cause is unknown. Focus first on clean hands, safe food/water, cleaning high-contact surfaces, practical separation of obviously ill people and timely medical evaluation for danger signs.\n\n## Put hand cleaning where it matters\nA handwashing station beside the temporary toilet, food area or caregiving space is more useful than one far away. Provide soap, safe water and drainage that does not contaminate feet or supplies. Sanitizer can be a temporary alternative in suitable situations but visibly dirty hands still need proper washing.\n\n## Give the ill person a defined zone\nWhen practical, assign one rest/sleep area, dedicated drinking vessel, waste container and regularly cleaned high-touch surfaces. Ventilate when appropriate for the incident; during smoke or chemical sheltering, opening windows may conflict with air-protection instructions.\n\n## Limit close contacts\nA single primary caregiver can reduce unnecessary exposure and improve consistency of fluids, medicines and symptom logging. The caregiver needs clear hand-hygiene and waste routines plus criteria for escalating to professional care.\n\n## Protect food operations\nSomeone with vomiting or diarrhea should not prepare communal food when another person can take over. Keep raw and ready-to-eat foods separate, use safe water and do not share cups, utensils, towels or toothbrushes.\n\n## Protect wounds\nKeep clean open wounds covered and away from floodwater or sewage. After exposure, wash appropriately with safe water and soap. Increasing redness, swelling, drainage, severe pain, fever or rapid deterioration needs medical evaluation.\n\n## Keep chemical cleaning within label boundaries\nFollow disinfectant labels, ventilate when the incident permits and never mix products such as bleach with ammonia or acids. Surface disinfectants are not skin treatments.\n\n## Log symptoms without creating a diagnosis engine\nRecord onset time, measured temperature if available, vomiting/diarrhea, breathing difficulty, intake concerns, rash, exposure history and medicines already taken. A timeline supports clinicians and handovers; the software should not convert it into self-diagnosis or dosing advice.\n\n## Escalate emergency signs\nSevere breathing difficulty, altered consciousness, shock, serious bleeding, worsening dehydration or rapidly spreading infection require professional help. Use local emergency services and clinical advice rather than extending household isolation beyond its safe limits.\n\nEvidence IDs: HYGIENE-1, SHELTER-IC-1, CLEANUP-1."},"el":{"title":"Υγιεινή, έλεγχος μετάδοσης και προσωρινός χώρος ασθενούς","body":"## Μείωσε τη μετάδοση πριν προσπαθήσεις να διαγνώσεις\nΣε εκκένωση, διακοπή ρεύματος ή συνωστισμό, έμετος, διάρροια, βήχας και πυρετός μπορούν να εξαπλωθούν γρήγορα ακόμη κι όταν η αιτία είναι άγνωστη. Εστίασε πρώτα σε καθαρά χέρια, ασφαλή τρόφιμα και νερό, καθαρισμό επιφανειών συχνής επαφής, πρακτικό διαχωρισμό εμφανώς ασθενών και έγκαιρη ιατρική αξιολόγηση για επικίνδυνα σημάδια.\n\n## Τοποθέτησε τον καθαρισμό χεριών εκεί που χρειάζεται\nΈνας σταθμός δίπλα στην προσωρινή τουαλέτα, την παρασκευή τροφής ή τη φροντίδα είναι χρησιμότερος από έναν μακρινό. Δώσε σαπούνι, ασφαλές νερό και απορροή που δεν μολύνει πόδια ή προμήθειες. Αντισηπτικό μπορεί να λειτουργήσει προσωρινά σε κατάλληλες συνθήκες, αλλά εμφανώς λερωμένα χέρια χρειάζονται σωστό πλύσιμο.\n\n## Δώσε στον ασθενή καθορισμένη ζώνη\nΌπου γίνεται, όρισε ένα σημείο ανάπαυσης και ύπνου, ατομικό ποτήρι, δοχείο αποβλήτων και επιφάνειες που καθαρίζονται συχνά. Αέρισε όταν είναι κατάλληλο για το συμβάν· σε καπνό ή χημικό καταφύγιο, το άνοιγμα παραθύρων μπορεί να συγκρούεται με τις οδηγίες προστασίας αέρα.\n\n## Περιόρισε τις στενές επαφές\nΈνας κύριος φροντιστής μπορεί να μειώσει άσκοπη έκθεση και να κάνει πιο συνεπή υγρά, φάρμακα και καταγραφή συμπτωμάτων. Χρειάζεται σαφή ρουτίνα χεριών και αποβλήτων και κριτήρια κλιμάκωσης σε επαγγελματική φροντίδα.\n\n## Προστάτευσε τη λειτουργία τροφίμων\nΆτομο με έμετο ή διάρροια δεν πρέπει να ετοιμάζει κοινό φαγητό όταν μπορεί να αναλάβει άλλος. Χώρισε ωμά από έτοιμα τρόφιμα, χρησιμοποίησε ασφαλές νερό και μην μοιράζεστε ποτήρια, σκεύη, πετσέτες ή οδοντόβουρτσες.\n\n## Προστάτευσε τραύματα\nΚράτησε καθαρά ανοιχτά τραύματα καλυμμένα και μακριά από πλημμυρικό νερό ή λύματα. Μετά από έκθεση, καθάρισε κατάλληλα με ασφαλές νερό και σαπούνι. Αυξανόμενη ερυθρότητα, οίδημα, έκκριση, έντονος πόνος, πυρετός ή γρήγορη επιδείνωση χρειάζονται ιατρική αξιολόγηση.\n\n## Κράτησε τα καθαριστικά μέσα στα όρια της ετικέτας\nΑκολούθησε τις οδηγίες απολυμαντικού, αέρισε όταν το επιτρέπει το συμβάν και μην αναμειγνύεις προϊόντα όπως χλωρίνη με αμμωνία ή οξέα. Τα απολυμαντικά επιφανειών δεν είναι θεραπεία για το δέρμα.\n\n## Κατέγραψε συμπτώματα χωρίς να δημιουργήσεις μηχανή διάγνωσης\nΣημείωσε ώρα έναρξης, θερμοκρασία αν μετρήθηκε, έμετο ή διάρροια, δυσκολία αναπνοής, προβλήματα πρόσληψης υγρών, εξάνθημα, πιθανή έκθεση και φάρμακα που ήδη λήφθηκαν. Το χρονολόγιο βοηθά κλινικούς και αλλαγές βάρδιας· το λογισμικό δεν πρέπει να το μετατρέπει σε αυτοδιάγνωση ή δοσολογία.\n\n## Κλιμάκωσε τα επείγοντα σημάδια\nΣοβαρή δυσκολία αναπνοής, διαταραχή συνείδησης, καταπληξία, σοβαρή αιμορραγία, επιδεινούμενη αφυδάτωση ή γρήγορη εξάπλωση λοίμωξης απαιτούν επαγγελματική βοήθεια. Χρησιμοποίησε τις τοπικές υπηρεσίες και κλινική συμβουλή αντί να παρατείνεις οικιακή απομόνωση πέρα από τα ασφαλή όρια.\n\nΚωδικοί τεκμηρίωσης: HYGIENE-1, SHELTER-IC-1, CLEANUP-1."}},{"id":109,"en":{"title":"Older Adults: Continuity, Isolation and Evacuation Timing","body":"## Plan around actual function\nOlder adults vary widely in mobility, cognition, hearing, medicine dependence, temperature tolerance and social support. Record the person's real dependencies rather than treating age as a diagnosis.\n\n## Identify hidden infrastructure dependencies\nHigh-rise residents can lose access when elevators fail. Upper floors may lose water if pumps stop. Powered beds, stair lifts, building entry systems and remote alarms can also fail. Add these dependencies to the risk board.\n\n## Prevent isolation from becoming invisibility\nSet regular check-in times with more than one contact when practical. A missed check-in should trigger a defined sequence rather than vague concern. Keep a printed contact card because a dead or locked phone hides its address book.\n\n## Move medicines and sensory aids together\nPack medicines with glasses, hearing aids, batteries, dentures/care products, mobility aids and written instructions. A medicine bag without the ability to hear instructions or reach the toilet is incomplete.\n\n## Use earlier relocation triggers\nWaiting until heat, cold, smoke or stair access becomes intolerable makes movement harder. People with limited mobility or medical dependence may benefit from conservative, earlier relocation thresholds consistent with official guidance.\n\n## Preserve autonomy\nUse clear written or visual instructions, repeat critical facts calmly and confirm understanding. Support decision-making without automatically transferring control to younger relatives.\n\n## Verify destination capability\nCheck accessible toilets, sleeping arrangements, power/refrigeration and any needed care. Bring the person's own mobility device when feasible. A roof and electricity do not automatically make a destination accessible.\n\n## Monitor temperature and hydration risk\nOlder adults can be more vulnerable to temperature extremes and some medicines affect heat response. Do not change medicines without clinical guidance. Relocate if safe indoor temperature cannot be maintained.\n\n## Reassess the home after return\nNew trip hazards, broken rails, elevator outages or disrupted services can make a previously manageable home unsafe. Inspect the actual route between bed, toilet, kitchen and exit.\n\nEvidence IDs: READY-OLDER-1, HEAT-MED-1, ACCESS-1."},"el":{"title":"Ηλικιωμένοι: συνέχεια, απομόνωση και χρόνος εκκένωσης","body":"## Σχεδίασε γύρω από την πραγματική λειτουργία\nΟι ηλικιωμένοι διαφέρουν πολύ σε κινητικότητα, γνωστική κατάσταση, ακοή, εξάρτηση από φάρμακα, ανοχή θερμοκρασίας και κοινωνική υποστήριξη. Κατέγραψε τις πραγματικές εξαρτήσεις αντί να αντιμετωπίζεις την ηλικία σαν διάγνωση.\n\n## Εντόπισε κρυφές εξαρτήσεις υποδομής\nΚάτοικοι πολυώροφων κτιρίων μπορεί να χάσουν πρόσβαση όταν σταματήσει ο ανελκυστήρας. Οι πάνω όροφοι μπορεί να χάσουν νερό όταν σταματήσουν αντλίες. Ηλεκτρικά κρεβάτια, αναβατόρια, ηλεκτρονική είσοδος και απομακρυσμένοι συναγερμοί μπορούν επίσης να αποτύχουν. Πρόσθεσε αυτές τις εξαρτήσεις στον πίνακα κινδύνων.\n\n## Μην αφήσεις την απομόνωση να γίνει αορατότητα\nΌρισε σταθερές ώρες επικοινωνίας με περισσότερες από μία επαφές όπου είναι πρακτικό. Μια χαμένη επικοινωνία πρέπει να ξεκινά συγκεκριμένη ακολουθία και όχι αόριστη ανησυχία. Κράτησε έντυπη κάρτα επαφών επειδή ένα άδειο ή κλειδωμένο τηλέφωνο κρύβει τον κατάλογο.\n\n## Μετέφερε φάρμακα και αισθητηριακά βοηθήματα μαζί\nΠάρε φάρμακα μαζί με γυαλιά, ακουστικά, μπαταρίες, οδοντοστοιχίες ή υλικά φροντίδας, βοηθήματα κινητικότητας και γραπτές οδηγίες. Μια τσάντα φαρμάκων χωρίς δυνατότητα ακρόασης οδηγιών ή πρόσβασης στην τουαλέτα είναι ελλιπής.\n\n## Χρησιμοποίησε νωρίτερα κριτήρια μετακίνησης\nΗ αναμονή μέχρι ζέστη, κρύο, καπνός ή σκάλες να γίνουν ανυπόφορα δυσκολεύει τη μετακίνηση. Περιορισμένη κινητικότητα ή ιατρική εξάρτηση μπορεί να απαιτούν πιο συντηρητική και έγκαιρη μετακίνηση σε συμφωνία με επίσημες οδηγίες.\n\n## Διατήρησε την αυτονομία\nΧρησιμοποίησε καθαρές γραπτές ή οπτικές οδηγίες, επανάλαβε ήρεμα κρίσιμα γεγονότα και επιβεβαίωσε κατανόηση. Υποστήριξε τη λήψη αποφάσεων χωρίς να μεταφέρεις αυτόματα τον έλεγχο σε νεότερους συγγενείς.\n\n## Επιβεβαίωσε τις δυνατότητες του προορισμού\nΈλεγξε προσβάσιμες τουαλέτες, χώρο ύπνου, ρεύμα ή ψύξη και τυχόν αναγκαία φροντίδα. Πάρε το προσωπικό βοήθημα κινητικότητας όπου γίνεται. Στέγη και ηλεκτρισμός δεν κάνουν αυτομάτως έναν χώρο προσβάσιμο.\n\n## Παρακολούθησε θερμοκρασία και κίνδυνο αφυδάτωσης\nΟι ηλικιωμένοι μπορεί να είναι πιο ευάλωτοι σε ακραίες θερμοκρασίες και ορισμένα φάρμακα επηρεάζουν την απόκριση στη ζέστη. Μην αλλάζεις φάρμακα χωρίς κλινική οδηγία. Μετακινήσου αν δεν μπορεί να διατηρηθεί ασφαλής εσωτερική θερμοκρασία.\n\n## Επανεκτίμησε το σπίτι μετά την επιστροφή\nΝέα εμπόδια, σπασμένα κιγκλιδώματα, ανελκυστήρας εκτός λειτουργίας ή διακοπές υπηρεσιών μπορούν να κάνουν μη ασφαλές ένα σπίτι που πριν ήταν διαχειρίσιμο. Έλεγξε την πραγματική διαδρομή μεταξύ κρεβατιού, τουαλέτας, κουζίνας και εξόδου.\n\nΚωδικοί τεκμηρίωσης: READY-OLDER-1, HEAT-MED-1, ACCESS-1."}},{"id":110,"en":{"title":"Cooking Without Grid Power: Fire, Fuel and Carbon Monoxide Boundaries","body":"## Choose equipment by safe location\nCamping stoves, grills and generators can create carbon monoxide and fire hazards when brought indoors, into garages or near openings. Use combustion equipment only in the environment specified by its manufacturer and official fire-safety guidance.\n\n## Do not improvise household backfeed\nUsing an outdoor portable burner is different from feeding a home's wiring through a receptacle. Generator connection to household wiring requires an appropriate transfer arrangement and competent installation/use. Keep generators outdoors and well away from windows, doors and vents.\n\n## Stabilize the cooking area\nUse a stable noncombustible surface away from dry vegetation, children, animals and flammable liquids. Keep a clear path around boiling water and fuel. Outdoor flames may be prohibited or unsafe during wildfire restrictions.\n\n## Handle fuel deliberately\nUse approved containers and the correct fuel. Do not refuel hot equipment, and keep spare fuel away from ignition and living spaces. Never place fuel in drink bottles.\n\n## Reduce energy demand through meal design\nPrioritize foods requiring little or no cooking during prolonged outages. Coordinate with cold-chain triage so perishable foods are handled safely. Batch cooking only helps if cooked food can subsequently be stored safely.\n\n## Keep food hygiene separate from fuel handling\nUse safe water, clean hands/surfaces and separate raw from ready-to-eat food. Never prepare food in the same dirty zone used for fuel or waste.\n\n## Treat CO alarms as protection, not permission\nA working carbon-monoxide alarm is an additional layer, not permission to run unsafe equipment indoors. If it alarms or exposure is suspected, move to fresh air and seek emergency guidance.\n\n## Cool equipment before storage\nShut down according to instructions and allow equipment, ash and coals to cool in a safe location. Never bring burning charcoal indoors for heat.\n\n## Keep a no-flame food option\nReady-to-eat shelf-stable meals prevent pressure to use unsafe combustion when weather, restrictions, injury or lack of outdoor space makes cooking unsafe.\n\nEvidence IDs: POWER-1, FIRE-CO-1, FOOD-1."},"el":{"title":"Μαγείρεμα χωρίς δίκτυο ρεύματος: όρια φωτιάς, καυσίμου και μονοξειδίου","body":"## Επίλεξε εξοπλισμό με βάση τον ασφαλή χώρο\nΦορητές εστίες, ψησταριές και γεννήτριες μπορούν να δημιουργήσουν μονοξείδιο και πυρκαγιά όταν χρησιμοποιούνται μέσα, σε γκαράζ ή κοντά σε ανοίγματα. Χρησιμοποίησε συσκευή καύσης μόνο στο περιβάλλον που προβλέπει ο κατασκευαστής και οι επίσημες οδηγίες πυρασφάλειας.\n\n## Μην αυτοσχεδιάζεις τροφοδότηση της οικιακής εγκατάστασης\nΗ σωστή χρήση εξωτερικής εστίας είναι διαφορετικό ζήτημα από την τροφοδότηση καλωδίωσης σπιτιού μέσω πρίζας. Η σύνδεση γεννήτριας στην εγκατάσταση απαιτεί κατάλληλη μεταγωγή και αρμόδια εγκατάσταση ή χρήση. Κράτησε γεννήτριες έξω και μακριά από παράθυρα, πόρτες και αεραγωγούς.\n\n## Σταθεροποίησε τη ζώνη μαγειρέματος\nΧρησιμοποίησε σταθερή μη καύσιμη επιφάνεια μακριά από ξερή βλάστηση, παιδιά, ζώα και εύφλεκτα υγρά. Κράτησε ελεύθερη διαδρομή γύρω από βραστό νερό και καύσιμα. Η εξωτερική φλόγα μπορεί να είναι απαγορευμένη ή επικίνδυνη σε περιορισμούς πυρκαγιάς.\n\n## Χειρίσου το καύσιμο συνειδητά\nΧρησιμοποίησε εγκεκριμένα δοχεία και το σωστό καύσιμο. Μην ανεφοδιάζεις ζεστό εξοπλισμό και κράτησε το εφεδρικό καύσιμο μακριά από ανάφλεξη και χώρους διαβίωσης. Μην βάζεις ποτέ καύσιμο σε μπουκάλι ποτού.\n\n## Μείωσε την ενεργειακή απαίτηση μέσω του μενού\nΔώσε προτεραιότητα σε τρόφιμα που χρειάζονται λίγο ή καθόλου μαγείρεμα σε παρατεταμένη διακοπή. Συντόνισε με τον έλεγχο ψυκτικής αλυσίδας ώστε τα ευπαθή τρόφιμα να χειρίζονται με ασφάλεια. Το ομαδικό μαγείρεμα βοηθά μόνο αν το μαγειρεμένο φαγητό μπορεί μετά να αποθηκευτεί σωστά.\n\n## Χώρισε την υγιεινή τροφίμων από τα καύσιμα\nΧρησιμοποίησε ασφαλές νερό, καθαρά χέρια και επιφάνειες και χώρισε ωμά από έτοιμα τρόφιμα. Μην ετοιμάζεις φαγητό στην ίδια βρώμικη ζώνη όπου χειρίζεσαι καύσιμα ή απόβλητα.\n\n## Ο ανιχνευτής μονοξειδίου είναι προστασία, όχι άδεια\nΈνας λειτουργικός ανιχνευτής είναι πρόσθετο επίπεδο και όχι άδεια λειτουργίας επικίνδυνης συσκευής μέσα. Αν ενεργοποιηθεί ή υπάρχει υποψία έκθεσης, βγες σε καθαρό αέρα και ζήτησε επείγουσα καθοδήγηση.\n\n## Άφησε τον εξοπλισμό να κρυώσει πριν αποθήκευση\nΚλείσε σύμφωνα με τις οδηγίες και άφησε συσκευή, στάχτη και κάρβουνα να κρυώσουν σε ασφαλές σημείο. Μην φέρνεις αναμμένα κάρβουνα μέσα για θέρμανση.\n\n## Κράτησε επιλογή τροφής χωρίς φλόγα\nΈτοιμα τρόφιμα μακράς διάρκειας αποτρέπουν την πίεση για επικίνδυνη καύση όταν καιρός, περιορισμοί, τραυματισμός ή έλλειψη εξωτερικού χώρου κάνουν το μαγείρεμα μη ασφαλές.\n\nΚωδικοί τεκμηρίωσης: POWER-1, FIRE-CO-1, FOOD-1."}},{"id":111,"en":{"title":"Emergency Water Quantity, Allocation and Conservation","body":"## Use categories, not one magic number\nWater demand includes drinking, food preparation, medicines, infant care, hand hygiene, minimal personal hygiene, pets and sometimes sanitation. Climate, illness, pregnancy, workload and infrastructure change requirements. Planning figures are useful context, not a universal medical prescription.\n\n## Protect potable water first\nSeparate drinking-quality water from water reserved for flushing or cleaning. Use clearly different containers and labels so the last treated water is not spent on a task that can use lower-grade water when officially suitable.\n\n## Count occupants and days explicitly\nEnter actual people, animals and planning horizon. Visitors or displaced relatives immediately change endurance. A three-day reserve for two people is not a three-day reserve for six.\n\n## Discount inaccessible volume\nContainers do not always drain fully, sediment may be discarded, and powered pumps can make tank water inaccessible during an outage. Test how stored water is actually withdrawn without electricity.\n\n## Track batches and sources\nRecord collection date, source, treatment, container, quantity and status. If a source is later found contaminated, traceability helps isolate affected batches without discarding everything or unknowingly continuing use.\n\n## Conserve high-volume uses before drinking\nDelay laundry, long showers, unnecessary cleaning and nonessential flushing before reducing appropriate drinking. Conservation should remove waste, not create dehydration.\n\n## Heat and illness change demand\nHigh temperatures, hard work, fever, vomiting and diarrhea can increase fluid needs and medical risk. Do not use a rigid ration schedule to deny water to someone who clinically needs more.\n\n## Match treatment to the contaminant\nBoiling and chemical disinfection target many microbes but do not remove dissolved salts, fuels or many chemical contaminants. Filters have specific performance limits. Suspected chemical contamination calls for an alternative safe source and official guidance.\n\n## Set resupply triggers\nDefine a minimum potable reserve and initiate resupply or relocation before it is reached. Waiting for the final bottle removes time and route options.\n\nEvidence IDs: WASH-1, WATER-1, WATER-2, WATER-3."},"el":{"title":"Ποσότητα νερού έκτακτης ανάγκης, κατανομή και εξοικονόμηση","body":"## Χρησιμοποίησε κατηγορίες και όχι έναν «μαγικό» αριθμό\nΗ ανάγκη νερού περιλαμβάνει πόση, παρασκευή τροφής, φάρμακα, βρέφη, καθαρά χέρια, ελάχιστη προσωπική υγιεινή, ζώα και μερικές φορές αποχέτευση. Κλίμα, ασθένεια, εγκυμοσύνη, εργασία και υποδομή αλλάζουν τις ανάγκες. Οι τιμές σχεδιασμού είναι χρήσιμο πλαίσιο και όχι καθολική ιατρική συνταγή.\n\n## Προστάτευσε πρώτα το πόσιμο νερό\nΧώρισε νερό πόσης από νερό που προορίζεται για έκπλυση ή καθαρισμό. Χρησιμοποίησε σαφώς διαφορετικά δοχεία και ετικέτες ώστε το τελευταίο επεξεργασμένο νερό να μην καταναλωθεί σε εργασία που μπορεί να γίνει με χαμηλότερης ποιότητας νερό όταν αυτό επιτρέπεται.\n\n## Μέτρησε ρητά άτομα και ημέρες\nΒάλε τον πραγματικό αριθμό ανθρώπων, ζώων και τον χρονικό ορίζοντα. Επισκέπτες ή μετακινημένοι συγγενείς αλλάζουν αμέσως την αυτονομία. Απόθεμα τριών ημερών για δύο άτομα δεν είναι τριών ημερών για έξι.\n\n## Αφαίρεσε τον μη προσβάσιμο όγκο\nΤα δοχεία δεν αδειάζουν πάντα πλήρως, ίζημα μπορεί να απορρίπτεται και ηλεκτρικές αντλίες μπορούν να κάνουν το νερό δεξαμενής μη προσβάσιμο σε διακοπή. Δοκίμασε πώς πραγματικά παίρνεις το αποθηκευμένο νερό χωρίς ρεύμα.\n\n## Παρακολούθησε παρτίδες και πηγές\nΚατέγραψε ημερομηνία συλλογής, πηγή, επεξεργασία, δοχείο, ποσότητα και κατάσταση. Αν μια πηγή αργότερα κριθεί μολυσμένη, η ιχνηλασιμότητα βοηθά να απομονωθούν οι επηρεαζόμενες παρτίδες χωρίς να απορριφθούν όλα ή να συνεχιστεί άθελα η χρήση τους.\n\n## Εξοικονόμησε πρώτα τις χρήσεις μεγάλου όγκου\nΚαθυστέρησε πλύσιμο ρούχων, μεγάλα ντους, μη απαραίτητο καθάρισμα και άσκοπη έκπλυση πριν μειώσεις την κατάλληλη πόση. Η εξοικονόμηση πρέπει να αφαιρεί σπατάλη και όχι να δημιουργεί αφυδάτωση.\n\n## Ζέστη και ασθένεια αλλάζουν τη ζήτηση\nΥψηλές θερμοκρασίες, σκληρή εργασία, πυρετός, έμετος και διάρροια μπορούν να αυξήσουν ανάγκες και ιατρικό κίνδυνο. Μην χρησιμοποιείς άκαμπτη κατανομή για να στερήσεις νερό από άτομο που κλινικά χρειάζεται περισσότερο.\n\n## Ταίριαξε την επεξεργασία με τον ρύπο\nΒράσιμο και χημική απολύμανση στοχεύουν πολλούς μικροοργανισμούς αλλά δεν αφαιρούν διαλυμένα άλατα, καύσιμα ή πολλές χημικές ουσίες. Τα φίλτρα έχουν συγκεκριμένα όρια. Υποψία χημικής ρύπανσης απαιτεί άλλη ασφαλή πηγή και επίσημη καθοδήγηση.\n\n## Όρισε όριο επανατροφοδοσίας\nΚαθόρισε ελάχιστη εφεδρεία πόσιμου νερού και ξεκίνησε επανατροφοδοσία ή μετακίνηση πριν τη φτάσεις. Η αναμονή μέχρι το τελευταίο μπουκάλι αφαιρεί χρόνο και επιλογές διαδρομής.\n\nΚωδικοί τεκμηρίωσης: WASH-1, WATER-1, WATER-2, WATER-3."}},{"id":112,"en":{"title":"Blackout movement and emergency lighting: prevent injuries before restoring convenience","body":"## Treat darkness as an immediate hazard\nA sudden outage changes a familiar room into an obstacle field. Stop movement for a moment, account for people, and determine whether there is smoke, fire, structural damage, flooding or another reason to evacuate. If the building is otherwise safe, bring light to people before sending people to search for light. Children, older adults, anyone with impaired vision or balance, and anyone using mobility equipment should not be expected to navigate an unlit route alone.\n\n## Build lighting in layers\nKeep a small light where people sleep, a second light near the main exit, and a third independent light with the emergency supplies. Headlamps are useful when both hands are needed; area lanterns are better for a shared room; a low-output light can preserve batteries during a long outage. Avoid making one rechargeable device the only source. Record battery type and keep compatible spares or a charging method that does not depend on the failed mains supply.\n\n## Protect the route, not every room\nPrioritize the path between sleeping areas, toilet, water, exits, medical equipment and the main gathering point. Remove trip hazards, close unused doors, keep stairs clear and mark level changes. A bright light pointed into someone’s eyes can make adaptation worse, so illuminate walking surfaces rather than faces. Do not run extension cables across the emergency route merely to obtain more light.\n\n## Open flame is not a normal lighting plan\nCandles and improvised flames add a fire hazard exactly when alarms, water supply or response may be impaired. Prefer battery lighting. If an open flame is unavoidable for a separate essential task, it requires continuous adult supervision, a stable noncombustible location and a clear extinguishing method; it should never be left while people sleep.\n\n## Preserve night vision and battery endurance\nUse the lowest useful output. Assign one light to the active work area instead of turning on every device. Keep one fully charged light reserved for evacuation or medical tasks. If the outage may last through the night, log which lights are charged, which cells are partly used and which charging sources remain available.\n\n## Restore safely\nWhen power returns, do not assume every dark area is normal. Check for water near electrical equipment, damaged fixtures, unusual heat, smoke or repeated tripping. Rebuild the lighting reserve after the incident: recharge, replace depleted cells, return lights to their assigned locations and record any route that proved difficult in darkness.\n\nEvidence IDs: READY-KIT-1, READY-PLAN-1, GR-GENERAL-1."},"el":{"title":"Κίνηση σε διακοπή ρεύματος και φωτισμός ανάγκης: πρόλαβε τους τραυματισμούς πριν από την άνεση","body":"## Αντιμετώπισε το σκοτάδι ως άμεσο κίνδυνο\nΜια ξαφνική διακοπή μετατρέπει έναν γνώριμο χώρο σε διαδρομή με εμπόδια. Σταμάτησε για λίγο την κίνηση, επιβεβαίωσε πού βρίσκονται οι άνθρωποι και έλεγξε αν υπάρχει καπνός, φωτιά, δομική ζημιά, πλημμύρα ή άλλος λόγος άμεσης εκκένωσης. Αν το κτίριο είναι κατά τα άλλα ασφαλές, πήγαινε το φως στους ανθρώπους αντί να στέλνεις ανθρώπους να ψάξουν μέσα στο σκοτάδι. Παιδιά, ηλικιωμένοι, άτομα με μειωμένη όραση ή ισορροπία και χρήστες βοηθημάτων κινητικότητας δεν πρέπει να διασχίζουν μόνοι τους σκοτεινές διαδρομές.\n\n## Χτίσε εφεδρεία φωτισμού σε επίπεδα\nΚράτα ένα μικρό φως κοντά στα σημεία ύπνου, δεύτερο κοντά στην κύρια έξοδο και τρίτο ανεξάρτητο μέσα στα εφόδια έκτακτης ανάγκης. Ο φακός κεφαλής βοηθά όταν χρειάζονται και τα δύο χέρια, ένα φανάρι φωτίζει καλύτερα κοινό χώρο και μια χαμηλή σκάλα φωτεινότητας εξοικονομεί μπαταρία σε πολύωρη διακοπή. Μην κάνεις μία μόνο επαναφορτιζόμενη συσκευή τη μοναδική πηγή. Κατέγραψε τον τύπο μπαταρίας και κράτα συμβατές εφεδρείες ή τρόπο φόρτισης που δεν εξαρτάται από το δίκτυο.\n\n## Προστάτευσε τη διαδρομή, όχι κάθε δωμάτιο\nΠροτεραιότητα έχουν οι διαδρομές μεταξύ χώρων ύπνου, τουαλέτας, νερού, εξόδων, ιατρικού εξοπλισμού και κύριου σημείου συγκέντρωσης. Απομάκρυνε αντικείμενα που προκαλούν πτώση, κλείσε πόρτες χώρων που δεν χρειάζονται, κράτησε τις σκάλες ελεύθερες και σημείωσε αλλαγές επιπέδου. Πολύ δυνατό φως στα μάτια δυσκολεύει την προσαρμογή στο σκοτάδι, γι’ αυτό φώτιζε το δάπεδο και τα σημεία πορείας. Μην περνάς καλώδια τροφοδοσίας πάνω από τη διαδρομή διαφυγής μόνο και μόνο για περισσότερο φως.\n\n## Η γυμνή φλόγα δεν είναι κανονικό σχέδιο φωτισμού\nΚεριά και αυτοσχέδιες φλόγες προσθέτουν κίνδυνο πυρκαγιάς ακριβώς όταν συναγερμοί, νερό ή υπηρεσίες μπορεί να έχουν μειωμένη λειτουργία. Προτίμησε φωτισμό με μπαταρίες. Αν για άλλη απαραίτητη εργασία απαιτείται φλόγα, χρειάζεται συνεχής επίβλεψη ενήλικα, σταθερή άκαυστη επιφάνεια και έτοιμος τρόπος κατάσβεσης· ποτέ δεν αφήνεται όταν οι άνθρωποι κοιμούνται.\n\n## Διατήρησε νυχτερινή όραση και αυτονομία\nΧρησιμοποίησε τη χαμηλότερη ένταση που επαρκεί. Φώτισε την ενεργή θέση εργασίας αντί να ενεργοποιείς όλες τις συσκευές. Κράτα ένα πλήρως φορτισμένο φως δεσμευμένο για εκκένωση ή ιατρικές ανάγκες. Αν η διακοπή περάσει στη νύχτα, σημείωσε ποια φώτα είναι φορτισμένα, ποιες μπαταρίες έχουν χρησιμοποιηθεί και ποιες πηγές φόρτισης απομένουν.\n\n## Επαναφορά με έλεγχο\nΌταν επιστρέψει το ρεύμα, μην θεωρήσεις κάθε σκοτεινό σημείο φυσιολογικό. Έλεγξε για νερό κοντά σε ηλεκτρικό εξοπλισμό, κατεστραμμένα φωτιστικά, ασυνήθιστη θερμότητα, καπνό ή επαναλαμβανόμενη πτώση προστασίας. Μετά το συμβάν φόρτισε ξανά τις συσκευές, αντικατάστησε εξαντλημένες μπαταρίες, επέστρεψε τα φώτα στις προκαθορισμένες θέσεις και κατέγραψε διαδρομές που αποδείχθηκαν δύσκολες στο σκοτάδι.\n\nΚωδικοί τεκμηρίωσης: READY-KIT-1, READY-PLAN-1, GR-GENERAL-1."}},{"id":113,"en":{"title":"Smoke and carbon-monoxide alarms during outages: keep warning systems independent","body":"## An outage can increase the need for alarms\nLoss of mains power often leads households to use generators, fuel-burning heaters, fireplaces or alternative cooking equipment. Those choices can introduce carbon monoxide or fire risk. A power failure is therefore the wrong time to discover that every alarm depended on the same circuit or that backup batteries were never replaced.\n\n## Inventory every warning device\nWalk through the home and record smoke alarms, carbon-monoxide alarms and any combined units. Note location, power source, backup battery type, test date and replacement/end-of-life indication. Follow the device manufacturer’s instructions for testing and replacement; alarm lifetimes and signals are model-specific. Do not silence an alarm because the emergency is inconvenient—identify the cause and move to safety.\n\n## Keep carbon-monoxide sources outside the living envelope\nPortable generators and other fuel-burning engines must not be operated inside homes, garages or other enclosed/partly enclosed spaces. Exhaust can enter through openings. CDC emergency guidance emphasizes that carbon monoxide cannot be seen or smelled and can cause severe illness or death. Equipment placement must follow current manufacturer and local safety instructions, and an operating CO alarm is a backup warning—not permission to place an engine closer.\n\n## Respond to an alarm, not to your guess\nIf a CO alarm activates or people develop concerning symptoms in a setting where combustion equipment is running, move to fresh air and contact emergency services/qualified guidance. Do not re-enter simply because the alarm stops outside. For a smoke alarm, investigate only when this can be done without entering smoke or delaying evacuation; fire escape comes before saving property.\n\n## Outage inspection\nAfter a long outage, check that alarms still show normal status and that batteries were not borrowed for another device. Restore any removed battery immediately. If a detector was exposed to water, heat, heavy smoke, impact or contamination, follow manufacturer replacement guidance rather than assuming a successful button test proves full function.\n\n## Link this to the household power plan\nMark alarm batteries as protected stock. Keep the alarm type and replacement date in the maintenance register. During drills, make sure everyone can recognize the alarm sound and knows the outdoor meeting point. A household with backup electricity but no reliable warning system has not solved its outage risk.\n\nEvidence IDs: CDC-CO-1, READY-FIRE-1, READY-PLAN-1."},"el":{"title":"Ανιχνευτές καπνού και μονοξειδίου του άνθρακα σε διακοπή: κράτησε την προειδοποίηση ανεξάρτητη","body":"## Η διακοπή μπορεί να αυξήσει την ανάγκη για συναγερμούς\nΗ απώλεια ηλεκτρικού ρεύματος συχνά οδηγεί σε χρήση γεννήτριας, συσκευών καύσης, τζακιού ή εναλλακτικού εξοπλισμού μαγειρέματος. Αυτές οι επιλογές μπορούν να δημιουργήσουν κίνδυνο μονοξειδίου του άνθρακα ή πυρκαγιάς. Η διακοπή είναι επομένως η χειρότερη στιγμή για να ανακαλύψεις ότι όλοι οι ανιχνευτές εξαρτώνταν από το ίδιο κύκλωμα ή ότι οι εφεδρικές μπαταρίες δεν αντικαταστάθηκαν ποτέ.\n\n## Κατέγραψε κάθε συσκευή προειδοποίησης\nΈλεγξε όλο το σπίτι και σημείωσε ανιχνευτές καπνού, μονοξειδίου και συνδυασμένες συσκευές. Γράψε θέση, τρόπο τροφοδοσίας, τύπο εφεδρικής μπαταρίας, ημερομηνία δοκιμής και ένδειξη αντικατάστασης ή λήξης ζωής. Ακολούθησε τις οδηγίες του κατασκευαστή για δοκιμή και αντικατάσταση, επειδή η διάρκεια ζωής και τα σήματα διαφέρουν ανά μοντέλο. Μην απενεργοποιείς συναγερμό επειδή το συμβάν είναι ενοχλητικό· απομακρύνσου και εξακρίβωσε την αιτία με ασφάλεια.\n\n## Κράτησε τις πηγές μονοξειδίου έξω από τον χώρο διαβίωσης\nΦορητές γεννήτριες και άλλοι κινητήρες καύσης δεν λειτουργούν μέσα σε κατοικίες, γκαράζ ή άλλους κλειστούς ή μερικώς κλειστούς χώρους. Τα καυσαέρια μπορούν να εισέλθουν από ανοίγματα. Οι οδηγίες έκτακτης ανάγκης του CDC επισημαίνουν ότι το μονοξείδιο δεν φαίνεται και δεν μυρίζει και μπορεί να προκαλέσει βαριά νόσηση ή θάνατο. Η τοποθέτηση εξοπλισμού πρέπει να ακολουθεί τις τρέχουσες οδηγίες κατασκευαστή και τοπικής ασφάλειας· ένας ενεργός ανιχνευτής είναι εφεδρική προειδοποίηση, όχι άδεια για πιο επικίνδυνη τοποθέτηση.\n\n## Αντέδρασε στον συναγερμό, όχι στην υπόθεσή σου\nΑν ενεργοποιηθεί ανιχνευτής μονοξειδίου ή εμφανιστούν ανησυχητικά συμπτώματα ενώ λειτουργεί εξοπλισμός καύσης, μετακινήσου σε καθαρό αέρα και επικοινώνησε με τις υπηρεσίες έκτακτης ανάγκης ή αρμόδιο επαγγελματία. Μην επιστρέψεις επειδή απλώς σταμάτησε να ακούγεται έξω. Σε συναγερμό καπνού, διερεύνηση γίνεται μόνο αν δεν απαιτεί είσοδο σε καπνό ή καθυστέρηση της εκκένωσης· η διαφυγή προηγείται της περιουσίας.\n\n## Έλεγχος μετά τη διακοπή\nΜετά από πολύωρη διακοπή, επιβεβαίωσε ότι οι ανιχνευτές δείχνουν κανονική κατάσταση και ότι οι μπαταρίες τους δεν αφαιρέθηκαν για άλλη χρήση. Επανέφερε αμέσως οποιαδήποτε μπαταρία αφαιρέθηκε. Αν συσκευή εκτέθηκε σε νερό, υψηλή θερμότητα, πολύ καπνό, κρούση ή ρύπανση, ακολούθησε τις οδηγίες αντικατάστασης του κατασκευαστή αντί να θεωρήσεις ότι ένα επιτυχημένο πάτημα δοκιμής αποδεικνύει πλήρη λειτουργία.\n\n## Σύνδεσέ το με το σχέδιο ισχύος\nΧαρακτήρισε τις μπαταρίες συναγερμών ως δεσμευμένο απόθεμα. Κατέγραψε τύπο και ημερομηνία αντικατάστασης στο πρόγραμμα συντήρησης. Στις ασκήσεις, όλοι πρέπει να αναγνωρίζουν τον ήχο και να γνωρίζουν το εξωτερικό σημείο συνάντησης. Νοικοκυριό με εφεδρικό ρεύμα αλλά χωρίς αξιόπιστη προειδοποίηση δεν έχει λύσει τον κίνδυνο της διακοπής.\n\nΚωδικοί τεκμηρίωσης: CDC-CO-1, READY-FIRE-1, READY-PLAN-1."}},{"id":114,"en":{"title":"Temporary power, cords and load boundaries: avoid turning an outage into an electrical incident","body":"## Start with the load, not with the available socket\nList the devices that actually need power and their rated input. Separate life/safety or communications loads from comfort loads. The v6 Power Operations ledger can calculate energy demand, but it cannot determine whether a particular cord, outlet, inverter or circuit is safe for that load. Use manufacturer ratings and qualified electrical guidance for that decision.\n\n## Do not improvise building wiring\nAn extension cord is temporary equipment, not a replacement for fixed wiring. Do not route cords through standing water, across door pinch points, under rugs where damage can be hidden, or through an evacuation path where they create a trip hazard. Do not modify plugs, defeat grounding features, or connect a generator to household wiring through an improvised backfeed. Generator connection to building circuits requires approved equipment and competent installation.\n\n## Inspect before energizing\nReject cords with crushed jackets, exposed conductors, heat damage, loose ends or signs of previous arcing. Keep connections dry and protected from traffic. Outdoor use requires equipment rated for the environment. If a plug, connector or cable becomes unusually warm, smells burnt, sparks or repeatedly trips protection, disconnect the load and investigate instead of increasing the fuse/breaker rating or bypassing protection.\n\n## Capacity is a system property\nThe smallest-rated component in the chain matters. A power station with adequate wattage does not make a light-duty cord suitable for a high-current appliance. Starting surges can also be much larger than normal running draw. Keep a written load list and add equipment one item at a time after the source is stable; this makes overloads easier to identify and preserves reserve for critical equipment.\n\n## Keep combustion and electricity risks separate\nA generator solves an electrical supply problem but introduces fuel, exhaust, heat and noise hazards. It must remain in a location that complies with current safety/manufacturer rules and must never be moved indoors because rain, theft or cable length is inconvenient. Plan weather protection and cable routing before the outage rather than during it.\n\n## Close the temporary system deliberately\nWhen normal power returns, remove temporary cords instead of allowing them to become permanent. Inspect plugs and connectors for heat damage, recharge portable sources in accordance with their instructions, and record any component that approached its limit. Replace damaged equipment before the next incident.\n\nEvidence IDs: POWER-1, CDC-CO-1, READY-PLAN-1."},"el":{"title":"Προσωρινή τροφοδοσία, καλώδια και όρια φορτίου: μην μετατρέψεις τη διακοπή σε ηλεκτρικό συμβάν","body":"## Ξεκίνα από το φορτίο και όχι από την διαθέσιμη πρίζα\nΚατέγραψε τις συσκευές που πραγματικά χρειάζονται ρεύμα και την ονομαστική τους κατανάλωση. Ξεχώρισε φορτία ασφάλειας, υγείας ή επικοινωνιών από φορτία άνεσης. Το σύστημα Power Operations μπορεί να υπολογίζει ενεργειακή ζήτηση, αλλά δεν μπορεί να αποφασίσει αν συγκεκριμένο καλώδιο, πρίζα, μετατροπέας ή κύκλωμα είναι ασφαλές για αυτό το φορτίο. Για αυτή την απόφαση ισχύουν οι προδιαγραφές του κατασκευαστή και η αρμόδια ηλεκτρολογική καθοδήγηση.\n\n## Μην αυτοσχεδιάζεις στην καλωδίωση του κτιρίου\nΈνα καλώδιο προέκτασης είναι προσωρινός εξοπλισμός και όχι υποκατάστατο μόνιμης εγκατάστασης. Μην το περνάς μέσα από στάσιμο νερό, από σημεία όπου πόρτες μπορούν να το συνθλίψουν, κάτω από χαλιά που κρύβουν ζημιές ή πάνω σε διαδρομή διαφυγής. Μην τροποποιείς φις, μην καταργείς γείωση και μην τροφοδοτείς την εγκατάσταση από γεννήτρια με αυτοσχέδια αντίστροφη σύνδεση. Σύνδεση γεννήτριας σε κυκλώματα κτιρίου απαιτεί εγκεκριμένο εξοπλισμό και αρμόδια εγκατάσταση.\n\n## Επιθεώρηση πριν από την ενεργοποίηση\nΑπόρριψε καλώδιο με συνθλιμμένο περίβλημα, ορατούς αγωγούς, σημάδια υπερθέρμανσης, χαλαρά άκρα ή ίχνη ηλεκτρικού τόξου. Κράτησε τις ενώσεις στεγνές και μακριά από κυκλοφορία. Για εξωτερικό χώρο απαιτείται εξοπλισμός κατάλληλος για το περιβάλλον. Αν φις, σύνδεσμος ή καλώδιο ζεσταίνεται ασυνήθιστα, μυρίζει καμένο, σπινθηρίζει ή ενεργοποιεί επανειλημμένα προστασία, αποσύνδεσε το φορτίο και διερεύνησε· μην αυξάνεις ασφάλεια και μην παρακάμπτεις προστατευτικά μέσα.\n\n## Η ικανότητα αφορά ολόκληρη την αλυσίδα\nΤο εξάρτημα με τη μικρότερη επιτρεπόμενη ισχύ μπορεί να καθορίζει το όριο. Μια ισχυρή φορητή πηγή δεν κάνει ένα ελαφρύ καλώδιο κατάλληλο για συσκευή μεγάλης κατανάλωσης. Τα ρεύματα εκκίνησης μπορεί επίσης να είναι πολύ υψηλότερα από την κανονική λειτουργία. Κράτησε γραπτό κατάλογο φορτίων και πρόσθεσε συσκευές μία-μία αφού σταθεροποιηθεί η πηγή, ώστε να εντοπίζεται ευκολότερα η υπερφόρτωση και να μένει εφεδρεία για κρίσιμες ανάγκες.\n\n## Διαχώρισε τον κίνδυνο καύσης από τον ηλεκτρικό κίνδυνο\nΗ γεννήτρια λύνει πρόβλημα τροφοδοσίας αλλά προσθέτει καύσιμο, καυσαέρια, θερμότητα και θόρυβο. Πρέπει να παραμένει σε θέση συμβατή με τις τρέχουσες οδηγίες ασφάλειας και του κατασκευαστή και να μην μεταφέρεται ποτέ σε κλειστό χώρο επειδή βρέχει, υπάρχει κίνδυνος κλοπής ή το καλώδιο είναι κοντό. Προγραμμάτισε προστασία από καιρό και όδευση καλωδίων πριν από τη διακοπή.\n\n## Κλείσε το προσωρινό σύστημα συνειδητά\nΌταν επιστρέψει η κανονική παροχή, αφαίρεσε τις προσωρινές προεκτάσεις αντί να τις αφήσεις να γίνουν μόνιμη εγκατάσταση. Έλεγξε φις και συνδέσεις για θερμική ζημιά, φόρτισε τις φορητές πηγές σύμφωνα με τις οδηγίες τους και κατέγραψε οποιοδήποτε εξάρτημα πλησίασε τα όριά του. Κατεστραμμένος εξοπλισμός αντικαθίσταται πριν από το επόμενο συμβάν.\n\nΚωδικοί τεκμηρίωσης: POWER-1, CDC-CO-1, READY-PLAN-1."}},{"id":115,"en":{"title":"Portable batteries and power banks: make stored energy auditable","body":"## Capacity labels are planning inputs, not promises\nRecord each power bank or battery station by model, rated energy/capacity, output types, maximum output, charger requirement and date last tested. Real usable energy is lower than the printed cell capacity because conversion, temperature, age and device charging losses consume part of the reserve. Build margin into endurance calculations instead of planning to the final percent.\n\n## Give each device a job\nA small power bank may be assigned to one phone; a larger station may be reserved for radios, lighting or approved medical equipment. Labeling prevents a high-priority reserve from being emptied for entertainment. Where several people share identical packs, number them and rotate through them deliberately so one remains untouched as a reserve.\n\n## Store and charge within product limits\nLithium batteries can be damaged by heat, physical impact, water, incorrect chargers or unsafe charging environments. Follow the manufacturer’s temperature and charging instructions. Do not charge a swollen, punctured, leaking or unusually hot pack. Isolate damaged units away from combustible materials and obtain appropriate disposal guidance; do not keep using them because they still produce power.\n\n## Track energy, not just indicator bars\nFor longer incidents, note starting percentage, important loads supplied and ending percentage. If the device provides watt-hour data, use it. Otherwise build an empirical record from repeated normal use. A four-bar indicator is too coarse for deciding whether a communications reserve will last another night.\n\n## Plan charging windows\nMatch charging to the best available source: mains when restored, vehicle when operating for legitimate transport needs, or a compatible solar/DC source. Avoid running a combustion engine solely inside or adjacent to occupied space for charging. If solar is used, protect equipment from water and trip hazards and keep the setup within manufacturer electrical limits.\n\n## Retirement criteria matter\nA pack that self-discharges rapidly, shuts down under modest load, has damaged connectors or has experienced swelling/impact belongs in review, not in the emergency reserve. Record retirement/replacement so the readiness inventory reflects equipment that can actually be trusted.\n\nEvidence IDs: READY-KIT-1, POWER-1, CDC-CO-1."},"el":{"title":"Φορητές μπαταρίες και συσσωρευτές ισχύος: κάνε την αποθηκευμένη ενέργεια ελέγξιμη","body":"## Η ονομαστική χωρητικότητα είναι στοιχείο σχεδιασμού και όχι υπόσχεση\nΚατέγραψε κάθε φορητό συσσωρευτή με μοντέλο, ονομαστική ενέργεια ή χωρητικότητα, εξόδους, μέγιστη ισχύ, απαιτούμενο φορτιστή και ημερομηνία τελευταίας δοκιμής. Η πραγματικά διαθέσιμη ενέργεια είναι μικρότερη από την τυπωμένη χωρητικότητα λόγω μετατροπών, θερμοκρασίας, γήρανσης και απωλειών φόρτισης. Βάλε περιθώριο στους υπολογισμούς αυτονομίας αντί να σχεδιάζεις μέχρι το τελευταίο ποσοστό.\n\n## Ανάθεσε ρόλο σε κάθε συσκευή\nΈνας μικρός συσσωρευτής μπορεί να προορίζεται για ένα τηλέφωνο, ενώ μεγαλύτερη μονάδα μπορεί να δεσμεύεται για ραδιόφωνα, φωτισμό ή εγκεκριμένο ιατρικό εξοπλισμό. Η σήμανση εμποδίζει να αδειάσει εφεδρεία υψηλής προτεραιότητας για ψυχαγωγία. Αν υπάρχουν πολλές ίδιες μονάδες, αρίθμησέ τες και χρησιμοποίησέ τες με σειρά ώστε μία να παραμένει πραγματικά ανέγγιχτη εφεδρεία.\n\n## Αποθήκευση και φόρτιση μέσα στα όρια του προϊόντος\nΟι μπαταρίες λιθίου μπορούν να υποστούν ζημιά από θερμότητα, κρούση, νερό, λάθος φορτιστή ή ακατάλληλο χώρο φόρτισης. Ακολούθησε τα όρια θερμοκρασίας και φόρτισης του κατασκευαστή. Μην φορτίζεις διογκωμένη, τρυπημένη, διαρρέουσα ή ασυνήθιστα θερμή μονάδα. Απομόνωσε κατεστραμμένο εξοπλισμό μακριά από καύσιμα υλικά και ζήτησε κατάλληλη καθοδήγηση απόρριψης· μην συνεχίζεις τη χρήση επειδή εξακολουθεί να δίνει ρεύμα.\n\n## Μέτρα ενέργεια και όχι μόνο εικονίδια\nΣε μεγαλύτερο συμβάν, σημείωσε αρχικό ποσοστό, σημαντικά φορτία που τροφοδοτήθηκαν και τελικό ποσοστό. Αν η συσκευή εμφανίζει βατώρες, χρησιμοποίησε αυτά τα δεδομένα. Διαφορετικά δημιούργησε εμπειρικό ιστορικό από επαναλαμβανόμενη κανονική χρήση. Ένας δείκτης τεσσάρων γραμμών είναι πολύ αδρός για να αποφασίσεις αν η εφεδρεία επικοινωνιών θα αντέξει άλλη μία νύχτα.\n\n## Προγραμμάτισε παράθυρα φόρτισης\nΣύνδεσε τη φόρτιση με την καλύτερη διαθέσιμη πηγή: δίκτυο όταν επιστρέψει, όχημα όταν ήδη λειτουργεί για πραγματική μετακίνηση ή συμβατή ηλιακή/συνεχή πηγή. Μην λειτουργείς κινητήρα καύσης μέσα ή δίπλα σε κατειλημμένο χώρο μόνο για φόρτιση. Αν χρησιμοποιείται ηλιακή πηγή, προστάτευσε εξοπλισμό από νερό και εμπόδια και μείνε μέσα στα ηλεκτρικά όρια του κατασκευαστή.\n\n## Χρειάζονται κριτήρια απόσυρσης\nΜονάδα που αυτοεκφορτίζεται γρήγορα, σβήνει με μικρό φορτίο, έχει κατεστραμμένους συνδέσμους ή έχει διογκωθεί/χτυπηθεί μπαίνει σε επανέλεγχο και όχι στο απόθεμα ανάγκης. Κατέγραψε απόσυρση και αντικατάσταση ώστε η ετοιμότητα να βασίζεται σε εξοπλισμό που μπορεί πράγματι να χρησιμοποιηθεί.\n\nΚωδικοί τεκμηρίωσης: READY-KIT-1, POWER-1, CDC-CO-1."}},{"id":116,"en":{"title":"Refrigerator and freezer temperature log: replace guesswork with evidence","body":"## Prepare before the outage\nKeep an appliance thermometer in the refrigerator and freezer where it can be read quickly when power returns. Know which foods are perishable and which can tolerate room temperature. Group frozen food so the mass stays cold longer, leave unnecessary door opening for later, and record the time power fails.\n\n## During the outage, the closed door is a control measure\nUSDA guidance states that an unopened refrigerator keeps food cold for about four hours, while a full freezer can hold temperature for roughly 48 hours and a half-full freezer for about 24 hours. These are planning figures, not a guarantee for every appliance or ambient condition. A thermometer and actual food condition are stronger evidence than memory.\n\n## Build a simple log\nRecord outage start, any known door openings, appliance temperature when observed without unnecessary opening, power-restoration time and the temperature when power returns. For the freezer, note whether packages still contain ice crystals when assessed. Do not repeatedly open the door “to check”; that consumes the cold reserve you are trying to measure.\n\n## Separate safe decisions from salvage pressure\nWhen the evidence shows that a perishable food has been too warm for too long, discard it according to current food-safety guidance. Appearance, smell or a taste test cannot reliably prove safety. Do not prioritize the purchase price over foodborne-illness risk, especially for children, older adults, pregnant people or anyone with reduced immunity.\n\n## A cooler is another cold chain, not magic storage\nIf moving food to a cooler, record when it moved, the cooling source and temperature if available. Prevent meltwater from contaminating food packaging. Replenishing ice resets neither an unknown earlier exposure nor the history of a food that was already warm.\n\n## After power returns\nStabilize the appliances, clean spills, document discarded high-value items if needed for recovery records, and restock only after the unit returns to a safe operating range. Review whether more thermal mass, thermometers or a better “use first” plan would have reduced loss.\n\nEvidence IDs: FOOD-1, FOOD-2, USDA-OUTAGE-1."},"el":{"title":"Ημερολόγιο θερμοκρασίας ψυγείου και κατάψυξης: αντικατάστησε την εικασία με στοιχεία","body":"## Προετοιμασία πριν από τη διακοπή\nΚράτησε θερμόμετρο συσκευής στο ψυγείο και στην κατάψυξη ώστε να διαβάζεται γρήγορα όταν επιστρέψει το ρεύμα. Γνώριζε ποια τρόφιμα είναι ευπαθή και ποια αντέχουν σε θερμοκρασία δωματίου. Συγκέντρωσε τα κατεψυγμένα ώστε η μάζα να διατηρεί το κρύο περισσότερο, απόφυγε άσκοπο άνοιγμα θυρών και σημείωσε την ώρα που χάνεται η παροχή.\n\n## Κατά τη διακοπή, η κλειστή πόρτα είναι μέτρο ελέγχου\nΗ USDA αναφέρει ότι κλειστό ψυγείο διατηρεί το κρύο περίπου τέσσερις ώρες, ενώ γεμάτη κατάψυξη μπορεί να κρατήσει τη θερμοκρασία περίπου 48 ώρες και μισογεμάτη περίπου 24. Αυτά είναι μεγέθη σχεδιασμού και όχι εγγύηση για κάθε συσκευή ή θερμοκρασία περιβάλλοντος. Το θερμόμετρο και η πραγματική κατάσταση του τροφίμου είναι ισχυρότερα στοιχεία από τη μνήμη.\n\n## Φτιάξε απλό ημερολόγιο\nΚατέγραψε αρχή διακοπής, τυχόν γνωστά ανοίγματα πόρτας, θερμοκρασία συσκευής όταν μπορεί να παρατηρηθεί χωρίς άσκοπο άνοιγμα, ώρα επαναφοράς και θερμοκρασία μετά την επιστροφή του ρεύματος. Στην κατάψυξη σημείωσε αν οι συσκευασίες εξακολουθούν να έχουν κρυστάλλους πάγου όταν αξιολογηθούν. Μην ανοίγεις επανειλημμένα «για έλεγχο», επειδή έτσι χάνεται το ψυχρό απόθεμα που προσπαθείς να διατηρήσεις.\n\n## Ξεχώρισε την ασφαλή απόφαση από την πίεση για διάσωση τροφίμων\nΌταν τα στοιχεία δείχνουν ότι ευπαθές τρόφιμο έμεινε υπερβολικά ζεστό για υπερβολικά μεγάλο διάστημα, απόρριψέ το σύμφωνα με τις τρέχουσες οδηγίες ασφάλειας τροφίμων. Εμφάνιση, οσμή ή δοκιμή γεύσης δεν αποδεικνύουν αξιόπιστα ασφάλεια. Μην βάζεις την οικονομική αξία πάνω από τον κίνδυνο τροφιμογενούς νόσησης, ιδιαίτερα για παιδιά, ηλικιωμένους, εγκύους ή άτομα με μειωμένη ανοσία.\n\n## Το φορητό ψυγείο είναι νέα ψυχρή αλυσίδα, όχι μαγική αποθήκευση\nΑν μεταφέρεις τρόφιμα σε ισοθερμικό δοχείο, σημείωσε ώρα μεταφοράς, ψυκτικό μέσο και θερμοκρασία αν είναι διαθέσιμη. Μην αφήνεις νερό από λιωμένο πάγο να μολύνει συσκευασίες. Η προσθήκη νέου πάγου δεν διαγράφει άγνωστη προηγούμενη έκθεση ούτε ιστορικό τροφίμου που είχε ήδη ζεσταθεί.\n\n## Μετά την επαναφορά\nΆφησε τις συσκευές να σταθεροποιηθούν, καθάρισε διαρροές, τεκμηρίωσε ακριβά απορριφθέντα τρόφιμα αν χρειάζεται για φάκελο αποκατάστασης και αναπλήρωσε αποθέματα μόνο όταν η μονάδα επανέλθει σε ασφαλές εύρος λειτουργίας. Εξέτασε αν περισσότερη ψυχρή μάζα, θερμόμετρα ή καλύτερη σειρά «χρησιμοποίησε πρώτα» θα μείωνε την απώλεια.\n\nΚωδικοί τεκμηρίωσης: FOOD-1, FOOD-2, USDA-OUTAGE-1."}},{"id":117,"en":{"title":"Food use-first sequencing: turn a mixed pantry into a controlled consumption plan","body":"## The first meal after an outage should be a decision, not a habit\nInventory food by risk and by dependency. Some items depend on refrigeration, some on freezer temperature, some on clean water, and some on cooking fuel. Eating shelf-stable food immediately while perishable food is approaching a safety limit can waste the most time-sensitive resource.\n\n## Create four practical groups\nMark foods as: cold-chain priority, shelf-stable ready-to-eat, shelf-stable requiring water/heat, and special-diet/medical or infant food. Within the cold-chain group, use only items that remain within current food-safety guidance. “Use first” never means “eat questionable food before it spoils further.”\n\n## Consider water and fuel as ingredients\nDry staples may look abundant but can consume significant safe water and cooking energy. A plan for pasta, rice or dried legumes must include the water and fuel required to prepare them safely. During a simultaneous water/power failure, reserve no-cook foods for periods when cooking would create an unacceptable fuel or ventilation burden.\n\n## Protect restricted supplies\nAllergy-safe, infant, medically appropriate or texture-modified foods should be labeled and separated from general use. Count them against the needs of the person who depends on them rather than total household calories. If a substitute is not clinically or nutritionally appropriate, “we have plenty of food” is not an adequate continuity statement.\n\n## Sequence by evidence\nUse recorded appliance temperatures and outage duration to decide cold-chain items. Then choose opened shelf-stable packages before sealed long-storage stock when safe. Keep an unopened strategic reserve for a later phase of the incident instead of emptying every package during the first day.\n\n## Close the loop\nUpdate quantities after each meal cycle. Record discarded food separately so it is not accidentally counted as stock. When resupply occurs, refill the consumed category and rotate dates. A good food ledger tells the next shift what is genuinely available, not what the household purchased last month.\n\nEvidence IDs: FOOD-1, USDA-OUTAGE-1, READY-KIT-1."},"el":{"title":"Σειρά κατανάλωσης τροφίμων: μετέτρεψε ένα μικτό απόθεμα σε ελεγχόμενο σχέδιο","body":"## Το πρώτο γεύμα μετά τη διακοπή πρέπει να είναι απόφαση και όχι συνήθεια\nΚατάγραψε τα τρόφιμα ανά κίνδυνο και εξάρτηση. Κάποια χρειάζονται ψύξη, άλλα σταθερή κατάψυξη, άλλα ασφαλές νερό και άλλα καύσιμο μαγειρέματος. Αν καταναλωθούν αμέσως τρόφιμα μακράς διάρκειας ενώ ευπαθή τρόφιμα πλησιάζουν το ασφαλές όριό τους, χάνεται ο πιο χρονικά ευαίσθητος πόρος.\n\n## Δημιούργησε τέσσερις πρακτικές ομάδες\nΧώρισε σε: προτεραιότητα ψυχρής αλυσίδας, έτοιμα τρόφιμα μακράς διάρκειας, τρόφιμα μακράς διάρκειας που απαιτούν νερό/θέρμανση και ειδική διατροφή/ιατρική ή βρεφική ανάγκη. Στην ομάδα ψυχρής αλυσίδας χρησιμοποιούνται μόνο τρόφιμα που παραμένουν μέσα στις τρέχουσες οδηγίες ασφάλειας. «Χρησιμοποίησε πρώτα» δεν σημαίνει «φάε κάτι αμφίβολο πριν χαλάσει περισσότερο».\n\n## Υπολόγισε νερό και καύσιμο ως συστατικά\nΞηρά τρόφιμα μπορεί να φαίνονται άφθονα αλλά να καταναλώνουν σημαντικό ασφαλές νερό και ενέργεια. Σχέδιο για ζυμαρικά, ρύζι ή όσπρια πρέπει να περιλαμβάνει το νερό και καύσιμο που χρειάζονται. Σε ταυτόχρονη διακοπή νερού και ρεύματος, κράτησε τρόφιμα χωρίς μαγείρεμα για περιόδους όπου η θέρμανση θα δημιουργούσε υπερβολικό βάρος σε καύσιμο ή αερισμό.\n\n## Προστάτευσε τα περιορισμένα αποθέματα\nΤρόφιμα για αλλεργίες, βρέφη, ιατρικά κατάλληλη δίαιτα ή ειδική υφή πρέπει να είναι σημειωμένα και χωρισμένα από τη γενική κατανάλωση. Υπολόγισέ τα έναντι των αναγκών του συγκεκριμένου ατόμου και όχι μόνο στις συνολικές θερμίδες. Αν ένα υποκατάστατο δεν είναι κατάλληλο, η φράση «έχουμε πολύ φαγητό» δεν αποτελεί επαρκή συνέχεια φροντίδας.\n\n## Σειρά βάσει στοιχείων\nΧρησιμοποίησε καταγεγραμμένες θερμοκρασίες συσκευών και διάρκεια διακοπής για τις αποφάσεις ψυχρής αλυσίδας. Έπειτα προτίμησε ανοιγμένες ασφαλείς συσκευασίες πριν από σφραγισμένο απόθεμα μεγάλης διάρκειας. Κράτησε ένα ανέγγιχτο στρατηγικό απόθεμα για επόμενη φάση του συμβάντος αντί να ανοίξεις τα πάντα την πρώτη ημέρα.\n\n## Κλείσε τον κύκλο\nΕνημέρωσε ποσότητες μετά από κάθε κύκλο γευμάτων. Κατέγραψε απορριφθέντα τρόφιμα χωριστά για να μην μετρηθούν ξανά ως διαθέσιμα. Όταν γίνει ανεφοδιασμός, αναπλήρωσε την κατηγορία που καταναλώθηκε και κάνε περιστροφή ημερομηνιών. Ένα καλό ημερολόγιο δείχνει στην επόμενη βάρδια τι υπάρχει πραγματικά και όχι τι είχε αγοραστεί πριν από έναν μήνα.\n\nΚωδικοί τεκμηρίωσης: FOOD-1, USDA-OUTAGE-1, READY-KIT-1."}},{"id":118,"en":{"title":"Emergency water containers: cleaning, labeling, rotation and contamination control","body":"## The container is part of water safety\nA treated water source can become unsafe if it is placed in a dirty container or handled with contaminated hands. Use food-grade containers intended for water or beverages, with closures that protect the contents. Containers that previously held toxic chemicals should never be repurposed for drinking water.\n\n## Clean before filling\nFollow authoritative emergency-water guidance and the container manufacturer’s cleaning instructions. Wash and sanitize suitable containers before storing water, then allow them to be handled without recontaminating the interior, lid or dispensing surface. Avoid touching the inside of a cap or neck with unwashed hands.\n\n## Label what the container actually contains\nMark drinking water distinctly from nonpotable water. Include fill/treatment date, source and, during an incident, a batch identifier. If a container is refilled from a different source, update the label rather than relying on its old identity. Keep chemically suspect or utility water physically separate from drinking supplies.\n\n## Dispense without dipping\nA tap or controlled pour is preferable to repeatedly inserting cups, hands or utensils. If the mouth or spout contacts an unclean surface, mark the container for review. Do not top up an old partial container with new treated water and thereby hide the older batch history.\n\n## Storage location matters\nKeep water protected from direct sun, excessive heat, flooding, fuel, pesticides and other chemicals. Heavy containers also create lifting and floor-load problems; use sizes household members can handle safely and distribute them sensibly rather than making one inaccessible reservoir.\n\n## Rotation is inspection\nWhen rotating stored water, inspect for damaged caps, leaks, discoloration, unexpected odor, degraded plastic or contamination around the spout. Rotation is also the time to clean the storage area and confirm that the household has an opener/pump compatible with the containers. Follow current local/public-health guidance for storage duration rather than assuming one universal calendar interval.\n\nEvidence IDs: WATER-1, WATER-2, EPA-WATER-1."},"el":{"title":"Δοχεία νερού έκτακτης ανάγκης: καθαρισμός, σήμανση, περιστροφή και έλεγχος μόλυνσης","body":"## Το δοχείο είναι μέρος της ασφάλειας του νερού\nΑκόμη και επεξεργασμένο νερό μπορεί να μολυνθεί αν μπει σε βρόμικο δοχείο ή αγγιχτεί με μολυσμένα χέρια. Χρησιμοποίησε δοχεία κατάλληλα για τρόφιμα, σχεδιασμένα για νερό ή ποτά, με κλείσιμο που προστατεύει το περιεχόμενο. Δοχείο που είχε τοξική χημική ουσία δεν επαναχρησιμοποιείται ποτέ για πόσιμο νερό.\n\n## Καθάρισε πριν από το γέμισμα\nΑκολούθησε επίσημες οδηγίες νερού έκτακτης ανάγκης και τις οδηγίες του κατασκευαστή του δοχείου. Πλύνε και απολύμανε κατάλληλα δοχεία πριν από την αποθήκευση και μετά χειρίσου τα χωρίς να μολύνεις ξανά το εσωτερικό, το καπάκι ή το σημείο εκροής. Μην αγγίζεις την εσωτερική πλευρά του πώματος ή του λαιμού με άπλυτα χέρια.\n\n## Σήμανε αυτό που πραγματικά περιέχει\nΞεχώρισε καθαρά πόσιμο από μη πόσιμο νερό. Γράψε ημερομηνία γεμίσματος ή επεξεργασίας, πηγή και, μέσα σε συμβάν, κωδικό παρτίδας. Αν ξαναγεμίσεις από άλλη πηγή, άλλαξε τη σήμανση αντί να βασίζεσαι στην παλιά ταυτότητα. Νερό με πιθανή χημική επιβάρυνση ή νερό τεχνικής χρήσης μένει φυσικά χωρισμένο από τα πόσιμα αποθέματα.\n\n## Διανομή χωρίς βύθιση αντικειμένων\nΒρυσάκι ή ελεγχόμενη έκχυση είναι προτιμότερα από συνεχή εισαγωγή ποτηριών, χεριών ή σκευών. Αν το στόμιο αγγίξει ακάθαρτη επιφάνεια, βάλε το δοχείο σε επανέλεγχο. Μην συμπληρώνεις παλιό μισογεμάτο δοχείο με νέο επεξεργασμένο νερό, γιατί έτσι χάνεται το ιστορικό της παλιότερης παρτίδας.\n\n## Η θέση αποθήκευσης έχει σημασία\nΠροστάτευσε το νερό από άμεσο ήλιο, υπερβολική θερμότητα, πλημμύρα, καύσιμα, φυτοφάρμακα και άλλες χημικές ουσίες. Τα βαριά δοχεία δημιουργούν επίσης πρόβλημα ανύψωσης και φόρτισης δαπέδου· προτίμησε μεγέθη που μπορούν να χειριστούν με ασφάλεια τα μέλη του νοικοκυριού και μοίρασε το απόθεμα λογικά αντί να δημιουργείς μία απρόσιτη δεξαμενή.\n\n## Η περιστροφή είναι επιθεώρηση\nΌταν ανανεώνεις το απόθεμα, έλεγξε κατεστραμμένα καπάκια, διαρροές, αλλαγή χρώματος, απρόσμενη οσμή, αλλοίωση υλικού και ρύπανση γύρω από το στόμιο. Είναι επίσης ευκαιρία για καθαρισμό του χώρου και επιβεβαίωση ότι υπάρχει συμβατή αντλία ή εργαλείο ανοίγματος. Ακολούθησε τις τρέχουσες τοπικές ή υγειονομικές οδηγίες για χρόνο αποθήκευσης αντί να θεωρείς ότι υπάρχει ένα παγκόσμιο διάστημα για όλα τα δοχεία.\n\nΚωδικοί τεκμηρίωσης: WATER-1, WATER-2, EPA-WATER-1."}},{"id":119,"en":{"title":"Emergency handwashing station: create a clean flow without wasting safe water","body":"## Handwashing is an infrastructure function\nWhen taps fail, simply storing water does not create a usable hygiene system. People need a way to dispense water without contaminating the container, collect runoff, keep soap dry, and know which water is approved for the task. Place the station near sanitation/food areas but far enough away that wastewater cannot splash clean supplies.\n\n## Use controlled dispensing\nA container with a tap or other hands-free/low-touch dispensing arrangement conserves water better than dipping cups into an open bucket. Keep the drinking-water supply separate unless that is the only approved safe source. Label any nonpotable hygiene water clearly and follow local public-health instructions about what water quality is acceptable for handwashing during the incident.\n\n## Build a clean-to-dirty sequence\nApproach with dirty hands, operate the dispenser without reaching into stored water, use soap, rinse, dry with a clean method and leave without touching contaminated handles where possible. Provide a waste bin for used towels. If the station serves a sick-room or sewage-cleanup area, it should not become the household’s food-preparation wash point.\n\n## Manage the greywater\nCollect or direct runoff so it does not create slippery floors, standing water, insect breeding or contamination near stored supplies. In apartments, never discharge improvised greywater where it can leak to lower units or damage electrical areas. Disposal must follow local sewer/environmental restrictions.\n\n## Maintain the station\nRefill from a known source, clean the outlet and catch basin, replenish soap and inspect for leaks. Assign someone to this task during a prolonged disruption. A dry soap bottle beside an empty water container is not a functioning handwashing station.\n\n## Keep sanitizer as a complement, not a universal replacement\nAlcohol-based hand sanitizer can be useful when soap and water are not immediately available, but visibly dirty hands and some contamination situations still call for washing. Follow current CDC/public-health guidance and product labels.\n\nEvidence IDs: CDC-HYGIENE-1, WASH-1, WATER-1."},"el":{"title":"Σταθμός πλυσίματος χεριών έκτακτης ανάγκης: καθαρή ροή με περιορισμένο ασφαλές νερό","body":"## Το πλύσιμο χεριών είναι λειτουργία υποδομής\nΌταν οι βρύσες δεν λειτουργούν, η απλή αποθήκευση νερού δεν δημιουργεί σύστημα υγιεινής. Χρειάζεται τρόπος διανομής χωρίς μόλυνση του δοχείου, συλλογή απορροής, προστασία σαπουνιού και σαφής γνώση ποιο νερό επιτρέπεται για τη χρήση. Βάλε τον σταθμό κοντά σε τουαλέτα ή χώρο φαγητού αλλά αρκετά μακριά ώστε τα απόνερα να μην πιτσιλούν καθαρά εφόδια.\n\n## Ελεγχόμενη διανομή\nΔοχείο με βρυσάκι ή άλλη διάταξη χαμηλής επαφής εξοικονομεί νερό καλύτερα από ποτήρια που βυθίζονται σε ανοιχτό κουβά. Κράτησε χωριστό το πόσιμο απόθεμα εκτός αν είναι η μοναδική εγκεκριμένη ασφαλής πηγή. Σήμανε καθαρά τυχόν νερό υγιεινής που δεν είναι πόσιμο και ακολούθησε την τοπική καθοδήγηση για την απαιτούμενη ποιότητα νερού κατά το συμβάν.\n\n## Ροή από καθαρό προς βρόμικο\nΟ χρήστης φτάνει με βρόμικα χέρια, χειρίζεται τη διανομή χωρίς να βάζει χέρια στο αποθηκευμένο νερό, χρησιμοποιεί σαπούνι, ξεπλένει, στεγνώνει με καθαρό τρόπο και αποχωρεί χωρίς να ξαναγγίζει μολυσμένες λαβές όπου γίνεται. Πρόβλεψε κάδο για χρησιμοποιημένα υλικά. Σταθμός που εξυπηρετεί δωμάτιο ασθενή ή καθαρισμό λυμάτων δεν πρέπει να γίνει το σημείο πλυσίματος για προετοιμασία τροφίμων.\n\n## Διαχείριση απόνερων\nΣυγκέντρωσε ή οδήγησε την απορροή ώστε να μην δημιουργεί ολισθηρό δάπεδο, στάσιμο νερό, έντομα ή ρύπανση δίπλα στα εφόδια. Σε πολυκατοικία μην απορρίπτεις αυτοσχέδια απόνερα εκεί όπου μπορεί να διαρρεύσουν σε χαμηλότερο διαμέρισμα ή ηλεκτρικό χώρο. Η απόρριψη ακολουθεί τους τοπικούς περιορισμούς αποχέτευσης και περιβάλλοντος.\n\n## Συντήρηση του σταθμού\nΓέμισε από γνωστή πηγή, καθάριζε το στόμιο και το δοχείο συλλογής, αναπλήρωνε σαπούνι και έλεγχε διαρροές. Σε παρατεταμένη διακοπή ανάθεσε την εργασία σε συγκεκριμένο άτομο. Ένα μπουκάλι σαπούνι δίπλα σε άδειο δοχείο δεν είναι λειτουργικός σταθμός.\n\n## Το αντισηπτικό είναι συμπλήρωμα και όχι καθολικό υποκατάστατο\nΑλκοολούχο αντισηπτικό μπορεί να βοηθά όταν δεν υπάρχει άμεσα σαπούνι και νερό, αλλά εμφανώς βρόμικα χέρια και ορισμένες μορφές ρύπανσης εξακολουθούν να απαιτούν πλύσιμο. Ακολούθησε τις τρέχουσες οδηγίες δημόσιας υγείας/CDC και την ετικέτα του προϊόντος.\n\nΚωδικοί τεκμηρίωσης: CDC-HYGIENE-1, WASH-1, WATER-1."}},{"id":120,"en":{"title":"Menstrual and incontinence hygiene continuity: plan dignity, water and waste together","body":"## Count consumption realistically\nEmergency kits often list generic hygiene products but do not match the person’s normal product type, size, frequency or skin needs. Keep an individualized reserve and note where it is stored. Include disposal bags, clean underwear, hand hygiene, skin-protection items already used by the person, and any accessible changing equipment.\n\n## Protect privacy and clean surfaces\nChoose a changing location with a closable door or visual barrier, a clean surface and nearby handwashing. Shared shelters or crowded homes need a method to signal occupancy without forcing someone to explain a private medical or hygiene need. Keep clean supplies above floor level and away from toilet splash or flood contamination.\n\n## Water loss changes the workflow\nIf normal bathing or laundry is unavailable, prioritize handwashing and safe cleaning of the body according to health guidance. Reusable products require a reliable cleaning/drying process; do not adopt them during an outage merely because disposable stock is low if safe washing cannot be maintained. Conversely, disposable products create a larger waste burden that must be contained.\n\n## Waste must be closed and separated\nUse secure bags or containers and follow local waste rules. Do not flush products that the sanitation system is not designed to accept, especially during a sewer disruption. Store waste where children and animals cannot access it and where leakage cannot contaminate clean supplies.\n\n## Watch for continuity problems\nSkin breakdown, pain, bleeding outside the person’s normal pattern, urinary symptoms, dehydration or inability to keep the area clean can require medical advice. The project should support logistics and records, not diagnose or replace clinical care.\n\n## Include this in evacuation planning\nA go-bag should carry enough preferred supplies for the travel/arrival period, not the entire home stock. Put additional reserve in a labeled module that can be loaded quickly. For a dependent person, document who carries supplies and who is the backup caregiver.\n\nEvidence IDs: CDC-HYGIENE-1, READY-DISABILITY-1, READY-KIT-1."},"el":{"title":"Συνέχεια έμμηνης ρύσης και ακράτειας: σχεδίασε μαζί αξιοπρέπεια, νερό και απόβλητα","body":"## Υπολόγισε πραγματική κατανάλωση\nΤα κιτ ανάγκης συχνά γράφουν γενικά «είδη υγιεινής» χωρίς να ταιριάζουν στον τύπο προϊόντος, μέγεθος, συχνότητα ή ανάγκες δέρματος του συγκεκριμένου ατόμου. Κράτησε εξατομικευμένο απόθεμα και σημείωσε πού βρίσκεται. Πρόσθεσε σακούλες απόρριψης, καθαρά εσώρουχα, μέσα καθαρισμού χεριών, προϊόντα προστασίας δέρματος που ήδη χρησιμοποιούνται και τυχόν προσβάσιμο εξοπλισμό αλλαγής.\n\n## Προστάτευσε ιδιωτικότητα και καθαρές επιφάνειες\nΔιάλεξε σημείο αλλαγής με πόρτα ή οπτικό διαχωρισμό, καθαρή επιφάνεια και κοντινό πλύσιμο χεριών. Σε κοινό καταφύγιο ή γεμάτο σπίτι χρειάζεται τρόπος να φαίνεται ότι ο χώρος χρησιμοποιείται χωρίς να υποχρεώνεται κάποιος να εξηγεί ιδιωτική ιατρική ή υγειονομική ανάγκη. Κράτησε τα καθαρά προϊόντα πάνω από το επίπεδο του δαπέδου και μακριά από πιτσιλιές τουαλέτας ή πλημμυρική ρύπανση.\n\n## Η έλλειψη νερού αλλάζει τη διαδικασία\nΑν δεν υπάρχει κανονικό μπάνιο ή πλύσιμο ρούχων, προτεραιότητα έχει το πλύσιμο χεριών και ο ασφαλής καθαρισμός σώματος σύμφωνα με υγειονομική καθοδήγηση. Επαναχρησιμοποιούμενα προϊόντα απαιτούν αξιόπιστο πλύσιμο και στέγνωμα· μην τα εισάγεις ξαφνικά μόνο επειδή τελειώνουν τα αναλώσιμα αν δεν μπορεί να διατηρηθεί ασφαλής καθαριότητα. Αντίστροφα, τα αναλώσιμα αυξάνουν τον όγκο απορριμμάτων που πρέπει να συγκρατείται.\n\n## Τα απόβλητα κλείνονται και διαχωρίζονται\nΧρησιμοποίησε ασφαλείς σακούλες ή δοχεία και ακολούθησε τους τοπικούς κανόνες. Μην ρίχνεις στην τουαλέτα προϊόντα που το σύστημα δεν είναι σχεδιασμένο να δεχθεί, ιδιαίτερα σε βλάβη αποχέτευσης. Αποθήκευσε προσωρινά τα απόβλητα μακριά από παιδιά/ζώα και από σημεία όπου διαρροή μπορεί να μολύνει καθαρά εφόδια.\n\n## Αναγνώρισε προβλήματα συνέχειας\nΒλάβη δέρματος, πόνος, αιμορραγία έξω από το συνηθισμένο πρότυπο, ουρολογικά συμπτώματα, αφυδάτωση ή αδυναμία διατήρησης καθαριότητας μπορεί να απαιτούν ιατρική συμβουλή. Το έργο υποστηρίζει οργάνωση και καταγραφή και δεν υποκαθιστά κλινική αξιολόγηση.\n\n## Βάλε το θέμα στο σχέδιο εκκένωσης\nΤο σακίδιο διαφυγής πρέπει να έχει αρκετά προτιμώμενα είδη για τη μετακίνηση και την αρχική άφιξη, όχι όλο το οικιακό απόθεμα. Βάλε επιπλέον εφεδρεία σε σημειωμένη μονάδα που φορτώνεται γρήγορα. Για εξαρτώμενο άτομο, κατέγραψε ποιος μεταφέρει τα είδη και ποιος είναι εφεδρικός φροντιστής.\n\nΚωδικοί τεκμηρίωσης: CDC-HYGIENE-1, READY-DISABILITY-1, READY-KIT-1."}},{"id":121,"en":{"title":"Laundry after contamination or utility loss: keep dirty textiles from spreading the problem","body":"## Decide whether washing is appropriate\nOrdinary worn clothing, flood-soiled textiles, sewage-contaminated fabric and chemically contaminated clothing are not the same problem. Some material should not be handled or washed at home. Follow public-health, hazardous-material or remediation instructions for the incident before putting contaminated items into a normal washing machine.\n\n## Establish a dirty textile boundary\nUse a labeled bag/bin near the place clothing is removed. Do not shake heavily contaminated textiles because this can spread dust, mold or other material. Keep them away from bedding, towels used for hygiene and food areas. If bags leak, place them in a secondary container.\n\n## Conserve water without cross-contamination\nWhen water is limited, prioritize underwear, towels used for personal hygiene and clothing needed for safe temperature control. Rewearing an uncontaminated outer layer may be preferable to spending safe water on unnecessary washing. Do not use chemically suspect water for hand-laundering clothing that will contact skin.\n\n## Drying is part of cleaning\nDamp textiles stored in a pile can develop odor and microbial growth. Create airflow and drying space without blocking exits, heaters or electrical equipment. In wet disaster recovery, reducing indoor humidity and drying materials promptly can be as important as the wash step.\n\n## Protect the person doing the work\nWash hands after handling dirty laundry and before touching clean items. If the incident requires gloves or other protective equipment, remove them without contaminating the clean side. People with respiratory disease, weakened immunity or other vulnerability should avoid mold/sewage cleanup tasks when public-health guidance recommends it.\n\n## Reopen normal laundry deliberately\nAfter water/power returns, inspect the machine and surrounding area for flood/sewage exposure before use. Clean contaminated work surfaces as appropriate and run only after the utility is safe. Document textile losses that matter for recovery claims instead of mixing them back into the household inventory.\n\nEvidence IDs: CLEANUP-1, CDC-HYGIENE-1, CDC-DISASTER-1."},"el":{"title":"Πλύσιμο ρούχων μετά από ρύπανση ή απώλεια υποδομών: μην μεταφέρεις το πρόβλημα με τα υφάσματα","body":"## Αποφάσισε πρώτα αν επιτρέπεται ο οικιακός καθαρισμός\nΚανονικά φορεμένα ρούχα, υφάσματα από πλημμύρα, υλικά με λύματα και ρούχα με χημική ρύπανση δεν είναι το ίδιο πρόβλημα. Ορισμένα δεν πρέπει να χειρίζονται ή να πλένονται στο σπίτι. Ακολούθησε την καθοδήγηση δημόσιας υγείας, επικίνδυνων υλικών ή αποκατάστασης για το συγκεκριμένο συμβάν πριν τα βάλεις σε συνηθισμένο πλυντήριο.\n\n## Δημιούργησε όριο για βρόμικα υφάσματα\nΧρησιμοποίησε σημειωμένη σακούλα ή δοχείο κοντά στο σημείο όπου αφαιρούνται τα ρούχα. Μην τινάζεις βαριά μολυσμένα υφάσματα, επειδή μπορεί να διασκορπιστεί σκόνη, μούχλα ή άλλο υλικό. Κράτησέ τα μακριά από κλινοσκεπάσματα, πετσέτες προσωπικής υγιεινής και χώρο τροφίμων. Αν σακούλα διαρρέει, βάλε την σε δεύτερο δοχείο.\n\n## Εξοικονόμησε νερό χωρίς διασταυρούμενη μόλυνση\nΜε περιορισμένο νερό, προτεραιότητα έχουν εσώρουχα, πετσέτες προσωπικής υγιεινής και ρούχα απαραίτητα για ασφαλή θερμοκρασία σώματος. Η επαναχρησιμοποίηση καθαρού εξωτερικού ρούχου μπορεί να είναι προτιμότερη από άσκοπη κατανάλ
