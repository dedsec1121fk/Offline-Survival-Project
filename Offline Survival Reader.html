rage space, and serving tools for the allergy-safe meal. A utensil that touched the allergen should not be “wiped clean” and returned to the safe station. Handwashing and cleaning should happen before safe-food preparation, not only afterward. Communicate with shelter/kitchen staff rather than creating a parallel hidden kitchen that violates site safety rules.\n\n## Keep the emergency plan attached to the person\nThe allergy action plan, prescribed emergency medicine, identification, and caregiver instructions should travel together. The app does not decide when or how to administer prescription emergency medication; follow the person’s clinician-provided plan and local emergency guidance. After any suspected reaction, obtain appropriate medical help rather than relying on symptom improvement alone.\n\n## Verification anchors\n- Existing personal allergy action plan and treating clinician.\n- Shelter/kitchen food-safety and allergen procedures at the operating location.\n\nVerification date: 2026-08-09."},"el":{"title":"Έλεγχος Αλλεργιογόνων και Επιμόλυνσης σε Κοινή Κουζίνα","body":"Η εκτόπιση αλλάζει τον χώρο παρασκευής φαγητού, τα άτομα που το χειρίζονται, τα κοινά σκεύη και συχνά αφαιρεί την αρχική συσκευασία. Για άτομο με σοβαρή τροφική αλλεργία, ο κίνδυνος μπορεί να είναι η επιμόλυνση ή ένα άγνωστο συστατικό και όχι η έλλειψη θερμίδων. Το σχέδιο συνέχειας πρέπει να κάνει την αβεβαιότητα ορατή αντί να πιέζει το άτομο να «φάει κάτι».\n\n## Προστάτευσε τα αναγνωρίσιμα ασφαλή τρόφιμα\nΚράτησε τα τρόφιμα που είναι συμβατά με την αλλεργία σε καθαρά σημειωμένο δοχείο ή σακούλα με όνομα ατόμου και πληροφορία αλλεργιογόνου. Διατήρησε την αρχική ετικέτα όποτε γίνεται. Αν γίνει ανασυσκευασία, αντέγραψε όνομα προϊόντος, συστατικά/δήλωση αλλεργιογόνων, παρτίδα ή λήξη όπου χρειάζεται και ποιος έκανε την ανασυσκευασία. Κοινόχρηστο φαγητό χωρίς ετικέτα θεωρείται άγνωστο εκτός αν η υπεύθυνη κουζίνα μπορεί να επαληθεύσει συστατικά και χειρισμό.\n\n## Έλεγξε σκεύη και επιφάνειες\nΌπου είναι εφικτό, όρισε καθαρισμένα σκεύη, επιφάνεια κοπής, χώρο αποθήκευσης και εργαλεία σερβιρίσματος για το ασφαλές γεύμα. Σκεύος που ακούμπησε αλλεργιογόνο δεν «σκουπίζεται» απλώς και επιστρέφει στον ασφαλή σταθμό. Πλύσιμο χεριών και καθαρισμός γίνονται πριν από την παρασκευή του ασφαλούς φαγητού, όχι μόνο μετά. Συνεννοήσου με το προσωπικό καταφυγίου/κουζίνας αντί να δημιουργήσεις κρυφή παράλληλη κουζίνα που παραβιάζει κανόνες του χώρου.\n\n## Το σχέδιο έκτακτης ανάγκης ακολουθεί το άτομο\nΤο σχέδιο αντιμετώπισης αλλεργίας, το συνταγογραφημένο επείγον φάρμακο, η ταυτοποίηση και οι οδηγίες φροντιστή πρέπει να μεταφέρονται μαζί. Η εφαρμογή δεν αποφασίζει πότε ή πώς χορηγείται συνταγογραφημένο επείγον φάρμακο· ακολούθησε το σχέδιο του θεράποντα και τις τοπικές οδηγίες. Μετά από ύποπτη αντίδραση ζήτησε κατάλληλη ιατρική βοήθεια και μην βασίζεσαι μόνο σε προσωρινή βελτίωση συμπτωμάτων.\n\n## Πηγές επαλήθευσης\n- Το εξατομικευμένο σχέδιο αλλεργίας και ο θεράπων ιατρός.\n- Οι διαδικασίες τροφικής ασφάλειας και αλλεργιογόνων του χώρου φιλοξενίας/κουζίνας.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":140,"en":{"title":"Medication Reconciliation After Evacuation or Displacement","body":"During an evacuation, medicines may be split between bags, replaced by a pharmacy, supplied by a clinic, or temporarily unavailable. The greatest documentation risk is ending up with multiple partially correct lists. Medication reconciliation means creating one current list that identifies what the person is actually taking and which uncertainties still need a pharmacist or clinician.\n\n## Build the list from evidence\nUse prescription containers, pharmacy records, discharge paperwork, device apps, clinician lists, and the person/caregiver’s knowledge. For each item record the medicine name, strength/form as printed, normal schedule from the existing prescription, purpose if already known, prescriber/pharmacy, remaining supply, and any unresolved discrepancy. Do not infer a dose from pill color or from another family member’s prescription.\n\n## Mark changes instead of overwriting history\nIf a clinic changes a medicine during displacement, record the date, who directed the change, and whether the old supply is discontinued, held, or still needed. Physically separate medicines that should no longer be used to reduce accidental duplication. Photograph labels when appropriate, but do not rely on a single phone as the only copy.\n\n## Escalate conflicting information\nTwo containers with different strengths, missing labels, duplicate brands/generics, or an unfamiliar substitute should trigger pharmacy/clinical confirmation. The Command Center can track the discrepancy but must not choose between competing prescriptions. This is especially important when more than one facility has provided emergency refills.\n\n## Verification anchor\n- Current pharmacy record, prescription label, discharge instructions, and treating clinician/pharmacist are the controlling sources.\n\nVerification date: 2026-08-09."},"el":{"title":"Συμφωνία Φαρμάκων Μετά από Εκκένωση ή Εκτόπιση","body":"Κατά την εκκένωση, φάρμακα μπορεί να μοιραστούν σε διαφορετικές τσάντες, να αντικατασταθούν από φαρμακείο, να δοθούν από κλινική ή να λείψουν προσωρινά. Ο μεγαλύτερος κίνδυνος τεκμηρίωσης είναι να δημιουργηθούν πολλές λίστες που είναι όλες μόνο εν μέρει σωστές. Συμφωνία φαρμάκων σημαίνει μία τρέχουσα λίστα που δείχνει τι πραγματικά λαμβάνει το άτομο και ποιες αβεβαιότητες χρειάζονται φαρμακοποιό ή κλινικό.\n\n## Χτίσε τη λίστα από αποδείξεις\nΧρησιμοποίησε δοχεία συνταγών, αρχεία φαρμακείου, εξιτήρια, εφαρμογές συσκευών, κλινικές λίστες και τη γνώση του ατόμου/φροντιστή. Για κάθε στοιχείο γράψε όνομα, περιεκτικότητα/μορφή όπως αναγράφεται, κανονικό πρόγραμμα από την υπάρχουσα συνταγή, σκοπό αν είναι ήδη γνωστός, θεράποντα/φαρμακείο, υπόλοιπο και κάθε εκκρεμή διαφορά. Μην συμπεραίνεις δόση από το χρώμα χαπιού ή από συνταγή άλλου μέλους της οικογένειας.\n\n## Κατάγραψε αλλαγές χωρίς να σβήνεις το ιστορικό\nΑν μια κλινική αλλάξει φάρμακο κατά την εκτόπιση, σημείωσε ημερομηνία, ποιος έδωσε την οδηγία και αν το παλιό απόθεμα διακόπτεται, κρατιέται προσωρινά ή εξακολουθεί να χρειάζεται. Χώρισε φυσικά τα φάρμακα που δεν πρέπει πλέον να χρησιμοποιούνται ώστε να μειωθεί ο κίνδυνος διπλής λήψης. Φωτογράφισε ετικέτες όπου είναι χρήσιμο, αλλά μην κρατάς το μοναδικό αντίγραφο σε ένα τηλέφωνο.\n\n## Κλιμάκωσε τις αντιφάσεις\nΔύο δοχεία με διαφορετική περιεκτικότητα, χαμένες ετικέτες, διπλές εμπορικές/γενόσημες ονομασίες ή άγνωστο υποκατάστατο χρειάζονται επιβεβαίωση από φαρμακείο ή κλινική ομάδα. Το Κέντρο Ελέγχου μπορεί να καταγράψει τη διαφορά αλλά δεν επιλέγει μεταξύ αντικρουόμενων συνταγών. Αυτό είναι ιδιαίτερα σημαντικό όταν περισσότερες από μία δομές έχουν δώσει επείγουσα ανανέωση.\n\n## Πηγές επαλήθευσης\n- Το τρέχον αρχείο φαρμακείου, η ετικέτα συνταγής, οι οδηγίες εξιτηρίου και ο θεράπων/φαρμακοποιός είναι οι καθοριστικές πηγές.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":141,"en":{"title":"Pharmacy and Refill Continuity When Away From Home","body":"A medicine reserve is useful only if the household can replace it when evacuation lasts longer than planned. Pharmacy continuity therefore includes identification, prescription information, insurance/payment information where applicable, prescriber contacts, storage needs, and a method for explaining exactly what was lost or left behind.\n\n## Prepare a refill packet before disruption\nKeep a current medication list plus pharmacy name/phone, prescriber contacts, relevant insurance identifiers, allergy information, and a copy or photo of prescription labels where lawful and appropriate. Do not store the only copy online. If controlled or specially regulated medicines are involved, expect stricter refill rules and seek professional guidance early rather than assuming an emergency override exists.\n\n## Ask for the smallest correct decision\nWhen contacting a pharmacy, describe the situation precisely: evacuation, medicine inaccessible, supply damaged, cold-chain failure, prescription transferred, or normal pharmacy closed. Provide the label information instead of asking staff to identify a medicine from appearance. Record who was contacted, time, what they advised, and the location where a replacement can actually be collected.\n\n## Prevent duplicate supply from becoming duplicate dosing\nIf multiple pharmacies or clinics issue replacement stock, reconcile it into the medication list and mark the superseded container. Keep receipts and paperwork because they may also be useful for reimbursement or continuity at the next location. Never combine loose pills into an unlabeled emergency container unless a qualified professional has specifically instructed an appropriate method.\n\n## Verification anchor\n- Local pharmacy, prescriber, insurer/health system, and applicable national/local medicine regulations.\n\nVerification date: 2026-08-09."},"el":{"title":"Συνέχεια Φαρμακείου και Ανανέωσης Συνταγών Μακριά από το Σπίτι","body":"Ένα απόθεμα φαρμάκων είναι χρήσιμο μόνο αν το νοικοκυριό μπορεί να το αντικαταστήσει όταν η εκκένωση κρατήσει περισσότερο από το σχέδιο. Η συνέχεια φαρμακείου περιλαμβάνει λοιπόν ταυτοποίηση, πληροφορίες συνταγής, στοιχεία ασφάλισης/πληρωμής όπου χρειάζονται, επαφές θεράποντα, απαιτήσεις αποθήκευσης και τρόπο να εξηγηθεί ακριβώς τι χάθηκε ή έμεινε πίσω.\n\n## Ετοίμασε πακέτο ανανέωσης πριν από τη διακοπή\nΚράτησε ενημερωμένη λίστα φαρμάκων μαζί με όνομα/τηλέφωνο φαρμακείου, στοιχεία θεράποντα, σχετικά ασφαλιστικά στοιχεία, αλλεργίες και αντίγραφο ή φωτογραφία ετικετών όπου είναι νόμιμο και κατάλληλο. Μην υπάρχει το μοναδικό αντίγραφο μόνο στο διαδίκτυο. Για ελεγχόμενα ή ειδικά ρυθμιζόμενα φάρμακα αναμένονται αυστηρότεροι κανόνες ανανέωσης· ζήτησε έγκαιρα επαγγελματική καθοδήγηση αντί να υποθέτεις ότι υπάρχει αυτόματη εξαίρεση.\n\n## Ζήτησε τη μικρότερη σωστή απόφαση\nΌταν επικοινωνείς με φαρμακείο, περιέγραψε με ακρίβεια την κατάσταση: εκκένωση, μη προσβάσιμο φάρμακο, κατεστραμμένο απόθεμα, αστοχία ψυχρής αλυσίδας, μεταφορά συνταγής ή κλειστό συνηθισμένο φαρμακείο. Δώσε στοιχεία ετικέτας αντί να ζητάς αναγνώριση φαρμάκου από την εμφάνιση. Κατάγραψε με ποιον μίλησες, ώρα, τι συμβούλεψε και πού μπορεί πράγματι να παραληφθεί το νέο απόθεμα.\n\n## Μην αφήσεις το διπλό απόθεμα να γίνει διπλή λήψη\nΑν περισσότερα φαρμακεία ή κλινικές δώσουν αντικατάσταση, συμφώνησέ την στην κεντρική λίστα και σημείωσε το δοχείο που αντικαταστάθηκε. Κράτησε αποδείξεις και έγγραφα επειδή μπορεί να χρειαστούν για αποζημίωση ή συνέχεια στον επόμενο προορισμό. Μην αναμιγνύεις χαλαρά χάπια σε ανώνυμο «δοχείο ανάγκης» εκτός αν επαγγελματίας υγείας έχει δώσει συγκεκριμένη κατάλληλη οδηγία.\n\n## Πηγές επαλήθευσης\n- Τοπικό φαρμακείο, θεράπων, ασφαλιστικό/υγειονομικό σύστημα και οι ισχύοντες εθνικοί/τοπικοί κανόνες φαρμάκων.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":142,"en":{"title":"Downed Power Lines and Electrically Energized Water","body":"Storm, flood, fire, and earthquake damage can place electrical conductors where people do not expect them. A line lying on the ground, a tree, fence, roof, or vehicle may still be energized. Floodwater can also become electrically hazardous through damaged systems. The safe household action is distance and reporting, not testing whether a line is live.\n\n## Treat the area as a no-entry zone\nKeep people and animals away from downed wires, damaged poles, transformers, service drops, and anything they are touching. Do not move a line with wood, rope, tools, or a vehicle. Do not enter water near damaged electrical infrastructure. Ready.gov advises avoiding downed utility lines and reporting them immediately; CDC likewise warns against entering water to access electrical controls.\n\n## Route evacuation around the hazard\nIf the normal exit crosses a damaged line or energized water, use the alternate route and tell arriving responders exactly where the hazard is. Keep children and bystanders from approaching for photographs or cleanup. If a wire contacts a vehicle, follow emergency-service/utility instructions; leaving the vehicle without a specific life-threatening reason can introduce a dangerous path to ground.\n\n## Re-entry requires utility/electrical clearance\nA line being reattached does not automatically mean the household electrical system is safe. Fire, water, or impact can damage the service entrance, panel, wiring, grounding, and connected appliances. Record what was damaged and do not re-energize questionable circuits until qualified inspection.\n\n## Verification sources\n- Ready.gov — Evacuation: https://www.ready.gov/evacuation\n- CDC — Electrical Hazards After Disasters: https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-from-electrical-hazards.html\n\nVerification date: 2026-08-09."},"el":{"title":"Πεσμένα Ηλεκτρικά Καλώδια και Νερό με Ηλεκτρικό Κίνδυνο","body":"Καταιγίδα, πλημμύρα, φωτιά ή σεισμός μπορούν να μεταφέρουν ηλεκτρικούς αγωγούς σε σημεία όπου κανείς δεν τους περιμένει. Καλώδιο στο έδαφος, πάνω σε δέντρο, φράχτη, στέγη ή όχημα μπορεί να παραμένει υπό τάση. Το νερό πλημμύρας επίσης μπορεί να γίνει ηλεκτρικά επικίνδυνο από κατεστραμμένα συστήματα. Η σωστή οικιακή ενέργεια είναι απόσταση και αναφορά, όχι δοκιμή για το αν το καλώδιο «έχει ρεύμα».\n\n## Κάνε την περιοχή ζώνη απαγόρευσης\nΚράτησε ανθρώπους και ζώα μακριά από πεσμένα καλώδια, κατεστραμμένες κολόνες, μετασχηματιστές, παροχές και οτιδήποτε αγγίζουν. Μην μετακινείς καλώδιο με ξύλο, σχοινί, εργαλεία ή όχημα. Μην μπαίνεις σε νερό κοντά σε κατεστραμμένη ηλεκτρική υποδομή. Το Ready.gov συστήνει αποφυγή πεσμένων γραμμών και άμεση αναφορά, ενώ το CDC προειδοποιεί να μην μπαίνεις σε νερό για να φτάσεις ηλεκτρικούς διακόπτες.\n\n## Παράκαμψε τον κίνδυνο στην εκκένωση\nΑν η κανονική έξοδος περνά από κατεστραμμένη γραμμή ή ύποπτο νερό, χρησιμοποίησε εναλλακτική διαδρομή και πες στους διασώστες ακριβώς πού βρίσκεται ο κίνδυνος. Κράτησε παιδιά και παρευρισκόμενους μακριά από φωτογραφίες ή καθαρισμό. Αν καλώδιο ακουμπά όχημα, ακολούθησε οδηγίες υπηρεσιών έκτακτης ανάγκης/ηλεκτρισμού· έξοδος από το όχημα χωρίς συγκεκριμένο άμεσο κίνδυνο μπορεί να δημιουργήσει επικίνδυνη διαδρομή προς τη γη.\n\n## Η επανείσοδος χρειάζεται έλεγχο δικτύου και εγκατάστασης\nΗ επανασύνδεση ενός καλωδίου δεν σημαίνει ότι η οικιακή εγκατάσταση είναι αυτόματα ασφαλής. Φωτιά, νερό ή κρούση μπορούν να βλάψουν παροχή, πίνακα, καλωδίωση, γείωση και συσκευές. Κατάγραψε τη ζημιά και μην επανατροφοδοτείς αμφίβολα κυκλώματα πριν από ειδικευμένο έλεγχο.\n\n## Πηγές επαλήθευσης\n- Ready.gov — εκκένωση: https://www.ready.gov/evacuation\n- CDC — ηλεκτρικοί κίνδυνοι μετά από καταστροφή: https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-from-electrical-hazards.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":143,"en":{"title":"Wet Electrical Appliances: Do Not “Dry and Try”","body":"An appliance that was submerged, splashed by floodwater, or exposed to water inside its electrical components can remain a shock or fire hazard after the outside dries. The correct recovery workflow is isolation, documentation, qualified inspection, and replacement when required—not repeated plug-in tests.\n\n## Isolate before handling electrical recovery\nIf circuits or equipment are in or near water, CDC advises shutting off power only if the switch can be reached without entering water; otherwise use a qualified electrician. Do not stand in water while switching power or operating electrical tools. Mark flooded circuits and appliances so another household member does not reconnect them during cleanup.\n\n## Separate salvage decisions from convenience\nA refrigerator, washer, power tool, extension lead, charger, inverter, or medical device may contain water or contamination where it cannot be seen. Do not use warmth, sun, or a few dry days as evidence that internal insulation and safety components are sound. For safety-critical or high-power equipment, qualified inspection/manufacturer guidance should determine whether the item can return to service.\n\n## Preserve evidence before disposal\nPhotograph the appliance, model/serial number, water level or damage, and power status before disposal if insurance or assistance may apply. Record whether it was energized during the flood and any burning smell, tripped protection, visible corrosion, or damaged cord. This history also helps an electrician prioritize the inspection.\n\n## Verification sources\n- CDC — Electrical Hazards After Disasters: https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-from-electrical-hazards.html\n- CDC — Reentering a Flooded Home: https://www.cdc.gov/floods/safety/reentering-your-flooded-home-safety.html\n\nVerification date: 2026-08-09."},"el":{"title":"Βρεγμένες Ηλεκτρικές Συσκευές: Όχι «Στέγνωσε και Δοκίμασε»","body":"Συσκευή που βυθίστηκε, βράχηκε από νερό πλημμύρας ή δέχτηκε νερό στα ηλεκτρικά της μέρη μπορεί να παραμένει κίνδυνος ηλεκτροπληξίας ή φωτιάς ακόμη και όταν στεγνώσει εξωτερικά. Η σωστή ροή αποκατάστασης είναι απομόνωση, τεκμηρίωση, ειδικευμένος έλεγχος και αντικατάσταση όπου απαιτείται — όχι επαναλαμβανόμενες δοκιμές στην πρίζα.\n\n## Απομόνωσε πριν από την ηλεκτρική αποκατάσταση\nΑν κυκλώματα ή εξοπλισμός βρίσκονται μέσα ή κοντά σε νερό, το CDC προτείνει διακοπή ρεύματος μόνο όταν ο διακόπτης είναι προσβάσιμος χωρίς να μπεις στο νερό· αλλιώς χρειάζεται ειδικευμένος ηλεκτρολόγος. Μην στέκεσαι σε νερό για χειρισμό ηλεκτρικού πίνακα ή εργαλείων. Σημείωσε κυκλώματα και συσκευές που πλημμύρισαν ώστε άλλο μέλος να μην τα επανασυνδέσει κατά λάθος στον καθαρισμό.\n\n## Χώρισε την απόφαση διάσωσης από την ευκολία\nΨυγείο, πλυντήριο, ηλεκτρικό εργαλείο, μπαλαντέζα, φορτιστής, μετατροπέας ή ιατρική συσκευή μπορεί να κρατά νερό/ρύπανση εκεί που δεν φαίνεται. Μην θεωρείς ότι λίγες ημέρες στον ήλιο αποδεικνύουν ότι εσωτερική μόνωση και εξαρτήματα ασφάλειας είναι σωστά. Για κρίσιμο ή υψηλής ισχύος εξοπλισμό, ειδικευμένος έλεγχος και οδηγίες κατασκευαστή πρέπει να καθορίζουν την επιστροφή σε χρήση.\n\n## Κράτησε αποδείξεις πριν την απόρριψη\nΦωτογράφισε συσκευή, μοντέλο/σειριακό αριθμό, ύψος νερού ή ζημιά και κατάσταση τροφοδοσίας πριν την απόρριψη αν μπορεί να υπάρξει ασφαλιστική ή άλλη αποζημίωση. Κατάγραψε αν ήταν υπό τάση κατά την πλημμύρα και τυχόν μυρωδιά καμένου, πεσμένη προστασία, διάβρωση ή κατεστραμμένο καλώδιο. Αυτό το ιστορικό βοηθά και τον ηλεκτρολόγο να ιεραρχήσει τον έλεγχο.\n\n## Πηγές επαλήθευσης\n- CDC — ηλεκτρικοί κίνδυνοι μετά από καταστροφή: https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-from-electrical-hazards.html\n- CDC — επανείσοδος σε πλημμυρισμένο σπίτι: https://www.cdc.gov/floods/safety/reentering-your-flooded-home-safety.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":144,"en":{"title":"Roof and Ladder Decisions After Storm, Fire, or Earthquake Damage","body":"Post-disaster property inspection creates a strong temptation to climb for a better view. Damaged roofs, wet tiles, loose parapets, hidden structural weakness, nearby power lines, smoke damage, and wind can turn a routine ladder task into a high-consequence fall. The safest inspection is often from the ground with photographs or by a qualified professional.\n\n## Set a no-climb threshold\nDo not climb when the roof or supporting structure may be fire-, earthquake-, or water-damaged; when surfaces are wet/icy; when wind is strong; when power lines are nearby; when the ladder cannot stand on firm level ground; or when the person is fatigued, injured, or working alone. A damaged building is not the place to learn ladder technique for the first time.\n\n## Use remote observation first\nFrom a safe position, document displaced roofing, sagging, cracks, fallen masonry, damaged solar panels/antennas, water entry, and debris. Mark interior areas below suspected damage as restricted until assessed. If tarping or emergency repair requires roof access, treat it as skilled work and use professionals where available rather than trading property protection for a serious injury.\n\n## Keep the ground zone controlled\nFalling tiles, glass, branches, tools, and sections of gutter can injure people below even when no one is on the roof. Establish a perimeter and keep children, animals, and unnecessary helpers away. Watch for overhead electrical service and damaged trees before moving long ladders or poles.\n\n## Verification anchors\n- CDC/NIOSH disaster cleanup guidance emphasizes hazard inspection and avoiding unsafe fire-damaged roofs/structures.\n- Qualified structural, roofing, electrical, and fire professionals should control return-to-work decisions after significant damage.\n\nVerification date: 2026-08-09."},"el":{"title":"Αποφάσεις για Στέγη και Σκάλα Μετά από Καταιγίδα, Φωτιά ή Σεισμό","body":"Μετά από καταστροφή υπάρχει ισχυρός πειρασμός να ανέβει κάποιος ψηλά για «καλύτερη εικόνα». Κατεστραμμένη στέγη, βρεγμένα κεραμίδια, χαλαρά στηθαία, κρυφή δομική αδυναμία, κοντινά καλώδια, ζημιές από φωτιά και άνεμος μπορούν να μετατρέψουν μια συνηθισμένη σκάλα σε πτώση με σοβαρές συνέπειες. Συχνά η ασφαλέστερη επιθεώρηση γίνεται από το έδαφος με φωτογραφίες ή από ειδικευμένο επαγγελματία.\n\n## Όρισε σαφές όριο «δεν ανεβαίνουμε»\nΜην ανεβαίνεις όταν η στέγη ή η υποστήριξη μπορεί να έχει υποστεί ζημιά από φωτιά, σεισμό ή νερό· όταν η επιφάνεια είναι βρεγμένη/παγωμένη· όταν φυσά έντονα· όταν υπάρχουν ηλεκτρικές γραμμές κοντά· όταν η σκάλα δεν πατά σε σταθερό επίπεδο έδαφος· ή όταν ο χειριστής είναι κουρασμένος, τραυματισμένος ή μόνος. Ένα κατεστραμμένο κτίριο δεν είναι χώρος για να μάθει κάποιος πρώτη φορά χρήση σκάλας.\n\n## Ξεκίνα με παρατήρηση από απόσταση\nΑπό ασφαλές σημείο κατέγραψε μετακινημένα κεραμίδια, καθιζήσεις, ρωγμές, πεσμένη τοιχοποιία, ζημιές σε φωτοβολταϊκά/κεραίες, εισροή νερού και συντρίμμια. Σημείωσε εσωτερικές ζώνες κάτω από ύποπτα σημεία ως περιορισμένες μέχρι να αξιολογηθούν. Αν προσωρινή κάλυψη ή επισκευή απαιτεί πρόσβαση στη στέγη, αντιμετώπισέ την ως εξειδικευμένη εργασία και χρησιμοποίησε επαγγελματία όπου είναι δυνατό αντί να ανταλλάξεις υλική ζημιά με σοβαρό τραυματισμό.\n\n## Έλεγξε και τη ζώνη εδάφους\nΠτώση κεραμιδιών, γυαλιών, κλαδιών, εργαλείων ή υδρορροών μπορεί να τραυματίσει όσους βρίσκονται κάτω ακόμη κι αν κανείς δεν έχει ανέβει. Δημιούργησε περίμετρο και κράτησε παιδιά, ζώα και άσκοπους βοηθούς μακριά. Έλεγξε εναέρια ηλεκτρική παροχή και κατεστραμμένα δέντρα πριν μετακινήσεις μακριές σκάλες ή κοντάρια.\n\n## Πηγές επαλήθευσης\n- Η καθοδήγηση CDC/NIOSH για καθαρισμό μετά από καταστροφή δίνει έμφαση στην επιθεώρηση κινδύνων και στην αποφυγή μη ασφαλών, κατεστραμμένων από φωτιά στεγών/δομών.\n- Μετά από σημαντική ζημιά, ειδικοί δομικών, στέγης, ηλεκτρικών και πυρασφάλειας πρέπει να καθορίζουν την ασφαλή επιστροφή σε εργασία.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":145,"en":{"title":"Chain Saw and Fallen-Tree Cleanup After a Disaster","body":"Fallen trees after storms, wildfire, or earthquakes can be under compression, tension, or torsion that is not obvious from appearance. A chain saw cuts quickly but can also release a bent limb, roll a trunk, strike a hidden object, or kick back. CDC recommends trained and experienced operators for disaster tree removal and appropriate protective equipment.\n\n## Decide whether the job is household work at all\nDo not cut trees or limbs touching or near power lines. Avoid unstable trees, hanging limbs, partially uprooted trunks, fire-weakened trees, and situations where the cut can move a structure or vehicle unexpectedly. If the operator cannot explain the escape path and what the wood is likely to do when the cut closes or opens, the task belongs with a trained professional.\n\n## Prepare the saw and the work zone\nUse the manufacturer’s instructions, correct chain tension/lubrication, functioning safety features, and PPE appropriate to chain-saw work. Keep bystanders out of the cutting zone. Clear stable footing and an escape route before starting. Do not work from a ladder with a saw or make overhead cuts as a casual cleanup shortcut.\n\n## Fatigue changes the risk\nDisaster cleanup encourages long hours and rushed decisions. Stop for loss of concentration, poor footing, heat stress, worsening weather, failing light, equipment faults, or unexpected movement in the tree. A job that looked simple can change when tension is released; pause and reassess rather than “finishing the cut quickly.”\n\n## Verification source\n- CDC — Chain Saw Safety: https://www.cdc.gov/natural-disasters/safety/chain-saw-safety.html\n\nVerification date: 2026-08-09."},"el":{"title":"Αλυσοπρίονο και Καθαρισμός Πεσμένων Δέντρων Μετά από Καταστροφή","body":"Πεσμένα δέντρα μετά από καταιγίδα, φωτιά ή σεισμό μπορεί να βρίσκονται υπό πίεση, έλξη ή στρέψη που δεν φαίνεται με την πρώτη ματιά. Το αλυσοπρίονο κόβει γρήγορα, αλλά μπορεί επίσης να απελευθερώσει ξαφνικά λυγισμένο κλαδί, να κυλήσει κορμό, να χτυπήσει κρυμμένο αντικείμενο ή να κλωτσήσει προς τον χειριστή. Το CDC προτείνει εκπαιδευμένους και έμπειρους χειριστές για απομάκρυνση δέντρων μετά από καταστροφή και κατάλληλο προστατευτικό εξοπλισμό.\n\n## Αποφάσισε αν η εργασία ανήκει πράγματι στο νοικοκυριό\nΜην κόβεις δέντρα ή κλαδιά που ακουμπούν ή βρίσκονται κοντά σε ηλεκτρικές γραμμές. Απόφυγε ασταθή δέντρα, κρεμασμένα κλαδιά, μισοξεριζωμένους κορμούς, δέντρα εξασθενημένα από φωτιά και περιπτώσεις όπου η κοπή μπορεί να μετακινήσει απρόβλεπτα κτίριο ή όχημα. Αν ο χειριστής δεν μπορεί να εξηγήσει τη διαδρομή διαφυγής και τι πιθανόν θα κάνει το ξύλο όταν ανοίξει ή κλείσει η τομή, χρειάζεται ειδικευμένος επαγγελματίας.\n\n## Ετοίμασε πριόνι και ζώνη εργασίας\nΑκολούθησε το εγχειρίδιο κατασκευαστή, σωστή τάση/λίπανση αλυσίδας, λειτουργικά εξαρτήματα ασφάλειας και κατάλληλα μέσα ατομικής προστασίας. Κράτησε παρευρισκόμενους έξω από τη ζώνη κοπής. Εξασφάλισε σταθερό πάτημα και οδό διαφυγής πριν ξεκινήσεις. Μην χρησιμοποιείς αλυσοπρίονο πάνω σε σκάλα και μην κάνεις κοπές πάνω από το ύψος σου ως πρόχειρη λύση καθαρισμού.\n\n## Η κόπωση αλλάζει τον κίνδυνο\nΟ καθαρισμός μετά από καταστροφή οδηγεί εύκολα σε πολλές ώρες και βιαστικές αποφάσεις. Σταμάτησε αν χαθεί συγκέντρωση, χαλάσει το πάτημα, εμφανιστεί θερμική καταπόνηση, χειροτερέψει ο καιρός, πέσει το φως, εμφανιστεί βλάβη εξοπλισμού ή κινηθεί απρόβλεπτα το δέντρο. Μια εργασία που φαινόταν απλή μπορεί να αλλάξει όταν απελευθερωθεί τάση· σταμάτησε και επανεκτίμησε αντί να «τελειώσεις γρήγορα την κοπή».\n\n## Πηγή επαλήθευσης\n- CDC — ασφάλεια αλυσοπρίονου: https://www.cdc.gov/natural-disasters/safety/chain-saw-safety.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":146,"en":{"title":"Household Cleaning Chemicals After a Disaster: Mixing and Ventilation Boundaries","body":"Cleanup after flood, sewage, mold, or illness often increases the amount of bleach, detergent, disinfectant, and other chemicals used in a small space. The emergency itself may also reduce ventilation. A strong-smelling mixture is not a sign that disinfection is “working better”; incompatible products can release dangerous gases or cause burns.\n\n## Use one product plan at a time\nRead the product label and use the concentration, contact time, surface compatibility, PPE, and ventilation it specifies. Never mix bleach with ammonia or other cleaners. Do not pour leftover products into unlabelled drink bottles or combine partial containers to save space. Keep chemicals out of the food/water zone and where children or confused occupants cannot access them.\n\n## Ventilation is part of the task\nIf the label calls for ventilation, make sure fresh air can enter without creating another immediate hazard such as wildfire smoke, a chemical plume, or unsafe outdoor conditions. Stop if occupants develop eye/throat irritation, dizziness, breathing difficulty, or other concerning symptoms and move to clean air. Do not continue because “the room is almost finished.”\n\n## Disinfection does not replace removal\nMud, sewage, moldy porous materials, and flood-damaged debris often require physical removal and drying; simply adding more disinfectant does not solve trapped moisture or structural contamination. Keep a record of what was cleaned, discarded, and still needs professional assessment.\n\n## Verification source\n- CDC — post-disaster cleaning chemical safety: https://www.cdc.gov/natural-disasters/safety/index.html\n\nVerification date: 2026-08-09."},"el":{"title":"Οικιακά Χημικά Καθαρισμού Μετά από Καταστροφή: Όρια Ανάμιξης και Αερισμού","body":"Ο καθαρισμός μετά από πλημμύρα, λύματα, μούχλα ή ασθένεια συχνά αυξάνει τη χρήση χλωρίνης, απορρυπαντικών, απολυμαντικών και άλλων χημικών σε μικρό χώρο. Ταυτόχρονα η ίδια η έκτακτη ανάγκη μπορεί να έχει μειώσει τον αερισμό. Ένα μίγμα με πολύ έντονη οσμή δεν σημαίνει ότι «απολυμαίνει καλύτερα»· ασύμβατα προϊόντα μπορούν να απελευθερώσουν επικίνδυνα αέρια ή να προκαλέσουν εγκαύματα.\n\n## Ένα σχέδιο προϊόντος κάθε φορά\nΔιάβασε την ετικέτα και χρησιμοποίησε τη συγκέντρωση, τον χρόνο επαφής, τη συμβατότητα επιφάνειας, τα μέσα προστασίας και τον αερισμό που ορίζει. Ποτέ μην αναμιγνύεις χλωρίνη με αμμωνία ή άλλα καθαριστικά. Μην μεταγγίζεις υπόλοιπα σε ανώνυμα μπουκάλια ποτού και μην ενώνεις διαφορετικά δοχεία για οικονομία χώρου. Κράτησε τα χημικά μακριά από ζώνη τροφίμων/νερού και από παιδιά ή άτομα με σύγχυση.\n\n## Ο αερισμός είναι μέρος της εργασίας\nΑν η ετικέτα απαιτεί αερισμό, εξασφάλισε καθαρό αέρα χωρίς να δημιουργείς άλλο άμεσο κίνδυνο, όπως καπνό πυρκαγιάς, χημικό νέφος ή μη ασφαλείς εξωτερικές συνθήκες. Σταμάτησε αν εμφανιστεί ερεθισμός ματιών/λαιμού, ζάλη, δυσκολία αναπνοής ή άλλο ανησυχητικό σύμπτωμα και μετακινήσου σε καθαρό αέρα. Μην συνεχίζεις επειδή «μένει λίγο ακόμη».\n\n## Η απολύμανση δεν αντικαθιστά την αφαίρεση\nΛάσπη, λύματα, μουχλιασμένα πορώδη υλικά και συντρίμμια πλημμύρας συχνά χρειάζονται φυσική αφαίρεση και στέγνωμα· περισσότερη ποσότητα απολυμαντικού δεν διορθώνει παγιδευμένη υγρασία ή δομική ρύπανση. Κράτησε αρχείο τι καθαρίστηκε, τι απορρίφθηκε και τι εξακολουθεί να χρειάζεται επαγγελματική αξιολόγηση.\n\n## Πηγή επαλήθευσης\n- CDC — ασφάλεια χημικών κατά τον καθαρισμό μετά από καταστροφή: https://www.cdc.gov/natural-disasters/safety/index.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":147,"en":{"title":"Refrigeration Failure: Ice, Coolers, Thermometers, and Food Decisions","body":"A cooler can extend food safety during an outage only if it is treated as temperature-controlled storage rather than a box that contains ice. The household needs thermometers, a cold source, limited opening, separation from meltwater/contamination, and a clear discard decision when safe temperature history is lost.\n\n## Protect temperature history\nRecord outage start and keep refrigerator/freezer doors closed as much as possible. CDC guidance notes that, when unopened, a refrigerator generally keeps food cold for about four hours and a full freezer about 48 hours (about 24 hours if half-full). These are planning figures, not permission to ignore actual food temperature or a longer/warmer exposure. Use an appliance or food thermometer where available.\n\n## Build the cooler before the refrigerator warms\nIf an extended outage is expected and a safe ice/cold source is available, move priority perishables deliberately rather than repeatedly opening the refrigerator. Keep raw animal products contained so meltwater cannot contaminate ready-to-eat food. Replace melting ice as needed and monitor temperature. Do not taste questionable food to decide whether it is safe.\n\n## Dry ice requires its own safety plan\nDry ice can keep items cold but produces carbon dioxide gas and can cause cold injury on contact. Use manufacturer/public-health safety guidance, appropriate gloves/tools, and ventilation; never create a sealed container that can pressurize. Do not place dry ice where children can handle it or in an occupied, poorly ventilated enclosure.\n\n## Separate food decisions from medicine decisions\nA cooler used for food is not automatically suitable for temperature-sensitive medicine, breast milk, or formula. Those materials have product/clinical storage rules of their own. Mark each container and preserve its temperature/time history separately.\n\n## Verification sources\n- CDC — Food Safety After a Disaster: https://www.cdc.gov/food-safety/foods/keep-food-safe-after-emergency.html\n- CDC — Breast Milk Storage Questions and Answers: https://www.cdc.gov/breastfeeding/php/guidelines-recommendations/faqs.html\n\nVerification date: 2026-08-09."},"el":{"title":"Αστοχία Ψύξης: Πάγος, Φορητά Ψυγεία, Θερμόμετρα και Αποφάσεις Τροφίμων","body":"Ένα φορητό ψυγείο μπορεί να επεκτείνει την ασφάλεια τροφίμων σε διακοπή μόνο αν αντιμετωπίζεται ως χώρος ελεγχόμενης θερμοκρασίας και όχι ως κουτί που απλώς έχει πάγο. Χρειάζονται θερμόμετρο, ψυχρή πηγή, περιορισμένο άνοιγμα, προστασία από νερά τήξης/ρύπανση και σαφής απόφαση απόρριψης όταν χαθεί το ιστορικό ασφαλούς θερμοκρασίας.\n\n## Προστάτευσε το ιστορικό θερμοκρασίας\nΚατάγραψε την έναρξη της διακοπής και κράτησε πόρτες ψυγείου/κατάψυξης κλειστές όσο γίνεται. Η καθοδήγηση του CDC αναφέρει ότι, όταν δεν ανοίγει, ένα ψυγείο γενικά διατηρεί τα τρόφιμα κρύα περίπου τέσσερις ώρες και ένας γεμάτος καταψύκτης περίπου 48 ώρες (περίπου 24 ώρες αν είναι μισογεμάτος). Αυτά είναι στοιχεία σχεδιασμού και όχι άδεια να αγνοηθεί η πραγματική θερμοκρασία ή μεγαλύτερη έκθεση. Χρησιμοποίησε θερμόμετρο συσκευής ή τροφίμων όπου είναι διαθέσιμο.\n\n## Ετοίμασε το φορητό ψυγείο πριν ζεσταθεί το κανονικό\nΑν αναμένεται μεγάλη διακοπή και υπάρχει ασφαλής πηγή πάγου/ψύξης, μετακίνησε επιλεγμένα ευπαθή τρόφιμα οργανωμένα αντί να ανοίγεις συνεχώς το ψυγείο. Κράτησε ωμά ζωικά προϊόντα κλειστά ώστε νερό από λιώσιμο να μην μολύνει έτοιμο φαγητό. Αναπλήρωσε τον πάγο όταν χρειάζεται και παρακολούθησε θερμοκρασία. Μην δοκιμάζεις ύποπτο τρόφιμο για να αποφασίσεις αν είναι ασφαλές.\n\n## Ο ξηρός πάγος χρειάζεται δικό του σχέδιο ασφάλειας\nΟ ξηρός πάγος μπορεί να διατηρήσει χαμηλή θερμοκρασία αλλά παράγει διοξείδιο του άνθρακα και προκαλεί ψυχρό τραυματισμό σε επαφή. Ακολούθησε οδηγίες ασφάλειας κατασκευαστή/δημόσιας υγείας, χρησιμοποίησε κατάλληλα γάντια/εργαλεία και αερισμό· μην τον κλείνεις σε δοχείο που μπορεί να αναπτύξει πίεση. Μην τον αφήνεις σε σημείο όπου τον αγγίζουν παιδιά ή σε κακώς αεριζόμενο χώρο με ανθρώπους.\n\n## Χώρισε τις αποφάσεις τροφίμων από τις αποφάσεις φαρμάκων\nΦορητό ψυγείο τροφίμων δεν είναι αυτόματα κατάλληλο για θερμοευαίσθητο φάρμακο, μητρικό γάλα ή φόρμουλα. Αυτά έχουν δικούς τους κανόνες προϊόντος/κλινικής αποθήκευσης. Σημείωσε κάθε δοχείο και κράτησε ξεχωριστό ιστορικό χρόνου/θερμοκρασίας.\n\n## Πηγές επαλήθευσης\n- CDC — ασφάλεια τροφίμων μετά από καταστροφή: https://www.cdc.gov/food-safety/foods/keep-food-safe-after-emergency.html\n- CDC — ερωτήσεις αποθήκευσης μητρικού γάλακτος: https://www.cdc.gov/breastfeeding/php/guidelines-recommendations/faqs.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":148,"en":{"title":"High-Rise Elevator Loss: Mobility and Evacuation Planning","body":"Elevator loss changes a high-rise emergency plan long before a fire occurs. A person who can normally leave independently may become dependent on stairs, a transfer device, a trained helper, or a protected waiting/assistance procedure defined by the building and local fire service. The plan therefore begins with building-specific information, not an improvised stair carry.\n\n## Know the building’s real options\nIdentify at least two stair routes where the building provides them, areas of refuge or protected waiting spaces if officially designated, fire-alarm locations, emergency intercoms, and who manages evacuation assistance. Ready.gov advises using stairs rather than elevators in emergency evacuation contexts unless responders direct otherwise. Ask the building manager how mobility-limited residents are included in the official plan and whether evacuation chairs exist, who may use them, and what training is required.\n\n## Separate power outage from fire\nDuring a simple outage, remaining in a safe apartment may be preferable to an unsafe manual descent; during fire, smoke, structural danger, or an official evacuation order, the decision can be entirely different. Do not treat an elevator returning to service as proof that the building is safe. Keep medication, water, communication devices, mobility aids, shoes, and identification accessible so a delayed evacuation does not become a rushed packing event.\n\n## Never improvise a dangerous carry\nUntrained people carrying a wheelchair or person down stairs can injure both the occupant and helpers. Pre-arrange assistance with the building, care network, or emergency services, and practice only the procedures and equipment that responsible organizations approve.\n\n## Verification sources\n- Ready.gov — Plan for Locations: https://www.ready.gov/plan-for-locations\n- Ready.gov — Disability Preparedness: https://www.ready.gov/disability\n\nVerification date: 2026-08-09."},"el":{"title":"Πολυώροφο Κτίριο Χωρίς Ανελκυστήρα: Κινητικότητα και Εκκένωση","body":"Η απώλεια ανελκυστήρα αλλάζει το σχέδιο ενός πολυώροφου κτιρίου πολύ πριν εμφανιστεί φωτιά. Άτομο που συνήθως βγαίνει μόνο του μπορεί να εξαρτηθεί από σκάλες, συσκευή μεταφοράς, εκπαιδευμένο βοηθό ή προστατευμένη διαδικασία αναμονής που έχει ορίσει το κτίριο και η πυροσβεστική υπηρεσία. Το σχέδιο ξεκινά λοιπόν από πραγματικές διαδικασίες του κτιρίου και όχι από αυτοσχέδια μεταφορά σε σκάλα.\n\n## Μάθε τις πραγματικές επιλογές\nΕντόπισε τουλάχιστον δύο διαδρομές κλιμακοστασίου όπου υπάρχουν, χώρους καταφυγής ή προστατευμένης αναμονής αν έχουν επίσημα οριστεί, θέσεις συναγερμού, ενδοεπικοινωνία έκτακτης ανάγκης και ποιος συντονίζει βοήθεια εκκένωσης. Το Ready.gov προτείνει χρήση σκάλας αντί ανελκυστήρα σε περιπτώσεις εκκένωσης, εκτός αν οι διασώστες δώσουν άλλη οδηγία. Ρώτησε τη διαχείριση πώς εντάσσονται άτομα με περιορισμένη κινητικότητα και αν υπάρχουν καρέκλες εκκένωσης, ποιος επιτρέπεται να τις χρησιμοποιεί και ποια εκπαίδευση απαιτείται.\n\n## Χώρισε τη διακοπή ρεύματος από τη φωτιά\nΣε απλή διακοπή μπορεί να είναι ασφαλέστερη η παραμονή σε κατάλληλο διαμέρισμα από μια επικίνδυνη χειροκίνητη κάθοδο· σε φωτιά, καπνό, δομικό κίνδυνο ή επίσημη εντολή εκκένωσης η απόφαση αλλάζει. Η επιστροφή του ανελκυστήρα δεν αποδεικνύει ότι το κτίριο είναι ασφαλές. Κράτησε φάρμακα, νερό, επικοινωνία, βοηθήματα κινητικότητας, παπούτσια και ταυτοποίηση προσβάσιμα ώστε μια καθυστερημένη εκκένωση να μη γίνει βιαστικό πακετάρισμα.\n\n## Μην αυτοσχεδιάζεις επικίνδυνη μεταφορά\nΜη εκπαιδευμένοι άνθρωποι που μεταφέρουν αναπηρικό αμαξίδιο ή άτομο σε σκάλες μπορούν να τραυματίσουν και τον επιβάτη και τους βοηθούς. Προσυνεννοήσου με διαχείριση, δίκτυο φροντίδας ή υπηρεσίες έκτακτης ανάγκης και εξασκήσου μόνο σε διαδικασίες/εξοπλισμό που έχουν εγκριθεί από αρμόδιο φορέα.\n\n## Πηγές επαλήθευσης\n- Ready.gov — σχεδιασμός ανά τοποθεσία: https://www.ready.gov/plan-for-locations\n- Ready.gov — ετοιμότητα για αναπηρία: https://www.ready.gov/disability\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":149,"en":{"title":"Medical Oxygen: Fire-Safe Continuity During Disruption","body":"Medical oxygen supports care but changes the fire environment because oxygen-enriched materials ignite more easily and burn more intensely. During an outage, the temptation to add candles, portable heaters, cooking flames, generators, or improvised charging near the patient can increase the danger.\n\n## Build an oxygen-safe zone\nKeep cylinders and oxygen equipment away from open flames, smoking, heat sources, and activities that can create sparks. U.S. Fire Administration guidance specifically warns against flames near medical oxygen. Maintain the route to exits and do not surround the equipment with bags, bedding, paper supplies, or fuel containers during evacuation staging.\n\n## Continuity is more than cylinder count\nRecord supplier, device type, flow/settings only as already prescribed, cylinder/concentrator inventory, power requirement, backup duration, transport method, and the next resupply contact. Do not change prescribed oxygen settings to “make it last longer.” If a concentrator requires electricity, connect its power plan to the relocation trigger for power-dependent devices.\n\n## Treat fire or heat exposure as an emergency\nDo not use cylinders or regulators that have been damaged, involved in fire, contaminated, or exposed in a way the supplier considers unsafe. If a fire starts, evacuation takes priority; household members should not remain inside to retrieve oxygen equipment. Tell responders that medical oxygen is present and where it is normally stored.\n\n## Verification source\n- U.S. Fire Administration — Oxygen Tank Safety: https://www.usfa.fema.gov/gallery/pictographs/pictograph45.html\n\nVerification date: 2026-08-09."},"el":{"title":"Ιατρικό Οξυγόνο: Συνέχεια με Πυρασφάλεια σε Διακοπή","body":"Το ιατρικό οξυγόνο υποστηρίζει τη φροντίδα αλλά αλλάζει το περιβάλλον φωτιάς, επειδή υλικά σε αυξημένο οξυγόνο αναφλέγονται ευκολότερα και καίγονται εντονότερα. Σε διακοπή ρεύματος ο πειρασμός για κεριά, φορητές θερμάστρες, φλόγες μαγειρέματος, γεννήτριες ή πρόχειρη φόρτιση κοντά στον ασθενή αυξάνει τον κίνδυνο.\n\n## Δημιούργησε ζώνη ασφαλή για οξυγόνο\nΚράτησε φιάλες και εξοπλισμό μακριά από γυμνή φλόγα, κάπνισμα, πηγές θερμότητας και δραστηριότητες που δημιουργούν σπινθήρες. Η U.S. Fire Administration προειδοποιεί ειδικά για φλόγες κοντά σε ιατρικό οξυγόνο. Διατήρησε ελεύθερη τη διαδρομή προς εξόδους και μην περικλείεις τον εξοπλισμό με τσάντες, κλινοσκεπάσματα, χαρτιά ή δοχεία καυσίμου κατά την προετοιμασία εκκένωσης.\n\n## Η συνέχεια δεν είναι μόνο αριθμός φιαλών\nΚατάγραψε προμηθευτή, τύπο συσκευής, ροή/ρυθμίσεις μόνο όπως έχουν ήδη συνταγογραφηθεί, απόθεμα φιαλών/συμπυκνωτή, ανάγκη ρεύματος, εφεδρική διάρκεια, τρόπο μεταφοράς και επόμενη επαφή ανεφοδιασμού. Μην αλλάζεις συνταγογραφημένες ρυθμίσεις για να «κρατήσει περισσότερο». Αν ο συμπυκνωτής χρειάζεται ρεύμα, σύνδεσε το σχέδιο ισχύος με το κριτήριο μετακίνησης για ιατρικές συσκευές.\n\n## Φωτιά ή θερμική έκθεση σημαίνουν κλιμάκωση\nΜην χρησιμοποιείς φιάλες ή ρυθμιστές που έχουν υποστεί ζημιά, εμπλακεί σε φωτιά, μολυνθεί ή εκτεθεί με τρόπο που ο προμηθευτής θεωρεί μη ασφαλή. Αν ξεκινήσει φωτιά, προτεραιότητα έχει η εκκένωση· κανείς δεν πρέπει να μένει μέσα για ανάκτηση εξοπλισμού οξυγόνου. Ενημέρωσε τους διασώστες ότι υπάρχει ιατρικό οξυγόνο και πού αποθηκεύεται συνήθως.\n\n## Πηγή επαλήθευσης\n- U.S. Fire Administration — ασφάλεια φιάλης οξυγόνου: https://www.usfa.fema.gov/gallery/pictographs/pictograph45.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":150,"en":{"title":"Damaged Lithium-Ion Batteries and Power Banks: Stop-Use and Isolation Decisions","body":"Portable batteries are valuable during outages, but a swollen, overheating, smoking, hissing, leaking, recalled, crushed, or water-damaged lithium-ion device should not be treated as a reduced-capacity battery. It may be a fire hazard whose condition can worsen after the initial damage.\n\n## Recognize a stop-use condition\nRemove a suspect device from charging and ordinary service when it shows abnormal swelling, heat, odor, smoke, popping/hissing, damaged casing, exposed cells, or a relevant safety recall. Do not puncture, squeeze, dismantle, or repeatedly “test charge” it. Keep people away and follow local fire/emergency guidance if there is active heating, smoke, or fire.\n\n## Do not hide it in normal waste\nCPSC warnings for defective lithium-ion power banks instruct users not to put hazardous batteries in household trash or ordinary recycling streams; disposal should follow the process for damaged/defective batteries available locally. Before transport, ask the receiving hazardous-waste/recycling service how they accept damaged lithium batteries rather than placing one loosely in a bag with metal objects.\n\n## Protect the outage reserve from one failing pack\nStore active backup packs so one overheating device does not sit against medicines, documents, bedding, fuel, or all other batteries. Log model/serial information and recalls. Rotate batteries by condition and tested capacity, not merely by purchase date.\n\n## Verification source\n- U.S. Consumer Product Safety Commission battery recall/warning guidance: https://www.cpsc.gov/Recalls\n\nVerification date: 2026-08-09."},"el":{"title":"Κατεστραμμένες Μπαταρίες Λιθίου και Power Banks: Διακοπή Χρήσης και Απομόνωση","body":"Οι φορητές μπαταρίες είναι πολύτιμες σε διακοπή ρεύματος, αλλά διογκωμένη, υπερθερμασμένη, καπνίζουσα, συρίζουσα, διαρρέουσα, ανακληθείσα, χτυπημένη ή βρεγμένη μπαταρία ιόντων λιθίου δεν είναι απλώς «μπαταρία με μικρότερη χωρητικότητα». Μπορεί να είναι κίνδυνος φωτιάς που επιδεινώνεται μετά την αρχική βλάβη.\n\n## Αναγνώρισε πότε σταματά η χρήση\nΒγάλε ύποπτη συσκευή από φόρτιση και κανονική χρήση όταν παρουσιάζει ασυνήθιστο φούσκωμα, θερμότητα, οσμή, καπνό, ήχους, σπασμένο περίβλημα, εκτεθειμένα στοιχεία ή σχετική ανάκληση. Μην την τρυπάς, πιέζεις, αποσυναρμολογείς ή επαναλαμβάνεις «δοκιμαστικές φορτίσεις». Κράτησε ανθρώπους μακριά και ακολούθησε τοπική πυροσβεστική/έκτακτη καθοδήγηση αν υπάρχει ενεργή θέρμανση, καπνός ή φωτιά.\n\n## Μην την κρύψεις στα κοινά απορρίμματα\nΠροειδοποιήσεις της CPSC για ελαττωματικά power banks λένε ότι επικίνδυνες μπαταρίες δεν πρέπει να μπαίνουν στα οικιακά απορρίμματα ή στη συνηθισμένη ανακύκλωση· η διάθεση ακολουθεί την τοπική διαδικασία για κατεστραμμένες/ελαττωματικές μπαταρίες. Πριν τη μεταφορά, ρώτησε την αρμόδια εγκατάσταση πώς παραλαμβάνει τέτοιες μπαταρίες αντί να τη βάλεις χύμα σε σακούλα με μεταλλικά αντικείμενα.\n\n## Προστάτευσε όλο το απόθεμα από μία αποτυχημένη μπαταρία\nΑποθήκευσε ενεργά εφεδρικά πακέτα έτσι ώστε μία υπερθέρμανση να μην βρίσκεται δίπλα σε φάρμακα, έγγραφα, κλινοσκεπάσματα, καύσιμα ή όλες τις άλλες μπαταρίες. Κατάγραψε μοντέλο/σειριακό αριθμό και ανακλήσεις. Κάνε εναλλαγή με βάση κατάσταση και δοκιμασμένη χωρητικότητα, όχι μόνο ημερομηνία αγοράς.\n\n## Πηγή επαλήθευσης\n- U.S. Consumer Product Safety Commission — ανακλήσεις/προειδοποιήσεις μπαταριών: https://www.cpsc.gov/Recalls\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":151,"en":{"title":"Floodwater Wounds: Cleaning, Documentation, and Tetanus Follow-Up","body":"Floodwater can carry sewage, debris, chemicals, and sharp objects. A cut acquired during cleanup should not disappear into the incident log as a minor inconvenience, because contamination and vaccination history may affect follow-up.\n\n## Get the wound out of floodwater\nStop work, move to a clean area, and clean open wounds with soap and clean water as CDC disaster guidance recommends. Cover the wound appropriately for protection and prevent further floodwater contact. Deep punctures, bites, severe contamination, significant bleeding, loss of function, or signs of infection require professional assessment rather than continued cleanup.\n\n## Preserve the facts clinicians need\nRecord time, object/mechanism, whether floodwater or sewage contacted the wound, initial cleaning, current symptoms, and the person’s known tetanus vaccination history if available. Do not guess the date; mark it unknown when uncertain. Healthcare professionals can determine whether vaccination or other treatment is needed based on wound type and immunization history.\n\n## Fix the work process too\nA cleanup injury should trigger a review of gloves/boots, lighting, debris handling, tool choice, fatigue, and staffing. If one person was cut because sharp debris was carried loose through a dark route, treating only the wound leaves the next worker exposed to the same hazard.\n\n## Verification sources\n- CDC — Prevent Injury or Illness After a Disaster: https://www.cdc.gov/natural-disasters/response/index.html\n- CDC disaster guidance on wound/tetanus assessment should be followed through qualified healthcare services.\n\nVerification date: 2026-08-09."},"el":{"title":"Τραύματα από Νερό Πλημμύρας: Καθαρισμός, Καταγραφή και Έλεγχος Τετάνου","body":"Το νερό πλημμύρας μπορεί να περιέχει λύματα, συντρίμμια, χημικά και αιχμηρά αντικείμενα. Ένα κόψιμο κατά τον καθαρισμό δεν πρέπει να εξαφανίζεται στο ημερολόγιο ως μικρή ενόχληση, επειδή η ρύπανση και το ιστορικό εμβολιασμού μπορεί να αλλάζουν την παρακολούθηση.\n\n## Βγάλε το τραύμα από το νερό πλημμύρας\nΣταμάτησε την εργασία, πήγαινε σε καθαρή περιοχή και καθάρισε ανοιχτές πληγές με σαπούνι και καθαρό νερό όπως προτείνει η καθοδήγηση CDC. Κάλυψε κατάλληλα την πληγή και απέφυγε νέα επαφή με πλημμυρόνερο. Βαθιά διάτρηση, δάγκωμα, σοβαρή ρύπανση, σημαντική αιμορραγία, απώλεια λειτουργίας ή σημεία λοίμωξης χρειάζονται επαγγελματική αξιολόγηση και όχι συνέχιση της δουλειάς.\n\n## Κράτησε τα γεγονότα που χρειάζεται ο κλινικός\nΚατάγραψε ώρα, αντικείμενο/μηχανισμό, αν υπήρξε επαφή με νερό ή λύματα, αρχικό καθαρισμό, τρέχοντα συμπτώματα και το γνωστό ιστορικό εμβολιασμού τετάνου αν υπάρχει. Μην εφευρίσκεις ημερομηνία· σημείωσε «άγνωστη» όταν δεν υπάρχει βεβαιότητα. Επαγγελματίας υγείας αποφασίζει αν απαιτείται εμβολιασμός ή άλλη θεραπεία ανάλογα με τον τύπο τραύματος και το ιστορικό.\n\n## Διόρθωσε και τη διαδικασία εργασίας\nΈνας τραυματισμός στον καθαρισμό πρέπει να οδηγήσει σε έλεγχο γαντιών/μποτών, φωτισμού, μεταφοράς συντριμμιών, επιλογής εργαλείων, κόπωσης και στελέχωσης. Αν κάποιος κόπηκε επειδή αιχμηρά υλικά μεταφέρονταν χύμα σε σκοτεινή διαδρομή, η θεραπεία μόνο της πληγής αφήνει τον επόμενο εργαζόμενο στον ίδιο κίνδυνο.\n\n## Πηγές επαλήθευσης\n- CDC — πρόληψη τραυματισμών/ασθένειας μετά από καταστροφή: https://www.cdc.gov/natural-disasters/response/index.html\n- Η αξιολόγηση τραύματος και τετάνου πρέπει να γίνεται από κατάλληλη υπηρεσία υγείας σύμφωνα με την τρέχουσα καθοδήγηση.\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":152,"en":{"title":"Accessible Stairwell Evacuation and Buddy Accountability","body":"A “buddy” plan only works if the helpers, route, communication method, equipment, and fallback are defined before smoke, darkness, crowding, or an outage. It should add redundancy without making one neighbor solely responsible for another person’s life.\n\n## Pair the person with a small team\nIdentify a primary helper and at least one backup. Share only the information each helper needs: how to communicate, which mobility aid travels, whether a service animal is involved, where the go-kit is, and what the official building plan says about stairwells or protected waiting areas. If a helper is absent, the plan should still work through the backup/building system.\n\n## Keep the stair route usable\nDo not store kits or mobility devices in a way that blocks the escape path. Plan for darkness, hearing loss, low vision, respiratory limits, and handrail use. If a person cannot safely use stairs, do not improvise a carry; notify building management/emergency services and follow the building’s evacuation-assistance procedure.\n\n## Accountability continues outside\nThe helper role is not complete at the lobby. Move to the agreed meeting point, report missing people without re-entering, and preserve medical/communication support while waiting for responders. Record drill problems so the next exercise changes the plan instead of repeating the same failure.\n\n## Verification sources\n- Ready.gov — Disability Preparedness: https://www.ready.gov/disability\n- Ready.gov — Plan for Locations: https://www.ready.gov/plan-for-locations\n\nVerification date: 2026-08-09."},"el":{"title":"Προσβάσιμη Εκκένωση από Κλιμακοστάσιο και Σύστημα Συνοδού","body":"Ένα σχέδιο «συνοδού» λειτουργεί μόνο όταν βοηθοί, διαδρομή, τρόπος επικοινωνίας, εξοπλισμός και εναλλακτική έχουν οριστεί πριν εμφανιστούν καπνός, σκοτάδι, συνωστισμός ή διακοπή ρεύματος. Πρέπει να προσθέτει πλεονασμό χωρίς να κάνει έναν γείτονα μοναδικά υπεύθυνο για τη ζωή άλλου ανθρώπου.\n\n## Μικρή ομάδα αντί για έναν μόνο βοηθό\nΌρισε κύριο βοηθό και τουλάχιστον έναν αναπληρωτή. Μοιράσου μόνο όσα χρειάζεται κάθε βοηθός: πώς επικοινωνεί το άτομο, ποιο βοήθημα κινητικότητας ταξιδεύει, αν υπάρχει ζώο υπηρεσίας, πού είναι το κιτ και τι προβλέπει το επίσημο σχέδιο κτιρίου για κλιμακοστάσια ή προστατευμένη αναμονή. Αν λείπει ο κύριος βοηθός, το σχέδιο πρέπει να λειτουργεί με τον αναπληρωτή και το σύστημα του κτιρίου.\n\n## Διατήρησε τη διαδρομή σκάλας λειτουργική\nΜην αποθηκεύεις κιτ ή βοηθήματα έτσι ώστε να φράζουν την έξοδο. Σχεδίασε για σκοτάδι, απώλεια ακοής, χαμηλή όραση, αναπνευστικό περιορισμό και χρήση χειρολισθήρα. Αν κάποιος δεν μπορεί να χρησιμοποιήσει με ασφάλεια τις σκάλες, μην αυτοσχεδιάζεις μεταφορά· ενημέρωσε διαχείριση/υπηρεσίες έκτακτης ανάγκης και ακολούθησε τη διαδικασία βοήθειας του κτιρίου.\n\n## Η λογοδοσία συνεχίζεται έξω\nΟ ρόλος συνοδού δεν τελειώνει στο ισόγειο. Πήγαινε στο συμφωνημένο σημείο συνάντησης, δήλωσε αγνοούμενο χωρίς επανείσοδο και διατήρησε ιατρική/επικοινωνιακή υποστήριξη όσο περιμένεις. Κατάγραψε προβλήματα της άσκησης ώστε η επόμενη δοκιμή να αλλάξει το σχέδιο αντί να επαναλάβει την ίδια αστοχία.\n\n## Πηγές επαλήθευσης\n- Ready.gov — ετοιμότητα για αναπηρία: https://www.ready.gov/disability\n- Ready.gov — σχεδιασμός ανά τοποθεσία: https://www.ready.gov/plan-for-locations\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":153,"en":{"title":"Accessible Smoke Alarm Alerting for Hearing or Vision Limitations","body":"A smoke alarm is only protective if occupants can perceive it and act. Hearing loss, deep sleep, cognitive impairment, closed doors, background equipment noise, or a power outage can make an otherwise functional alarm ineffective for a particular person.\n\n## Test the alert with the person present\nDo not assume an alarm is audible from a bedroom because it is loud in the hall. Use the manufacturer’s test procedure and verify that every occupant can detect the signal in the circumstances in which they sleep. U.S. Fire Administration guidance notes that people who are deaf or hard of hearing may need devices such as strobes, bed shakers, or alternative audible signals.\n\n## Protect backup power and placement\nRecord battery type/replacement date or sealed-alarm replacement date, test schedule, and which alarms depend on building power. Never remove batteries to silence nuisance alarms. If an alerting accessory uses a separate receiver, charger, or bedside unit, include that device in the outage power budget.\n\n## Link alerting to evacuation assistance\nAn accessible alarm does not solve a blocked route or mobility limitation. Pair the alert method with an escape plan, helper/back-up helper, doors/exits that fit mobility equipment, and a meeting point. Test the entire chain during drills.\n\n## Verification source\n- U.S. Fire Administration — Fire Safety for Older Adults and accessibility messaging: https://www.usfa.fema.gov/prevention/home-fires/at-risk-audiences/older-adults/\n\nVerification date: 2026-08-09."},"el":{"title":"Προσβάσιμος Συναγερμός Καπνού για Περιορισμό Ακοής ή Όρασης","body":"Ένας συναγερμός καπνού προστατεύει μόνο αν οι ένοικοι μπορούν να τον αντιληφθούν και να ενεργήσουν. Απώλεια ακοής, βαθύς ύπνος, γνωστική διαταραχή, κλειστές πόρτες, θόρυβος εξοπλισμού ή διακοπή ρεύματος μπορούν να κάνουν έναν λειτουργικό συναγερμό αναποτελεσματικό για συγκεκριμένο άτομο.\n\n## Δοκίμασε την ειδοποίηση με το άτομο παρόν\nΜην θεωρείς ότι ο συναγερμός ακούγεται στο υπνοδωμάτιο επειδή είναι δυνατός στον διάδρομο. Χρησιμοποίησε τη διαδικασία δοκιμής του κατασκευαστή και επιβεβαίωσε ότι κάθε ένοικος αντιλαμβάνεται το σήμα στις συνθήκες όπου κοιμάται. Η U.S. Fire Administration αναφέρει ότι κωφοί ή βαρήκοοι μπορεί να χρειάζονται στροβοσκοπική ένδειξη, δονητή κρεβατιού ή εναλλακτικό ηχητικό σήμα.\n\n## Προστάτευσε εφεδρική ισχύ και συντήρηση\nΚατάγραψε τύπο μπαταρίας/ημερομηνία αλλαγής ή ημερομηνία αντικατάστασης κλειστού συναγερμού, πρόγραμμα δοκιμών και ποιοι συναγερμοί εξαρτώνται από το ρεύμα κτιρίου. Μην αφαιρείς μπαταρίες για να σταματήσεις ψευδή συναγερμό. Αν ένα βοήθημα ειδοποίησης έχει ξεχωριστό δέκτη, φορτιστή ή συσκευή δίπλα στο κρεβάτι, πρόσθεσέ το στον προϋπολογισμό ενέργειας διακοπής.\n\n## Σύνδεσε την ειδοποίηση με βοήθεια εκκένωσης\nΈνας προσβάσιμος συναγερμός δεν λύνει μπλοκαρισμένη διαδρομή ή περιορισμένη κινητικότητα. Σύνδεσε τον τρόπο ειδοποίησης με σχέδιο εξόδου, κύριο/εφεδρικό βοηθό, θύρες που χωρούν τον εξοπλισμό κινητικότητας και σημείο συνάντησης. Δοκίμασε ολόκληρη την αλυσίδα στις ασκήσεις.\n\n## Πηγή επαλήθευσης\n- U.S. Fire Administration — πυρασφάλεια ηλικιωμένων και προσβάσιμη ειδοποίηση: https://www.usfa.fema.gov/prevention/home-fires/at-risk-audiences/older-adults/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":154,"en":{"title":"Damaged Solar PV After Fire, Flood, Hail, or Storm","body":"Solar panels can continue to produce electrical energy when light is present even if utility power is off. Storm, hail, fire, or flood damage can also leave broken modules, wet connectors, damaged wiring, or loose rooftop components. A household should not assume that “the grid is down” makes the solar system electrically dead.\n\n## Isolate people from the damaged array\nKeep occupants away from broken modules, exposed wiring, flooded equipment, and fallen rooftop components. Do not touch, hose, move, or dismantle damaged photovoltaic hardware. If the system has an approved emergency shutdown/disconnect procedure, follow only the documented procedure that the installer/manufacturer has taught the user to operate safely.\n\n## Inspection comes before re-energization\nU.S. Department of Energy resilience guidance notes the need for electrical inspection after visible severe-weather damage and highlights that submerged PV components can require replacement. Record which components were exposed to fire, impact, hail, or water and leave testing/repair to qualified solar/electrical personnel.\n\n## Tell responders the system exists\nMark the location of panels, inverter, battery storage, disconnects, and meter on the household utility map. During fire or structural response, tell responders about PV and battery systems; they may need to manage hazards differently from a conventional de-energized building.\n\n## Verification sources\n- U.S. Department of Energy — Solar PV resilience and severe weather: https://www.energy.gov/cmei/femp/severe-weather-resilience-solar-photovoltaic-system-design\n- U.S. Department of Energy — Solar fire safety: https://www.energy.gov/cmei/systems/guide-fire-safety-solar-systems\n\nVerification date: 2026-08-09."},"el":{"title":"Κατεστραμμένα Φωτοβολταϊκά Μετά από Φωτιά, Πλημμύρα, Χαλάζι ή Καταιγίδα","body":"Τα φωτοβολταϊκά μπορούν να συνεχίσουν να παράγουν ηλεκτρική ενέργεια όταν υπάρχει φως ακόμη κι αν το δίκτυο έχει διακοπεί. Ζημιά από καταιγίδα, χαλάζι, φωτιά ή πλημμύρα μπορεί επίσης να αφήσει σπασμένα πάνελ, βρεγμένες συνδέσεις, κατεστραμμένη καλωδίωση ή χαλαρά στοιχεία στη στέγη. Το νοικοκυριό δεν πρέπει να θεωρεί ότι «έπεσε το δίκτυο» σημαίνει πως το φωτοβολταϊκό είναι ηλεκτρικά νεκρό.\n\n## Απομόνωσε τους ανθρώπους από το κατεστραμμένο σύστημα\nΚράτησε ενοίκους μακριά από σπασμένα πάνελ, εκτεθειμένα καλώδια, πλημμυρισμένο εξοπλισμό και πεσμένα στοιχεία. Μην αγγίζεις, καταβρέχεις, μετακινείς ή αποσυναρμολογείς κατεστραμμένο φωτοβολταϊκό υλικό. Αν υπάρχει εγκεκριμένη διαδικασία έκτακτης διακοπής, ακολούθησε μόνο την τεκμηριωμένη διαδικασία που εγκαταστάτης/κατασκευαστής έχει υποδείξει για ασφαλή χρήση από τον ιδιοκτήτη.\n\n## Επιθεώρηση πριν την επανατροφοδότηση\nΗ καθοδήγηση ανθεκτικότητας του U.S. Department of Energy επισημαίνει την ανάγκη ηλεκτρικής επιθεώρησης μετά από ορατή ζημιά από ακραίο καιρό και ότι βυθισμένα στοιχεία φωτοβολταϊκού μπορεί να χρειάζονται αντικατάσταση. Κατάγραψε ποια μέρη εκτέθηκαν σε φωτιά, κρούση, χαλάζι ή νερό και άφησε δοκιμές/επισκευές σε ειδικευμένο προσωπικό.\n\n## Ενημέρωσε τους διασώστες για το σύστημα\nΣημείωσε στον χάρτη υποδομών θέση πάνελ, μετατροπέα, αποθήκευσης μπαταρίας, αποζεύξεων και μετρητή. Σε φωτιά ή δομικό συμβάν ενημέρωσε τους διασώστες για φωτοβολταϊκά και μπαταρίες· οι κίνδυνοι μπορεί να διαφέρουν από ένα συμβατικό κτίριο χωρίς τροφοδοσία.\n\n## Πηγές επαλήθευσης\n- U.S. Department of Energy — ανθεκτικότητα φωτοβολταϊκών σε ακραίο καιρό: https://www.energy.gov/cmei/femp/severe-weather-resilience-solar-photovoltaic-system-design\n- U.S. Department of Energy — πυρασφάλεια φωτοβολταϊκών: https://www.energy.gov/cmei/systems/guide-fire-safety-solar-systems\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":155,"en":{"title":"Flood-Damaged Electric and Hybrid Vehicles: High-Voltage Boundaries","body":"A flooded electric or hybrid vehicle is not just a wet car. High-voltage batteries and components can create shock and fire hazards, and damage may not be visible immediately. NHTSA advises owners to contact the dealer and/or emergency services when flood exposure may have damaged an EV battery.\n\n## Do not treat the vehicle as emergency power\nAfter significant flood exposure, do not plug in, charge, open the high-voltage system, or use vehicle-to-load functions until the vehicle has been evaluated under manufacturer/professional guidance. Keep people away from damaged battery areas and note smoke, unusual heat, odor, popping sounds, warning messages, or fluid leakage for responders.\n\n## Parking location matters\nNHTSA flood-damaged vehicle guidance warns that a damaged lithium-ion vehicle can pose a fire risk. Follow current official/manufacturer instructions about where the vehicle should be stored or towed; do not move it into an attached garage merely to protect it from weather. Tell tow/recovery personnel that it is an EV/hybrid with flood exposure.\n\n## Document before recovery\nPhotograph water level, exterior damage, VIN/vehicle identity, dashboard warnings if visible without entering an unsafe vehicle, and the time/location of flooding. Keep repair, towing, insurer, and manufacturer communications together so a later shift does not attempt to start or charge a vehicle that another person already isolated.\n\n## Verification source\n- NHTSA — Electric and Hybrid Vehicle Battery, Charging & Safety: https://www.nhtsa.gov/vehicle-safety/electric-and-hybrid-vehicles\n\nVerification date: 2026-08-09."},"el":{"title":"Πλημμυρισμένο Ηλεκτρικό ή Υβριδικό Όχημα: Όρια Υψηλής Τάσης","body":"Ένα ηλεκτρικό ή υβριδικό όχημα που πλημμύρισε δεν είναι απλώς «βρεγμένο αυτοκίνητο». Οι μπαταρίες και τα εξαρτήματα υψηλής τάσης μπορούν να δημιουργήσουν κίνδυνο ηλεκτροπληξίας και φωτιάς, ενώ η ζημιά μπορεί να μην είναι άμεσα ορατή. Η NHTSA προτείνει επικοινωνία με αντιπροσωπεία και/ή υπηρεσίες έκτακτης ανάγκης όταν η πλημμύρα μπορεί να έχει επηρεάσει τη μπαταρία.\n\n## Μην το χρησιμοποιήσεις ως εφεδρική παροχή\nΜετά από σημαντική έκθεση σε νερό, μην συνδέεις φορτιστή, μην ανοίγεις το σύστημα υψηλής τάσης και μην χρησιμοποιείς λειτουργίες τροφοδοσίας συσκευών μέχρι να αξιολογηθεί σύμφωνα με οδηγίες κατασκευαστή/επαγγελματία. Κράτησε ανθρώπους μακριά από την περιοχή της μπαταρίας και σημείωσε καπνό, ασυνήθιστη θερμότητα, οσμή, ήχους, προειδοποιήσεις ή διαρροές για τους διασώστες.\n\n## Η θέση στάθμευσης έχει σημασία\nΗ καθοδήγηση NHTSA για οχήματα πλημμύρας προειδοποιεί ότι κατεστραμμένη μπαταρία λιθίου μπορεί να προκαλέσει φωτιά. Ακολούθησε τις τρέχουσες επίσημες/κατασκευαστικές οδηγίες για αποθήκευση ή ρυμούλκηση· μην μεταφέρεις το όχημα σε συνδεδεμένο γκαράζ μόνο για προστασία από τον καιρό. Ενημέρωσε ρυμουλκό/συνεργείο ότι πρόκειται για EV/υβριδικό με έκθεση σε πλημμύρα.\n\n## Τεκμηρίωσε πριν την ανάκτηση\nΦωτογράφισε ύψος νερού, εξωτερική ζημιά, στοιχεία ταυτοποίησης οχήματος, ενδείξεις πίνακα αν φαίνονται χωρίς επικίνδυνη είσοδο και χρόνο/τοποθεσία πλημμύρας. Κράτησε μαζί επικοινωνίες επισκευής, ρυμούλκησης, ασφάλισης και κατασκευαστή ώστε επόμενη βάρδια να μην επιχειρήσει εκκίνηση ή φόρτιση οχήματος που είχε ήδη απομονωθεί.\n\n## Πηγή επαλήθευσης\n- NHTSA — ασφάλεια ηλεκτρικών και υβριδικών οχημάτων: https://www.nhtsa.gov/vehicle-safety/electric-and-hybrid-vehicles\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":156,"en":{"title":"Vehicle Idling Near Shelters: Carbon Monoxide and Air-Intake Boundaries","body":"Vehicles are often used during outages for charging, heating/cooling, radio monitoring, or temporary refuge. That makes exhaust management part of shelter safety. An engine running near a garage, tent, doorway, open window, or air intake can introduce carbon monoxide into occupied space.\n\n## Keep combustion outside the shelter envelope\nNever idle a vehicle in an attached garage or enclosed/partly enclosed structure, even with a door open. Position running vehicles so exhaust cannot enter occupied buildings, tents, or temporary shelters through windows, vents, or doors. Wind direction can change, so “the exhaust is blowing away” is not a permanent control.\n\n## Separate charging trips from living space\nIf a vehicle is used to recharge phones or batteries, assign a specific outdoor location and an operator who remains alert to fuel, exhaust, traffic, and theft hazards. Do not create a sleeping arrangement around a running vehicle. If the car is used as a temporary climate refuge, follow manufacturer and public-safety guidance and reassess whenever snow, debris, floodwater, or other obstruction could affect exhaust flow.\n\n## Log fuel and engine use\nTrack start/stop times, fuel reserve, charging purpose, and which devices were charged. This supports both resource planning and detection of excessive engine use that may create unnecessary exhaust exposure.\n\n## Verification anchor\n- CDC — Carbon Monoxide and Power-Outage Safety: https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-during-a-power-outage.html\n\nVerification date: 2026-08-09."},"el":{"title":"Ρελαντί Οχήματος Κοντά σε Καταφύγιο: Όρια Καυσαερίων και Μονοξειδίου","body":"Σε διακοπές ρεύματος τα οχήματα χρησιμοποιούνται συχνά για φόρτιση, θέρμανση/ψύξη, ακρόαση ραδιοφώνου ή προσωρινό καταφύγιο. Έτσι η διαχείριση καυσαερίων γίνεται μέρος της ασφάλειας. Κινητήρας που λειτουργεί κοντά σε γκαράζ, σκηνή, πόρτα, ανοιχτό παράθυρο ή εισαγωγή αέρα μπορεί να οδηγήσει μονοξείδιο του άνθρακα σε κατοικημένο χώρο.\n\n## Κράτησε την καύση έξω από το περίβλημα κατοίκησης\nΠοτέ μην αφήνεις όχημα να λειτουργεί σε συνδεδεμένο γκαράζ ή κλειστό/ημίκλειστο χώρο, ακόμη και με ανοιχτή πόρτα. Τοποθέτησε το όχημα έτσι ώστε τα καυσαέρια να μην εισέρχονται σε κτίριο, σκηνή ή προσωρινό καταφύγιο από παράθυρα, αεραγωγούς ή πόρτες. Η κατεύθυνση ανέμου αλλάζει, άρα το «φυσάει προς τα έξω» δεν είναι μόνιμο μέτρο.\n\n## Χώρισε τις φορτίσεις από τον χώρο διαβίωσης\nΑν το όχημα χρησιμοποιείται για φόρτιση τηλεφώνων ή μπαταριών, όρισε συγκεκριμένο εξωτερικό σημείο και χειριστή που προσέχει καύσιμο, καυσαέρια, κυκλοφορία και κλοπή. Μην οργανώνεις ύπνο γύρω από όχημα με κινητήρα σε λειτουργία. Αν χρησιμοποιείται ως προσωρινός κλιματιζόμενος χώρος, ακολούθησε οδηγίες κατασκευαστή/δημόσιας ασφάλειας και επανεκτίμησε όταν χιόνι, συντρίμμια, νερό ή άλλο εμπόδιο μπορεί να επηρεάσει την εξάτμιση.\n\n## Κατάγραψε καύσιμο και χρόνο λειτουργίας\nΣημείωσε ώρα εκκίνησης/διακοπής, απόθεμα καυσίμου, σκοπό φόρτισης και ποιες συσκευές φορτίστηκαν. Αυτό βοηθά στον σχεδιασμό πόρων και δείχνει αν ο κινητήρας χρησιμοποιείται υπερβολικά δημιουργώντας άσκοπη έκθεση σε καυσαέρια.\n\n## Πηγή επαλήθευσης\n- CDC — μονοξείδιο και ασφάλεια σε διακοπή ρεύματος: https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-during-a-power-outage.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":157,"en":{"title":"Home Fire Extinguisher Decision: Escape Route First","body":"A fire extinguisher is not permission to fight a growing fire. U.S. Fire Administration guidance places escape conditions ahead of extinguisher use: people should already be alerted, emergency services contacted as appropriate, the fire must be small/contained enough for the extinguisher, and the user needs a clear escape route.\n\n## Make the exit non-negotiable\nNever position yourself with the fire between you and the exit. If smoke is building, flames are spreading, the correct extinguisher is unavailable, the user is unsure, or one discharge does not control the fire, leave and close doors if this can be done safely. Do not re-enter for possessions or to “check whether it went out.”\n\n## Prepare before there is a fire\nKnow where extinguishers are, their intended fire classes, inspection status, and how the manufacturer says to operate them. Keep them accessible without placing them directly next to the most likely fire source, where flames could prevent access. Everyone still needs the escape plan and meeting point; an extinguisher is secondary equipment.\n\n## After discharge\nEven a small controlled fire can leave hidden heat, electrical damage, smoke contamination, or structural damage. Contact the appropriate fire/utility/professional service before returning affected equipment or areas to normal use.\n\n## Verification source\n- U.S. Fire Administration — Choosing and Using Fire Extinguishers: https://www.usfa.fema.gov/prevention/home-fires/prepare-for-fire/fire-extinguishers/\n\nVerification date: 2026-08-09."},"el":{"title":"Απόφαση για Πυροσβεστήρα Σπιτιού: Πρώτα η Διαδρομή Διαφυγής","body":"Ο πυροσβεστήρας δεν είναι άδεια να πολεμήσεις μια φωτιά που μεγαλώνει. Η καθοδήγηση της U.S. Fire Administration βάζει τις συνθήκες διαφυγής πριν από τη χρήση: οι άνθρωποι πρέπει να έχουν ειδοποιηθεί, οι υπηρεσίες να έχουν κληθεί όπου απαιτείται, η φωτιά να είναι αρκετά μικρή/περιορισμένη για τον πυροσβεστήρα και ο χρήστης να έχει καθαρή έξοδο.\n\n## Η έξοδος δεν διαπραγματεύεται\nΜην τοποθετείσαι ποτέ με τη φωτιά ανάμεσα σε εσένα και την έξοδο. Αν αυξάνεται ο καπνός, εξαπλώνονται φλόγες, δεν υπάρχει σωστός πυροσβεστήρας, υπάρχει αβεβαιότητα ή μία προσπάθεια δεν ελέγχει τη φωτιά, φύγε και κλείσε πόρτες αν αυτό γίνεται με ασφάλεια. Μην επιστρέφεις για αντικείμενα ή για να «δεις αν έσβησε».\n\n## Προετοιμασία πριν υπάρξει φωτιά\nΓνώριζε πού βρίσκονται οι πυροσβεστήρες, για ποιες κατηγορίες φωτιάς προορίζονται, την κατάσταση επιθεώρησης και τις οδηγίες κατασκευαστή. Κράτησέ τους προσβάσιμους χωρίς να τους τοποθετείς ακριβώς δίπλα στην πιθανή εστία, όπου οι φλόγες μπορεί να μπλοκάρουν την πρόσβαση. Όλοι εξακολουθούν να χρειάζονται σχέδιο διαφυγής και σημείο συνάντησης· ο πυροσβεστήρας είναι δευτερεύων εξοπλισμός.\n\n## Μετά τη χρήση\nΑκόμη και μικρή φωτιά που ελέγχθηκε μπορεί να αφήσει κρυφή θερμότητα, ηλεκτρική ζημιά, καπνό ή δομικό πρόβλημα. Επικοινώνησε με την κατάλληλη πυροσβεστική/τεχνική υπηρεσία πριν επιστρέψεις εξοπλισμό ή χώρο σε κανονική χρήση.\n\n## Πηγή επαλήθευσης\n- U.S. Fire Administration — επιλογή και χρήση πυροσβεστήρων: https://www.usfa.fema.gov/prevention/home-fires/prepare-for-fire/fire-extinguishers/\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":158,"en":{"title":"Lightning Indoors: Plumbing and Wired-Device Decisions","body":"Being inside a substantial building is safer than remaining outdoors during lightning, but indoor behavior still matters because lightning can travel through plumbing and electrical/wired systems. CDC advises avoiding contact with water and equipment connected to electrical outlets during a thunderstorm.\n\n## Pause water tasks\nDelay showers, baths, dishwashing, and other contact with plumbing while thunder/lightning is active. This can affect hygiene schedules in a shelter, so move handwashing or meal tasks earlier/later when possible rather than crowding everyone at sinks during the storm.\n\n## Reduce wired contact\nAvoid using devices connected to wall power or wired external systems during the storm. Battery-powered equipment that is not connected to an outlet reduces that pathway. Do not stand at windows or exterior doors to watch lightning, and keep away from concrete walls/floors where metal reinforcement may conduct current.\n\n## Re-check after the storm\nA lightning event may trip protection or damage electronics without obvious exterior damage. If electrical equipment smells burned, behaves abnormally, or protective devices repeatedly trip, isolate the equipment and use qualified inspection rather than repeated resets.\n\n## Verification source\n- CDC — Lightning Safety: https://www.cdc.gov/lightning/safety/index.html\n\nVerification date: 2026-08-09."},"el":{"title":"Κεραυνός σε Εσωτερικό Χώρο: Υδραυλικά και Ενσύρματες Συσκευές","body":"Η παραμονή μέσα σε κατάλληλο κτίριο είναι ασφαλέστερη από την ύπαιθρο σε κεραυνική δραστηριότητα, αλλά η συμπεριφορά μέσα εξακολουθεί να έχει σημασία, επειδή το ρεύμα μπορεί να μεταδοθεί μέσω υδραυλικών και ηλεκτρικών/ενσύρματων συστημάτων. Το CDC προτείνει αποφυγή επαφής με νερό και εξοπλισμό συνδεδεμένο σε πρίζες κατά την καταιγίδα.\n\n## Πάγωσε προσωρινά τις εργασίες νερού\nΑνάβαλε ντους, μπάνιο, πλύσιμο πιάτων και άλλη επαφή με υδραυλικά όσο υπάρχει ενεργός κεραυνική δραστηριότητα. Αυτό μπορεί να επηρεάζει πρόγραμμα υγιεινής σε καταφύγιο, γι’ αυτό μετακίνησε εργασίες χεριών ή γευμάτων πριν/μετά αντί να συγκεντρώνονται όλοι σε νεροχύτες κατά την καταιγίδα.\n\n## Μείωσε επαφή με ενσύρματα συστήματα\nΑπόφυγε συσκευές συνδεδεμένες σε πρίζες ή εξωτερικά ενσύρματα συστήματα. Εξοπλισμός με μπαταρία που δεν είναι συνδεδεμένος μειώνει αυτή τη διαδρομή. Μην στέκεσαι σε παράθυρα ή εξωτερικές πόρτες για να παρακολουθείς κεραυνούς και απόφυγε σκυρόδεμα όπου μεταλλικός οπλισμός μπορεί να αγάγει ρεύμα.\n\n## Έλεγξε ξανά μετά την καταιγίδα\nΚεραυνικό συμβάν μπορεί να ρίξει προστασίες ή να βλάψει ηλεκτρονικά χωρίς εμφανή εξωτερική ζημιά. Αν εξοπλισμός μυρίζει καμένο, λειτουργεί ασυνήθιστα ή πέφτουν επανειλημμένα προστασίες, απομόνωσέ τον και ζήτησε ειδικευμένο έλεγχο αντί για συνεχείς επαναφορές.\n\n## Πηγή επαλήθευσης\n- CDC — ασφάλεια από κεραυνούς: https://www.cdc.gov/lightning/safety/index.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":159,"en":{"title":"Debris Cleanup: Manual Handling, Team Lifts, and Work-Rest Control","body":"Post-disaster cleanup injuries often come from ordinary actions repeated under abnormal conditions: lifting wet material, twisting with debris, carrying bulky objects through poor footing, working in heat, and continuing after fatigue. The safest plan limits exposure before pain or exhaustion forces a stop.\n\n## Survey the load and route first\nBefore lifting, identify sharp edges, contamination, unstable piles, overhead hazards, stairs, slippery surfaces, and where the material will be placed. Use mechanical assistance when available. CDC/NIOSH disaster guidance recommends team handling for bulky objects and warns against excessive single-person lifting.\n\n## Rotate tasks instead of only people\nMoving the same type of load for hours can overload the same muscles even when workers switch occasionally. Alternate lifting, sorting, documentation, rest, hydration, and lighter tasks. Stop work for heat illness symptoms, loss of coordination, worsening pain, unsafe light, structural movement, or changing weather.\n\n## Keep contaminated debris out of living routes\nCreate a disposal path that does not cross food preparation, clean water, sleeping, or medical zones. Bag or contain sharp/small contaminated items appropriately. Do not let a faster cleanup route create a second contamination problem inside the shelter.\n\n## Record injuries and near-misses\nA dropped object, almost-fall, torn glove, or unexpected pile movement is useful information. Log it and change the route/tool/team arrangement before the next load.\n\n## Verification source\n- CDC — post-disaster debris cleanup and worker safety: https://www.cdc.gov/natural-disasters/safety/index.html\n\nVerification date: 2026-08-09."},"el":{"title":"Καθαρισμός Συντριμμιών: Χειρωνακτική Μεταφορά, Ομαδική Ανύψωση και Ρυθμός Εργασίας","body":"Οι τραυματισμοί καθαρισμού μετά από καταστροφή συχνά προέρχονται από συνηθισμένες κινήσεις που επαναλαμβάνονται σε ασυνήθιστες συνθήκες: ανύψωση βρεγμένου υλικού, στρίψιμο με βάρος, μεταφορά ογκωδών αντικειμένων σε κακό πάτημα, εργασία σε ζέστη και συνέχιση μετά την κόπωση. Το ασφαλές σχέδιο περιορίζει την έκθεση πριν ο πόνος ή η εξάντληση επιβάλουν διακοπή.\n\n## Έλεγξε βάρος και διαδρομή πριν σηκώσεις\nΠριν από ανύψωση εντόπισε αιχμηρές άκρες, ρύπανση, ασταθείς σωρούς, κινδύνους πάνω από το κεφάλι, σκάλες, ολισθηρές επιφάνειες και πού θα καταλήξει το υλικό. Χρησιμοποίησε μηχανική βοήθεια όπου υπάρχει. Η καθοδήγηση CDC/NIOSH για καταστροφές προτείνει ομαδική μεταφορά ογκωδών αντικειμένων και αποφυγή υπερβολικού φορτίου από ένα άτομο.\n\n## Εναλλάσσεις εργασίες, όχι μόνο άτομα\nΗ ίδια κίνηση για ώρες κουράζει τα ίδια μέρη του σώματος ακόμη και αν οι εργαζόμενοι αλλάζουν περιστασιακά. Εναλλάσσε ανύψωση, διαλογή, τεκμηρίωση, ανάπαυση, ενυδάτωση και ελαφρύτερες εργασίες. Σταμάτησε για συμπτώματα θερμικής καταπόνησης, απώλεια συντονισμού, αυξανόμενο πόνο, κακό φωτισμό, δομική μετακίνηση ή αλλαγή καιρού.\n\n## Κράτησε τα μολυσμένα συντρίμμια έξω από καθαρές διαδρομές\nΔημιούργησε οδό απορριμμάτων που δεν περνά από προετοιμασία τροφίμων, καθαρό νερό, ύπνο ή ιατρικές ζώνες. Συσκεύασε κατάλληλα αιχμηρά ή μικρά μολυσμένα αντικείμενα. Μια πιο γρήγορη διαδρομή καθαρισμού δεν πρέπει να δημιουργεί δεύτερο πρόβλημα ρύπανσης στο καταφύγιο.\n\n## Κατάγραψε τραυματισμούς και παρ’ ολίγον συμβάντα\nΠτώση αντικειμένου, σχεδόν πτώση ανθρώπου, σκισμένο γάντι ή απρόβλεπτη μετακίνηση σωρού είναι χρήσιμη πληροφορία. Κατάγραψέ την και άλλαξε διαδρομή, εργαλείο ή ομάδα πριν από το επόμενο φορτίο.\n\n## Πηγή επαλήθευσης\n- CDC — ασφάλεια εργαζομένων κατά την απομάκρυνση συντριμμιών μετά από καταστροφή: https://www.cdc.gov/natural-disasters/safety/index.html\n\nΗμερομηνία επαλήθευσης: 2026-08-09."}},{"id":160,"en":{"title":"Fire Escape When Away From Home: Hotel, Shelter, or Temporary Accommodation","body":"Temporary accommodation creates an unfamiliar escape problem. People may not know which corridor leads outside, whether a second staircase exists, where alarms are, or how many doors separate the room from the exit. This uncertainty is greatest at night, when smoke or power loss can remove visual landmarks.\n\n## Orient before sleeping\nOn arrival, locate the two nearest usable exits where available, count doors or major landmarks between the sleeping area and the exit, identify alarm points, and check that mobility devices can pass the route. U.S. Fire Administration guidance for hotels recommends identifying the two closest exits and counting doors so the route can be followed when visibility is poor.\n\n## Keep the exit kit small\nShoes, identification, essential medicine, mobility/communication aids, and a light should be reachable without unpacking the whole bag. Do not obstruct doors or corridors with luggage. Agree on an outside meeting point so household members do not re-enter looking for someone who already escaped by another route.\n\n## Follow building instructions during an alarm\nUse stairs rather than elevators unless responders/building emergency procedures specifically direct otherwise. If smoke or fire blocks the planned route, use the alternate route rather than forcing through. Report missing or mobility-limited occupants to responders; do not send an unprotected family member back inside.\n\n## Verification source\n- U.S. Fire Administration — Hotel and Vacation Rental Fire Safety: https://www.usfa.fema.gov/prevention/hotel-fires/\n\nVerification date: 2026-08-09."},"el":{"title":"Διαφυγή από Φωτιά Μακριά από το Σπίτι: Ξενοδοχείο, Καταφύγιο ή Προσωρινή Διαμονή","body":"Η προσωρινή διαμονή δημιουργεί άγνωστο πρόβλημα διαφυγής. Οι άνθρωποι μπορεί να μη γνωρίζουν ποιος διάδρομος οδηγεί έξω, αν υπάρχει δεύτερη σκάλα, πού βρίσκονται οι συναγερμοί ή πόσες πόρτες χωρίζουν το δωμάτιο από την έξοδο. Η αβεβαιότητα είναι μεγαλύτερη τη νύχτα, όταν καπνός ή διακοπή ρεύματος αφαιρούν οπτικά σημεία αναφοράς.\n\n## Προσανατολίσου πριν κοιμηθείς\nΜόλις φτάσεις, εντόπισε τις δύο πλησιέστερες χρησιμοποιήσιμες
