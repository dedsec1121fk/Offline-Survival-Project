πυροσβεστήρες, πυράντοχες πόρτες και διαδρομές προσωπικού. Μην δημιουργείς «ιδιωτικότητα» κρεμώντας υλικά πάνω σε εξοπλισμό, θερμαντικά μέσα ή πινακίδες έκτακτης ανάγκης.\n\n## Δημιούργησε ήσυχη περίοδο ύπνου\nΣυμφώνησε ώρες χαμηλότερου φωτισμού και θορύβου, διατηρώντας τον απαιτούμενο φωτισμό ασφάλειας. Τηλεφωνήματα, συζητήσεις στη φόρτιση και ταξινόμηση εφοδίων γίνονται μακριά από τις σειρές ύπνου. Οικογένειες με βρέφη, νυχτερινές ιατρικές ανάγκες ή διαφορετικές βάρδιες μπορεί να χρειάζονται ειδική θέση αντί για συνεχή σύγκρουση με την κύρια ζώνη.\n\n## Προστάτευσε προσωπικά όρια\nΧρησιμοποίησε απλά οπτικά χωρίσματα όπου το επιτρέπει η δομή, χωρίς να εμποδίζεις αερισμό και διαδρομές. Κανείς δεν πρέπει να αποκαλύπτει διάγνωση για να ζητήσει πιο ήσυχη, προσβάσιμη ή ιδιωτική θέση. Ο συντονιστής χρειάζεται μόνο την πληροφορία που απαιτείται για να καλύψει την επιχειρησιακή ανάγκη.\n\n## Κράτησε κρίσιμα αντικείμενα προσβάσιμα\nΓυαλιά, ακουστικές συσκευές, βοηθήματα κινητικότητας, φάρμακα και παπούτσια έχουν σταθερή θέση δίπλα στο άτομο χωρίς να κλείνουν περάσματα. Έγγραφα αξίας και ηλεκτρονικά ασφαλίζονται και δεν αφήνονται χωρίς επίβλεψη σε κοινά σημεία φόρτισης.\n\n## Νυχτερινή καταμέτρηση\nΓνώριζε ποιος αναμένεται να βρίσκεται στο καταφύγιο και πού κοιμούνται εξαρτώμενα μέλη. Αν κάποιος φύγει τη νύχτα, σημείωσε προορισμό και αναμενόμενη επιστροφή όπου είναι πρακτικό. Παιδιά δεν κινούνται μόνα σε άγνωστη κοινόχρηστη εγκατάσταση.\n\n## Επαναφορά κάθε πρωί\nΑφαίρεσε εμπόδια πτώσης, αέρισε και στέγνωσε κλινοσκεπάσματα όπου γίνεται, καθάρισε επιφάνειες συχνής επαφής σύμφωνα με τη δομή, άδειασε απορρίμματα και επανέφερε διαδρομές έκτακτης ανάγκης. Καταφύγιο που δεν «μηδενίζεται» καθημερινά γίνεται σταδιακά δυσκολότερο και λιγότερο ασφαλές.\n\nΚωδικοί τεκμηρίωσης: READY-SHELTER-1, READY-DISABILITY-1, READY-PLAN-1."}},{"id":72,"en":{"title":"Food allergies in shared sheltering: prevent accidental exposure in a high-noise environment","body":"## Identification must be specific\nA statement such as “food allergy” is not enough for food distribution. Record the allergen, the person, usual emergency action plan and any prescribed rescue medication according to their clinician’s plan. Do not improvise medication instructions inside a shelter guide.\n\n## Preserve labels\nKeep original ingredient/allergen labels with packaged foods. Do not transfer unknown food into unmarked containers. Home-cooked or donated dishes with uncertain ingredients should be treated as unknown for an allergic person rather than accepted on reassurance alone.\n\n## Separate preparation and utensils where needed\nCross-contact can occur through cutting boards, serving utensils, hands and shared spreads/condiments. Establish a protected preparation area or sealed meal route for people with serious allergies. Clean surfaces appropriately before use and store the safe food where it will not be consumed accidentally by others.\n\n## Communicate without publicizing medical history\nThe people serving food need to know which meal belongs to whom; the entire shelter does not need the person’s full medical details. Use a discreet identifier agreed with the individual/family and keep the emergency plan with the caregiver or designated coordinator.\n\n## Never pressure someone to “eat around” an uncertain ingredient\nScarcity does not make an unsafe food acceptable. Plan reserve foods that the person already tolerates and include them in evacuation supplies. If safe food becomes unavailable, escalate early to shelter staff, health services or supply coordinators rather than waiting until the next meal.\n\n## Treat a reaction as a medical emergency according to the person’s plan\nFollow the prescribed action plan and seek emergency help. A preparedness manual should support recognition, communication and logistics; it should not replace individualized medical instructions.\n\nEvidence IDs: READY-DISABILITY-1, READY-KIT-1, FOOD-1."},"el":{"title":"Τροφικές αλλεργίες σε κοινό καταφύγιο: πρόληψη τυχαίας έκθεσης σε περιβάλλον με πολύ θόρυβο","body":"## Η αναγνώριση πρέπει να είναι συγκεκριμένη\nΗ γενική φράση «τροφική αλλεργία» δεν αρκεί για διανομή. Κατέγραψε το αλλεργιογόνο, το άτομο, το συνηθισμένο σχέδιο έκτακτης αντίδρασης και τυχόν συνταγογραφημένο φάρμακο διάσωσης σύμφωνα με το σχέδιο του θεράποντα. Μην δημιουργείς αυτοσχέδιες ιατρικές δοσολογίες μέσα σε οδηγό καταφυγίου.\n\n## Διατήρησε τις ετικέτες\nΚράτησε τις αρχικές πληροφορίες συστατικών και αλλεργιογόνων με τις συσκευασίες. Μην μεταφέρεις άγνωστο τρόφιμο σε δοχείο χωρίς σήμανση. Σπιτικό ή δωρεά με αβέβαια συστατικά θεωρείται άγνωστο για αλλεργικό άτομο και δεν γίνεται ασφαλές επειδή κάποιος διαβεβαιώνει ότι «μάλλον δεν έχει» το αλλεργιογόνο.\n\n## Χώρισε προετοιμασία και εργαλεία όπου απαιτείται\nΔιασταυρούμενη επαφή μπορεί να γίνει από επιφάνειες κοπής, κουτάλες, χέρια και κοινά αλείμματα/καρυκεύματα. Δημιούργησε προστατευμένο σημείο προετοιμασίας ή σφραγισμένη διαδρομή γεύματος για σοβαρές αλλεργίες. Καθάρισε κατάλληλα τις επιφάνειες πριν από χρήση και φύλαξε το ασφαλές τρόφιμο ώστε να μην καταναλωθεί κατά λάθος από άλλους.\n\n## Επικοινωνία χωρίς δημόσιο ιατρικό ιστορικό\nΌσοι σερβίρουν πρέπει να ξέρουν ποιο γεύμα ανήκει σε ποιον· δεν χρειάζεται ολόκληρο το καταφύγιο να γνωρίζει το ιατρικό ιστορικό. Χρησιμοποίησε διακριτικό αναγνωριστικό που έχει συμφωνηθεί με το άτομο ή την οικογένεια και κράτησε το σχέδιο έκτακτης ανάγκης στον φροντιστή ή υπεύθυνο.\n\n## Μην πιέζεις κάποιον να «φάει γύρω από» αβέβαιο συστατικό\nΗ έλλειψη δεν κάνει ένα μη ασφαλές τρόφιμο αποδεκτό. Προγραμμάτισε εφεδρικά τρόφιμα που το άτομο ήδη ανέχεται και βάλε τα στην εκκένωση. Αν αρχίσουν να τελειώνουν, ενημέρωσε νωρίς προσωπικό καταφυγίου, υγειονομική υπηρεσία ή συντονισμό εφοδίων και όχι λίγο πριν από το επόμενο γεύμα.\n\n## Αντίδραση σύμφωνα με το εξατομικευμένο σχέδιο\nΑκολούθησε το συνταγογραφημένο σχέδιο και ζήτησε επείγουσα βοήθεια. Ο οδηγός ετοιμότητας υποστηρίζει αναγνώριση, επικοινωνία και εφοδιαστική· δεν αντικαθιστά προσωπικές ιατρικές οδηγίες.\n\nΚωδικοί τεκμηρίωσης: READY-DISABILITY-1, READY-KIT-1, FOOD-1."}},{"id":73,"en":{"title":"Pets and service animals in shared sheltering: separate care needs without separating the plan","body":"## Know the facility policy before arrival where possible\nEmergency shelters may handle pets and service animals differently. Service animals have a different role from pets, and applicable local rules govern access. Identify pet-friendly options, veterinary contacts and a backup caregiver before the incident instead of assuming every destination can house every animal.\n\n## Keep identification with the animal\nUse current tags/microchip information and carry a recent photo plus ownership/veterinary records. A carrier, leash/harness and familiar handling equipment should fit the actual animal. Label medicines and special diets clearly.\n\n## Create an animal zone that does not compromise human operations\nWhere a shelter provides a pet area, keep it away from food preparation and sanitation routes. Control waste promptly, prevent loose animals from obstructing exits and avoid contact between unfamiliar animals. Never tether an animal where it can become trapped by moving equipment or crowds.\n\n## Preserve service-animal function\nDo not pet, feed or separate a service animal from its handler without permission except where immediate safety requires action. Ask the handler what assistance is actually needed. Backup supplies should include the animal’s food, water, waste control and any equipment needed for its work.\n\n## Plan for stress and escape risk\nNoise, smoke, strange people and other animals can cause normally calm pets to bolt or become defensive. Use secure containment and avoid opening carriers in uncontrolled areas. Keep a secondary contact who can receive the animal if the main shelter option fails.\n\n## Recovery includes the animal’s environment\nAfter flood, fire or chemical incidents, do not allow animals to roam through contaminated yards, ash, standing water or debris before the area is safe. Veterinary advice is appropriate for exposure, injury or loss of normal feeding/medication continuity.\n\nEvidence IDs: READY-PETS-1, READY-SHELTER-1, READY-DISABILITY-1."},"el":{"title":"Κατοικίδια και ζώα υπηρεσίας σε κοινό καταφύγιο: διαφορετικές ανάγκες μέσα στο ίδιο σχέδιο","body":"## Γνώρισε την πολιτική της δομής πριν από την άφιξη όπου γίνεται\nΤα καταφύγια μπορεί να χειρίζονται διαφορετικά κατοικίδια και ζώα υπηρεσίας. Το ζώο υπηρεσίας έχει διαφορετικό ρόλο από το κατοικίδιο και η πρόσβαση διέπεται από τους ισχύοντες τοπικούς κανόνες. Εντόπισε φιλικές προς ζώα επιλογές, κτηνιατρικές επαφές και εφεδρικό φροντιστή πριν από το συμβάν αντί να θεωρείς ότι κάθε προορισμός δέχεται κάθε ζώο.\n\n## Κράτησε ταυτοποίηση μαζί με το ζώο\nΕνημέρωσε ετικέτες ή στοιχεία μικροτσίπ και κράτησε πρόσφατη φωτογραφία, αποδεικτικά ιδιοκτησίας και κτηνιατρικά αρχεία. Κλουβί μεταφοράς, λουρί ή σαμαράκι πρέπει να ταιριάζουν στο συγκεκριμένο ζώο. Φάρμακα και ειδική διατροφή σημειώνονται καθαρά.\n\n## Ζώνη ζώων χωρίς να διαταράσσεται η λειτουργία\nΌπου προβλέπεται χώρος κατοικιδίων, κράτησέ τον μακριά από προετοιμασία τροφίμων και διαδρομές υγιεινής. Μάζευε γρήγορα απόβλητα, μην αφήνεις ζώα ελεύθερα να κλείνουν εξόδους και απόφυγε επαφή άγνωστων μεταξύ τους ζώων. Μην δένεις ζώο σε σημείο όπου μπορεί να παγιδευτεί από πλήθος ή μετακινούμενο εξοπλισμό.\n\n## Διατήρησε τη λειτουργία του ζώου υπηρεσίας\nΜην αγγίζεις, ταΐζεις ή απομακρύνεις ζώο υπηρεσίας από τον χειριστή χωρίς άδεια, εκτός άμεσου κινδύνου. Ρώτησε τον χειριστή ποια βοήθεια πραγματικά χρειάζεται. Η εφεδρεία περιλαμβάνει τροφή, νερό, διαχείριση αποβλήτων και τον εξοπλισμό που απαιτείται για το έργο του ζώου.\n\n## Στρες και κίνδυνος διαφυγής\nΘόρυβος, καπνός, άγνωστοι άνθρωποι και άλλα ζώα μπορούν να κάνουν ακόμη και ήρεμο κατοικίδιο να φύγει ή να αμυνθεί. Χρησιμοποίησε ασφαλή περιορισμό και μην ανοίγεις κλουβί σε ανεξέλεγκτη περιοχή. Κράτησε δεύτερη επαφή που μπορεί να αναλάβει το ζώο αν αποτύχει η κύρια λύση καταφυγίου.\n\n## Η αποκατάσταση περιλαμβάνει το περιβάλλον του ζώου\nΜετά από πλημμύρα, φωτιά ή χημικό συμβάν, μην αφήνεις ζώα να κινούνται σε μολυσμένη αυλή, στάχτη, στάσιμο νερό ή συντρίμμια πριν η περιοχή γίνει ασφαλής. Τραυματισμός, έκθεση ή απώλεια κανονικής διατροφής/φαρμάκων χρειάζονται κτηνιατρική συμβουλή.\n\nΚωδικοί τεκμηρίωσης: READY-PETS-1, READY-SHELTER-1, READY-DISABILITY-1."}},{"id":74,"en":{"title":"Children after disruption: use routine, honest information and participation without giving them adult burdens","body":"## Predictability reduces uncertainty\nAfter evacuation or a long outage, create a simple daily rhythm for waking, meals, hygiene, learning/play and sleep. The schedule does not need to copy normal life exactly; its value is that the child knows what happens next.\n\n## Explain events at the child’s level\nUse truthful, short explanations and correct rumors gently. Avoid exposing children continuously to alarming images, adult speculation or repeated disaster footage. If there is a 112/official instruction, explain the action being taken rather than debating frightening possibilities in front of them.\n\n## Give small useful roles\nA child may carry their own light, mark completed checklist items, help count sealed water bottles or choose a comfort item. The task should create participation, not make the child responsible for family safety or the welfare of younger siblings beyond what is age-appropriate.\n\n## Keep reunification information simple\nChildren who are old enough should know their name, caregiver names, a phone number and the family meeting process. Put contact information in a secure card rather than expecting memory under stress. Follow school/shelter pickup rules.\n\n## Watch behavior over time\nChanges in sleep, appetite, concentration, play or fear can occur after frightening events. Offer reassurance and normal routines, and seek professional support when distress is severe, persistent or interferes with basic functioning. This manual does not diagnose mental-health conditions.\n\n## Include children in recovery, not in hazards\nThey can help sort clean supplies, redraw the family map or talk through what made them feel safe. Keep them out of floodwater, ash, mold, sewage, unstable structures and hazardous cleanup. Recovery learning should not become exposure.\n\nEvidence IDs: CDC-DISASTER-1, READY-PLAN-1, READY-KIT-1."},"el":{"title":"Παιδιά μετά από διαταραχή: ρουτίνα, ειλικρινής ενημέρωση και συμμετοχή χωρίς βάρη ενηλίκων","body":"## Η προβλεψιμότητα μειώνει την αβεβαιότητα\nΜετά από εκκένωση ή μεγάλη διακοπή, δημιούργησε απλό ημερήσιο ρυθμό για ξύπνημα, γεύματα, υγιεινή, μάθηση/παιχνίδι και ύπνο. Δεν χρειάζεται να αντιγράφει τέλεια την καθημερινότητα· αξία έχει ότι το παιδί γνωρίζει τι ακολουθεί.\n\n## Εξήγησε το γεγονός στο επίπεδο του παιδιού\nΧρησιμοποίησε ειλικρινείς, σύντομες εξηγήσεις και διόρθωνε ήρεμα τις φήμες. Απόφυγε συνεχή έκθεση σε τρομακτικές εικόνες, ενήλικες εικασίες ή επαναλαμβανόμενα βίντεο καταστροφής. Αν υπάρχει οδηγία 112 ή άλλης Αρχής, εξήγησε ποια ενέργεια ακολουθείτε αντί να συζητάτε μπροστά στο παιδί όλα τα τρομακτικά ενδεχόμενα.\n\n## Δώσε μικρούς χρήσιμους ρόλους\nΈνα παιδί μπορεί να κρατά τον προσωπικό φακό, να σημειώνει ολοκληρωμένα στοιχεία, να μετρά κλειστά μπουκάλια νερού ή να επιλέγει αντικείμενο παρηγοριάς. Η εργασία δημιουργεί συμμετοχή και όχι ευθύνη για την ασφάλεια της οικογένειας ή για μικρότερα παιδιά πέρα από ό,τι είναι κατάλληλο για την ηλικία.\n\n## Απλή πληροφορία επανένωσης\nΠαιδιά που είναι αρκετά μεγάλα γνωρίζουν το όνομά τους, ονόματα φροντιστών, έναν αριθμό τηλεφώνου και τη διαδικασία συνάντησης. Βάλε τα στοιχεία σε ασφαλή κάρτα αντί να βασίζεσαι μόνο στη μνήμη υπό πίεση. Ακολούθησε τους κανόνες παραλαβής σχολείου ή καταφυγίου.\n\n## Παρατήρησε τη συμπεριφορά με τον χρόνο\nΜετά από τρομακτικό συμβάν μπορεί να αλλάξει ύπνος, όρεξη, συγκέντρωση, παιχνίδι ή φόβος. Πρόσφερε ασφάλεια και κανονικές ρουτίνες και ζήτησε επαγγελματική υποστήριξη όταν η δυσφορία είναι σοβαρή, επίμονη ή εμποδίζει βασική λειτουργικότητα. Ο οδηγός δεν διαγιγνώσκει ψυχικές καταστάσεις.\n\n## Συμμετοχή στην αποκατάσταση, όχι στον κίνδυνο\nΤα παιδιά μπορούν να βοηθήσουν στην ταξινόμηση καθαρών εφοδίων, να ξανασχεδιάσουν τον οικογενειακό χάρτη ή να πουν τι τα έκανε να αισθανθούν ασφαλή. Μένουν μακριά από πλημμυρικό νερό, στάχτη, μούχλα, λύματα, ασταθείς κατασκευές και επικίνδυνο καθαρισμό. Η μάθηση από την αποκατάσταση δεν πρέπει να γίνει έκθεση σε κίνδυνο.\n\nΚωδικοί τεκμηρίωσης: CDC-DISASTER-1, READY-PLAN-1, READY-KIT-1."}},{"id":75,"en":{"title":"Caregiver shift handover: transfer the condition, equipment and next decision—not just the name","body":"## A handover should answer what changes next\nFor a dependent person, record current location, mobility/communication needs, food/water needs, medication schedule according to their established plan, equipment status, power reserve and the next time-sensitive task. Avoid a long biography that hides the immediate operating picture.\n\n## Read back critical details\nThe incoming caregiver should repeat key times, equipment alarms/indicators they are expected to watch and escalation contacts. If a device has manufacturer instructions, keep them with the equipment. Do not change settings on medical equipment unless the person’s clinical plan authorizes it.\n\n## Power continuity must be visible\nRecord which battery/source is active, estimated remaining reserve if known, which backup source is next and what condition triggers relocation or professional assistance. A label saying “battery charged” from yesterday is not enough during an ongoing outage.\n\n## Track intake/output only when part of the person’s plan\nSome care plans require clinical records; others do not. Use only the measurements the healthcare team has asked the household to track. Do not invent clinical monitoring merely because the project can store numbers.\n\n## Protect rest for both caregiver and dependent person\nA single exhausted caregiver is a continuity failure. Schedule relief, preserve sleep and identify who can safely perform each task. If no trained backup exists for a critical function, that gap should trigger earlier contact with healthcare/emergency support.\n\n## Close uncertainty explicitly\nWrite “unknown” when something is unknown rather than carrying an assumption into the next shift. The handover is complete only when the receiving person knows the next action and who to call if the situation changes.\n\nEvidence IDs: READY-DISABILITY-1, READY-OLDER-1, ACCESS-1."},"el":{"title":"Παράδοση βάρδιας φροντιστή: μεταβίβασε κατάσταση, εξοπλισμό και επόμενη απόφαση","body":"## Η παράδοση πρέπει να απαντά τι αλλάζει στη συνέχεια\nΓια εξαρτώμενο άτομο κατέγραψε τρέχουσα θέση, ανάγκες κινητικότητας/επικοινωνίας, διατροφή και νερό, πρόγραμμα φαρμάκων σύμφωνα με το καθιερωμένο σχέδιο, κατάσταση εξοπλισμού, ενεργειακή εφεδρεία και την επόμενη χρονικά κρίσιμη εργασία. Απόφυγε μεγάλη βιογραφία που κρύβει την άμεση επιχειρησιακή εικόνα.\n\n## Επανάληψη κρίσιμων στοιχείων\nΟ νέος φροντιστής επαναλαμβάνει βασικές ώρες, συναγερμούς ή ενδείξεις εξοπλισμού που πρέπει να παρατηρεί και επαφές κλιμάκωσης. Αν η συσκευή έχει οδηγίες κατασκευαστή, κράτησέ τες μαζί της. Μην αλλάζεις ρυθμίσεις ιατρικού εξοπλισμού εκτός αν το κλινικό σχέδιο το επιτρέπει.\n\n## Η συνέχεια ισχύος πρέπει να φαίνεται\nΣημείωσε ποια μπαταρία ή πηγή λειτουργεί, εκτιμώμενη εφεδρεία αν είναι γνωστή, ποια είναι η επόμενη πηγή και ποια συνθήκη οδηγεί σε μετακίνηση ή επαγγελματική βοήθεια. Μια ετικέτα «φορτισμένο» από χθες δεν επαρκεί μέσα σε συνεχιζόμενη διακοπή.\n\n## Καταγραφή μετρήσεων μόνο όταν ανήκει στο σχέδιο φροντίδας\nΟρισμένα σχέδια απαιτούν κλινικές καταγραφές και άλλα όχι. Παρακολούθησε μόνο όσα έχει ζητήσει η ομάδα υγείας από το νοικοκυριό. Μην δημιουργείς νέα ιατρική παρακολούθηση απλώς επειδή το πρόγραμμα μπορεί να αποθηκεύει αριθμούς.\n\n## Προστάτευσε ανάπαυση φροντιστή και εξαρτώμενου ατόμου\nΈνας μοναδικός εξαντλημένος φροντιστής είναι σημείο αποτυχίας. Προγραμμάτισε ανακούφιση, ύπνο και καθόρισε ποιος μπορεί να εκτελέσει κάθε εργασία με ασφάλεια. Αν δεν υπάρχει εκπαιδευμένος εφεδρικός για κρίσιμη λειτουργία, αυτό το κενό πρέπει να οδηγήσει σε νωρίτερη επικοινωνία με υγειονομική ή επείγουσα υποστήριξη.\n\n## Κλείσε την αβεβαιότητα ρητά\nΓράψε «άγνωστο» όταν κάτι δεν είναι γνωστό αντί να μεταφέρεις υπόθεση στην επόμενη βάρδια. Η παράδοση ολοκληρώνεται μόνο όταν ο νέος φροντιστής γνωρίζει την επόμενη ενέργεια και ποιον καλεί αν αλλάξει η κατάσταση.\n\nΚωδικοί τεκμηρίωσης: READY-DISABILITY-1, READY-OLDER-1, ACCESS-1."}},{"id":76,"en":{"title":"Accessible emergency communication: deliver the same action through more than one channel","body":"## A message is not delivered until it can be understood\nAn audible announcement may fail for someone who is deaf or hard of hearing; small text may fail for low vision; complex language may fail under cognitive stress; a touch-screen may be inaccessible to someone with motor limitations. Build redundant formats rather than one “standard” message.\n\n## Pair sound with text/visual cues\nImportant household alerts should have a visual or written version where practical. Use large high-contrast text and short action phrases. For someone who uses sign language or an interpreter, store contact pathways and a written fallback. Do not assume lip-reading is reliable in darkness, smoke, masks or noisy rooms.\n\n## Keep communication aids charged and identifiable\nHearing-device batteries, charging cables, speech devices, magnifiers, glasses and communication boards belong in the same continuity inventory as phones. Mark proprietary chargers and keep backups where possible. A generic USB cable does not solve every assistive-device power requirement.\n\n## Simplify without removing autonomy\nUse one instruction at a time when a person benefits from plain-language communication, but speak to the person directly rather than only to a caregiver. Confirm understanding through teach-back or a familiar response method. Do not equate a communication disability with inability to make decisions.\n\n## Include emergency services information\nRecord how the person communicates location, medical/accessibility needs and preferred method. In Greece, 112 is a core emergency pathway and mass-alert system; follow current 112 capabilities/instructions for accessible contact methods rather than relying on an old screenshot.\n\n## Test under realistic conditions\nRun a drill with lights off, hearing devices charging, background noise or gloves that reduce dexterity—without intentionally disabling essential equipment. The purpose is to find which message format survives the conditions.\n\nEvidence IDs: READY-DISABILITY-1, GR-112-1, ACCESS-1."},"el":{"title":"Προσβάσιμη επικοινωνία έκτακτης ανάγκης: η ίδια ενέργεια μέσω περισσότερων του ενός καναλιών","body":"## Ένα μήνυμα δεν έχει παραδοθεί αν δεν μπορεί να γίνει κατανοητό\nΗχητική ανακοίνωση μπορεί να αποτύχει για κωφό ή βαρήκοο άτομο, μικρά γράμματα για χαμηλή όραση, σύνθετη γλώσσα υπό γνωστική πίεση και οθόνη αφής για άτομο με κινητικό περιορισμό. Δημιούργησε εναλλακτικές μορφές αντί για ένα μοναδικό «κανονικό» μήνυμα.\n\n## Συνδύασε ήχο με κείμενο και οπτικά σήματα\nΣημαντικοί οικιακοί συναγερμοί χρειάζονται οπτική ή γραπτή εκδοχή όπου είναι πρακτικό. Χρησιμοποίησε μεγάλα γράμματα, υψηλή αντίθεση και σύντομες φράσεις ενέργειας. Για χρήστη νοηματικής ή διερμηνέα, αποθήκευσε επαφές και γραπτή εφεδρεία. Μην θεωρείς τη χειλεανάγνωση αξιόπιστη σε σκοτάδι, καπνό, μάσκες ή πολύ θόρυβο.\n\n## Κράτησε βοηθήματα επικοινωνίας φορτισμένα και αναγνωρίσιμα\nΜπαταρίες ακουστικών, καλώδια φόρτισης, συσκευές ομιλίας, μεγεθυντικοί φακοί, γυαλιά και πίνακες επικοινωνίας ανήκουν στην ίδια απογραφή συνέχειας με τα τηλέφωνα. Σημείωσε ειδικούς φορτιστές και κράτησε εφεδρεία όπου γίνεται. Ένα γενικό καλώδιο USB δεν λύνει κάθε ανάγκη βοηθητικής τεχνολογίας.\n\n## Απλοποίησε χωρίς να αφαιρείς αυτονομία\nΔώσε μία οδηγία τη φορά όταν το άτομο ωφελείται από απλή γλώσσα, αλλά μίλησε απευθείας στο άτομο και όχι μόνο στον φροντιστή. Επιβεβαίωσε κατανόηση με επανάληψη ή γνώριμη μέθοδο απάντησης. Μια δυσκολία επικοινωνίας δεν σημαίνει αδυναμία λήψης αποφάσεων.\n\n## Συμπερίλαβε τις υπηρεσίες έκτακτης ανάγκης\nΚατέγραψε πώς το άτομο μεταδίδει θέση, ιατρικές ή προσβασιμότητας ανάγκες και προτιμώμενο τρόπο επικοινωνίας. Στην Ελλάδα το 112 αποτελεί βασική διαδρομή έκτακτης ανάγκης και μαζικών ειδοποιήσεων· ακολούθησε τις τρέχουσες δυνατότητες και οδηγίες του 112 για προσβάσιμη επικοινωνία αντί να βασίζεσαι σε παλιό στιγμιότυπο.\n\n## Δοκίμασε σε ρεαλιστικές συνθήκες\nΚάνε άσκηση με σβηστά φώτα, με βοηθήματα σε φόρτιση, θόρυβο ή γάντια που μειώνουν τη δεξιότητα—χωρίς να απενεργοποιείς σκόπιμα κρίσιμο εξοπλισμό. Στόχος είναι να φανεί ποια μορφή μηνύματος επιβιώνει στις συνθήκες.\n\nΚωδικοί τεκμηρίωσης: READY-DISABILITY-1, GR-112-1, ACCESS-1."}},{"id":77,"en":{"title":"Emergency documents: create usable copies without creating a privacy disaster","body":"## Decide what must survive\nIdentification details, insurance contacts, property/vehicle information, medication list, essential prescriptions, emergency contacts and critical account/service references may be difficult to reconstruct during displacement. Store only what your household genuinely needs; an emergency archive should not become a copy of every confidential document you own.\n\n## Use two forms with different risks\nA physical packet works without electricity but can be lost or stolen. An encrypted digital copy can hold more detail but depends on a device, credentials and power. Use both where appropriate and understand the protection of each. The project’s normal local exports are plaintext unless the device/filesystem protects them, so do not assume the ZIP or JSON is encrypted.\n\n## Waterproof the physical minimum\nUse a water-resistant inner pouch and keep it accessible for evacuation but not visibly exposed in the home or vehicle. Consider copies rather than originals when accepted for the purpose; originals that are required should have a designated owner during evacuation.\n\n## Make digital files readable offline\nDo not rely on cloud-only links. Export essential documents in common formats and test opening them while the phone is in airplane mode. Record passwords/recovery methods in a secure way appropriate to your threat model; never put the password in the same unprotected file as the encrypted archive.\n\n## Date and review\nA five-year-old insurance number or discontinued medication is worse than no quick-reference card because it appears authoritative. Put a review date on the packet and update after a move, policy change, new prescription or vehicle change.\n\n## Redact what you share\nFor shelter registration, mutual aid or a repair contractor, provide only the necessary page/data. The v6/v7 redacted schema template should contain no personal operational data; use that kind of blank structure when demonstrating the project publicly.\n\nEvidence IDs: READY-KIT-1, READY-PLAN-1, READY-DISABILITY-1."},"el":{"title":"Έγγραφα έκτακτης ανάγκης: χρήσιμα αντίγραφα χωρίς να δημιουργείται καταστροφή ιδιωτικότητας","body":"## Αποφάσισε τι πραγματικά πρέπει να επιβιώσει\nΣτοιχεία ταυτότητας, επαφές ασφάλισης, πληροφορίες ακινήτου/οχήματος, λίστα φαρμάκων, βασικές συνταγές, επείγουσες επαφές και κρίσιμα στοιχεία υπηρεσιών μπορεί να είναι δύσκολο να ανακτηθούν σε μετακίνηση. Αποθήκευσε μόνο όσα χρειάζεται πραγματικά το νοικοκυριό· ένας φάκελος ανάγκης δεν πρέπει να γίνει αντίγραφο κάθε εμπιστευτικού εγγράφου.\n\n## Δύο μορφές με διαφορετικούς κινδύνους\nΈνα φυσικό πακέτο λειτουργεί χωρίς ρεύμα αλλά μπορεί να χαθεί ή να κλαπεί. Κρυπτογραφημένο ψηφιακό αντίγραφο χωρά περισσότερα αλλά εξαρτάται από συσκευή, διαπιστευτήρια και ενέργεια. Χρησιμοποίησε και τα δύο όπου είναι κατάλληλο και γνώρισε την προστασία τους. Οι κανονικές τοπικές εξαγωγές του έργου είναι απλό κείμενο εκτός αν τις προστατεύει η κρυπτογράφηση συσκευής ή συστήματος αρχείων, άρα μην θεωρείς αυτόματα ότι ένα ZIP ή JSON είναι κρυπτογραφημένο.\n\n## Αδιάβροχο φυσικό ελάχιστο\nΧρησιμοποίησε εσωτερική ανθεκτική στο νερό θήκη, προσβάσιμη για εκκένωση αλλά όχι εκτεθειμένη σε εμφανές σημείο σπιτιού ή οχήματος. Όπου γίνονται δεκτά, κράτησε αντίγραφα αντί για πρωτότυπα· αν κάποιο πρωτότυπο είναι απαραίτητο, όρισε ποιος το μεταφέρει.\n\n## Ψηφιακά αρχεία που ανοίγουν χωρίς σύνδεση\nΜην βασίζεσαι σε συνδέσμους που απαιτούν νέφος. Εξήγαγε τα απαραίτητα σε κοινές μορφές και δοκίμασε να τα ανοίξεις με το τηλέφωνο σε λειτουργία πτήσης. Κράτησε κωδικούς ή μεθόδους ανάκτησης με τρόπο κατάλληλο για το μοντέλο απειλής σου· ποτέ μην βάζεις τον κωδικό στο ίδιο απροστάτευτο αρχείο με το κρυπτογραφημένο περιεχόμενο.\n\n## Ημερομηνία και αναθεώρηση\nΠαλιός αριθμός ασφάλισης ή φάρμακο που έχει διακοπεί είναι χειρότερο από την απουσία κάρτας γιατί φαίνεται έγκυρο. Βάλε ημερομηνία επανελέγχου και ενημέρωσε μετά από μετακόμιση, αλλαγή συμβολαίου, νέα συνταγή ή αλλαγή οχήματος.\n\n## Μοιράσου μόνο το απαραίτητο\nΓια καταφύγιο, κοινοτική βοήθεια ή τεχνικό επισκευής δώσε μόνο τη σελίδα ή πληροφορία που χρειάζεται. Το αποχαρακτηρισμένο πρότυπο του έργου πρέπει να είναι κενό από προσωπικά επιχειρησιακά δεδομένα· χρησιμοποίησε τέτοια κενή δομή όταν παρουσιάζεις δημόσια το πρόγραμμα.\n\nΚωδικοί τεκμηρίωσης: READY-KIT-1, READY-PLAN-1, READY-DISABILITY-1."}},{"id":78,"en":{"title":"Payment outage and cash continuity: preserve purchasing ability without concentrating loss","body":"## A working shop may have a failed payment channel\nPower, telecom or banking disruptions can leave shelves stocked but cards, ATMs or mobile payments unavailable. Keep a modest emergency payment reserve appropriate to your household and local context. Avoid storing excessive cash in one obvious location.\n\n## Use small practical denominations\nDuring a communications outage a seller may be unable to provide change or verify large notes. A mix of ordinary denominations can be more useful than one large note. Keep coins/notes dry and separate from documents that reveal all account details.\n\n## Record emergency purchases\nFor fuel, lodging, repairs and essential supplies, keep receipts or photograph them when safe. If no formal receipt is available, write date, seller, item, amount and payment method. This supports household budgeting and may help later insurance/recovery documentation; it does not guarantee reimbursement.\n\n## Separate currencies in the ledger\nDo not add euros, dollars and other currencies into one meaningless total. Keep each currency separate unless you deliberately record a conversion rate/date. The Command Center’s expense ledger should preserve the original amount and currency.\n\n## Plan for account access without exposing credentials\nStore bank/insurer contact information, not full credentials in an unprotected emergency note. Know how to freeze a card or contact the provider if a wallet is lost during evacuation. Device authentication and account recovery should not depend on a single phone that may be damaged.\n\n## Reconcile when systems return\nCompare emergency notes with bank records, identify duplicate charges and attach evidence to recovery cases. Refill the cash reserve only after normal access is stable and review whether the reserve amount matched actual needs.\n\nEvidence IDs: READY-PLAN-1, READY-KIT-1."},"el":{"title":"Διακοπή πληρωμών και εφεδρεία μετρητών: διατήρησε αγοραστική δυνατότητα χωρίς συγκέντρωση κινδύνου","body":"## Ένα ανοικτό κατάστημα μπορεί να μην έχει ενεργό σύστημα πληρωμών\nΔιακοπή ρεύματος, τηλεπικοινωνιών ή τραπεζικών υπηρεσιών μπορεί να αφήσει τα ράφια γεμάτα αλλά κάρτες, ΑΤΜ ή κινητές πληρωμές εκτός λειτουργίας. Κράτησε μέτρια εφεδρεία πληρωμής κατάλληλη για το νοικοκυριό και την περιοχή. Απόφυγε μεγάλο ποσό μετρητών σε ένα εμφανές σημείο.\n\n## Χρησιμοποίησε πρακτικές μικρές ονομαστικές αξίες\nΣε διακοπή επικοινωνιών ένας πωλητής μπορεί να μην έχει ρέστα ή δυνατότητα επαλήθευσης μεγάλης αξίας. Συνδυασμός συνηθισμένων χαρτονομισμάτων/κερμάτων είναι συχνά πιο χρήσιμος από ένα μεγάλο χαρτονόμισμα. Κράτησέ τα στεγνά και χωριστά από έγγραφα που αποκαλύπτουν πλήρη στοιχεία λογαριασμών.\n\n## Κατέγραψε τις αγορές ανάγκης\nΓια καύσιμο, κατάλυμα, επισκευές και βασικά εφόδια κράτησε αποδείξεις ή φωτογράφισέ τες όταν είναι ασφαλές. Αν δεν υπάρχει κανονική απόδειξη, γράψε ημερομηνία, πωλητή, είδος, ποσό και μέθοδο. Αυτό βοηθά προϋπολογισμό και μπορεί να στηρίξει φάκελο ασφάλισης/αποκατάστασης, χωρίς να εγγυάται αποζημίωση.\n\n## Χώρισε τα νομίσματα στο ημερολόγιο\nΜην προσθέτεις ευρώ, δολάρια και άλλα νομίσματα σε ένα άχρηστο συνολικό νούμερο. Κράτησε κάθε νόμισμα χωριστά εκτός αν καταγράφεις συνειδητά ισοτιμία και ημερομηνία. Το ημερολόγιο εξόδων του Command Center πρέπει να διατηρεί το αρχικό ποσό και νόμισμα.\n\n## Σχεδίασε πρόσβαση σε λογαριασμούς χωρίς να αποκαλύπτεις κωδικούς\nΑποθήκευσε επαφές τράπεζας/ασφάλισης και όχι πλήρη διαπιστευτήρια σε απροστάτευτη σημείωση ανάγκης. Γνώρισε πώς μπλοκάρεται κάρτα αν χαθεί πορτοφόλι στην εκκένωση. Ο έλεγχος ταυτότητας και η ανάκτηση λογαριασμού δεν πρέπει να εξαρτώνται από ένα μόνο τηλέφωνο που μπορεί να καταστραφεί.\n\n## Συμφωνία όταν επιστρέψουν τα συστήματα\nΣύγκρινε σημειώσεις ανάγκης με τραπεζικές κινήσεις, εντόπισε διπλές χρεώσεις και σύνδεσε αποδείξεις με υποθέσεις αποκατάστασης. Αναπλήρωσε το απόθεμα μετρητών αφού σταθεροποιηθεί η πρόσβαση και αξιολόγησε αν το ποσό ήταν κατάλληλο για τις πραγματικές ανάγκες.\n\nΚωδικοί τεκμηρίωσης: READY-PLAN-1, READY-KIT-1."}},{"id":79,"en":{"title":"Damage photography and evidence chain: document safely before cleanup changes the scene","body":"## Safety comes before documentation\nDo not enter a structurally unsafe, smoke-filled, electrically hazardous, flooded or contaminated area to obtain a better photo. Wait for clearance where required. A claim photograph is never worth exposure to an active hazard.\n\n## Start with context, then detail\nWhen safe, photograph the exterior/location, then the room/area, then individual damaged items. Include identifying features that show where the damage occurred. For large losses, a short narrated video can complement still images, but still photographs are easier to index and compare.\n\n## Keep original files\nAvoid editing or repeatedly re-saving the only copy. Preserve original timestamps/metadata where possible and make a backup. If you annotate a copy, keep the original separately. Record the photographer and date/time if device time may have been wrong during the outage.\n\n## Link images to an inventory\nUse a simple identifier for each damaged item or area and put the same identifier in the expense/recovery log. Add purchase information or serial number only where relevant and safe to store. This prevents a folder of hundreds of unnamed images from becoming unusable.\n\n## Document disposal decisions\nSome spoiled food, wet material or contaminated property may need to be removed quickly. Photograph it before disposal when safe and retain any official/contractor instruction that required removal. Do not keep hazardous material in the home solely because an insurer might want to see it physically.\n\n## Protect private information\nImages can expose IDs, prescriptions, addresses, security systems and people. Share only the subset required by the insurer, authority or contractor. Keep the full evidence archive protected like other sensitive emergency documents.\n\nEvidence IDs: CLEANUP-1, READY-PLAN-1."},"el":{"title":"Φωτογράφιση ζημιών και αλυσίδα τεκμηρίωσης: κατέγραψε με ασφάλεια πριν ο καθαρισμός αλλάξει την εικόνα","body":"## Η ασφάλεια προηγείται της τεκμηρίωσης\nΜην μπαίνεις σε δομικά ασταθή, καπνισμένο, ηλεκτρικά επικίνδυνο, πλημμυρισμένο ή μολυσμένο χώρο για «καλύτερη φωτογραφία». Περίμενε άδεια όπου απαιτείται. Καμία εικόνα για αποζημίωση δεν αξίζει έκθεση σε ενεργό κίνδυνο.\n\n## Ξεκίνα με γενικό πλαίσιο και μετά λεπτομέρεια\nΌταν είναι ασφαλές, φωτογράφισε πρώτα εξωτερικό ή θέση, μετά δωμάτιο/περιοχή και έπειτα μεμονωμένα κατεστραμμένα αντικείμενα. Συμπερίλαβε στοιχεία που δείχνουν πού συνέβη η ζημιά. Σε μεγάλη απώλεια, σύντομο βίντεο με περιγραφή μπορεί να συμπληρώσει τις φωτογραφίες, αλλά οι στατικές εικόνες είναι ευκολότερες στην ταξινόμηση και σύγκριση.\n\n## Διατήρησε τα πρωτότυπα αρχεία\nΜην επεξεργάζεσαι ή αποθηκεύεις ξανά επανειλημμένα το μοναδικό αντίγραφο. Κράτησε αρχικά χρονικά/μεταδεδομένα όπου γίνεται και φτιάξε εφεδρεία. Αν σημειώσεις πάνω σε αντίγραφο, φύλαξε το πρωτότυπο χωριστά. Κατέγραψε φωτογράφο και ώρα αν το ρολόι της συσκευής μπορεί να ήταν λάθος μέσα στη διακοπή.\n\n## Σύνδεσε εικόνες με απογραφή\nΔώσε απλό κωδικό σε κάθε κατεστραμμένο αντικείμενο ή περιοχή και χρησιμοποίησε τον ίδιο στο ημερολόγιο εξόδων/αποκατάστασης. Πρόσθεσε στοιχεία αγοράς ή σειριακό αριθμό μόνο όπου χρειάζεται και είναι ασφαλές. Έτσι ένας φάκελος με εκατοντάδες ανώνυμες εικόνες δεν γίνεται άχρηστος.\n\n## Τεκμηρίωσε τις αποφάσεις απόρριψης\nΧαλασμένα τρόφιμα, βρεγμένα υλικά ή μολυσμένη περιουσία μπορεί να πρέπει να απομακρυνθούν γρήγορα. Φωτογράφισέ τα πριν από την απόρριψη όταν είναι ασφαλές και κράτησε τυχόν επίσημη ή τεχνική οδηγία που απαίτησε αφαίρεση. Μην κρατάς επικίνδυνο υλικό στο σπίτι μόνο επειδή «ίσως το θέλει η ασφάλεια».\n\n## Προστάτευσε ιδιωτικές πληροφορίες\nΟι εικόνες μπορούν να αποκαλύψουν ταυτότητες, συνταγές, διευθύνσεις, συστήματα ασφαλείας και ανθρώπους. Μοιράσου μόνο το υποσύνολο που απαιτεί ο ασφαλιστής, η Αρχή ή ο τεχνικός. Ο πλήρης φάκελος τεκμηρίωσης προστατεύεται όπως τα άλλα ευαίσθητα έγγραφα ανάγκης.\n\nΚωδικοί τεκμηρίωσης: CLEANUP-1, READY-PLAN-1."}},{"id":80,"en":{"title":"After-action review: convert the incident into specific changes instead of a story","body":"## Review soon enough to remember details\nHold a short review after immediate safety and recovery pressures have stabilized. Use logs, check-ins, photos and actual resource records rather than relying only on memory. The goal is not to assign blame; it is to find which assumptions failed and which actions worked.\n\n## Reconstruct a timeline\nMark the first warning, key decisions, departures, power/water loss, communications failures, resource thresholds and restoration. Differences between planned and actual timing often reveal the most important weakness—such as a route that took twice as long or a battery reserve that lasted half the estimate.\n\n## Separate observations from judgments\nWrite “the freezer reached X at Y time” or “the alternate road was closed” before writing “we were unprepared.” Specific observations can produce corrective actions; broad judgments usually cannot.\n\n## Identify one owner and deadline for each correction\nExamples: replace a failed cable, move documents to a waterproof pouch, add a second contact, practice the stair route, change the evacuation trigger. A lesson without an owner/date becomes a note nobody acts on.\n\n## Remove unnecessary complexity\nNot every problem requires buying equipment. If a checklist was too long, simplify it. If two logs duplicated information, combine them. If a gadget was never used, decide whether it belongs in the kit. Improvement includes subtraction.\n\n## Test the correction\nAfter changes, run a focused drill that reproduces the failed condition safely. Close the improvement only when the new process works. Keep the before/after note in the training history so future household members understand why the rule exists.\n\nEvidence IDs: READY-PLAN-1, GR-GENERAL-1."},"el":{"title":"Ανασκόπηση μετά το συμβάν: μετέτρεψε την εμπειρία σε συγκεκριμένες αλλαγές και όχι απλή ιστορία","body":"## Κάνε την ανασκόπηση όσο οι λεπτομέρειες είναι ακόμη διαθέσιμες\nΑφού σταθεροποιηθούν η ασφάλεια και οι άμεσες ανάγκες αποκατάστασης, κάνε σύντομη ανασκόπηση. Χρησιμοποίησε ημερολόγια, check-in, φωτογραφίες και πραγματικές καταγραφές πόρων αντί να βασίζεσαι μόνο στη μνήμη. Στόχος δεν είναι να βρεθεί φταίχτης αλλά να φανεί ποια υπόθεση απέτυχε και ποια ενέργεια λειτούργησε.\n\n## Ανακατασκεύασε χρονογραμμή\nΣημείωσε πρώτη προειδοποίηση, κρίσιμες αποφάσεις, αναχώρηση, απώλεια ρεύματος/νερού, αποτυχίες επικοινωνιών, όρια πόρων και επαναφορά. Η διαφορά μεταξύ προγραμματισμένου και πραγματικού χρόνου συχνά αποκαλύπτει την πιο σημαντική αδυναμία—π.χ. διαδρομή που πήρε διπλάσιο χρόνο ή μπαταρία που κράτησε το μισό από την εκτίμηση.\n\n## Ξεχώρισε παρατήρηση από κρίση\nΓράψε «η κατάψυξη έφτασε στη Χ θερμοκρασία την Ψ ώρα» ή «ο εναλλακτικός δρόμος ήταν κλειστός» πριν γράψεις «δεν ήμασταν προετοιμασμένοι». Συγκεκριμένες παρατηρήσεις οδηγούν σε διορθώσεις· γενικές κρίσεις συνήθως όχι.\n\n## Ένας υπεύθυνος και μία προθεσμία ανά διόρθωση\nΠαραδείγματα: αντικατάσταση χαλασμένου καλωδίου, μετακίνηση εγγράφων σε αδιάβροχη θήκη, προσθήκη δεύτερης επαφής, άσκηση σκάλας, αλλαγή ορίου εκκένωσης. Ένα «μάθημα» χωρίς υπεύθυνο και ημερομηνία γίνεται σημείωση που δεν υλοποιείται.\n\n## Αφαίρεσε περιττή πολυπλοκότητα\nΔεν λύνεται κάθε πρόβλημα με αγορά εξοπλισμού. Αν μια λίστα ήταν υπερβολικά μεγάλη, απλοποίησέ την. Αν δύο ημερολόγια έγραφαν το ίδιο, συνδύασέ τα. Αν ένα εργαλείο δεν χρησιμοποιήθηκε ποτέ, αποφάσισε αν ανήκει πραγματικά στο κιτ. Η βελτίωση περιλαμβάνει και αφαίρεση.\n\n## Δοκίμασε τη διόρθωση\nΜετά τις αλλαγές κάνε στοχευμένη άσκηση που αναπαράγει με ασφάλεια τη συνθήκη που απέτυχε. Κλείσε τη βελτίωση μόνο όταν η νέα διαδικασία λειτουργήσει. Φύλαξε την πριν/μετά σημείωση στο ιστορικό εκπαίδευσης ώστε οι επόμενοι να γνωρίζουν γιατί υπάρχει ο κανόνας.\n\nΚωδικοί τεκμηρίωσης: READY-PLAN-1, GR-GENERAL-1."}},{"id":81,"en":{"title":"Tools and spare parts: store the failures you can safely fix, not a fantasy workshop","body":"## Start from actual household systems\nList the equipment whose failure would materially affect water, shelter, transport, communications or power. Record the model and the small consumables that normally fail: fuses specified by the manufacturer, flashlight cells, bicycle tubes, filter elements, approved charging cables, fasteners, tape, seals or hand tools already used for routine maintenance.\n\n## Separate repair from hazardous work\nOwning a tool does not make electrical panels, gas systems, damaged structures, pressurized equipment or contaminated machinery safe to work on. Mark tasks that require a licensed/qualified professional and keep the relevant service contact with the equipment record. Emergency urgency is not permission to bypass safety systems.\n\n## Test compatibility before the incident\nA spare part with the wrong connector, thread, voltage or size is dead inventory. Whenever practical, fit or test a spare during normal maintenance, then return a fresh/verified replacement to stock. Label parts with the device they belong to instead of relying on memory.\n\n## Keep a field repair module small\nFor evacuation, carry only tools that support likely route/transport problems and can be used competently. A heavy box of general tools can displace water, medication and weather protection. The larger home tool set can remain organized by system.\n\n## Track consumption\nWhen a repair uses the last fuse, patch, filter or fastener, update the inventory immediately. Reorder before the item disappears from memory. Some spares age even when unused, so include inspection dates for adhesives, rubber, batteries and other degradable items.\n\n## Preserve manuals offline\nSave the manufacturer instructions for critical equipment locally. A spare part is more useful when the torque, installation, safety and troubleshooting instructions are available without internet access. Do not reproduce proprietary service procedures inaccurately inside the survival guide; keep the official manual alongside the equipment.\n\nEvidence IDs: READY-KIT-1, READY-PLAN-1."},"el":{"title":"Εργαλεία και ανταλλακτικά: αποθήκευσε ό,τι μπορείς πράγματι να επισκευάσεις με ασφάλεια","body":"## Ξεκίνα από τα πραγματικά συστήματα του νοικοκυριού\nΚατέγραψε εξοπλισμό του οποίου η βλάβη επηρεάζει ουσιαστικά νερό, καταφύγιο, μεταφορά, επικοινωνίες ή ισχύ. Σημείωσε μοντέλο και μικρά αναλώσιμα που συνήθως χαλάνε: ασφάλειες που ορίζει ο κατασκευαστής, μπαταρίες φακών, σαμπρέλες, φίλτρα, εγκεκριμένα καλώδια φόρτισης, συνδέσμους, ταινίες, στεγανοποιητικά ή εργαλεία που ήδη χρησιμοποιούνται σε κανονική συντήρηση.\n\n## Ξεχώρισε επισκευή από επικίνδυνη εργασία\nΗ κατοχή εργαλείου δεν κάνει ασφαλή την εργασία σε ηλεκτρικό πίνακα, αέριο, κατεστραμμένη κατασκευή, πιεστικό σύστημα ή μολυσμένο μηχάνημα. Σημείωσε ποιες εργασίες απαιτούν αδειοδοτημένο ή κατάλληλο επαγγελματία και κράτησε την επαφή μαζί με το αρχείο εξοπλισμού. Η πίεση της έκτακτης ανάγκης δεν επιτρέπει παράκαμψη προστατευτικών συστημάτων.\n\n## Έλεγξε συμβατότητα πριν από το συμβάν\nΑνταλλακτικό με λάθος βύσμα, σπείρωμα, τάση ή μέγεθος είναι νεκρό απόθεμα. Όπου γίνεται, δοκίμασε ή τοποθέτησε το ανταλλακτικό κατά την κανονική συντήρηση και μετά βάλε νέο επαληθευμένο στη θέση του. Σήμανε τα εξαρτήματα με τη συσκευή στην οποία ανήκουν αντί να βασίζεσαι στη μνήμη.\n\n## Μικρό κιτ επισκευής για μετακίνηση\nΣτην εκκένωση πάρε μόνο εργαλεία που υποστηρίζουν πιθανά προβλήματα διαδρομής ή μεταφοράς και γνωρίζεις να χρησιμοποιείς. Βαρύ γενικό κιβώτιο μπορεί να εκτοπίσει νερό, φάρμακα και προστασία από τον καιρό. Το μεγαλύτερο οικιακό σύνολο οργανώνεται ανά σύστημα.\n\n## Κατέγραψε κατανάλωση\nΌταν μια επισκευή χρησιμοποιήσει την τελευταία ασφάλεια, μπαλώμα, φίλτρο ή σύνδεσμο, ενημέρωσε αμέσως την απογραφή. Αναπλήρωσε πριν ξεχαστεί. Ορισμένα ανταλλακτικά γερνούν χωρίς χρήση, επομένως βάλε ημερομηνίες ελέγχου σε κόλλες, λάστιχα, μπαταρίες και άλλα υλικά που αλλοιώνονται.\n\n## Κράτησε οδηγίες κατασκευαστή χωρίς σύνδεση\nΑποθήκευσε το επίσημο εγχειρίδιο κρίσιμου εξοπλισμού τοπικά. Το ανταλλακτικό είναι πιο χρήσιμο όταν οι οδηγίες εγκατάστασης, ασφάλειας και αντιμετώπισης βλαβών είναι διαθέσιμες χωρίς διαδίκτυο. Μην αντιγράφεις ανακριβώς ιδιόκτητες τεχνικές διαδικασίες μέσα στον οδηγό· κράτησε το επίσημο εγχειρίδιο δίπλα στον εξοπλισμό.\n\nΚωδικοί τεκμηρίωσης: READY-KIT-1, READY-PLAN-1."}},{"id":82,"en":{"title":"Utility shutoff map: know where controls are without practicing hazardous manipulation","body":"## Identification comes before operation\nMark the location of the main water shutoff, electrical service/distribution area and any fuel/gas controls relevant to the property. Record who is authorized/competent to operate each and the utility/emergency contact. The map is for rapid identification; it is not a substitute for training or local rules.\n\n## Learn normal indicators\nPhotograph labels and panel directories in normal conditions. Keep access clear. If a valve or breaker is already damaged, corroded, inaccessible or unlabeled, correct that during routine maintenance rather than discovering it during a flood or fire.\n\n## Do not improvise on gas or damaged electrical systems\nIf there is suspected gas leak, fire, floodwater around electrical equipment, arcing, damaged service conductors or other serious hazard, evacuate/keep clear and contact emergency services or the utility according to local guidance. Do not enter a hazardous area merely to reach a shutoff.\n\n## Water shutoff can limit secondary damage\nWhere it is safe and the household has been shown the correct control, stopping water after a major internal pipe failure may reduce damage. Keep the proper non-specialized tool accessible if the installation requires one, but never force a stuck valve during an emergency.\n\n## Label the recovery side too\nAfter any emergency shutoff, record who is allowed to restore service. Some systems require inspection or utility action before re-energizing/reopening. “I turned it off, so I can turn it back on” is not a universal rule.\n\n## Drill by pointing, not by creating an outage\nA household exercise can have each person identify the controls, exits and contacts without actually interrupting gas/electricity or life-support equipment. This builds orientation without introducing unnecessary hazard.\n\nEvidence IDs: GR-GENERAL-1, READY-PLAN-1, POWER-1."},"el":{"title":"Χάρτης διακοπής παροχών: γνώρισε τα σημεία ελέγχου χωρίς επικίνδυνους αυτοσχεδιασμούς","body":"## Η αναγνώριση προηγείται του χειρισμού\nΣημείωσε την κύρια διακοπή νερού, την περιοχή ηλεκτρικής παροχής/πίνακα και τυχόν ελέγχους καυσίμου ή αερίου που αφορούν το ακίνητο. Κατέγραψε ποιος είναι αρμόδιος ή εκπαιδευμένος να χειριστεί το καθένα και την επαφή της υπηρεσίας. Ο χάρτης επιτρέπει γρήγορο εντοπισμό και δεν αντικαθιστά εκπαίδευση ή τοπικούς κανόνες.\n\n## Γνώρισε τις κανονικές ενδείξεις\nΦωτογράφισε ετικέτες και κατανομή πίνακα σε φυσιολογικές συνθήκες. Κράτησε την πρόσβαση ελεύθερη. Αν βαλβίδα ή διακόπτης είναι ήδη κατεστραμμένος, σκουριασμένος, απρόσιτος ή χωρίς σήμανση, διόρθωσέ το σε τακτική συντήρηση και όχι όταν έχει ήδη συμβεί πλημμύρα ή φωτιά.\n\n## Μην αυτοσχεδιάζεις σε αέριο ή κατεστραμμένο ηλεκτρικό σύστημα\nΣε πιθανή διαρροή αερίου, πυρκαγιά, πλημμυρικό νερό γύρω από ηλεκτρικό εξοπλισμό, ηλεκτρικό τόξο ή ζημιά στην παροχή, απομακρύνσου και επικοινώνησε με υπηρεσίες έκτακτης ανάγκης ή τον πάροχο σύμφωνα με την τοπική καθοδήγηση. Μην μπαίνεις σε επικίνδυνη ζώνη μόνο για να φτάσεις σε διακόπτη.\n\n## Η διακοπή νερού μπορεί να περιορίσει δευτερογενή ζημιά\nΌπου είναι ασφαλές και το νοικοκυριό έχει μάθει ποια είναι η σωστή βαλβίδα, η διακοπή μετά από μεγάλη εσωτερική θραύση σωλήνα μπορεί να μειώσει ζημιές. Κράτησε το απλό κατάλληλο εργαλείο αν απαιτείται από την εγκατάσταση, αλλά μην πιέζεις κολλημένη βαλβίδα μέσα στην έκτακτη ανάγκη.\n\n## Σήμανε και την πλευρά επαναφοράς\nΜετά από επείγουσα διακοπή, κατέγραψε ποιος επιτρέπεται να επαναφέρει την παροχή. Ορισμένα συστήματα απαιτούν επιθεώρηση ή ενέργεια του παρόχου πριν ξαναενεργοποιηθούν. Το «εγώ το έκλεισα, άρα εγώ το ανοίγω» δεν είναι καθολικός κανόνας.\n\n## Άσκηση με αναγνώριση και όχι δημιουργία βλάβης\nΣε οικιακή άσκηση κάθε άτομο μπορεί να δείξει τα σημεία ελέγχου, εξόδους και επαφές χωρίς να κόβεται πράγματι αέριο, ρεύμα ή εξοπλισμός υγείας. Έτσι δημιουργείται προσανατολισμός χωρίς νέο κίνδυνο.\n\nΚωδικοί τεκμηρίωσης: GR-GENERAL-1, READY-PLAN-1, POWER-1."}},{"id":83,"en":{"title":"Utility restoration: verify stability before rebuilding normal operations","body":"## “Power is back” is not the end state\nElectricity, water or communications may return intermittently after a major disruption. Bring critical systems back in stages. Observe for unusual smell, heat, leaks, low water pressure, repeated trips or other abnormal conditions rather than reconnecting every load immediately.\n\n## Electricity: start with safety-critical checks\nKeep wet or damaged electrical equipment out of service until evaluated. Reconnect essential low-risk loads first and watch the source. Large appliances and temporary extension systems should not all be restarted simultaneously. If protection devices trip repeatedly, stop and seek qualified help rather than resetting continuously.\n\n## Water: confirm the advisory status\nRestored pressure does not necessarily mean water is approved for drinking. Check the utility/public-health notice and follow any boil-water or do-not-use instruction. Flush, clean or treat only according to the current guidance for the event; keep emergency drinking water separate until clearance is explicit.\n\n## Communications: expect congestion and stale information\nWhen mobile data returns, cached pages and delayed messages can appear in confusing order. Verify timestamps and official sources. Use the restoration window to send concise status updates and download essential current instructions, not to exhaust batteries on nonessential traffic.\n\n## Reset temporary systems deliberately\nClose generator or battery arrangements according to their safe procedures, remove temporary cords, clean sanitation backups and move supplies back to normal storage only after the primary utility is dependable. A temporary system left half-connected becomes a future hazard.\n\n## Record the real restoration time\nLog when each service became stable—not merely the first moment it flickered on. This helps calculate food cold-chain exposure, battery usage and actual outage duration for after-action review.\n\nEvidence IDs: POWER-1, EPA-WATER-1, READY-PLAN-1."},"el":{"title":"Επαναφορά υποδομών: επαλήθευσε σταθερότητα πριν επιστρέψεις σε κανονική λειτουργία","body":"## «Ήρθε το ρεύμα» δεν είναι τελική κατάσταση\nΗλεκτρισμός, νερό ή επικοινωνίες μπορεί να επιστρέψουν διακοπτόμενα μετά από μεγάλη βλάβη. Επανέφερε τα κρίσιμα συστήματα σταδιακά. Παρατήρησε ασυνήθιστη οσμή, θερμότητα, διαρροές, χαμηλή πίεση, επαναλαμβανόμενη πτώση προστασίας ή άλλα μη φυσιολογικά σημάδια αντί να συνδέσεις αμέσως κάθε φορτίο.\n\n## Ηλεκτρισμός: πρώτα οι κρίσιμοι έλεγχοι ασφάλειας\nΒρεγμένος ή κατεστραμμένος ηλεκτρικός εξοπλισμός μένει εκτός μέχρι να αξιολογηθεί. Σύνδεσε πρώτα απαραίτητα και χαμηλού κινδύνου φορτία και παρακολούθησε την πηγή. Μεγάλες συσκευές και προσωρινές προεκτάσεις δεν επανεκκινούν όλα ταυτόχρονα. Αν προστασία πέφτει επανειλημμένα, σταμάτησε και ζήτησε αρμόδια βοήθεια αντί για συνεχή επαναφορά.\n\n## Νερό: επιβεβαίωσε την κατάσταση της ανακοίνωσης\nΗ επιστροφή πίεσης δεν σημαίνει απαραίτητα ότι το νερό εγκρίθηκε για πόση. Έλεγξε ανακοίνωση υπηρεσίας ή δημόσιας υγείας και ακολούθησε τυχόν οδηγία βρασμού ή μη χρήσης. Έκπλυση, καθαρισμός ή επεξεργασία γίνονται μόνο σύμφωνα με την τρέχουσα καθοδήγηση του συμβάντος· το απόθεμα πόσιμου παραμένει χωριστό μέχρι σαφή άδεια.\n\n## Επικοινωνίες: περίμενε συμφόρηση και παλιές πληροφορίες\nΌταν επιστρέψουν δεδομένα κινητής, προσωρινά αποθηκευμένες σελίδες και καθυστερημένα μηνύματα μπορεί να εμφανιστούν με μπερδεμένη σειρά. Έλεγξε χρονικές σημάνσεις και επίσημες πηγές. Χρησιμοποίησε το παράθυρο αποκατάστασης για σύντομη ενημέρωση και λήψη σημαντικών οδηγιών, όχι για εξάντληση μπαταρίας σε μη ουσιαστική κίνηση.\n\n## Κλείσε τα προσωρινά συστήματα οργανωμένα\nΣταμάτησε γεννήτριες ή μπαταριακές διατάξεις με τις ασφαλείς διαδικασίες τους, αφαίρεσε προσωρινά καλώδια, καθάρισε εφεδρικές λύσεις υγιεινής και επέστρεψε εφόδια στην κανονική θέση μόνο όταν η βασική υπηρεσία είναι αξιόπιστη. Ένα προσωρινό σύστημα που μένει μισοσυνδεδεμένο γίνεται μελλοντικός κίνδυνος.\n\n## Κατέγραψε τον πραγματικό χρόνο αποκατάστασης\nΣημείωσε πότε κάθε υπηρεσία έγινε σταθερή και όχι την πρώτη στιγμή που «αναβόσβησε». Αυτό βοηθά στον υπολογισμό έκθεσης τροφίμων, χρήσης μπαταριών και πραγματικής διάρκειας για την ανασκόπηση.\n\nΚωδικοί τεκμηρίωσης: POWER-1, EPA-WATER-1, READY-PLAN-1."}},{"id":84,"en":{"title":"Freeze, pipes and winter water damage: prevent secondary flooding during cold outages","body":"## Loss of heat can become a plumbing incident\nProlonged freezing conditions may affect exposed plumbing, especially in unheated or poorly insulated areas. Know which parts of the property are vulnerable and who is qualified to manage them. Follow local building/utility guidance for winterization rather than improvising with open flames or unsafe heaters.\n\n## Watch for reduced flow and visible frost carefully\nA change in water flow can indicate a developing problem, but do not heat a pipe with a torch or other open flame. Keep combustible heating devices away from building materials. If a pipe location is hidden, inaccessible or near electrical hazards, use a professional.\n\n## A frozen pipe can leak when it thaws\nThe absence of water on the floor while everything is frozen does not prove the pipe is intact. Know the safe water shutoff location and inspect during thaw/restoration. Be ready to isolate the water if a leak appears, provided access is safe and the household knows the correct control.\n\n## Protect drinking-water continuity separately\nA plumbing failure may cut normal water even when the utility is functioning. Maintain stored potable water and do not drink water contaminated by contact with building materials, floodwater or chemicals. If utility pressure is lost or an advisory is issued, follow the official water guidance.\n\n## Dry building materials promptly after a leak\nOnce safe, remove standing water and begin drying according to cleanup guidance to reduce mold/moisture damage. Electrical systems exposed to water require qualified assessment. Photograph damage before major removal when safe.\n\n## Learn from the cold spots\nAfter recovery, record the section that froze, outdoor/indoor conditions and which protective measures failed. Improve insulation, heating continuity or shutoff/winterization planning during normal weather rather than waiting for the next freeze.\n\nEvidence IDs: READY-WINTER-1, CLEANUP-1, EPA-WATER-1."},"el":{"title":"Πάγος, σωληνώσεις και χειμερινές ζημιές νερού: πρόλαβε δευτερογενή πλημμύρα σε ψυχρή διακοπή","body":"## Η απώλεια θέρμανσης μπορεί να γίνει υδραυλικό συμβάν\nΠαρατεταμένος παγετός μπορεί να επηρεάσει εκτεθειμένες σωληνώσεις, ιδιαίτερα σε μη θερμαινόμενους ή ανεπαρκώς μονωμένους χώρους. Γνώρισε ποια τμήματα είναι ευάλωτα και ποιος είναι αρμόδιος να τα διαχειριστεί. Ακολούθησε τοπική τεχνική/υπηρεσιακή καθοδήγηση για χειμερινή προστασία αντί για φλόγες ή μη ασφαλείς θερμαντήρες.\n\n## Πρόσεξε αλλαγή ροής και εμφανή πάγο\nΜειωμένη ροή μπορεί να δείχνει πρόβλημα, αλλά μην θερμαίνεις σωλήνα με φλόγιστρο ή άλλη γυμνή φλόγα. Κράτησε θερμαντικές συσκευές μακριά από καύσιμα δομικά υλικά. Αν ο σωλήνας είναι κρυφός, δυσπρόσιτος ή κοντά σε ηλεκτρικό κίνδυνο, χρησιμοποίησε επαγγελματία.\n\n## Παγωμένος σωλήνας μπορεί να διαρρεύσει όταν ξεπαγώσει\nΤο ότι δεν φαίνεται νερό στο πάτωμα όσο όλα είναι παγωμένα δεν αποδεικνύει ότι ο σωλήνας είναι άθικτος. Γνώρισε την ασφαλή κύρια διακοπή νερού και επιθεώρησε κατά την απόψυξη/επαναφορά. Αν εμφανιστεί διαρροή, να είσαι έτοιμος να απομονώσεις την παροχή μόνο εφόσον η πρόσβαση είναι ασφαλής και γνωρίζεις τον σωστό χειρισμό.\n\n## Η συνέχεια πόσιμου νερού είναι ξεχωριστή ανάγκη\nΥδραυλική βλάβη μπορεί να κόψει το νερό ενώ το δημόσιο δίκτυο λειτουργεί. Διατήρησε αποθηκευμένο πόσιμο και μην καταναλώνεις νερό που ήρθε σε επαφή με δομικά υλικά, πλημμύρα ή χημικά. Αν χαθεί πίεση δικτύου ή εκδοθεί ανακοίνωση, ακολούθησε τις επίσημες οδηγίες.\n\n## Στέγνωσε γρήγορα μετά τη διαρροή\nΌταν είναι ασφαλές, απομάκρυνε στάσιμο νερό και ξεκίνησε ξήρανση σύμφωνα με οδηγίες αποκατάστασης για περιορισμό μούχλας και υγρασίας. Ηλεκτρικά συστήματα που βράχηκαν χρειάζονται αρμόδιο έλεγχο. Φωτογράφισε ζημιά πριν από σημαντική αφαίρεση όπου είναι ασφαλές.\n\n## Μάθε από τα ψυχρά σημεία\nΜετά την αποκατάσταση κατέγραψε ποιο τμήμα πάγωσε, συνθήκες έξω/μέσα και ποιο μέτρο απέτυχε. Βελτίωσε μόνωση, συνέχεια θέρμανσης ή σχέδιο χειμερινής διακοπής σε κανονικό καιρό και όχι όταν ξαναέρθει ο παγετός.\n\nΚωδικοί τεκμηρίωσης: READY-WINTER-1, CLEANUP-1, EPA-WATER-1."}},{"id":85,"en":{"title":"Portable heating during an outage: warmth cannot come at the cost of fire or carbon monoxide","body":"## Identify the heater type before deciding where it can operate\nElectric heaters require a power source/circuit capable of the load. Fuel-burning heaters have ventilation, fuel and carbon-monoxide implications and some are not approved for indoor use. Follow the exact manufacturer and local fire-safety instructions; do not generalize rules from one heater to another.\n\n## Keep combustion equipment out of sleeping improvisation\nNever bring outdoor cooking or generator equipment indoors for heat. Carbon monoxide is invisible and odorless. A CO alarm is essential protection where combustion appliances are legitimately used, but it does not make prohibited indoor operation safe.\n\n## Control clearance and stability\nKeep portable heaters on stable surfaces with the manufacturer-required clearance from bedding, curtains, clothing, paper and furniture. Do not dry wet clothes directly over them. Route cords so they are not crushed, covered by rugs or placed across exits.\n\n## Heat people and a zone, not the whole building\nDuring limited power, a smaller occupied room may be easier to keep tolerable than the entire house, provided ventilation, fire separation and escape remain safe. Combine appropriate clothing and bedding so the heater does not carry the full load.\n\n## Watch vulnerable occupants\nOlder adults, infants and people with health conditions may need a narrower safe temperature range. Have an early relocation trigger if the home cannot remain safe. Do not wait for severe cold symptoms before seeking a warmer location.\n\n## Shutdown is part of use\nTurn off/secure portable heat before leaving the room or sleeping unless the device is explicitly designed and approved for that unattended mode. Inspect after the outage for damaged cords, soot, unusual odor or fuel leaks before returning it to storage.\n\nEvidence IDs: READY-WINTER-1, CDC-CO-1, READY-FIRE-1."},"el":{"title":"Φορητή θέρμανση σε διακοπή: η ζέστη δεν δικαιολογεί κίνδυνο φωτιάς ή μονοξειδίου","body":"## Αναγνώρισε τον τύπο συσκευής πριν αποφασίσεις πού λειτουργεί\nΗλεκτρικός θερμαντήρας απαιτεί πηγή και κύκλωμα κατάλληλο για το φορτίο. Συσκευές καύσης έχουν απαιτήσεις αερισμού, καυσίμου και μονοξειδίου, ενώ ορισμένες δεν επιτρέπονται σε εσωτερικό χώρο. Ακολούθησε το συγκεκριμένο εγχειρίδιο και την τοπική πυρασφάλεια· μην μεταφέρεις κανόνες από ένα μοντέλο σε άλλο.\n\n## Μην μετατρέπεις εξοπλισμό εξωτερικού χώρου σε θέρμανση ύπνου\nΠοτέ μην φέρνεις εξωτερικές εστίες ή γεννήτριες μέσα για θέρμανση. Το μονοξείδιο του άνθρακα δεν φαίνεται και δεν μυρίζει. Ανιχνευτής CO είναι ουσιαστική προστασία όπου νόμιμα λειτουργεί συσκευή καύσης, αλλά δεν κάνει ασφαλή μια χρήση που απαγορεύεται σε κλειστό χώρο.\n\n## Έλεγξε απόσταση και σταθερότητα\nΤοποθέτησε τον θερμαντήρα σε σταθερή επιφάνεια και με τις αποστάσεις του κατασκευαστή από κλινοσκεπάσματα, κουρτίνες, ρούχα, χαρτί και έπιπλα. Μην στεγνώνεις βρεγμένα ρούχα πάνω του. Πέρασε καλώδια χωρίς σύνθλιψη, χαλιά ή κλείσιμο εξόδων.\n\n## Θέρμανε ανθρώπους και μία ζώνη, όχι όλο το κτίριο\nΜε περιορισμένη ισχύ, μικρότερος κατοικημένος χώρος μπορεί να διατηρείται ευκολότερα αν αερισμός, πυρασφάλεια και έξοδος παραμένουν σωστά. Συνδύασε κατάλληλα ρούχα και κλινοσκεπάσματα ώστε η συσκευή να μην είναι η μοναδική άμυνα απέναντι στο κρύο.\n\n## Πρόσεξε ευάλωτους ανθρώπους\nΗλικιωμένοι, βρέφη και άτομα με παθήσεις μπορεί να χρειάζονται στενότερα ασφαλή θερμοκρασιακά όρια. Καθόρισε νωρίς πότε μετακινείσαι σε θερμότερο χώρο. Μην περιμένεις σοβαρά συμπτώματα ψύχους για να αλλάξεις σχέδιο.\n\n## Η απενεργοποίηση είναι μέρος της χρήσης\nΣβήσε και ασφάλισε φορητή θέρμανση πριν φύγεις ή κοιμηθείς, εκτός αν η συσκευή είναι ρητά σχεδιασμένη και εγκεκριμένη για τέτοια λειτουργία. Μετά τη διακοπή έλεγξε καλώδια, αιθάλη, οσμές ή διαρροές καυσίμου πριν την αποθήκευση.\n\nΚωδικοί τεκμηρίωσης: READY-WINTER-1, CDC-CO-1, READY-FIRE-1."}},{"id":86,"en":{"title":"Extreme heat indoors: use a cooling hierarchy before the building becomes unsafe","body":"## Start with people at highest risk\nOlder adults, infants, pregnant people, outdoor workers and people with certain medical conditions or medicines can be more vulnerable to heat. Identify them before the hottest period and schedule check-ins. Follow clinician advice for individual conditions and medication storage.\n\n## Reduce heat gain first\nShade sun-exposed windows where safe, close off hotter unused zones and reduce unnecessary heat-producing appliances. Ventilate when outside air is cooler/safer and close the building when outside conditions are hotter or smoky, according to the actual hazard. A wildfire-smoke day may require different ventilation choices than a clean-air heatwave.\n\n## Use available electricity strategically\nFans can improve comfort in some conditions but are not a substitute for effective cooling during dangerous heat. If air conditioning is available on limited backup power, prioritize a small occupied zone and calculate the energy reserve. Do not run a generator indoors to power cooling.\n\n## Protect drinking water and medication\nMaintain safe fluids and easy access. Some medicines can affect heat tolerance or have storage requirements; CDC advises people to discuss heat/medication concerns with clinicians rather than changing medicines on their own. Move temperature-sensitive medicine according to professional/product guidance.\n\n## Know the relocation trigger\nIf the indoor environment cannot be kept safe, use an official cooling center, trusted air-conditioned location or other safer shelter. Plan accessible transport and pet/service-animal needs before the peak. Relocation is a control measure, not a preparedness failure.\n\n## Treat severe heat illness as urgent\nConfusion, loss of consciousness or other signs of severe heat illness require emergency action. Follow current public-health/emergency guidance. The household planner should focus on prevention, early recognition and getting professional help.\n\nEvidence IDs: HEAT-MED-1, READY-OLDER-1, READY-DISABILITY-1."},"el":{"title":"Ακραία ζέστη σε εσωτερικό χώρο: ιεράρχηση ψύξης πριν το κτίριο γίνει μη ασφαλές","body":"## Ξεκίνα από όσους έχουν μεγαλύτερο κίνδυνο\nΗλικιωμένοι, βρέφη, έγκυες, εργαζόμενοι έξω και άτομα με ορισμένες παθήσεις ή φάρμακα μπορεί να είναι πιο ευάλωτοι στη ζέστη. Εντόπισέ τους πριν από τις πιο θερμές ώρες και όρισε check-in. Για εξατομικευμένες παθήσεις και αποθήκευση φαρμάκων ακολούθησε τον θεράποντα.\n\n## Μείωσε πρώτα την είσοδο θερμότητας\nΣκίασε ηλιόλουστα παράθυρα όπου είναι ασφαλές, κλείσε θερμότερους αχρησιμοποίητους χώρους και μείωσε συσκευές που παράγουν θερμότητα. Αέρισε όταν ο εξωτερικός αέρας είναι ψυχρότερος και ασφαλής και κλείσε το κτίριο όταν έξω είναι θερμότερα ή υπάρχει καπνός, ανάλογα με τον πραγματικό κίνδυνο. Η μέρα με καπνό πυρκαγιάς απαιτεί διαφορετικές επιλογές από έναν καύσωνα με καθαρό αέρα.\n\n## Χρησιμοποίησε στρατηγικά την διαθέσιμη ενέργεια\nΟι ανεμιστήρες μπορούν να αυξήσουν την άνεση σε ορισμένες συνθήκες αλλά δεν αντικαθιστούν αποτελεσματική ψύξη σε επικίνδυνη ζέστη. Αν υπάρχει κλιματισμός με περιορισμένη εφεδρική ισχύ, δώσε προτεραιότητα σε μικρή κατοικημένη ζώνη και υπολόγισε την αυτονομία. Μην λειτουργείς γεννήτρια μέσα στο κτίριο για να τροφοδοτήσεις ψύξη.\n\n## Προστάτευσε πόσιμο νερό και φάρμακα\nΔιατήρησε ασφαλή υγρά σε εύκολη πρόσβαση. Ορισμένα φάρμακα μπορεί να επηρεάζουν την αντοχή στη ζέστη ή να έχουν απαιτήσεις αποθήκευσης· το CDC συστήνει συζήτηση με κλινικό επαγγελματία αντί για αυθαίρετη αλλαγή φαρμάκου. Μετακίνησε θερμοευαίσθητα φάρμακα μόνο σύμφωνα με επαγγελματική ή κατασκευαστική καθοδήγηση.\n\n## Γνώρισε το όριο μετακίνησης\nΑν δεν μπορεί να διατηρηθεί ασφαλές εσωτερικό περιβάλλον, χρησιμοποίησε επίσημο κέντρο δροσιάς, αξιόπιστο κλιματιζόμενο χώρο ή άλλο ασφαλέστερο καταφύγιο. Προγραμμάτισε προσβάσιμη μεταφορά και ανάγκες ζώων πριν την κορύφωση. Η μετακίνηση είναι μέτρο ελέγχου και όχι αποτυχία προετοιμασίας.\n\n## Η σοβαρή θερμική νόσηση είναι επείγουσα\nΣύγχυση, απώλεια συνείδησης ή άλλα σημάδια σοβαρής θερμικής νόσησης απαιτούν επείγουσα δράση. Ακολούθησε τις τρέχουσες οδηγίες δημόσιας υγείας και υπηρεσιών. Ο οικιακός σχεδιασμός εστιάζει στην πρόληψη, έγκαιρη αναγνώριση και πρόσβαση σε επαγγελματική βοήθεια.\n\nΚωδικοί τεκμηρίωσης: HEAT-MED-1, READY-OLDER-1, READY-DISABILITY-1."}},{"id":87,"en":{"title":"Cooling or warming center route plan: make public sheltering reachable before it is needed","body":"## A listed center is not automatically usable for your household\nVerify opening status, hours, accessibility, transport, pet/service-animal policy and whether registration or identification is needed. Official centers can change during an event; use current authority information rather than an old saved address alone.\n\n## Build a primary and backup\nChoose at least two plausible destinations in different directions when geography permits. Record offline directions and approximate travel time. If one route passes through a flood-prone underpass, wildfire corridor or steep icy road, identify the alternative beforehand.\n\n## Plan the last kilometre\nA bus stop several blocks away may be impractical for an older adult, wheelchair user or person carrying medical equipment in extreme weather. Include the door-to-door segment, lift/elevator dependency and who can assist. Arrange a buddy or accessible transport contact early.\n\n## Carry the arrival module\nBring identification as required, essential medicines, medical/accessibility information, charging cable, drinking water/snack if appropriate, and a small comfort layer. Do not move the entire household stock when the center is intended as temporary temperature refuge.\n\n## Keep departure triggers conservative\nDo not wait until someone is already ill from heat/cold to begin a difficult trip. Use forecasts, official warnings, indoor temperature trend and the person’s care plan to decide earlier. If emergency symptoms are present, seek emergency medical help rather than treating the center as a clinic.\n\n## Reconfirm before travel\nCall/check official channels when possible to verify the facility is still operating. Record the time of confirmation. During a widespread event, capacity or location may change.\n\nEvidence IDs: READY-SHELTER-1, READY-OLDER-1, READY-DISABILITY-1."},"el":{"title":"Σχέδιο διαδρομής προς κέντρο δροσιάς ή θέρμανσης: κάνε τη δημόσια προστασία πραγματικά προσβάσιμη","body":"## Ένα καταχωρημένο κέντρο δεν είναι αυτόματα κατάλληλο για το νοικοκυριό\nΕπιβεβαίωσε λειτουργία, ώρες, προσβασιμότητα, μεταφορά, πολιτική για κατοικίδια/ζώα υπηρεσίας και αν απαιτείται εγγραφή ή ταυτοποίηση. Τα επίσημα κέντρα μπορεί να αλλάξουν μέσα στο συμβάν· χρησιμοποίησε τρέχουσα ενημέρωση της αρμόδιας αρχής και όχι μόνο μια παλιά αποθηκευμένη διεύθυνση.\n\n## Κύρια και εφεδρική επιλογή\nΔιάλεξε τουλάχιστον δύο πιθανούς προορισμούς σε διαφορετικές κατευθύνσεις όπου το επιτρέπει η γεωγραφία. Κράτησε offline οδηγίες και εκτιμώμενο χρόνο. Αν μια διαδρομή περνά από πλημμυρική υπόγεια διάβαση, διάδρομο πυρκαγιάς ή απότομο παγωμένο δρόμο, όρισε εναλλακτική πριν χρειαστεί.\n\n## Σχεδίασε το τελευταίο χιλιόμετρο\nΣτάση λεωφορείου μερικά τετράγωνα μακριά μπορεί να είναι αδύνατη για ηλικιωμένο, χρήστη αμαξιδίου ή άτομο με ιατρικό εξοπλισμό σε ακραίο καιρό. Συμπερίλαβε τη διαδρομή από πόρτα σε πόρτα, εξάρτηση από ανελκυστήρα και ποιος βοηθά. Οργάνωσε έγκαιρα «buddy» ή προσβάσιμη μεταφορά.\n\n## Μικρό πακέτο άφιξης\nΠάρε ταυτοποίηση όπου απαιτείται, απαραίτητα φάρμακα, πληροφορίες υγείας/προσβασιμότητας, καλώδιο φόρτισης, νερό ή μικρό σνακ όπου ενδείκνυται και ένα στρώμα άνεσης. Μην μεταφέρεις όλη την οικιακή αποθήκη όταν ο χώρος προορίζεται για προσωρινή προστασία από θερμοκρασία.\n\n## Συντηρητικά όρια αναχώρησης\nΜην περιμένεις να αρρωστήσει ήδη κάποιος από ζέστη ή κρύο πριν ξεκινήσει δύσκολη μετακίνηση. Χρησιμοποίησε πρόγνωση, επίσημες προειδοποιήσεις, τάση εσωτερικής θερμοκρασίας και σχέδιο φροντίδας για πιο έγκαιρη απόφαση. Σε επείγοντα συμπτώματα χρειάζεται ιατρική βοήθεια και όχι αντιμετώπιση του κέντρου ως κλινικής.\n\n## Επιβεβαίωσε ξανά πριν φύγεις\nΌπου γίνεται, τηλεφώνησε ή έλεγξε επίσημο κανάλι ώστε να ξέρεις ότι η δομή εξακολουθεί να λειτουργεί. Κατέγραψε ώρα επιβεβαίωσης. Σε ευρεία διαταραχή μπορεί να αλλάξει θέση ή χωρητικότητα.\n\nΚωδικοί τεκμηρίωσης: READY-SHELTER-1, READY-OLDER-1, READY-DISABILITY-1."}},{"id":88,"en":{"title":"Wildfire ash cleanup: wait for clearance and control dust instead of redistributing it","body":"## Ash is not ordinary household dust\nWildfire ash can contain fine particles and residues from burned buildings, vehicles and household materials. Follow local public-health/fire guidance for the affected area. Children, pets and people with respiratory or cardiovascular vulnerability should be kept away from ash cleanup where possible.\n\n## Do not create airborne dust\nAvoid dry sweeping, leaf blowers or activities that aggressively resuspend ash. Use cleanup methods recommended by health/environment authorities for the incident and suitable protective equipment. Do not wash large amounts of ash into storm drains or water bodies unless local guidance permits it.\n\n## Protect food and water\nDiscard food or water that authorities say has been contaminated and keep clean supplies covered during cleanup. Outdoor water tanks/catchments exposed to heavy ash require assessment before drinking use. Boiling water does not remove chemical contamination from burned materials.\n\n## Inspect the building first\nFire can damage roofs, decks, trees, utility lines and hidden structural elements even when a house remains standing. Do not climb onto damaged roofs or enter unstable structures to remove ash. Treat damaged solar/electrical systems and propane/fuel equipment as specialist hazards.\n\n## Keep dirty and clean zones separate\nRemove outer cleanup clothing before entering the main living/sleep area, wash hands and control ash on footwear. Bag heavily contaminated debris according to local waste instructions. Protect HVAC equipment/filters according to manufacturer/public-health guidance.\n\n## Document and follow official disposal rules\nPhotograph affected areas before cleanup when safe. Some ash/debris from burned structures may be regulated differently from green-waste ash. Use the municipality/authority’s collection and disposal instructions rather than dumping it with ordinary waste by assumption.\n\nEvidence IDs: GR-FIRE-1, CDC-DISASTER-1, CLEANUP-1."},"el":{"title":"Καθαρισμός στάχτης μετά από δασική πυρκαγιά: περίμενε άδεια και έλεγξε τη σκόνη αντί να τη διασπείρεις","body":"## Η στάχτη δεν είναι συνηθισμένη οικιακή σκόνη\nΜπορεί να περιέχει λεπτά σωματίδια και υπολείμματα από καμένα κτίρια, οχήματα και οικιακά υλικά. Ακολούθησε την τοπική υγειονομική και πυροσβεστική καθοδήγηση για την περιοχή. Παιδιά, ζώα και άτομα με αναπνευστική ή καρδιαγγειακή ευαλωτότητα καλό είναι να μένουν μακριά από εργασίες στάχτης όπου γίνεται.\n\n## Μην δημιουργείς αιωρούμενη σκόνη\nΑπόφυγε στεγνό σκούπισμα, φυσητήρες φύλλων ή έντονη δραστηριότητα που ξανασηκώνει στάχτη. Χρησιμοποίησε μεθόδους που προτείνουν οι υγειονομικές/περιβαλλοντικές αρχές για το συγκεκριμένο συμβάν και κατάλληλα μέσα προστασίας. Μην ξεπλένεις μεγάλες ποσότητες σε φρεάτια ή υδάτινα σώματα χωρίς σχετική τοπική οδηγία.\n\n## Προστάτευσε τρόφιμα και νερό\nΑπόρριψε τρόφιμα ή νερό που οι Αρχές θεωρούν μολυσμένα και κράτησε καθαρά εφόδια κλειστά κατά τον καθαρισμό. Εξωτερικές δεξαμενές ή συλλογές νερού με σημαντική στάχτη χρειάζονται αξιολόγηση πριν από πόση. Το βράσιμο δεν απομακρύνει χημική ρύπανση από καμένα υλικά.\n\n## Επιθεώρησε πρώτα το κτίριο\nΗ φωτιά μπορεί να έχει βλάψει στέγη, μπαλκόνια, δέντρα, γραμμές παροχής και κρυφά δομικά στοιχεία ακόμη κι αν το σπίτι στέκεται. Μην ανεβαίνεις σε κατεστραμμένη στέγη και μην μπαίνεις σε ασταθή χώρο για απομάκρυνση στάχτης. Κατεστραμμένα φωτοβολταϊκά/ηλεκτρικά και συστήματα καυσίμου είναι ειδικοί κίνδυνοι.\n\n## Χώρισε βρόμικη και καθαρή ζώνη\nΑφαίρεσε εξωτερικά ρούχα καθαρισμού πριν μπεις στην κύρια ζώνη διαβίωσης ή ύπνου, πλύνε χέρια και έλεγξε τη στάχτη στα παπούτσια. Συσκεύασε βαριά μολυσμένα υπολείμματα σύμφωνα με τις τοπικές οδηγίες αποβλήτων. Προστάτευσε φίλτρα και συστήματα αέρα σύμφωνα με τον κατασκευαστή και τη δημόσια υγεία.\n\n## Τεκμηρίωση και επίσημη διάθεση\nΦωτογράφισε ασφαλείς περιοχές πριν από τον καθαρισμό. Στάχτη και συντρίμμια από καμένες κατασκευές μπορεί να αντιμετωπίζονται διαφορετικά από απλή φυτική στάχτη. Ακολούθησε τις οδηγίες δήμου/αρμόδιας Αρχής για συλλογή και διάθεση και όχι μια υπόθεση ότι είναι κοινά σκουπίδια.\n\nΚωδικοί τεκμηρίωσης: GR-FIRE-1, CDC-DISASTER-1, CLEANUP-1."}},{"id":89,"en":{"title":"Flood drying and moisture triage: remove water, decide what can dry, and stop hidden dampness","body":"## Re-entry safety comes first\nDo not start drying a building until structural, electrical, gas/fuel and contamination hazards are addressed. Floodwater can contain sewage and chemicals. Use current cleanup guidance and professional help for major contamination, structural damage or extensive mold.\n\n## Stop the source\nDrying cannot succeed while rain, pipe leakage, groundwater or roof damage continues. Identify and control the incoming water when safe. Separate clean rainwater damage from sewage/flood contamination because salvage decisions differ.\n\n## Prioritize time-sensitive materials\nStanding water and wet porous materials can support microbial growth. Remove water safely, increase drying/ventilation when outdoor air conditions permit, and expose hidden wet areas where this can be done without damaging structural/safety systems. Large soaked insulation, wall assemblies and flooring may need professional assessment.\n\n## Measure progress instead of judging the surface\nA wall can feel dry outside while remaining wet internally. Use moisture measurements if available and compare to known-dry areas/material guidance. Record rooms and dates. Do not close walls or reinstall finishes merely because visible water disappeared.\n\n## Avoid contaminating the clean zone\nTools, footwear and clothing from flood cleanup remain on the dirty side until cleaned. Protect unaffected rooms from dust and demolition debris. Keep food preparation and sleeping away from active contaminated cleanup.\n\n## Know when the job exceeds household scale\nExtensive sewage exposure, structural damage, large mold growth, hazardous materials or inability to dry the building promptly justify professional remediation/public-health guidance. The objective is a dry, safe structure—not merely a room that looks cleaner.\n\nEvidence IDs: CLEANUP-1, GR-FLOOD-1, CDC-DISASTER-1."},"el":{"title":"Ξήρανση μετά από πλημμύρα: απομάκρυνε νερό, ιεράρχησε υλικά και σταμάτησε την κρυφή υγρασία","body":"## Η ασφαλής επανείσοδος προηγείται\nΜην ξεκινάς ξήρανση πριν αντιμετωπιστούν δομικοί, ηλεκτρικοί, αερίου/καυσίμου και μολυσματικοί κίνδυνοι. Πλημμυρικό νερό μπορεί να περιέχει λύματα και χημικά. Ακολούθησε τις τρέχουσες οδηγίες καθαρισμού και χρησιμοποίησε επαγγελματική βοήθεια σε μεγάλη ρύπανση, δομική ζημιά ή εκτεταμένη μούχλα.\n\n## Σταμάτησε την πηγή\nΗ ξήρανση δεν λειτουργεί όσο συνεχίζονται βροχή, διαρροή σωλήνα, υπόγεια νερά ή ζημιά στέγης. Εντόπισε και έλεγξε την είσοδο όταν είναι ασφαλές. Ξεχώρισε καθαρό νερό βροχής από λύματα ή πλημμύρα επειδή οι αποφάσεις διάσωσης υλικών διαφέρουν.\n\n## Προτεραιότητα στα χρονικά ευαίσθητα υλικά\nΣτάσιμο νερό και βρεγμένα πορώδη υλικά ευνοούν μικροβιακή ανάπτυξη. Απομάκρυνε νερό με ασφάλεια, αύξησε ξήρανση και αερισμό όταν ο εξωτερικός αέρας το επιτρέπει και αποκάλυψε κρυφές υγρές ζώνες μόνο χωρίς να παραβιάζεις δομικά/ασφαλιστικά συστήματα. Μεγάλη ποσότητα βρεγμένης μόνωσης, τοίχων ή δαπέδων μπορεί να χρειάζεται επαγγελματική αξιολόγηση.\n\n## Μέτρησε πρόοδο και όχι μόνο την επιφάνεια\nΈνας τοίχος μπορεί να φαίνεται στεγνός εξωτερικά και να κρατά υγρασία μέσα. Χρησιμοποίησε μετρήσεις όπου υπάρχουν και σύγκρινε με γνωστό στεγνό υλικό και τεχνική καθοδήγηση. Κατέγραψε δωμάτια και ημερομηνίες. Μην κλείνεις ξανά τοίχους ή τελειώματα επειδή εξαφανίστηκε το ορατό νερό.\n\n## Μην μεταφέρεις τη ρύπανση στην καθαρή ζώνη\nΕργαλεία, παπούτσια και ρούχα καθαρισμού μένουν στη βρόμικη πλευρά μέχρι να καθαριστούν. Προστάτευσε ανεπηρέαστα δωμάτια από σκόνη και υλικά κατεδάφισης. Κράτησε φαγητό και ύπνο μακριά από ενεργό μολυσμένο καθαρισμό.\n\n## Αναγνώρισε πότε το έργο ξεπερνά το νοικοκυριό\nΕκτεταμένα λύματα, δομική ζημιά, μεγάλη ανάπτυξη μούχλας, επικίνδυνα υλικά ή αδυναμία γρήγορης ξήρανσης δικαιολογούν επαγγελματική αποκατάσταση και υγειονομική καθοδήγηση. Στόχος είναι στεγνή και ασφαλής κατασκευή και όχι απλώς πιο καθαρή εμφάνιση.\n\nΚωδικοί τεκμηρίωσης: CLEANUP-1, GR-FLOOD-1, CDC-DISASTER-1."}},{"id":90,"en":{"title":"Earthquake falling hazards and contents: reduce what can injure people before the shaking","body":"## Nonstructural hazards cause real injuries\nShelves, televisions, mirrors, cabinets, water heaters, lighting and stored objects can fall or move during shaking even when the main structure remains standing. Walk through sleeping areas, exits and frequently occupied spaces and identify heavy items above head level or along evacuation paths.\n\n## Secure with methods suitable for the object and building\nUse appropriate anchoring/restraint products and follow manufacturer/building guidance. A weak improvised tie may create false confidence or damage the wall. Renters should follow lease/building requirements and seek approved methods rather than drilling critical assemblies blindly.\n\n## Put heavy items low\nStore dense containers, tools and large supplies on lower shelves. Use latches where suitable so cabinets do not release contents into walkways. Keep glass and heavy decoration away from beds/sofas when possible.\n\n## Protect the post-shaking route\nAfter an earthquake, expect broken glass and fallen objects. Keep sturdy shoes and a light near sleeping areas. Do not rush into dark corridors. Follow Greek Civil Protection guidance for aftershocks and building evacuation; do not use elevators where instructions advise stairs.\n\n## Recheck after every meaningful shake\nAn anchor, shelf or cabinet may be loosened even if it did not fall. Do not stand beneath visibly displaced heavy objects to inspect them. Isolate unsafe rooms and use qualified assessment for structural concerns.\n\n## Feed the inspection into preparedness\nPhotograph the normal arrangement and note corrected hazards. After an incident, record which objects moved. This is one of the easiest areas where a household can convert a real observation into a concrete prevention change.\n\nEvidence IDs: GR-EQ-1, READY-PLAN-1."},"el":{"title":"Πτώση αντικειμένων σε σεισμό: μείωσε ό,τι μπορεί να τραυματίσει πριν αρχίσει η δόνηση","body":"## Οι μη δομικοί κίνδυνοι προκαλούν πραγματικούς τραυματισμούς\nΡάφια, τηλεοράσεις, καθρέφτες
